<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>플레이 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-main:#191B1D;
    --bg-surface:#232527;
    --bg-hover:#393B3D;
    --bg-elevated:#2A2C2E;
    --text-primary:#FFFFFF;
    --text-secondary:#A1A8AD;
    --text-disabled:#656B70;
    --accent-green:#00B06F;
    --accent-green-hover:#00C853;
    --accent-blue:#00A2FF;
    --divider:#2F3136;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; min-height:100%; background:var(--bg-main); }
  body {
    font-family:'Noto Sans KR', -apple-system, 'Malgun Gothic', 'Helvetica Neue', sans-serif;
    font-weight:500;
    color:var(--text-primary);
    min-height:100vh;
    padding-bottom:78px; /* 하단 탭바 공간 */
  }
  svg { display:block; }

  /* ---------- 상단바 ---------- */
  #topbar {
    position:sticky; top:0; z-index:20;
    height:54px; background:var(--bg-surface);
    border-bottom:1px solid var(--divider);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 12px;
  }
  .brand { display:flex; align-items:center; gap:8px; }
  .brandMark {
    width:30px; height:30px; border-radius:8px;
    background:linear-gradient(135deg, var(--accent-green), #087a4d);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:900; color:#fff;
  }
  .brandName { font-size:18px; font-weight:900; letter-spacing:.1px; }

  .topIcons { display:flex; align-items:center; gap:6px; }
  .iconBtn {
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-primary); background:transparent;
    border:none; cursor:pointer;
  }
  .iconBtn:active { background:var(--bg-hover); }

  /* ---------- 검색 모드 ---------- */
  #topbar.searching .brand,
  #topbar.searching .searchTrigger,
  #topbar.searching .coinBadge,
  #topbar.searching .avatar { display:none; }
  #searchBar {
    display:none; align-items:center; gap:8px;
    flex:1; height:38px;
    background:var(--bg-main); border:1px solid var(--divider); border-radius:19px;
    padding:0 6px 0 12px;
  }
  #topbar.searching #searchBar { display:flex; }
  #searchBackBtn {
    width:30px; height:30px; border-radius:50%; border:none; background:none;
    color:var(--text-primary); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  #searchInput {
    flex:1; min-width:0; height:100%; background:none; border:none; outline:none;
    color:var(--text-primary); font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:14px;
  }
  #searchInput::placeholder { color:var(--text-disabled); font-weight:500; }
  #searchClearBtn {
    width:26px; height:26px; border-radius:50%; border:none; background:var(--bg-hover);
    color:var(--text-secondary); font-size:12px; display:none; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  #searchInput:not(:placeholder-shown) ~ #searchClearBtn { display:flex; }

  #emptyState { display:none; flex-direction:column; align-items:center; gap:10px; padding:60px 20px; text-align:center; }
  #emptyState.show { display:flex; }
  #emptyState .emoji { font-size:34px; }
  #emptyState .msg { font-size:13px; font-weight:700; color:var(--text-secondary); }
  #emptyState .sub { font-size:11.5px; color:var(--text-disabled); }

  .card.filteredOut { display:none; }

  .coinBadge {
    display:flex; align-items:center; gap:5px;
    background:var(--bg-main); border:1px solid var(--divider);
    padding:6px 10px; border-radius:16px;
    font-size:12.5px; font-weight:800; color:var(--text-primary);
    margin-left:2px;
  }
  .avatar {
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg,#5a5f63,#33363a);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; border:1px solid var(--divider);
    margin-left:4px;
  }

  /* ---------- 메인 ---------- */
  main { max-width:720px; margin:0 auto; padding:16px 12px 0; }

  .sectionHead { display:flex; align-items:baseline; justify-content:space-between; margin:16px 4px 12px; }
  .sectionTitle { font-size:18px; font-weight:900; color:var(--text-primary); }
  .sectionMore { font-size:12px; font-weight:700; color:var(--accent-blue); }

  /* ---------- 친구 스토리 행 ---------- */
  #friendsRow {
    display:flex; gap:14px; overflow-x:auto; padding:14px 12px 6px;
    scrollbar-width:none;
  }
  #friendsRow::-webkit-scrollbar { display:none; }
  .friendItem {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    flex:none; width:60px; cursor:pointer;
  }
  .friendCircleWrap { position:relative; width:56px; height:56px; }
  .friendCircle {
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,#5a5f63,#33363a);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; border:2.5px solid var(--divider);
    box-sizing:border-box;
  }
  .friendCircle.online { border-color:#00E676; }
  .onlineDot {
    position:absolute; right:0; bottom:0; width:15px; height:15px;
    border-radius:50%; background:var(--text-disabled);
    border:2.5px solid var(--bg-main);
  }
  .onlineDot.on { background:#00E676; }
  .friendName {
    font-size:10.5px; font-weight:700; color:var(--text-secondary);
    max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .friendGame {
    font-size:9px; font-weight:800; color:#00E676;
    max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .addFriendCircle {
    width:56px; height:56px; border-radius:50%;
    background:var(--bg-surface); border:2px dashed var(--divider);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:900; color:var(--text-secondary);
    cursor:pointer; flex:none;
  }
  .addFriendCircle:active { background:var(--bg-hover); }

  /* ---------- 친구 검색 오버레이 ---------- */
  #friendSearchOverlay {
    position:fixed; inset:0; z-index:60; display:none; flex-direction:column;
    background:var(--bg-main);
  }
  #friendSearchOverlay.show { display:flex; }
  #fsTopbar {
    height:54px; flex:none; display:flex; align-items:center; gap:10px;
    padding:0 12px; border-bottom:1px solid var(--divider); background:var(--bg-surface);
  }
  #fsBackBtn {
    width:32px; height:32px; border-radius:50%; border:none; background:none;
    color:var(--text-primary); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  #fsSearchInput {
    flex:1; height:38px; background:var(--bg-main); border:1px solid var(--divider); border-radius:19px;
    padding:0 14px; color:var(--text-primary); font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:14px; outline:none;
  }
  #fsSearchInput::placeholder { color:var(--text-disabled); font-weight:500; }
  #fsResults { flex:1; overflow-y:auto; padding:8px 12px; }
  #fsHint { padding:40px 20px; text-align:center; font-size:12.5px; color:var(--text-disabled); }
  .fsRow {
    display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--divider);
  }
  .fsAvatar {
    width:44px; height:44px; border-radius:50%; flex:none;
    background:linear-gradient(135deg,#5a5f63,#33363a);
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .fsInfo { flex:1; min-width:0; }
  .fsName { font-size:14px; font-weight:800; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fsBtns { display:flex; gap:6px; flex:none; }
  .fsBtn {
    border:none; border-radius:14px; padding:8px 12px; font-size:11.5px; font-weight:800; cursor:pointer;
  }
  .fsBtn.friend { background:var(--accent-green); color:#0a0f0d; }
  .fsBtn.follow { background:var(--bg-hover); color:#fff; }
  .fsBtn.added { background:var(--bg-main); color:var(--text-disabled); border:1px solid var(--divider); }

  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
  @media (min-width:480px){ .grid { grid-template-columns:repeat(3, 1fr); } }

  .card {
    background:var(--bg-surface);
    border:1px solid var(--divider);
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    transition:background .12s ease, transform .12s ease;
  }
  .card:active { transform:scale(.97); background:var(--bg-hover); }
  .card.locked { cursor:default; opacity:.6; }
  .card.locked:active { transform:none; background:var(--bg-surface); }

  .thumb {
    position:relative; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; border-radius:8px 8px 0 0;
  }
  .thumb .glyph { font-size:44px; z-index:2; filter:drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
  .thumb::after { content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.16), transparent 55%); }
  .thumb.gacha { background:radial-gradient(circle at 32% 26%, #6d4fd6, #3a2280 65%, #1c1245); }
  .thumb.jump  { background:radial-gradient(circle at 32% 26%, #e08a1e, #a85608 65%, #5c2c02); }
  .thumb.soon  { background:#1f2123; }

  .ring { position:absolute; width:70%; height:70%; border:2px dashed rgba(255,255,255,.28); border-radius:50%; animation:spin 12s linear infinite; z-index:1; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .flagpole { position:absolute; z-index:1; bottom:10%; left:50%; width:3px; height:42%; background:#e9e2ff; transform:translateX(-50%); border-radius:2px; }

  .genreTag {
    position:absolute; top:6px; left:6px; z-index:3;
    font-size:9px; font-weight:800; letter-spacing:.2px;
    padding:3px 7px; border-radius:5px;
    background:rgba(0,0,0,.55); color:var(--text-primary);
  }

  .cardBody { padding:8px 9px 10px; }
  .cardTitle {
    font-size:13.5px; font-weight:800; color:var(--text-primary);
    line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cardStats { display:flex; align-items:center; gap:9px; margin-top:6px; }
  .statItem { display:flex; align-items:center; gap:3px; font-size:11px; font-weight:700; color:var(--text-secondary); }
  .statItem .statIcon { font-size:11px; }
  .statItem.like { color:#5fd68a; }
  .lockedLabel { font-size:11px; font-weight:700; color:var(--text-disabled); margin-top:6px; }

  /* ---------- 모달 ---------- */
  #modalOverlay {
    position:fixed; inset:0; z-index:50; display:none;
    align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,.65);
  }
  #modalOverlay.show { display:flex; }
  @media (min-width:480px){ #modalOverlay { align-items:center; } }

  #modalPanel {
    width:100%; max-width:420px;
    background:var(--bg-surface);
    border:1px solid var(--divider);
    border-radius:18px 18px 0 0;
    padding:22px 20px 28px;
    animation:slideUp .18s ease;
  }
  @media (min-width:480px){ #modalPanel { border-radius:16px; } }
  @keyframes slideUp { from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

  .modalHead { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
  #modalClose {
    width:32px; height:32px; border-radius:50%; border:none;
    background:var(--bg-main); color:var(--text-secondary);
    font-size:16px; font-weight:700; cursor:pointer;
  }

  .modalThumb {
    width:88px; height:88px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:42px; margin-bottom:14px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
  }
  #modalTitle { font-size:20px; font-weight:900; color:var(--text-primary); }
  #modalDesc { font-size:12.5px; font-weight:500; color:var(--text-secondary); margin-top:8px; line-height:1.6; }

  .modalStatRow { display:flex; gap:18px; margin-top:14px; padding:12px 0; border-top:1px solid var(--divider); border-bottom:1px solid var(--divider); }
  .modalStat { display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
  .modalStat .num { font-size:15px; font-weight:900; color:var(--text-primary); }
  .modalStat .num.like { color:#5fd68a; }
  .modalStat .lbl { font-size:10.5px; font-weight:700; color:var(--text-secondary); }

  #playBtn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; margin-top:20px;
    background:var(--accent-green); color:#0a0f0d;
    border:none; border-radius:12px; padding:18px 0;
    font-size:17px; font-weight:900; text-align:center;
    text-decoration:none; cursor:pointer;
    letter-spacing:.3px;
    box-shadow:0 8px 22px rgba(0,176,111,.4);
    transition:background .12s ease, transform .08s ease;
  }
  #playBtn:active { background:var(--accent-green-hover); transform:scale(.98); }

  /* ---------- 하단 탭바 ---------- */
  #tabbar {
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    height:64px; background:var(--bg-surface);
    border-top:1px solid var(--divider);
    display:flex; align-items:center; justify-content:space-around;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabItem {
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-disabled); font-size:9.5px; font-weight:700;
    background:none; border:none; cursor:pointer; padding:6px 10px;
  }
  .tabItem.active { color:var(--text-primary); }
  .tabItem svg { opacity:.9; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <div class="brandMark">P</div>
    <div class="brandName">Home</div>
  </div>
  <div id="searchBar">
    <button id="searchBackBtn" title="닫기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <input id="searchInput" type="text" placeholder="게임 이름으로 검색" autocomplete="off">
    <button id="searchClearBtn" title="지우기">✕</button>
  </div>

  <div class="topIcons">
    <button class="iconBtn searchTrigger" id="searchOpenBtn" title="검색">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="white" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="iconBtn" title="알림">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 3C9 3 7 5.2 7 8.4V12.5L5 16H19L17 12.5V8.4C17 5.2 15 3 12 3Z" stroke="white" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 18.5C9.8 19.6 10.8 20.4 12 20.4C13.2 20.4 14.2 19.6 14.5 18.5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="coinBadge"><span>🪙</span><span>1,240</span></div>
    <div class="avatar" id="avatarBtn" style="cursor:pointer;">🙂</div>
  </div>
</div>

<div id="acctOverlay" style="position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);">
  <div style="width:100%;max-width:420px;background:var(--bg-surface);border:1px solid var(--divider);border-radius:18px 18px 0 0;padding:22px 20px 28px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div style="font-size:18px;font-weight:900;">계정</div>
      <button id="acctClose" type="button" style="width:32px;height:32px;border-radius:50%;border:none;background:var(--bg-main);color:var(--text-secondary);font-size:16px;font-weight:700;cursor:pointer;">✕</button>
    </div>
    <div id="acctStatus" style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;">연결 중...</div>

    <div id="acctNicknameBlock">
      <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;">닉네임 (게스트)</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <input id="nicknameInput" type="text" maxlength="12" placeholder="닉네임 입력" style="flex:1;height:40px;border-radius:10px;border:1px solid var(--divider);background:var(--bg-main);color:#fff;padding:0 10px;font-family:inherit;">
        <button id="nicknameSaveBtn" type="button" style="border:none;border-radius:10px;background:var(--accent-blue);color:#fff;font-weight:800;padding:0 14px;cursor:pointer;">저장</button>
      </div>
    </div>

    <div id="acctLoginBlock">
      <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;">이메일로 로그인 / 회원가입하면 어느 기기에서든 같은 계정으로 접속돼요</div>
      <input id="emailInput" type="email" placeholder="이메일" style="width:100%;height:40px;border-radius:10px;border:1px solid var(--divider);background:var(--bg-main);color:#fff;padding:0 10px;margin-bottom:8px;font-family:inherit;">
      <input id="passInput" type="password" placeholder="비밀번호 (6자 이상)" style="width:100%;height:40px;border-radius:10px;border:1px solid var(--divider);background:var(--bg-main);color:#fff;padding:0 10px;margin-bottom:12px;font-family:inherit;">
      <div style="display:flex;gap:8px;">
        <button id="signInBtn" type="button" style="flex:1;height:44px;border:none;border-radius:10px;background:var(--bg-hover);color:#fff;font-weight:800;cursor:pointer;">로그인</button>
        <button id="signUpBtn" type="button" style="flex:1;height:44px;border:none;border-radius:10px;background:var(--accent-green);color:#0a0f0d;font-weight:800;cursor:pointer;">회원가입</button>
      </div>
      <div id="acctError" style="font-size:12px;color:#ff7a6b;margin-top:10px;"></div>
    </div>

    <button id="signOutBtn" type="button" style="display:none;width:100%;height:44px;border:none;border-radius:10px;background:var(--bg-hover);color:#fff;font-weight:800;cursor:pointer;margin-top:8px;">로그아웃</button>
  </div>
</div>

<main>
  <div id="friendsRow">
    <div class="addFriendCircle" id="addFriendBtn" title="친구 검색">＋</div>
  </div>

  <div class="sectionHead">
    <div class="sectionTitle">추천 미니게임</div>
    <div class="sectionMore">더보기 ›</div>
  </div>

  <div class="grid">

    <div class="card" data-game="gacha" data-search="아우라 배틀 aura battle 가챠 rpg 오픈월드">
      <div class="thumb gacha">
        <div class="ring"></div>
        <div class="genreTag">RPG</div>
        <div class="glyph">🎲</div>
      </div>
      <div class="cardBody">
        <div class="cardTitle">아우라 배틀</div>
        <div class="cardStats">
          <span class="statItem like"><span class="statIcon">👍</span>92%</span>
          <span class="statItem"><span class="statIcon">👥</span>1.2k</span>
        </div>
      </div>
    </div>

    <div class="card" data-game="jump" data-search="스카이 점프맵 sky jump obby 점프 어드벤처">
      <div class="thumb jump">
        <div class="flagpole"></div>
        <div class="genreTag">점프맵</div>
        <div class="glyph">🚩</div>
      </div>
      <div class="cardBody">
        <div class="cardTitle">스카이 점프맵</div>
        <div class="cardStats">
          <span class="statItem like"><span class="statIcon">👍</span>88%</span>
          <span class="statItem"><span class="statIcon">👥</span>640</span>
        </div>
      </div>
    </div>

    <div class="card locked">
      <div class="thumb soon">
        <div class="glyph">🔒</div>
      </div>
      <div class="cardBody">
        <div class="cardTitle">준비 중</div>
        <div class="lockedLabel">Coming Soon</div>
      </div>
    </div>

  </div>

  <div id="emptyState">
    <div class="emoji">🔍</div>
    <div class="msg">검색 결과가 없어요</div>
    <div class="sub">다른 게임 이름으로 검색해보세요</div>
  </div>
</main>

<div id="modalOverlay">
  <div id="modalPanel">
    <div class="modalHead">
      <div id="modalThumb" class="modalThumb"></div>
      <button id="modalClose" type="button">✕</button>
    </div>
    <div id="modalTitle"></div>
    <div id="modalDesc"></div>
    <div class="modalStatRow">
      <div class="modalStat"><span class="num like" id="modalLike"></span><span class="lbl">👍 추천율</span></div>
      <div class="modalStat"><span class="num" id="modalPlayers"></span><span class="lbl">👥 플레이 중</span></div>
      <div class="modalStat"><span class="num" id="modalGenre"></span><span class="lbl">장르</span></div>
    </div>
    <a id="playBtn" href="#">▶ &nbsp;PLAY</a>
  </div>
</div>

<div id="tabbar">
  <button class="tabItem active">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10V20H18V10" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>홈</span>
  </button>
  <button class="tabItem">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#656B70" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="#656B70" stroke-width="2" stroke-linecap="round"/></svg>
    <span>탐색</span>
  </button>
  <button class="tabItem">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#656B70" stroke-width="2"/><path d="M4 20C4 16 7.5 14 12 14C16.5 14 20 16 20 20" stroke="#656B70" stroke-width="2" stroke-linecap="round"/></svg>
    <span>아바타</span>
  </button>
  <button class="tabItem">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="12" rx="2" stroke="#656B70" stroke-width="2"/><path d="M8 21L12 17L16 21" stroke="#656B70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>채팅</span>
  </button>
</div>

<div id="friendSearchOverlay">
  <div id="fsTopbar">
    <button id="fsBackBtn" title="닫기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <input id="fsSearchInput" type="text" placeholder="친구 닉네임으로 검색" autocomplete="off">
  </div>
  <div id="fsResults">
    <div id="fsHint">닉네임을 입력해서 친구를 찾아보세요.<br>이메일로 가입한 유저만 검색돼요.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="multiplayer.js"></script>
<script>
  const GAMES = {
    gacha: {
      title:'아우라 배틀',
      desc:'뽑기로 희귀 아우라를 모으고 섬을 누비며 성장하는 오픈월드 배틀 게임입니다.',
      like:'92%', players:'1.2k', genre:'RPG',
      thumbBg:'radial-gradient(circle at 32% 26%, #6d4fd6, #3a2280 65%, #1c1245)',
      glyph:'🎲',
      href:'aura-battle-3.html'
    },
    jump: {
      title:'스카이 점프맵',
      desc:'하늘에 떠 있는 발판을 뛰어 넘어 정상 깃발까지 완주하는 타임어택 점프맵입니다.',
      like:'88%', players:'640', genre:'점프맵',
      thumbBg:'radial-gradient(circle at 32% 26%, #e08a1e, #a85608 65%, #5c2c02)',
      glyph:'🚩',
      href:'jumpmap.html'
    }
  };

  const overlay = document.getElementById('modalOverlay');
  const modalThumb = document.getElementById('modalThumb');
  const modalTitle = document.getElementById('modalTitle');
  const modalDesc = document.getElementById('modalDesc');
  const modalLike = document.getElementById('modalLike');
  const modalPlayers = document.getElementById('modalPlayers');
  const modalGenre = document.getElementById('modalGenre');
  const playBtn = document.getElementById('playBtn');

  document.querySelectorAll('.card[data-game]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const g = GAMES[card.dataset.game];
      if (!g) return;
      modalThumb.style.background = g.thumbBg;
      modalThumb.textContent = g.glyph;
      modalTitle.textContent = g.title;
      modalDesc.textContent = g.desc;
      modalLike.textContent = g.like;
      modalPlayers.textContent = g.players;
      modalGenre.textContent = g.genre;
      playBtn.href = g.href;
      overlay.classList.add('show');
    });
  });

  document.getElementById('modalClose').addEventListener('click', ()=>{
    overlay.classList.remove('show');
  });
  overlay.addEventListener('click', e=>{
    if (e.target === overlay) overlay.classList.remove('show');
  });

  // ---------- 검색 기능 ----------
  const topbar = document.getElementById('topbar');
  const searchOpenBtn = document.getElementById('searchOpenBtn');
  const searchBackBtn = document.getElementById('searchBackBtn');
  const searchInput = document.getElementById('searchInput');
  const searchClearBtn = document.getElementById('searchClearBtn');
  const emptyState = document.getElementById('emptyState');
  const allCards = Array.from(document.querySelectorAll('.grid .card'));

  function openSearch(){
    topbar.classList.add('searching');
    searchInput.value = '';
    filterCards('');
    setTimeout(()=> searchInput.focus(), 50);
  }
  function closeSearch(){
    topbar.classList.remove('searching');
    searchInput.value = '';
    filterCards('');
  }
  function filterCards(rawQuery){
    const q = rawQuery.trim().toLowerCase();
    let visibleCount = 0;
    allCards.forEach(card=>{
      if (!q){
        card.classList.remove('filteredOut');
        visibleCount++;
        return;
      }
      const haystack = (
        (card.dataset.search || '') + ' ' +
        (card.querySelector('.cardTitle')?.textContent || '')
      ).toLowerCase();
      const match = haystack.includes(q);
      card.classList.toggle('filteredOut', !match);
      if (match) visibleCount++;
    });
    emptyState.classList.toggle('show', q.length > 0 && visibleCount === 0);
  }

  searchOpenBtn.addEventListener('click', openSearch);
  searchBackBtn.addEventListener('click', closeSearch);
  searchClearBtn.addEventListener('click', ()=>{
    searchInput.value = '';
    filterCards('');
    searchInput.focus();
  });
  searchInput.addEventListener('input', e=> filterCards(e.target.value));
  searchInput.addEventListener('keydown', e=>{
    if (e.key === 'Escape') closeSearch();
  });

  // ---------- 계정 / 로그인 ----------
  const avatarBtn = document.getElementById('avatarBtn');
  const acctOverlay = document.getElementById('acctOverlay');
  const acctClose = document.getElementById('acctClose');
  const acctStatus = document.getElementById('acctStatus');
  const acctNicknameBlock = document.getElementById('acctNicknameBlock');
  const acctLoginBlock = document.getElementById('acctLoginBlock');
  const nicknameInput = document.getElementById('nicknameInput');
  const nicknameSaveBtn = document.getElementById('nicknameSaveBtn');
  const emailInput = document.getElementById('emailInput');
  const passInput = document.getElementById('passInput');
  const signInBtn = document.getElementById('signInBtn');
  const signUpBtn = document.getElementById('signUpBtn');
  const signOutBtn = document.getElementById('signOutBtn');
  const acctError = document.getElementById('acctError');

  function refreshAcctUI(){
    if (!window.MP || !MP.isConfigured || !MP.isConfigured()){
      acctStatus.textContent = '멀티플레이가 설정되지 않았어요.';
      return;
    }
    if (MP.isLoggedIn && MP.isLoggedIn()){
      const u = MP.currentUser();
      acctStatus.textContent = `로그인됨: ${u.email || MP.getDisplayName()}`;
      acctNicknameBlock.style.display = 'none';
      acctLoginBlock.style.display = 'none';
      signOutBtn.style.display = 'block';
    } else {
      acctStatus.textContent = `게스트로 접속 중 (닉네임: ${MP.getDisplayName()})`;
      acctNicknameBlock.style.display = 'block';
      acctLoginBlock.style.display = 'block';
      signOutBtn.style.display = 'none';
      nicknameInput.value = MP.getNickname();
    }
  }

  avatarBtn.addEventListener('click', ()=>{ acctOverlay.style.display = 'flex'; refreshAcctUI(); });
  acctClose.addEventListener('click', ()=> acctOverlay.style.display = 'none');
  acctOverlay.addEventListener('click', e=>{ if (e.target === acctOverlay) acctOverlay.style.display = 'none'; });

  nicknameSaveBtn.addEventListener('click', ()=>{
    if (!window.MP) return;
    MP.setNickname(nicknameInput.value);
    refreshAcctUI();
  });

  signInBtn.addEventListener('click', ()=>{
    acctError.textContent = '';
    if (!window.MP) return;
    MP.signIn(emailInput.value.trim(), passInput.value, (user, err)=>{
      if (err){ acctError.textContent = '로그인 실패: 이메일/비밀번호를 확인해주세요.'; return; }
      refreshAcctUI();
    });
  });
  signUpBtn.addEventListener('click', ()=>{
    acctError.textContent = '';
    if (!window.MP) return;
    if (passInput.value.length < 6){ acctError.textContent = '비밀번호는 6자 이상이어야 해요.'; return; }
    MP.signUp(emailInput.value.trim(), passInput.value, nicknameInput.value.trim(), (user, err)=>{
      if (err){ acctError.textContent = '회원가입 실패: ' + (err.message || err); return; }
      refreshAcctUI();
    });
  });
  signOutBtn.addEventListener('click', ()=>{
    if (!window.MP) return;
    MP.signOutUser(()=> refreshAcctUI());
  });

  // ---------- 친구 목록 렌더 ----------
  const friendsRow = document.getElementById('friendsRow');
  const GAME_LABEL = { gacha:'아우라 배틀', jump:'스카이 점프맵' };
  let myFriendUids = {};
  function renderFriendsRow(friends){
    myFriendUids = {};
    (friends||[]).forEach(f=> myFriendUids[f.uid] = true);
    friendsRow.querySelectorAll('.friendItem').forEach(el=> el.remove());
    (friends || []).sort((a,b)=> (b.online?1:0) - (a.online?1:0)).forEach(f=>{
      const item = document.createElement('div');
      item.className = 'friendItem';
      const gameLabel = f.online && f.game ? (GAME_LABEL[f.game] || '플레이 중') : (f.online ? '온라인' : '오프라인');
      item.innerHTML = `
        <div class="friendCircleWrap">
          <div class="friendCircle ${f.online?'online':''}">🙂</div>
          <div class="onlineDot ${f.online?'on':''}"></div>
        </div>
        <div class="friendName">${f.nickname}</div>
        <div class="friendGame" style="${f.online?'':'color:var(--text-disabled);'}">${gameLabel}</div>
      `;
      friendsRow.appendChild(item);
    });
  }

  if (window.MP && MP.isConfigured && MP.isConfigured()){
    MP.initAuthOnly((user, err)=>{
      if (!err){
        refreshAcctUI();
        MP.setPresence(null); // 허브 화면: 게임 없이 온라인 상태만
        MP.onFriendsUpdate(renderFriendsRow);
      }
    });
  }

  // ---------- 친구 검색 ----------
  const addFriendBtn = document.getElementById('addFriendBtn');
  const friendSearchOverlay = document.getElementById('friendSearchOverlay');
  const fsBackBtn = document.getElementById('fsBackBtn');
  const fsSearchInput = document.getElementById('fsSearchInput');
  const fsResults = document.getElementById('fsResults');

  addFriendBtn.addEventListener('click', ()=>{
    friendSearchOverlay.classList.add('show');
    fsSearchInput.value = '';
    fsResults.innerHTML = '<div id="fsHint">닉네임을 입력해서 친구를 찾아보세요.<br>이메일로 가입한 유저만 검색돼요.</div>';
    setTimeout(()=> fsSearchInput.focus(), 50);
  });
  fsBackBtn.addEventListener('click', ()=> friendSearchOverlay.classList.remove('show'));

  let searchDebounce = null;
  fsSearchInput.addEventListener('input', ()=>{
    clearTimeout(searchDebounce);
    const q = fsSearchInput.value.trim();
    if (!q){
      fsResults.innerHTML = '<div id="fsHint">닉네임을 입력해서 친구를 찾아보세요.<br>이메일로 가입한 유저만 검색돼요.</div>';
      return;
    }
    searchDebounce = setTimeout(()=>{
      if (!window.MP || !MP.searchUsers) return;
      MP.searchUsers(q, (users)=>{
        if (!users.length){
          fsResults.innerHTML = '<div id="fsHint">검색 결과가 없어요.</div>';
          return;
        }
        fsResults.innerHTML = '';
        users.forEach(u=>{
          const row = document.createElement('div');
          row.className = 'fsRow';
          const already = !!myFriendUids[u.uid];
          row.innerHTML = `
            <div class="fsAvatar">🙂</div>
            <div class="fsInfo"><div class="fsName">${u.nickname || '이름없음'}</div></div>
            <div class="fsBtns">
              <button class="fsBtn ${already?'added':'friend'}" data-act="friend" ${already?'disabled':''}>${already?'추가됨':'친추'}</button>
              <button class="fsBtn ${already?'added':'follow'}" data-act="follow" ${already?'disabled':''}>${already?'추가됨':'팔로우'}</button>
            </div>
          `;
          row.querySelectorAll('.fsBtn').forEach(btn=>{
            btn.addEventListener('click', ()=>{
              if (btn.disabled) return;
              const type = btn.dataset.act === 'friend' ? 'friend' : 'follow';
              MP.addFriend(u.uid, u.nickname, type, (ok)=>{
                if (ok){
                  row.querySelectorAll('.fsBtn').forEach(b=>{
                    b.disabled = true; b.textContent = '추가됨';
                    b.classList.remove('friend','follow'); b.classList.add('added');
                  });
                }
              });
            });
          });
          fsResults.appendChild(row);
        });
      });
    }, 300);
  });
</script>
</body>
</html>
