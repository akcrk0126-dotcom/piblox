<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
  :root { --bg:#07090f; --bg2:#0d111a; --panel:#111726; --line:#1c2436; --fg:#e6ecf7; --muted:#7d8aa5; --accent:#39c7ff; --accent2:#7b5cff; --user:#1b2a4a; --ok:#3ddc97; --err:#ff5c7a; color-scheme:dark; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:radial-gradient(1200px 500px at 50% -200px,#14213a,var(--bg) 60%);color:var(--fg);display:flex;flex-direction:column;font-size:14px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(7,9,15,.7);backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:center;gap:12px} .name{font-weight:800;letter-spacing:4px;color:var(--accent)} .status{font-size:11px;color:var(--muted);margin-top:2px}
  .icon-btn{background:transparent;border:1px solid transparent;color:var(--muted);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px}
  .icon-btn:hover{background:var(--panel);color:var(--fg);border-color:var(--line)} .icon-btn.on{color:var(--accent);border-color:var(--accent)}
  .core{position:relative;width:38px;height:38px;flex-shrink:0} .core .ring,.core .dot{position:absolute;border-radius:50%}
  .core .ring{inset:0;border:2px solid var(--accent);opacity:.55;border-top-color:transparent;border-left-color:transparent;animation:spin 6s linear infinite}
  .core .ring.r2{inset:6px;border-color:var(--accent2);border-right-color:transparent;animation:spin 3s linear infinite reverse}
  .core .dot{inset:13px;background:var(--accent);box-shadow:0 0 10px var(--accent),0 0 24px rgba(57,199,255,.5);animation:pulse 2.4s ease-in-out infinite}
  .core.thinking .dot{animation-duration:.6s} .core.listening .dot{background:var(--ok);box-shadow:0 0 12px var(--ok);animation-duration:.9s} .core.speaking .dot{background:var(--accent2);box-shadow:0 0 12px var(--accent2);animation-duration:.35s}
  @keyframes spin{to{transform:rotate(360deg)}} @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.78);opacity:.7}}
  .modes{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:rgba(13,17,26,.6);scrollbar-width:none}
  .modes button{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--muted);padding:6px 10px;cursor:pointer;font-size:16px;font-family:inherit;min-width:56px}
  .modes button span{font-size:10px} .modes button:hover{background:var(--panel);color:var(--fg);border-color:var(--line)} .modes button.on{color:var(--accent);border-color:var(--accent);background:rgba(57,199,255,.08)}
  .wrap{flex:1;min-height:0;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto}
  .studio{border-bottom:1px solid var(--line);background:var(--bg2);max-height:62vh;display:flex;flex-direction:column} .studio[hidden]{display:none}
  .studio-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px 16px} .studio-title{font-weight:700;font-size:13px;color:var(--accent)}
  .studio-body{padding:4px 16px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px} .row{display:flex;gap:6px;flex-wrap:wrap} .row>*{flex:1}
  .sbtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:9px 10px;border-radius:10px;cursor:pointer;font-size:12.5px;font-family:inherit;white-space:nowrap}
  .sbtn:hover{border-color:var(--accent);color:var(--accent)} .sbtn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600} .sbtn:disabled{opacity:.5;cursor:default}
  .sin,.sta,.ssel{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none} .sin:focus,.sta:focus{border-color:var(--accent)} .sta{min-height:70px;resize:vertical}
  .preview{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;max-height:240px;object-fit:contain;display:block}
  .sresult{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto} .sresult:empty{display:none}
  .sresult ul,.sresult ol,.msg ul,.msg ol{margin:4px 0;padding-left:18px} .sresult code,.msg code{background:#0a0e18;padding:1px 5px;border-radius:4px;font-size:12px} .sresult pre,.msg pre{background:#0a0e18;padding:8px;border-radius:8px;overflow-x:auto;font-size:11.5px} .sresult strong,.msg strong{color:#fff} .msg a{color:var(--accent)}
  .calc-display{font-family:ui-monospace,monospace;font-size:22px;text-align:right;padding:10px 12px;background:#0a0e18;border:1px solid var(--line);border-radius:10px;min-height:48px;word-break:break-all} .calc-sub{font-size:12px;color:var(--muted);text-align:right;min-height:16px}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px} .calc-grid button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:11px 0;font-size:15px;cursor:pointer;font-family:inherit} .calc-grid button.op{color:var(--accent)} .calc-grid button.eq{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;grid-column:span 2}
  .vault{display:flex;flex-direction:column;gap:6px} .vault-item{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px} .vault-item .meta{flex:1;min-width:0} .vault-item .t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .vault-item .d{font-size:11px;color:var(--muted)} .vault-item .k{font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--accent)} .vault-item button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 8px;cursor:pointer;font-size:12px}
  .gen-img{width:100%;border-radius:10px;border:1px solid var(--line);background:#0a0e18;min-height:120px} .small{font-size:11.5px;color:var(--muted);line-height:1.5}
  .chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 16px}
  .welcome{margin:auto 0;text-align:center;padding:20px 6px} .welcome-title{font-size:18px;font-weight:700;margin:0 0 6px;color:#c7d4ee} .welcome-sub{color:var(--muted);font-size:12.5px;margin:0 0 16px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center} .chip{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:7px 11px;border-radius:999px;cursor:pointer;font-size:12px;font-family:inherit} .chip:hover{border-color:var(--accent);color:var(--accent)}
  .msg{max-width:92%;padding:10px 13px;border-radius:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px} .msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.error{align-self:flex-start;background:rgba(255,92,122,.1);border:1px solid rgba(255,92,122,.4);color:#ffb3c1;font-size:12.5px} .msg.system{align-self:center;color:var(--muted);font-size:12px}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:10px 14px} .typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block;animation:blink 1.2s infinite} .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s} @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .composer{border-top:1px solid var(--line);background:var(--bg2);padding:8px 16px 10px} .tool-log{display:flex;flex-direction:column;gap:3px;margin-bottom:6px;max-height:110px;overflow-y:auto} .tool-log:empty{display:none}
  .tool-item{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center} .tool-item .tag{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--accent);font-family:ui-monospace,monospace;font-size:10.5px} .tool-item.ok .tag{color:var(--ok)} .tool-item.fail .tag{color:var(--err)}
  .input-row{display:flex;gap:6px;align-items:flex-end} textarea.main{flex:1;min-width:0;resize:none;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;line-height:1.4;max-height:140px;outline:none} textarea.main:focus{border-color:var(--accent)}
  .send,.mic{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:16px;flex-shrink:0} .send{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff} .send:disabled{opacity:.45}
  .mic.on{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok)} .hint{font-size:10.5px;color:var(--muted);margin-top:6px;text-align:center}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--panel);border:1px solid var(--accent);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;box-shadow:0 0 20px rgba(57,199,255,.3);max-width:90%}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;display:flex;flex-direction:column} .overlay[hidden]{display:none}
  .overlay header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#0d111a;border-bottom:1px solid var(--line)} .overlay header h2{flex:1;margin:0;font-size:15px} .overlay iframe{flex:1;border:none;background:#000} .overlay .doc{flex:1;overflow:auto;padding:24px;background:var(--bg);max-width:760px;margin:0 auto;width:100%;line-height:1.7}
  .overlay .doc h1{color:#fff;font-size:24px} .overlay .doc h2{color:var(--accent);font-size:18px} .overlay .doc img{max-width:100%;border-radius:10px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="core" id="core"><div class="ring"></div><div class="ring r2"></div><div class="dot"></div></div><div><div class="name">JARVIS</div><div class="status" id="status">대기 중</div></div></div>
  <div class="row" style="flex:0">
    <select class="ssel" id="model" style="width:auto;padding:6px 8px;font-size:12px"></select>
    <button class="icon-btn on" id="btnTts" title="음성 답변">🔊</button>
    <button class="icon-btn" id="btnClear" title="대화 지우기">🗑</button>
    <button class="icon-btn" id="btnAcct" title="계정">👤</button>
  </div>
</header>
<div class="wrap">
  <nav class="modes" id="modes">
    <button data-mode="camera">📷<span>카메라</span></button>
    <button data-mode="quiz">📸<span>문제</span></button>
    <button data-mode="dict">📖<span>사전</span></button>
    <button data-mode="calc">🧮<span>계산</span></button>
    <button data-mode="image">🎨<span>이미지</span></button>
    <button data-mode="game">🎮<span>게임</span></button>
    <button data-mode="docs">🗂<span>보관함</span></button>
  </nav>
  <section class="studio" id="studio" hidden><div class="studio-head"><div class="studio-title" id="studioTitle"></div><button class="icon-btn" id="studioClose">✕</button></div><div class="studio-body" id="studioBody"></div></section>
  <main class="chat" id="chat">
    <div class="welcome" id="welcome">
      <p class="welcome-title">무엇을 도와드릴까요?</p>
      <p class="welcome-sub">API 키 없이 무료로 쓰는 자비스예요. 첫 대화 때 Puter 로그인 창이 한 번 떠요 (구글 계정으로 가입, 무료).</p>
      <div class="chips">
        <button class="chip" data-q="지금 몇 시야? 오늘 무슨 요일?">지금 몇 시?</button>
        <button class="chip" data-q="3분 뒤에 물 마시라고 알려줘">3분 뒤 알림</button>
        <button class="chip" data-q="내 자전거 자물쇠 비번은 0415야. 기억해둬">기억해둬</button>
        <button class="chip" data-q="1인당 23,500원씩 7명이면 총 얼마고, 10% 할인하면?">계산해줘</button>
        <button class="chip" data-q="유튜브에서 lo-fi 검색해서 열어줘">유튜브 열어줘</button>
        <button class="chip" data-q="양자컴퓨터를 초등학생한테 설명하듯이 알려줘">아무거나 물어보기</button>
      </div>
    </div>
  </main>
  <footer class="composer">
    <div class="tool-log" id="toolLog"></div>
    <div class="input-row"><button class="mic" id="btnMic">🎤</button><textarea class="main" id="input" rows="1" placeholder="자비스에게 말하기…"></textarea><button class="send" id="btnSend">➤</button></div>
    <div class="hint">Enter 보내기 · Shift+Enter 줄바꿈 · 데이터는 이 브라우저에만 저장</div>
  </footer>
</div>
<div class="overlay" id="overlay" hidden><header><h2 id="ovTitle"></h2><button class="sbtn" id="ovDown">다운로드</button><button class="sbtn" id="ovClose">닫기</button></header><div id="ovBody" style="flex:1;display:flex;min-height:0"></div></div>

<script src="https://js.puter.com/v2/"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const chatEl=$('#chat'), inputEl=$('#input'), sendBtn=$('#btnSend'), micBtn=$('#btnMic'), statusEl=$('#status'), coreEl=$('#core'), toolLog=$('#toolLog'), welcomeEl=$('#welcome'), ttsBtn=$('#btnTts');
  const studio=$('#studio'), sBody=$('#studioBody'), sTitle=$('#studioTitle'), modesEl=$('#modes');

  // ---------- 저장 ----------
  const store={ get(k,d){try{const v=localStorage.getItem('jarvis.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem('jarvis.'+k,JSON.stringify(v))}catch(e){}} };
  const MODELS=[['gpt-4o-mini','GPT-4o mini (빠름)'],['gpt-4.1','GPT-4.1'],['claude-sonnet-4','Claude Sonnet 4'],['gemini-2.0-flash','Gemini 2.0 Flash'],['gpt-5-nano','GPT-5 nano']];
  let cfg={model:'gpt-4o-mini',tts:true,...store.get('cfg',{})};
  for(const [v,l] of MODELS){const o=document.createElement('option');o.value=v;o.textContent=l;$('#model').appendChild(o)}
  $('#model').value=cfg.model; $('#model').onchange=()=>{cfg.model=$('#model').value;store.set('cfg',cfg)};
  ttsBtn.classList.toggle('on',cfg.tts);
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function md(src){const b=[];let t=src.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{b.push('<pre><code>'+esc(c)+'</code></pre>');return '\u0000'+(b.length-1)+'\u0000'});
    t=esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|\n)#{1,3} (.+)/g,'$1<strong>$2</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    t=t.replace(/(?:^|\n)((?:[-*] .+(?:\n|$))+)/g,m=>'\n<ul>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^[-*] /,'')+'</li>').join('')+'</ul>').replace(/(?:^|\n)((?:\d+\. .+(?:\n|$))+)/g,m=>'\n<ol>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>');
    return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>b[i]).replace(/^\n+/,'')}
  function toast(m,ms=5000){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
  function setStatus(t,mode){statusEl.textContent=t;coreEl.className='core'+(mode?' '+mode:'')}
  function addBubble(role,text,animate=true){if(welcomeEl.isConnected)welcomeEl.remove();const el=document.createElement('div');el.className='msg '+role;if(role==='assistant')el.innerHTML=md(text);else el.textContent=text;chatEl.appendChild(el);chatEl.scrollTop=chatEl.scrollHeight;return el}
  function showTyping(){const el=document.createElement('div');el.className='typing';el.innerHTML='<i></i><i></i><i></i>';chatEl.appendChild(el);chatEl.scrollTop=chatEl.scrollHeight;return el}
  function logTool(name,input){const el=document.createElement('div');el.className='tool-item';const d=input?.expression||input?.value||input?.message||input?.key||input?.text||input?.url||input?.query||'';el.innerHTML='<span class="tag">'+name+'</span><span>'+(LABEL[name]||name)+(d?' · '+String(d).slice(0,40):'')+'</span>';toolLog.appendChild(el);toolLog.scrollTop=toolLog.scrollHeight;return el}
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  // ---------- 보관함 ----------
  const vaultAll=()=>store.get('vault',[]);
  function vaultAdd(it){const v=vaultAll();it.id='v'+Date.now();it.at=new Date().toISOString();v.unshift(it);store.set('vault',v.slice(0,40));return it}
  function vaultDel(id){store.set('vault',vaultAll().filter(i=>i.id!==id))}
  function download(name,content,type){const a=document.createElement('a');a.href=typeof content==='string'&&content.startsWith('data:')?content:URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click()}
  function openViewer(it){const ov=$('#overlay'),b=$('#ovBody');$('#ovTitle').textContent=it.title;b.innerHTML='';const safe=it.title.replace(/[\\/:*?"<>|]/g,'_').slice(0,40);
    if(it.kind==='game'){const f=document.createElement('iframe');f.sandbox='allow-scripts allow-pointer-lock allow-same-origin';f.srcdoc=it.body;b.appendChild(f);$('#ovDown').onclick=()=>download(safe+'.html',it.body,'text/html')}
    else if(it.kind==='image'){b.innerHTML=`<div style="flex:1;display:grid;place-items:center;padding:20px"><img src="${it.body}" style="max-width:100%;max-height:100%;border-radius:12px"></div>`;$('#ovDown').onclick=()=>download(safe+'.png',it.body)}
    else{const d=document.createElement('div');d.className='doc';d.innerHTML=(it.image?`<img src="${it.image}"><br><br>`:'')+md(it.body).replace(/\n/g,'<br>');b.appendChild(d);$('#ovDown').onclick=()=>download(safe+'.md',it.body,'text/markdown')}
    ov.hidden=false}
  $('#ovClose').onclick=()=>{$('#overlay').hidden=true;$('#ovBody').innerHTML=''};

  // ---------- 도구 ----------
  const TOOLS=[
    {name:'get_time',description:'현재 날짜/시간/요일',parameters:{type:'object',properties:{}}},
    {name:'calculate',description:'수식 계산. 사칙연산, 괄호, %, sqrt/pow/round 등. 예 "23500*7*0.9"',parameters:{type:'object',properties:{expression:{type:'string'}},required:['expression']}},
    {name:'save_note',description:'사용자가 기억해달라고 한 것을 key-value로 저장',parameters:{type:'object',properties:{key:{type:'string'},value:{type:'string'}},required:['key','value']}},
    {name:'get_notes',description:'저장된 메모 전부 조회. 사용자가 전에 말한 것을 물으면 먼저 호출',parameters:{type:'object',properties:{}}},
    {name:'delete_note',description:'메모 삭제',parameters:{type:'object',properties:{key:{type:'string'}},required:['key']}},
    {name:'set_timer',description:'N분 뒤 화면 알림 + 음성 알림 (이 탭이 열려 있어야 함)',parameters:{type:'object',properties:{minutes:{type:'number'},message:{type:'string'}},required:['minutes','message']}},
    {name:'open_url',description:'사이트를 새 탭으로 연다. kind: url|google|naver|youtube, value: URL 또는 검색어',parameters:{type:'object',properties:{kind:{type:'string'},value:{type:'string'}},required:['kind','value']}},
    {name:'copy_to_clipboard',description:'텍스트 클립보드 복사',parameters:{type:'object',properties:{text:{type:'string'}},required:['text']}}
  ];
  const LABEL={get_time:'시간 확인',calculate:'계산',save_note:'기억',get_notes:'기억 조회',delete_note:'기억 삭제',set_timer:'타이머',open_url:'열기',copy_to_clipboard:'복사'};

      bEx.onclick=()=>run([bEx],async()=>{const q=word.value.trim()||expr;if(!q)return;out.textContent='…';let hint='';try{hint=' (계산기 결과 '+evalExpr(expr)+')'}catch(e){}setResult(out,await askModel({text:`다음을 계산하고 단계별로 짧게 풀이. 마지막 줄 **답: …**. 한국어.\n${q}${hint}`,maxTokens:800}))},'계산 중');
      word.onkeydown=e=>{if(e.key==='Enter')bEx.click()};return[disp,sub,grid,word,bEx,out]}},
    image:{title:'이미지 생성',render(){
      const inp=h('<textarea class="sta" placeholder="예) 네온 사이버펑크 고양이, 비 오는 서울 골목, 픽셀아트"></textarea>'),style=h('<select class="ssel"><option value="">스타일 자동</option><option value="photorealistic, 8k">실사</option><option value="anime illustration">애니</option><option value="pixel art">픽셀아트</option><option value="watercolor painting">수채화</option><option value="flat vector illustration">플랫 벡터</option><option value="3d render">3D 렌더</option></select>');
      const bGo=h('<button class="sbtn primary">생성</button>'),bSave=h('<button class="sbtn" hidden>보관함 저장</button>'),box=h('<div></div>');let last='';
      bGo.onclick=()=>run([bGo],async()=>{const p=inp.value.trim();if(!p)return;box.innerHTML='<div class="small">프롬프트 다듬는 중…</div>';let en=p;try{en=await askModel({text:`다음 묘사를 이미지 생성용 영어 프롬프트 한 줄로. 피사체, 구도, 조명, 색감 포함. 프롬프트만:\n${p}`,maxTokens:150})}catch(e){}
        box.innerHTML='<div class="small">이미지 생성 중… (10~40초)</div>';const el=await puter.ai.txt2img(en+(style.value?', '+style.value:''));el.className='gen-img';box.innerHTML='';box.appendChild(el);
        last=el.src;if(!last.startsWith('data:')){try{const c=document.createElement('canvas');await new Promise(r=>{if(el.complete)r();else el.onload=r});c.width=el.naturalWidth;c.height=el.naturalHeight;c.getContext('2d').drawImage(el,0,0);last=c.toDataURL('image/png')}catch(e){}}
        bSave.hidden=false},'이미지 생성 중');
      bSave.onclick=()=>{vaultAdd({kind:'image',title:inp.value.trim().slice(0,40)||'이미지',body:last});toast('저장했어요')};return[inp,style,bGo,box,bSave]}},
    game:{title:'게임 생성',render(){
      const inp=h('<textarea class="sta" placeholder="예) 우주선이 운석 피하는 게임, 두더지 잡기, 2048, 플래피버드 같은 거"></textarea>'),bGo=h('<button class="sbtn primary">게임 만들기</button>'),bPlay=h('<button class="sbtn" hidden>플레이</button>'),fix=h('<input class="sin" placeholder="수정할 점: 더 빠르게, 점수판 추가, 모바일 터치 지원" hidden>'),bFix=h('<button class="sbtn" hidden>수정 요청</button>'),out=h('<div class="sresult"></div>');let html='',item=null;
      const SYSG='너는 뛰어난 HTML5 게임 개발자다. 외부 라이브러리 없이 Canvas + Vanilla JS로 단일 HTML 파일 게임을 만든다. 키보드와 터치 둘 다 지원, 점수/게임오버/재시작 포함, 화면 크기에 맞게 리사이즈. 반드시 완전한 <!DOCTYPE html>부터 </html>까지 하나의 코드블록만 출력하고 설명은 쓰지 않는다. 모든 텍스트는 한국어.';
      const extract=s=>{const m=s.match(/```(?:html)?\s*([\s\S]*?)```/i);const c=m?m[1]:s;const i=c.indexOf('<!DOCTYPE');return i>=0?c.slice(i):c};
      const make=ask=>run([bGo,bFix],async()=>{out.textContent='게임 코드 작성 중… (30초~1분)';html=extract(await askModel({system:SYSG,text:ask,maxTokens:8000}));if(!/<canvas|<script/i.test(html))throw new Error('게임 코드가 제대로 안 나왔어요. 더 구체적으로 다시 시도해주세요.');const t=(html.match(/<title>(.*?)<\/title>/i)||[])[1]||inp.value.trim().slice(0,30)||'게임';item=vaultAdd({kind:'game',title:t,body:html});out.innerHTML=`<strong>${esc(t)}</strong> 완성! ${(html.length/1024).toFixed(0)}KB · 보관함에 저장됨`;bPlay.hidden=false;bFix.hidden=false;fix.hidden=false;openViewer(item)},'게임 만드는 중');
      bGo.onclick=()=>{const p=inp.value.trim();if(p)make('다음 게임을 만들어라: '+p)};bFix.onclick=()=>{const f=fix.value.trim();if(f&&html)make(`아래 게임 코드를 다음 요구대로 수정해서 전체 코드를 다시 출력: ${f}\n\n\`\`\`html\n${html.slice(0,20000)}\n\`\`\``)};bPlay.onclick=()=>item&&openViewer(item);
      const r=h('<div class="row"></div>');r.append(bGo,bPlay);return[inp,r,out,fix,bFix]}},
    docs:{title:'보관함',render(){const list=h('<div class="vault"></div>');const items=vaultAll();if(!items.length)list.innerHTML='<div class="small">아직 없어요. 카메라 독스, 문제, 게임, 이미지가 여기 모여요.</div>';const K={doc:'독스',game:'게임',image:'이미지'};
      for(const it of items){const row=h(`<div class="vault-item"><span class="k">${K[it.kind]||it.kind}</span><div class="meta"><div class="t">${esc(it.title)}</div><div class="d">${new Date(it.at).toLocaleString('ko-KR')}</div></div></div>`);const o=h('<button>열기</button>');o.onclick=()=>openViewer(it);const d=h('<button>삭제</button>');d.onclick=()=>{vaultDel(it.id);row.remove()};row.append(o,d);list.appendChild(row)}return[list]}}
  };
  function openMode(name){if(current&&modes[current].leave)modes[current].leave();if(current===name){closeMode();return}current=name;modesEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.mode===name));sTitle.textContent=modes[name].title;sBody.innerHTML='';modes[name].render().forEach(e=>sBody.appendChild(e));studio.hidden=false;const f=sBody.querySelector('input,textarea');if(f)f.focus()}
  function closeMode(){if(current&&modes[current].leave)modes[current].leave();current=null;studio.hidden=true;modesEl.querySelectorAll('button').forEach(b=>b.classList.remove('on'))}
  modesEl.onclick=e=>{const b=e.target.closest('button[data-mode]');if(b)openMode(b.dataset.mode)};$('#studioClose').onclick=closeMode;

  if(typeof puter==='undefined')addBubble('error','AI 엔진(js.puter.com)을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요.');
  inputEl.focus();
})();
</script>
