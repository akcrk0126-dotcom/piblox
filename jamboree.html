  window.addEventListener('error', function(e){
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') return;

<script>
(function(){

const boxes = []; const buckets = new Map(); const BK = 6; const bkey = (i,j)=> i*100003 + j;

  for (const b of near(x, z, 1)){ if (b.off || b.nowalk) continue; if (x+r < b.minX || x-r > b.maxX || z+r < b.minZ || z-r > b.maxZ) continue; if (b.maxY <= y + STEP && b.maxY > best) best = b.maxY; }

    for (const b of a){ if (seen.has(b)) continue; seen.add(b); if (b.off || b.noray) continue; let t0 = 0, t1 = best;
      for (const [o,d,mn,mx] of [[ox,dx,b.minX,b.maxX],[oy,dy,b.minY,b.maxY],[oz,dz,b.minZ,b.maxZ]]){ if (Math.abs(d) < 1e-9){ if (o < mn || o > mx){ t0 = 1; t1 = 0; break; } continue; }
        let ta = (mn-o)/d, tb = (mx-o)/d; if (ta > tb){ const q = ta; ta = tb; tb = q; } if (ta > t0) t0 = ta; if (tb < t1) t1 = tb; if (t0 > t1) break; }
      if (t0 <= t1 && t0 >= 0 && t0 < best) best = t0; } }

// ---------- 재질 / 텍스처 ----------
function canvasTex(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; }
const RR = Math.random;
function speck(g, w, h, n, a, sz){ for (let i=0;i<n;i++){ g.fillStyle = 'rgba(0,0,0,' + (RR()*a) + ')'; g.fillRect(RR()*w, RR()*h, sz||2, sz||2); } }
const gray = v => 'rgb(' + (v|0) + ',' + (v|0) + ',' + (v|0) + ')';
const TEXS = {
  grass: canvasTex(256,256,(g,w,h)=>{ g.fillStyle = '#fff'; g.fillRect(0,0,w,h); for (let i=0;i<2600;i++){ g.fillStyle = 'rgba(0,60,0,' + RR()*0.14 + ')'; g.fillRect(RR()*w, RR()*h, 2, 5); } }),
  wood: canvasTex(256,256,(g,w,h)=>{ for (let y=0;y<h;y+=32){ let x = -RR()*120; while (x < w){ const L = 90 + RR()*130; g.fillStyle = gray(212 + RR()*40); g.fillRect(x, y, L, 32); g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(x, y, 2, 32); x += L; } g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, y + 31, w, 2); } }),
  tile: canvasTex(256,256,(g,w,h)=>{ g.fillStyle = '#c8c8c8'; g.fillRect(0,0,w,h); for (let i=0;i<4;i++) for (let j=0;j<4;j++){ g.fillStyle = gray(236 + RR()*19); g.fillRect(i*64+2, j*64+2, 60, 60); } }),
  stud: canvasTex(128,128,(g,w,h)=>{ g.fillStyle = '#fff'; g.fillRect(0,0,w,h); for (let i=0;i<2;i++) for (let j=0;j<2;j++){ g.fillStyle = 'rgba(0,0,0,.10)'; g.beginPath(); g.arc(32 + i*64, 34 + j*64, 18, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(30 + i*64, 30 + j*64, 16, 0, 7); g.fill(); } g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 3; g.strokeRect(0,0,w,h); }),
  canvas: canvasTex(128,128,(g,w,h)=>{ g.fillStyle = '#fff'; g.fillRect(0,0,w,h); for (let x=0;x<w;x+=8){ g.fillStyle = 'rgba(0,0,0,.05)'; g.fillRect(x, 0, 4, h); } }),
  stripe: canvasTex(128,128,(g,w,h)=>{ for (let i=0;i<8;i++){ g.fillStyle = i%2 ? '#fff' : '#d8d8d8'; g.fillRect(0, i*16, w, 16); } }),
};
const matCache = new Map();
function mat(color, tex, rep, extra){ const key = color + '|' + (tex||'') + '|' + (rep||1) + '|' + JSON.stringify(extra||{}); let m = matCache.get(key); if (m) return m;
  const o = Object.assign({ color }, extra||{}); if (tex){ o.map = TEXS[tex].clone(); o.map.needsUpdate = true; o.map.repeat.set(rep||1, rep||1); } m = new THREE.MeshLambertMaterial(o); matCache.set(key, m); return m; }
function matB(color, extra){ const key = 'B' + color + JSON.stringify(extra||{}); let m = matCache.get(key); if (!m){ m = new THREE.MeshBasicMaterial(Object.assign({ color }, extra||{})); matCache.set(key, m); } return m; }

  if (!opt.nocollide) m.userData.col = addCollider({ minX:x-w/2, maxX:x+w/2, minY:y-h/2, maxY:y+h/2, minZ:z-d/2, maxZ:z+d/2, zone, nowalk:!!opt.nowalk, rail:!!opt.rail });
  return m; }
function cyl(parent, x, y, z, rt, rb, h, m, seg){ const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 16), m); mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh; }
function signTex(text, bg, fg, w, h){ return canvasTex(w || 512, h || 128, (g,W,H)=>{ g.fillStyle = bg || 'rgba(20,20,26,.92)'; g.fillRect(0,0,W,H); g.fillStyle = fg || '#fff'; g.font = '900 ' + Math.round(H*0.46) + 'px Montserrat, "Malgun Gothic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, W/2, H/2 + 4); }); }

// =====================================================================
const lobby = new THREE.Group(); scene.add(lobby); const LZ = 'lobby';
let fireParts = [], fireLight = null, boardCanvas = null, boardTex = null;
const PODIUM = [{ x:0, z:-24, h:3.0 }, { x:-4.6, z:-24, h:2.0 }, { x:4.6, z:-24, h:1.2 }];
(function buildLobby(){
  const S = 48;
  box(lobby, LZ, 0, -0.5, 0, S*2, 1, S*2, mat(0x72c04f, 'grass', 10));
  // 흙길 + 모닥불 자리
  const dirt = new THREE.Mesh(new THREE.CircleGeometry(11, 40), mat(0xc8a878, 'grass', 4)); dirt.rotation.x = -Math.PI/2; dirt.position.y = 0.02; lobby.add(dirt);

function updateActors(dt){
  const G = state.G;
  if (myActor){ myActor.x = me.x; myActor.y = me.y; myActor.z = me.z; myActor.g.position.set(me.x, me.y, me.z); myActor.g.rotation.y = me.facing; myActor.g.visible = camEff > 1.3; animActor(myActor, dt, me.moving && me.grounded, !me.grounded); }
  for (const [id, o] of others){ const a = ensureActor(id, { name:o.name, lo:o.lo }); a.tx = o.x; a.ty = o.y; a.tz = o.z; a.try = o.ry; a.an = o.an; }
  if (G && G.bots){ for (const id in G.bots){ const v = G.bots[id], info = (G.bi && G.bi[id]) || { nm:'봇' }; const a = ensureActor(id, { name:info.nm, lo:info.lo, isBot:true });
      if (a.fresh === undefined){ a.x = v[0]; a.y = v[1]; a.z = v[2]; a.fresh = false; } a.tx = v[0]; a.ty = v[1]; a.tz = v[2]; a.try = v[3]; a.an = v[4]; } }
  for (const [id, a] of [...actors]){ if (id.startsWith('bot') && (!G || !G.bots || !G.bots[id])){ removeActor(id); continue; } if (id === MY_ID) continue;
    const k = Math.min(1, 14*dt); a.x += (a.tx - a.x)*k; a.y += (a.ty - a.y)*k; a.z += (a.tz - a.z)*k; let d = a.try - a.ry; d = Math.atan2(Math.sin(d), Math.cos(d)); a.ry += d*k;
    if (Math.hypot(a.tx - a.x, a.tz - a.z) > 15){ a.x = a.tx; a.y = a.ty; a.z = a.tz; }
    a.g.position.set(a.x, a.y, a.z); a.g.rotation.y = a.ry; animActor(a, dt, a.an === 1, a.an === 2);
    a.nameSpr.visible = Math.hypot(a.x - me.x, a.z - me.z) < 45;
    if (G && G.ph === 'podium' && G.top && G.top.indexOf(id) >= 0){ a.cheer = 0.5; } }
}
function podiumBots(){ const G = state.G; if (!state.isHost || !G || G.ph !== 'podium') return; for (const b of BS.values()){ const i = G.top.indexOf(b.id); if (i >= 0 && !b.onPod){ b.onPod = true; const p = PODIUM[i]; Object.assign(b, { x:p.x, y:p.h + 0.05, z:p.z, vy:0, kx:0, kz:0, ry:0 }); } else if (i < 0 && !b.onPod){ b.onPod = true; Object.assign(b, { x:rnd(-8, 8), y:0.05, z:-12 + rnd(-3, 3), vy:0, ry:Math.PI }); } stepBody(b, 0, 0, WALK, 1/60); } }
const _pivot = new THREE.Vector3(), _dir = new THREE.Vector3(); let camEff = 99;

  camYaw += (rawYaw - camYaw) * (shiftLock ? 1 : Math.min(1, 16*dt)); camPitch += (rawPitch - camPitch) * (shiftLock ? 1 : Math.min(1, 16*dt));
  const sh = shiftLock ? 1.2 : 0, rx = -Math.cos(camYaw), rz = Math.sin(camYaw);
  _pivot.set(me.x + rx*sh, me.y + 2.6, me.z + rz*sh);
  _dir.set(-Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), -Math.cos(camYaw)*Math.cos(camPitch));
  const t = rayBoxes(_pivot.x, _pivot.y, _pivot.z, _dir.x, _dir.y, _dir.z, camDist + 0.5), eff = Math.max(0.5, Math.min(camDist, t - 0.35)); camEff = eff;
  camera.position.copy(_pivot).addScaledVector(_dir, eff); camera.lookAt(_pivot.x, _pivot.y - 0.2, _pivot.z);
  sun.position.set(camera.position.x + 30, 90, camera.position.z + 20); sun.target.position.set(camera.position.x, 0, camera.position.z); sun.target.updateMatrixWorld();
}
const clock = new THREE.Clock(); let T = 0;
function frame(dt){

  state.frozen = !!(G && G.ph === 'intro' && isPart(MY_ID));
  punchCd = Math.max(0, punchCd - dt);
  stepMe(dt);
  if (G && arena && (G.ph === 'intro' || G.ph === 'play' || G.ph === 'result')){ const el = G.ph === 'result' ? (MG[G.game].dur + 1) : gameEl(); if (G.ph !== 'result') arena.update(dt, el);
    if (G.ph === 'play' && isPart(MY_ID) && isAlive(MY_ID) && me.y < arena.voidY) outMe(); }
  podiumBots();
  fireParts.forEach((f, i)=>{ f.scale.y = 1 + Math.sin(T*12 + i*1.7)*0.2; }); if (fireLight) fireLight.intensity = 1.0 + Math.sin(T*17)*0.12;
  updateActors(dt); updateFx(dt); updateCamera(dt); drawHUD(dt); netSend(dt);
}
