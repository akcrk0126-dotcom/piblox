<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>스카이 점프맵</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#87CEEB; font-family: -apple-system, 'Malgun Gothic', sans-serif; touch-action:none; cursor:none; }
  #canvas { display:block; width:100%; height:100%; cursor:none; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #hubBtn { position:absolute; top:12px; left:12px; pointer-events:auto; display:flex; align-items:center; gap:5px; padding:7px 11px; border-radius:20px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.35); color:#fff; font-size:11px; font-weight:700; text-decoration:none; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #hubBtn:active { background:rgba(0,0,0,.6); }
  #title { position:absolute; top:14px; left:50%; transform:translateX(-50%); color:#fff; font-size:15px; font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.5); letter-spacing:1px; }
  #hint { position:absolute; top:38px; left:50%; transform:translateX(-50%); color:#fff; font-size:11px; opacity:.85; text-shadow:0 1px 4px rgba(0,0,0,.5); text-align:center; }

  #stageTag { position:absolute; top:14px; right:14px; padding:8px 13px; border-radius:20px; background:rgba(0,0,0,.4); color:#fff; font-size:12px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.5); text-align:right; }
  #stageTag .cp { display:block; font-size:9px; font-weight:600; opacity:.85; margin-top:2px; }
  #timerTag { position:absolute; top:60px; right:14px; padding:6px 12px; border-radius:20px; background:rgba(0,0,0,.32); color:#ffe1a8; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }

  /* Joystick */
  #joyZone { position:absolute; left:0; bottom:0; width:45%; height:55%; pointer-events:auto; }
  #joyBase { position:absolute; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.18); border:3px solid rgba(255,255,255,.55); box-shadow:0 0 0 6px rgba(0,0,0,.08), inset 0 0 20px rgba(255,255,255,.08); display:none; }
  #joyBase::after { content:''; position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:rgba(255,255,255,.4); }
  #joyStick { position:absolute; width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 3px 10px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.12); }

  #camZone { position:absolute; right:0; bottom:0; width:55%; height:100%; pointer-events:auto; }

  #jumpBtn { position:absolute; right:32px; bottom:54px; width:74px; height:74px; border-radius:50%; background:rgba(255,255,255,.28); border:3px solid rgba(255,255,255,.6); pointer-events:auto; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800; text-shadow:0 1px 4px rgba(0,0,0,.4); }
  #jumpBtn:active { background:rgba(255,255,255,.5); }

  #lockBtn { position:absolute; right:14px; bottom:14px; width:44px; height:44px; border-radius:50%;
    background:rgba(20,20,30,.55); border:2px solid rgba(255,255,255,.55); pointer-events:auto;
    display:flex; align-items:center; justify-content:center; font-size:18px; line-height:1;
    box-shadow:0 3px 10px rgba(0,0,0,.35); transition:background .15s ease, border-color .15s ease, box-shadow .15s ease; }
  #lockBtn.active { background:#1e88ff; border-color:#fff; box-shadow:0 0 14px rgba(30,136,255,.85), 0 3px 10px rgba(0,0,0,.35); }

  body:not(.has-touch) #joyZone,
  body:not(.has-touch) #jumpBtn,
  body:not(.has-touch) #lockBtn { display:none !important; }

  #speedTag { position:absolute; top:66px; left:50%; transform:translateX(-50%); padding:8px 12px; border-radius:20px; background:rgba(0,0,0,.35); color:#fff; font-size:11px; font-weight:700; }

  #crosshair { position:fixed; top:50%; left:50%; width:16px; height:16px; margin:-8px 0 0 -8px; pointer-events:none; z-index:25; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,.9); box-shadow:0 0 2px rgba(0,0,0,.7); }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #crosshair::after { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }

  #finishOverlay { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(30,20,70,.55), rgba(5,5,15,.82)); }
  #finishOverlay.show { display:flex; }
  #finishPanel { text-align:center; color:#fff; padding:30px 34px; border-radius:22px;
    background:linear-gradient(180deg, rgba(40,30,80,.9), rgba(15,12,35,.94)); border:1px solid rgba(255,255,255,.18);
    box-shadow:0 20px 60px rgba(0,0,0,.55); max-width:82vw; }
  #finishPanel .flagIcon { font-size:44px; }
  #finishPanel h2 { margin-top:8px; font-size:22px; letter-spacing:.5px; background:linear-gradient(90deg,#ffe1a8,#ffb020);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  #finishPanel .timeText { margin-top:10px; font-size:14px; color:#c9bfff; }
  #finishBtns { margin-top:20px; display:flex; gap:10px; justify-content:center; }
  #finishBtns a, #finishBtns button { pointer-events:auto; border:none; cursor:pointer; font-size:12px; font-weight:700; padding:10px 18px; border-radius:20px; text-decoration:none; }
  #retryBtn { background:linear-gradient(90deg,#c9b8ff,#8b5cf6); color:#0e0c22; }
  #hubBtn2 { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3); }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud">
  <a id="hubBtn" href="hub.html">🏠 허브</a>
  <div id="title">스카이 점프맵</div>
  <div id="hint">발판을 밟고 정상 깃발까지 뛰어올라 보세요</div>
  <div id="stageTag">체크포인트 0 / 5<span class="cp">떨어지면 마지막 체크포인트에서 부활</span></div>
  <div id="timerTag">00:00.0</div>
  <div id="speedTag">대기</div>

  <div id="joyZone">
    <div id="joyBase"><div id="joyStick"></div></div>
  </div>
  <div id="camZone"></div>
  <div id="jumpBtn">점프</div>

  <button id="lockBtn" type="button" title="시점고정(Shift Lock)"><span id="lockIcon">🔓</span></button>
</div>

<div id="crosshair"></div>

<div id="finishOverlay">
  <div id="finishPanel">
    <div class="flagIcon">🏁</div>
    <h2>완주했습니다!</h2>
    <div class="timeText" id="finishTime">00:00.0</div>
    <div id="finishBtns">
      <button id="retryBtn" type="button">다시 도전</button>
      <a id="hubBtn2" href="hub.html">허브로</a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ---------- 터치 기기 감지 ----------
  const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0;
  if (isTouchDevice) document.body.classList.add('has-touch');

  // ---------- Scene setup ----------
  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fd3ff);
  scene.fog = new THREE.Fog(0x9fd3ff, 60, 240);

  const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 800);

  function resize(){
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Lights ----------
  const hemi = new THREE.HemisphereLight(0xffffff, 0x6b8e5a, 0.95);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff4dd, 1.15);
  sun.position.set(30, 60, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.bias = -0.0004;
  sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
  sun.shadow.camera.top = 90; sun.shadow.camera.bottom = -20;
  sun.shadow.camera.far = 220;
  scene.add(sun);

  // ---------- 구름 배경 ----------
  function makeCloud(x,y,z,s){
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, transparent:true, opacity:.9 });
    for (let i=0;i<5;i++){
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.8+Math.random()*0.6, 10, 8), mat);
      m.position.set((Math.random()-0.5)*2.4, (Math.random()-0.5)*0.6, (Math.random()-0.5)*1.2);
      g.add(m);
    }
    g.position.set(x,y,z); g.scale.setScalar(s);
    scene.add(g);
  }
  for (let i=0;i<26;i++){
    makeCloud((Math.random()-0.5)*160, 4+Math.random()*46, -30-Math.random()*140, 1.6+Math.random()*2.2);
  }

  // ---------- 플랫폼 텍스처 ----------
  function makeGrassTexture(baseHex){
    const c = document.createElement('canvas'); c.width=128; c.height=128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = baseHex; ctx.fillRect(0,0,128,128);
    for (let i=0;i<300;i++){
      const x=Math.random()*128,y=Math.random()*128;
      ctx.fillStyle = Math.random()<0.5 ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.12)';
      ctx.fillRect(x,y,2+Math.random()*3,2+Math.random()*3);
    }
    const tex = new THREE.CanvasTexture(c);
    return tex;
  }
  const TEX_NORMAL = makeGrassTexture('#4CB050');
  const TEX_START = makeGrassTexture('#3DBB4C');
  const TEX_CHECK = makeGrassTexture('#FFC24C');
  const TEX_FINISH = makeGrassTexture('#FF9F2E');

  // ---------- 콜라이더 / 발판 생성 ----------
  const platformMeshes = [];
  const colliders = [];

  function addPlatform(x,y,z,w,h,d,type){
    let tex = TEX_NORMAL;
    if (type === 'start') tex = TEX_START;
    else if (type === 'checkpoint') tex = TEX_CHECK;
    else if (type === 'finish') tex = TEX_FINISH;
    const mat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.9 });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    mesh.position.set(x,y,z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    platformMeshes.push(mesh);
    const c = {
      minX:x-w/2, maxX:x+w/2, minZ:z-d/2, maxZ:z+d/2,
      minY:y-h/2, maxY:y+h/2, topY:y+h/2, type: type||'normal'
    };
    colliders.push(c);
    return { mesh, collider:c };
  }

  // ---------- 코스 생성: 지그재그로 올라가는 점프 코스 ----------
  const STAGE_COUNT = 24;
  const CHECKPOINT_EVERY = 4;
  let checkpointsTotal = 0;

  // 시작 섬
  addPlatform(0, 0, 0, 9, 1, 9, 'start');
  let cx = 0, cz = 0, cy = 0;
  let dir = 1;
  const stagePositions = [{x:0,y:0.5,z:0}];

  for (let i=1; i<=STAGE_COUNT; i++){
    const gapZ = 4.2 + Math.random()*1.1;
    const swingX = (2.6 + Math.random()*2.4) * dir;
    dir *= -1;
    cx += swingX;
    cz += gapZ;
    cy += 1.55 + Math.random()*0.55;

    const isCheckpoint = (i % CHECKPOINT_EVERY === 0) && i !== STAGE_COUNT;
    const isFinish = (i === STAGE_COUNT);
    const size = isFinish ? 8 : (isCheckpoint ? 4.6 : Math.max(2.1, 3.4 - i*0.045));
    const type = isFinish ? 'finish' : (isCheckpoint ? 'checkpoint' : 'normal');
    if (isCheckpoint) checkpointsTotal++;

    addPlatform(cx, cy, cz, size, 1, size, type);
    stagePositions.push({x:cx, y:cy+0.5, z:cz});

    // 가끔 중간에 작은 디딤돌 하나 추가해서 난이도 완화
    if (!isCheckpoint && !isFinish && i % 3 === 0){
      const mx = cx - swingX*0.5, mz = cz - gapZ*0.5, my = cy - 0.7;
      addPlatform(mx, my, mz, 1.6, 0.8, 1.6, 'normal');
    }
  }

  // 깃발
  {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,5,10), new THREE.MeshStandardMaterial({color:0xe9e2ff}));
    pole.position.set(cx, cy+0.5+2.5, cz);
    pole.castShadow = true;
    scene.add(pole);
    const flagShape = new THREE.Shape();
    flagShape.moveTo(0,0); flagShape.lineTo(1.6,0.5); flagShape.lineTo(0,1);
    const flagGeo = new THREE.ShapeGeometry(flagShape);
    const flag = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({color:0xffb020, side:THREE.DoubleSide}));
    flag.position.set(cx, cy+0.5+4.2, cz);
    flag.rotation.y = Math.PI/2;
    scene.add(flag);
  }

  const START_POS = new THREE.Vector3(0, 0.6, 0);
  let respawnPos = START_POS.clone();
  const VOID_Y = -20;
  const FINISH_Z = cz, FINISH_X = cx, FINISH_Y = cy;

  // ---------- Character (아우라 배틀과 동일한 R6 스타일 아바타) ----------
  const character = new THREE.Group();
  const STUD = 0.62;
  const headColor  = 0xF5CD30;
  const torsoColor = 0x0B62C4;
  const armColor   = 0xF5CD30;
  const legColor   = 0x287F35;

  const LEG_W = 1*STUD, LEG_H = 2*STUD, LEG_D = 1*STUD;
  const TORSO_W = 2*STUD, TORSO_H = 2*STUD, TORSO_D = 1*STUD;
  const HEAD_W = 2*STUD, HEAD_H = 1*STUD, HEAD_D = 1*STUD;
  const ARM_W = 1*STUD, ARM_H = 2*STUD, ARM_D = 1*STUD;

  const legTopY = LEG_H;
  const torsoCenterY = legTopY + TORSO_H/2;
  const shoulderY = legTopY + TORSO_H - ARM_H*0.08;

  const torso = new THREE.Mesh(new THREE.BoxGeometry(TORSO_W, TORSO_H, TORSO_D), new THREE.MeshStandardMaterial({color:torsoColor}));
  torso.position.y = torsoCenterY;
  torso.castShadow = true;
  character.add(torso);

  function roundedRectShape(w, h, r){
    const s = new THREE.Shape();
    const x = -w/2, y = -h/2;
    s.moveTo(x, y+r);
    s.lineTo(x, y+h-r);
    s.quadraticCurveTo(x, y+h, x+r, y+h);
    s.lineTo(x+w-r, y+h);
    s.quadraticCurveTo(x+w, y+h, x+w, y+h-r);
    s.lineTo(x+w, y+r);
    s.quadraticCurveTo(x+w, y, x+w-r, y);
    s.lineTo(x+r, y);
    s.quadraticCurveTo(x, y, x, y+r);
    return s;
  }
  const HEAD_W2 = HEAD_W*0.9, HEAD_H2 = HEAD_H*1.5, HEAD_D2 = HEAD_D*0.9;
  const headShape = roundedRectShape(HEAD_W2, HEAD_H2, HEAD_W2*0.32);
  const headGeo = new THREE.ExtrudeGeometry(headShape, { depth: HEAD_D2, bevelEnabled:true, bevelThickness:HEAD_W2*0.12, bevelSize:HEAD_W2*0.12, bevelSegments:5, curveSegments:10 });
  headGeo.translate(0, 0, -HEAD_D2/2);
  const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({color:headColor, roughness:0.6}));
  head.position.y = legTopY + TORSO_H + HEAD_H2/2;
  head.castShadow = true;
  character.add(head);

  const faceCanvas = document.createElement('canvas');
  faceCanvas.width = 128; faceCanvas.height = 128;
  const fctx = faceCanvas.getContext('2d');
  fctx.clearRect(0,0,128,128);
  fctx.fillStyle = '#1a1a1a';
  fctx.beginPath(); fctx.roundRect(38,46,8,20,4); fctx.fill();
  fctx.beginPath(); fctx.roundRect(82,46,8,20,4); fctx.fill();
  fctx.lineWidth = 7; fctx.lineCap = 'round'; fctx.strokeStyle = '#1a1a1a';
  fctx.beginPath(); fctx.moveTo(46, 82); fctx.quadraticCurveTo(64, 104, 82, 82); fctx.stroke();
  const faceTex = new THREE.CanvasTexture(faceCanvas);
  const facePlane = new THREE.Mesh(
    new THREE.PlaneGeometry(HEAD_W2*0.78, HEAD_H2*0.62),
    new THREE.MeshBasicMaterial({ map:faceTex, transparent:true })
  );
  facePlane.position.set(0, head.position.y - HEAD_H2*0.06, HEAD_D2/2 + 0.02);
  character.add(facePlane);

  function makeLimb(color, w,h,d){
    const g = new THREE.Group();
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color}));
    mesh.position.y = -h/2;
    mesh.castShadow = true;
    g.add(mesh);
    return g;
  }
  const armL = makeLimb(armColor, ARM_W, ARM_H, ARM_D);
  armL.position.set(-(TORSO_W/2 + ARM_W/2), shoulderY, 0);
  const armR = makeLimb(armColor, ARM_W, ARM_H, ARM_D);
  armR.position.set(TORSO_W/2 + ARM_W/2, shoulderY, 0);
  character.add(armL, armR);

  const legL = makeLimb(legColor, LEG_W, LEG_H, LEG_D);
  legL.position.set(-LEG_W/2, legTopY, 0);
  const legR = makeLimb(legColor, LEG_W, LEG_H, LEG_D);
  legR.position.set(LEG_W/2, legTopY, 0);
  character.add(legL, legR);

  const shadowBlob = new THREE.Mesh(
    new THREE.CircleGeometry(0.7,24),
    new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.28})
  );
  shadowBlob.rotation.x = -Math.PI/2;
  shadowBlob.position.y = 0.02;
  scene.add(shadowBlob);

  character.position.set(0, 0.5, 0);
  scene.add(character);

  // ---------- Camera rig ----------
  let rawYaw = 0.5, rawPitch = 0.35;
  let camYaw = 0.5, camPitch = 0.35;
  let camDist = 8.5;
  const CAM_PITCH_MIN = -0.1, CAM_PITCH_MAX = 1.15;
  let shiftLock = false;
  const camRaycaster = new THREE.Raycaster();
  const collidableMeshes = platformMeshes;

  // ---------- Movement state ----------
  const pos = START_POS.clone();
  let velY = 0;
  let grounded = true;
  let facing = 0;
  const WALK_SPEED = 10.5;
  const GRAVITY = -133;
  const JUMP_VEL = 34.46;

  let moveVec = new THREE.Vector2(0,0);
  let curSpeed = new THREE.Vector2(0,0);
  let finished = false;
  let jumpHeld = false;
  let coyoteTimer = 0;
  let wallJumpCooldown = 0;
  let jumpBufferTimer = 0;
  let walkT = 0;

  // ---------- Joystick ----------
  const joyZone = document.getElementById('joyZone');
  const joyBase = document.getElementById('joyBase');
  const joyStick = document.getElementById('joyStick');
  let joyTouchId = null;
  let joyCenter = {x:0,y:0};
  const JOY_RADIUS = 55;

  function joyStart(x,y,id){
    joyTouchId = id;
    joyCenter = {x,y};
    joyBase.style.display = 'block';
    joyBase.style.left = (x-55)+'px';
    joyBase.style.top = (y-55)+'px';
    joyStick.style.left = '31px';
    joyStick.style.top = '31px';
  }
  function joyMove(x,y){
    let dx = x - joyCenter.x, dy = y - joyCenter.y;
    const dist = Math.min(Math.hypot(dx,dy), JOY_RADIUS);
    const ang = Math.atan2(dy,dx);
    dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
    joyStick.style.left = (55+dx-24)+'px';
    joyStick.style.top = (55+dy-24)+'px';
    moveVec.x = dx / JOY_RADIUS;
    moveVec.y = dy / JOY_RADIUS;
  }
  function joyEnd(){
    joyTouchId = null;
    joyBase.style.display = 'none';
    moveVec.set(0,0);
  }
  joyZone.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t = e.changedTouches[0];
    joyStart(t.clientX, t.clientY, t.identifier);
  }, {passive:false});
  joyZone.addEventListener('touchmove', e=>{
    e.preventDefault();
    for (const t of e.changedTouches){ if (t.identifier === joyTouchId) joyMove(t.clientX, t.clientY); }
  }, {passive:false});
  joyZone.addEventListener('touchend', e=>{
    for (const t of e.changedTouches){ if (t.identifier === joyTouchId) joyEnd(); }
  });
  joyZone.addEventListener('touchcancel', joyEnd);
  window.addEventListener('touchend', e=>{
    for (const t of e.changedTouches){
      if (t.identifier === joyTouchId) joyEnd();
      if (t.identifier === camTouchId) camTouchId = null;
    }
  });
  window.addEventListener('touchcancel', e=>{
    for (const t of e.changedTouches){
      if (t.identifier === joyTouchId) joyEnd();
      if (t.identifier === camTouchId) camTouchId = null;
    }
  });
  window.addEventListener('blur', ()=>{
    joyEnd();
    camTouchId = null;
    mouseJoyActive = false;
    jumpHeld = false;
    jumpBufferTimer = 0;
    for (const k in keys) keys[k] = false;
  });
  let mouseJoyActive = false;
  joyZone.addEventListener('mousedown', e=>{ mouseJoyActive = true; joyStart(e.clientX, e.clientY, 'mouse'); });
  window.addEventListener('mousemove', e=>{ if (mouseJoyActive) joyMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', ()=>{ if (mouseJoyActive){ mouseJoyActive=false; joyEnd(); } });

  // ---------- Camera drag zone ----------
  const camZone = document.getElementById('camZone');
  let camTouchId = null;
  let lastCamPos = {x:0,y:0};
  function camDragStart(x,y,id){ camTouchId = id; lastCamPos = {x,y}; }
  function camDragMove(x,y){
    const dx = x - lastCamPos.x, dy = y - lastCamPos.y;
    lastCamPos = {x,y};
    rawYaw -= dx * 0.006;
    rawPitch += dy * 0.0035;
    rawPitch = Math.max(CAM_PITCH_MIN, Math.min(CAM_PITCH_MAX, rawPitch));
  }
  camZone.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t = e.changedTouches[0];
    camDragStart(t.clientX, t.clientY, t.identifier);
  }, {passive:false});
  camZone.addEventListener('touchmove', e=>{
    e.preventDefault();
    for (const t of e.changedTouches){ if (t.identifier === camTouchId) camDragMove(t.clientX, t.clientY); }
  }, {passive:false});
  camZone.addEventListener('touchend', e=>{
    for (const t of e.changedTouches){ if (t.identifier === camTouchId) camTouchId = null; }
  });

  // ---------- PC: 포인터락 ----------
  let lastLockAttempt = 0;
  function tryLock(e){
    if (e && e.repeat) return;
    if (document.pointerLockElement === canvas || !canvas.requestPointerLock) return;
    const now = performance.now();
    if (now - lastLockAttempt < 800) return;
    lastLockAttempt = now;
    canvas.requestPointerLock();
  }
  function isUITarget(el){
    return !!(el && el.closest && el.closest('#lockBtn, #jumpBtn, #hubBtn, #retryBtn, #hubBtn2'));
  }
  window.addEventListener('mousedown', e=>{
    if (isUITarget(e.target)){
      if (document.pointerLockElement === canvas) document.exitPointerLock();
      return;
    }
    tryLock(e);
  });
  window.addEventListener('keydown', tryLock);
  window.addEventListener('touchstart', tryLock, {passive:true});
  window.addEventListener('mousemove', e=>{
    if (document.pointerLockElement !== canvas) return;
    rawYaw -= e.movementX * 0.0026;
    rawPitch += e.movementY * 0.0016;
    rawPitch = Math.max(CAM_PITCH_MIN, Math.min(CAM_PITCH_MAX, rawPitch));
  });

  // ---------- Jump button ----------
  const jumpBtn = document.getElementById('jumpBtn');
  function findAdjacentWall(x, z, y){
    const pad = CHAR_HALF_W + 0.16;
    for (const c of colliders){
      const withinY = (y + CHAR_HEIGHT > c.minY + 0.06) && (y < c.maxY - 0.4);
      if (!withinY) continue;
      const nearX = x > c.minX - pad && x < c.maxX + pad;
      const nearZ = z > c.minZ - pad && z < c.maxZ + pad;
      if (!(nearX && nearZ)) continue;
      const overlapX = Math.min(x-(c.minX-pad), (c.maxX+pad)-x);
      const overlapZ = Math.min(z-(c.minZ-pad), (c.maxZ+pad)-z);
      const cx2 = (c.minX+c.maxX)/2, cz2 = (c.minZ+c.maxZ)/2;
      let nx = 0, nz = 0;
      if (overlapX < overlapZ) nx = (x < cx2 ? -1 : 1);
      else nz = (z < cz2 ? -1 : 1);
      return { nx, nz };
    }
    return null;
  }
  function onJumpPress(e){
    if (e) e.preventDefault();
    jumpHeld = true;
    jumpBufferTimer = 0.15;
    if (grounded || coyoteTimer > 0){
      velY = JUMP_VEL;
      grounded = false;
      jumpBufferTimer = 0;
      coyoteTimer = 0;
      return;
    }
    const wall = findAdjacentWall(pos.x, pos.z, pos.y);
    if (wall){
      const speedLen = Math.hypot(curSpeed.x, curSpeed.y);
      let intoWall = false;
      if (speedLen > 0.5){
        const dot = (curSpeed.x/speedLen)*(-wall.nx) + (curSpeed.y/speedLen)*(-wall.nz);
        intoWall = dot > 0.3;
      }
      if (intoWall || wallJumpCooldown <= 0){
        velY = JUMP_VEL * 0.55;
        const kick = WALK_SPEED * 0.3;
        curSpeed.x = wall.nx * kick;
        curSpeed.y = wall.nz * kick;
        jumpBufferTimer = 0;
        if (!intoWall) wallJumpCooldown = 0.15;
      }
    }
  }
  function onJumpRelease(){ jumpHeld = false; }
  jumpBtn.addEventListener('touchstart', onJumpPress, {passive:false});
  jumpBtn.addEventListener('touchend', onJumpRelease);
  jumpBtn.addEventListener('touchcancel', onJumpRelease);
  jumpBtn.addEventListener('mousedown', onJumpPress);
  window.addEventListener('mouseup', onJumpRelease);

  // ---------- Shift lock ----------
  const lockBtn = document.getElementById('lockBtn');
  const lockIcon = document.getElementById('lockIcon');
  lockBtn.addEventListener('click', ()=>{
    shiftLock = !shiftLock;
    lockBtn.classList.toggle('active', shiftLock);
    lockIcon.textContent = shiftLock ? '🔒' : '🔓';
  });

  // ---------- Keyboard ----------
  const keys = {};
  const MOVE_KEYS = ['Space','KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  window.addEventListener('keydown', e=>{
    if (MOVE_KEYS.includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'Space' && !e.repeat) onJumpPress(e);
    if (e.code === 'KeyR' && !e.repeat) retryRun();
  });
  window.addEventListener('keyup', e=>{
    keys[e.code] = false;
    if (e.code === 'Space') onJumpRelease();
  });

  // ---------- 정밀 충돌 ----------
  const CHAR_HALF_W = 0.42;
  const CHAR_HEIGHT = legTopY + TORSO_H + HEAD_H2;

  function resolveWalls(p){
    for (const c of colliders){
      const withinY = (p.y + CHAR_HEIGHT > c.minY + 0.06) && (p.y < c.maxY - 0.06);
      if (!withinY) continue;
      const minX = c.minX - CHAR_HALF_W, maxX = c.maxX + CHAR_HALF_W;
      const minZ = c.minZ - CHAR_HALF_W, maxZ = c.maxZ + CHAR_HALF_W;
      if (p.x > minX && p.x < maxX && p.z > minZ && p.z < maxZ){
        const overlapX = Math.min(p.x-minX, maxX-p.x);
        const overlapZ = Math.min(p.z-minZ, maxZ-p.z);
        const ccx = (c.minX+c.maxX)/2, ccz = (c.minZ+c.maxZ)/2;
        if (overlapX < overlapZ){
          p.x += (p.x < ccx ? -overlapX : overlapX);
        } else {
          p.z += (p.z < ccz ? -overlapZ : overlapZ);
        }
      }
    }
  }
  function findLanding(prevY, newY, x, z){
    let best = null;
    for (const c of colliders){
      const overlapXZ = (x > c.minX - CHAR_HALF_W && x < c.maxX + CHAR_HALF_W &&
                          z > c.minZ - CHAR_HALF_W && z < c.maxZ + CHAR_HALF_W);
      if (!overlapXZ) continue;
      if (prevY >= c.topY - 0.05 && newY <= c.topY + 0.3){
        if (!best || c.topY > best.topY) best = c;
      }
    }
    return best;
  }
  function findCeiling(prevY, newY, x, z, exclude){
    for (const c of colliders){
      if (c === exclude) continue;
      const overlapXZ = (x > c.minX - CHAR_HALF_W*0.6 && x < c.maxX + CHAR_HALF_W*0.6 &&
                          z > c.minZ - CHAR_HALF_W*0.6 && z < c.maxZ + CHAR_HALF_W*0.6);
      if (!overlapXZ) continue;
      const prevHead = prevY + CHAR_HEIGHT, newHead = newY + CHAR_HEIGHT;
      if (prevHead <= c.minY + 0.05 && newHead >= c.minY){
        return c;
      }
    }
    return null;
  }
  const STEP_HEIGHT = 2.5 * STUD;
  function tryStepUp(x, z, curY){
    let best = null;
    for (const c of colliders){
      const overlapXZ = (x > c.minX - CHAR_HALF_W && x < c.maxX + CHAR_HALF_W &&
                          z > c.minZ - CHAR_HALF_W && z < c.maxZ + CHAR_HALF_W);
      if (!overlapXZ) continue;
      const diff = c.topY - curY;
      if (diff > 0.06 && diff <= STEP_HEIGHT){
        if (best === null || c.topY > best) best = c.topY;
      }
    }
    return best;
  }

  // ---------- 체크포인트/스테이지 HUD ----------
  const stageTag = document.getElementById('stageTag');
  const timerTag = document.getElementById('timerTag');
  const speedTag = document.getElementById('speedTag');
  const finishOverlay = document.getElementById('finishOverlay');
  const finishTimeEl = document.getElementById('finishTime');
  const retryBtn = document.getElementById('retryBtn');

  let checkpointIdx = 0;
  let startTime = performance.now();
  let elapsedFrozen = null;

  function fmtTime(ms){
    const s = ms/1000;
    const m = Math.floor(s/60);
    const rem = (s - m*60).toFixed(1);
    return String(m).padStart(2,'0') + ':' + String(rem).padStart(4,'0');
  }
  function updateStageTag(){
    stageTag.innerHTML = `체크포인트 ${checkpointIdx} / ${checkpointsTotal}<span class="cp">떨어지면 마지막 체크포인트에서 부활</span>`;
  }
  updateStageTag();

  function retryRun(){
    pos.copy(START_POS);
    respawnPos.copy(START_POS);
    checkpointIdx = 0;
    finished = false;
    velY = 0; grounded = true; curSpeed.set(0,0);
    startTime = performance.now();
    elapsedFrozen = null;
    finishOverlay.classList.remove('show');
    updateStageTag();
  }
  retryBtn.addEventListener('click', retryRun);

  // ---------- Animate loop ----------
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    const rotFollow = shiftLock ? 1 : Math.min(1, 16*dt);
    camYaw += (rawYaw - camYaw) * rotFollow;
    camPitch += (rawPitch - camPitch) * rotFollow;

    let inX = moveVec.x, inY = moveVec.y;
    if (keys['KeyW']||keys['ArrowUp']) inY = -1;
    if (keys['KeyS']||keys['ArrowDown']) inY = 1;
    if (keys['KeyA']||keys['ArrowLeft']) inX = -1;
    if (keys['KeyD']||keys['ArrowRight']) inX = 1;
    if (finished){ inX = 0; inY = 0; }
    const inLen = Math.hypot(inX, inY);
    if (inLen > 1){ inX/=inLen; inY/=inLen; }

    const forward = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
    const right = new THREE.Vector3(-Math.cos(camYaw), 0, Math.sin(camYaw));
    const moveDir = new THREE.Vector3();
    moveDir.addScaledVector(forward, -inY);
    moveDir.addScaledVector(right, inX);
    const moving = moveDir.lengthSq() > 0.0001;
    if (moving) moveDir.normalize();

    const targetVX = moveDir.x * WALK_SPEED;
    const targetVZ = moveDir.z * WALK_SPEED;
    const accel = moving ? 55 : 40;
    curSpeed.x += (targetVX - curSpeed.x) * Math.min(1, accel*dt);
    curSpeed.y += (targetVZ - curSpeed.y) * Math.min(1, accel*dt);

    const testX = pos.x + curSpeed.x * dt;
    const testZ = pos.z + curSpeed.y * dt;
    const prevY = pos.y;
    const stepTop = grounded ? tryStepUp(testX, testZ, pos.y) : null;
    let newY;
    if (stepTop !== null){
      newY = stepTop;
      velY = 0;
      grounded = true;
    } else {
      velY += GRAVITY * dt;
      newY = pos.y + velY * dt;
      if (velY <= 0){
        const landing = findLanding(prevY, newY, testX, testZ);
        if (landing){
          newY = landing.topY;
          velY = 0;
          grounded = true;
          if (landing.type === 'checkpoint' || landing.type === 'start'){
            const newCpX = (landing.minX+landing.maxX)/2, newCpZ = (landing.minZ+landing.maxZ)/2;
            if (respawnPos.x !== newCpX || respawnPos.z !== newCpZ){
              respawnPos.set(newCpX, landing.topY+0.1, newCpZ);
              if (landing.type === 'checkpoint'){
                checkpointIdx = Math.min(checkpointsTotal, checkpointIdx+1);
                updateStageTag();
              }
            }
          }
          if (landing.type === 'finish' && !finished){
            finished = true;
            elapsedFrozen = performance.now() - startTime;
            finishTimeEl.textContent = fmtTime(elapsedFrozen);
            setTimeout(()=> finishOverlay.classList.add('show'), 400);
          }
        } else {
          grounded = false;
        }
      } else {
        const ceiling = findCeiling(prevY, newY, testX, testZ);
        if (ceiling){
          newY = ceiling.minY - CHAR_HEIGHT;
          velY = 0;
        }
        grounded = false;
      }
    }

    pos.x = testX;
    pos.z = testZ;
    pos.y = newY;
    if (stepTop === null) resolveWalls(pos);

    if (pos.y < VOID_Y){
      pos.copy(respawnPos);
      velY = 0;
      grounded = true;
      curSpeed.set(0,0);
    }

    if (grounded) coyoteTimer = 0.12; else coyoteTimer = Math.max(0, coyoteTimer - dt);
    if (wallJumpCooldown > 0) wallJumpCooldown = Math.max(0, wallJumpCooldown - dt);
    if (jumpBufferTimer > 0) jumpBufferTimer = Math.max(0, jumpBufferTimer - dt);
    if ((grounded || coyoteTimer > 0) && (jumpHeld || jumpBufferTimer > 0)){
      velY = JUMP_VEL;
      grounded = false;
      jumpBufferTimer = 0;
      coyoteTimer = 0;
    }

    const speedMag = Math.hypot(curSpeed.x, curSpeed.y);
    if (speedMag > 0.4){
      if (shiftLock){
        facing = camYaw;
      } else {
        const targetFacing = Math.atan2(curSpeed.x, curSpeed.y);
        let diff = targetFacing - facing;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        facing += diff * Math.min(1, 12*dt);
      }
    } else if (shiftLock){
      facing = camYaw;
    }

    character.position.set(pos.x, pos.y, pos.z);
    character.rotation.y = facing;
    shadowBlob.position.set(pos.x, Math.max(pos.y-6, -19.5)+0.02, pos.z);
    shadowBlob.scale.setScalar(Math.max(0.35, 1 - Math.min(pos.y,6)*0.14));

    if (speedMag > 0.4 && grounded){
      const speedRatio = speedMag / WALK_SPEED;
      walkT += dt * (6.5 * speedRatio + 2.5);
      const swing = Math.sin(walkT) * (0.55 + speedRatio*0.35);
      armL.rotation.x = swing; armR.rotation.x = -swing;
      legL.rotation.x = -swing; legR.rotation.x = swing;
      speedTag.textContent = '걷는 중';
    } else if (!grounded){
      if (velY > 2){
        armL.rotation.x = -0.25; armR.rotation.x = -0.25;
        legL.rotation.x = 0.35; legR.rotation.x = 0.35;
      } else {
        const fallT = Math.min(1, Math.abs(velY) / 20);
        armL.rotation.x = -0.25 - fallT*0.75;
        armR.rotation.x = -0.25 - fallT*0.75;
        legL.rotation.x = 0.1; legR.rotation.x = -0.1;
      }
      speedTag.textContent = velY > 2 ? '점프!' : '낙하 중';
    } else {
      armL.rotation.x *= 0.85; armR.rotation.x *= 0.85;
      legL.rotation.x *= 0.85; legR.rotation.x *= 0.85;
      speedTag.textContent = finished ? '완주!' : '대기';
    }

    const camPivot = new THREE.Vector3(pos.x, pos.y + 2.2, pos.z);
    const camDir = new THREE.Vector3(
      -Math.sin(camYaw) * Math.cos(camPitch),
      Math.sin(camPitch),
      -Math.cos(camYaw) * Math.cos(camPitch)
    );
    let effectiveDist = camDist;
    camRaycaster.set(camPivot, camDir);
    camRaycaster.far = camDist + 0.5;
    const hits = camRaycaster.intersectObjects(collidableMeshes, false);
    if (hits.length > 0){
      effectiveDist = Math.max(1.5, hits[0].distance - 0.4);
    }
    const targetCamPos = camPivot.clone().addScaledVector(camDir, effectiveDist);
    camera.position.copy(targetCamPos);
    camera.lookAt(pos.x, pos.y + 2.0, pos.z);

    if (!finished){
      timerTag.textContent = fmtTime(performance.now() - startTime);
    }

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
