<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>미믹 — 요괴의 기억</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+KR:wght@400;700;900&display=swap">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e8e0d4;font-family:'Noto Serif KR','Malgun Gothic',serif;touch-action:none}
#c{display:block;width:100%;height:100%}
.brush{font-family:'Yuji Syuku','Noto Serif KR',serif}
.hide{display:none!important}
/* 화면 효과 */
#grain{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.07;mix-blend-mode:screen;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.92) 100%)}
#danger{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 40%,rgba(140,0,0,.55) 100%);transition:opacity .3s}
#fade{position:fixed;inset:0;pointer-events:none;z-index:40;background:#000;opacity:1;transition:opacity 1.2s}
#flash{position:fixed;inset:0;pointer-events:none;z-index:41;background:#fff;opacity:0}
#scare{position:fixed;inset:0;pointer-events:none;z-index:42;display:none;background:#000}
#scare canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#death{position:fixed;inset:0;z-index:43;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:18px}
#death b{font-size:min(38vw,260px);color:#7a0000;line-height:1;text-shadow:0 0 30px rgba(255,0,0,.35);animation:dth 3s ease-out}
#death span{font-size:15px;color:#8a7f72;letter-spacing:.3em}
#death button{margin-top:10px}
@keyframes dth{0%{opacity:0;transform:scale(1.4)}20%{opacity:1}100%{transform:scale(1)}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#obj{position:absolute;top:18px;left:22px;max-width:46vw}
#obj small{display:block;font-size:11px;letter-spacing:.35em;color:#8a7f72;margin-bottom:4px}
#obj b{font-size:clamp(15px,2vw,20px);font-weight:400;color:#e8e0d4;text-shadow:0 0 8px #000,0 0 2px #000}
#obj i{display:block;font-style:normal;font-size:12px;color:#b8a990;margin-top:4px;text-shadow:0 0 6px #000}
#chap{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 1.6s}
#chap.on{opacity:1}
#chap b{font-size:clamp(40px,8vw,92px);color:#e8e0d4;font-weight:400;text-shadow:0 0 30px rgba(0,0,0,.9)}
#chap span{font-size:15px;letter-spacing:.5em;color:#a08a6a;margin-top:10px}
#sub{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);text-align:center;max-width:84vw;opacity:0;transition:opacity .5s}
#sub.on{opacity:1}
#sub b{display:block;font-size:clamp(17px,2.4vw,26px);font-weight:400;color:#f0e6d8;text-shadow:0 0 10px #000,0 0 3px #000}
#sub span{display:block;font-size:13px;color:#b4a48c;margin-top:4px;text-shadow:0 0 6px #000}
#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:14px;color:#efe4d2;text-shadow:0 0 6px #000;opacity:0;transition:opacity .2s;white-space:nowrap}
#prompt.on{opacity:1}
#prompt kbd{display:inline-block;border:1px solid rgba(239,228,210,.6);border-radius:3px;padding:0 6px;margin-right:6px;font-family:inherit;font-size:12px}
#hold{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:120px;height:3px;background:rgba(255,255,255,.15);opacity:0}
#hold i{display:block;height:100%;width:0;background:#e8c48a}
#dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(232,224,212,.55)}
#inv{position:absolute;right:20px;bottom:22px;display:flex;gap:8px}
#inv div{width:44px;height:44px;border:1px solid rgba(232,224,212,.25);background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:24px;color:#e8d0a0}
#bars{position:absolute;left:22px;bottom:22px;display:flex;flex-direction:column;gap:6px;width:140px}
#bars div{height:3px;background:rgba(255,255,255,.12)}
#bars i{display:block;height:100%;background:#cdbb9a;transition:width .1s}
#bars em{font-style:normal;font-size:10px;letter-spacing:.25em;color:#8a7f72}
#hideView{position:fixed;inset:0;z-index:7;pointer-events:none;display:none;background:linear-gradient(90deg,#000 0,#000 calc(50% - 46px),transparent calc(50% - 30px),transparent calc(50% + 30px),#000 calc(50% + 46px),#000 100%)}
#breath{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);width:200px;display:none;text-align:center;font-size:12px;letter-spacing:.2em;color:#cdbb9a}
#breath div{height:4px;margin-top:6px;background:rgba(255,255,255,.12)}#breath i{display:block;height:100%;background:#cdbb9a}
#note{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78)}
#note .pp{width:min(460px,88vw);padding:34px 30px;background:#d9cdb4;color:#2a2018;box-shadow:0 0 60px rgba(0,0,0,.9);font-size:15px;line-height:1.9;position:relative;background-image:radial-gradient(ellipse at 30% 20%,rgba(120,80,40,.18),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(90,50,20,.22),transparent 55%)}
#note .pp h3{font-family:'Yuji Syuku',serif;font-weight:400;font-size:24px;margin-bottom:12px;color:#5a1010}
#note .pp p{white-space:pre-line}
#note .pp small{display:block;margin-top:18px;font-size:11px;color:#6a5a48;letter-spacing:.2em}
/* 타이틀 */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;overflow:hidden}
#title canvas{position:absolute;inset:0;width:100%;height:100%}
#tInner{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
#tKanji{font-size:clamp(70px,14vw,170px);line-height:1;color:#d8ccb8;text-shadow:0 0 40px rgba(160,0,0,.5);letter-spacing:.05em}
#tName{font-size:clamp(18px,3vw,28px);letter-spacing:.8em;color:#9a2a20;margin-left:.8em}
#tSub{font-size:13px;letter-spacing:.4em;color:#6a6058;margin-top:6px}
.btn{pointer-events:auto;border:1px solid rgba(232,224,212,.35);background:rgba(0,0,0,.4);color:#e8e0d4;font-family:inherit;font-size:15px;letter-spacing:.3em;padding:12px 34px;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{background:rgba(120,10,10,.35);border-color:rgba(200,60,40,.7)}
#tBtns{display:flex;flex-direction:column;gap:10px;margin-top:34px;align-items:center}
#tWarn{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11px;color:#5a524a;letter-spacing:.15em;line-height:1.8}
#tHub{position:absolute;top:16px;left:18px;font-size:12px;color:#6a6058;text-decoration:none;letter-spacing:.2em;pointer-events:auto}
#keys{font-size:11px;color:#6a6058;letter-spacing:.12em;line-height:1.9;text-align:center;margin-top:16px}
#pause{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.82)}
#pause b{font-size:40px;font-weight:400;margin-bottom:10px}
/* 터치 */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none;display:none}
body.touch #touch{display:block}
#joy{position:absolute;left:0;bottom:0;width:40%;height:60%;pointer-events:auto}
#joyB{position:absolute;width:110px;height:110px;border-radius:50%;border:1px solid rgba(232,224,212,.25);display:none}
#joyS{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(232,224,212,.35)}
#look{position:absolute;right:0;top:0;width:60%;height:100%;pointer-events:auto}
.tb{position:absolute;width:62px;height:62px;border-radius:50%;border:1px solid rgba(232,224,212,.3);background:rgba(0,0,0,.35);color:#e8e0d4;display:flex;align-items:center;justify-content:center;font-size:12px;pointer-events:auto;text-align:center;line-height:1.1}
.tb.on{background:rgba(160,30,20,.45)}
#tE{right:24px;bottom:120px;width:70px;height:70px;font-size:14px}#tRun{right:110px;bottom:40px}#tCrouch{right:24px;bottom:34px}#tLamp{right:190px;bottom:60px}#tBreath{right:110px;bottom:130px}
#err{position:fixed;left:8px;bottom:8px;z-index:99;font-size:11px;color:#f88;white-space:pre-wrap;max-width:80vw}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="grain" width="420" height="260"></canvas>
<div id="vig"></div><div id="danger"></div>
<div id="hideView"></div>
<div id="hud" class="hide">
  <div id="obj"><small class="brush" id="objChap">第一章</small><b id="objT"></b><i id="objS"></i></div>
  <div id="dot"></div>
  <div id="prompt"></div><div id="hold"><i></i></div>
  <div id="sub"><b></b><span></span></div>

  <div id="inv"></div>
</div>
<div id="chap"><b class="brush"></b><span></span></div>
<div id="note"><div class="pp"><h3></h3><p></p><small>클릭하거나 E · ESC 로 닫기</small></div></div>

<div id="scare"><canvas id="scareC" width="900" height="900"></canvas></div>
<div id="death"><b class="brush">死</b><span id="deathT">들켰다</span><button class="btn" id="retry" type="button">다시 · 마지막 기억부터</button></div>
<div id="pause"><b class="brush">一時停止</b><button class="btn" id="pResume" type="button">계속</button><button class="btn" id="pTitle" type="button">처음 화면</button><a class="btn" href="hub.html" style="text-decoration:none">허브로</a></div>
<div id="title">
  <canvas id="tBg"></canvas>
  <a id="tHub" href="hub.html">← 허브</a>
  <div id="tInner">
    <div id="tKanji" class="brush">鬼隠し</div>
    <div id="tName" class="brush">ミミック</div>
    <div id="tSub">미믹 · 요괴의 기억 — 제1권</div>
    <div id="tBtns"><button class="btn" id="tStart" type="button">시작</button><button class="btn hide" id="tCont" type="button">이어하기</button></div>
    <div id="keys">WASD 이동 · 마우스 시점 · SHIFT 달리기 · C 웅크리기<br>F 등불 가리기 · E 줍기/숨기/열기 · 숨은 채로 SPACE 숨 참기 · ESC 일시정지</div>
  </div>
  <div id="tWarn">⚠ 이어폰을 끼고 불을 끄고 하세요 · 갑작스러운 소리와 무서운 장면이 나옵니다</div>
</div>
<div id="touch"><div id="joy"><div id="joyB"><div id="joyS"></div></div></div><div id="look"></div>
  <div class="tb" id="tE">E</div><div class="tb" id="tRun">달리기</div><div class="tb" id="tCrouch">웅크<br>리기</div><div class="tb" id="tLamp">등불</div><div class="tb" id="tBreath">숨<br>참기</div></div>
<div id="err"></div>
<script>window.addEventListener('error', e=>{ if (e.target && e.target !== window) return; document.getElementById('err').textContent = '⚠ ' + (e.message || '') + (e.lineno ? ' (line ' + e.lineno + ')' : ''); });</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// =====================================================================
//  미믹 — 요괴의 기억 (로블록스 The Mimic 을 따라 만든 일본풍 공포 게임)
//  제1장 대나무 숲(노페라보) → 제2장 저택(쿠치사케온나) → 제3장 복도(온료 추격) → 제4장 우물 아래(로쿠로쿠비)
// =====================================================================
const $ = id=>document.getElementById(id);
if (typeof THREE === 'undefined'){ $('err').textContent = 'three.js 를 못 불러왔어요. 인터넷 연결을 확인하고 새로고침하세요.'; return; }
const T = THREE, V = (x, y, z)=>new T.Vector3(x || 0, y || 0, z || 0), CL = (v, a, b)=>v < a ? a : v > b ? b : v, lerp = (a, b, t)=>a + (b - a)*t;
const rand = (a, b)=>a + Math.random()*(b - a), pick = a=>a[Math.floor(Math.random()*a.length)];
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window; if (isTouch) document.body.classList.add('touch');
const BRUSH = '"Yuji Syuku","Noto Serif KR",serif';

// ---------- 렌더러 ----------
const ren = new T.WebGLRenderer({ canvas:$('c'), antialias:!isTouch, powerPreference:'high-performance' });
ren.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.25 : 1.75)); ren.setSize(innerWidth, innerHeight);
ren.outputEncoding = T.sRGBEncoding; ren.toneMapping = T.ACESFilmicToneMapping; ren.toneMappingExposure = 1.05;
ren.shadowMap.enabled = true; ren.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene(); scene.background = new T.Color(0x000000); scene.fog = new T.FogExp2(0x05060a, .06);
const cam = new T.PerspectiveCamera(72, innerWidth/innerHeight, .05, 300); cam.rotation.order = 'YXZ'; scene.add(cam);
addEventListener('resize', ()=>{ cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });
// 레벨마다 갈아끼우는 루트
let LV = new T.Group(); scene.add(LV);
function clearLevel(){ scene.remove(LV); LV.traverse(o=>{ if (o.geometry && !o.geometry.userData.keep) o.geometry.dispose(); if (o.material){ const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m=>{ if (!m.userData.keep) m.dispose(); }); } }); LV = new T.Group(); scene.add(LV); SOL.length = 0; CIRC.length = 0; }

// ---------- 충돌 세계 (위에서 본 2D: 상자 + 원) ----------
const SOL = [];   // { x0, z0, x1, z1, door?, on }
const CIRC = [];  // { x, z, r }
function solidBox(x0, z0, x1, z1, o){ const s = Object.assign({ x0:Math.min(x0, x1), z0:Math.min(z0, z1), x1:Math.max(x0, x1), z1:Math.max(z0, z1), on:true }, o || {}); SOL.push(s); return s; }
function collideCircle(p, r){ // p: {x, z} 를 밀어낸다
  for (let it=0; it<2; it++){
    for (const s of SOL){ if (!s.on) continue; const cx = CL(p.x, s.x0, s.x1), cz = CL(p.z, s.z0, s.z1), dx = p.x - cx, dz = p.z - cz, d2 = dx*dx + dz*dz;
      if (d2 < r*r){ if (d2 > 1e-8){ const d = Math.sqrt(d2), k = (r - d)/d; p.x += dx*k; p.z += dz*k; }
        else { const l = p.x - s.x0, rr = s.x1 - p.x, u = p.z - s.z0, dd = s.z1 - p.z, m = Math.min(l, rr, u, dd); if (m === l) p.x = s.x0 - r; else if (m === rr) p.x = s.x1 + r; else if (m === u) p.z = s.z0 - r; else p.z = s.z1 + r; } } }
    for (const c of CIRC){ const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = r + c.r; if (d < m && d > 1e-6){ p.x = c.x + dx/d*m; p.z = c.z + dz/d*m; } } } }
// 선분이 막혔나 (시야)
function segBlocked(ax, az, bx, bz, ignoreDoors){ for (const s of SOL){ if (!s.on || (ignoreDoors && s.door) || s.low) continue; if (segAabb(ax, az, bx, bz, s)) return true; } return false; }
function segAabb(ax, az, bx, bz, s){ let t0 = 0, t1 = 1; const dx = bx - ax, dz = bz - az;
  for (const [p, d, lo, hi] of [[ax, dx, s.x0, s.x1], [az, dz, s.z0, s.z1]]){ if (Math.abs(d) < 1e-9){ if (p < lo || p > hi) return false; } else { let a = (lo - p)/d, b = (hi - p)/d; if (a > b){ const t = a; a = b; b = t; } t0 = Math.max(t0, a); t1 = Math.min(t1, b); if (t0 > t1) return false; } } return true; }

// ---------- 캔버스 텍스처 (일본풍) ----------
function cv(w, h, f){ const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); f(g, w, h); return c; }
function tex(c, rx, ry){ const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 8; if (rx){ t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx, ry || rx); } return t; }
const noiseDots = (g, w, h, n, col, a0, a1)=>{ for (let i=0;i<n;i++){ g.globalAlpha = rand(a0, a1); g.fillStyle = col; g.fillRect(Math.random()*w, Math.random()*h, rand(1, 3), rand(1, 3)); } g.globalAlpha = 1; };
const stain = (g, x, y, r, col, a)=>{ const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col.replace('A', a)); gr.addColorStop(1, col.replace('A', 0)); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
const TX = {};
function buildTextures(){
  // 다다미: 짚 결 + 검은 천 테두리
  TX.tatami = tex(cv(256, 512, (g, w, h)=>{ g.fillStyle = '#8f8a5a'; g.fillRect(0, 0, w, h); for (let y=0;y<h;y+=3){ g.fillStyle = `rgba(${60 + Math.random()*40},${60 + Math.random()*30},${20},${.25 + Math.random()*.2})`; g.fillRect(0, y, w, 1.4); }
    noiseDots(g, w, h, 1500, '#3a3420', .1, .3); stain(g, rand(40, 200), rand(80, 400), rand(30, 70), 'rgba(40,30,15,A)', .35); g.fillStyle = '#16120e'; g.fillRect(0, 0, 14, h); g.fillRect(w - 14, 0, 14, h); g.fillStyle = 'rgba(160,140,90,.25)'; for (let y=0;y<h;y+=8){ g.fillRect(3, y, 8, 2); g.fillRect(w - 11, y, 8, 2); } }));
  // 마루 (나무 판자)
  TX.wood = tex(cv(256, 256, (g, w, h)=>{ for (let i=0;i<4;i++){ const y = i*64; g.fillStyle = ['#3a2616', '#33210f', '#3d2818', '#2e1d10'][i]; g.fillRect(0, y, w, 64); for (let k=0;k<30;k++){ g.strokeStyle = `rgba(20,10,4,${rand(.1, .35)})`; g.lineWidth = rand(.5, 1.5); g.beginPath(); const yy = y + rand(4, 60); g.moveTo(0, yy); g.bezierCurveTo(80, yy + rand(-4, 4), 170, yy + rand(-4, 4), w, yy + rand(-3, 3)); g.stroke(); } g.fillStyle = '#120a05'; g.fillRect(0, y, w, 2); }
    noiseDots(g, w, h, 800, '#000', .1, .3); }), 1, 1);
  // 회벽 (얼룩 · 금 · 손자국)
  TX.plaster = tex(cv(256, 256, (g, w, h)=>{ g.fillStyle = '#b9ab90'; g.fillRect(0, 0, w, h); noiseDots(g, w, h, 3000, '#6a5a44', .05, .2); for (let i=0;i<5;i++) stain(g, rand(0, w), rand(0, h), rand(30, 90), 'rgba(70,52,30,A)', rand(.15, .35));
    for (let i=0;i<4;i++){ g.strokeStyle = 'rgba(40,30,20,.5)'; g.lineWidth = 1; g.beginPath(); let x = rand(0, w), y = rand(0, h); g.moveTo(x, y); for (let k=0;k<8;k++){ x += rand(-14, 14); y += rand(4, 16); g.lineTo(x, y); } g.stroke(); }
    const lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, 'rgba(30,20,10,.25)'); lg.addColorStop(.3, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(30,20,10,.35)'); g.fillStyle = lg; g.fillRect(0, 0, w, h); }), 1, 1);

// ---------- 격자 맵 (저택 · 복도) ----------
// '#' 벽 · '.' 다다미 · '=' 마루 · 'D' 장지문 · 'F' 후스마 · 'C' 벽장(숨는 곳) · 'Y' 안뜰(빛나는 장지 벽)
// 'B' 불단 · 'L' 등 · '1''2''3' 물건 · 'N' 쪽지 · 'S' 시작 · 'K' 요괴 시작 · 'W' 우물 · 'X' 숨은 문
function parseGrid(rows){ const H = rows.length, W = Math.max(...rows.map(r=>r.length)); const at = (x, y)=>x < 0 || y < 0 || y >= H || x >= W ? '#' : (rows[y][x] || '#'); return { W, H, at, rows }; }
const WALL_H = 3.0;
function buildGrid(rows, S, opt){ opt = opt || {}; const G = parseGrid(rows); G.S = S; G.doors = []; G.closets = []; G.marks = {}; G.lamps = [];
  const wx = x=>(x + .5)*S, wz = y=>(y + .5)*S; G.wx = wx; G.wz = wz;
  const solidCh = c=>c === '#' || c === 'Y' || c === 'C' || c === 'B' || c === 'X';
  G.walk = (x, y)=>{ const c = G.at(x, y); return !solidCh(c); };
  for (let y=0; y<G.H; y++) for (let x=0; x<G.W; x++){ const c = G.at(x, y), X = wx(x), Z = wz(y);
    if (c === '#' || c === 'X'){ const hand = Math.random() < .08; const geo = uvScale(BOX(S, WALL_H, S), S/2.4, WALL_H/2.4); addMerged(geo, hand ? MAT.plasterHand : MAT.plaster, X, WALL_H/2, Z);
      // 아래 · 위 나무 띠 (나게시)
      addMerged(BOX(S + .02, .12, S + .02), MAT.beam, X, .06, Z); addMerged(BOX(S + .02, .16, S + .02), MAT.beam, X, WALL_H - .5, Z);
      const sb = solidBox(X - S/2, Z - S/2, X + S/2, Z + S/2); if (c === 'X'){ G.marks.X = { x, y, sb }; } continue; }
    if (c === 'Y'){ const geo = BOX(S, WALL_H, S); addMerged(geo, MAT.shojiGlow, X, WALL_H/2, Z); solidBox(X - S/2, Z - S/2, X + S/2, Z + S/2); continue; }
    // 바닥 · 천장
    const fl = c === '.' || c === 'C' || c === '1' || c === '2' || c === '3' || c === 'N' && opt.tatamiNotes ? 'tatami' : 'wood';

function mansionTick(dt){ const G = GAME.G; doorsTick(G, dt); mansionEvents(dt); for (const l of G.lamps){ l.L.intensity = l.dead ? Math.max(0, l.L.intensity - dt*2) : l.base*(.82 + Math.sin(GAME.t*9 + l.ph)*.07 + Math.sin(GAME.t*23 + l.ph)*.05 + (Math.random() < .01 ? -.5 : 0)); }

function chaseMap(){ const W = 28, H = 13, g = Array.from({ length:H }, ()=>Array(W).fill('#')); const f = (x0, y0, x1, y1, c)=>{ for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) g[y][x] = c; }, s = (x, y, c)=>{ g[y][x] = c; };

function buildChase(){ scene.background = new T.Color(0); scene.fog = new T.FogExp2(0x000000, .085); P.surface = 'wood'; LV.add(new T.HemisphereLight(0x302020, 0x050303, .1));

function buildCave(){ scene.background = new T.Color(0); scene.fog = new T.FogExp2(0x030204, .055); P.surface = 'stone'; LV.add(new T.HemisphereLight(0x302838, 0x060404, .12)); GAME.G = null;

    addInter({ pos:V(x, 1.2, z), r:2.2, hold:3, label:'부적 태우기', cond:()=>!al.lit, onHold:dt=>{ if (Math.random() < dt*10) noise(.06, 3000, 1500, 'bandpass', .1, { pos:V(x, 1.2, z) }); }, use:()=>burnAltar(al) }); });

  setObj('第四章 · 井戸の底', '제단 네 곳의 부적 태우기  (0 / 4)', '붉은 시선에 닿지 마 — 기둥 뒤에 숨어'); }
function burnAltar(al){ al.lit = true; GAME.bossLit++; al.of.visible = false; const L = new T.PointLight(0xff9a40, 1.4, 8, 2); L.position.set(al.x, 1.6, al.z); LV.add(L); al.L = L; flash(.4); bell(.5, { f:56 }); scream(.35);
  const m = GAME.roku; m.gaze = 0; setObj('第四章 · 井戸の底', '제단 네 곳의 부적 태우기  (' + GAME.bossLit + ' / 4)', GAME.bossLit >= 3 ? '하나 남았다' : '그것이 더 화가 났다');

function caveTick(dt){ const m = GAME.roku; $('danger').style.opacity = Math.max(0, (+$('danger').style.opacity || 0) - dt*.8);

const CHAPTERS = { 1:{ k:'第一章　竹の森', s:'제1장 · 대나무 숲', build:buildForest, tick:forestTick, intro:()=>{ setObj('第一章 · 竹の森', '길을 따라 신사로 올라가기', '등불을 들고'); later(()=>sub('…여기가 어디지?', '유이 목소리가… 숲 위쪽 신사에서 들렸어.', 4), 4200); } },
  2:{ k:'第二章　屋敷', s:'제2장 · 할머니의 저택', build:buildMansion, tick:mansionTick, intro:()=>{ const n = (GAME.prog.items || []).length; setObj('第二章 · 屋敷', '빗 · 거울 · 비녀 찾기  (' + n + ' / 3)', '쪽지를 읽어 봐 · 문은 E'); if (!n) later(()=>sub('…아무도 없나요?', '비가 지붕을 두드린다. 집 안 어딘가에서 물건이 떨어지는 소리.', 4.5), 4200); } },

// ---------- 타이틀 화면 (빗속의 붉은 달 + 붓글씨) ----------
const tb = $('tBg'), tg = tb.getContext('2d'); const drops = Array.from({ length:160 }, ()=>({ x:Math.random(), y:Math.random(), v:rand(.6, 1.4) }));

(async ()=>{ try { await Promise.race([document.fonts.load('60px "Yuji Syuku"', '封鬼呪急'), new Promise(r=>later(r, 2500))]); } catch(e){} buildTextures(); buildMaterials(); requestAnimationFrame(frame); })();
window.__MM = { FACE, SIM, step(n, dt){ for (let i=0;i<n;i++){ logic(dt || 1/30); cam.updateMatrixWorld(); } }, TOUCH, interactPress, interactRelease, useInter, ITEMS, GAME, P, MON, startChapter, INTER, get G(){ return GAME.G; }, cam, scene, KEYS, hide, unhide, setPause, CIRC, SOL };
