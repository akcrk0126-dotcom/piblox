<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>울트라 RNG</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#05040c; font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas#c{ display:block; width:100%; height:100%; }
  .ol{ text-shadow:0 2px 0 rgba(0,0,0,.45), 0 0 6px rgba(0,0,0,.35); }
  button{ font:inherit; color:#fff; background:rgba(36,30,62,.92); border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:8px 14px; cursor:pointer; }
  button:hover{ border-color:#9b7bff; } button:disabled{ opacity:.45; cursor:not-allowed; } button.on{ background:#9b7bff; border-color:#9b7bff; }
  #hud{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  #hud > *{ pointer-events:auto; }
  #title{ position:absolute; top:12px; left:50%; transform:translateX(-50%); font-size:22px; font-weight:900; letter-spacing:3px; white-space:nowrap; pointer-events:none!important; }
  #title span{ background:linear-gradient(90deg,#ff5f8f,#ffd36b,#7bffb1,#6bd6ff,#c27bff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #info{ position:absolute; top:12px; right:12px; padding:6px 12px; border-radius:8px; background:rgba(18,18,21,.6); font-size:13px; font-weight:700; pointer-events:none!important; }
  #rightBtns{ position:absolute; top:48px; right:12px; display:flex; gap:6px; }
  #skipAnim{ display:none; font-weight:800; }
  #side{ position:absolute; top:90px; right:12px; width:320px; max-width:calc(100% - 24px); max-height:calc(100% - 330px); min-height:200px; background:rgba(12,10,24,.86); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px; display:none; flex-direction:column; backdrop-filter:blur(8px); }
  #side.open{ display:flex; }
  .tabs{ display:flex; gap:6px; margin-bottom:10px; } .tabs button{ flex:1; padding:7px 4px; font-size:13px; }
  .list{ display:flex; flex-direction:column; gap:6px; overflow:auto; padding-right:4px; }
  .item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:rgba(36,30,62,.92); border:1px solid transparent; }
  .item.eq{ border-color:#9b7bff; box-shadow:0 0 10px rgba(155,123,255,.4); }
  .dot{ width:14px; height:14px; border-radius:50%; flex:none; }
  .item .nm{ flex:1; min-width:0; } .item .nm b{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .item .nm small{ color:#a49fc4; }
  .item button{ padding:5px 10px; font-size:12px; }
  .locked{ opacity:.45; }
  #log{ position:absolute; top:90px; right:12px; width:250px; font-size:12px; text-align:right; pointer-events:none!important; }
  #side.open ~ #log{ display:none; }
  #log div{ padding:2px 0; }
  #bottom{ position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:7px; width:min(560px, calc(100% - 24px)); pointer-events:none!important; }
  #bottom > *{ pointer-events:auto; }
  #lastName{ font-size:30px; font-weight:900; text-align:center; min-height:38px; letter-spacing:1px; pointer-events:none!important; }
  #lastOdds,#statLine,#keys{ font-size:12px; color:#ddd; pointer-events:none!important; text-align:center; }
  #keys{ font-size:11px; color:#aaa; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .small button{ font-size:12px; padding:6px 10px; }
  #rollBtn{ font-size:21px; font-weight:900; letter-spacing:2px; padding:12px 50px; background:linear-gradient(135deg,#6a3dff,#d14dff); border:none; box-shadow:0 0 22px rgba(160,90,255,.6); }
  #luckBar{ width:100%; max-width:300px; height:5px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; pointer-events:none!important; }
  #luckFill{ height:100%; background:linear-gradient(90deg,#4dd6ff,#c27bff); width:0; transition:width .2s; }
  #msg{ position:absolute; left:50%; top:30%; transform:translateX(-50%); font-size:26px; font-weight:900; opacity:0; transition:opacity .25s; white-space:nowrap; pointer-events:none!important; }
  #quote{ position:fixed; left:50%; top:20%; transform:translateX(-50%); z-index:8; font-size:18px; letter-spacing:6px; font-weight:800; pointer-events:none; opacity:0; transition:opacity .4s; white-space:nowrap; }
  #flash{ position:fixed; inset:0; pointer-events:none; z-index:50; opacity:0; background:#fff; }
  #cut{ position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:flex-end; padding-bottom:13vh; flex-direction:column; overflow:hidden; cursor:pointer; }
  body.cine #hud{ opacity:0; pointer-events:none; } body.cine #hud > *{ pointer-events:none!important; }
  #cutBg{ position:absolute; inset:0; opacity:0; transition:opacity .5s; }
  #cutRays{ position:absolute; left:50%; top:50%; width:260vmax; height:260vmax; margin:-130vmax 0 0 -130vmax; opacity:0; transition:opacity .6s; animation:raySpin 9s linear infinite; mix-blend-mode:screen;
    -webkit-mask-image:radial-gradient(circle,transparent 0,transparent 9vmax,#000 30vmax); mask-image:radial-gradient(circle,transparent 0,transparent 9vmax,#000 30vmax); }
  #cut.show #cutRays{ opacity:.8!important; } #cutRays.fast{ animation-duration:4.5s; }
  @keyframes raySpin{ to{ transform:rotate(360deg); } }
  #cutLabel{ position:relative; font-size:16px; letter-spacing:8px; font-weight:800; opacity:0; transform:translateY(16px); transition:all .5s; }
  #cutTitle{ position:relative; font-size:clamp(36px,8.5vw,104px); font-weight:900; letter-spacing:5px; text-align:center; opacity:0; transform:scale(.4) rotate(-6deg); transition:all .6s cubic-bezier(.2,1.5,.4,1); padding:0 12px; }
  #cutOdds{ position:relative; font-size:18px; color:#eee; opacity:0; transition:opacity .5s; margin-top:8px; text-shadow:0 0 8px #000; }
  #cut.show #cutLabel,#cut.show #cutOdds{ opacity:1; transform:none; } #cut.show #cutTitle{ opacity:1; transform:none; }
  #cut.pulse #cutTitle{ animation:titlePulse 1.3s ease-in-out infinite; } @keyframes titlePulse{ 50%{ transform:scale(1.06); } }
  #cutHint{ position:absolute; bottom:22px; font-size:12px; color:#bbb; }
  /* 모바일: 왼쪽 조이스틱 · 오른쪽 시점 드래그 · 점프 */
  #joy{ position:absolute; left:0; bottom:0; width:45%; height:60%; }
  #look{ position:absolute; right:0; top:0; width:55%; height:100%; }
  #joyB{ position:absolute; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.4); display:none; }
  #joyS{ position:absolute; left:31px; top:31px; width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.85); }
  #bJump{ position:absolute; right:20px; bottom:170px; width:72px; height:72px; border-radius:50%; border:2px solid rgba(255,255,255,.35); background:rgba(30,30,30,.45); display:flex; align-items:center; justify-content:center; font-size:26px; }
  body:not(.touch) #joy, body:not(.touch) #look, body:not(.touch) #bJump{ display:none; }
  body.touch #keys, body.touch #log{ display:none; }
  @media (max-width:700px){ #lastName{ font-size:22px; min-height:28px; } #rollBtn{ padding:10px 34px; font-size:18px; } #title{ font-size:16px; top:14px; } #side{ max-height:calc(100% - 300px); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="quote"></div>
<div id="cut"><div id="cutBg"></div><div id="cutRays"></div><div id="cutLabel"></div><div id="cutTitle"></div><div id="cutOdds"></div><div id="cutHint">클릭해서 넘기기</div></div>
<div id="hud">
  <div id="joy"><div id="joyB"><div id="joyS"></div></div></div>
  <div id="look"></div>
  <div id="title" class="ol">ULTRA <span>RNG</span></div>
  <div id="info">불러오는 중…</div>
  <div id="rightBtns"><button id="skipAnim">SKIP ▶▶</button><button id="bagBtn">🎒 가방</button></div>
  <div id="side">
    <div class="tabs"><button data-tab="inv" class="on">인벤토리</button><button data-tab="index">도감</button><button data-tab="rank">랭킹</button><button data-tab="info">정보</button></div>
    <div class="list" id="listBox"></div>
  </div>
  <div id="log" class="ol"></div>
  <div id="msg" class="ol"></div>
  <div id="bottom">
    <div id="lastName"></div>
    <div id="lastOdds" class="ol"></div>
    <button id="rollBtn">ROLL</button>
    <div id="luckBar"><div id="luckFill"></div></div>
    <div id="statLine" class="ol"></div>
    <div class="row small"><button id="autoBtn">자동: OFF</button><button id="fastBtn">빠른 굴리기: OFF</button><button id="soundBtn">소리: ON</button></div>
    <div id="keys" class="ol">WASD 이동 · Space 점프 · 오른쪽 드래그 시점 · 휠 줌 · R 굴리기 · F 자동 · B 가방 · / 채팅 · . 이모트</div>
  </div>
  <div id="bJump">⬆</div>
</div>

<script>
(function(){
'use strict';
/* =====================================================================
   울트라 RNG — Ultra Gacha 의 별 소환 연출 + 3D 셰이더 오라 + piblox 멀티
   ===================================================================== */
const GAME_ID = 'ultrarng';
const THREE = window.THREE;
const MP = window.MP || null;
const mpOn = !!(MP && MP.isConfigured && MP.isConfigured() && !window.__mpFail && window.firebase);
const $ = id => document.getElementById(id);
const clamp = (v, a, b)=> v < a ? a : v > b ? b : v, lerp = (a, b, t)=> a + (b - a)*t;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0; if (isTouch) document.body.classList.add('touch');
const fmt = n => Number(n).toLocaleString('ko-KR');
const sleep = ms => new Promise(r=>setTimeout(r, ms));

// =====================================================================
//  등급표 (Ultra Gacha 기준, chance = %)
// =====================================================================
const POOL = [
  ["Common",25.7912,"#888888"],["Uncommon",17.5184,"#4caf50"],["Rare",11.6789,"#2196f3"],["Polished",8.2726,"#00bcd4"],
  ["Gilded",5.8395,"#ffc107"],["Epic",6.8127,"#9c27b0"],["Refined",5.1582,"#7c4dff"],["Arcane",3.6983,"#00bfa5"],
  ["Mythic",3.6983,"#ff9800"],["Legendary",2.7251,"#ffd700"],["Sentinel",1.8492,"#ffd54f"],["Vanguard",1.7518,"#ff6f00"],
  ["Beast",1.2652,"#ff3d00"],["Nightshade",0.8759,"#ff1744"],["Phantom",0.7299,"#7e57c2"],["Celestial",0.5353,"#00e5ff"],
  ["Frostbound",0.3893,"#4dd0e1"],["Wraithlord",0.3406,"#d500f9"],["Cosmic",0.2628,"#651fff"],["Solflare",0.1946,"#e040fb"],
  ["Stormcaller",0.1557,"#29b6f6"],["Ultra",0.1168,"#ff5252"],["Eclipse",0.0876,"#37474f"],["Voidwalker",0.0681,"#1a237e"],
  ["Hyper",0.0487,"#00ff9d"],["Seraphic",0.0389,"#69f0ae"],["Astral Monarch",0.0292,"#f48fb1"],["Infinity",0.0195,"#ffffff"],
  ["Dreadlord",0.0146,"#fce4ec"],["Genesis",0.0117,"#ffeb3b"],["ETERNAL DESTROYER",0.0078,"#ff00ff"],["PRIME ARCHITECT",0.0058,"#ffd700"],
  ["VOID SOVEREIGN",0.0039,"#e0e0ff"],["CHRONO OVERLORD",0.0024,"#00e5ff"],["ABSOLUTE ZERO",0.0015,"#ffffff"],["Quantum Reaper",0.00095,"#7c1fa2"],
  ["World Eater",0.0006,"#b71c1c"],["Singularity",0.00038,"#4a0072"],["Omniscient",0.00024,"#fff59d"],["Paradox",0.00015,"#e040fb"],
  ["Demiurge",0.0001,"#fffde7"],["Akashic Lord",0.00006,"#1a237e"],["Transcendent",0.00004,"#ffffff"],["Primordial",0.000025,"#3e0000"],
  ["GOD EMPEROR",0.000015,"#ffd700"],
].map(([name, chance, color], tier)=>({ name, chance, color, tier, odds:Math.round(100/chance) }));
const MAXT = POOL.length - 1;
const ACCENT = {22:'#ff9100',23:'#7c4dff',28:'#ff1744',31:'#ffffff',32:'#651fff',34:'#4dd0e1',35:'#00e5ff',36:'#ff9100',37:'#ff00ff',38:'#ffffff',40:'#ffd700',41:'#ffd700',43:'#ff3d00',44:'#ff6d00'};
const DARK = new Set([22,23,37,41,43]);
const RAINBOW = {27:1,30:.5,39:.6,42:1,44:.35};
const RB_CSS = 'linear-gradient(90deg,#ff5f8f,#ffd36b,#7bffb1,#6bd6ff,#c27bff)';
const STAR_DURATION = [900,900,900,950,1000,1050,1100,1150,1200,1300,1400,1500,1600,1750,1900,2100,2300,2500,2700,2900,3100,3300,3500,3700,3900,4100,4300,4500,4700,4900,5100,5300,5500,5700,6000,6300,6600,7000,7400,7800,8200,8600,9000,9400,9800];
const QUOTES = { low:['...','무언가 나타난다','희미한 빛'], mid:['강한 기운이 느껴진다','소환의 문이 열린다','운명이 흔들린다'], high:['세상이 진동한다','신의 이름으로','빛이 폭발한다','당신은 선택받았다'], ultra:['현실이 붕괴된다','이것은... 불가능해','전설이 강림한다','우주가 경배한다'] };
const getQuote = t=>{ const l = t>=30 ? QUOTES.ultra : t>=20 ? QUOTES.high : t>=13 ? QUOTES.mid : QUOTES.low; return l[Math.floor(Math.random()*l.length)]; };
const mainCol = it => DARK.has(it.tier) ? ACCENT[it.tier] : it.color;
const ANNOUNCE_TIER = 13;   // 이 등급 이상이면 같은 방 사람들에게 알림

// =====================================================================
//  저장
// =====================================================================
const SAVE_KEY = 'ultrarng_save_v1';
let S = { rolls:0, inv:{}, equipped:null, best:null, auto:false, fast:false, sound:true, rareSeq:0, lastRare:-1 };
try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d) S = Object.assign(S, d); } catch(e){}
S.auto = false;
const save = ()=>{ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} };

function paintText(el, it, glow){
  if ((RAINBOW[it.tier]||0) >= .9){ el.style.background = RB_CSS; el.style.webkitBackgroundClip = 'text'; el.style.backgroundClip = 'text'; el.style.color = 'transparent'; }
  else { el.style.background = 'none'; el.style.color = mainCol(it); }
  el.style.textShadow = glow === false ? 'none' : `0 0 18px ${mainCol(it)}, 0 2px 6px #000`;
}

// =====================================================================
//  소리 (Ultra Gacha 스타일 드론 + 버스트)
// =====================================================================
let actx = null;
function ac(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} return actx; }
function starSound(tier, phase, durMs){
  if (!S.sound) return;
  try {
    const ctx = ac(); if (!ctx) return; const now = ctx.currentTime, osc = ctx.createOscillator(), gain = ctx.createGain(), f = ctx.createBiquadFilter();
    osc.connect(f); f.connect(gain); gain.connect(ctx.destination); f.type = 'lowpass';
    if (phase === 'spin'){
      const d = durMs/1000, b = 60 + tier*4;
      osc.type = 'sine'; osc.frequency.setValueAtTime(b, now); osc.frequency.linearRampToValueAtTime(b*2.5, now + d);
      gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(.12, now + .3); gain.gain.linearRampToValueAtTime(.18, now + d*.7); gain.gain.linearRampToValueAtTime(0, now + d);
      f.frequency.setValueAtTime(300 + tier*30, now); f.frequency.linearRampToValueAtTime(4000, now + d);
      osc.start(now); osc.stop(now + d);
    } else {
      const fr = tier>=30 ? 80 : tier>=20 ? 120 : 200;
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(fr*3, now); osc.frequency.exponentialRampToValueAtTime(fr, now + .4);
      gain.gain.setValueAtTime(tier>=20 ? .4 : .25, now); gain.gain.exponentialRampToValueAtTime(.001, now + .6);
      f.frequency.setValueAtTime(2000, now); f.frequency.exponentialRampToValueAtTime(200, now + .4);
      osc.start(now); osc.stop(now + .6);
      if (tier >= 9){ const o2 = ctx.createOscillator(), g2 = ctx.createGain(); o2.connect(g2); g2.connect(ctx.destination);
        o2.type = 'sine'; o2.frequency.setValueAtTime(1800 + tier*50, now); o2.frequency.exponentialRampToValueAtTime(800, now + .5);
        g2.gain.setValueAtTime(.15, now); g2.gain.exponentialRampToValueAtTime(.001, now + .5); o2.start(now); o2.stop(now + .5); }
    }
  } catch(e){}
}

// =====================================================================
//  렌더러 · 장면 · 블룸
// =====================================================================
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:!isTouch, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 1.75));
renderer.shadowMap.enabled = !isTouch; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (MP && MP.hookRenderer) MP.hookRenderer(renderer);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0820, 0.012);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000); scene.add(camera);
let composer = null, bloom = null;
const postOK = !window.__postfxFail && THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass && THREE.ShaderPass;
if (postOK){
  const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat, type:THREE.HalfFloatType });
  composer = new THREE.EffectComposer(renderer, rt);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), .85, .5, .82);
  composer.addPass(bloom);
  // 마지막: 밝은 오라가 하얗게 날아가지 않게 ACES 톤매핑
  composer.addPass(new THREE.ShaderPass({ uniforms:{ tDiffuse:{ value:null } },
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'uniform sampler2D tDiffuse;varying vec2 vUv;vec3 aces(vec3 x){x*=1.15;return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}void main(){vec4 c=texture2D(tDiffuse,vUv);gl_FragColor=vec4(aces(c.rgb),1.);}' }));
}
function resize(){ renderer.setSize(innerWidth, innerHeight); if (composer) composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
resize(); addEventListener('resize', resize);

const hemi = new THREE.HemisphereLight(0x8a90ff, 0x1a1430, 0.5); scene.add(hemi);
const moon = new THREE.DirectionalLight(0xc8d0ff, 0.6); moon.position.set(-30, 60, 20); moon.castShadow = !isTouch;
moon.shadow.mapSize.set(2048, 2048); Object.assign(moon.shadow.camera, { left:-45, right:45, top:45, bottom:-45, near:1, far:160 });
scene.add(moon); scene.add(moon.target);

const GLSL_NOISE = `
float hash3(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*vnoise(p);p*=2.03;a*=.5;}return v;}
vec3 hsv2rgb(vec3 c){vec3 p=abs(fract(c.xxx+vec3(0.,2./3.,1./3.))*6.-3.);return c.z*mix(vec3(1.),clamp(p-1.,0.,1.),c.y);}
`;

// ---- 하늘 · 별 ----

function netSend(dt, extra){ if (!mpOn) return; sendT -= dt; if (sendT > 0) return; sendT = .1;

  const s = JSON.stringify(d), now = performance.now(); if (s === lastSent && now - lastSentAt < 5000) return; lastSent = s; lastSentAt = now; try { MP.update(JSON.parse(s)); } catch(e){ console.warn('[net]', e); } }
// 남에게 보낼 내 정보: 장착 오라, 최근 레어(등급 · 번호)
function myExtraData(){ return { au:S.equipped == null ? -1 : S.equipped, rl:S.lastRare, rs:S.rareSeq }; }

// =====================================================================
//  ⭐ Ultra Gacha 별 (카메라 앞 3D) — 처음 빠르게 → 점점 느려지며 커짐 → 사라짐
// =====================================================================
const starRig = new THREE.Group(); starRig.position.set(0, .2, -9); starRig.visible = false; camera.add(starRig);
const dim = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0, depthTest:false, depthWrite:false }));
dim.position.z = -1; dim.renderOrder = 20; starRig.add(dim);
const starMainMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, depthTest:false });
const starSubMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.55, depthTest:false });
const mkPoly = (pts, s)=>{ const sh = new THREE.Shape(); pts.forEach(([x, y], i)=> i ? sh.lineTo(x*s, -y*s) : sh.moveTo(x*s, -y*s)); sh.closePath(); return new THREE.ShapeGeometry(sh); };
const STAR_MAIN = [[0,-65],[8,-8],[65,0],[8,8],[0,65],[-8,8],[-65,0],[-8,-8]], STAR_SUB = [[0,-38],[5,-5],[38,0],[5,5],[0,38],[-5,5],[-38,0],[-5,-5]];
const starSpin = new THREE.Group(); starRig.add(starSpin);
const starMain = new THREE.Mesh(mkPoly(STAR_MAIN, 1.6/65), starMainMat); starMain.renderOrder = 22;
const starSub = new THREE.Mesh(mkPoly(STAR_SUB, 1.6/65), starSubMat); starSub.rotation.z = Math.PI/4; starSub.renderOrder = 23;
const starGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map:spriteTex, transparent:true, depthTest:false, blending:THREE.AdditiveBlending })); starGlow.scale.set(6, 6, 1); starGlow.renderOrder = 21;
starSpin.add(starMain, starSub); starRig.add(starGlow);
const sparkN = 80, sparkG = new THREE.BufferGeometry(); sparkG.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sparkN*3), 3));
const sparkMat = new THREE.PointsMaterial({ size:.18, map:spriteTex, transparent:true, depthTest:false, blending:THREE.AdditiveBlending });
const sparks = new THREE.Points(sparkG, sparkMat); sparks.renderOrder = 24; sparks.frustumCulled = false; starRig.add(sparks);
const sparkData = [...Array(sparkN)].map(()=>({ a:Math.random()*6.28, r:1 + Math.random()*2.5, v:.5 + Math.random()*2 }));
let starState = null, skipReq = false;
function starAnim(it){
  return new Promise(res=>{
    const dur = STAR_DURATION[Math.min(it.tier, STAR_DURATION.length - 1)]*(S.auto && it.tier < 9 ? .6 : 1);
    const col = new THREE.Color(mainCol(it));
    starMainMat.color.copy(col).multiplyScalar(2.2); starSubMat.color.copy(col).multiplyScalar(2.2); starGlow.material.color.copy(col).multiplyScalar(2); sparkMat.color.copy(col).multiplyScalar(2.5);
    starRig.visible = true; starSpin.rotation.z = 0; starMainMat.opacity = 1; starSubMat.opacity = .55;
    const q = it.tier >= 9 ? getQuote(it.tier) : ''; $('quote').textContent = q; $('quote').style.color = mainCol(it); $('quote').style.textShadow = `0 0 20px ${it.color}`;
    starSound(it.tier, 'spin', dur);
    starState = { it, dur, el:0, angle:0, res, fade:0, rainbow:RAINBOW[it.tier] || 0 };
  });
}
function tickStar(dt){
  if (!starState) return; const s = starState;
  if (skipReq && !s.fade){ endStar(); return; }
  if (s.fade){ s.fade -= dt; const o = Math.max(0, s.fade/.35); starMainMat.opacity = o; starSubMat.opacity = o*.55; starGlow.material.opacity = o*.8; sparkMat.opacity = o; dim.material.opacity = .55*o; if (s.fade <= 0) endStar(); return; }
  s.el += dt*1000; const p = Math.min(1, s.el/s.dur);
  const decel = Math.pow(1 - p, 3); s.angle += (.5 + decel*3.5)*60*dt;
  starSpin.rotation.z = -s.angle*Math.PI/180;
  const sc = 1 + (1 - Math.pow(1 - p, 2))*.35; starSpin.scale.setScalar(sc);
  const glow = p*p; starGlow.scale.setScalar(4 + glow*10); starGlow.material.opacity = .25 + glow*.75;
  if (s.rainbow){ const c = new THREE.Color().setHSL((s.el/1500) % 1, .85, .6).multiplyScalar(2.2); starMainMat.color.copy(c); starGlow.material.color.copy(c); }
  dim.material.opacity = Math.min(.55, s.el/300*.55);
  const a = sparkG.attributes.position.array; sparkData.forEach((d, i)=>{ d.a += d.v*dt*(1 + decel*3); const r = d.r*sc*(1 + glow*.4); a[i*3] = Math.cos(d.a)*r; a[i*3+1] = Math.sin(d.a)*r; a[i*3+2] = 0; });
  sparkG.attributes.position.needsUpdate = true; sparkMat.opacity = .3 + glow*.7;
  $('quote').style.opacity = (p >= .4 && p < .75 && $('quote').textContent) ? 1 : 0;
  if (p >= 1){ starSound(s.it.tier, 'burst'); s.fade = .35; flash(.2 + (s.it.tier >= 9 ? .4 : 0)); }
}
function endStar(){ starRig.visible = false; dim.material.opacity = 0; $('quote').style.opacity = 0; const r = starState.res; starState = null; r(); }

// =====================================================================
//  🎬 컷씬 (빛살 + ★ SUMMON + 플래시 · 흔들림 · 충격파, 캐릭터 클로즈업)
// =====================================================================
let cine = null, shakeT = 0;
function flash(op){ const f = $('flash'); f.style.transition = 'none'; f.style.opacity = op; requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.transition = 'opacity .5s'; f.style.opacity = 0; })); }
function cutscene(it){
  return new Promise(res=>{
    const t = it.tier, col = mainCol(it), dur = t>=40 ? 9000 : t>=32 ? 7000 : t>=21 ? 5500 : t>=13 ? 4200 : 3400;
    const c = $('cut'); c.className = ''; c.style.display = 'flex'; document.body.classList.add('cine');
    $('cutBg').style.background = `radial-gradient(circle at 50% 55%, transparent 0%, ${col}22 35%, rgba(0,0,0,.75) 85%)`;
    const rays = [], n = t>=30 ? 24 : 16; for (let i=0;i<n;i++){ const a = i*360/n; rays.push(`${col}${t>=20 ? '2a' : '1c'} ${a}deg ${a + 360/n/3}deg`, `transparent ${a + 360/n/3}deg ${a + 360/n}deg`); }
    $('cutRays').style.background = (RAINBOW[t]||0) >= .9 ? 'repeating-conic-gradient(rgba(255,95,143,.3) 0 4deg, transparent 4deg 11deg, rgba(107,214,255,.3) 11deg 15deg, transparent 15deg 22deg)' : `conic-gradient(${rays.join(',')})`;
    $('cutRays').classList.toggle('fast', t >= 20);
    $('cutLabel').textContent = '★'.repeat(Math.min(7, Math.max(1, Math.floor((t - 7)/3)))) + ' SUMMON'; $('cutLabel').style.color = col;
    const ti = $('cutTitle'); ti.textContent = it.name; paintText(ti, it, false); ti.style.textShadow = `0 0 40px ${col}, 0 0 80px ${col}88`;
    $('cutOdds').textContent = '1 / ' + fmt(it.odds);
    requestAnimationFrame(()=>{ $('cutBg').style.opacity = 1; $('cutRays').style.opacity = 1; });
    setSlotAura(mySlot, t); const A = ()=>mySlot.aura, P = ()=>new THREE.Vector3(me.x, me.y, me.z);
    A().boost = 1.3; cine = { t:0 }; starSound(t, 'burst');
    const timers = [], at = (ms, f)=>timers.push(setTimeout(f, ms)), base = t>=29 ? 2000 : t>=19 ? 1700 : 1400;
    at(base, ()=>{ flash(t>=29 ? .8 : .65); shakeT = .5; c.classList.add('show', 'pulse'); if (A()){ A().boost = 1.5; shockwave(P(), A().col, 1.2); } burst(P(), it); starSound(t, 'burst'); });
    if (t >= 21) at(base + 1100, ()=>{ flash(.5); shakeT = .4; if (A()){ A().boost = 1.4; shockwave(P(), A().col, 1); } });
    if (t >= 32) at(base + 2000, ()=>{ flash(.6); shakeT = .5; burst(P(), it); if (A()) shockwave(P(), A().col, 1.4); });
    if (t >= 40) at(base + 2800, ()=>{ flash(.8); shakeT = .7; burst(P(), it); burst(P(), it); if (A()) shockwave(P(), A().col, 1.8); });
    for (let a = base + 2400; a < dur - 1000; a += 2400) at(a, ()=>{ if (A()){ A().boost = 1.25; shockwave(P(), A().col, .7); } });
    let done = false;
    const finish = ()=>{ if (done) return; done = true; timers.forEach(clearTimeout); clearInterval(poll); c.removeEventListener('click', finish);
      $('cutBg').style.opacity = 0; $('cutRays').style.opacity = 0; c.classList.remove('show', 'pulse');
      setTimeout(()=>{ c.style.display = 'none'; }, 500); document.body.classList.remove('cine'); cine = null; res(); };
    c.addEventListener('click', finish); at(dur, finish);
    const poll = setInterval(()=>{ if (skipReq) finish(); }, 50);
  });
}

// =====================================================================
//  🎲 굴리기
// =====================================================================
let rolling = false;
function currentLuck(){ let l = 1; const nx = S.rolls + 1; if (nx % 10 === 0) l *= 2; if (nx % 100 === 0) l *= 5; return l; }
function pick(luck){
  for (let i=MAXT;i>=5;i--) if (Math.random() < POOL[i].chance/100*luck) return POOL[i];
  const low = POOL.slice(0, 5), tot = low.reduce((s, p)=>s + p.chance, 0); let r = Math.random()*tot;
  for (const p of low) if ((r -= p.chance) <= 0) return p; return POOL[0];
}
async function roll(){
  if (rolling || chatting()) return;
  rolling = true; skipReq = false; $('rollBtn').disabled = true; ac();
  const it = pick(currentLuck()); S.rolls++;
  if (!S.fast){ $('skipAnim').style.display = 'block'; await starAnim(it); if (!skipReq && it.tier >= 9) await cutscene(it); $('skipAnim').style.display = 'none'; }
  else await sleep(140);
  finishRoll(it);
}
function finishRoll(it){
  const isNew = !S.inv[it.tier];
  S.inv[it.tier] = (S.inv[it.tier] || 0) + 1;
  const newBest = S.best == null || it.tier > S.best;
  if (newBest){ S.best = it.tier; if (mpOn) try { MP.submitScore('ext_' + GAME_ID + '_best', it.odds, 'desc'); } catch(e){} }
  if (S.equipped == null || it.tier > S.equipped) S.equipped = it.tier;
  if (it.tier >= ANNOUNCE_TIER){ S.lastRare = it.tier; S.rareSeq++; }
  if (it.tier >= 20 && mpOn) try { MP.playEmote('cheer'); } catch(e){}
  setSlotAura(mySlot, S.equipped);
  const ln = $('lastName'); ln.textContent = it.name; paintText(ln, it);
  $('lastOdds').textContent = '1 / ' + fmt(it.odds) + (isNew ? '  ✨NEW' : '');
  const pos = new THREE.Vector3(me.x, me.y, me.z); burst(pos, it);
  if (mySlot.aura && S.equipped === it.tier){ mySlot.aura.boost = Math.max(mySlot.aura.boost, 1.4); shockwave(pos, mySlot.aura.col, .8); }
  if (it.tier >= 9) addLog(it, isNew);
  save(); render();
  rolling = false; $('rollBtn').disabled = false;
  if (S.auto) setTimeout(roll, 350);
}
function addLog(it, isNew){
  const el = document.createElement('div'); el.innerHTML = '#' + fmt(S.rolls) + ' — <b></b> (1/' + fmt(it.odds) + ')' + (isNew ? ' ✨' : '');
  const b = el.querySelector('b'); b.textContent = it.name; paintText(b, it);
  $('log').prepend(el); while ($('log').children.length > 8) $('log').lastChild.remove();
}

// =====================================================================
//  UI
// =====================================================================
let msgT = null; function showMsg(text, ms, color){ const e = $('msg'); e.textContent = text; e.style.color = color || '#fff'; e.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(()=>{ e.style.opacity = 0; }, ms || 1800); }
function updateInfo(){ $('info').textContent = '🎲 ' + fmt(S.rolls) + ' · 👥 ' + (others.size + 1) + '명' + (mpOn ? '' : ' (혼자)'); }
let tab = 'inv', rankCache = null, rankAt = 0;
function render(){
  updateInfo();
  $('statLine').textContent = '다음 행운 x' + currentLuck() + ' · 최고 ' + (S.best != null ? POOL[S.best].name : '-');
  $('luckFill').style.width = ((S.rolls % 10)/9*100) + '%';
  $('autoBtn').textContent = '자동: ' + (S.auto ? 'ON' : 'OFF'); $('autoBtn').classList.toggle('on', S.auto);
  $('fastBtn').textContent = '빠른 굴리기: ' + (S.fast ? 'ON' : 'OFF'); $('fastBtn').classList.toggle('on', S.fast);
  $('soundBtn').textContent = '소리: ' + (S.sound ? 'ON' : 'OFF');
  $('bagBtn').classList.toggle('on', $('side').classList.contains('open'));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab === tab));
  if (!$('side').classList.contains('open')) return;
  const box = $('listBox'); box.innerHTML = '';
  if (tab === 'inv'){
    const owned = POOL.filter(p=>S.inv[p.tier]).reverse();
    if (!owned.length) box.innerHTML = '<div style="color:#a49fc4">아직 오라가 없어요. ROLL!</div>';
    owned.forEach(p=>{ const it = item(p, '1/' + fmt(p.odds) + ' · 보유 ' + fmt(S.inv[p.tier])); if (S.equipped === p.tier) it.classList.add('eq');
      const b = document.createElement('button'); b.textContent = S.equipped === p.tier ? '해제' : '장착';
      b.onclick = ()=>{ S.equipped = S.equipped === p.tier ? null : p.tier; setSlotAura(mySlot, S.equipped); if (mySlot.aura){ mySlot.aura.boost = 1.5; shockwave(new THREE.Vector3(me.x, me.y, me.z), mySlot.aura.col, .8); } save(); render(); };
      it.appendChild(b); box.appendChild(it); });
  } else if (tab === 'index'){
    box.innerHTML = '<div style="color:#a49fc4;margin-bottom:4px">발견: ' + POOL.filter(p=>S.inv[p.tier]).length + ' / ' + POOL.length + '</div>';
    POOL.forEach(p=>{ if (S.inv[p.tier]) box.appendChild(item(p, 'Tier ' + p.tier + ' · 1/' + fmt(p.odds)));
      else { const it = item({ name:'???', color:'#444', tier:-1 }, 'Tier ' + p.tier + ' · 1/' + fmt(p.odds)); it.classList.add('locked'); box.appendChild(it); } });
  } else if (tab === 'rank'){
    if (!mpOn){ box.innerHTML = '<div style="color:#a49fc4">온라인일 때만 랭킹을 볼 수 있어요.</div>'; return; }
    const draw = rows=>{ box.innerHTML = '<div style="color:#a49fc4;margin-bottom:4px">최고 오라 랭킹 (희귀도)</div>';
      if (!rows.length){ box.innerHTML += '<div style="color:#a49fc4">아직 기록이 없어요.</div>'; return; }
      rows.forEach((r, i)=>{ const p = POOL.slice().reverse().find(q=>q.odds <= r.score) || POOL[0];
        const it = item(p, (i + 1) + '위 · ' + String(r.name || '플레이어').slice(0, 14)); it.querySelector('b').textContent = p.name + ' (1/' + fmt(p.odds) + ')'; box.appendChild(it); }); };
    if (rankCache && performance.now() - rankAt < 30000) draw(rankCache);
    else { box.innerHTML = '<div style="color:#a49fc4">불러오는 중…</div>'; try { MP.fetchLeaderboard('ext_' + GAME_ID + '_best', { limit:10, direction:'desc' }, rows=>{ rankCache = rows || []; rankAt = performance.now(); if (tab === 'rank') draw(rankCache); }); } catch(e){ draw([]); } }
  } else {
    box.innerHTML = `
      <div class="item"><div class="nm"><b>오라 단계</b><small>희귀할수록: 불꽃 오라 → 마법진(Legendary+) → 궤도 빛구슬(Phantom+) → 번개(Stormcaller+) → 머리 위 별(Hyper+) → 빛기둥(ETERNAL+) → 후광·충격파(Quantum Reaper+) → 떠오르는 파편(Demiurge+)</small></div></div>
      <div class="item"><div class="nm"><b>멀티</b><small>같은 방 사람들의 오라가 서로 보여요. Nightshade 이상을 뽑으면 방 전체에 알림! 친구랑 같이 하려면 주소 끝에 ?room=이름</small></div></div>
      <div class="item"><div class="nm"><b>행운</b><small>10번째 굴림마다 x2, 100번째는 추가 x5. 더 희귀한 오라는 자동 장착.</small></div></div>
      <div class="item"><div class="nm"><b>조작</b><small>WASD 이동 · Space 점프 · 드래그 시점 · 휠 줌 · R 굴리기 · F 자동 · B 가방 · / 채팅 · . 이모트</small></div></div>
      <button id="resetBtn" style="margin-top:8px">저장 데이터 초기화</button>`;
    $('resetBtn').onclick = ()=>{ if (confirm('정말 초기화할까요?')){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} location.reload(); } };
  }
}
function item(p, sub){
  const it = document.createElement('div'); it.className = 'item';
  const dot = document.createElement('div'); dot.className = 'dot'; dot.style.background = (RAINBOW[p.tier]||0) >= .9 ? RB_CSS : p.color; dot.style.boxShadow = '0 0 8px ' + (p.tier >= 0 ? mainCol(p) : p.color);
  const nm = document.createElement('div'); nm.className = 'nm'; const b = document.createElement('b'); b.textContent = p.name; if (p.tier >= 0) paintText(b, p, false);
  const s = document.createElement('small'); s.textContent = sub; nm.append(b, s); it.append(dot, nm); return it;
}

// =====================================================================
//  메인 루프
// =====================================================================
if (!mpOn) $('keys').textContent = $('keys').textContent.replace(' · / 채팅 · . 이모트', '');
buildWorld(); respawn();
setSlotAura(mySlot, S.equipped);
if (S.equipped != null){ const ln = $('lastName'); ln.textContent = POOL[S.equipped].name; paintText(ln, POOL[S.equipped]); }
$('rollBtn').onclick = roll;
$('autoBtn').onclick = ()=>{ S.auto = !S.auto; save(); render(); if (S.auto) roll(); };
$('fastBtn').onclick = ()=>{ S.fast = !S.fast; save(); render(); };
$('soundBtn').onclick = ()=>{ S.sound = !S.sound; save(); render(); };
$('skipAnim').onclick = ()=>{ skipReq = true; };
$('bagBtn').onclick = ()=>{ $('side').classList.toggle('open'); render(); };
document.querySelectorAll('.tabs button').forEach(b=>b.onclick = ()=>{ tab = b.dataset.tab; render(); });
document.addEventListener('click', e=>{ const b = e.target.closest('button'); if (b) b.blur(); });
render();

const clock = new THREE.Clock(); let T = 0;
const tmpV = new THREE.Vector3();
function loop(){ requestAnimationFrame(loop); const dt = Math.min(clock.getDelta(), .05); T += dt;
  const [mx, mz] = readMove(); if (Math.hypot(mx, mz) > .05){ let d = Math.atan2(mx, mz) - me.facing; d = Math.atan2(Math.sin(d), Math.cos(d)); me.facing += d*Math.min(1, 14*dt); }
  stepPlayer(me, mx, mz, dt); if (me.y < -40) respawn();
  myActor.g.position.set(me.x, me.y + (cine ? .25 + Math.sin(T*3)*.12 : 0), me.z); myActor.g.rotation.y = me.facing;
  myActor.charge = !!cine; if (cine) chargePose(myActor, dt); else animLimbs(myActor, dt, me.moving && me.grounded, !me.grounded);
  mySlot.holder.position.set(me.x, me.y, me.z); if (mySlot.aura) mySlot.aura.update(dt, T);
  for (const o of others.values()){ const k = Math.min(1, 12*dt); o.x = lerp(o.x, o.tx, k); o.y = lerp(o.y, o.ty, k); o.z = lerp(o.z, o.tz, k); let d = o.try - o.ry; d = Math.atan2(Math.sin(d), Math.cos(d)); o.ry += d*k;
    if (Math.hypot(o.tx - o.x, o.tz - o.z) > 15){ o.x = o.tx; o.y = o.ty; o.z = o.tz; } o.a.g.position.set(o.x, o.y, o.z); o.a.g.rotation.y = o.ry; animLimbs(o.a, dt, o.an === 1, o.an === 2);
    o.slot.holder.position.set(o.x, o.y, o.z); if (o.slot.aura) o.slot.aura.update(dt, T); }
  tickStar(dt); tickFx(dt);
  // 카메라
  if (cine){ cine.t += dt; const a = me.facing + Math.sin(cine.t*.35)*.9, dd = 11 - Math.min(2, cine.t*.5);
    camera.position.set(me.x + Math.sin(a)*dd, me.y + 2.6 + Math.sin(cine.t*.5)*.4, me.z + Math.cos(a)*dd); camera.lookAt(me.x, me.y + 1.4, me.z); }
  else { const px = me.x, py = me.y + 1.7, pz = me.z; camera.position.set(px - Math.sin(camYaw)*Math.cos(camPitch)*camDist, py + Math.sin(camPitch)*camDist, pz - Math.cos(camYaw)*Math.cos(camPitch)*camDist);
    if (camera.position.y < .5) camera.position.y = .5; camera.lookAt(px, py, pz); }
  if (shakeT > 0){ shakeT -= dt; const s = shakeT; camera.position.x += (Math.random() - .5)*s; camera.position.y += (Math.random() - .5)*s; }
  moon.position.set(me.x - 30, 60, me.z + 20); moon.target.position.set(me.x, 0, me.z);
  sky.material.uniforms.uTime.value = T; starPts.material.uniforms.uTime.value = T; motes.material.uniforms.uTime.value = T;
  altarRing.rotation.z = T*.2; crystals.forEach((c, i)=>{ c.rotation.y = T*.8 + i; c.position.y = 12 + Math.sin(T*1.3 + i)*.5; });
  netSend(dt, myExtraData());
  if (composer) composer.render(dt); else renderer.render(scene, camera); }
loop();
window.__GAME = { me, others, S, POOL, roll, mpOn, setAura:t=>{ S.equipped = t; setSlotAura(mySlot, t); }, cutscene, starAnim, get aura(){ return mySlot.aura; },
  fakeOther:(tier)=>{ onPlayers({ bot1:{ x:me.x + 6, y:me.y, z:me.z - 2, ry:0, name:'테스트봇', avatarLoadout:{}, d:{ au:tier, rl:-1, rs:0 } } }); } };
})();
</script>
