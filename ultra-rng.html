document.addEventListener('click', e=>{ const b = e.target.closest('button'); if (b) b.blur(); });
render();

const clock = new THREE.Clock(); let T = 0, AT = 0;
function loop(){ requestAnimationFrame(loop); const dt = Math.min(clock.getDelta(), .05); T += dt;
  if (shiftLock && !cine){ let d = camYaw - me.facing; d = Math.atan2(Math.sin(d), Math.cos(d)); me.facing += d*Math.min(1, 20*dt); }
  const [mx, mz] = readMove(); if (!(shiftLock && !cine) && Math.hypot(mx, mz) > .05){ let d = Math.atan2(mx, mz) - me.facing; d = Math.atan2(Math.sin(d), Math.cos(d)); me.facing += d*Math.min(1, 14*dt); }
  stepPlayer(me, mx, mz, dt); if (me.y < -40) respawn();
  const idleNow = !cine && me.grounded && !me.moving;
  const hov = cine ? (cine.lift = cinePose(myActor, cine.t, dt)) : idleNow ? applyPose(myActor, poseOf(S.equipped != null ? POOL[S.equipped] : null), dt, T) : 0;
  myActor.g.position.set(me.x, me.y + hov, me.z); myActor.g.rotation.y = me.facing; applyOutline(myActor, mySlot);
  if (!cine && !idleNow){ animLimbs(myActor, dt, me.moving && me.grounded, !me.grounded, me.gliding); myActor.g.rotation.x *= .85; }
  const ts = cine ? cine.timeScale : 1; AT += dt*ts;
  mySlot.holder.position.set(me.x, me.y + (cine ? hov : 0), me.z); if (mySlot.aura){ mySlot.aura.yaw = me.facing; mySlot.aura.grounded = me.grounded; mySlot.aura.update(dt*ts, AT); }
  for (const o of others.values()){ const k = Math.min(1, 12*dt); o.x = lerp(o.x, o.tx, k); o.y = lerp(o.y, o.ty, k); o.z = lerp(o.z, o.tz, k); let d = o.try - o.ry; d = Math.atan2(Math.sin(d), Math.cos(d)); o.ry += d*k;
    if (Math.hypot(o.tx - o.x, o.tz - o.z) > 15){ o.x = o.tx; o.y = o.ty; o.z = o.tz; } o.a.g.position.set(o.x, o.y, o.z); o.a.g.rotation.y = o.ry; if (o.an === 0 && o.data && o.data.au >= 0 && POOL[o.data.au]) o.a.g.position.y += applyPose(o.a, poseOf(POOL[o.data.au]), dt, T, o.x); else animLimbs(o.a, dt, o.an === 1, o.an === 2); applyOutline(o.a, o.slot);
    o.slot.holder.position.set(o.x, o.y, o.z); if (o.slot.aura){ o.slot.aura.yaw = o.ry; o.slot.aura.update(dt, T); } }
  tickStar(dt); tickFx(dt); signature(dt); tickPotions(dt); tickObby(dt, T); realm.tick(dt, T); vfx.tick(dt); decoAnim.forEach(f=>f(T)); tickGiant(dt); tickEvents(dt, T); tickOrb(dt, T); tickDungeon(dt, T); tickBeam(dt);
  if (cine) cineCamera(dt);
  else { if (Math.abs(camera.fov - 60) > .1){ camera.fov = lerp(camera.fov, 60, Math.min(1, dt*4)); camera.updateProjectionMatrix(); } hemi.intensity = lerp(hemi.intensity, .5, Math.min(1, dt*3));
    const slx = shiftLock ? -Math.cos(camYaw)*1.7 : 0, slz = shiftLock ? Math.sin(camYaw)*1.7 : 0, px = me.x + slx, py = me.y + 1.7 + (shiftLock ? .4 : 0), pz = me.z + slz; camera.position.set(px - Math.sin(camYaw)*Math.cos(camPitch)*camDist, py + Math.sin(camPitch)*camDist, pz - Math.cos(camYaw)*Math.cos(camPitch)*camDist);
    if (camera.position.y < .5) camera.position.y = .5;
    if (camBlend > 0){ camBlend = Math.max(0, camBlend - dt*1.6); const k = easeIO(camBlend); camera.position.lerp(cineEndPos, k); tmpW.set(px, py, pz).lerp(cineEndLook, k); camera.lookAt(tmpW); } else camera.lookAt(px, py, pz);
    sky.material.uniforms.uAmt.value = lerp(sky.material.uniforms.uAmt.value, 0, Math.min(1, dt*2));
    [cineFx.ground, cineFx.sky].forEach(m=>{ if (!m.visible) return; const u = m.material.uniforms; u.uInt.value = Math.max(0, u.uInt.value - dt*1.5); if (u.uInt.value <= 0) m.visible = false; }); }
  cineFx.u.uTime.value = T; cineFx.ground.material.uniforms.uTime.value = T*.6; cineFx.sky.material.uniforms.uTime.value = T*.25;
  if (shakeT > 0){ shakeT -= dt; const s = shakeT*.8; camera.position.x += (Math.random() - .5)*s; camera.position.y += (Math.random() - .5)*s; }
  if (bloomPass) bloomPass.strength = lerp(bloomPass.strength, cine && cine.impact ? .5 : .65, Math.min(1, dt*3));
  if (gradePass){ const u = gradePass.uniforms, early = cine && !cine.impact; u.uVig.value = lerp(u.uVig.value, cine ? .7 : 0, Math.min(1, dt*3)); u.uSat.value = lerp(u.uSat.value, early ? .45 : 1, Math.min(1, dt*(early ? 3 : 6)));
    if (cine) u.uTint.value.set(mainCol(POOL[cine.tier]));
    u.uTime.value = T; u.uAsp.value = camera.aspect; tmpW.set(me.x, me.y + 2, me.z).project(camera); u.uP.value.set(tmpW.x*.5 + .5, tmpW.y*.5 + .5);
    const eqT = S.equipped == null ? -1 : S.equipped; u.uHaze.value = lerp(u.uHaze.value, eqT >= 9 && tmpW.z < 1 ? .4 + eqT/MAXT*.9 : 0, Math.min(1, dt*3));
    const now = performance.now(), rdt = Math.min(.5, (now - (u.lastNow || now))/1000); u.lastNow = now; u.uCA.value *= Math.pow(.02, rdt); u.uZoom.value *= Math.pow(.03, rdt); }
  moon.position.set(me.x - 30, 60, me.z + 20); moon.target.position.set(me.x, 0, me.z);
  sky.material.uniforms.uTime.value = T; starPts.material.uniforms.uTime.value = T; motes.material.uniforms.uTime.value = T;
  altarRing.rotation.z = T*.2; altarRing.visible = !cine; crystals.forEach((c, i)=>{ c.rotation.y = T*.8 + i; c.position.y = 12 + Math.sin(T*1.3 + i)*.5; });
  netSend(dt, myExtraData());
  if (composer) composer.render(dt); else renderer.render(scene, camera);
  if (snapReq){ snapCv.width = canvas.width; snapCv.height = canvas.height; snapCv.getContext('2d').drawImage(canvas, 0, 0); const r = snapReq; snapReq = null; r(); }
  if (window.__starCap && starState && window.__starCap.length && starState.el/starState.dur >= window.__starCap[0]){ (window.__caps = window.__caps || []).push(canvas.toDataURL('image/jpeg', .7)); window.__starCap.shift(); }
  if (window.__capT && cine && window.__capT.length && cine.t >= window.__capT[0]){ (window.__caps = window.__caps || []).push(canvas.toDataURL('image/jpeg', .8)); window.__capT.shift(); } }
loop();
window.__GAME = { me, others, S, POOL, roll, mpOn, setAura:t=>{ S.equipped = t; setSlotAura(mySlot, t); render(); }, cutscene, starAnim, screenIntro, elemOf, crackSeq, breakShards, get star2(){ return starState; }, pickups, replay, useAccount, obby, dg, attack, get cine(){ return cine; }, get aura(){ return mySlot.aura; }, get star(){ return starState; },
  fakeOther:(tier)=>{ onPlayers({ bot1:{ x:me.x + 6, y:me.y, z:me.z - 2, ry:0, name:'테스트봇', avatarLoadout:{}, d:{ au:tier, rl:-1, rs:0 } } }); } };
})();
