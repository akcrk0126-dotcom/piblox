<title>백룸</title>
<style>

  #dark { position:fixed; inset:0; pointer-events:none; z-index:8; background:#000; opacity:0; }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:9; background:#fff; opacity:0; }
  #hud { position:fixed; inset:0; z-index:10; pointer-events:none; }

  #hubBtn { position:absolute; top:12px; left:12px; pointer-events:auto; color:#e8e2c8; text-decoration:none; font-size:15px; letter-spacing:.08em; padding:4px 10px; border:1px solid rgba(232,226,200,.35); background:rgba(0,0,0,.35); }
  #lvName { position:absolute; top:46px; left:14px; font-size:22px; letter-spacing:.12em; }
  #lvName small { display:block; font-size:15px; opacity:.7; letter-spacing:.2em; }
  #rec { position:absolute; top:12px; right:16px; font-size:22px; letter-spacing:.12em; text-align:right; }

  #rec small { display:block; font-size:15px; opacity:.6; }
  @keyframes blink { 50% { opacity:0; } }
  #meters { position:absolute; left:14px; bottom:16px; font-size:16px; letter-spacing:.1em; }
  #meters .m { display:flex; align-items:center; gap:8px; margin-top:4px; }
  #meters .m b { width:64px; white-space:nowrap; font-weight:400; opacity:.8; }
  #meters .bar { width:110px; height:7px; background:rgba(232,226,200,.15); border:1px solid rgba(232,226,200,.35); }
  #meters .bar i { display:block; height:100%; background:#e8e2c8; }
  #sig { display:flex; gap:3px; align-items:flex-end; height:16px; }
  #sig i { width:6px; background:rgba(232,226,200,.2); }
  #sig i.on { background:#9dffb0; box-shadow:0 0 5px #9dffb0; }
  #prompt { position:absolute; left:50%; top:60%; transform:translateX(-50%); font-size:22px; letter-spacing:.1em; opacity:0; transition:opacity .2s; white-space:nowrap; }
  #msg { position:absolute; left:50%; top:24%; transform:translateX(-50%); font-size:24px; letter-spacing:.14em; opacity:0; transition:opacity .6s; white-space:nowrap; text-align:center; }

  .mb { position:absolute; pointer-events:auto; width:64px; height:64px; border-radius:50%; border:2px solid rgba(232,226,200,.45); background:rgba(0,0,0,.35); color:#e8e2c8; font-family:inherit; font-size:17px; display:flex; align-items:center; justify-content:center; }

</div>
<div id="startOv" class="ov show"><h1 class="vt">백룸</h1><p class="vt" id="startSub">화면을 눌러 들어가기</p>

  <div class="row"><button class="btn" id="againBtn" type="button">처음부터</button><a class="btn ghost" href="hub.html">허브로</a></div></div>
<div id="errorPanel"><div id="errorBox"></div></div>
<script>
  window.addEventListener('error', function(e){
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') return;
    var b=document.getElementById('errorBox'); b.textContent='⚠ 오류: '+(e.message||'')+(e.filename?'\n('+e.filename.split('/').pop()+':'+e.lineno+')':'')+(e.error&&e.error.stack?'\n\n'+e.error.stack:'');
    document.getElementById('errorPanel').classList.add('show');
  });
</script>

<script>

  const LEVELS = [
    { id:0, name:'LEVEL 0', sub:'로비', ceil:3.0, fog:0x4a3f16, fogD:.042, amb:0xd8c78a, ambI:.5, lampCol:0xfff6d2, lightCol:0xffeec0, lightI:1.9, lightP:.8, deadP:.07, flickP:.18,
      openZone:.14, dens:[.38,.78], doorP:.5, pillarP:.18, hum:120, humVol:.03, exitD:11, stalk:2.1, chase:4.3, spawnT:[26,40], items:[.035,.025] },
    { id:1, name:'LEVEL 1', sub:'주차장', ceil:3.6, fog:0x0f1316, fogD:.055, amb:0x6b7885, ambI:.22, lampCol:0xdcefff, lightCol:0xd8ecff, lightI:1.6, lightP:.45, deadP:.22, flickP:.3,
      openZone:.3, dens:[.45,.85], doorP:.55, pillarP:.45, hum:60, humVol:.035, exitD:14, stalk:2.5, chase:4.8, spawnT:[18,30], items:[.03,.04] },
    { id:2, name:'LEVEL 2', sub:'배관 통로', ceil:2.8, fog:0x170a04, fogD:.066, amb:0x7a3a16, ambI:.12, lampCol:0xffb070, lightCol:0xffa860, lightI:1.3, lightP:.28, deadP:.28, flickP:.35,
      openZone:.04, dens:[.28,.55], doorP:.62, pillarP:0, hum:48, humVol:.04, exitD:16, stalk:2.9, chase:5.3, spawnT:[12,22], items:[.03,.045] },
  ];
  let L = LEVELS[0], lvIdx = 0, seed = 1;
  const runSeed = (Date.now() & 0xffff) | 1;

  // 결정적 해시 → [0,1)
  function h3(a, b, c){
    let x = (Math.imul(a|0, 374761393) ^ Math.imul(b|0, 668265263) ^ Math.imul(c|0, 1274126177) ^ seed) | 0;

  const passE = (i,j) => edge(i+1, j, 0) !== 2, passW = (i,j) => edge(i, j, 0) !== 2, passS = (i,j) => edge(i, j+1, 1) !== 2, passN = (i,j) => edge(i, j, 1) !== 2;

  function los(ax, az, bx, bz){ const dx = bx-ax, dz = bz-az, d = Math.hypot(dx, dz), n = Math.ceil(d / 0.35);

  // =====================================================================
  //  렌더러 / 씬
  // =====================================================================

  const renderer = new THREE.WebGLRenderer({ canvas, antialias:!isTouch, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.25 : 1.6));

  scene.background = new THREE.Color(0x000000);

  function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();

  // 손전등
  const flash = new THREE.SpotLight(0xfff1d0, 0, 24, 0.52, 0.5, 1.4); flash.position.set(0.18, -0.12, 0); camera.add(flash);

    const m = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ color:0xffffff })); m.visible = false; scene.add(m); ptags.push(m); }

  // ---------- 절차 텍스처 ----------
  function cv(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); fn(g, w, h);

        g.strokeStyle = 'rgba(120,95,20,.22)'; g.lineWidth = 1.5; for (let y=0;y<h;y+=32) for (let x=0;x<w;x+=32){ g.beginPath(); g.moveTo(x+16, y+4); g.lineTo(x+28, y+16); g.lineTo(x+16, y+28); g.lineTo(x+4, y+16); g.closePath(); g.stroke(); }

    { // LEVEL 1: 콘크리트 주차장
      wall: cv(256, 256, (g,w,h)=>{ g.fillStyle = '#6f7275'; g.fillRect(0,0,w,h); speckle(g, w, h, 5000, ['rgba(0,0,0,.12)','rgba(255,255,255,.07)'], 2);
        g.fillStyle = 'rgba(0,0,0,.18)'; for (let y=64;y<h;y+=64) g.fillRect(0, y, w, 2); stains(g, w, h, 6, 'rgba(20,25,20,.3)');
        g.fillStyle = 'rgba(200,170,20,.55)'; g.fillRect(0, h-40, w, 14); }),
      floor: cv(256, 256, (g,w,h)=>{ g.fillStyle = '#3b3e41'; g.fillRect(0,0,w,h); speckle(g, w, h, 6000, ['rgba(0,0,0,.2)','rgba(255,255,255,.06)'], 2); stains(g, w, h, 5, 'rgba(10,15,20,.55)');
        g.fillStyle = 'rgba(230,220,200,.35)'; g.fillRect(w-10, 0, 6, h); }),
      ceil: cv(256, 256, (g,w,h)=>{ g.fillStyle = '#4c4f52'; g.fillRect(0,0,w,h); speckle(g, w, h, 3000, ['rgba(0,0,0,.2)'], 2); g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(0, 120, w, 16); }),

    if (AC && AC.listener){ const Ls = AC.listener, fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
      if (Ls.positionX){ Ls.positionX.value = player.x; Ls.positionY.value = 1.6; Ls.positionZ.value = player.z; Ls.forwardX.value = fx; Ls.forwardY.value = 0; Ls.forwardZ.value = fz; Ls.upX.value = 0; Ls.upY.value = 1; Ls.upZ.value = 0; }
      else { Ls.setPosition(player.x, 1.6, player.z); Ls.setOrientation(fx, 0, fz, 0, 1, 0); } }
  }

  function place(dt){
    const bobY = Math.sin(player.bob) * .045, bobX = Math.cos(player.bob*.5) * .025;
    camera.position.set(player.x, 1.58 + bobY, player.z);
    camera.rotation.order = 'YXZ'; camera.rotation.y = player.yaw; camera.rotation.x = player.pitch;

    if (state === 'dying'){ camera.position.x += (Math.random()-.5)*.06; camera.position.y += (Math.random()-.5)*.06; camera.lookAt(ent.x, 1.55, ent.z); }
  }
  let nT = 0;
  const clock = new THREE.Clock();
  function frame(dt){
    if (state === 'play') update(dt);
    else if (state === 'intro'){ time += dt; player.yaw += dt*.05; updateChunks(false); }
    else if (state === 'transit' || state === 'dying'){ time += dt; }
    place(dt);
    glitchT = Math.max(0, glitchT - dt);
    nT -= dt; if (nT <= 0){ nT = .05; drawNoise(); }
    const nearE = ent.state !== 'hidden' ? clamp((10 - Math.hypot(ent.x - player.x, ent.z - player.z)) / 10, 0, 1) : 0;
    $('noise').style.opacity = (.03 + glitchT*.5 + nearE*.12 + (100 - player.sanity)/100*.1).toFixed(3);
    canvas.style.filter = player.sanity < 40 ? `contrast(${1 + (40 - player.sanity)/80}) saturate(${1 - (40 - player.sanity)/80})` : '';
    setMeters();
    $('recT').textContent = fmtT(recT);
  }
  function loop(){ requestAnimationFrame(loop); const dt = Math.min(clock.getDelta(), .05); frame(dt); renderer.render(scene, camera); }
  // 로그인(익명 포함) + 허브 접속 표시 + 랭킹용
  const mpOn = !!(window.MP && MP.isConfigured && MP.isConfigured() && !window.__mpFail && window.firebase);
  if (mpOn){ try { MP.initAuthOnly((user, err)=>{ if (!err && user) try { MP.setPresence('backrooms', null); } catch(e){} }); } catch(e){} }
  // 저장된 레벨부터 이어하기
  let startN = 0; try { startN = clamp(parseInt(localStorage.getItem(SAVE)||'0',10)||0, 0, LEVELS.length-1); } catch(e){}
  if (startN > 0) $('startSub').textContent = LEVELS[startN].name + ' 부터 이어서 · 화면을 눌러 들어가기';
  startLevel(startN, false);
  $('msg').style.opacity = 0;
  loop();
  // 테스트용
  window.__BR = { player, ent, get state(){ return state; }, set state(v){ state = v; }, frame, edge, bfs, get exitCell(){ return exitCell; }, get field(){ return field; }, cellWalls, startLevel, chunks, tryExit, caught, los, get lvIdx(){ return lvIdx; }, get exitObj(){ return exitObj; } };
})();
