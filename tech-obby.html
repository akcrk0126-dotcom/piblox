<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>레인보우 100 오비</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#87CEEB; font-family:-apple-system,'Malgun Gothic','Noto Sans KR',sans-serif; touch-action:none; }
  #canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  .pill { background:rgba(0,0,0,.42); color:#fff; border-radius:20px; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #hubBtn { position:absolute; top:12px; left:12px; pointer-events:auto; padding:7px 11px; font-size:11px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.35); }
  #stageTag { position:absolute; top:12px; right:12px; padding:8px 13px; font-size:12px; font-weight:800; text-align:right; }
  #stageTag small { display:block; font-size:9px; font-weight:600; opacity:.85; margin-top:2px; }
  #timerTag { position:absolute; top:56px; right:12px; padding:6px 12px; font-size:11px; font-weight:700; color:#ffe1a8; font-variant-numeric:tabular-nums; }

  #lvCard { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:min(440px,62vw); padding:9px 14px 11px; border-radius:14px;
    background:rgba(12,14,30,.66); border:2px solid rgba(255,255,255,.2); color:#fff; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  #lvCard .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #lvCard .lv { font-size:13px; font-weight:900; letter-spacing:.08em; }
  #lvCard .lv b { font-size:26px; letter-spacing:0; margin-left:4px; }
  #lvCard .lv i { font-style:normal; opacity:.55; font-size:13px; margin-left:2px; }
  #tierChip { padding:4px 11px; border-radius:20px; font-size:12px; font-weight:900; color:#111; white-space:nowrap; }
  #rbBar { position:relative; display:flex; height:9px; border-radius:5px; overflow:hidden; margin-top:7px; background:rgba(255,255,255,.1); }
  #rbBar span { height:100%; opacity:.28; }
  #rbBar span.done { opacity:1; }
  #rbMark { position:absolute; top:-3px; width:4px; height:15px; border-radius:2px; background:#fff; box-shadow:0 0 6px #fff; transform:translateX(-2px); transition:left .3s; }
  #tipCard { position:absolute; top:84px; left:50%; transform:translateX(-50%); width:min(420px,70vw); padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.93); color:#1b1e2e;
    box-shadow:0 8px 24px rgba(0,0,0,.25); pointer-events:auto; transition:opacity .25s; }
  #tipCard.hide { opacity:0; pointer-events:none; }
  #tipCard .t { font-size:10px; font-weight:900; letter-spacing:.14em; color:#8a7bd8; }
  #tipCard .nm { font-size:15px; font-weight:900; margin-top:1px; }
  #tipCard .how { font-size:11.5px; line-height:1.5; margin-top:3px; color:#3a3f55; }
  #tipCard .key { font-size:10.5px; margin-top:4px; font-weight:800; color:#b5651d; }
  #tipX { position:absolute; right:8px; top:6px; border:none; background:none; font-size:13px; cursor:pointer; color:#777; }
  #tipBtn { left:12px; bottom:auto; top:52px; width:34px; height:34px; font-size:15px; }
  #startOverBtn { position:absolute; top:52px; left:52px; pointer-events:auto; padding:7px 11px; font-size:11px; font-weight:700; border:1px solid rgba(255,255,255,.35); cursor:pointer; }
  body.has-touch #stateTag { top:92px; }
  #tierUp { position:absolute; left:0; right:0; top:44%; text-align:center; pointer-events:none; opacity:0; }
  #tierUp .a { font-size:15px; font-weight:900; color:#fff; letter-spacing:.2em; text-shadow:0 2px 6px rgba(0,0,0,.4); }
  #tierUp .b { font-size:56px; font-weight:900; text-shadow:0 4px 0 rgba(0,0,0,.25), 0 0 30px rgba(255,255,255,.6); }
  #tierUp .c { font-size:13px; color:#fff; font-weight:800; text-shadow:0 2px 6px rgba(0,0,0,.5); }
  #tierUp.go { animation:tu 3.2s ease-out; }
  @keyframes tu { 0%{opacity:0;transform:scale(.7)} 12%{opacity:1;transform:scale(1.08)} 20%{transform:scale(1)} 80%{opacity:1} 100%{opacity:0} }
  #techCard { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:min(460px,64vw); padding:10px 14px; border-radius:14px;
    background:rgba(12,14,30,.62); border:1px solid rgba(255,255,255,.18); color:#fff; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  #techCard .no { font-size:10px; font-weight:800; letter-spacing:.14em; color:#9fd3ff; }
  #techCard .nm { font-size:16px; font-weight:900; margin-top:1px; }
  #techCard .how { font-size:11.5px; line-height:1.5; opacity:.92; margin-top:4px; }
  #techCard .key { font-size:10.5px; color:#ffd36b; margin-top:4px; font-weight:700; }
  #techCard.min .how, #techCard.min .key { display:none; }
  #techToggle { position:absolute; right:8px; top:6px; pointer-events:auto; background:none; border:none; color:#fff; opacity:.7; font-size:13px; cursor:pointer; }

  #pop { position:absolute; left:50%; top:34%; transform:translate(-50%,-50%); font-size:26px; font-weight:900; color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.25), 0 0 18px rgba(255,210,80,.8); opacity:0; white-space:nowrap; }
  #pop.go { animation:pop 1s ease-out; }
  @keyframes pop { 0%{opacity:0;transform:translate(-50%,-30%) scale(.7)} 15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)} 70%{opacity:1} 100%{opacity:0;transform:translate(-50%,-80%) scale(1)} }
  #stateTag { position:absolute; left:12px; bottom:14px; padding:6px 12px; font-size:11px; font-weight:700; }
  body.has-touch #stateTag { bottom:auto; top:52px; }

  #joyZone { position:absolute; left:0; bottom:0; width:45%; height:60%; pointer-events:auto; }
  #joyBase { position:absolute; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.18); border:3px solid rgba(255,255,255,.55); display:none; }
  #joyStick { position:absolute; width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 3px 10px rgba(0,0,0,.35); }
  #camZone { position:absolute; right:0; bottom:0; width:55%; height:100%; pointer-events:auto; }
  .rb { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800;
    background:rgba(20,20,30,.5); border:2px solid rgba(255,255,255,.55); box-shadow:0 3px 10px rgba(0,0,0,.3); font-size:12px; }
  #jumpBtn { right:28px; bottom:50px; width:78px; height:78px; background:rgba(255,255,255,.28); font-size:13px; }
  #flickBtn { right:118px; bottom:40px; width:58px; height:58px; font-size:20px; }
  #flickBtn .t { position:absolute; bottom:-16px; font-size:9px; white-space:nowrap; text-shadow:0 1px 3px #000; }
  #lockBtn { right:14px; bottom:142px; width:46px; height:46px; font-size:18px; }
  #lockBtn.active { background:#1e88ff; border-color:#fff; box-shadow:0 0 14px rgba(30,136,255,.85); }
  #fsBtn { right:70px; bottom:142px; width:46px; height:46px; font-size:18px; }
  #resetBtn { right:126px; bottom:142px; width:46px; height:46px; font-size:16px; }
  body:not(.has-touch) #joyZone, body:not(.has-touch) #jumpBtn, body:not(.has-touch) #flickBtn { display:none !important; }
  body:not(.has-touch) #lockBtn { bottom:14px; } body:not(.has-touch) #fsBtn { bottom:14px; } body:not(.has-touch) #resetBtn { bottom:14px; }

  #crosshair { position:fixed; top:50%; left:50%; width:14px; height:14px; margin:-7px 0 0 -7px; pointer-events:none; z-index:25; display:none; }
  body.locked #crosshair { display:block; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,.9); box-shadow:0 0 2px rgba(0,0,0,.7); }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #crosshair::after { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }
  #hitFlash { position:fixed; inset:0; background:radial-gradient(circle, rgba(255,30,30,0) 40%, rgba(200,0,0,.55) 100%); opacity:0; pointer-events:none; z-index:40; transition:opacity .15s; }
  #hitFlash.go { opacity:1; transition:opacity .03s; }

  #finishOverlay { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, rgba(30,20,70,.55), rgba(5,5,15,.82)); }
  #finishOverlay.show { display:flex; }
  #finishPanel { text-align:center; color:#fff; padding:28px 32px; border-radius:22px; background:linear-gradient(180deg, rgba(40,30,80,.92), rgba(15,12,35,.95)); border:1px solid rgba(255,255,255,.18); max-width:86vw; }
  #finishPanel h2 { font-size:22px; margin-top:6px; background:linear-gradient(90deg,#ffe1a8,#ffb020); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #finishPanel .t { margin-top:8px; font-size:14px; color:#c9bfff; }
  #finishPanel .r { margin-top:6px; font-size:13px; color:#9dff9d; font-weight:800; }
  #finishBtns { margin-top:18px; display:flex; gap:10px; justify-content:center; }
  #finishBtns a, #finishBtns button { pointer-events:auto; border:none; cursor:pointer; font-size:12px; font-weight:700; padding:10px 18px; border-radius:20px; text-decoration:none; }
  #retryBtn { background:linear-gradient(90deg,#c9b8ff,#8b5cf6); color:#0e0c22; }
  #hubBtn2 { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3) !important; }
  #mpStatus { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:30; background:rgba(0,0,0,.45); color:#fff; font:700 11px sans-serif; padding:5px 11px; border-radius:14px; pointer-events:none; }
  body.has-touch #mpStatus { display:none; }

  #errorPanel{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(10,10,15,.94);padding:24px}
  #errorPanel.show{display:flex}
  #errorBox{max-width:90vw;max-height:80vh;overflow:auto;background:#1a1015;border:1px solid #ff6b5c;border-radius:14px;padding:18px;color:#ffb3a8;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;font-family:monospace}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud">
  <a id="hubBtn" class="pill" href="hub.html">🏠 허브</a>
  <div id="lvCard"><div class="top"><span class="lv">LEVEL<b id="lvN">0</b><i>/ 100</i></span><span id="tierChip">빨강 · 입문</span></div><div id="rbBar"><div id="rbMark"></div></div></div>
  <div id="tipCard" class="hide"><button id="tipX" type="button">✕</button><div class="t">NEW · 새 기술</div><div class="nm" id="tipNm"></div><div class="how" id="tipHow"></div><div class="key" id="tipKey"></div></div>
  <div id="tierUp"><div class="a" id="tuA">NEXT DIFFICULTY</div><div class="b" id="tuB">주황</div><div class="c" id="tuC"></div></div>
  <button id="tipBtn" class="rb" type="button" title="이 레벨 기술 설명">?</button>
  <button id="startOverBtn" class="pill" type="button">⏮ 처음부터</button>
  <div id="stageTag" class="pill">최고 기록 0<small>R: 체크포인트로 · 진행은 자동 저장</small></div>
  <div id="timerTag" class="pill">00:00.0</div>
  <div id="stateTag" class="pill">대기</div>
  <div id="pop"></div>

  <div id="joyZone"><div id="joyBase"><div id="joyStick"></div></div></div>
  <div id="camZone"></div>
  <div id="jumpBtn" class="rb">점프</div>
  <div id="flickBtn" class="rb">🌀<span class="t">플릭</span></div>
  <button id="lockBtn" class="rb" type="button" title="시점고정(Shift Lock) · PC: Shift"><span id="lockIcon">🔓</span></button>
  <button id="fsBtn" class="rb" type="button" title="전체화면 · PC: F">⛶</button>
  <button id="resetBtn" class="rb" type="button" title="체크포인트로 · PC: R">↺</button>
</div>
<div id="crosshair"></div>
<div id="hitFlash"></div>
<div id="finishOverlay"><div id="finishPanel">
  <div style="font-size:42px">🌈</div><h2>레인보우 100 완주!</h2>
  <div class="t" id="finishTime">00:00.0</div><div class="r" id="finishReward"></div>
  <div id="finishBtns"><button id="retryBtn" type="button">레벨 1부터 다시</button><a id="hubBtn2" href="hub.html">허브로</a></div>
</div></div>
<div id="mpStatus">연결 중...</div>
<div id="errorPanel"><div id="errorBox"></div></div>
<script>
  window.addEventListener('error', function(e){
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') return;
    var b=document.getElementById('errorBox'); b.textContent='⚠ 오류: '+(e.message||'')+(e.filename?'\n('+e.filename.split('/').pop()+':'+e.lineno+')':'')+(e.error&&e.error.stack?'\n\n'+e.error.stack:'');
    document.getElementById('errorPanel').classList.add('show');
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="multiplayer.js" onerror="window.__mpFail=true"></script>
<script>
(function(){
  /* =====================================================================
     로블록스 오비 물리 재현 — 단위는 1스터드 = 0.62
     · 걷기 16 스터드/s, 중력 196.2 스터드/s², 점프 높이 7.2 스터드 (로블록스 기본값)
     · 캐릭터 판정: 가로 2 × 깊이 1 스터드 회전 박스 (HumanoidRootPart와 같음)
     ===================================================================== */
  const STUD = 0.62;
  const WALK_SPEED = 10.5, GRAVITY = -133, JUMP_VEL = 34.46;
  const HX = 1 * STUD, HZ = 0.5 * STUD;                // 판정 박스 반폭(가로 2, 깊이 1 스터드)
  const CLIMB_SPEED = 7.0;                             // 트러스/사다리 오르는 속도 (≈11.3 스터드/s)
  const COYOTE = 0.12, JUMP_BUFFER = 0.15, STEP_HEIGHT = 2.5 * STUD;
  const FLICK_WINDOW = 0.22, FLICK_RATE = 8.5;         // 초당 8.5rad 이상 몸을 휙 돌리면 '플릭'
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('has-touch');
  const $ = id => document.getElementById(id);

  // ---------- 씬 ----------
  const canvas = $('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch ? 1.5 : 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fd3ff);
  scene.fog = new THREE.Fog(0x9fd3ff, 70, 230);
  const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 260);
  function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b8e5a, 0.95));
  const sun = new THREE.DirectionalLight(0xfff4dd, 1.15);
  sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0004;
  Object.assign(sun.shadow.camera, { left:-40, right:40, top:40, bottom:-40, far:220 });
  scene.add(sun); scene.add(sun.target);
  for (let i=0;i<260;i++){
    const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, transparent:true, opacity:.9 });
    for (let k=0;k<5;k++){ const s=new THREE.Mesh(new THREE.SphereGeometry(0.8+Math.random()*0.6,10,8), m); s.position.set((Math.random()-.5)*2.4,(Math.random()-.5)*.6,(Math.random()-.5)*1.2); g.add(s); }
    g.position.set((Math.random()-.5)*170, -30+Math.random()*260, -40+Math.random()*2600); g.scale.setScalar(1.6+Math.random()*2.6); scene.add(g);
  }

  // ---------- 텍스처 ----------
  function studTex(hex, lines){
    const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
    x.fillStyle=hex; x.fillRect(0,0,128,128);
    for (let i=0;i<260;i++){ x.fillStyle=Math.random()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.1)'; x.fillRect(Math.random()*128,Math.random()*128,2+Math.random()*3,2+Math.random()*3); }
    if (lines){ x.strokeStyle='rgba(0,0,0,.18)'; x.lineWidth=2; x.strokeRect(1,1,126,126); }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
  }
  function stripeTex(bg, fg, gap){
    const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
    x.fillStyle=bg; x.fillRect(0,0,128,128); x.fillStyle=fg;
    for (let i=-128;i<256;i+=gap){ x.save(); x.translate(i,0); x.rotate(Math.PI/4); x.fillRect(0,-200,gap*.45,400); x.restore(); }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
  }
  function trussTex(){
    const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
    x.clearRect(0,0,128,128); x.strokeStyle='#7d858f'; x.lineWidth=10; x.strokeRect(5,5,118,118);
    x.lineWidth=8; x.beginPath(); x.moveTo(5,5); x.lineTo(123,123); x.moveTo(123,5); x.lineTo(5,123); x.stroke();
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
  }
  const SEC_COLORS = ['#ffffff','#E5433C','#FF8A2E','#FFD23D','#8BC34A','#43B04A','#26A69A','#2F8CE0','#3F51B5','#9B4FE0','#C2185B','#6D4C41','#00ACC1','#F06292','#546E7A','#FFB300'];
  const TEX = {
    kill: stripeTex('#7a0000','#ffcc00',22), conveyor: stripeTex('#2b2f36','#9aa3ad',32), bounce: stripeTex('#1e8f4a','#9dff9d',26),
    speed: stripeTex('#0d47a1','#64b5f6',26), ice: studTex('#bfe9ff', true), crumble: studTex('#8a8378', true), wall: studTex('#b8bec8', true),
    check: studTex('#ffffff', true), finish: studTex('#FFD700', true), truss: trussTex(), timed: studTex('#ffffff', true),
  };
  const secTex = SEC_COLORS.map(c => studTex(c, true));

  // ---------- 콜라이더 ----------
  const colliders = [], meshes = [], crumbles = [], movers = [], timed = [], spinners = [];
  let SEC = 0;
  function addBox(x,y,z,w,h,d,type='normal',opts={}){
    let map = opts.tex || tierMap(type);
    if (TEX[type] && !opts.tex) map = TEX[type];
    if (type === 'checkpoint') map = TEX.check;
    const mat = new THREE.MeshStandardMaterial({ map: map.clone ? map : map, roughness:.85, transparent: type==='truss' || type==='timed', alphaTest: type==='truss' ? .5 : 0, side: type==='truss' ? THREE.DoubleSide : THREE.FrontSide });
    if (map.repeat) { mat.map = map.clone(); mat.map.needsUpdate = true; mat.map.repeat.set(Math.max(1,Math.round(w/(type==='truss'?1.24:2))), Math.max(1,Math.round((type==='truss'||type==='ladder'||type==='wall'?h:d)/(type==='truss'?1.24:2)))); }
    if (opts.color) { mat.map = null; mat.color.set(opts.color); }
    if (type === 'bounce' || type === 'speed') { mat.emissive = new THREE.Color(type==='bounce'?0x1e8f4a:0x1565c0); mat.emissiveIntensity = .5; }
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    mesh.position.set(x,y,z); mesh.castShadow = type!=='truss'; mesh.receiveShadow = true; scene.add(mesh); meshes.push(mesh);
    const c = { minX:x-w/2, maxX:x+w/2, minY:y-h/2, maxY:y+h/2, minZ:z-d/2, maxZ:z+d/2, get topY(){ return this.maxY; }, type, sec:SEC, mesh,
      climb: type==='truss' || type==='ladder', dir: opts.dir || null, disabled:false };
    colliders.push(c);
    if (type === 'crumble') crumbles.push({ c, state:'idle', t:0 });
    return c;
  }
  // 윗면 기준으로 발판을 놓는 헬퍼
  function plat(x, top, z, w, d, type='normal', h=1, opts){ return addBox(x, top-h/2, z, w, h, d, type, opts); }
  function setBox(c, x,y,z){ const w=c.maxX-c.minX, h=c.maxY-c.minY, d=c.maxZ-c.minZ; c.minX=x-w/2; c.maxX=x+w/2; c.minY=y-h/2; c.maxY=y+h/2; c.minZ=z-d/2; c.maxZ=z+d/2; c.mesh.position.set(x,y,z); }

  // ---------- 표지판 ----------

  }

  // 시드 랜덤 — 모두 같은 코스
  function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  let RNG = mulberry(777);
  const rnd = (a,b) => a + RNG()*(b-a), rint = (a,b) => Math.floor(rnd(a, b+1)), lerp = (a,b,t) => a + (b-a)*t;

  const OB = {
    gaps(d){ const n = rint(3,4); for (let i=0;i<n;i++){ const g = lerp(2.2, 4.4, d) + rnd(-.25,.25), dy = rnd(0, lerp(.6, 1.3, d)), sz = lerp(2.8, 1.5, d);
      Z += g; Y += dy; X = Math.max(-3, Math.min(3, X + rnd(-1,1)*lerp(.4, 1.3, d))); plat(X, Y, Z+sz/2, sz, sz); Z += sz; } },
    stairs(d){ const n = 4; for (let i=0;i<n;i++){ Z += lerp(1, 2.4, d); Y += lerp(1.2, 2.1, d); const sz = lerp(2.6, 1.7, d); plat(X, Y, Z+sz/2, sz+.6, sz); Z += sz; } },
    zigzag(d){ const n = rint(4,6), sz = lerp(1.9, 1.0, d); let side = 1; for (let i=0;i<n;i++){ Z += lerp(1.4, 2.8, d); side = -side; plat(X + side*lerp(.9, 1.8, d), Y + rnd(0,.3*d), Z+sz/2, sz, sz); Z += sz; } Y += .3*d; },

      addBox(X, Y-1.6, (z0+Z)/2, 7, 0.4, Z-z0, 'kill'); },
    movers(d){ const n = rint(2,3); for (let i=0;i<n;i++){ Z += 1.4; const c = plat(X, Y, Z+1.5, 3, 3); movers.push({ c, base:{x:X, y:c.mesh.position.y, z:Z+1.5}, ax:'x', amp:lerp(2.2,3.4,d), spd:lerp(.8,2.0,d), ph:i*1.9 }); Z += 3; } Z += .2; },

    speed(d){ plat(X, Y, Z+2, 3, 4); plat(X, Y+0.12, Z+3, 2, 1.6, 'speed', 0.24); Z += 4; Z += lerp(7.4, 8.4, d); plat(X, Y, Z+1.5, 3, 3); Z += 3; },
    truss(d){ Z += 1.5; plat(X, Y, Z+0.75, 3, 1.5); const h = lerp(5, 10, d); addBox(X, Y+h/2, Z+1.5+0.65, 1.3, h, 1.3, 'truss'); Z += 1.5+1.3; Y += h; Z += 3; plat(X, Y, Z+1.5, 3, 3); Z += 3; },

    ladder(d){ const h = lerp(6, 11, d), wz = Z + 1.75; addBox(X, Y+h/2, wz+0.5, 3.4, h, 1, 'wall'); addBox(X, Y+h/2, wz-0.125, 2.2, h, 0.25, 'ladder'); plat(X, Y, Z+0.9, 3.4, 1.8);
      Y += h; Z = wz + 1; Z += 3; plat(X, Y, Z+1.5, 3, 3); Z += 3; },

      plat(X, Y, Z+0.9, 3.4, 1.8); Y += 14; Z = wz + 1; Z += 3; plat(X, Y, Z+1.5, 3, 3); Z += 3; },

      addBox(X + 1.5 + n*STUD/2, Y+1.2+STUD/2, Z+STUD/2, n*STUD, STUD, STUD, 'wall'); addBox(X - 1.5 - n*STUD/2, Y+1.2+STUD/2, Z+STUD/2, n*STUD, STUD, STUD, 'wall');
      Z += STUD; plat(X, Y, Z+1.5, 3, 3); Z += 3; },
    head(d){ const top = d < .75 ? 4.12 : 4.25, L = 5, bot = Y + 3.62, T = Y + top;
      Z += 1.2; plat(X, Y, Z+0.6, 3, 1.2); Z += 1.2;   // 입구
      plat(X + 0.35, Y, Z+L/2, 3.7, L); addBox(X, (bot+T)/2, Z+L/2, 3, T-bot, L+0.4, 'normal');
      addBox(X - 1.5 - 0.5, Y+5, Z+L/2, 1, 12, L+0.4, 'wall'); addBox(X + 0.3, T+2.5, Z-0.45, 5.2, 5, 0.5, 'wall'); addBox(X + 0.35, Y+1.8, Z+L+0.2, 3.7, 3.6, 0.4, 'wall');
      Y = T; Z += L + 0.2; Z += 2.4; plat(X, Y, Z+1.5, 3, 3); Z += 3; },
    wallhop(d){ const h = d < .8 ? 6.2 : 6.6; Z += 2; plat(X, Y, Z+1.5, 4, 3); Z += 3; addBox(X, Y + (h-6)/2, Z+1.25, 4, h+6, 2.5, 'wall'); Y += h; Z += 2.5; Z += 2.6; plat(X, Y, Z+1.5, 3, 3); Z += 3; },
    squeeze(d){ Z += 1.5; plat(X, Y, Z+4, 3, 8); const gz = Z + 3.5, gap = lerp(0.76, 0.72, d);
      addBox(X - gap/2 - 2.1, Y+4, gz, 4.2, 8, 2, 'wall'); addBox(X + gap/2 + 2.1, Y+4, gz, 4.2, 8, 2, 'wall'); Z += 8; },
    spinner(d){ Z += 2; plat(X, Y, Z+4, 8, 8); const sp = { x:X, z:Z+4, y:Y, len:3.7, spd:lerp(1.2, 3.0, d) * (RNG()<.5?1:-1), a:rnd(0,6), bars: d > .6 ? 2 : 1 };

  // 단계별로 새로 등장하는 기술 / 쓰는 기술

  const POOL = [

  function lvPad(n){
    const t = tierOf(n), bigNext = n < MAX_LV && tierOf(n+1) !== t;

    if (bigNext){   // 다음 난이도로 넘어가는 큰 체크포인트 — 다음 단계 색으로 확실히 구분

  function setShiftLock(v){ shiftLock=v; $('lockBtn').classList.toggle('active',v); $('lockIcon').textContent=v?'🔒':'🔓'; }

  $('resetBtn').addEventListener('click', respawn);
  // PC 포인터락
  function isUI(el){ return !!(el && el.closest && el.closest('button, a, #tipCard, #finishOverlay')); }
  addEventListener('mousedown', e=>{ if (isUI(e.target) || isTouch) return; if (document.pointerLockElement !== canvas && canvas.requestPointerLock) { try { const p=canvas.requestPointerLock(); if (p&&p.catch) p.catch(()=>{}); } catch(err){} } });
  document.addEventListener('pointerlockchange', ()=>document.body.classList.toggle('locked', document.pointerLockElement===canvas));
  addEventListener('mousemove', e=>{ if (document.pointerLockElement!==canvas) return; rawYaw-=e.movementX*.0026; rawPitch=Math.max(-.1,Math.min(1.15,rawPitch+e.movementY*.0016)); });
  addEventListener('wheel', e=>{ camDist = Math.max(4, Math.min(16, camDist + Math.sign(e.deltaY)*0.8)); }, {passive:true});
  const MOVE_KEYS=['Space','KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  addEventListener('keydown', e=>{
    if (MOVE_KEYS.includes(e.code)) e.preventDefault();

  function retry(){ cpIdx=0; shownLv=-1; lsSet(SAVE_KEY,'0'); respawnPos.copy(padPos(0)); respawn(); finished=false; startTime=performance.now(); $('finishOverlay').classList.remove('show'); updateStageTag(); }
  $('retryBtn').addEventListener('click', retry);

  // ---------- 멀티플레이 고스트 ----------
  const ghosts = {};

  const mpOn = !!(window.MP && MP.isConfigured && MP.isConfigured() && !window.__mpFail && window.firebase);

    MP.onPlayersUpdate(players=>{
      const seen={};

        let gh=ghosts[uid]; const key=JSON.stringify(p.avatarLoadout||{});
        if (!gh || gh.key!==key){ const g=MP.buildAvatar(p.avatarLoadout||{}); const ns=nameSprite(p.name||'플레이어'); g.add(ns); if (gh){ g.position.copy(gh.g.position); scene.remove(gh.g); } scene.add(g); gh=ghosts[uid]={ g, key, t:{x:p.x||0,y:p.y||0,z:p.z||0,ry:p.ry||0}, ry:p.ry||0 }; }
        gh.t={x:p.x||0,y:p.y||0,z:p.z||0,ry:p.ry||0}; });

      $('mpStatus').textContent = Object.keys(ghosts).length ? `같이 접속 중: ${Object.keys(ghosts).length+1}명` : '나 혼자 접속 중';
    });

      if (err){ $('mpStatus').textContent='멀티플레이 연결 실패'; return; }
      try { MP.setPresence('techobby', MP.room); } catch(e){}
      if (MP.fetchAccountAvatarLoadout) MP.fetchAccountAvatarLoadout(l=>{ if (l) buildMe(l); });
    });
  } else $('mpStatus').textContent = '오프라인';
  let mpT = 0;

  // ---------- 메인 루프 ----------
  const clock = new THREE.Clock();
  updateStageTag();
  let simPaused = false;   // 테스트용: 외부에서 프레임을 직접 돌릴 수 있게
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!simPaused) frame(dt);
    renderer.render(scene, camera);

  function frame(dt){
    time += dt;
    refreshNear();

    // 움직이는 것들

    for (const tb of timed){ const on = Math.floor(time/(tb.per||1.6) + tb.ph) % 2 === 0; tb.c.disabled = !on; tb.c.mesh.material.opacity = on ? 1 : 0.18; }
    for (const cr of crumbles){

    }

      if (Math.abs(pos.y - sp.y) < 1.05 && Math.abs(pos.z - sp.z) < 6 && Math.abs(pos.x - sp.x) < 6) for (let b=0; b<(sp.bars||1); b++){ const a = sp.a + b*Math.PI/2; const dx=pos.x-sp.x, dz=pos.z-sp.z, ca=Math.cos(a), sa=Math.sin(a);
        const along = dx*ca - dz*sa, perp = Math.abs(dx*sa + dz*ca);   // 막대(로컬 x축)까지 거리

    let inX = moveVec.x, inY = moveVec.y;
    if (keys.KeyW||keys.ArrowUp) inY=-1; if (keys.KeyS||keys.ArrowDown) inY=1; if (keys.KeyA||keys.ArrowLeft) inX=-1; if (keys.KeyD||keys.ArrowRight) inX=1;

    if (shiftLock) facing = camYaw;
    else if (moving || spd > 0.4){ const tf = moving ? Math.atan2(moveDir.x, moveDir.z) : Math.atan2(curSpeed.x, curSpeed.y); let d=tf-facing; d=Math.atan2(Math.sin(d),Math.cos(d)); facing += d*Math.min(1,12*dt); }
    let dF = facing - prevFacing; dF = Math.atan2(Math.sin(dF), Math.cos(dF));

    prevFacing = facing;

    let boost = speedBoostT > 0 ? 1.6 : 1; speedBoostT = Math.max(0, speedBoostT - dt);
    const onIce = grounded && groundC && groundC.type === 'ice';
    const accel = onIce ? 2.2 : (moving ? 55 : 40);
    curSpeed.x += (moveDir.x*WALK_SPEED*boost - curSpeed.x) * Math.min(1, accel*dt);
    curSpeed.y += (moveDir.z*WALK_SPEED*boost - curSpeed.y) * Math.min(1, accel*dt);

    // ---- 트러스/사다리 ----
    climbLock = Math.max(0, climbLock - dt); wallhopCD = Math.max(0, wallhopCD - dt);
    const cl = climbLock <= 0 ? findClimbable() : null;
    if (cl){
      const toward = moving ? (moveDir.x*-cl.nx + moveDir.z*-cl.nz) : 0;
      if (climbing ? toward > -0.3 : (toward > 0.35 && velY <= CLIMB_SPEED + 0.5)) climbing = cl; else climbing = null;
    } else climbing = null;

    if (climbing){
      const toward = moving ? (moveDir.x*-climbing.nx + moveDir.z*-climbing.nz) : 0;
      velY = toward > 0.1 ? CLIMB_SPEED * Math.min(1, toward*1.3) : 0;
      // 벽면을 따라 옆으로는 움직일 수 있음

      const prevY = pos.y; let ny = pos.y + velY*dt;

      // 꼭대기: 자동으로 올라섬
      if (toward > 0.3 && pos.y >= climbing.c.maxY - 0.75 && !ceil){ velY = 16; curSpeed.x = -climbing.nx*5; curSpeed.y = -climbing.nz*5; climbLock = 0.35; climbing = null; }
      grounded = false; groundC = null;
    } else {
      const tx = pos.x + curSpeed.x*dt, tz = pos.z + curSpeed.y*dt, prevY = pos.y;
      const step = grounded ? tryStepUp(tx, tz, pos.y) : null;
      let ny;
      if (step !== null){ ny = step; velY = 0; grounded = true; }
      else {
        ny = pos.y + velY*dt + 0.5*GRAVITY*dt*dt; velY += GRAVITY*dt;   // 정확한 포물선 → 프레임레이트와 무관하게 점프 높이 7.2스터드
        if (velY <= 0){
          const L = findLanding(prevY, ny, tx, tz);
          if (L){ ny = L.maxY; velY = 0; grounded = true; groundC = L; onLand(L); }
          else { grounded = false; groundC = null; }
        } else {
          const ceil = findCeiling(prevY, ny, tx, tz); if (ceil){ ny = ceil.minY - CHAR_HEIGHT; velY = 0; }
          grounded = false; groundC = null;
        }

      const touched = step === null ? resolveWalls(pos) : null;
      if (touched && !grounded){ wallTouchT = time; wallN = touched; }
      if (grounded && groundC && groundC.type === 'conveyor' && groundC.dir){ pos.x += groundC.dir.x*groundC.dir.s*dt; pos.z += groundC.dir.z*groundC.dir.s*dt; }
    }
    // 킬파트는 어느 면이든 닿으면 즉사
    for (const c of NC){ if (c.type==='kill' && c.touch !== false && !c.disabled && yOverlap(pos.y, c) && obbMTV(pos.x,pos.z,facing,c,0.05)){ hitFlash(); onKill(); break; } }
    fallCheck();

    // 코요테 / 점프 버퍼 / 홀드 점프

    jumpBuffer = Math.max(0, jumpBuffer - dt);

    character.position.set(pos.x, pos.y, pos.z); character.rotation.y = facing + Math.sin(flickSpin*Math.PI/1.6)*1.2;
    shadowBlob.position.set(pos.x, pos.y + 0.02 - (grounded ? 0 : 0.02), pos.z); shadowBlob.visible = grounded;
    const sm = Math.hypot(curSpeed.x, curSpeed.y), L = limbs;
    let st = '대기';
    if (L.legL){
      if (climbing){ walkT += dt*(velY>0?9:0); const s=Math.sin(walkT)*0.7; L.armL.rotation.x=-2.4+s; L.armR.rotation.x=-2.4-s; L.legL.rotation.x=-0.4-s*.5; L.legR.rotation.x=-0.4+s*.5; st='🧗 오르는 중'; }
      else if (sm > 0.4 && grounded){ walkT += dt*(6.5*sm/WALK_SPEED+2.5); const s=Math.sin(walkT)*(0.55+sm/WALK_SPEED*.35); L.armL.rotation.x=s; L.armR.rotation.x=-s; L.legL.rotation.x=-s; L.legR.rotation.x=s; st = groundC && groundC.type==='ice' ? '🧊 미끄러지는 중' : '걷는 중'; }
      else if (!grounded){ const f=Math.min(1,Math.abs(velY)/20); L.armL.rotation.x=L.armR.rotation.x = velY>2 ? -0.25 : -0.25-f*.75; L.legL.rotation.x=velY>2?0.35:0.1; L.legR.rotation.x=velY>2?0.35:-0.1; st = velY>2?'점프!':'낙하 중'; }
      else { for (const k of ['armL','armR','legL','legR']) L[k].rotation.x *= 0.85; }

    if (speedBoostT > 0) st = '⚡ 스피드 ' + speedBoostT.toFixed(1) + 's';
    $('stateTag').textContent = finished ? '졸업!' : st;

    // 카메라
    const piv = new THREE.Vector3(pos.x, pos.y+2.2, pos.z);
    const cd = new THREE.Vector3(-Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), -Math.cos(camYaw)*Math.cos(camPitch));
    const rc = new THREE.Raycaster(piv, cd, 0, camDist+0.5); const hits = rc.intersectObjects(meshes, false);

    camera.position.copy(piv).addScaledVector(cd, eff); camera.lookAt(pos.x, pos.y+2, pos.z);

    for (const u in ghosts){ const gh=ghosts[u], k=Math.min(1,10*dt); gh.g.position.x+=(gh.t.x-gh.g.position.x)*k; gh.g.position.y+=(gh.t.y-gh.g.position.y)*k; gh.g.position.z+=(gh.t.z-gh.g.position.z)*k; let d=gh.t.ry-gh.ry; d=Math.atan2(Math.sin(d),Math.cos(d)); gh.ry+=d*k; gh.g.rotation.y=gh.ry; }

    if (!finished) $('timerTag').textContent = fmt(performance.now()-startTime);
    gameFrame(dt); updateConfetti(dt);
  }
  function onLand(L){
    if ((L.type === 'checkpoint' || L.type === 'finish') && L.level != null && L.level > cpIdx){
      cpIdx = L.level; respawnPos.copy(padPos(cpIdx)); lsSet(SAVE_KEY, String(Math.min(cpIdx, MAX_LV-1)));
      if (cpIdx > best){ best = cpIdx; lsSet(BEST_KEY, String(best)); updateStageTag(); }
      if (L.big){ celebrate(L.tier);
        try { if (!localStorage.getItem('rainbow100_tier_' + L.tier)){ localStorage.setItem('rainbow100_tier_' + L.tier, '1'); addShards(30); pop('🔷 +30 샤드', '#9fd3ff'); } } catch(e){}
      } else if (L.type !== 'finish') pop('LEVEL ' + cpIdx, TIERS[tierOf(cpIdx)].color);

    }

    if (L.type === 'kill'){ hitFlash(); onKill(); }

      $('finishTime').textContent = '이번 기록 ' + fmt(t);

      try { if (window.MP && MP.addXP) MP.addXP(800); } catch(e){}
      $('finishReward').textContent = reward;
      setTimeout(()=>$('finishOverlay').classList.add('show'), 500);
    }
  }
  animate();
  window.__OB = { levels, TIERS, get cp(){return cpIdx;}, moveVec, step(n, dt=1/60){ for (let i=0;i<n;i++) frame(dt); }, pause(v){ simPaused=v; }, pos, get facing(){return facing;}, set facing(v){facing=v;}, colliders, get climbing(){return climbing;}, get grounded(){return grounded;}, get cpIdx(){return cpIdx;}, respawn, keys, setShiftLock, onJumpPress, onJumpRelease, doFlick, get velY(){return velY;}, set velY(v){velY=v;}, set rawYaw(v){rawYaw=v;}, get rawYaw(){return rawYaw;} };
})();
