<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보카덱</title>
<meta name="theme-color" content="#12152a">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12152a;--bg2:#191d37;--panel:#20254a;--line:#2d335f;--ink:#eef0ff;--mute:#9aa0c8;--dim:#676d9a;
  --paper:#f7f2e7;--paperInk:#2a2438;--paperMute:#7d7488;
  --accent:#ff7a59;--accent2:#ffb347;--good:#3ddc97;--bad:#ff5d7a;--syn:#5fb3ff;--ant:#ff8fb1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.serif{font-family:Fraunces,Georgia,serif}

/* header */
header{padding:calc(18px + env(safe-area-inset-top)) 0 4px}
.logo{font-family:Fraunces,serif;font-size:27px;font-weight:700;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.logo small{font-family:Pretendard,sans-serif;font-size:12px;color:var(--mute);font-weight:500;margin-left:8px;letter-spacing:0}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:700}
.stat small{color:var(--mute);font-size:12px}

h2{font-size:17px;margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 small{font-size:12px;color:var(--mute);font-weight:500}
.muted{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:15px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);font-size:17px;flex:none}

/* review banner */
.review{margin-top:14px;background:linear-gradient(120deg,#3a2a52,#4a2c3c);border:1px solid #5c3f62;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.review div{flex:1;font-size:14px}
.review b{color:var(--accent2)}

/* set grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setcard{text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.setcard .em{font-size:26px}
.setcard .nm{font-weight:700;font-size:15px;line-height:1.3;word-break:keep-all}
.setcard .ct{font-size:12px;color:var(--mute);margin-top:auto}
.mbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#9be15d)}
.setcard.add{align-items:center;justify-content:center;border-style:dashed;color:var(--mute);font-weight:600}
.setcard.add .em{font-size:22px}

.lib{display:flex;flex-direction:column;gap:8px}
.librow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.librow .em{font-size:26px;width:36px;text-align:center}
.librow .tx{flex:1;min-width:0}
.librow .tx b{display:block;font-size:15px}
.librow .tx small{color:var(--mute);font-size:12px}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--panel);color:var(--mute);white-space:nowrap}
.tag.on{background:rgba(61,220,151,.15);color:var(--good)}

.empty{background:var(--bg2);border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--mute);font-size:14px;line-height:1.6}
.empty .big{font-size:34px;display:block;margin-bottom:6px}

/* search */
.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.sbox{display:flex;gap:8px;position:relative}
.sbox input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.sbox input:focus{border-color:var(--accent)}
.sugs{position:absolute;left:0;right:56px;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:10;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.sugs button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px}
.sugs button:last-child{border-bottom:0}
.target{display:flex;align-items:center;gap:8px;background:rgba(255,122,89,.12);border:1px solid rgba(255,122,89,.35);border-radius:12px;padding:8px 10px;font-size:13px;margin-top:8px}
.target span{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;font-size:13px;background:var(--panel);border:1px solid var(--line);font-weight:500}
.chip.syn{border-color:rgba(95,179,255,.45);color:#b8dcff;background:rgba(95,179,255,.1)}
.chip.ant{border-color:rgba(255,143,177,.45);color:#ffc7d8;background:rgba(255,143,177,.1)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.none{font-size:13px;color:var(--dim)}

/* word body */
.result{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:8px}
.wb-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.wb-word{font-family:Fraunces,serif;font-size:34px;font-weight:700;line-height:1.1;word-break:break-word}
.wb-phon{color:var(--mute);font-size:14px;margin-top:4px}
.wb-ko{margin-top:12px;font-size:18px;font-weight:700;color:var(--accent2)}
.note{font-size:12px;color:var(--mute);margin-bottom:8px}
.defs{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.def{border-left:3px solid var(--line);padding-left:12px}
.def p{margin:2px 0;font-size:14.5px;line-height:1.5}
.def .ex{color:var(--mute);font-style:italic;font-size:13.5px}
.pos{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.rel{margin-top:16px}
.rel h4{margin:0 0 8px;font-size:13px;display:flex;gap:6px;align-items:baseline}
.rel h4 small{color:var(--dim);font-weight:500}
.rel h4.s{color:var(--syn)}
.rel h4.a{color:var(--ant)}
.result .actions{margin-top:18px;display:flex;gap:8px}
.result .actions .btn{flex:1}
.loading{padding:40px;text-align:center;color:var(--mute)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* word list */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.wlist{display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:10px}
.wrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.wrow:last-child{border-bottom:0}
.wrow .tx{flex:1;min-width:0}
.wrow .tx b{font-family:Fraunces,serif;font-size:17px;font-weight:600}
.wrow .tx small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}
.dot.l{background:var(--accent2)}
.dot.m{background:var(--good)}
.x{width:30px;height:30px;border-radius:9px;color:var(--dim);font-size:15px;flex:none}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:8px;align-items:center}
.legend span{display:flex;align-items:center;gap:5px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,21,42,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex}
nav button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);font-weight:600}
nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--ink)}
nav button.on i{filter:none;opacity:1}

/* sheet */
#back{position:fixed;inset:0;background:rgba(5,6,15,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;justify-content:center}
#sheet.on{transform:none}
#sheet .in{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;overflow-y:auto;max-height:88vh;padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-head .em{font-size:30px}
.sh-head .tt{flex:1;min-width:0}
.sh-head .tt b{display:block;font-size:19px;word-break:keep-all}
.sh-head .tt small{color:var(--mute);font-size:13px}
#sheet .result{background:transparent;border:0;padding:0;margin:0}
.quick{display:flex;gap:6px;margin-top:8px}
.quick input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;color:inherit;font-family:inherit}
.quick input:focus,.rko:focus{border-color:var(--accent)}
.quick .btn{flex:none;padding-left:16px;padding-right:16px}
.quick-sub{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-top:6px;gap:8px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:12px;padding:4px 0;cursor:pointer;font-family:inherit}
.rko{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;outline:none;color:inherit;font-family:inherit;margin-top:4px}
.bulk-prev{font-size:12px;color:var(--mute);margin:-4px 0 12px}
.bulk-prev b{color:var(--accent)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;font-weight:600}
.field label em{color:var(--accent);font-style:normal}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;outline:none}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:20px}
.emojis button.sel{border-color:var(--accent);background:rgba(255,122,89,.15)}
.pick{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pick button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:left}
.pick button .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.pick button.sel{border-color:var(--accent)}
.pick button.sel .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.pick button span{flex:1}
.pick button small{color:var(--mute)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.hr{height:1px;background:var(--line);margin:18px 0}

/* study */
#study{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#232854,var(--bg) 70%);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 0 calc(16px + env(safe-area-inset-bottom))}
#study.on{display:flex}
#study .wrap{width:100%;display:flex;flex-direction:column;flex:1;min-height:0}
.st-top{display:flex;align-items:center;gap:10px}
.st-title{flex:1;text-align:center;font-weight:700;font-size:15px;min-width:0}
.st-title small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:12px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.card{position:relative;height:min(56vh,460px);perspective:1400px;touch-action:pan-y;transition:transform .25s;user-select:none;-webkit-user-select:none}
.card-in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);color:var(--paperInk);border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.04);overflow-y:auto}
.face.b{transform:rotateY(180deg);justify-content:flex-start}
.face.b>.cen{margin:auto 0}
.card[data-lean=r] .face{box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 4px var(--good)}
.card[data-lean=l] .face{box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 4px var(--bad)}
.f-word{font-family:Fraunces,serif;font-size:clamp(34px,10vw,52px);font-weight:700;line-height:1.1;word-break:break-word}
.f-phon{color:var(--paperMute);margin-top:8px;font-size:15px}
.f-ko{font-size:clamp(24px,7vw,32px);font-weight:800;line-height:1.3;word-break:keep-all}
.f-def{color:var(--paperMute);font-size:14.5px;line-height:1.5;margin-top:12px;max-width:360px}
.f-def .p{font-size:11px;font-weight:700;color:var(--accent);margin-right:4px}
.f-ex{font-style:italic;color:var(--paperMute);font-size:14px;margin-top:10px}
.f-rel{margin-top:14px;font-size:13px;line-height:1.6;max-width:360px}
.f-rel b{font-size:11px;margin-right:4px}
.f-rel .s{color:#2a7ad1}.f-rel .a{color:#d0457a}
.f-hint{position:absolute;bottom:16px;left:0;right:0;font-size:12px;color:#b3aab9}
.f-spk{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.05);font-size:17px}
.f-box{position:absolute;top:16px;left:16px;font-size:11px;font-weight:700;color:var(--paperMute);background:rgba(0,0,0,.05);padding:5px 9px;border-radius:999px}
.st-btns{display:flex;gap:10px;margin-top:20px}
.st-btns .btn{flex:1;padding:16px;font-size:16px;border-radius:18px}
.st-btns .no{background:rgba(255,93,122,.12);border-color:rgba(255,93,122,.4);color:#ffb3c1}
.st-btns .yes{background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.4);color:#9ff0c9}
.st-hint{text-align:center;color:var(--dim);font-size:12px;margin-top:12px}
.q-word{background:var(--paper);color:var(--paperInk);border-radius:24px;padding:30px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);position:relative}
.q-opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.q-opts button{background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;text-align:left;font-size:15px;line-height:1.4;font-weight:600;display:flex;gap:10px}
.q-opts button i{font-style:normal;color:var(--dim);font-weight:700}
.q-opts button.ok{border-color:var(--good);background:rgba(61,220,151,.14)}
.q-opts button.ng{border-color:var(--bad);background:rgba(255,93,122,.14)}
.q-opts button:disabled{cursor:default}
.res{text-align:center}
.res .big{font-size:60px}
.res h3{font-size:24px;margin:8px 0 4px}
.res-nums{display:flex;gap:10px;margin:20px 0}
.res-nums div{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px}
.res-nums b{display:block;font-size:26px}
.res-nums .g{color:var(--good)}.res-nums .r{color:var(--bad)}
.res .wlist{text-align:left;max-height:30vh;overflow-y:auto}
.res .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.card.fly-r{transform:translateX(130%) rotate(18deg)!important;opacity:0}
.card.fly-l{transform:translateX(-130%) rotate(-18deg)!important;opacity:0}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#fff;color:#1a1a2e;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translateX(-50%)}
#gmBtn{display:none!important}
#sync{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:11px;font-weight:600;opacity:.65;cursor:pointer;background:none;border:0;color:inherit;padding:0;font-family:inherit}
#sync svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sync.ok{color:#5dd39e;opacity:.9}#sync.err{color:#ff8a8a;opacity:.9}#sync.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="multiplayer.js" onerror="window.__mpFail=true"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="logo">Voca<span>Deck</span><small>보카덱</small></div><button id="sync" data-act="sync" title="지금 동기화"><svg viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg><span>연결 중…</span></button></div>
    <div class="stats" id="stats"></div>
  </header>
  <main id="view"></main>
</div>

<nav><div class="wrap">
  <button data-act="tab" data-arg="sets"><i>🗂️</i>세트</button>
  <button data-act="tab" data-arg="dict"><i>🔍</i>사전 검색</button>
  <button data-act="tab" data-arg="mine"><i>📖</i>내 단어</button>
  <button data-act="tab" data-arg="custom"><i>✍️</i>내 사전</button>
</div></nav>

<div id="back" data-act="sheet-close"></div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="study"><div class="wrap" id="studyIn"></div></div>
<div id="toast"></div>

<script>
/* ───────── 기본 라이브러리 ───────── */

/* ───────── 사전 API ───────── */
async function fetchJSON(u){const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)return null;return await r.json()}finally{clearTimeout(t)}}
async function translate(q,pair){
  try{const j=await fetchJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${pair}`);
    let t=(j&&j.responseData&&j.responseData.translatedText)||'';
    if(!t||/MYMEMORY|QUERY LENGTH|INVALID|PLEASE SELECT/i.test(t)||key(t)===key(q))return '';
    return t.trim();
  }catch(e){return ''}
}
async function lookup(q){
  q=q.trim();let note='';
  if(/[가-힣]/.test(q)){
    const t=await translate(q,'ko|en');
    if(!t)return {notFound:true,q};
    note=`‘${q}’ → ${t}`;
    q=t.toLowerCase().replace(/[^a-z\s'-]/g,'').trim().split(/\s+/).slice(0,3).join(' ');
    if(!q)return {notFound:true,q:t};
  }
  const w=key(q),enc=encodeURIComponent(w);
  const [d,syn,ant,ko]=await Promise.allSettled([
    fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+enc),
    fetchJSON('https://api.datamuse.com/words?rel_syn='+enc+'&max=12'),
    fetchJSON('https://api.datamuse.com/words?rel_ant='+enc+'&max=8'),
    translate(w,'en|ko')
  ]).then(r=>r.map(x=>x.status==='fulfilled'?x.value:null));
  const res={w,ko:ko||'',phon:'',audio:'',defs:[],syn:[],ant:[],note};
  if(Array.isArray(d)){
    for(const e of d){
      if(!res.phon)res.phon=e.phonetic||((e.phonetics||[]).find(p=>p.text)||{}).text||'';
      if(!res.audio)res.audio=((e.phonetics||[]).find(p=>p.audio)||{}).audio||'';
      for(const m of e.meanings||[]){
        for(const df of m.definitions||[]){
          if(res.defs.length<8)res.defs.push({pos:m.partOfSpeech,def:df.definition,ex:df.example||''});
          res.syn.push(...(df.synonyms||[]));res.ant.push(...(df.antonyms||[]));
        }
        res.syn.push(...(m.synonyms||[]));res.ant.push(...(m.antonyms||[]));
      }
    }
  }
  if(Array.isArray(syn))res.syn.push(...syn.map(x=>x.word));
  if(Array.isArray(ant))res.ant.push(...ant.map(x=>x.word));
  const lib=LIBINDEX[w];
  if(lib){if(!res.defs.length)res.defs=lib.defs.slice();res.syn.unshift(...lib.syn);res.ant.unshift(...lib.ant);res.ko=lib.ko}
  res.syn=uniq(res.syn,w).slice(0,14);res.ant=uniq(res.ant,w).slice(0,10);
  if(!res.defs.length&&!lib&&!(res.ko&&res.syn.length))return {notFound:true,q:w,note};
  return res;
}

function speak(w){
  const o=S.words[key(w)]||(lastResult&&key(lastResult.w)===key(w)?lastResult:null);
  const tts=()=>{if(!('speechSynthesis' in window))return toast('이 브라우저는 발음을 지원하지 않아요');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)};
  if(o&&o.audio){const a=new Audio(o.audio);a.play().catch(tts)}else tts();
}

/* ───────── 직접 입력 (한 줄에 하나씩, 여러 개) ───────── */
function parseBulk(txt){const out=[],bad=[];
  txt.split(/\r?\n/).forEach(line=>{const l=line.trim();if(!l)return;
    let m=l.match(/^(.+?)\s*(?:\t|\s[-–—=:]\s|[-–—=:]|,|\s{2,})\s*(.+)$/);
    if(m&&/[가-힣]/.test(m[1])&&!/[가-힣]/.test(m[2]))m=[0,m[2],m[1]];
    if(!m){const n=l.match(/^([A-Za-z][A-Za-z'’ .-]*?)\s+([^A-Za-z].*)$/);if(n)m=n}
    if(m&&m[1].trim()&&m[2].trim())out.push({w:m[1].trim(),ko:m[2].trim()});else bad.push(l)});
  return {out,bad}}
let bulkSet='';
function bulkSheet(){
  return `<div class="sh-head"><div class="tt"><b>단어 직접 입력</b><small>한 줄에 하나씩 · 단어와 뜻 사이에 - 나 : 를 넣어요</small></div></div>
  <div class="field"><label>단어 목록</label><textarea id="bulkTxt" style="min-height:180px" placeholder="apple - 사과\nabandon - 버리다, 포기하다\nrely on : ~에 의지하다\nserendipity = 뜻밖의 행운" autocapitalize="off" spellcheck="false"></textarea></div>
  <div class="bulk-prev" id="bulkPrev">엑셀이나 메모장에서 복사해서 붙여넣어도 돼요</div>
  <div class="field"><label>넣을 세트</label><select id="bulkSet"><option value="">세트에 넣지 않음 (내 단어에만)</option>${S.sets.map(x=>`<option value="${x.id}" ${x.id===bulkSet?'selected':''}>${esc(x.emoji+' '+x.name)}</option>`).join('')}<option value="__new">＋ 새 세트 만들기</option></select></div>
  <div class="field" id="bulkNewF" hidden><label>새 세트 이름</label><input id="bulkNew" placeholder="예: 3과 단어"></div>
  <button class="btn block pri" data-act="bulk-save">추가하기</button>`;
}
function bulkBind(){const t=$('#bulkTxt'),sel=$('#bulkSet');if(!t)return;
  t.oninput=()=>{const {out,bad}=parseBulk(t.value);$('#bulkPrev').innerHTML=t.value.trim()?`<b>${out.length}개</b> 인식됨${bad.length?` · 뜻이 없어서 빠지는 줄 ${bad.length}개`:''}`:'엑셀이나 메모장에서 복사해서 붙여넣어도 돼요'};
  sel.onchange=()=>{$('#bulkNewF').hidden=sel.value!=='__new';if(sel.value==='__new')$('#bulkNew').focus()};
  setTimeout(()=>t.focus(),250)}
function quickAdd(w,ko,sid){w=w.trim();ko=ko.trim();if(!w)return 'w';if(!ko)return 'k';

  ST={ids:shuffle([...ids]),i:0,mode,title,flipped:false,known:[],unknown:[],choices:null,ans:null};

function grade(k,ok){
  const o=S.words[k];if(!o)return;
  o.seen++;o.last=Date.now();
  if(ok){o.right++;o.box=Math.min(5,(o.box||0)+1);ST.known.push(k)}
  else{o.wrong++;o.box=0;ST.unknown.push(k)}
  save();
}

}
function relLine(o){
  const s=(o.syn||[]).slice(0,4),a=(o.ant||[]).slice(0,3);
  if(!s.length&&!a.length)return '';
  return `<div class="f-rel">${s.length?`<div><b class="s">≈</b>${esc(s.join(', '))}</div>`:''}${a.length?`<div><b class="a">↔</b>${esc(a.join(', '))}</div>`:''}</div>`;
}
function renderStudy(){
  const el=$('#studyIn');
  if(ST.i>=ST.ids.length)return renderResult();
  const k=ST.ids[ST.i],o=S.words[k];
  if(!o){ST.i++;return renderStudy()}
  const lv={n:'NEW',l:'학습 중',m:'외움'}[level(o)];
  const d=(o.defs||[])[0]||{};
  if(ST.mode==='flash'){
    const wordFace=`<button class="f-spk" data-act="speak" data-arg="${esc(o.w)}">🔊</button><div class="f-word">${esc(o.w)}</div>${o.phon?`<div class="f-phon">${esc(o.phon)}</div>`:''}`;
    const front=S.dir==='w2m'
      ?`${wordFace}<div class="f-hint">탭해서 뜻 보기</div>`
      :`<div class="f-ko">${esc(meaningOf(o))}</div>${o.ko&&d.def?`<div class="f-def">${esc(d.def)}</div>`:''}<div class="f-hint">탭해서 단어 보기</div>`;
    const back=S.dir==='w2m'
      ?`<div class="cen"><div class="f-ko">${esc(meaningOf(o))}</div>${(o.defs||[]).slice(0,2).map(x=>x.def&&(x.def!==o.ko||!o.ko)?`<div class="f-def">${x.pos?`<span class="p">${esc(posKo(x.pos))}</span>`:''}${o.ko?esc(x.def):''}</div>`:'').join('')}${d.ex?`<div class="f-ex">“${esc(d.ex)}”</div>`:''}${relLine(o)}</div>`
      :`<div class="cen">${wordFace}${d.ex?`<div class="f-ex">“${esc(d.ex)}”</div>`:''}${relLine(o)}</div>`;
    el.innerHTML=stTop()+`<div class="stage">
      <div class="card ${ST.flipped?'flip':''}" id="fcard"><div class="card-in">
        <div class="face"><span class="f-box">${lv}</span>${front}</div>
        <div class="face b">${back}</div></div></div>
      <div class="st-btns"><button class="btn no" data-act="answer" data-arg="0">😵 몰라요</button><button class="btn yes" data-act="answer" data-arg="1">🙂 알아요</button></div>
      <div class="st-hint">카드를 좌우로 밀어도 돼요 · 키보드: Space 뒤집기, ← →</div></div>`;
    bindCard();
  }else{
    if(!ST.choices){
      const label=x=>S.dir==='w2m'?meaningOf(x):x.w;
      const right=label(o),used=new Set([right]);
      const pool=shuffle(Object.keys(S.words).filter(x=>x!==k));const opts=[right];
      for(const x of pool){const l=label(S.words[x]);if(!used.has(l)){used.add(l);opts.push(l)}if(opts.length===4)break}
      ST.choices=shuffle(opts);ST.right=right;ST.ans=null;
    }
    const q=S.dir==='w2m'
      ?`<button class="f-spk" data-act="speak" data-arg="${esc(o.w)}">🔊</button><div class="f-word">${esc(o.w)}</div>${o.phon?`<div class="f-phon">${esc(o.phon)}</div>`:''}`
      :`<div class="f-ko">${esc(meaningOf(o))}</div>${o.ko&&d.def?`<div class="f-def">${esc(d.def)}</div>`:''}`;
    el.innerHTML=stTop()+`<div class="stage" style="justify-content:flex-start">
      <div class="q-word">${q}</div>
      <div class="muted" style="text-align:center;font-size:13px;margin-top:14px">${S.dir==='w2m'?'알맞은 뜻을 고르세요':'알맞은 단어를 고르세요'}</div>
      <div class="q-opts">${ST.choices.map((c,i)=>{let cls='';if(ST.ans!==null){if(c===ST.right)cls='ok';else if(i===ST.ans)cls='ng'}
        return `<button class="${cls}" data-act="quiz-pick" data-arg="${i}" ${ST.ans!==null?'disabled':''}><i>${'ABCD'[i]}</i><span>${esc(c)}</span></button>`}).join('')}</div>
      ${ST.ans!==null?`<button class="btn block pri" style="margin-top:14px" data-act="quiz-next">다음 →</button>`:''}</div>`;
  }
}
function bindCard(){
  const c=$('#fcard');if(!c)return;let sx=0,dx=0,down=false;
  c.onpointerdown=e=>{if(e.target.closest('[data-act]'))return;down=true;sx=e.clientX;dx=0;c.style.transition='none'};
  c.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;if(Math.abs(dx)>6){c.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;c.dataset.lean=dx>50?'r':dx<-50?'l':''}};
  const up=()=>{if(!down)return;down=false;c.style.transition='';
    if(Math.abs(dx)>90)answer(dx>0);
    else{c.style.transform='';c.dataset.lean='';if(Math.abs(dx)<6)flip()}};
  c.onpointerup=up;c.onpointercancel=up;c.onpointerleave=()=>{if(down)up()};
}
function flip(){if(!ST||ST.mode!=='flash')return;ST.flipped=!ST.flipped;const c=$('#fcard');c&&c.classList.toggle('flip',ST.flipped)}
let answering=false;
function answer(ok){
  if(!ST||answering||ST.i>=ST.ids.length)return;answering=true;
  const c=$('#fcard');if(c){c.style.transform='';c.classList.add(ok?'fly-r':'fly-l')}
  grade(ST.ids[ST.i],ok);
  setTimeout(()=>{answering=false;if(!ST)return;ST.i++;ST.flipped=false;renderStudy()},220);
}
function renderResult(){
  const n=ST.known.length+ST.unknown.length,pct=n?Math.round(ST.known.length/n*100):0;
  const face=pct===100?'🏆':pct>=80?'🔥':pct>=50?'💪':'🌱';
  const msg=pct===100?'완벽해요!':pct>=80?'거의 다 외웠어요':pct>=50?'좋아요, 조금만 더!':'반복하면 금방 외워져요';
  const wrong=[...new Set(ST.unknown)];
  $('#studyIn').innerHTML=`<div class="st-top"><button class="icon-btn" data-act="close-study">✕</button><div class="st-title">${esc(ST.title)}</div><span style="width:40px"></span></div>
  <div class="stage res" style="justify-content:flex-start;padding-top:20px;overflow-y:auto">
    <div class="big">${face}</div><h3>${msg}</h3><div class="muted">정답률 ${pct}%</div>
    <div class="res-nums"><div><b class="g">${ST.known.length}</b><span class="muted">알아요</span></div><div><b class="r">${ST.unknown.length}</b><span class="muted">몰라요</span></div></div>
    ${wrong.length?`<div class="muted" style="text-align:left;font-size:13px;margin-bottom:-4px">다시 볼 단어</div><div class="wlist">${wrong.map(k=>{const o=S.words[k];return o?`<div class="wrow"><span class="tx"><b>${esc(o.w)}</b><small>${esc(meaningOf(o))}</small></span></div>`:''}).join('')}</div>`:''}
    <div class="btns">${wrong.length?`<button class="btn pri block" data-act="retry" data-arg="wrong">🔁 몰랐던 ${wrong.length}개만 다시</button>`:''}
    <button class="btn block" data-act="retry" data-arg="all">처음부터 다시</button>
    <button class="btn block ghost" data-act="close-study">끝내기</button></div></div>`;
  ST._last={all:[...ST.ids],wrong};
}

/* ───────── 액션 ───────── */
function studyArg(arg){
  const [id,mode,flt]=arg.split('|');let ids,title;
  if(id==='weak'){ids=Object.keys(S.words).filter(k=>level(S.words[k])!=='m');title='못 외운 단어 복습'}
  else{const s=getSet(id);if(!s)return;ids=s.ids.slice();title=s.emoji+' '+s.name;if(flt==='weak'){ids=ids.filter(k=>level(S.words[k])!=='m');title+=' · 복습'}}
  startStudy(ids,mode||'flash',title);
}
const ACT={
  'bulk-open'(sid){bulkSet=sid||targetSet||'';openSheet(bulkSheet)},
  'bulk-save'(){const {out}=parseBulk($('#bulkTxt').value);if(!out.length)return toast('‘단어 - 뜻’ 형식으로 한 줄씩 써 주세요');
    let sid=$('#bulkSet').value;if(sid==='__new'){const n=$('#bulkNew').value.trim();if(!n)return toast('새 세트 이름을 적어주세요');sid=newSet(n).id}
    out.forEach(o=>quickAdd(o.w,o.ko,sid));save();sheetStack=[];if(sid)openSheet(()=>setSheet(sid));else drawSheet();render();toast(`${out.length}단어를 추가했어요`)},
  sync(){if(cloudUid)cloudPull();else toast('서버에 연결되지 않았어요')},
  tab(g){tab=g;closeAll();window.scrollTo(0,0);render();if(g==='dict')setTimeout(()=>{const q=$('#q');if(q&&!lastResult)q.focus()},50)},
  'sheet-close'(){closeSheet()},
  'open-set'(id){openSheet(()=>setSheet(id))},
  'new-set'(){openSheet(()=>setNameSheet(null));setTimeout(()=>$('#setName')&&$('#setName').focus(),300)},
  'rename-set'(id){openSheet(()=>setNameSheet(id))},
  'pick-emoji'(e,b){selEmoji=e;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))},
  'save-set'(id){
    const name=$('#setName').value.trim();if(!name)return toast('세트 이름을 적어주세요');
    if(id){const s=getSet(id);s.name=name;s.emoji=selEmoji;save();closeSheet();refresh();toast('저장했어요')}
    else{const s=newSet(name,selEmoji);save();sheetStack=[];openSheet(()=>setSheet(s.id));render();toast('새 세트를 만들었어요')}
  },
  'delete-set'(id){const s=getSet(id);if(!confirm(`‘${s.name}’ 세트를 삭제할까요?\n(단어는 내 단어에 남아 있어요)`))return;S.sets=S.sets.filter(x=>x.id!==id);if(targetSet===id)targetSet=null;save();closeSheet();refresh();toast('세트를 삭제했어요')},
  'rm-from-set'(arg){const [sid,k]=arg.split('|');const s=getSet(sid);s.ids=s.ids.filter(x=>x!==k);save();refresh()},
  'add-words'(id){targetSet=id;tab='dict';closeAll();render();setTimeout(()=>{const q=$('#q');q&&q.focus()},80)},
  'clear-target'(){targetSet=null;render()},
  'lib-preview'(id){openSheet(()=>libSheet(id))},
  'import-lib'(id){
    const l=LIB.find(x=>x.id===id);let s=S.imported[id]&&getSet(S.imported[id]);
    if(!s){s=newSet(l.name,l.emoji);l.words.forEach(a=>{const k=key(a[0]);if(!S.words[k])putWord(libToWord(a));s.ids.push(k)});S.imported[id]=s.id;save();toast(`${l.words.length}단어를 담았어요`)}
    sheetStack=[];openSheet(()=>setSheet(s.id));render();
  },
  study(arg){closeAll();studyArg(arg)},
  'study-list'(){const ks=JSON.parse($('#mineList').dataset.keys||'[]');startStudy(ks,'flash','📖 내 단어')},
  'close-study'(){closeStudy()},
  answer(g){answer(g==='1')},
  'dir-toggle'(){S.dir=S.dir==='w2m'?'m2w':'w2m';save();ST.flipped=false;ST.choices=null;renderStudy()},
  'quiz-pick'(i){if(ST.ans!==null)return;ST.ans=+i;grade(ST.ids[ST.i],ST.choices[ST.ans]===ST.right);renderStudy()},
  'quiz-next'(){ST.i++;ST.choices=null;ST.ans=null;renderStudy()},
  retry(g){const l=ST._last,m=ST.mode,t=ST.title.replace(/ · 다시$/,'');startStudy(g==='wrong'?l.wrong:l.all,m,t+(g==='wrong'?' · 다시':''))},
  speak(w){speak(w)},
  go(w){
    const k=key(w);
    if(S.words[k]){if(ST)return;openSheet(()=>wordSheet(k));return}
    closeAll();tab='dict';doSearch(w);window.scrollTo(0,0);
  },
  sug(w){closeAll();tab='dict';doSearch(w)},
  'clear-recent'(){S.recent=[];save();render()},
  'add-result'(){
    const r=lastResult;if(!r||r.notFound)return;const k=key(r.w);
    const rk=$('#rko');if(rk&&!S.words[k])r.ko=rk.value.trim();
    if(targetSet){
      if(!S.words[k])putWord({w:r.w,ko:r.ko,phon:r.phon,audio:r.audio,defs:r.defs,syn:r.syn,ant:r.ant,custom:false});
      const s=getSet(targetSet);const added=addToSet(targetSet,k);save();render();
      toast(added?`${s.name}에 추가했어요 ✓`:'이미 들어있는 단어예요');
      setTimeout(()=>{const q=$('#q');if(q){q.value='';q.focus()}},50);
    }else openPicker(S.words[k]||{w:r.w,ko:r.ko,phon:r.phon,audio:r.audio,defs:r.defs,syn:r.syn,ant:r.ant,custom:false});
  },
  'word-to-set'(k){openPicker(S.words[k])},
  'pick-toggle'(sid,b){pick.sel.has(sid)?pick.sel.delete(sid):pick.sel.add(sid);b.classList.toggle('sel');b.querySelector('.ck').textContent=pick.sel.has(sid)?'✓':''},
  'pick-save'(){
    const o=pick.obj,k=S.words[key(o.w)]?key(o.w):putWord(o);
    const nn=$('#pickNew').value.trim();if(nn)pick.sel.add(newSet(nn).id);
    let c=0;pick.sel.forEach(sid=>{if(addToSet(sid,k))c++});save();closeSheet();refresh();
    toast(c?`${c}개 세트에 넣었어요 ✓`:'내 단어에 저장했어요 ✓');
  },
  'open-word'(k){openSheet(()=>wordSheet(k))},
  'open-form'(k){openSheet(()=>formSheet(k||null))},
  'custom-from-search'(){const pre=lastResult&&lastResult.q&&!/[가-힣]/.test(lastResult.q)?{w:lastResult.q}:{};openSheet(()=>formSheet(null,pre))},
  'save-form'(oldK){
    const w=$('#fw').value.trim(),ko=$('#fko').value.trim();
    if(!w)return toast('단어를 적어주세요');if(!ko)return toast('한국어 뜻을 적어주세요');
    const k=key(w);
    if(!oldK&&S.words[k]&&!confirm(`‘${w}’는 이미 내 단어에 있어요.\n내가 쓴 뜻으로 덮어쓸까요?`))return;
    if(oldK&&oldK!==k&&S.words[k])return toast('같은 단어가 이미 있어요');
    const prev=oldK?S.words[oldK]:S.words[k];
    const defs=[{pos:$('#fpos').value,def:$('#fdef').value.trim(),ex:$('#fex').value.trim()}].concat(prev&&prev.defs?prev.defs.slice(1):[]);
    const obj={w,ko,defs,syn:splitList($('#fsyn').value),ant:splitList($('#fant').value),custom:oldK?(prev.custom||false):true};
    if(oldK&&oldK!==k){const old=S.words[oldK];delete S.words[oldK];S.words[k]=Object.assign({},old,obj);S.sets.forEach(s=>s.ids=s.ids.map(x=>x===oldK?k:x))}
    else{if(!oldK&&!prev){obj.phon='';obj.audio=''}putWord(obj)}
    const fs=$('#fset');if(fs&&fs.value)addToSet(fs.value,k);
    save();closeSheet();
    if(!oldK){sheetStack=[];openSheet(()=>wordSheet(k))}
    refresh();toast('저장했어요 ✓');
  },
  'delete-word'(k){if(!confirm(`‘${S.words[k].w}’를 삭제할까요?\n모든 세트에서도 빠져요`))return;delete S.words[k];S.sets.forEach(s=>s.ids=s.ids.filter(x=>x!==k));save();closeSheet();refresh();toast('삭제했어요')},
  filter(f){mineFilter=f;render()},
  sort(){mineSort=mineSort==='az'?'new':'az';render()}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){const s=$('#sugs');if(s&&!e.target.closest('.sbox'))s.hidden=true;return}
  if(b.disabled)return;
  const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg,b,e)}
});
document.addEventListener('keydown',e=>{
  if(!ST||ST.i>=ST.ids.length)return;
  if(ST.mode==='flash'){
    if(e.code==='Space'){e.preventDefault();flip()}
    else if(e.key==='ArrowRight')answer(true);
    else if(e.key==='ArrowLeft')answer(false);
  }else if(ST.ans===null&&/^[1-4]$/.test(e.key))ACT['quiz-pick'](String(+e.key-1));
  else if(ST.ans!==null&&(e.key==='Enter'||e.code==='Space')){e.preventDefault();ACT['quiz-next']()}
  if(e.key==='Escape')closeStudy();
});
render();
</script>
</body>
