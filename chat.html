<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1226">
<title>PlayHub 채팅</title>
<style>
  :root{
    --bg:#0b0e1c; --side:#121731; --panel:#161c3a; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --tx:#eef1ff; --tx2:#a9b0d6; --tx3:#6f77a3; --acc:#5b7cff; --acc2:#3a5cf0; --ok:#3ad98a; --bad:#ff5a6e; --hl:rgba(255,210,58,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  header{height:54px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--side);border-bottom:1px solid var(--line)}
  .hubBtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--tx);text-decoration:none;font-weight:800;font-size:13.5px}
  .hubBtn:hover{background:rgba(255,255,255,.12)}
  .iconBtn{width:38px;height:38px;border-radius:10px;display:none;align-items:center;justify-content:center;color:var(--tx2)}
  .iconBtn:hover{background:rgba(255,255,255,.08);color:var(--tx)}
  .chTitle{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-weight:900;font-size:16px}
  .chTitle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chTitle small{font-weight:600;font-size:12px;color:var(--tx3);white-space:nowrap}
  .conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3);white-space:nowrap}
  .conn i{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
  .conn.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}

  main{flex:1;min-height:0;display:flex}
  #side{width:240px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #side .scroll{flex:1;overflow-y:auto;padding:10px 8px}
  .sec{font-size:11.5px;font-weight:900;letter-spacing:.06em;color:var(--tx3);margin:14px 8px 6px;display:flex;align-items:center;justify-content:space-between}
  .sec:first-child{margin-top:4px}
  .ch{width:100%;display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:9px;color:var(--tx2);font-weight:700;font-size:14px;text-align:left}
  .ch:hover{background:rgba(255,255,255,.05);color:var(--tx)}
  .ch.cur{background:rgba(91,124,255,.18);color:#fff}
  .ch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch .badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .ch .badge:empty{display:none}
  .ch.unread .nm{color:#fff}
  .ch img{width:22px;height:22px;border-radius:50%;background:#222a50}
  .ch .dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex:none}
  .ch .dot.on{background:var(--ok)}
  .ch .x{opacity:0;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
  .ch:hover .x{opacity:1} .ch .x:hover{background:rgba(255,255,255,.1);color:var(--tx)}
  .ch .x svg.i{width:13px;height:13px}
  .empty{font-size:12.5px;color:var(--tx3);padding:4px 10px 6px;line-height:1.5}
  .roomBox{display:flex;gap:6px;padding:4px 4px 2px}
  .roomBox input{flex:1;min-width:0;height:34px;border-radius:9px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--tx);padding:0 10px;font:700 13px inherit;font-family:inherit;text-transform:uppercase;letter-spacing:.08em}
  .roomBox input::placeholder{letter-spacing:0;text-transform:none;color:var(--tx3);font-weight:600}
  .smallBtn{height:34px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.08);font-weight:800;font-size:12.5px;white-space:nowrap}
  .smallBtn:hover{background:rgba(255,255,255,.15)}
  .smallBtn.pri{background:var(--acc)} .smallBtn.pri:hover{background:var(--acc2)}
  #me{flex:none;display:flex;align-items:center;gap:9px;padding:10px 12px;border-top:1px solid var(--line);background:rgba(0,0,0,.18)}
  #me img{width:34px;height:34px;border-radius:50%;background:#222a50}
  #me .who{flex:1;min-width:0}
  #me .who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #me .who small{font-size:11.5px;color:var(--tx3)}

  #center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  #banner{display:none;margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:rgba(255,90,110,.14);border:1px solid rgba(255,90,110,.35);color:#ffc6cd;font-size:13px;line-height:1.5}
  #banner.on{display:block}
  #msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 0 6px;overscroll-behavior:contain}
  .welcome{padding:22px 18px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .welcome .big{width:54px;height:54px;border-radius:16px;background:rgba(91,124,255,.18);color:#9fb2ff;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .welcome .big svg.i{width:28px;height:28px}
  .welcome h2{margin:0 0 4px;font-size:21px}
  .welcome p{margin:0;color:var(--tx2);font-size:13.5px;line-height:1.55}
  .day{display:flex;align-items:center;gap:10px;margin:14px 18px 6px;color:var(--tx3);font-size:12px;font-weight:800}
  .day::before,.day::after{content:'';flex:1;height:1px;background:var(--line)}
  .msg{position:relative;display:flex;gap:11px;padding:3px 18px 3px 18px}
  .msg:hover{background:rgba(255,255,255,.025)}
  .msg.first{margin-top:10px}
  .msg .av{width:38px;flex:none}
  .msg .av img{width:38px;height:38px;border-radius:50%;background:#222a50;display:block}
  .msg .tm2{display:none;font-size:10.5px;color:var(--tx3);text-align:center;line-height:21px}
  .msg:not(.first):hover .tm2{display:block}
  .msg .body{flex:1;min-width:0}
  .msg .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:1px}
  .msg .hd b{font-size:14.5px}
  .msg .hd b.mine{color:#9fb2ff}
  .msg .hd time{font-size:11.5px;color:var(--tx3)}
  .msg .tx{font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#dfe3ff}
  .msg .tx a{color:#7fb0ff}
  .msg.ment{background:var(--hl);box-shadow:inset 3px 0 0 #ffd23a}
  .msg.pend .tx{opacity:.55}
  .msg .del{position:absolute;right:12px;top:2px;display:none;width:28px;height:28px;border-radius:8px;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line2);color:var(--tx3)}
  .msg .del:hover{color:var(--bad)}
  .msg:hover .del{display:flex}
  .msg .del svg.i{width:15px;height:15px}
  #typing{height:22px;flex:none;padding:0 18px;font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:6px}
  #typing .dots{display:inline-flex;gap:3px}
  #typing .dots i{width:5px;height:5px;border-radius:50%;background:var(--tx2);animation:tdot 1s infinite}
  #typing .dots i:nth-child(2){animation-delay:.15s} #typing .dots i:nth-child(3){animation-delay:.3s}
  @keyframes tdot{0%,60%,100%{opacity:.25}30%{opacity:1}}
  #compose{flex:none;padding:0 14px 14px}
  #compose .box{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:6px 6px 6px 14px}
  #compose .box:focus-within{border-color:rgba(91,124,255,.6)}
  #inp{flex:1;min-width:0;resize:none;border:none;outline:none;background:none;color:var(--tx);font:15px/1.45 inherit;font-family:inherit;max-height:140px;padding:7px 0}
  #inp::placeholder{color:var(--tx3)}
  #send{width:40px;height:40px;border-radius:11px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
  #send:disabled{background:rgba(255,255,255,.08);color:var(--tx3);cursor:default}
  #compose .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);padding:4px 4px 0}
  #compose .meta .over{color:var(--bad)}
  #jump{position:absolute;right:22px;bottom:96px;display:none;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--acc);color:#fff;font-size:12.5px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  #jump.on{display:flex}

  #members{width:220px;flex:none;background:var(--side);border-left:1px solid var(--line);overflow-y:auto;padding:12px 8px}
  .mem{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--tx2)}
  .mem .pic{position:relative;width:30px;height:30px;flex:none}
  .mem .pic img{width:30px;height:30px;border-radius:50%;background:#222a50}
  .mem .pic i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--side)}
  .mem.off{opacity:.45} .mem.off .pic i{background:var(--tx3)}
  .mem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mem small{font-size:10.5px;color:var(--tx3);font-weight:800}

  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:#1f2650;border:1px solid var(--line2);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;transition:.2s;z-index:50;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%)}
  #scrim{display:none}

  @media (max-width:1060px){ #members{display:none} #members.open{display:block;position:fixed;right:0;top:54px;bottom:0;z-index:30;box-shadow:-10px 0 30px rgba(0,0,0,.5)} #bMembers{display:flex} }
  @media (max-width:760px){
    #side{position:fixed;left:0;top:54px;bottom:0;z-index:30;transform:translateX(-102%);transition:transform .2s;width:min(280px,84vw);box-shadow:10px 0 30px rgba(0,0,0,.5)}
    #side.open{transform:none}
    #bMenu{display:flex}
    .hubBtn .lbl{display:none} .hubBtn{padding:0 8px}
    .conn span{display:none}
    .msg{padding-left:12px;padding-right:12px} .msg .av,.msg .av img{width:34px} .msg .av img{height:34px}
    #compose{padding:0 8px 8px} #compose .meta .hint{display:none}
    .msg .del{display:flex;opacity:.0} .msg:active .del,.msg.sel .del{opacity:1}
  }
  #scrim.on{display:block;position:fixed;inset:54px 0 0 0;background:rgba(0,0,0,.45);z-index:25}
</style>
</head>
<body>
<header>
  <button class="iconBtn" id="bMenu" aria-label="채널 목록"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="hubBtn" href="hub.html" title="허브로 돌아가기"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span class="lbl">허브</span></a>
  <div class="chTitle"><span id="chIcon"></span><span id="chName">채팅</span><small id="chSub"></small></div>
  <div class="conn" id="conn"><i></i><span>연결 중…</span></div>
  <button class="iconBtn" id="bMembers" aria-label="접속자"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2c2.1.6 3.5 2.6 3.5 5.8"/></svg></button>
</header>
<main>
  <nav id="side">
    <div class="scroll">
      <div class="sec">공개 채널</div>
      <div id="pubList"></div>
      <div class="sec">친구 DM</div>
      <div id="dmList"><div class="empty">불러오는 중…</div></div>
      <div class="sec">비밀방</div>
      <div id="roomList"></div>
      <div class="roomBox"><input id="roomCode" maxlength="12" placeholder="방 코드 입력" autocomplete="off" spellcheck="false"><button class="smallBtn" id="bJoin">입장</button></div>
      <div class="roomBox"><button class="smallBtn pri" id="bNewRoom" style="flex:1">새 비밀방 만들기</button></div>
    </div>
    <div id="me"><img alt=""><div class="who"><b>…</b><small>게스트</small></div><button class="smallBtn" id="bName">이름</button></div>
  </nav>
  <section id="center" style="position:relative">
    <div id="banner"></div>
    <div id="msgs"></div>
    <button id="jump"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span>새 메시지</span></button>
    <div id="typing"></div>
    <div id="compose">
      <div class="box"><textarea id="inp" rows="1" maxlength="400" placeholder="메시지 보내기" disabled></textarea>
        <button id="send" aria-label="보내기" disabled><svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></svg></button></div>
      <div class="meta"><span class="hint">Enter 보내기 · Shift+Enter 줄바꿈 · @이름 으로 부르기</span><span id="cnt"></span></div>
    </div>
  </section>
  <aside id="members"></aside>
</main>
<div id="scrim"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="multiplayer.js" onerror="window.__mpFail=true"></script>
<script>
'use strict';
const $ = id=>document.getElementById(id);
const PUB = [
  { id:'general', name:'일반',       desc:'PlayHub 에 온 누구나 자유롭게 이야기하는 곳이에요.' },
  { id:'game',    name:'게임 이야기', desc:'게임 공략, 같이 할 사람 구하기, 버그 제보까지.' },
  { id:'study',   name:'공부 질문',   desc:'숙제나 퀴즈 러시 문제, 모르는 걸 같이 풀어요.' },
  { id:'talk',    name:'잡담',       desc:'아무 말 대잔치. 서로 예의는 지켜 주세요.' }
];
const KEEP = 60, MAXLEN = 300, ONLINE_MS = 75000, TYPING_MS = 4500, GROUP_MS = 5 * 60000;
const ICON = {
  hash:'<svg class="i" viewBox="0 0 24 24"><path d="M5 9h15M4 15h15M10 3L8 21M16 3l-2 18"/></svg>',
  lock:'<svg class="i" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
  at:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  bubble:'<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>'
};
const BAD = /(시발|씨발|ㅅㅂ|ㅆㅂ|병신|ㅂㅅ|개새끼|좆|존나|ㅈㄴ|미친놈|fuck|shit)/gi;
const clean = t=>String(t || '').replace(/[\u0000-\u0009\u000b-\u001f\u007f]/g, '').replace(/\n{3,}/g, '\n\n').trim().slice(0, MAXLEN).replace(BAD, m=>'#'.repeat(m.length));
const esc = t=>String(t).replace(/[&<>"']/g, c=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const lsGet = (k, d)=>{ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } };
const lsSet = (k, v)=>{ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
let toastT = 0;
function toast(s){ const el = $('toast'); el.textContent = s; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('on'), 2400); }
function banner(s){ const b = $('banner'); b.innerHTML = s || ''; b.classList.toggle('on', !!s); }

const mpOn = !window.__mpFail && typeof firebase !== 'undefined' && typeof MP !== 'undefined' && MP.isConfigured && MP.isConfigured();
let me = null, db = null;
const now = ()=>(mpOn && MP.serverNow) ? MP.serverNow() : Date.now();
const myName = ()=>{ try { return String(MP.getDisplayName() || '게스트').slice(0, 16); } catch(e){ return '게스트'; } };
const myLo = ()=>{ try { return MP.getLocalAvatarLoadout() || null; } catch(e){ return null; } };
const face = lo=>{ try { return MP.headshot2D(lo || null); } catch(e){ return ''; } };

// ---- 채널 ----
// 메시지는 방(rooms/chat_<채널>/players/<내 uid>) 안의 내 칸에 내 것만 쓴다: { name, lo, on, ty, m:{ id:{t,x} } }
// 모두가 그 방 전체를 듣고 합쳐서 시간순으로 보여 준다. 한 사람당 최근 KEEP 개만 남긴다.
const seen = lsGet('chat_seen', {});
let rooms = lsGet('chat_rooms', []);            // 최근 비밀방 코드
let friends = [];                               // [{uid, nickname, online, avatar}]
const W = {};                                   // key → { ref, data, unread, lastOther }
let cur = null;                                 // { key, kind, id, name, desc }
function chanRef(key){ return db.ref('playhub_mp/rooms/chat_' + key + '/players'); }
function dmKey(uid){ return 'dm_' + [me, uid].sort().join('_'); }
function chanInfo(key){
  const p = PUB.find(c=>c.id === key);
  if (p) return { key, kind:'pub', name:p.name, desc:p.desc };
  if (key.startsWith('r_')){ const code = key.slice(2); return { key, kind:'room', id:code, name:'비밀방 ' + code, desc:'코드 ' + code + ' 를 아는 사람만 들어올 수 있는 방이에요. 코드를 친구에게 알려 주세요.' }; }
  if (key.startsWith('dm_')){ const other = key.slice(3).split('_').find(u=>u !== me) || ''; const f = friends.find(x=>x.uid === other);
    return { key, kind:'dm', id:other, name:f ? f.nickname : '친구', desc:'두 사람만 보는 대화예요.' }; }
  return null;
}

function watch(key){
  if (W[key]) return W[key];
  const w = W[key] = { ref:chanRef(key), data:{}, unread:0, lastOther:0 };
  w.ref.on('value', snap=>{
    w.data = snap.val() || {};
    let last = 0, n = 0; const s = seen[key] || 0;
    for (const uid in w.data){ if (uid === me) continue; const m = w.data[uid] && w.data[uid].m; if (!m) continue;
      for (const id in m){ const t = +m[id].t || 0; if (t > last) last = t; if (t > s) n++; } }
    w.lastOther = last; w.unread = n;
    if (cur && cur.key === key){ markSeen(); renderChat(); } else renderSide();
    updateTitle();
  }, err=>{ if (cur && cur.key === key) banner('이 채널을 읽을 수 없어요 (' + esc(err && err.code || err) + ').'); });
  return w;
}
function unwatch(key){ const w = W[key]; if (!w) return; w.ref.off(); delete W[key]; }
function markSeen(){ if (!cur || document.hidden) return; const w = W[cur.key]; if (!w) return;
  const t = Math.max(w.lastOther, seen[cur.key] || 0); if (w.unread || seen[cur.key] !== t){ seen[cur.key] = t; w.unread = 0; lsSet('chat_seen', seen); renderSide(); updateTitle(); } }
function updateTitle(){ let n = 0; for (const k in W) n += W[k].unread || 0; document.title = (n ? '(' + n + ') ' : '') + (cur ? cur.name + ' · ' : '') + 'PlayHub 채팅'; }

// ---- 내 상태 (접속 표시 · 입력 중) ----
let myRef = null, beatT = 0;
function joinPresence(key){
  leavePresence();
  myRef = chanRef(key).child(me);
  const ref = myRef;
  ref.onDisconnect().update({ on:0, ty:0 }).catch(()=>{});
  const beat = ()=>ref.update({ name:myName(), lo:myLo(), on:firebase.database.ServerValue.TIMESTAMP }).then(()=>{ if (ref === myRef) banner(''); }).catch(writeErr);
  beat(); beatT = setInterval(beat, 30000);
}
function leavePresence(){ clearInterval(beatT); if (!myRef) return; const r = myRef; myRef = null; r.update({ on:0, ty:0 }).catch(()=>{}); try { r.onDisconnect().cancel(); } catch(e){} }
function writeErr(err){ const code = String(err && (err.code || err.message) || err);
  if (/permission/i.test(code)) banner('서버가 이 채팅방에 글 쓰는 걸 막았어요 (PERMISSION_DENIED). 잠시 후 다시 시도하거나, Firebase 보안 규칙에서 <b>playhub_mp/rooms</b> 쓰기를 허용해 주세요.');
  else banner('보내지 못했어요: ' + esc(code)); }

// ---- 채널 열기 ----
function open(key, push){
  const info = chanInfo(key); if (!info) return;
  if (cur && cur.key === key){ closeDrawers(); return; }
  if (cur && cur.kind !== 'pub' && !isListed(cur.key)) unwatch(cur.key);
  cur = info; lastSig = ''; stick = true;
  if (info.kind === 'room' && !rooms.includes(info.id)){ rooms.unshift(info.id); rooms = rooms.slice(0, 8); lsSet('chat_rooms', rooms); }
  lsSet('chat_last', key);
  if (push !== false || info.kind !== 'pub'){ const q = info.kind === 'pub' ? '?c=' + info.key : info.kind === 'room' ? '?room=' + info.id : '?dm=' + info.id; try { history.replaceState(null, '', q); } catch(e){} }
  $('chIcon').innerHTML = info.kind === 'room' ? ICON.lock : info.kind === 'dm' ? ICON.at : ICON.hash;
  $('chName').textContent = info.name; $('chSub').textContent = '';
  $('inp').placeholder = (info.kind === 'pub' ? '#' : '') + info.name + ' 에 메시지 보내기';
  banner(''); watch(key); joinPresence(key); renderSide(); renderChat(); closeDrawers(); updateTitle();
  if (matchMedia('(min-width:761px)').matches) $('inp').focus();
}
function isListed(key){ return PUB.some(c=>c.id === key) || (key.startsWith('r_') && rooms.includes(key.slice(2))) || (key.startsWith('dm_') && friends.some(f=>dmKey(f.uid) === key)); }

// ---- 왼쪽 목록 ----
function badge(key){ const w = W[key]; return w && w.unread ? (w.unread > 99 ? '99+' : String(w.unread)) : ''; }
function renderSide(){
  if (!me) return;
  $('pubList').innerHTML = PUB.map(c=>{ const k = c.id, b = badge(k);
    return '<button class="ch' + (cur && cur.key === k ? ' cur' : '') + (b ? ' unread' : '') + '" data-k="' + k + '">' + ICON.hash + '<span class="nm">' + esc(c.name) + '</span><span class="badge">' + b + '</span></button>'; }).join('');
  $('dmList').innerHTML = friends.length ? friends.map(f=>{ const k = dmKey(f.uid), b = badge(k);
    return '<button class="ch' + (cur && cur.key === k ? ' cur' : '') + (b ? ' unread' : '') + '" data-k="' + k + '"><img src="' + face(f.avatar) + '" alt=""><span class="nm">' + esc(f.nickname) + '</span><span class="badge">' + b + '</span><i class="dot' + (f.online ? ' on' : '') + '"></i></button>'; }).join('')
    : '<div class="empty">아직 친구가 없어요. 허브의 친구 탭에서 친구를 추가하면 여기서 1:1 대화를 할 수 있어요.</div>';
  $('roomList').innerHTML = rooms.map(code=>{ const k = 'r_' + code, b = badge(k);
    return '<button class="ch' + (cur && cur.key === k ? ' cur' : '') + (b ? ' unread' : '') + '" data-k="' + k + '">' + ICON.lock + '<span class="nm">' + code + '</span><span class="badge">' + b + '</span><span class="x" data-rm="' + code + '" title="목록에서 빼기">' + ICON.x + '</span></button>'; }).join('');
}
$('side').addEventListener('click', e=>{
  const rm = e.target.closest('[data-rm]'); if (rm){ e.stopPropagation(); const code = rm.dataset.rm; rooms = rooms.filter(c=>c !== code); lsSet('chat_rooms', rooms);
    if (cur && cur.key === 'r_' + code){ open('general'); } unwatch('r_' + code); renderSide(); return; }
  const b = e.target.closest('[data-k]'); if (b) open(b.dataset.k);
});
const roomCode = s=>String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
function joinRoom(){ const code = roomCode($('roomCode').value); if (code.length < 4){ toast('방 코드를 4자 이상 써 주세요'); return; } if (code === 'PUBLIC'){ $('roomCode').value = ''; open('general'); return; } $('roomCode').value = ''; watch('r_' + code); open('r_' + code); }
$('bJoin').onclick = joinRoom;
$('roomCode').addEventListener('keydown', e=>{ if (e.key === 'Enter') joinRoom(); });
$('roomCode').addEventListener('input', e=>{ const v = roomCode(e.target.value); if (v !== e.target.value) e.target.value = v; });
$('bNewRoom').onclick = ()=>{ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let i=0;i<6;i++) c += A[Math.floor(Math.random()*A.length)];
  watch('r_' + c); open('r_' + c); copy(location.origin + location.pathname + '?room=' + c, '비밀방 ' + c + ' 을 만들었어요. 초대 링크를 복사했어요'); };
function copy(s, msg){ try { navigator.clipboard.writeText(s).then(()=>toast(msg), ()=>toast(msg.replace(/[.,]?\s*초대 링크를 복사했어요/, ''))); } catch(e){ toast(msg); } }
$('bName').onclick = ()=>{ const n = prompt('채팅에서 쓸 이름 (최대 12자)', myName()); if (n == null) return; const v = clean(n).replace(/\s+/g, ' ').slice(0, 12);
  if (!v){ toast('이름을 써 주세요'); return; } MP.setNickname(v, ()=>{}); renderMe(); if (myRef) myRef.update({ name:v }).catch(()=>{}); toast('이름을 ' + v + ' 으로 바꿨어요'); };
function renderMe(){ const box = $('me'); box.querySelector('img').src = face(myLo()); box.querySelector('b').textContent = myName();
  let acct = false; try { acct = MP.isLoggedIn && MP.isLoggedIn(); } catch(e){} box.querySelector('small').textContent = acct ? '로그인됨' : '게스트'; }

// ---- 메시지 ----
let lastSig = '', stick = true;
function allMsgs(){ const w = cur && W[cur.key]; if (!w) return []; const out = [];
  for (const uid in w.data){ const p = w.data[uid] || {}; const m = p.m; if (!m) continue;
    for (const id in m){ const v = m[id]; if (!v || typeof v.x !== 'string') continue; out.push({ id, uid, t:+v.t || now(), x:v.x, name:String(p.name || '플레이어').slice(0, 16), lo:p.lo }); } }
  return out.sort((a, b)=>a.t - b.t || (a.id < b.id ? -1 : 1)); }
function dayLabel(t){ const d = new Date(t), n = new Date(now()); const k = x=>x.getFullYear() * 400 + x.getMonth() * 32 + x.getDate();
  if (k(d) === k(n)) return '오늘'; const y = new Date(n); y.setDate(n.getDate() - 1); if (k(d) === k(y)) return '어제';
  return (d.getFullYear() !== n.getFullYear() ? d.getFullYear() + '년 ' : '') + (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
const hm = t=>{ const d = new Date(t); let h = d.getHours(); const ap = h < 12 ? '오전' : '오후'; h = h % 12 || 12; return ap + ' ' + h + ':' + String(d.getMinutes()).padStart(2, '0'); };
function fmt(x){ let s = esc(x).replace(/\bhttps?:\/\/[^\s<]+[^\s<.,!?)'"]/g, u=>'<a href="' + u + '" target="_blank" rel="noopener noreferrer nofollow">' + u + '</a>');
  return s; }
function mentions(x){ const nm = myName().toLowerCase(); return nm.length > 0 && x.toLowerCase().includes('@' + nm); }
function renderChat(){
  if (!cur) return;
  const list = allMsgs();
  const sig = cur.key + '|' + list.map(m=>m.id + (m.t ? 1 : 0) + m.name).join(',') + '|' + myName();
  if (sig !== lastSig){
    lastSig = sig;
    const box = $('msgs'), atBottom = stick || box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    let h = '<div class="welcome"><div class="big">' + (cur.kind === 'room' ? ICON.lock : cur.kind === 'dm' ? ICON.at : ICON.hash) + '</div><h2>' + esc(cur.kind === 'pub' ? '#' + cur.name : cur.name) + '</h2><p>' + esc(cur.desc) + '<br>새로 들어온 사람도 한 사람당 최근 ' + KEEP + '개의 메시지까지 볼 수 있어요.</p>'
      + (cur.kind === 'room' ? '<p style="margin-top:10px"><button class="smallBtn" id="bInvite">초대 링크 복사</button></p>' : '') + '</div>';
    let prev = null, prevDay = '';
    for (const m of list){
      const day = dayLabel(m.t);
      if (day !== prevDay){ h += '<div class="day">' + day + '</div>'; prevDay = day; prev = null; }
      const first = !prev || prev.uid !== m.uid || m.t - prev.t > GROUP_MS;
      const mine = m.uid === me;
      h += '<div class="msg' + (first ? ' first' : '') + (!mine && mentions(m.x) ? ' ment' : '') + '" data-id="' + m.id + '" data-u="' + m.uid + '">'
        + '<div class="av">' + (first ? '<img src="' + face(m.lo) + '" alt="">' : '<div class="tm2">' + hm(m.t).replace(/^오[전후] /, '') + '</div>') + '</div>'
        + '<div class="body">' + (first ? '<div class="hd"><b' + (mine ? ' class="mine"' : '') + '>' + esc(m.name) + '</b><time>' + hm(m.t) + '</time></div>' : '')
        + '<div class="tx">' + fmt(m.x) + '</div></div>'
        + (mine ? '<button class="del" data-del="' + m.id + '" title="삭제">' + ICON.trash + '</button>' : '') + '</div>';
      prev = m;
    }
    box.innerHTML = h;
    const inv = $('bInvite'); if (inv) inv.onclick = ()=>copy(location.origin + location.pathname + '?room=' + cur.id, '초대 링크를 복사했어요');
    if (atBottom){ box.scrollTop = box.scrollHeight; $('jump').classList.remove('on'); }
    else if (list.length && list[list.length - 1].uid !== me) $('jump').classList.add('on');
    stick = false;
  }
  renderMembers(); renderTyping();
}
$('msgs').addEventListener('scroll', ()=>{ const b = $('msgs'); if (b.scrollHeight - b.scrollTop - b.clientHeight < 40) $('jump').classList.remove('on'); });
$('jump').onclick = ()=>{ const b = $('msgs'); b.scrollTop = b.scrollHeight; $('jump').classList.remove('on'); };
$('msgs').addEventListener('click', e=>{
  const d = e.target.closest('[data-del]');
  if (d){ if (!myRef) return; myRef.child('m/' + d.dataset.del).remove().then(()=>toast('메시지를 지웠어요')).catch(writeErr); return; }
  const m = e.target.closest('.msg'); document.querySelectorAll('.msg.sel').forEach(x=>{ if (x !== m) x.classList.remove('sel'); }); if (m) m.classList.toggle('sel');
});

function renderMembers(){
  const w = cur && W[cur.key]; if (!w) return; const t = now(); const on = [], off = [];
  for (const uid in w.data){ const p = w.data[uid] || {}; const isOn = uid === me || (+p.on || 0) > t - ONLINE_MS;
    (isOn ? on : off).push({ uid, name:String(p.name || '플레이어').slice(0, 16), lo:p.lo, n:p.m ? Object.keys(p.m).length : 0 }); }
  if (!w.data[me]) on.push({ uid:me, name:myName(), lo:myLo() });
  const byName = (a, b)=>a.name.localeCompare(b.name, 'ko');
  on.sort(byName); off.sort((a, b)=>b.n - a.n);
  const row = (p, isOn)=>'<div class="mem' + (isOn ? '' : ' off') + '"><div class="pic"><img src="' + face(p.lo) + '" alt=""><i></i></div><span>' + esc(p.name) + '</span>' + (p.uid === me ? '<small>나</small>' : '') + '</div>';
  $('members').innerHTML = '<div class="sec">지금 접속 중 — ' + on.length + '</div>' + on.map(p=>row(p, true)).join('')
    + (off.length ? '<div class="sec">이 방에 왔던 사람 — ' + off.length + '</div>' + off.slice(0, 40).map(p=>row(p, false)).join('') : '');
  $('chSub').textContent = on.length + '명 접속 중';
}
function renderTyping(){
  const w = cur && W[cur.key]; const el = $('typing'); if (!w){ el.innerHTML = ''; return; } const t = now();
  const who = Object.keys(w.data).filter(u=>u !== me && (+w.data[u].ty || 0) > t - TYPING_MS && (+w.data[u].on || 0) > t - ONLINE_MS).map(u=>String(w.data[u].name || '플레이어').slice(0, 16));
  el.innerHTML = who.length ? '<span class="dots"><i></i><i></i><i></i></span><span>' + esc(who.length > 3 ? who.slice(0, 2).join(', ') + ' 외 ' + (who.length - 2) + '명' : who.join(', ')) + ' 입력 중…</span>' : '';
}
setInterval(()=>{ if (cur){ renderMembers(); renderTyping(); } }, 3000);

// ---- 보내기 ----
const inp = $('inp');
let lastSend = 0, sendHist = [], lastTy = 0;
function autosize(){ inp.style.height = 'auto'; inp.style.height = Math.min(140, inp.scrollHeight) + 'px'; }
function updCnt(){ const n = inp.value.trim().length; $('cnt').innerHTML = n > MAXLEN - 60 ? '<span class="' + (n > MAXLEN ? 'over' : '') + '">' + n + ' / ' + MAXLEN + '</span>' : ''; $('send').disabled = !n || n > MAXLEN || !myRef; }
inp.addEventListener('input', ()=>{ autosize(); updCnt();
  if (myRef && inp.value.trim() && Date.now() - lastTy > 2500){ lastTy = Date.now(); myRef.update({ ty:firebase.database.ServerValue.TIMESTAMP }).catch(()=>{}); } });
inp.addEventListener('keydown', e=>{ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); send(); } });
$('send').onclick = ()=>{ send(); inp.focus(); };
function send(){
  if (!myRef || !cur) return;
  const raw = inp.value; if (raw.trim().length > MAXLEN){ toast(MAXLEN + '자까지 보낼 수 있어요'); return; }
  const x = clean(raw); if (!x) return;
  const t = Date.now();
  if (t - lastSend < 700){ toast('조금 천천히 보내 주세요'); return; }
  sendHist = sendHist.filter(s=>t - s < 8000); if (sendHist.length >= 6){ toast('너무 빨리 보내고 있어요. 잠깐 쉬었다 보내 주세요'); return; }
  lastSend = t; sendHist.push(t); lastTy = 0;
  const ref = myRef, id = ref.child('m').push().key, TS = firebase.database.ServerValue.TIMESTAMP;
  const up = { name:myName(), lo:myLo(), on:TS, ty:0 }; up['m/' + id] = { t:TS, x };
  inp.value = ''; autosize(); updCnt(); stick = true;
  ref.update(up).then(()=>{ banner(''); trim(ref); }).catch(err=>{ writeErr(err); if (!inp.value){ inp.value = raw; autosize(); updCnt(); } });
}
function trim(ref){ const w = cur && W[cur.key]; const mine = w && w.data[me] && w.data[me].m; if (!mine) return;
  const ids = Object.keys(mine).sort((a, b)=>(+mine[a].t || 0) - (+mine[b].t || 0) || (a < b ? -1 : 1)); if (ids.length <= KEEP) return;
  const up = {}; ids.slice(0, ids.length - KEEP).forEach(id=>{ up['m/' + id] = null; }); ref.update(up).catch(()=>{}); }

// ---- 모바일 서랍 ----
function closeDrawers(){ $('side').classList.remove('open'); $('members').classList.remove('open'); $('scrim').classList.remove('on'); }
$('bMenu').onclick = ()=>{ const o = !$('side').classList.contains('open'); closeDrawers(); if (o){ $('side').classList.add('open'); $('scrim').classList.add('on'); } };
$('bMembers').onclick = ()=>{ const o = !$('members').classList.contains('open'); closeDrawers(); if (o){ $('members').classList.add('open'); $('scrim').classList.add('on'); } };
$('scrim').onclick = closeDrawers;
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) markSeen(); });

// ---- 시작 ----
function setConn(on, label){ const c = $('conn'); c.classList.toggle('on', !!on); c.querySelector('span').textContent = label; }
function start(){
  db = firebase.database();
  db.ref('.info/connected').on('value', s=>setConn(s.val(), s.val() ? '온라인' : '다시 연결 중…'));
  inp.disabled = false; renderMe();
  PUB.forEach(c=>watch(c.id));
  rooms.forEach(code=>watch('r_' + code));
  MP.onFriendsUpdate(list=>{
    const old = friends.map(f=>dmKey(f.uid));
    friends = (list || []).filter(f=>f && f.uid).slice(0, 30);
    const now2 = friends.map(f=>dmKey(f.uid));
    old.filter(k=>!now2.includes(k) && !(cur && cur.key === k)).forEach(unwatch);
    now2.forEach(watch);
    if (cur && cur.kind === 'dm'){ const f = friends.find(x=>x.uid === cur.id); if (f && f.nickname !== cur.name){ cur.name = f.nickname; $('chName').textContent = f.nickname; } }
    renderSide();
  });
  try { MP.setPresence('chat', null); } catch(e){}
  const q = new URLSearchParams(location.search);
  let key = null;
  if (q.get('room')){ const c = roomCode(q.get('room')); key = c === 'PUBLIC' ? 'general' : c.length >= 4 ? 'r_' + c : null; }
  else if (q.get('dm') && q.get('dm') !== me) key = dmKey(q.get('dm'));
  else if (q.get('c') && PUB.some(c=>c.id === q.get('c'))) key = q.get('c');
  if (!key){ const last = lsGet('chat_last', 'general'); key = chanInfo(last) && (last.startsWith('dm_') ? last.includes(me) : true) ? last : 'general'; }
  if (key.startsWith('r_')) watch(key);
  open(key, !!(q.get('room') || q.get('dm') || q.get('c')));
  updCnt();
}
renderSide();
if (!mpOn){ setConn(false, '오프라인'); banner('온라인 서버에 연결할 수 없어요. 인터넷 연결을 확인하고 새로고침해 주세요.'); $('dmList').innerHTML = ''; }
else {
  let done = false;
  const to = setTimeout(()=>{ if (!done) banner('서버 로그인에 시간이 오래 걸리고 있어요… 잠시만 기다려 주세요.'); }, 8000);
  try {
    MP.initAuthOnly(user=>{
      if (!user){ return; }
      if (done){ if (user.uid !== me) location.reload(); else renderMe(); return; }
      done = true; clearTimeout(to); me = user.uid; banner(''); start();
    });
  } catch(e){ banner('채팅 서버를 시작하지 못했어요: ' + esc(e && e.message || e)); }
}
window.addEventListener('pagehide', ()=>leavePresence());
</script>
</body>
</html>
