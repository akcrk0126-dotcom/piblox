    cb=>gl.load('gen-anims.glb', g=>{ ASSET.anims = g.animations; ASSET.animScene = g.scene; cb(); }, undefined, cb),
    cb=>gl.load('gen-nature.glb', g=>{ ASSET.nature = g.scene; cb(); }, undefined, cb),

    cb=>gl.load('mo-golem.glb', g=>{ ASSET.golem = g; cb(); }, undefined, cb),

}

function updateCamera(dt){ const tx = P.x, ty = P.y + (P.swim ? .6 : 1.45) + (P.leapY || 0)*.5, tz = P.z;

  for (const m of MONS){ if (m.dead || set.has(m)) continue; const dx = m.x - fx0, dz = m.z - fz0, d = Math.hypot(dx, dz); if (d > range + m.D.r || Math.abs(m.y - P.y) > 4) continue;
    if (arc < Math.PI && d > m.D.r && Math.abs(angDiff(P.yaw, Math.atan2(dx, dz))) > arc) continue; set.add(m); damageMon(m, mult, o); n++; }
  for (const b of BREAK){ if (b.dead || set.has(b)) continue; if (Math.hypot(b.x - fx0, b.z - fz0) < range + b.r){ set.add(b); smash(b); } }
  if (o.set === undefined) P.hitSet = new Set(); return n; }
function areaHit(x, z, r, mult, o){ for (const m of MONS){ if (m.dead) continue; if (Math.hypot(m.x - x, m.z - z) < r + m.D.r) damageMon(m, mult, o); } }

  scene.add(mesh); const t = P.target && !P.target.dead && dist2(P.target) < 28 ? P.target : autoTarget(24); let vx = Math.sin(P.yaw), vy = 0, vz = Math.cos(P.yaw);
  if (t){ const tx = t.x - mesh.position.x, ty = t.y + t.D.h*.5 - mesh.position.y, tz = t.z - mesh.position.z, l = Math.hypot(tx, ty, tz) || 1; vx = tx/l; vy = ty/l; vz = tz/l; }

  const tx = P.x - mesh.position.x, ty = P.y + 1.2 - mesh.position.y, tz = P.z - mesh.position.z, l = Math.hypot(tx, ty, tz) || 1; PROJ.push({ mesh, vx:tx/l*15, vy:ty/l*15, vz:tz/l*15, life:3, from:m, mine:false, col:0xff6a20, size:.38 }); }

function groundWarn(x, z, r, life){ const mk = (geo, op)=>new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:0xff3020, transparent:true, opacity:op, depthWrite:false, side:THREE.DoubleSide }));
  const ring = mk(new THREE.RingGeometry(r*.92, r, 48).rotateX(-Math.PI/2), .75), fill = mk(new THREE.CircleGeometry(r, 48).rotateX(-Math.PI/2), .3); fill.scale.setScalar(.01);
  const g = new THREE.Group(); g.add(ring, fill); g.position.set(x, groundAt(x, z) + .15, z); g.renderOrder = 3; scene.add(g); WARN.push({ g, fill, t:0, life }); }

    if (k >= 1){ scene.remove(w.g); w.g.traverse(o=>{ if (o.isMesh){ o.geometry.dispose(); o.material.dispose(); } }); WARN.splice(i, 1); } } }

    if (b.mine && b.target && !b.target.dead){ const t = b.target; const tx = t.x - p.x, ty = t.y + t.D.h*.5 - p.y, tz = t.z - p.z, l = Math.hypot(tx, ty, tz) || 1; const sp = Math.hypot(b.vx, b.vy, b.vz); b.vx = lerp(b.vx, tx/l*sp, Math.min(1, dt*6)); b.vy = lerp(b.vy, ty/l*sp, Math.min(1, dt*6)); b.vz = lerp(b.vz, tz/l*sp, Math.min(1, dt*6)); }

    if (!done && b.mine){ for (const m of MONS){ if (m.dead) continue; if (Math.hypot(p.x - m.x, p.z - m.z) < m.D.r + .5 && p.y > m.y - .5 && p.y < m.y + m.D.h + .5){ done = true;

function autoTarget(range){ let best = null, bs = 1e9; const fx0 = Math.sin(P.yaw), fz0 = Math.cos(P.yaw);

let UID = 1;
function makeGear(slot, tier, rar, cls){ tier = clamp(tier, 0, 5); cls = cls || P.cls; const k = RAR[rar].k; const g = { uid:Date.now().toString(36) + (UID++), slot, tier, rar, enh:0, cls:slot === 'weapon' ? cls : null };
  g.name = slot === 'weapon' ? GEAR_NAMES[cls][tier] : GEAR_NAMES[slot][tier];

  else if (slot === 'armor'){ g.def = Math.round((3 + tier*4.5)*k); g.hp = Math.round((15 + tier*28)*k); }

function questItem(){ const q = curQ(); if (!q || q.type !== 'collect') return; const before = QUEST.cur.prog; QUEST.cur.prog = Math.min(q.n, INV.count(q.tg)); if (before < q.n && QUEST.cur.prog >= q.n){ audio.sfx.quest(); bigToast('퀘스트 완료! 촌장에게 돌아가세요', '#8fff8a'); } updQuestUI(); }

  QUEST.done = q.id; QUEST.cur = null; gainExp(r.exp); audio.sfx.fanfare(); chatSys('퀘스트 [' + q.t + '] 완료 — 경험치 ' + r.exp + ', ' + r.gold + 'G', '#8fff8a'); updQuestUI(); updInvUI(); saveChar(); }

    const d = { id:'c' + Date.now().toString(36), name:nm, cls:lgClass, sex:lgSex, hc:lgHair, lv:1, exp:0, gold:50, inv:[{ id:'potHp', n:5 }, { id:'potMp', n:3 }], eq:{ weapon:makeGear('weapon', 0, 0, lgClass), armor:makeGear('armor', 0, 0), acc:null }, qd:0 };

const CRITTERS = [];
function buildCritters(){ if (ASSET.horse){ for (let i = 0; i < 6; i++){ const o = ASSET.horse.scene.clone(true); o.scale.setScalar(.022); const x = rnd(-40, 40), z = rnd(70, 120); o.position.set(x, sampleH(x, z), z); scene.add(o); o.traverse(c=>{ if (c.isMesh){ c.castShadow = true; c.material = c.material.clone(); c.material.color.setHex([0x8a5a3a, 0x5a3a2a, 0xd8c8b0][i%3]); c.material.roughness = .7; } });
      const mx = new THREE.AnimationMixer(o); const a = mx.clipAction(ASSET.horse.animations[0]); a.play(); a.time = Math.random(); CRITTERS.push({ o, mx, a, kind:'horse', x, z, yaw:rnd(0, 6), tx:x, tz:z, t:rnd(0, 5) }); } }
  if (ASSET.bird){ for (let i = 0; i < 7; i++){ const o = ASSET.bird.scene.clone(true); o.scale.setScalar(.035); scene.add(o); const mx = new THREE.AnimationMixer(o); const a = mx.clipAction(ASSET.bird.animations[0]); a.play(); a.time = Math.random();
      CRITTERS.push({ o, mx, kind:'bird', cx:rnd(-120, 120), cz:rnd(-120, 120), r:rnd(25, 60), h:rnd(28, 50), sp:rnd(.15, .3)*(Math.random() < .5 ? 1 : -1), ph:rnd(0, 6) }); } }
  for (const L of LAMPS){ const g = new THREE.Group(); const pole = new THREE.Mesh(new THREE.CylinderGeometry(.08, .1, 3.4, 6), new THREE.MeshStandardMaterial({ color:0x3a2a1a, roughness:.8 })); pole.position.y = 1.7; g.add(pole);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(.42, .5, .42), new THREE.MeshStandardMaterial({ color:0xffd890, emissive:0xffb050, emissiveIntensity:1.1 })); lamp.position.y = 3.5; g.add(lamp); if (lampLights.length < (LOW ? 2 : 5) && Math.hypot(L.x - VILLAGE.x, L.z - VILLAGE.z) < 14){ const pl = new THREE.PointLight(0xffb060, 0, 16, 2); pl.position.y = 3.3; g.add(pl); lampLights.push(pl); } g.position.set(L.x, L.y, L.z); g.traverse(c=>{ if (c.isMesh) c.castShadow = true; }); scene.add(g); addCol({ x:L.x, z:L.z, r:.3, top:L.y + 3.8 }); } }
function tickCritters(dt){ for (const c of CRITTERS){ if (c.kind === 'horse'){ c.t -= dt; const d = Math.hypot(c.tx - c.x, c.tz - c.z); if (c.t <= 0){ c.t = rnd(4, 10); c.tx = clamp(c.x + rnd(-15, 15), -60, 60); c.tz = clamp(c.z + rnd(-15, 15), 68, 130); }
      const run = Math.hypot(P.x - c.x, P.z - c.z) < 6; if (run){ c.tx = c.x + (c.x - P.x)*3; c.tz = c.z + (c.z - P.z)*3; }
      if (d > .6){ const sp = run ? 7 : 1.6; c.x += (c.tx - c.x)/d*sp*dt; c.z += (c.tz - c.z)/d*sp*dt; c.yaw = turnTo(c.yaw, Math.atan2(c.tx - c.x, c.tz - c.z), dt*3); c.a.timeScale = run ? 1.6 : .5; } else c.a.timeScale = .05;
      c.o.position.set(c.x, sampleH(c.x, c.z), c.z); c.o.rotation.y = c.yaw; if (Math.hypot(c.x - P.x, c.z - P.z) < 90) c.mx.update(dt); }
    else { c.ph += c.sp*dt; c.o.position.set(c.cx + Math.cos(c.ph)*c.r, c.h + Math.sin(c.ph*2)*3, c.cz + Math.sin(c.ph)*c.r); c.o.rotation.y = -c.ph + (c.sp > 0 ? 0 : Math.PI); c.mx.update(dt); } } }

const GAME = { state:'loading', tip:0, zone:null, time:0 };
let worldBuilt = false, noRender = false, lastT = performance.now(), saveT = 0, miniT = 0, lgT = 0;
function buildWorldOnce(){ if (worldBuilt) return; worldBuilt = true; prepAnims(); buildTerrain(); buildWater(); buildSkyX(); buildLights(); buildGrassMat(); populate(); buildBones(); buildFires(); buildNPCs(); buildCritters(); buildWeatherFx(); buildMapImage(); populateMons(); spawnWorldBoss();
  if (ASSET.env){ try { scene.environment = pmrem.fromEquirectangular(ASSET.env).texture; } catch(e){} } }
function frame(rdt){ clock.t += rdt; let dt = rdt; if (clock.stop > 0){ clock.stop -= rdt; dt = rdt*.15; } 
  if (GAME.state === 'play'){ keyInput(); P.time = (P.time || 0) + rdt;

    const fighting = MONS.some(m=>!m.dead && m.aggro && m.st !== 'return' && dist2(m) < 25); audio.setMode(worldBoss && !worldBoss.dead && dist2(worldBoss) < 30 && worldBoss.aggro ? 'boss' : fighting ? 'battle' : inTown() ? 'village' : 'field');
    saveT += rdt; if (saveT > 15){ saveT = 0; saveChar(); }

  if (worldBuilt){ const fx = GAME.state === 'play' ? P.x : VILLAGE.x, fz = GAME.state === 'play' ? P.z : VILLAGE.z; tickEnv(rdt, fx, fz); tickWeatherFx(rdt, camera.position.x, camera.position.y, camera.position.z); cullCells(camera.position.x, camera.position.z); tickPost();
    tickSpr(dt); tickBones(dt); tickFires(rdt); for (const c of clouds){ c.a += c.sp*rdt; c.o.position.x = Math.cos(c.a)*c.d; c.o.position.z = Math.sin(c.a)*c.d; }
    if (water){ water.material.uniforms.uT.value = UNI.uT.value; water.material.uniforms.camP.value.copy(camera.position); water.position.x = Math.round(camera.position.x/50)*50; water.position.z = Math.round(camera.position.z/50)*50; }
