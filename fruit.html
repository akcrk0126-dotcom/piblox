<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1c14">
<title>프루티 팝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  :root { --cream:#fff6e8; --ink:#3a2418; --pink:#ff5a7a; --pinkD:#d63a5c; --green:#35c27a; --gold:#ffc83d; }
  html, body { width:100%; height:100%; overflow:hidden; background:#2a1c14; font-family:'Jua','Noto Sans KR','Malgun Gothic',sans-serif; touch-action:none; color:var(--cream); }
  #c { position:fixed; inset:0; display:block; width:100%; height:100%; }
  .out { text-shadow:0 2px 0 rgba(60,30,15,.55), 0 0 10px rgba(40,20,10,.45); }
  #hud { position:fixed; inset:0; pointer-events:none; display:none; }
  #hud.on { display:block; }
  #scoreBox { position:absolute; left:calc(14px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top)); }
  #score { font:700 44px/1 'Fredoka','Jua',sans-serif; color:#fff; letter-spacing:.01em; }
  #score.bump { animation:bump .25s ease-out; }
  @keyframes bump { 0% { transform:scale(1.18); } 100% { transform:scale(1); } }
  #bestL { font-size:14px; opacity:.85; margin-top:4px; }
  #topR { position:absolute; right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); display:flex; gap:8px; align-items:flex-start; pointer-events:auto; }
  .tb { width:40px; height:40px; border-radius:14px; background:rgba(255,246,232,.16); border:2px solid rgba(255,246,232,.35); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; text-decoration:none; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .tb:active { transform:scale(.92); }
  #next { width:84px; height:96px; border-radius:22px; background:rgba(255,246,232,.9); border:3px solid #fff; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 6px 0 rgba(60,30,15,.35); }
  #next b { font-size:13px; letter-spacing:.1em; color:#9a6a4c; }
  #next img { width:58px; height:58px; object-fit:contain; }
  #evo { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; gap:2px; padding:6px 10px; border-radius:20px; background:rgba(40,24,14,.45); border:2px solid rgba(255,246,232,.25); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #evo img { width:30px; height:30px; object-fit:contain; opacity:.28; filter:grayscale(1); transition:opacity .3s, filter .3s, transform .3s; }
  #evo img.got { opacity:1; filter:none; }
  #evo img.top { transform:scale(1.3); filter:drop-shadow(0 0 6px #fff6c8); }
  #evo i { color:rgba(255,246,232,.4); font-style:normal; font-size:10px; align-self:center; }
  #btnR { position:absolute; right:calc(12px + env(safe-area-inset-right)); bottom:calc(64px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; align-items:flex-end; pointer-events:auto; }
  #shake { min-width:92px; height:54px; padding:0 14px; border-radius:18px; border:3px solid #fff; background:linear-gradient(#ff7d95, var(--pink)); color:#fff; font:22px 'Jua',sans-serif; box-shadow:0 5px 0 var(--pinkD); cursor:pointer; display:flex; align-items:center; gap:6px; justify-content:center; }
  #shake:active { transform:translateY(3px); box-shadow:0 2px 0 var(--pinkD); }
  #shake.off { filter:grayscale(1) brightness(.8); opacity:.6; }
  #shake span { font-size:13px; background:#fff; color:var(--pinkD); border-radius:10px; padding:1px 7px; }
  #rot { display:flex; gap:8px; }
  #rot .tb { width:48px; height:48px; font-size:22px; }
  #toast { -webkit-text-stroke:1.5px #7a3a20; position:absolute; left:50%; top:24%; transform:translate(-50%,-50%); font-size:40px; color:#fff; white-space:nowrap; opacity:0; pointer-events:none; }
  #toast.show { animation:toast 1.6s ease-out forwards; }
  @keyframes toast { 0% { opacity:0; transform:translate(-50%,-50%) scale(.4); } 15% { opacity:1; transform:translate(-50%,-50%) scale(1.15); } 25% { transform:translate(-50%,-50%) scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-70%) scale(1); } }
  #combo { -webkit-text-stroke:1.5px #7a3a20; position:absolute; left:50%; top:36%; transform:translate(-50%,-50%); font:700 34px 'Fredoka','Jua',sans-serif; color:var(--gold); opacity:0; pointer-events:none; white-space:nowrap; }
  #combo.show { animation:combo .9s ease-out forwards; }
  @keyframes combo { 0% { opacity:0; transform:translate(-50%,-50%) scale(.5) rotate(-8deg); } 20% { opacity:1; transform:translate(-50%,-50%) scale(1.25) rotate(4deg); } 40% { transform:translate(-50%,-50%) scale(1) rotate(0); } 75% { opacity:1; } 100% { opacity:0; } }
  .pop { position:fixed; font:700 24px 'Fredoka','Jua',sans-serif; color:#fff; pointer-events:none; transform:translate(-50%,-50%); animation:pop .95s ease-out forwards; white-space:nowrap; z-index:5; }
  @keyframes pop { 0% { opacity:0; transform:translate(-50%,-30%) scale(.5); } 15% { opacity:1; transform:translate(-50%,-60%) scale(1.25); } 30% { transform:translate(-50%,-70%) scale(1); } 100% { opacity:0; transform:translate(-50%,-180%) scale(.9); } }
  #danger { position:fixed; inset:0; pointer-events:none; box-shadow:inset 0 0 0 0 rgba(255,40,60,0); transition:box-shadow .2s; }
  .scr { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; padding:20px; z-index:10; }
  .scr.on { display:flex; }
  #title { background:radial-gradient(ellipse at center, rgba(42,28,20,.0) 30%, rgba(30,18,10,.55) 100%); }
  .card { background:rgba(255,246,232,.94); color:var(--ink); border-radius:30px; border:4px solid #fff; box-shadow:0 10px 0 rgba(60,30,15,.4), 0 20px 50px rgba(0,0,0,.35); padding:22px 26px 20px; width:min(440px, 92vw); text-align:center; }
  .logo { font:700 54px/0.95 'Fredoka','Jua',sans-serif; letter-spacing:.01em; background:linear-gradient(180deg,#ffb13d 0%,#ff5a7a 55%,#e03a8a 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:0; filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 5px 0 rgba(120,40,40,.35)); }
  .logoK { font-size:22px; color:#b0704c; margin-top:6px; letter-spacing:.3em; }
  .chain { display:flex; flex-wrap:wrap; justify-content:center; gap:1px; margin:14px 0 6px; }
  .chain img { width:34px; height:34px; object-fit:contain; animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
  .how { font-size:15px; line-height:1.55; color:#6b4a36; margin:8px 0 14px; }
  .how b { color:var(--pinkD); font-weight:normal; }
  .big { display:block; width:100%; height:62px; border-radius:22px; border:0; background:linear-gradient(#5fe39c, var(--green)); color:#fff; font:30px 'Jua',sans-serif; box-shadow:0 6px 0 #1f8f55; cursor:pointer; text-shadow:0 2px 0 rgba(0,80,40,.35); }
  .big:active { transform:translateY(4px); box-shadow:0 2px 0 #1f8f55; }
  .big:disabled { filter:grayscale(.8); opacity:.7; }
  .row2 { display:flex; gap:10px; margin-top:12px; justify-content:center; }
  .small { display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 16px; border-radius:14px; border:2px solid #e8cdb4; background:#fff; color:#8a5a3c; font:17px 'Jua',sans-serif; text-decoration:none; cursor:pointer; }
  .bestT { margin-top:10px; color:#9a6a4c; font-size:16px; }
  #bar { height:8px; border-radius:6px; background:#f0dcc6; overflow:hidden; margin:0 0 12px; }
  #bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ffb13d,#ff5a7a); transition:width .2s; }
  .ovT { font:700 44px 'Fredoka','Jua',sans-serif; color:var(--pinkD); }
  .ovS { font:700 64px/1 'Fredoka',sans-serif; color:var(--ink); margin:6px 0 2px; }
  .ovL { font-size:16px; color:#9a6a4c; }
  .newB { display:inline-block; margin-top:6px; padding:3px 12px; border-radius:12px; background:var(--gold); color:#6b3a00; font-size:17px; animation:bump .6s ease-out infinite alternate; }
  .ovTop { display:flex; align-items:center; justify-content:center; gap:10px; margin:12px 0 14px; font-size:18px; color:#6b4a36; }
  .ovTop img { width:54px; height:54px; object-fit:contain; }
  #pause .card { width:min(320px, 88vw); }
  body.touch #rot { display:flex; }
  body:not(.touch) #rot { display:none; }
  #keys { position:absolute; left:calc(14px + env(safe-area-inset-left)); top:calc(92px + env(safe-area-inset-top)); font-size:12px; opacity:.6; line-height:1.5; }
  body.touch #keys { display:none; }
  @media (max-width:560px) {
    #score { font-size:36px; }
    #next { width:70px; height:82px; border-radius:18px; } #next img { width:46px; height:46px; }
    #evo img { width:22px; height:22px; } #evo { gap:0; padding:5px 8px; }
    .logo { font-size:46px; } .chain { gap:0; } .chain img { width:25px; height:25px; }
    #toast { font-size:30px; } #combo { font-size:28px; }
    #btnR { bottom:calc(58px + env(safe-area-inset-bottom)); }
  }
  #errorPanel { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:99; }
  #errorPanel.show { display:flex; }
  #errorBox { background:#fff; color:#900; padding:16px; border-radius:12px; max-width:90vw; max-height:70vh; overflow:auto; white-space:pre-wrap; font:12px monospace; }
  #rivals { position:absolute; right:calc(12px + env(safe-area-inset-right)); top:50%; transform:translateY(-50%); width:190px; background:rgba(40,24,14,.55); border-radius:14px; padding:8px 10px; pointer-events:none; font-family:'Jua',sans-serif; }
  #rivals .rvH { font-size:13px; opacity:.85; margin-bottom:4px; }
  #rivals .rv { display:flex; align-items:center; gap:6px; font-size:14px; height:26px; }
  #rivals .rv b { width:14px; opacity:.7; } #rivals .rv img { width:22px; height:22px; } #rivals .rv span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } #rivals .rv i { font-style:normal; color:#ffe066; }
  #rivals .rv.me { color:#9dffb0; } #rivals .rv.out { opacity:.5; }
  @media (max-width:700px){ #rivals { top:auto; bottom:120px; transform:none; width:160px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="danger"></div>
<div id="hud">
  <div id="rivals" style="display:none"></div>
  <div id="scoreBox" class="out"><div id="score">0</div><div id="bestL">최고 0</div></div>
  <div id="topR">
    <div id="next"><b>다음</b><img id="nextImg" alt=""></div>
    <div style="display:flex; flex-direction:column; gap:8px">
      <button class="tb" id="bPause" type="button" aria-label="일시정지">❚❚</button>
      <button class="tb" id="bMute" type="button" aria-label="소리">🔊</button>
    </div>
  </div>
  <div id="btnR">
    <button id="shake" type="button">흔들기 <span id="shakeN">2</span></button>
    <div id="rot"><button class="tb" id="rotL" type="button">↺</button><button class="tb" id="rotR" type="button">↻</button></div>
  </div>
  <div id="keys" class="out">마우스로 조준 · 클릭 떨어뜨리기<br>우클릭 드래그 / Q·E 회전 · F 흔들기</div>
  <div id="evo"></div>
  <div id="toast" class="out"></div>
  <div id="combo" class="out"></div>
</div>
<div id="title" class="scr on"><div class="card">
  <div class="logo">FRUITY POP</div>
  <div class="logoK">프루티 팝</div>
  <div class="chain" id="chain"></div>
  <div class="how">같은 과일끼리 닿으면 <b>뿅!</b> 하고 더 큰 과일이 돼요.<br>체리에서 시작해서 <b>수박</b>까지 키워 보세요.<br>유리병 위로 넘친 채 3초가 지나면 끝!</div>
  <div id="bar"><i id="barI"></i></div>
  <button class="big" id="start" type="button" disabled>불러오는 중…</button>
  <div class="bestT" id="bestT"></div>
  <div class="row2"><a class="small" href="hub.html">⌂ 허브로</a></div>
</div></div>
<div id="over" class="scr"><div class="card">
  <div class="ovT">넘쳤다!</div>
  <div class="ovS" id="ovS">0</div>
  <div class="ovL" id="ovL">최고 0</div>
  <div id="ovNew"></div>
  <div class="ovTop" id="ovTop"></div>
  <button class="big" id="again" type="button">한 판 더</button>
  <div class="row2"><a class="small" href="hub.html">⌂ 허브로</a><button class="small" id="toTitle" type="button">처음으로</button></div>
</div></div>
<div id="pause" class="scr"><div class="card">
  <div class="ovT" style="color:var(--ink)">잠깐 쉬기</div><br>
  <button class="big" id="resume" type="button">계속하기</button>
  <div class="row2"><button class="small" id="restart" type="button">다시 시작</button><button class="small" id="pTitle" type="button">처음으로</button></div>
</div></div>
<div id="errorPanel"><div id="errorBox"></div></div>
<script>
  window.addEventListener('error', function(e){
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') return;
    var b=document.getElementById('errorBox'); b.textContent='⚠ 오류: '+(e.message||'')+(e.filename?'\n('+e.filename.split('/').pop()+':'+e.lineno+')':'')+(e.error&&e.error.stack?'\n\n'+e.error.stack:'');
    document.getElementById('errorPanel').classList.add('show');
  });
  document.addEventListener('click', function(ev){ var p=document.getElementById('errorPanel'); if (ev.target===p) p.classList.remove('show'); });
</script>

function toTitle(){ for (const s of ['over', 'pause']) $(s).classList.remove('on'); $('hud').classList.remove('on'); $('title').classList.add('on'); gameState = 'title'; paused = false; clearJar(); if (held){ scene.remove(held.g); held = null; } $('bestT').textContent = best ? '최고 기록 ' + best.toLocaleString() : ''; }

// 타이틀 배경: 알아서 과일이 떨어지는 데모

// =====================================================================
//  UI: 썸네일 (진짜 모델을 렌더링) · 다음 · 진화표

const THUMB = [];
function renderThumbs(){ try {
  const S = 128, r2 = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true }); r2.setSize(S, S); r2.setPixelRatio(1); r2.outputEncoding = THREE.sRGBEncoding; r2.toneMapping = THREE.ACESFilmicToneMapping;

  TIERS.forEach((t, i)=>{ const a = document.createElement('img'); a.src = THUMB[i] || ''; a.alt = t.name; a.title = t.name; a.style.animationDelay = (i*.12) + 's'; ch.appendChild(a);
    const b = document.createElement('img'); b.src = THUMB[i] || ''; b.alt = t.name; ev.appendChild(b); }); }
function updateEvoUI(){ const imgs = $('evo').querySelectorAll('img'); imgs.forEach((im, i)=>{ im.classList.toggle('got', i <= maxTier); im.classList.toggle('top', i === maxTier); }); }
function updateNextUI(){ $('nextImg').src = THUMB[nextTier] || ''; }
function updateShakeUI(){ $('shakeN').textContent = shakes; $('shake').classList.toggle('off', shakes <= 0); }

// =====================================================================
//  입력
// =====================================================================
let orbit = null, rotHold = 0; const keys = {};
canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('pointerdown', e=>{ audio.init(); if (gameState !== 'play' || paused) return;
  if (e.button === 2 || e.button === 1){ orbit = { x:e.clientX, az:CAM.azT }; return; }
  aimFromScreen(e.clientX, e.clientY); if (e.pointerType !== 'mouse'){ aimX = aimTX; aimZ = aimTZ; } canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); });

addEventListener('keydown', e=>{ keys[e.code] = true; if (gameState === 'play'){
    if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); drop(); }
    if (e.code === 'KeyF') doShake(); if (e.code === 'KeyP' || e.code === 'Escape') setPause(!paused); }
  else if (gameState === 'title' && (e.code === 'Space' || e.code === 'Enter') && !$('start').disabled) startGame();
  else if (gameState === 'overScreen' && (e.code === 'Space' || e.code === 'Enter')) startGame(); });
addEventListener('keyup', e=>{ keys[e.code] = false; });
function tickKeys(dt){ if (gameState !== 'play' || paused) return; let mx = 0, mz = 0;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1; if (keys.KeyW || keys.ArrowUp) mz -= 1; if (keys.KeyS || keys.ArrowDown) mz += 1;
  if (mx || mz){ const c = Math.cos(CAM.az), s = Math.sin(CAM.az); aimTX = aimX + (mx*c + mz*s)*dt*4.5*4; aimTZ = aimZ + (-mx*s + mz*c)*dt*4.5*4; }
  if (keys.KeyQ) CAM.azT = clamp(CAM.azT + dt*1.6, -.85, .85); if (keys.KeyE) CAM.azT = clamp(CAM.azT - dt*1.6, -.85, .85);
  if (rotHold) CAM.azT = clamp(CAM.azT + rotHold*dt*1.6, -.85, .85); }
const hold = (id, v)=>{ const b = $(id); b.addEventListener('pointerdown', e=>{ e.preventDefault(); rotHold = v; }); for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, ()=>{ rotHold = 0; }); };
hold('rotL', 1); hold('rotR', -1);
$('shake').addEventListener('click', doShake);
$('bPause').addEventListener('click', ()=>{ audio.sfx.click(); setPause(true); });
$('bMute').addEventListener('click', ()=>{ audio.init(); $('bMute').textContent = audio.toggle() ? '🔊' : '🔇'; });
$('bMute').textContent = audio.on ? '🔊' : '🔇';
$('start').addEventListener('click', startGame); $('again').addEventListener('click', startGame);
$('toTitle').addEventListener('click', ()=>{ audio.sfx.click(); toTitle(); }); $('pTitle').addEventListener('click', ()=>{ toTitle(); });
$('resume').addEventListener('click', ()=>{ audio.sfx.click(); setPause(false); }); $('restart').addEventListener('click', startGame);
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && gameState === 'play') setPause(true); });

// =====================================================================
//  메인 루프
// =====================================================================
let noRender = false, lastT = performance.now();
function frame(dt){ T += dt;
  const run = !paused && (gameState === 'play' || gameState === 'title' || gameState === 'over' || gameState === 'overScreen');
  if (run){ physics(dt); if (gameState === 'play'){ dropCD = Math.max(0, dropCD - dt); if (held && dropCD <= 0 && !held.g.visible) held.t = 0; checkDanger(dt); }
    if (gameState === 'title') tickDemo(dt); if (gameState === 'over') tickOver(dt); }
  if (gameState !== 'play'){ if (finalPass) finalPass.uniforms.danger.value *= .9; rimMat.emissiveIntensity *= .9; $('danger').style.boxShadow = 'none'; }
  for (const f of fruits) syncFruit(f, paused ? 0 : dt);
  tickKeys(dt); updateHeld(dt); tickParts(paused ? 0 : dt); tickSprites(dt);
  jarWob = Math.max(0, jarWob - dt*1.4); jarGroup.rotation.z = Math.sin(T*28)*jarWob*.035; jarGroup.rotation.x = Math.cos(T*23)*jarWob*.03;
  flashT = Math.max(0, flashT - dt*1.6); if (finalPass) finalPass.uniforms.flash.value = flashT;
  updateCamera(dt);
  netTick(dt);
  if (!noRender){ if (composer) composer.render(dt); else renderer.render(scene, camera); } }
function loop(now){ requestAnimationFrame(loop); const dt = Math.min(.05, Math.max(0, (now - lastT)/1000)); lastT = now; frame(dt); }

// 시작
setupPost(); fitCamera(); buildFruitTemplates(); buildKitchen(); updateCamera(0); requestAnimationFrame(loop);
$('bestT').textContent = best ? '최고 기록 ' + best.toLocaleString() : '';
loadAssets(p=>{ $('barI').style.width = Math.round(p*100) + '%'; }, ()=>{
  // 진짜 에셋으로 다시 짓기
  scene.remove(kitchen); scene.remove(jarGroup); scene.remove(sun); scene.remove(sun.target); scene.children.filter(o=>o.isLight).forEach(l=>scene.remove(l)); glassMats = [];
  applyEnv(); buildFruitTemplates(); buildKitchen(); renderThumbs(); buildUI(); updateNextUI();
  $('bar').style.display = 'none'; $('start').disabled = false; $('start').textContent = '시작하기'; gameState = 'title'; });
// =====================================================================
//  멀티플레이 — 같은 방 사람들과 점수 경쟁 + 과일 선물(공격)
//  콤보 3번 이상 · 큰 과일 · 수박 대폭발을 만들면 다른 사람 병에 작은 과일이 떨어진다
// =====================================================================
const URL_ROOM = (()=>{ try { return ((new URLSearchParams(location.search).get('room')) || 'PUBLIC').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12) || 'PUBLIC'; } catch(e){ return 'PUBLIC'; } })();
const NET = { on:false, uid:null, name:'', players:{}, seen:{}, handled:{}, sendT:0, pend:0, atkN:0, queue:[], qT:0, rowsKey:'' };
const freshP = u => performance.now() - (NET.seen[u] || -1e9) < 8000;
function attack(k){ if (!NET.on || gameState !== 'play' || k <= 0) return; NET.pend += k; }
(function startNet(){
  if (!(window.MP && !window.__mpFail && MP.isConfigured && MP.isConfigured() && window.firebase)) return;
  try {
    MP.onPlayersUpdate(val=>{ const t = performance.now();
      for (const u in val){ const p = val[u]; if (!p || u === NET.uid) continue; const old = NET.players[u]; if (!old || old.ts !== p.ts) NET.seen[u] = t;
        if (!old){ if (p.atk) NET.handled[u] = p.atk.n; }
        else if (p.atk && NET.handled[u] !== p.atk.n){ NET.handled[u] = p.atk.n;
          if (gameState === 'play'){ const k = Math.min(4, p.atk.k || 1); for (let i=0;i<k;i++) NET.queue.push(i*.35); toast('🎁 ' + (p.name || '누군가') + ' 님이 과일 ' + k + '개를 보냈어요!'); } }
        NET.players[u] = p; }
      for (const u in NET.players) if (!val[u]) delete NET.players[u]; });
    MP.init('fruit_' + URL_ROOM, (uid, err)=>{ if (err || !uid) return; NET.on = true; NET.uid = uid; NET.name = (MP.getDisplayName && MP.getDisplayName()) || '나'; try { MP.setPresence('fruit', URL_ROOM); } catch(e){} });
  } catch(e){}
})();
function netTick(dt){
  if (!NET.on) return;
  // 받은 과일 떨어뜨리기
  if (NET.queue.length && gameState === 'play' && !paused){ NET.qT += dt; while (NET.queue.length && NET.queue[0] <= NET.qT){ NET.queue.shift(); const a = Math.random()*Math.PI*2, r = Math.random()*(JAR_R - .6);
      const f = spawnFruit(Math.random() < .6 ? 0 : 1, Math.cos(a)*r, DROP_Y, Math.sin(a)*r, 0, -2, 0, false); f.dropped = true; audio.sfx.drop(); } if (!NET.queue.length) NET.qT = 0; }

    try { MP.update(s); } catch(e){} }
  // 방 순위판
  const rows = [{ me:true, n:NET.name, sc:score, mt:maxTier, st:gameState === 'play' ? 1 : 2 }];
  for (const u in NET.players){ const p = NET.players[u]; if (freshP(u) && p.st) rows.push({ n:p.name || '?', sc:p.sc || 0, mt:p.mt || 0, st:p.st }); }
  const box = $('rivals'); if (!box) return; if (rows.length < 2){ box.style.display = 'none'; return; }
  rows.sort((a, b)=>b.sc - a.sc);
  const key = JSON.stringify(rows); if (key === NET.rowsKey) return; NET.rowsKey = key; box.style.display = '';
  const esc = t=>String(t).replace(/[<>&"]/g, '');
  box.innerHTML = '<div class="rvH">🏆 같은 방 ' + rows.length + '명</div>' + rows.slice(0, 6).map((r, i)=>'<div class="rv' + (r.me ? ' me' : '') + (r.st === 2 ? ' out' : '') + '"><b>' + (i + 1) + '</b><img src="' + (THUMB[r.mt] || '') + '"><span>' + esc(r.n) + (r.st === 2 ? ' 💥' : '') + '</span><i>' + r.sc.toLocaleString() + '</i></div>').join('');
}
window.__F = { NET, frame, get state(){ return gameState; }, set noRender(v){ noRender = v; }, startGame, drop, fruits, world, TIERS, CAM, spawnFruit, doShake, gameOver, merge,

})();
