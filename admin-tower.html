<script>
(function(){
  /* =====================================================================
     로블록스 오비 물리 재현 — 단위는 1스터드 = 0.62

     · 캐릭터 판정: 가로 2 × 깊이 1 스터드 회전 박스 (HumanoidRootPart와 같음)
     ===================================================================== */
  const STUD = 0.62;
  const WALK_SPEED = 10.5, GRAVITY = -133, JUMP_VEL = 34.46;
  const HX = 1 * STUD, HZ = 0.5 * STUD;                // 판정 박스 반폭(가로 2, 깊이 1 스터드)
  const CLIMB_SPEED = 7.0;                             // 트러스/사다리 오르는 속도 (≈11.3 스터드/s)
  const COYOTE = 0.12, JUMP_BUFFER = 0.15, STEP_HEIGHT = 2.5 * STUD;
  const FLICK_WINDOW = 0.22, FLICK_RATE = 8.5;         // 초당 8.5rad 이상 몸을 휙 돌리면 '플릭'
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('has-touch');
  const $ = id => document.getElementById(id);

  // ---------- 씬 ----------
  const canvas = $('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch ? 1.5 : 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8cc8ff);
  scene.fog = new THREE.Fog(0xcfe6ff, 110, 340);
  const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 700);
  function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  const hemi = new THREE.HemisphereLight(0xffffff, 0xb9b9b9, 0.72); scene.add(hemi);
  scene.add(new THREE.AmbientLight(0xffffff, 0.22));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  // 로블록스 기본 하늘: 위는 짙은 파랑, 지평선은 밝은 하늘색 + 해
  const sky = new THREE.Mesh(new THREE.SphereGeometry(360, 32, 16), new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false,
    uniforms:{ top:{ value:new THREE.Color(0x2a78dc) }, bot:{ value:new THREE.Color(0xd6ecff) } },
    vertexShader:'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader:'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(vP.y * 1.6 + 0.08, 0.0, 1.0); gl_FragColor = vec4(mix(bot, top, pow(h, 0.7)), 1.0); }' }));
  sky.renderOrder = -1; scene.add(sky);
  { const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(9, 32), new THREE.MeshBasicMaterial({ color:0xfffbe8, fog:false, depthWrite:false })); sunDisc.position.set(170, 230, 110); sunDisc.lookAt(0,0,0); sky.add(sunDisc); }
  sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0004;
  Object.assign(sun.shadow.camera, { left:-45, right:45, top:45, bottom:-45, far:240 });
  scene.add(sun); scene.add(sun.target);
  for (let i=0;i<120;i++){
    const g = new THREE.Group(), m = new THREE.MeshLambertMaterial({ color:0xffffff, emissive:0xd8dde4 });
    for (let k=0;k<5;k++){ const s=new THREE.Mesh(new THREE.BoxGeometry(1.8+Math.random()*1.4, 0.9+Math.random()*0.5, 1.4+Math.random()*1.0), m); s.position.set((Math.random()-.5)*2.4,(Math.random()-.5)*.6,(Math.random()-.5)*1.2); g.add(s); }
    { const a=Math.random()*6.283, r=60+Math.random()*90; g.position.set(Math.cos(a)*r, 20+Math.random()*130, Math.sin(a)*r); } g.scale.setScalar(1.6+Math.random()*2.6); scene.add(g);
  }

  // ---------- 텍스처 ----------
  function studTex(hex, lines){
    const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
    x.fillStyle=hex; x.fillRect(0,0,128,128);   // 로블록스 SmoothPlastic: 무늬 없는 단색
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
  }
  function stripeTex(bg, fg, gap){
    const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
    x.fillStyle=bg; x.fillRect(0,0,128,128); x.fillStyle=fg;
    for (let i=-128;i<256;i+=gap){ x.save(); x.translate(i,0); x.rotate(Math.PI/4); x.fillRect(0,-200,gap*.45,400); x.restore(); }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
  }
  function trussTex(){
    const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
    x.clearRect(0,0,128,128); x.strokeStyle='#7d858f'; x.lineWidth=10; x.strokeRect(5,5,118,118);
    x.lineWidth=8; x.beginPath(); x.moveTo(5,5); x.lineTo(123,123); x.moveTo(123,5); x.lineTo(5,123); x.stroke();
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
  }
  const SEC_COLORS = ['#ffffff','#E5433C','#FF8A2E','#FFD23D','#8BC34A','#43B04A','#26A69A','#2F8CE0','#3F51B5','#9B4FE0','#C2185B','#6D4C41','#00ACC1','#F06292','#546E7A','#FFB300'];
  const TEX = {
    kill: stripeTex('#7a0000','#ffcc00',22), conveyor: stripeTex('#2b2f36','#9aa3ad',32), bounce: stripeTex('#1e8f4a','#9dff9d',26),
    speed: stripeTex('#0d47a1','#64b5f6',26), ice: studTex('#bfe9ff', true), crumble: studTex('#8a8378', true), wall: studTex('#b8bec8', true),
    check: studTex('#ffffff', true), finish: studTex('#FFD700', true), truss: trussTex(), timed: studTex('#ffffff', true),
  };
  const secTex = SEC_COLORS.map(c => studTex(c, true));
  // 클래식 베이스플레이트 (스터드 무늬)
  function baseplateTex(){ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
    x.fillStyle='#4f5053'; x.fillRect(0,0,64,64);
    for (const [cx,cy] of [[16,16],[48,16],[16,48],[48,48]]){ x.fillStyle='rgba(0,0,0,.28)'; x.beginPath(); x.arc(cx+1.5,cy+2,10,0,7); x.fill();
      x.fillStyle='#57585b'; x.beginPath(); x.arc(cx,cy,10,0,7); x.fill(); x.fillStyle='rgba(255,255,255,.16)'; x.beginPath(); x.arc(cx-1,cy-1.5,8,3.3,5.9); x.lineWidth=2; x.strokeStyle='rgba(255,255,255,.2)'; x.stroke(); }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; return t; }

  // ---------- 콜라이더 ----------
  const colliders = [], meshes = [], crumbles = [], movers = [], timed = [], spinners = [];
  const courseRoot = new THREE.Group(); scene.add(courseRoot); let ADD_TARGET = courseRoot;
  let SEC = 0;
  function addBox(x,y,z,w,h,d,type='normal',opts={}){
    let map = opts.tex || tierMap(type);
    if (TEX[type] && !opts.tex) map = TEX[type];
    if (type === 'checkpoint') map = TEX.check;
    const mat = new THREE.MeshStandardMaterial({ map: map.clone ? map : map, roughness:.55, metalness:0, transparent: type==='truss' || type==='timed', alphaTest: type==='truss' ? .5 : 0, side: type==='truss' ? THREE.DoubleSide : THREE.FrontSide });
    if (map.repeat) { mat.map = map.clone(); mat.map.needsUpdate = true; mat.map.repeat.set(Math.max(1,Math.round(w/(type==='truss'?1.24:2))), Math.max(1,Math.round((type==='truss'||type==='ladder'||type==='wall'?h:d)/(type==='truss'?1.24:2)))); }
    if (opts.color) { mat.map = null; mat.color.set(opts.color); }
    // 네온 재질: 빨강 = 즉사, 주황 = 데미지
    if (type === 'kill'){ mat.map = null; mat.color.set('#ff2020'); mat.emissive = new THREE.Color('#ff0000'); mat.emissiveIntensity = .9; }
    if (type === 'damage'){ mat.map = null; mat.color.set('#ff8a1c'); mat.emissive = new THREE.Color('#ff6200'); mat.emissiveIntensity = .55; }
    if (type === 'bounce' || type === 'speed') { mat.emissive = new THREE.Color(type==='bounce'?0x1e8f4a:0x1565c0); mat.emissiveIntensity = .5; }
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    mesh.position.set(x,y,z); mesh.castShadow = type!=='truss'; mesh.receiveShadow = true; ADD_TARGET.add(mesh); meshes.push(mesh);
    const c = { minX:x-w/2, maxX:x+w/2, minY:y-h/2, maxY:y+h/2, minZ:z-d/2, maxZ:z+d/2, get topY(){ return this.maxY; }, type, sec:SEC, mesh,
      climb: type==='truss' || type==='ladder', dir: opts.dir || null, disabled:false };
    colliders.push(c);
    if (type === 'crumble') crumbles.push({ c, state:'idle', t:0 });
    return c;
  }
  // 윗면 기준으로 발판을 놓는 헬퍼
  function plat(x, top, z, w, d, type='normal', h=1, opts){ return addBox(x, top-h/2, z, w, h, d, type, opts); }
  function setBox(c, x,y,z){ const w=c.maxX-c.minX, h=c.maxY-c.minY, d=c.maxZ-c.minZ; c.minX=x-w/2; c.maxX=x+w/2; c.minY=y-h/2; c.maxY=y+h/2; c.minZ=z-d/2; c.maxZ=z+d/2; c.mesh.position.set(x,y,z); }

  // ---------- 표지판 ----------
  function sign(x,y,z,title,sub,col){
    const c=document.createElement('canvas'); c.width=512; c.height=200; const g=c.getContext('2d');
    g.fillStyle='rgba(15,18,40,.86)'; g.beginPath(); g.roundRect(4,4,504,192,24); g.fill();
    g.fillStyle=col||'#ffd36b'; g.fillRect(24,4,464,10);
    g.textAlign='center'; g.fillStyle='#fff'; g.font='900 56px "Malgun Gothic","Noto Sans KR",sans-serif'; g.fillText(title,256,92);
    g.fillStyle='#cfd6ff'; g.font='700 30px "Malgun Gothic","Noto Sans KR",sans-serif'; g.fillText(sub,256,150);
    const t=new THREE.CanvasTexture(c);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(4.2,1.64), new THREE.MeshBasicMaterial({ map:t, transparent:true, side:THREE.DoubleSide }));
    m.position.set(x,y,z); m.rotation.y = Math.PI; scene.add(m);
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,y-(y-3.2),6), new THREE.MeshStandardMaterial({color:0x444a55})); pole.position.set(x,y-1.6-.8,z+.02); scene.add(pole);
  }

  /*@@COURSE*/
  // =====================================================================
  //  어드민 타워 — 손으로 한 칸씩 놓은 한 판짜리 타워 (무작위 아님)
  //  로비(상점) → 정원 테라스 → 공사장 비계 → 기계실(타워 안) → 하늘 정원 → 폭풍 지붕(왕좌)
  //  · 발판은 넓게. 대신 길이 타워 바깥을 돌다가 안으로 들어갔다 나오고, 구간마다 손맛이 다르다
  //  · 회오리: 안으로 걸어 들어가면 빙글빙글 떠올라서 다음 섬으로 던져 준다
  //  · 샤드 결정: 길 위 작은 것 +5, 숨은 곳 큰 것 +40. 먹으면 2분 뒤 다시 생긴다
  // =====================================================================
  const ZONES = [
    { name:'로비', color:'#a7b0ba', wall:'#7d8793', sky:[0x2a78dc, 0xd6ecff], fog:0xcfe6ff },
    { name:'정원 테라스', color:'#7cc56b', wall:'#8a6a45', sky:[0x2a78dc, 0xd6ecff], fog:0xcfe6ff },
    { name:'공사장 비계', color:'#f2b632', wall:'#6d6f73', sky:[0x3a7fd0, 0xf2dcb8], fog:0xf0dcc0 },
    { name:'기계실', color:'#8a96a8', wall:'#3c4350', sky:[0x3a7fd0, 0xf2dcb8], fog:0xb8b0a8 },
    { name:'하늘 정원', color:'#f4f8ff', wall:'#b9d4f2', sky:[0x7fb4ff, 0xfff0fa], fog:0xfff0fa },
    { name:'폭풍 지붕', color:'#7d5bd6', wall:'#2b2140', sky:[0x120c24, 0x4a3a6a], fog:0x2e2448 },
  ];
  const ZTEX = ZONES.map(z=>studTex(z.color)), ZWALL = ZONES.map(z=>studTex(z.wall));
  TEX.damage = stripeTex('#ff6d00', '#1b1b1b', 20);
  let CUR_Z = 0;
