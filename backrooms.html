<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>백룸</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:system-ui,sans-serif; }
  #canvas { display:block; width:100%; height:100%; touch-action:none; }

  #hud { position:fixed; top:16px; left:16px; z-index:5; color:#e8d98a; font-size:12px; font-weight:700;
    background:rgba(0,0,0,.5); padding:8px 14px; border-radius:10px; pointer-events:none; }
  #vignette { position:fixed; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%); }
  #closeDark { position:fixed; inset:0; z-index:5; pointer-events:none; background:#000; opacity:0; transition:opacity .15s ease; }
  #staticFlash { position:fixed; inset:0; z-index:6; pointer-events:none; background:#000; opacity:0; }

  #joyZone { position:fixed; left:0; bottom:0; width:45%; height:55%; z-index:10; }
  #joyBase { position:fixed; left:36px; bottom:36px; width:110px; height:110px; border-radius:50%;
    background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.25); }
  #joyStick { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px;
    border-radius:50%; background:rgba(255,255,255,.6); }
  #camZone { position:fixed; right:0; bottom:0; width:55%; height:100%; z-index:8; }
  #jumpBtn { position:fixed; right:36px; bottom:36px; width:68px; height:68px; border-radius:50%;
    background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.3); z-index:11;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; }
  #jumpBtn:active { background:rgba(255,255,255,.25); }
  body:not(.has-touch) #joyZone, body:not(.has-touch) #jumpBtn { display:none !important; }

  #startOverlay { position:fixed; inset:0; z-index:50; background:#0a0a05;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; text-align:center; padding:24px; }
  #startOverlay h1 { color:#e8d98a; font-size:28px; letter-spacing:2px; font-weight:900; }
  #startOverlay p { color:#8a8264; font-size:13px; max-width:320px; line-height:1.6; }
  #startBtn { padding:14px 32px; border-radius:6px; border:1px solid #e8d98a; background:transparent;
    color:#e8d98a; font-size:15px; font-weight:800; cursor:pointer; }
  #startOverlay.hide { display:none; }

  #errorPanel { position:fixed; inset:0; z-index:99999; display:none; align-items:center; justify-content:center;
    background:rgba(10,10,15,.94); padding:24px; }
  #errorPanel.show { display:flex; }
  #errorBox { max-width:90vw; max-height:80vh; overflow:auto; background:#1a1015; border:1px solid #ff6b5c;
    border-radius:14px; padding:18px; color:#ffb3a8; font-size:12px; line-height:1.6; white-space:pre-wrap; word-break:break-all; font-family:monospace; }
  #errorBox b { color:#fff; display:block; margin-bottom:8px; font-size:14px; font-family:system-ui,sans-serif; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="vignette"></div>
<div id="closeDark"></div>
<div id="staticFlash"></div>
<div id="hud">📼 무한 미로 · 이상함 감지: <span id="noticeText">없음</span></div>

<div id="startOverlay">
  <h1>THE BACKROOMS</h1>
  <p>노란 형광등 불빛, 눅눅한 카펫 냄새. 끝없이 이어지는 방들.<br>어딘가 잘못된 곳에 잘못 들어와 버렸다.</p>
  <button id="startBtn" type="button">들어가기</button>
</div>

<div id="joyZone"></div>
<div id="joyBase"><div id="joyStick"></div></div>
<div id="camZone"></div>
<div id="jumpBtn">▲</div>

<div id="errorPanel"><div id="errorBox"></div></div>

<script>
  function showError(title, detail){
    const panel = document.getElementById('errorPanel');
    const box = document.getElementById('errorBox');
    box.innerHTML = '<b>⚠ ' + title + '</b>' + (detail||'');
    panel.classList.add('show');
  }
  window.addEventListener('error', function(e){
    const msg = e.message || 'Unknown error';
    const loc = (e.filename ? (e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno) : '');
    showError('오류 발생', msg + (loc ? ('\n(' + loc + ')') : '\n(외부 스크립트에서 발생)') + (e.error && e.error.stack ? ('\n\n' + e.error.stack) : ''));
  });
  const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouchDevice) document.body.classList.add('has-touch');
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" onerror="showError('three.js 로딩 실패','CDN에서 three.js를 불러오지 못했어요.')"></script>
<script>
(function(){
 try {
  const canvas = document.getElementById('canvas');
  if (!window.THREE) throw new Error('THREE가 정의되지 않았어요');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouchDevice });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouchDevice ? 1.3 : 2));
  renderer.shadowMap.enabled = false; // 백룸은 형광등 위주라 그림자맵보다 조명 개수/플리커가 중요 - 성능 절약

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080602);
  scene.fog = new THREE.FogExp2(0x140f06, 0.045);

  const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.05, 100);
  function resize(){ renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();

  const ambient = new THREE.HemisphereLight(0x8a7d40, 0x0a0804, 0.14);
  scene.add(ambient);

  // ================= 텍스처: 노란 벽지 / 눅눅한 카펫 / 천장 타일 =================
  function makeWallpaperTexture(){
    const c = document.createElement('canvas'); c.width=256; c.height=256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#c9b24a'; ctx.fillRect(0,0,256,256);
    for (let i=0;i<900;i++){
      const x=Math.random()*256, y=Math.random()*256;
      ctx.fillStyle = `rgba(${90+Math.random()*40|0},${75+Math.random()*30|0},${20+Math.random()*20|0},${0.08+Math.random()*0.1})`;
      ctx.fillRect(x,y,1+Math.random()*2,1+Math.random()*2);
    }
    // 어렴풋한 세로 줄무늬
    ctx.strokeStyle = 'rgba(70,58,15,0.25)'; ctx.lineWidth=3;
    for (let x=0;x<256;x+=22){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,256); ctx.stroke(); }
    // 얼룩/오염 자국
    for (let i=0;i<7;i++){
      const x=Math.random()*256, y=Math.random()*256, r=8+Math.random()*22;
      const g = ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(60,48,10,0.35)'); g.addColorStop(1,'rgba(60,48,10,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  function makeCarpetTexture(){
    const c = document.createElement('canvas'); c.width=256; c.height=256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#7a6a2e'; ctx.fillRect(0,0,256,256);
    for (let i=0;i<3000;i++){
      const x=Math.random()*256, y=Math.random()*256;
      const v = 90+Math.random()*50|0;
      ctx.fillStyle = `rgba(${v},${v*0.82|0},${v*0.35|0},${0.15+Math.random()*0.2})`;
      ctx.fillRect(x,y,1,1);
    }
    for (let i=0;i<5;i++){
      const x=Math.random()*256, y=Math.random()*256, r=20+Math.random()*40;
      const g = ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(30,25,8,0.4)'); g.addColorStop(1,'rgba(30,25,8,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  function makeCeilingTexture(){
    const c = document.createElement('canvas'); c.width=128; c.height=128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#d8cf9a'; ctx.fillRect(0,0,128,128);
    ctx.strokeStyle = 'rgba(120,110,60,0.6)'; ctx.lineWidth=2;
    ctx.strokeRect(1,1,126,126);
    for (let i=0;i<200;i++){
      const x=Math.random()*128, y=Math.random()*128;
      ctx.fillStyle = `rgba(150,140,90,${0.1+Math.random()*0.15})`;
      ctx.fillRect(x,y,1,1);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  const wallpaperTex = makeWallpaperTexture();
  const carpetTex = makeCarpetTexture();
  const ceilingTex = makeCeilingTexture();
  wallpaperTex.repeat.set(1.6,1.1);
  carpetTex.repeat.set(3,3);
  ceilingTex.repeat.set(3,3);
  const wallMat = new THREE.MeshStandardMaterial({ map: wallpaperTex, roughness:0.95 });
  const floorMat = new THREE.MeshStandardMaterial({ map: carpetTex, roughness:1 });
  const ceilingMat = new THREE.MeshStandardMaterial({ map: ceilingTex, roughness:0.9 });

  // ================= 무한 미로: 그리드 기반 방+복도, 이동에 맞춰 주변 셀만 생성/재활용 =================
  const CELL = 4.6; // 스터드 느낌의 한 칸 크기(유닛)
  const WALL_H = 2.9;
  const GRID_RADIUS = 6; // 플레이어 주변 몇 칸까지 유지할지
  const maze = new Map(); // "gx,gz" -> {open:{n,s,e,w}, hasLight:bool}
  function cellKey(gx,gz){ return gx+','+gz; }
  function hashRand(gx,gz,salt){
    let h = (gx*374761393 + gz*668265263 + salt*2654435761) >>> 0;
    h = (h ^ (h>>>13)) * 1274126177 >>> 0;
    return (h >>> 0) / 4294967295;
  }
  // 3x3칸 단위 "존"으로 지역별 개방 밀도를 다르게 줘서 완전 랜덤하게 느껴지게 하고, 일부 존은 아예 벽 없는 공터로 만듦
  const ZONE_SIZE = 3;
  function zoneOf(gx,gz){ return { zx: Math.floor(gx/ZONE_SIZE), zz: Math.floor(gz/ZONE_SIZE) }; }
  function isClearingZone(zx,zz){ return hashRand(zx,zz,77) < 0.16; }
  function zoneOpenProb(zx,zz){
    // 존마다 0.4(빽빽한 미로) ~ 0.85(탁 트임) 사이에서 랜덤하게 밀도가 달라짐
    return 0.4 + hashRand(zx,zz,88)*0.45;
  }
  function getCell(gx,gz){
    const key = cellKey(gx,gz);
    let c = maze.get(key);
    if (c) return c;
    // 각 방향으로 뚫려있을 확률(막다른 방을 줄이기 위해 확률을 높게, 그리고 인접 셀과 대칭이 되도록 결정적 해시로 계산)
    c = { open: {}, hasLight: hashRand(gx,gz,99) < 0.55, litOn: true, flickerT: Math.random()*10 };
    // 경계 판정은 오직 경계 좌표(nbx,nbz)만으로 결정 - 어느 쪽 셀이 물어보든 항상 같은 결과가 나와야 함(안 그러면 한쪽은 문, 한쪽은 벽으로 어긋남)
    function boundaryOpen(nbx,nbz,salt){
      const zb = zoneOf(nbx,nbz);
      if (isClearingZone(zb.zx,zb.zz)) return true; // 공터 존 경계면 무조건 열림
      const prob = zoneOpenProb(zb.zx, zb.zz);
      return hashRand(nbx,nbz,salt) < prob;
    }
    c.open.n = boundaryOpen(gx,gz,1);     // 이 칸의 북쪽 = (gz-1,gz) 경계
    c.open.s = boundaryOpen(gx,gz+1,1);   // 이 칸의 남쪽 = (gz,gz+1) 경계 = 남쪽 칸의 북쪽과 동일 인덱스
    c.open.e = boundaryOpen(gx+1,gz,2);   // 이 칸의 동쪽 = (gx,gx+1) 경계 = 동쪽 칸의 서쪽과 동일 인덱스
    c.open.w = boundaryOpen(gx,gz,2);     // 이 칸의 서쪽 = (gx-1,gx) 경계
    maze.set(key, c);
    return c;
  }

  const cellMeshes = new Map(); // key -> THREE.Group (해당 셀에 생성된 지오메트리)
  function buildCell(gx,gz){
    const key = cellKey(gx,gz);
    if (cellMeshes.has(key)) return;
    const c = getCell(gx,gz);
    const grp = new THREE.Group();
    const cx = gx*CELL, cz = gz*CELL;

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(CELL,CELL), floorMat);
    floor.rotation.x = -Math.PI/2; floor.position.set(cx,0,cz);
    grp.add(floor);
    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(CELL,CELL), ceilingMat);
    ceil.rotation.x = Math.PI/2; ceil.position.set(cx,WALL_H,cz);
    grp.add(ceil);

    const half = CELL/2, doorW = 1.6, wallThick = 0.4;
    function addWallSeg(x,z,w,d){
      const m = new THREE.Mesh(new THREE.BoxGeometry(w,WALL_H,d), wallMat);
      m.position.set(x,WALL_H/2,z);
      grp.add(m);
    }
    // 북쪽 벽 (open.n이면 문 폭만큼 뚫어서 두 조각으로)
    if (!c.open.n){ addWallSeg(cx, cz-half, CELL, wallThick); }
    else { addWallSeg(cx-(half+doorW/2)/2, cz-half, half-doorW/2, wallThick); addWallSeg(cx+(half+doorW/2)/2, cz-half, half-doorW/2, wallThick); }
    if (!c.open.s){ addWallSeg(cx, cz+half, CELL, wallThick); }
    else { addWallSeg(cx-(half+doorW/2)/2, cz+half, half-doorW/2, wallThick); addWallSeg(cx+(half+doorW/2)/2, cz+half, half-doorW/2, wallThick); }
    if (!c.open.e){ addWallSeg(cx+half, cz, wallThick, CELL); }
    else { addWallSeg(cx+half, cz-(half+doorW/2)/2, wallThick, half-doorW/2); addWallSeg(cx+half, cz+(half+doorW/2)/2, wallThick, half-doorW/2); }
    if (!c.open.w){ addWallSeg(cx-half, cz, wallThick, CELL); }
    else { addWallSeg(cx-half, cz-(half+doorW/2)/2, wallThick, half-doorW/2); addWallSeg(cx-half, cz+(half+doorW/2)/2, wallThick, half-doorW/2); }

    if (c.hasLight){
      const fixture = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.08,0.4), new THREE.MeshStandardMaterial({ color:0xf0e8c0, emissive:0xfff2c0, emissiveIntensity:1.2 }));
      fixture.position.set(cx, WALL_H-0.05, cz);
      grp.add(fixture);
      const light = new THREE.PointLight(0xfff0c0, 1.15, CELL*1.7, 2.2);
      light.position.set(cx, WALL_H-0.3, cz);
      grp.add(light);
      c.lightObj = light;
      c.fixtureObj = fixture.material;
    }

    scene.add(grp);
    cellMeshes.set(key, grp);
  }
  function unbuildCell(gx,gz){
    const key = cellKey(gx,gz);
    const grp = cellMeshes.get(key);
    if (!grp) return;
    scene.remove(grp);
    grp.traverse(o=>{ if (o.geometry) o.geometry.dispose(); });
    cellMeshes.delete(key);
  }
  const BUILD_BUDGET_PER_FRAME = 6; // 한 프레임에 새로 지을 방 개수 제한(안 그러면 셀 경계를 넘을 때마다 수십 개를 한꺼번에 만들어서 순간적으로 끊김)
  let mazeFirstBuild = true;
  function refreshMazeAround(px,pz){
    const gx0 = Math.round(px/CELL), gz0 = Math.round(pz/CELL);
    const toBuild = [];
    for (let dx=-GRID_RADIUS; dx<=GRID_RADIUS; dx++){
      for (let dz=-GRID_RADIUS; dz<=GRID_RADIUS; dz++){
        const key = cellKey(gx0+dx, gz0+dz);
        if (!cellMeshes.has(key)) toBuild.push({ gx:gx0+dx, gz:gz0+dz, d: dx*dx+dz*dz });
      }
    }
    toBuild.sort((a,b)=>a.d-b.d); // 가까운 셀(당장 보이는 곳)부터 우선 생성
    // 처음 스폰할 때는 예산 없이 한번에 다 지어서 시작하자마자 휑하지 않게, 이후엔 예산만큼만 나눠서 지음
    const budget = mazeFirstBuild ? toBuild.length : BUILD_BUDGET_PER_FRAME;
    for (let i=0; i<Math.min(budget, toBuild.length); i++){
      buildCell(toBuild[i].gx, toBuild[i].gz);
    }
    mazeFirstBuild = false;
    // 멀어진 셀은 정리(메모리/성능) - 이쪽은 가벼워서 한번에 정리해도 괜찮음
    for (const key of Array.from(cellMeshes.keys())){
      const [kx,kz] = key.split(',').map(Number);
      if (Math.abs(kx-gx0) > GRID_RADIUS+1 || Math.abs(kz-gz0) > GRID_RADIUS+1) unbuildCell(kx,kz);
    }
  }

  // 벽 충돌용: 현재 셀의 열린 방향에 따라 원형 반지름 콜리전(간단하고 안정적) 대신, 셀 경계 AABB로 판정
  function isWallBlocking(x,z){
    const gx = Math.floor((x+CELL/2)/CELL), gz = Math.floor((z+CELL/2)/CELL);
    const c = getCell(gx,gz);
    const cx=gx*CELL, cz=gz*CELL, half=CELL/2, doorW=1.6, margin=0.5;
    const lx = x-cx, lz = z-cz; // 셀 중심 기준 로컬 좌표
    if (lz < -half+margin && !( c.open.n && Math.abs(lx) < doorW/2-0.1 )) return true;
    if (lz >  half-margin && !( c.open.s && Math.abs(lx) < doorW/2-0.1 )) return true;
    if (lx >  half-margin && !( c.open.e && Math.abs(lz) < doorW/2-0.1 )) return true;
    if (lx < -half+margin && !( c.open.w && Math.abs(lz) < doorW/2-0.1 )) return true;
    return false;
  }

  // ================= 캐릭터/1인칭 이동 물리 (검증된 값 재사용) =================
  const WALK_SPEED = 5.6, GRAVITY = -30, JUMP_VEL = 8.5, PLAYER_R = 0.32;
  const EYE_HEIGHT = 1.62;
  const pos = new THREE.Vector3(0, 0, 0);
  let velY = 0, grounded = true, coyoteTimer = 0;
  let jumpHeld = false, jumpBufferTimer = 0;
  const curSpeed = new THREE.Vector2(0,0);

  let camYaw = 0, camPitch = 0;
  const PITCH_MIN = -1.3, PITCH_MAX = 1.3;

  refreshMazeAround(0,0);

  // ================= 엔티티: 부드럽게 걷지 않고 순간이동하듯 깜빡이며 나타나는 시커먼 형체 =================
  const entity = new THREE.Group();
  let entityHeadMat;
  {
    const bodyMat = new THREE.MeshStandardMaterial({ color:0x050403, roughness:1 });
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42,1.5,0.28), bodyMat);
    torso.position.y = 1.55; entity.add(torso);
    entityHeadMat = new THREE.MeshStandardMaterial({ color:0x2a2018, roughness:0.9, emissive:0x1a1008, emissiveIntensity:0 });
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.4,0.28), entityHeadMat);
    head.position.y = 2.5; entity.add(head);
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.16,1.1,0.18), bodyMat);
    legL.position.set(-0.12,0.55,0); entity.add(legL);
    const legR = legL.clone(); legR.position.x = 0.12; entity.add(legR);
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.12,1.3,0.14), bodyMat);
    armL.position.set(-0.32,1.35,0); entity.add(armL);
    const armR = armL.clone(); armR.position.x = 0.32; entity.add(armR);
  }
  const faceLight = new THREE.PointLight(0xffe8c0, 0, 1.6, 2.5); // 평소엔 꺼져있다가 가까이 있을 때만 얼굴 앞을 비춤
  faceLight.position.set(0, 2.5, 0.4);
  entity.add(faceLight);
  entity.visible = false;
  scene.add(entity);
  let entityActive = false;
  let entityTeleportTimer = 3 + Math.random()*2;
  let entityFlickerT = 0;
  let caughtState = false;
  let huntLevel = 0; // 나타날수록 점점 커짐 - 등장 거리가 점점 가까워지고 다가오는 속도도 빨라짐
  const HUNT_MAX = 5;

  function entityTeleport(){
    // 사냥 단계가 높을수록 훨씬 가까운 거리에서 등장(점점 좁혀오는 느낌)
    const gx0 = Math.round(pos.x/CELL), gz0 = Math.round(pos.z/CELL);
    const minD = Math.max(1.6, 6 - huntLevel*1.0);
    const maxD = Math.max(minD+1.2, 9 - huntLevel*1.3);
    const candidates = [];
    for (let dx=-GRID_RADIUS; dx<=GRID_RADIUS; dx++){
      for (let dz=-GRID_RADIUS; dz<=GRID_RADIUS; dz++){
        const d = Math.hypot(dx,dz);
        if (d >= minD && d <= maxD) candidates.push({gx:gx0+dx, gz:gz0+dz});
      }
    }
    if (candidates.length === 0) return;
    const target = candidates[Math.floor(Math.random()*candidates.length)];
    entity.position.set(target.gx*CELL + (Math.random()-0.5)*1.5, 0, target.gz*CELL + (Math.random()-0.5)*1.5);
    entity.lookAt(pos.x, 0, pos.z);
    entityActive = true;
    entityFlickerT = 0.22;
    // 이번 등장에서 살아남았다면(=엔티티가 다시 나타나기 직전이라는 건 지난번엔 안 잡혔다는 뜻) 사냥 단계가 계속 오르되,
    // 이미 많이 오른 상태에서는 가끔 살짝 풀어줘서 완급을 줌(계속 몰아붙이기만 하면 늘어짐)
    if (huntLevel >= 3 && Math.random() < 0.3) huntLevel = Math.max(0, huntLevel-2);
    else huntLevel = Math.min(HUNT_MAX, huntLevel+1);
    staticFlash.style.transition = 'opacity .04s';
    staticFlash.style.opacity = '0.5';
    setTimeout(()=>{ staticFlash.style.transition='opacity .5s'; staticFlash.style.opacity='0'; }, 70);
    noticeText.textContent = huntLevel >= 4 ? '가까이 있다...' : (huntLevel >= 2 ? '뭔가 다가온다' : '시선이 느껴진다');
  }

  function tryMoveEntity(targetX, targetZ, speed, dt){
    const dx = targetX - entity.position.x, dz = targetZ - entity.position.z;
    const d = Math.hypot(dx,dz);
    if (d < 0.05) return;
    const mx = dx/d, mz = dz/d;
    const tryX = entity.position.x + mx*speed*dt;
    const tryZ = entity.position.z + mz*speed*dt;
    let movedX = false, movedZ = false;
    if (!isWallBlocking(tryX + Math.sign(mx||1)*PLAYER_R, entity.position.z)){ entity.position.x = tryX; movedX = true; }
    if (!isWallBlocking(entity.position.x, tryZ + Math.sign(mz||1)*PLAYER_R)){ entity.position.z = tryZ; movedZ = true; }
    if (!movedX && !movedZ){
      // 직진이 막혔으면 지금 서있는 칸의 열린 문 중 목표 방향에 가장 가까운 쪽으로 우회(완전한 경로탐색은 아니지만 벽에 계속 부딪히지 않고 실제 문으로 다님)
      const gx = Math.floor((entity.position.x+CELL/2)/CELL), gz = Math.floor((entity.position.z+CELL/2)/CELL);
      const c = getCell(gx,gz);
      const doorDirs = [];
      if (c.open.n) doorDirs.push({x:0,z:-1});
      if (c.open.s) doorDirs.push({x:0,z:1});
      if (c.open.e) doorDirs.push({x:1,z:0});
      if (c.open.w) doorDirs.push({x:-1,z:0});
      if (doorDirs.length){
        let best = doorDirs[0], bestDot = -2;
        doorDirs.forEach(dd=>{ const dot = dd.x*mx+dd.z*mz; if (dot>bestDot){ bestDot=dot; best=dd; } });
        entity.position.x += best.x*speed*dt;
        entity.position.z += best.z*speed*dt;
      }
    }
  }

  function updateEntity(dt){
    if (caughtState) return;
    const isChasing = entityActive && entityFlickerT<=0 && huntLevel >= 4;
    // 추격 중에는 순간이동 타이머가 멈춤 - 놓치기 전까지는 계속 쫓아옴
    if (!isChasing){
      entityTeleportTimer -= dt;
      if (entityTeleportTimer <= 0){
        // 사냥 단계가 높을수록 다음 등장까지도 더 빨라짐(숨 돌릴 틈을 줄임)
        entityTeleportTimer = Math.max(1.4, 4 - huntLevel*0.45) + Math.random()*1.5;
        entityTeleport();
      }
    }
    if (entityActive){
      if (entityFlickerT > 0){
        entityFlickerT -= dt;
        entity.visible = Math.floor(entityFlickerT*40) % 2 === 0;
      } else {
        entity.visible = true;
        const dx = pos.x - entity.position.x, dz = pos.z - entity.position.z;
        const d = Math.hypot(dx,dz);
        if (isChasing){
          // 진짜 추격: 멈춤 없이 빠르게, 플레이어 걷는 속도에 육박하는 속도로 벽 사이 문을 따라 계속 쫓아옴
          const chaseSpeed = 4.8;
          if (d > 0.9) tryMoveEntity(pos.x, pos.z, chaseSpeed, dt);
          // 너무 멀어지면 놓침(다시 순간이동 사이클로 복귀) - 대신 놓쳐도 사냥단계는 유지되어 금방 다시 나타남
          if (d > 11){ entityFlickerT = 0.25; entityTeleportTimer = 0.6; noticeText.textContent = '놓쳤다... 잠깐은'; }
        } else if (d > 0.9){
          // 평소엔 가만히 서있지 않고 뚝뚝 끊기듯(글리치처럼) 슬금슬금 다가옴(역시 벽은 피해서)
          const creepSpeed = 0.5 + huntLevel*0.35;
          const stutter = Math.sin(performance.now()*0.02) > 0.3 ? 1 : 0;
          if (stutter) tryMoveEntity(pos.x, pos.z, creepSpeed, dt);
        }
      }
      entity.lookAt(pos.x, 0, pos.z);
      const distToPlayer = Math.hypot(entity.position.x-pos.x, entity.position.z-pos.z);
      // 가까이 있을수록 화면 전체는 어두워지고, 얼굴만 도드라지게 발광
      const CLOSE_START = 4.5, CLOSE_MAX = 1.3;
      const closeT = Math.max(0, Math.min(1, (CLOSE_START-distToPlayer)/(CLOSE_START-CLOSE_MAX)));
      closeDark.style.opacity = (closeT*0.9).toFixed(2);
      entityHeadMat.emissiveIntensity = closeT*1.6;
      faceLight.intensity = closeT*4.5;
      if (distToPlayer < 1.1){
        caughtState = true;
        entity.visible = true;
        showCaughtScreen();
      }
      // 사라질 때가 되면(다음 순간이동 직전) 서서히 페이드아웃 느낌으로 깜빡이다 사라짐 - 추격 중에는 해당 없음
      if (!isChasing && entityTeleportTimer < 0.4 && entityFlickerT <= 0){
        entityFlickerT = 0.3;
      }
      if (entityTeleportTimer < 0.05) entity.visible = false;
    } else {
      closeDark.style.opacity = 0;
    }
  }

  const caughtOverlay = document.createElement('div');
  caughtOverlay.style.cssText = 'position:fixed;inset:0;z-index:60;background:#0a0000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;';
  caughtOverlay.innerHTML = '<h1 style="color:#ff5c4a;font-size:30px;letter-spacing:2px;font-weight:900;">잡혔다</h1><button id="restartBtn" style="padding:14px 32px;border-radius:6px;border:1px solid #ff5c4a;background:transparent;color:#ff5c4a;font-size:15px;font-weight:800;cursor:pointer;">다시 시작</button>';
  document.body.appendChild(caughtOverlay);
  document.getElementById('restartBtn').addEventListener('click', ()=> location.reload());
  function showCaughtScreen(){
    if (document.pointerLockElement) document.exitPointerLock();
    caughtOverlay.style.display = 'flex';
  }

  // ================= 입력 =================
  const keys = {};
  window.addEventListener('keydown', e=>{
    keys[e.code]=true;
    if (e.code==='Space'){ jumpHeld=true; jumpBufferTimer=0.15; }
  });
  window.addEventListener('keyup', e=>{ keys[e.code]=false; if (e.code==='Space') jumpHeld=false; });

  let moveVec = new THREE.Vector2(0,0);
  const joyBase = document.getElementById('joyBase');
  const joyStick = document.getElementById('joyStick');
  const joyZone = document.getElementById('joyZone');
  let joyTouchId=null, joyCenter={x:0,y:0};
  const JOY_RADIUS=55;
  function getJoyCenter(){ const r=joyBase.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2}; }
  function joyStart(x,y,id){ joyTouchId=id; joyCenter=getJoyCenter(); joyMove(x,y); }
  function joyMove(x,y){
    let dx=x-joyCenter.x, dy=y-joyCenter.y;
    const dist=Math.min(Math.hypot(dx,dy),JOY_RADIUS);
    const ang=Math.atan2(dy,dx);
    dx=Math.cos(ang)*dist; dy=Math.sin(ang)*dist;
    joyStick.style.transform = `translate(${dx}px,${dy}px)`;
    moveVec.x=dx/JOY_RADIUS; moveVec.y=dy/JOY_RADIUS;
  }
  function joyEnd(){ joyTouchId=null; joyStick.style.transform='translate(0,0)'; moveVec.set(0,0); }
  joyZone.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; joyStart(t.clientX,t.clientY,t.identifier); }, {passive:false});
  joyZone.addEventListener('touchmove', e=>{ e.preventDefault(); for (const t of e.changedTouches){ if (t.identifier===joyTouchId) joyMove(t.clientX,t.clientY); } }, {passive:false});
  joyZone.addEventListener('touchend', e=>{ for (const t of e.changedTouches){ if (t.identifier===joyTouchId) joyEnd(); } });
  window.addEventListener('touchcancel', joyEnd);

  const camZone = document.getElementById('camZone');
  let camDragId=null, lastX=0,lastY=0;
  function camStart(x,y,id){ camDragId=id; lastX=x; lastY=y; }
  function camMove(x,y){
    if (camDragId===null) return;
    camYaw -= (x-lastX)*0.0055;
    camPitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, camPitch - (y-lastY)*0.004));
    lastX=x; lastY=y;
  }
  camZone.addEventListener('touchstart', e=>{ const t=e.touches[0]; camStart(t.clientX,t.clientY,t.identifier); }, {passive:true});
  camZone.addEventListener('touchmove', e=>{ for (const t of e.changedTouches){ if (t.identifier===camDragId) camMove(t.clientX,t.clientY); } }, {passive:true});
  camZone.addEventListener('touchend', ()=>{ camDragId=null; });

  // 데스크톱: 포인터락으로 진짜 1인칭 마우스룩
  let pointerLocked = false;
  canvas.addEventListener('click', ()=>{ if (!isTouchDevice && !pointerLocked) canvas.requestPointerLock(); });
  document.addEventListener('pointerlockchange', ()=>{ pointerLocked = document.pointerLockElement === canvas; });
  window.addEventListener('mousemove', e=>{
    if (!pointerLocked) return;
    camYaw -= e.movementX*0.0022;
    camPitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, camPitch - e.movementY*0.0022));
  });

  const jumpBtn = document.getElementById('jumpBtn');
  jumpBtn.addEventListener('touchstart', e=>{ e.preventDefault(); jumpHeld=true; jumpBufferTimer=0.15; }, {passive:false});
  jumpBtn.addEventListener('touchend', e=>{ e.preventDefault(); jumpHeld=false; }, {passive:false});

  // ================= 시작 화면 =================
  const startOverlay = document.getElementById('startOverlay');
  document.getElementById('startBtn').addEventListener('click', ()=>{
    startOverlay.classList.add('hide');
    if (!isTouchDevice) canvas.requestPointerLock();
  });

  // ================= 형광등 깜빡임 + 정전 이벤트 =================
  const noticeText = document.getElementById('noticeText');
  const staticFlash = document.getElementById('staticFlash');
  const closeDark = document.getElementById('closeDark');
  let noticeTimer = 8 + Math.random()*10;

  function updateLights(dt){
    const flickerNow = performance.now()*0.001;
    for (const [key,c] of maze.entries()){
      if (!c.hasLight || !c.lightObj) continue;
      c.flickerT -= dt;
      if (c.flickerT <= 0){
        // 꺼지는 빈도/지속시간을 늘려서 더 불안한 느낌으로
        if (Math.random() < 0.24){
          c.litOn = false;
          c.flickerT = 0.12 + Math.random()*0.6;
        } else {
          c.litOn = true;
          c.flickerT = 1.2 + Math.random()*5;
        }
      }
      const jitter = c.litOn ? (Math.sin(flickerNow*37 + key.length*13)*0.08) : 0; // 켜져있을 때도 미세하게 떨림
      const targetIntensity = c.litOn ? 1.15 + jitter : 0;
      c.lightObj.intensity += (targetIntensity - c.lightObj.intensity) * Math.min(1, dt*20);
      c.fixtureObj.emissiveIntensity = c.litOn ? 1.0 + jitter : 0.03;
    }
    noticeTimer -= dt;
    if (noticeTimer <= 0){
      noticeTimer = 14 + Math.random()*18;
      const notices = ['희미한 웅웅거림', '먼 곳의 발소리?', '공기가 무거워짐', '카펫 냄새가 더 진해짐', '조용해졌다...'];
      noticeText.textContent = notices[Math.floor(Math.random()*notices.length)];
      staticFlash.style.transition = 'opacity .05s';
      staticFlash.style.opacity = '0.35';
      setTimeout(()=>{ staticFlash.style.transition='opacity .4s'; staticFlash.style.opacity='0'; }, 60);
    }
  }

  // ================= 메인 루프 =================
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    updateLights(dt);
    updateEntity(dt);
    refreshMazeAround(pos.x, pos.z);

    if (caughtState){ renderer.render(scene, camera); return; }

    let inX = moveVec.x, inY = moveVec.y;
    if (keys['KeyW']||keys['ArrowUp']) inY=-1;
    if (keys['KeyS']||keys['ArrowDown']) inY=1;
    if (keys['KeyA']||keys['ArrowLeft']) inX=-1;
    if (keys['KeyD']||keys['ArrowRight']) inX=1;
    const inLen = Math.hypot(inX,inY);
    if (inLen>1){ inX/=inLen; inY/=inLen; }

    const forward = new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw));
    const right = new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));
    const moveDir = new THREE.Vector3();
    moveDir.addScaledVector(forward, -inY);
    moveDir.addScaledVector(right, inX);
    const moving = moveDir.lengthSq() > 0.0001;
    if (moving) moveDir.normalize();

    const targetVX = moveDir.x*WALK_SPEED, targetVZ = moveDir.z*WALK_SPEED;
    curSpeed.x += (targetVX-curSpeed.x)*Math.min(1, 12*dt);
    curSpeed.y += (targetVZ-curSpeed.y)*Math.min(1, 12*dt);
    if (!moving){ curSpeed.x*=Math.max(0,1-14*dt); curSpeed.y*=Math.max(0,1-14*dt); }

    coyoteTimer = grounded ? 0.12 : Math.max(0, coyoteTimer-dt);
    jumpBufferTimer = Math.max(0, jumpBufferTimer-dt);
    if ((grounded || coyoteTimer>0) && (jumpHeld || jumpBufferTimer>0)){
      velY = JUMP_VEL; grounded = false; coyoteTimer = 0; jumpBufferTimer = 0;
    }
    velY += GRAVITY*dt;
    let newY = pos.y + velY*dt;
    if (newY <= 0){ newY = 0; velY = 0; grounded = true; } else grounded = false;

    // 벽 충돌: X/Z 각각 따로 시도해서 미끄러지듯 이동
    const tryX = pos.x + curSpeed.x*dt;
    const tryZ = pos.z + curSpeed.y*dt;
    if (!isWallBlocking(tryX + Math.sign(curSpeed.x||0)*PLAYER_R, pos.z)) pos.x = tryX; else curSpeed.x = 0;
    if (!isWallBlocking(pos.x, tryZ + Math.sign(curSpeed.y||0)*PLAYER_R)) pos.z = tryZ; else curSpeed.y = 0;
    pos.y = newY;

    camera.position.set(pos.x, pos.y + EYE_HEIGHT, pos.z);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = camYaw;
    camera.rotation.x = camPitch;

    renderer.render(scene, camera);
  }
  animate();
 } catch (err) {
  showError('백룸 초기화 실패', (err && err.message ? err.message : String(err)) + (err && err.stack ? ('\n\n'+err.stack) : ''));
 }
})();
</script>
</body>
</html>
