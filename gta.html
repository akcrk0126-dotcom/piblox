<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0f">
<title>SAN LUNA — 오픈월드 범죄 액션</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --g:#3ec46d; --b:#3aa0ff; --y:#f5c518; --r:#e2342f; --tx:#f4f4f4; --hf:'Anton','Impact','Arial Narrow',sans-serif; --kf:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#000; color:var(--tx); font-family:var(--kf); user-select:none; -webkit-user-select:none; touch-action:none; }
  #gl{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  button{ font:inherit; color:inherit; border:none; background:none; cursor:pointer; }
  svg.i{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .hide{ display:none !important; }

  /* ---------- 로딩 ---------- */
  #load{ position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:radial-gradient(1200px 700px at 30% 20%, #3a1a4a, #0a0610 70%); }
  #load .logo{ font-family:var(--hf); font-size:clamp(64px, 14vw, 150px); letter-spacing:.02em; line-height:.9; text-align:center; background:linear-gradient(180deg, #fff 0%, #ffd27a 45%, #ff6a3a 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 6px 0 #000) drop-shadow(0 0 30px rgba(255,120,60,.45)); }
  #load .sub{ font-weight:900; letter-spacing:.4em; color:#ffd27a; font-size:13px; }
  #load .bar{ width:min(420px, 80vw); height:6px; background:rgba(255,255,255,.12); border-radius:4px; overflow:hidden; }
  #load .bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg, #ff6a3a, #ffd27a); transition:width .2s; }
  #load .tip{ max-width:min(560px, 86vw); text-align:center; color:#cbb; font-size:13.5px; line-height:1.6; min-height:44px; }
  #load .go{ font-family:var(--hf); font-size:30px; letter-spacing:.06em; padding:12px 40px; border:3px solid #fff; color:#fff; background:rgba(255,255,255,.06); }
  #load .go:hover{ background:#fff; color:#000; }
  #load .opts{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; font-size:13px; color:#ccc; }
  #load .opts button{ padding:8px 14px; border:1px solid rgba(255,255,255,.3); }
  #load .opts button.on{ background:#fff; color:#000; }

  /* ---------- HUD ---------- */
  #hud{ position:fixed; inset:0; z-index:10; pointer-events:none; }
  #tr{ position:absolute; right:22px; top:16px; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #money{ font-family:var(--hf); font-size:34px; color:#7ee08a; text-shadow:0 2px 0 #000, 0 0 3px #000, 2px 0 0 #000, -2px 0 0 #000; letter-spacing:.03em; }
  #money.down{ color:#ff6a6a; }
  #stars{ display:flex; gap:3px; }
  #stars svg{ width:26px; height:26px; }
  #stars .s{ fill:rgba(255,255,255,.12); stroke:rgba(0,0,0,.6); stroke-width:1.5; }
  #stars .s.on{ fill:#fff; }
  #stars.blink .s.on{ animation:blink .5s steps(1) infinite; }
  @keyframes blink{ 50%{ fill:rgba(255,255,255,.25); } }
  #wpn{ display:flex; align-items:center; gap:10px; padding:6px 10px; background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.55)); }
  #wpn svg{ width:58px; height:28px; }
  #wpn b{ font-family:var(--hf); font-size:24px; text-shadow:0 2px 0 #000; }
  #wpn small{ font-family:var(--hf); font-size:16px; color:#bbb; }
  #bl{ position:absolute; left:20px; bottom:18px; display:flex; flex-direction:column; gap:5px; }
  #mm{ width:260px; height:170px; border-radius:6px; border:2px solid rgba(0,0,0,.6); box-shadow:0 4px 18px rgba(0,0,0,.5); background:#1a2228; display:block; }
  .bars{ display:flex; gap:4px; width:260px; }
  .bars div{ height:8px; flex:1; background:rgba(0,0,0,.55); border-radius:2px; overflow:hidden; }
  .bars i{ display:block; height:100%; transition:width .2s; }
  #hpb i{ background:linear-gradient(90deg, #2e9a50, #4fd47a); } #arb i{ background:linear-gradient(90deg, #2a7ad8, #5ab4ff); }
  #hpb.low i{ background:#e2342f; animation:pulse .6s infinite alternate; } @keyframes pulse{ to{ opacity:.5; } }
  #area{ font-weight:900; font-size:14px; text-shadow:0 1px 3px #000; letter-spacing:.02em; }
  #area small{ font-weight:700; color:#ccc; margin-left:8px; }
  #help{ position:absolute; left:20px; top:58px; max-width:min(380px, 60vw); padding:12px 14px; background:rgba(0,0,0,.78); border-radius:4px; font-size:14px; line-height:1.55; opacity:0; transform:translateY(-6px); transition:.2s; }
  #help.on{ opacity:1; transform:none; }
  #help kbd, .kb{ display:inline-block; min-width:22px; padding:0 6px; border:1px solid rgba(255,255,255,.6); border-radius:4px; font:900 12px/20px var(--kf); text-align:center; background:rgba(255,255,255,.12); margin:0 2px; }
  #sub{ position:absolute; left:50%; bottom:100px; transform:translateX(-50%); width:min(800px, 92vw); text-align:center; font-size:18px; font-weight:700; text-shadow:0 2px 3px #000, 0 0 2px #000; line-height:1.5; }
  #sub b{ color:var(--y); } #sub em{ font-style:normal; color:#7ec8ff; }
  #obj{ position:absolute; left:50%; top:70px; transform:translateX(-50%); text-align:center; font-weight:900; font-size:15px; text-shadow:0 2px 3px #000; }
  #obj .t{ font-family:var(--hf); font-size:30px; color:#fff; letter-spacing:.04em; }
  #big{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; transition:opacity .5s; }
  #big.on{ opacity:1; }
  #big h1{ margin:0; font-family:var(--hf); font-size:clamp(70px, 14vw, 150px); letter-spacing:.04em; text-shadow:0 5px 0 #000, 0 0 40px rgba(0,0,0,.8); }
  #big h1.red{ color:#c4232a; } #big h1.blue{ color:#3a7ae8; } #big h1.gold{ color:var(--y); font-size:clamp(46px, 8vw, 90px); }
  #big p{ margin:6px 0 0; font-size:20px; font-weight:900; text-shadow:0 2px 4px #000; }
  #big .band{ position:absolute; left:0; right:0; height:160px; background:linear-gradient(90deg, transparent, rgba(0,0,0,.6) 20%, rgba(0,0,0,.6) 80%, transparent); z-index:-1; }
  #pop{ position:absolute; right:22px; bottom:28px; text-align:right; font-family:var(--hf); font-size:28px; text-shadow:0 2px 0 #000; opacity:0; transition:opacity .4s; }
  #pop.on{ opacity:1; } #pop small{ display:block; font-family:var(--kf); font-weight:700; font-size:13px; color:#ddd; }
  #radio{ position:absolute; left:50%; top:22px; transform:translateX(-50%); text-align:center; opacity:0; transition:opacity .3s; text-shadow:0 2px 3px #000; }
  #radio.on{ opacity:1; } #radio b{ font-family:var(--hf); font-size:30px; letter-spacing:.05em; display:block; } #radio small{ font-weight:700; color:#ddd; }
  #speedo{ position:absolute; right:24px; bottom:22px; text-align:right; font-family:var(--hf); text-shadow:0 2px 0 #000; }
  #speedo b{ font-size:48px; } #speedo small{ font-size:16px; color:#ccc; margin-left:4px; }
  #speedo .dmg{ width:120px; height:5px; background:rgba(0,0,0,.5); margin-left:auto; margin-top:2px; border-radius:2px; overflow:hidden; } #speedo .dmg i{ display:block; height:100%; background:#f5c518; }
  #cross{ position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; opacity:0; transition:opacity .1s; }
  #cross.on{ opacity:1; } #cross:before, #cross:after{ content:''; position:absolute; background:#fff; box-shadow:0 0 2px #000; } #cross:before{ left:11px; top:4px; width:2px; height:16px; } #cross:after{ top:11px; left:4px; height:2px; width:16px; }
  #cross.dot:before{ left:10px; top:10px; width:4px; height:4px; border-radius:50%; } #cross.dot:after{ display:none; }
  #hitm{ position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; opacity:0; }
  #hitm:before, #hitm:after{ content:''; position:absolute; left:14px; top:0; width:2px; height:30px; background:#fff; } #hitm:before{ transform:rotate(45deg); } #hitm:after{ transform:rotate(-45deg); }
  #hitm.on{ animation:hm .25s; } #hitm.head:before, #hitm.head:after{ background:#ff3a3a; } @keyframes hm{ 0%{ opacity:1; transform:scale(1.3); } 100%{ opacity:0; transform:scale(1); } }
  #scope{ position:absolute; inset:0; display:none; background:radial-gradient(circle at 50% 50%, transparent 0 32vmin, #000 32.2vmin); }
  #scope.on{ display:block; } #scope:before{ content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:#000; } #scope:after{ content:''; position:absolute; top:0; bottom:0; left:50%; width:1px; background:#000; }
  #dmgv{ position:absolute; inset:0; background:radial-gradient(circle, transparent 50%, rgba(160,0,0,.55)); opacity:0; transition:opacity .25s; }
  #cash{ position:absolute; right:22px; top:58px; font-family:var(--hf); font-size:22px; color:#7ee08a; text-shadow:0 2px 0 #000; opacity:0; transition:opacity .3s, transform .3s; }
  #cash.on{ opacity:1; transform:translateY(4px); }
  #feed{ position:absolute; right:22px; top:150px; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  #feed div{ padding:4px 10px; background:rgba(0,0,0,.6); font-size:13px; font-weight:700; border-right:3px solid var(--y); animation:fin .3s; }
  @keyframes fin{ from{ opacity:0; transform:translateX(20px); } }
  #timer{ position:absolute; right:22px; top:120px; font-family:var(--hf); font-size:30px; text-shadow:0 2px 0 #000; }
  #timer.low{ color:#ff5a4a; }
  #grey{ position:fixed; inset:0; z-index:9; pointer-events:none; backdrop-filter:grayscale(1) contrast(1.1); -webkit-backdrop-filter:grayscale(1) contrast(1.1); opacity:0; transition:opacity 1.2s; }
  #grey.on{ opacity:1; }

  /* ---------- 무기 휠 ---------- */
  #wheel{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.35); }
  #wheel.on{ display:flex; }
  #wheel .ring{ position:relative; width:min(460px, 86vw); height:min(460px, 86vw); border-radius:50%; background:radial-gradient(circle, rgba(0,0,0,.2) 0 28%, rgba(0,0,0,.72) 28.5% 100%); }
  #wheel .it{ position:absolute; width:96px; height:70px; margin:-35px 0 0 -48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:10px; color:#bbb; font-size:11.5px; font-weight:700; pointer-events:auto; }
  #wheel .it svg{ width:64px; height:30px; } #wheel .it.own{ color:#fff; } #wheel .it.none{ opacity:.25; } #wheel .it.sel{ background:rgba(255,255,255,.18); color:var(--y); }
  #wheel .mid{ position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); text-align:center; font-family:var(--hf); font-size:24px; }
  #wheel .mid small{ display:block; font-family:var(--kf); font-size:12px; color:#bbb; }

  /* ---------- 창 (지도 · 메뉴 · 상점) ---------- */
  .pane{ position:fixed; inset:0; z-index:30; display:none; background:rgba(4,6,10,.88); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .pane.on{ display:flex; }
  .pane .hd{ display:flex; align-items:center; gap:14px; padding:16px 22px; border-bottom:1px solid rgba(255,255,255,.12); }
  .pane .hd h2{ margin:0; font-family:var(--hf); font-size:34px; letter-spacing:.04em; flex:1; }
  .pane .x{ width:40px; height:40px; border-radius:8px; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; }
  #map{ flex-direction:column; }
  #map .body{ flex:1; position:relative; overflow:hidden; }
  #bigmap{ position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; touch-action:none; }
  #map .legend{ position:absolute; right:14px; bottom:14px; background:rgba(0,0,0,.7); padding:10px 12px; border-radius:6px; font-size:12px; line-height:1.9; }
  #map .legend span{ display:inline-flex; align-items:center; gap:6px; margin-right:10px; }
  #map .legend i{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  #map .hint{ position:absolute; left:14px; bottom:14px; background:rgba(0,0,0,.7); padding:8px 12px; border-radius:6px; font-size:12.5px; }
  #menu{ flex-direction:column; }
  #menu .tabs{ display:flex; gap:4px; padding:0 22px; border-bottom:1px solid rgba(255,255,255,.1); flex-wrap:wrap; }
  #menu .tabs button{ padding:12px 16px; font-weight:900; color:#999; border-bottom:3px solid transparent; }
  #menu .tabs button.on{ color:#fff; border-color:var(--y); }
  #menu .content{ flex:1; overflow:auto; padding:18px 22px 40px; }
  .grid2{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
  .stat{ background:rgba(255,255,255,.06); border-radius:8px; padding:12px 14px; } .stat small{ display:block; color:#aaa; font-size:12px; } .stat b{ font-size:22px; font-family:var(--hf); letter-spacing:.03em; }
  .row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.08); } .row label{ flex:1; font-weight:700; }
  .row input[type=range]{ width:200px; } .seg{ display:flex; gap:4px; } .seg button{ padding:7px 12px; border:1px solid rgba(255,255,255,.25); border-radius:6px; font-size:13px; } .seg button.on{ background:#fff; color:#000; }
  .bigbtn{ padding:12px 18px; background:#fff; color:#000; font-weight:900; border-radius:6px; }
  .bigbtn.ghost{ background:rgba(255,255,255,.1); color:#fff; }
  .keys{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; } .keys b{ text-align:right; }
  .mlist .m{ display:flex; gap:12px; align-items:center; padding:12px; border-radius:8px; background:rgba(255,255,255,.05); margin-bottom:8px; } .mlist .m.done{ opacity:.55; } .mlist .m b{ display:block; } .mlist .m small{ color:#aaa; }
  .mlist .dot{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; background:var(--y); color:#000; flex:none; }
  #shop{ align-items:center; justify-content:flex-end; background:linear-gradient(90deg, transparent 30%, rgba(4,6,10,.92) 60%); backdrop-filter:none; -webkit-backdrop-filter:none; }
  #shop .box{ width:min(440px, 100vw); height:100%; display:flex; flex-direction:column; background:rgba(8,10,16,.9); border-left:1px solid rgba(255,255,255,.1); }
  #shop .list{ flex:1; overflow:auto; padding:10px 16px 30px; }
  #shop .it{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; background:rgba(255,255,255,.05); margin-bottom:6px; width:100%; text-align:left; }
  #shop .it:hover{ background:rgba(255,255,255,.12); } #shop .it svg{ width:64px; height:30px; flex:none; } #shop .it b{ display:block; } #shop .it small{ color:#aaa; font-size:12px; } #shop .it .pr{ margin-left:auto; font-family:var(--hf); font-size:20px; color:#7ee08a; } #shop .it .pr.no{ color:#ff6a6a; } #shop .it.own .pr{ color:#aaa; font-size:14px; font-family:var(--kf); }
  #shop .money{ font-family:var(--hf); font-size:24px; color:#7ee08a; }
  #shop h4{ margin:14px 0 6px; color:#aaa; font-size:12px; letter-spacing:.1em; }
  .sw{ display:flex; flex-wrap:wrap; gap:6px; } .sw button{ width:34px; height:34px; border-radius:6px; border:2px solid rgba(255,255,255,.2); } .sw button.on{ border-color:#fff; box-shadow:0 0 0 2px #000 inset; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; } .chips button{ padding:7px 12px; border-radius:6px; background:rgba(255,255,255,.08); font-size:13px; font-weight:700; } .chips button.on{ background:#fff; color:#000; }

  /* ---------- 터치 ---------- */
  #touch{ position:fixed; inset:0; z-index:12; pointer-events:none; display:none; }
  body.touch #touch{ display:block; }
  #joy{ position:absolute; left:28px; bottom:34px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.18); pointer-events:auto; }
  #knob{ position:absolute; left:45px; top:45px; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.35); }
  .tbtn{ position:absolute; width:62px; height:62px; border-radius:50%; background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.35); pointer-events:auto; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px; color:#fff; flex-direction:column; gap:1px; }
  .tbtn svg{ width:24px; height:24px; } .tbtn.on{ background:rgba(255,255,255,.35); } .tbtn.big{ width:80px; height:80px; }
  body.touch #bl{ left:auto; right:10px; bottom:auto; top:120px; transform:scale(.7); transform-origin:top right; }
  body.touch #speedo{ bottom:auto; top:210px; } body.touch #help{ font-size:12.5px; } body.touch #sub{ bottom:auto; top:44%; font-size:15px; }
  body.car .foot, body:not(.car) .car{ display:none !important; }
  #tmenu{ position:absolute; left:50%; top:10px; transform:translateX(-50%); display:flex; gap:8px; pointer-events:auto; }
  #tmenu button{ width:44px; height:44px; border-radius:10px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; }
  @media (max-width:700px){ #money{ font-size:26px; } #stars svg{ width:20px; height:20px; } #wpn svg{ width:46px; } #big p{ font-size:15px; } }
</style>
</head>
<body>
<!-- 로딩 -->
<div id="load">
  <div class="sub">PLAYHUB · OPEN WORLD</div>
  <div class="logo">SAN<br>LUNA</div>
  <div class="bar"><i id="lbar"></i></div>
  <div class="tip" id="ltip">도시를 짓는 중…</div>
  <div class="opts" id="lopts"></div>
  <button class="go hide" id="lgo">플레이</button>
</div>

<!-- HUD -->
<div id="hud" class="hide">
  <div id="grey"></div>
  <div id="dmgv"></div>
  <div id="scope"></div>
  <div id="cross"></div><div id="hitm"></div>
  <div id="help"></div>
  <div id="tr"><div id="money">$0</div><div id="stars"></div><div id="wpn"></div></div>
  <div id="cash"></div>
  <div id="timer" class="hide"></div>
  <div id="feed"></div>
  <div id="obj"></div>
  <div id="radio"><b></b><small></small></div>
  <div id="bl"><canvas id="mm" width="520" height="340"></canvas><div class="bars"><div id="hpb" style="flex:2"><i></i></div><div id="arb"><i></i></div></div><div id="area"></div></div>
  <div id="speedo" class="hide"><b>0</b><small>KM/H</small><div class="dmg"><i></i></div></div>
  <div id="pop"></div>
  <div id="sub"></div>
  <div id="big"><div class="band"></div><h1></h1><p></p></div>
</div>

<!-- 터치 -->
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div id="tmenu"><button data-ui="map"><svg class="i" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg></button><button data-ui="wheel"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg></button><button data-ui="menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
  <!-- 걸어다닐 때 -->
  <button class="tbtn big foot" data-tk="fire" style="right:30px;bottom:110px"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>공격</button>
  <button class="tbtn foot" data-tk="aim" data-toggle style="right:124px;bottom:150px"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>조준</button>
  <button class="tbtn foot" data-tk="jump" style="right:120px;bottom:60px"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>점프</button>
  <button class="tbtn foot" data-tk="sprint" data-toggle style="right:200px;bottom:40px"><svg class="i" viewBox="0 0 24 24"><path d="M13 4l-2 6h4l-2 10"/></svg>달리기</button>
  <!-- 운전할 때 -->
  <button class="tbtn big car" data-tk="gas" style="right:30px;bottom:60px"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>가속</button>
  <button class="tbtn big car" data-tk="brake" style="right:124px;bottom:30px"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>브레이크</button>
  <button class="tbtn car" data-tk="hb" style="right:40px;bottom:160px">핸드<br>브레이크</button>
