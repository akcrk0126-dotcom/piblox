<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>아우라 배틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#87CEEB; font-family: -apple-system, 'Malgun Gothic', sans-serif; touch-action:none; cursor:none; }
  #canvas { display:block; width:100%; height:100%; cursor:none; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #title { position:absolute; top:14px; left:50%; transform:translateX(-50%); color:#fff; font-size:15px; font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.5); letter-spacing:1px; }
  #hint { position:absolute; top:38px; left:50%; transform:translateX(-50%); color:#fff; font-size:11px; opacity:.85; text-shadow:0 1px 4px rgba(0,0,0,.5); text-align:center; }

  /* Joystick */
  #joyZone { position:absolute; left:0; bottom:0; width:45%; height:55%; pointer-events:auto; }
  #joyBase { position:absolute; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.18); border:3px solid rgba(255,255,255,.55); box-shadow:0 0 0 6px rgba(0,0,0,.08), inset 0 0 20px rgba(255,255,255,.08); display:none; }
  #joyBase::after { content:''; position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:rgba(255,255,255,.4); }
  #joyStick { position:absolute; width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 3px 10px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.12); }

  /* Camera drag zone */
  #camZone { position:absolute; right:0; bottom:0; width:55%; height:100%; pointer-events:auto; }

  /* Jump button */
  #jumpBtn { position:absolute; right:32px; bottom:54px; width:74px; height:74px; border-radius:50%; background:rgba(255,255,255,.28); border:3px solid rgba(255,255,255,.6); pointer-events:auto; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800; text-shadow:0 1px 4px rgba(0,0,0,.4); }
  #jumpBtn:active { background:rgba(255,255,255,.5); }

  /* Shift lock toggle: 점프 버튼 살짝 아래-오른쪽의 작은 자물쇠 아이콘 버튼 */
  #lockBtn { position:absolute; right:14px; bottom:14px; width:44px; height:44px; border-radius:50%;
    background:rgba(20,20,30,.55); border:2px solid rgba(255,255,255,.55); pointer-events:auto;
    display:flex; align-items:center; justify-content:center; font-size:18px; line-height:1;
    box-shadow:0 3px 10px rgba(0,0,0,.35); transition:background .15s ease, border-color .15s ease, box-shadow .15s ease; }
  #lockBtn.active { background:#1e88ff; border-color:#fff; box-shadow:0 0 14px rgba(30,136,255,.85), 0 3px 10px rgba(0,0,0,.35); }

  /* 터치 기기가 아니면 모바일 조작 클러스터(조이스틱/점프/시점고정)는 숨김 - 데스크톱은 WASD·마우스·단축키 사용 */
  body:not(.has-touch) #joyZone,
  body:not(.has-touch) #jumpBtn,
  body:not(.has-touch) #lockBtn { display:none !important; }

  #speedTag { position:absolute; top:66px; right:14px; padding:8px 12px; border-radius:20px; background:rgba(0,0,0,.35); color:#fff; font-size:11px; font-weight:700; }

  #crosshair { position:fixed; top:50%; left:50%; width:16px; height:16px; margin:-8px 0 0 -8px; pointer-events:none; z-index:25; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,.9); box-shadow:0 0 2px rgba(0,0,0,.7); }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #crosshair::after { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }

  /* ===== 아우라 가챠 ===== */
  #gachaBtn { position:absolute; right:32px; bottom:142px; width:74px; height:74px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #8a6bff, #4a2fb8 65%, #2a1a70); border:3px solid rgba(255,255,255,.7);
    pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    color:#fff; font-size:11px; font-weight:800; font-family:inherit; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.4), 0 0 22px rgba(150,110,255,.65); text-shadow:0 1px 4px rgba(0,0,0,.5); }
  #gachaBtn .dice { font-size:24px; line-height:1; }
  #gachaBtn:active { transform:scale(.94); }
  #gachaBtn:disabled { opacity:.45; pointer-events:none; }

  #auraBadge { position:absolute; top:66px; left:50%; transform:translateX(-50%); display:none; align-items:center; gap:7px;
    padding:6px 14px; border-radius:20px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.35);
    color:#fff; font-size:11px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.5); white-space:nowrap; }
  #auraBadge em { font-style:normal; opacity:.75; margin-left:2px; }
  .badgeDot { width:9px; height:9px; border-radius:50%; flex:none; }

  #auraTag { position:fixed; left:0; top:0; pointer-events:none; z-index:30; padding:4px 4px; border-radius:10px;
    text-align:center; white-space:nowrap; opacity:0; transform:translate(-50%,-100%) scale(.7);
    transition:opacity .5s ease, transform .4s cubic-bezier(.34,1.56,.64,1); }
  #auraTag .tagName { font-size:16px; font-weight:900; letter-spacing:.5px; }
  #auraTag .tagName.font-cursive { font-family:'Dancing Script', cursive; font-size:22px; font-weight:700; letter-spacing:1px; }
  #auraTag .tagName.font-fantasy { font-family:'Cinzel Decorative', serif; font-size:15px; font-weight:900; letter-spacing:1.5px; }
  #auraTag .windWrap { position:relative; display:inline-block; }
  #auraTag .windWrap::before, #auraTag .windWrap::after {
    content:''; position:absolute; top:50%; left:50%; width:140%; height:140%;
    border:1.5px dashed currentColor; border-radius:50%; opacity:.35; pointer-events:none;
    transform:translate(-50%,-50%) rotate(0deg);
  }
  #auraTag .windWrap::before { animation: windSpin1 2.6s linear infinite; border-top-color:transparent; border-bottom-color:transparent; }
  #auraTag .windWrap::after { animation: windSpin2 3.6s linear infinite reverse; width:170%; height:170%; border-left-color:transparent; border-right-color:transparent; opacity:.22; }
  @keyframes windSpin1 { from{ transform:translate(-50%,-50%) rotate(0deg); } to{ transform:translate(-50%,-50%) rotate(360deg); } }
  @keyframes windSpin2 { from{ transform:translate(-50%,-50%) rotate(0deg); } to{ transform:translate(-50%,-50%) rotate(360deg); } }
  #auraTag .tagProb { font-size:11px; font-weight:700; opacity:.9; margin-top:1px; }
  #auraTag .tagTrait { font-size:10px; font-weight:700; opacity:.8; margin-top:2px; color:#fff; }
  /* 등급별 색상은 AURA_TIERS로부터 동적으로 생성되어 주입됨 (아래 JS 참고) */
  @keyframes legendaryPulse {
    0%,100% { filter:drop-shadow(0 0 12px rgba(255,180,0,.85)); }
    50%     { filter:drop-shadow(0 0 24px rgba(255,100,0,1)); }
  }
  @keyframes legendaryTextGlow {
    0%,100% {
      text-shadow:
        0 0 6px rgba(255,255,255,.85),
        0 0 14px rgba(255,180,0,.85),
        0 0 24px rgba(255,110,0,.7);
    }
    50% {
      text-shadow:
        0 0 10px rgba(255,255,255,1),
        0 0 22px rgba(255,200,0,1),
        0 0 40px rgba(255,90,0,1);
    }
  }
  /* ===== 추후 추가 예정인 텍스트 연출 (지금은 정의만 해두고 아직 적용 안 함) =====
     .tagName.fx-shake     : 살짝 흔들리는 글씨 (등급이 더 올라가면 추가 예정)
     .tagName.fx-mono-glow : 흑백 명암 대비 + 스캔라인 느낌의 간지나는 텍스트
  */
  .tagName.fx-shake { animation: tagShake .35s ease-in-out infinite; }
  @keyframes tagShake {
    0%,100%  { transform:translate(0,0); }
    20%      { transform:translate(-1px,1px); }
    40%      { transform:translate(1px,-1px); }
    60%      { transform:translate(-1px,-1px); }
    80%      { transform:translate(1px,1px); }
  }
  .tagName.fx-mono-glow {
    color:#f5f5f5;
    text-shadow:0 0 4px #fff, 0 0 12px #ccc, 0 0 22px #999;
    filter:grayscale(1) contrast(1.3);
  }

  #gachaOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); z-index:50; pointer-events:auto; transition:background .35s ease; }
  #gachaOverlay.show { background:rgba(0,0,0,.72); }

  #multOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); z-index:55; pointer-events:none; transition:background .2s ease; }
  #multOverlay.show { background:rgba(0,0,0,.6); }
  #multText { font-weight:900; text-align:center; letter-spacing:1px; transform:scale(0.3); opacity:0;
    transition:transform .22s cubic-bezier(.34,1.9,.64,1), opacity .18s ease; }
  #multOverlay.show #multText { transform:scale(1); opacity:1; }
  #multText.shake { animation: multShake .45s ease-in-out; }
  @keyframes multShake {
    0%,100% { transform:translate(0,0) scale(1); }
    20% { transform:translate(-7px,4px) scale(1.05); }
    40% { transform:translate(7px,-4px) scale(1.05); }
    60% { transform:translate(-5px,3px) scale(1.03); }
    80% { transform:translate(5px,-3px) scale(1.03); }
  }
  #gachaPanel { width:260px; background:linear-gradient(180deg,#241a44,#100a24); border:2px solid rgba(255,255,255,.25);
    border-radius:18px; padding:14px; box-shadow:0 20px 60px rgba(0,0,0,.6);
    transform:scale(.85); opacity:0; transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
  #gachaOverlay.show #gachaPanel { transform:scale(1); opacity:1; }
  #gachaTitle { text-align:center; color:#fff; font-size:13px; font-weight:800; letter-spacing:2px; margin-bottom:10px; opacity:.8; }
  #gachaWindow { position:relative; height:340px; overflow:hidden; border-radius:12px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.15); }
  #gachaWindow::before, #gachaWindow::after { content:''; position:absolute; left:0; right:0; height:110px; z-index:2; pointer-events:none; }
  #gachaWindow::before { top:0; background:linear-gradient(#100a24, transparent); }
  #gachaWindow::after { bottom:0; background:linear-gradient(transparent, #100a24); }
  #gachaCenterLine { position:absolute; left:6px; right:6px; top:136px; height:68px; border-radius:8px;
    box-shadow:0 0 0 2px rgba(255,255,255,.6) inset, 0 0 18px rgba(255,255,255,.3); z-index:3; pointer-events:none; }
  #gachaReel { position:relative; will-change:transform; }
  .reelItem { height:68px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .reelItem .reelName { font-size:16px; font-weight:900; text-shadow:0 2px 6px rgba(0,0,0,.6); transition:transform .1s ease; }
  .reelItem .reelProb { font-size:10px; font-weight:700; opacity:.7; color:#fff; }
  .reelItem.tickFlash .reelName { transform:scale(1.15); }
  .reelItem.winner { animation:winnerPop .5s ease; }
  @keyframes winnerPop { 0%{ transform:scale(1); } 45%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
  /* reelItem 등급별 색상도 AURA_TIERS로부터 동적으로 생성되어 주입됨 */

  /* ===== 아우라 도감 ===== */
  #dexBtn { position:absolute; top:66px; left:14px; padding:8px 12px; border-radius:20px;
    background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.5); pointer-events:auto;
    color:#fff; font-size:11px; font-weight:700; font-family:inherit; cursor:pointer; }
  #dexBtn:active { background:rgba(255,255,255,.25); }

  /* ===== 물약 상점 / 인벤토리 버튼 ===== */
  #shopBtn, #invBtn { position:absolute; left:14px; padding:8px 12px; border-radius:20px;
    background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.5); pointer-events:auto;
    color:#fff; font-size:11px; font-weight:700; font-family:inherit; cursor:pointer; }
  #shopBtn { top:110px; }
  #invBtn { top:154px; }
  #shopBtn:active, #invBtn:active { background:rgba(255,255,255,.25); }
  #invBtn .invBadgeDot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#ffd700; margin-left:4px; box-shadow:0 0 6px #ffd700; vertical-align:middle; }

  #dexOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); z-index:50; pointer-events:auto; transition:background .3s ease; }
  #dexOverlay.show { background:rgba(0,0,0,.78); }
  #dexPanel { width:min(94vw, 420px); max-height:82vh; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#241a44,#100a24); border:2px solid rgba(255,255,255,.25);
    border-radius:18px; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.6);
    transform:scale(.9); opacity:0; transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .25s ease; }
  #dexOverlay.show #dexPanel { transform:scale(1); opacity:1; }
  #dexHeader { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  #dexTitle { color:#fff; font-size:14px; font-weight:800; letter-spacing:1px; }
  #dexCloseBtn { width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.1); color:#fff; font-size:14px; font-family:inherit; cursor:pointer; pointer-events:auto; }
  #dexProgress { color:#fff; font-size:11px; opacity:.7; text-align:center; margin-bottom:10px; }
  #dexGrid { overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:14px; padding-right:2px; pointer-events:auto; }
  .dexTierLabel { font-size:11px; font-weight:800; letter-spacing:1px; margin-bottom:6px; }
  .dexTierItems { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .dexCard { position:relative; border-radius:12px; padding:10px 4px 12px; text-align:center;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); cursor:pointer; }
  .dexCard.locked { opacity:.5; cursor:default; }
  .dexCard .dexSwatch { width:26px; height:26px; border-radius:50%; margin:0 auto; }
  .dexCard .dexName { font-size:11px; font-weight:800; margin-top:5px; color:#fff; }
  .dexCard .dexProb { font-size:9px; opacity:.65; margin-top:2px; color:#fff; }
  .dexCard .dexTrait { font-size:9px; opacity:.85; margin-top:2px; color:#8CFFA0; font-weight:700; }
  .dexCard .dexCount { position:absolute; top:4px; right:6px; font-size:9px; opacity:.6; color:#fff; }
  .dexCard.equipped { border-color:#fff; box-shadow:0 0 0 2px #fff, 0 0 14px rgba(255,255,255,.6); }
  .dexCard.equipped::after { content:'착용중'; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
    font-size:8px; background:#fff; color:#111; padding:1px 6px; border-radius:8px; font-weight:800; white-space:nowrap; }
  /* dexCard 스와치 색상도 AURA_TIERS로부터 동적으로 생성되어 주입됨 */
  .dexCard.locked .dexSwatch { background:#333 !important; }

  /* ===== 물약 상점 / 인벤토리 (도감과 별개의 UI) ===== */
  #shopOverlay, #invOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); z-index:50; pointer-events:auto; transition:background .3s ease; }
  #shopOverlay.show, #invOverlay.show { background:rgba(0,0,0,.78); }
  #shopPanel, #invPanel { width:min(94vw, 420px); max-height:82vh; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#241a44,#100a24); border:2px solid rgba(255,255,255,.25);
    border-radius:18px; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.6);
    transform:scale(.9); opacity:0; transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .25s ease; }
  #shopOverlay.show #shopPanel, #invOverlay.show #invPanel { transform:scale(1); opacity:1; }
  .panelHeader { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .panelTitle { color:#fff; font-size:14px; font-weight:800; letter-spacing:1px; }
  .panelCloseBtn { width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.1); color:#fff; font-size:14px; font-family:inherit; cursor:pointer; pointer-events:auto; }

  .potionIcon { width:34px; height:34px; border-radius:50%; flex:none; }
  .potionIcon.kind-luck  { background:radial-gradient(circle at 35% 30%, #baffc9, #1fae5c); }
  .potionIcon.kind-speed { background:radial-gradient(circle at 35% 30%, #b9e4ff, #1e78d6); }
  .potionIcon.kind-godly { background:conic-gradient(from 0deg, #ffd700, #ff5ecb, #66e0ff, #ffd700); box-shadow:0 0 10px rgba(255,215,0,.8); }

  #shopList { overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:10px; pointer-events:auto; }
  .shopItem { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:10px; }
  .shopItem.godly { border-color:#ffd700; box-shadow:0 0 14px rgba(255,215,0,.35); }
  .shopItem .shopInfo { flex:1; min-width:0; }
  .shopItem .shopName { font-size:12px; font-weight:800; color:#fff; }
  .shopItem .shopDesc { font-size:10px; opacity:.7; color:#fff; margin-top:2px; }
  .shopItem .shopBuyBtn { flex:none; padding:7px 10px; border-radius:10px; border:none;
    background:#2ecc71; color:#08351d; font-weight:800; font-size:11px; font-family:inherit; cursor:pointer; }
  .shopItem .shopBuyBtn:active { transform:scale(.94); }

  #invEmpty { color:#fff; opacity:.6; font-size:12px; text-align:center; padding:26px 0; }
  #invGrid { overflow-y:auto; -webkit-overflow-scrolling:touch; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; pointer-events:auto; }
  .invCard { position:relative; border-radius:12px; padding:10px 4px 8px; text-align:center;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); cursor:pointer; }
  .invCard.godly { border-color:#ffd700; box-shadow:0 0 14px rgba(255,215,0,.4); }
  .invCard .potionIcon { margin:0 auto; }
  .invCard .invName { font-size:10.5px; font-weight:800; margin-top:5px; color:#fff; }
  .invCard .invCount { position:absolute; top:4px; right:6px; font-size:9px; opacity:.7; color:#fff; }
  .invCard .invUseHint { font-size:8px; opacity:.55; margin-top:2px; color:#fff; }
  .invCard:active { transform:scale(.95); }

  /* 물약 효과 지속시간 상태 배지 */
  #potionStatus { position:absolute; top:100px; left:50%; transform:translateX(-50%); display:none;
    flex-direction:column; gap:4px; align-items:center; pointer-events:none; }
  .potionStatusRow { padding:4px 10px; border-radius:14px; background:rgba(0,0,0,.5);
    color:#fff; font-size:10px; font-weight:700; white-space:nowrap; text-shadow:0 1px 3px rgba(0,0,0,.6); }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud">
  <div id="title">아우라 배틀</div>
  <div id="hint">왼쪽 조이스틱: 이동 · 오른쪽 화면 드래그: 카메라 · G: 뽑기 · B: 도감 · P: 상점 · I: 인벤토리</div>

  <button id="lockBtn" type="button" title="시점고정(Shift Lock)"><span id="lockIcon">🔓</span></button>
  <button id="dexBtn" type="button">📖 도감</button>
  <button id="shopBtn" type="button">🛒 상점</button>
  <button id="invBtn" type="button">🎒 인벤토리<span id="invBadgeDot" class="invBadgeDot" style="display:none;"></span></button>
  <div id="speedTag">걷기</div>
  <div id="potionStatus"></div>

  <div id="joyZone">
    <div id="joyBase"><div id="joyStick"></div></div>
  </div>
  <div id="camZone"></div>
  <div id="jumpBtn">점프</div>

  <button id="gachaBtn" type="button"><span class="dice">🎲</span><span>뽑기</span></button>
  <div id="auraBadge"></div>
</div>

<div id="crosshair"></div>
<div id="auraTag"></div>

<div id="gachaOverlay">
  <div id="gachaPanel">
    <div id="gachaTitle">✦ AURA GACHA ✦</div>
    <div id="gachaWindow">
      <div id="gachaReel"></div>
      <div id="gachaCenterLine"></div>
    </div>
  </div>
</div>

<div id="multOverlay"><div id="multText">10x!</div></div>

<div id="dexOverlay">
  <div id="dexPanel">
    <div id="dexHeader">
      <div id="dexTitle">✦ 아우라 도감 ✦</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
  // ---------- 터치 기기 감지: 터치가 인식되면 조이스틱/점프/시점고정 클러스터 표시 ----------
  const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0;
  if (isTouchDevice) document.body.classList.add('has-touch');

  // ---------- Scene setup ----------
  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd3f4);
  scene.fog = new THREE.Fog(0x8fd3f4, 40, 140);

  const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 500);

  // ---------- Bloom 후처리 ----------
  const composer = new THREE.EffectComposer(renderer);
  const renderPass = new THREE.RenderPass(scene, camera);
  composer.addPass(renderPass);
  const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.05, 0.45, 0.88);
  composer.addPass(bloomPass);

  function resize(){
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    composer.setSize(window.innerWidth, window.innerHeight);
    bloomPass.resolution.set(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Lights ----------
  const hemi = new THREE.HemisphereLight(0xffffff, 0x6b8e5a, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff4dd, 1.1);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096,4096);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.03;
  sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
  sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
  sun.shadow.camera.far = 150;
  scene.add(sun);

  // ---------- 잔디 섬 ----------
  scene.fog = new THREE.Fog(0x9fd3ff, 60, 220);
  scene.background = new THREE.Color(0x9fd3ff);

  function makeGrassTexture(){
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#4CA84A'; ctx.fillRect(0,0,512,512);
    // 큰 얼룩으로 명암 베이스 (지형 느낌)
    for (let i=0; i<300; i++){
      const x = Math.random()*512, y = Math.random()*512;
      const r = 14 + Math.random()*30;
      ctx.fillStyle = Math.random() < 0.5
        ? `rgba(58,140,55,${0.10+Math.random()*0.1})`
        : `rgba(120,190,80,${0.08+Math.random()*0.1})`;
      ctx.beginPath(); ctx.ellipse(x,y,r,r*0.65,Math.random()*Math.PI,0,Math.PI*2); ctx.fill();
    }
    // 짧은 풀잎 붓터치를 빽빽하게 그려서 "들판에 촘촘한 잔디" 느낌을 텍스처 자체에 표현
    const bladeColors = ['#3E8F3E','#5CB85C','#347A34','#6FC96A','#4AA34A'];
    for (let i=0; i<5000; i++){
      const x = Math.random()*512, y = Math.random()*512;
      const len = 4 + Math.random()*7;
      const ang = -Math.PI/2 + (Math.random()-0.5)*1.1; // 대체로 위쪽을 향하되 살짝 흩어짐
      ctx.strokeStyle = bladeColors[(Math.random()*bladeColors.length)|0];
      ctx.globalAlpha = 0.55 + Math.random()*0.35;
      ctx.lineWidth = 1 + Math.random()*1.2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(
        x + Math.cos(ang)*len*0.5 + (Math.random()-0.5)*3, y + Math.sin(ang)*len*0.5,
        x + Math.cos(ang)*len, y + Math.sin(ang)*len
      );
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(14, 14);
    return tex;
  }

  function makeDirtTexture(){
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#7a5a3a'; ctx.fillRect(0,0,256,128);
    for (let i=0; i<600; i++){
      const x = Math.random()*256, y = Math.random()*128;
      ctx.fillStyle = Math.random()<0.5 ? 'rgba(60,42,26,0.3)' : 'rgba(140,105,70,0.25)';
      ctx.fillRect(x, y, 3+Math.random()*4, 2+Math.random()*3);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(12, 2);
    return tex;
  }

  const platformMeshes = [];
  const colliders = []; // 정밀 박스 충돌용 (표시되는 크기 그대로, 여분 히트박스 없음)

  const ISLAND_RADIUS = 30;
  const ISLAND_DEPTH = 5;

  // 섬 윗면(잔디, 살짝 울퉁불퉁하게 정점을 랜덤 변위)
  {
    const geo = new THREE.CircleGeometry(ISLAND_RADIUS, 96, 0, Math.PI*2);
    geo.rotateX(-Math.PI/2);
    const pos = geo.attributes.position;
    for (let i=0; i<pos.count; i++){
      const x = pos.getX(i), z = pos.getZ(i);
      const distRatio = Math.min(1, Math.hypot(x,z)/ISLAND_RADIUS);
      // 가장자리로 갈수록 변위를 줄여서 경계는 매끈하게, 안쪽은 울퉁불퉁하게
      const bump = (Math.sin(x*0.6)*Math.cos(z*0.55) + Math.sin(x*1.3+z*0.7)*0.5) * 0.22 * (1-distRatio*0.6);
      pos.setY(i, bump);
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: makeGrassTexture(), roughness:1 }));
    mesh.receiveShadow = true; mesh.castShadow = false;
    scene.add(mesh);
    platformMeshes.push(mesh);
  }

  // 섬 옆면/아랫면(흙 덩어리, 원기둥으로 두께감)
  {
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(ISLAND_RADIUS, ISLAND_RADIUS*0.82, ISLAND_DEPTH, 48, 1, true),
      new THREE.MeshStandardMaterial({ map: makeDirtTexture(), roughness:1, side: THREE.DoubleSide })
    );
    mesh.position.set(0, -ISLAND_DEPTH/2, 0);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    platformMeshes.push(mesh);
    // 바닥 마개
    const bottomCap = new THREE.Mesh(
      new THREE.CircleGeometry(ISLAND_RADIUS*0.82, 48),
      new THREE.MeshStandardMaterial({ map: makeDirtTexture(), roughness:1 })
    );
    bottomCap.rotation.x = Math.PI/2;
    bottomCap.position.set(0, -ISLAND_DEPTH, 0);
    scene.add(bottomCap);
  }

  // 풀 디테일: 짧고 촘촘한 "얕은 잔디" 레이어 + 가끔 튀어나온 "긴 풀" 레이어, 짙은 초록 포함해서 색 다양화
  function scatterGrass(count, coneRadius, coneHeight, shades, heightJitter){
    const geo = new THREE.ConeGeometry(coneRadius, coneHeight, 3);
    geo.translate(0, coneHeight/2, 0);
    const dummy = new THREE.Object3D();
    shades.forEach(color=>{
      const n = Math.floor(count / shades.length);
      const mat = new THREE.MeshStandardMaterial({ color, roughness:0.9 });
      const instances = new THREE.InstancedMesh(geo, mat, n);
      for (let i=0; i<n; i++){
        const ang = Math.random()*Math.PI*2;
        const r = Math.sqrt(Math.random()) * (ISLAND_RADIUS - 1.2);
        const x = Math.cos(ang)*r, z = Math.sin(ang)*r;
        const bump = (Math.sin(x*0.6)*Math.cos(z*0.55) + Math.sin(x*1.3+z*0.7)*0.5) * 0.22 * (1-Math.min(1,r/ISLAND_RADIUS)*0.6);
        dummy.position.set(x, bump, z);
        dummy.rotation.y = Math.random()*Math.PI*2;
        dummy.rotation.z = (Math.random()-0.5)*0.3;
        const s = 1 - heightJitter/2 + Math.random()*heightJitter;
        dummy.scale.set(s, s*(0.8+Math.random()*0.6), s);
        dummy.updateMatrix();
        instances.setMatrixAt(i, dummy.matrix);
      }
      instances.castShadow = true;
      scene.add(instances);
    });
  }
  // 짧고 촘촘한 얕은 잔디 (더 짙은 톤 포함, 밀도 높게)
  scatterGrass(2600, 0.05, 0.28, [0x2E6B30, 0x3E9A44, 0x4CB050, 0x347F3C], 0.7);
  // 가끔 삐죽 튀어나오는 긴 풀 (성기게, 눈에 띄게 길게)
  scatterGrass(220, 0.07, 0.8, [0x3E9A44, 0x4CB050, 0x2A5F2C], 0.9);

  // 섬은 원형이라 사각 콜라이더 대신 findLanding에서 반지름 기반으로 직접 판정함 (아래 ISLAND_RADIUS 참조)

  // 스폰 지점 (초록 정사각형 마커)
  const SPAWN = { x:0, y:0.05, z:0, w:5, h:0.1, d:5 };
  {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(SPAWN.w, SPAWN.h, SPAWN.d),
      new THREE.MeshStandardMaterial({ color:0x3DBB4C, roughness:0.7 })
    );
    mesh.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
    mesh.receiveShadow = true;
    scene.add(mesh);
  }

  const START_POS = new THREE.Vector3(SPAWN.x, 0.1, SPAWN.z);
  let respawnPos = START_POS.clone();
  const VOID_Y = -25; // 이 아래로 떨어지면 리스폰(섬 밖으로 나가면 낭떠러지)


  // 트러스 없음(빈 목록) - 나중에 필요하면 buildTruss로 추가 가능
  const TRUSS_LIST = [];
  function getActiveTruss(x, z, y, sticky){
    const enterReach = 0.2 + CHAR_HALF_W;
    for (const t of TRUSS_LIST){
      const reach = (sticky === t) ? enterReach + 0.15 : enterReach;
      if (x > t.bounds.minX - reach && x < t.bounds.maxX + reach &&
          z > t.bounds.minZ - reach && z < t.bounds.maxZ + reach &&
          y > t.bounds.minY - 0.3 && y < t.bounds.maxY + 0.3){
        return t;
      }
    }
    return null;
  }

  // ---------- Character (classic R6 avatar proportions & colors) ----------
  const character = new THREE.Group();
  const STUD = 0.62; // 씬 스케일 환산 단위
  const headColor  = 0xF5CD30; // R6 기본 헤드(밝은 노랑)
  const torsoColor = 0x0B62C4; // R6 기본 몸통(밝은 파랑)
  const armColor   = 0xF5CD30; // R6 기본 팔(밝은 노랑)
  const legColor   = 0x287F35; // R6 기본 다리(밝은 초록)

  const LEG_W = 1*STUD, LEG_H = 2*STUD, LEG_D = 1*STUD;
  const TORSO_W = 2*STUD, TORSO_H = 2*STUD, TORSO_D = 1*STUD;
  const HEAD_W = 2*STUD, HEAD_H = 1*STUD, HEAD_D = 1*STUD;
  const ARM_W = 1*STUD, ARM_H = 2*STUD, ARM_D = 1*STUD;

  const legTopY = LEG_H;                          // 다리 상단(엉덩이 관절) 높이
  const torsoCenterY = legTopY + TORSO_H/2;        // 몸통 중심 높이
  const headCenterY = legTopY + TORSO_H + HEAD_H/2;// 머리 중심 높이
  const shoulderY = legTopY + TORSO_H - ARM_H*0.08;// 어깨 관절 높이

  const HEAD_R = STUD*0.62; // (다리/구 계산에 쓰이던 기존 값, 위치 계산용으로 유지)

  const torso = new THREE.Mesh(new THREE.BoxGeometry(TORSO_W, TORSO_H, TORSO_D), new THREE.MeshStandardMaterial({color:torsoColor}));
  torso.position.y = torsoCenterY;
  torso.castShadow = true;
  character.add(torso);

  // 모서리가 둥근 사각 머리(로블록스 클래식 헤드 실루엣) - Shape+Extrude로 라운드 코너 구현
  function roundedRectShape(w, h, r){
    const s = new THREE.Shape();
    const x = -w/2, y = -h/2;
    s.moveTo(x, y+r);
    s.lineTo(x, y+h-r);
    s.quadraticCurveTo(x, y+h, x+r, y+h);
    s.lineTo(x+w-r, y+h);
    s.quadraticCurveTo(x+w, y+h, x+w, y+h-r);
    s.lineTo(x+w, y+r);
    s.quadraticCurveTo(x+w, y, x+w-r, y);
    s.lineTo(x+r, y);
    s.quadraticCurveTo(x, y, x, y+r);
    return s;
  }
  const HEAD_W2 = HEAD_W*0.9, HEAD_H2 = HEAD_H*1.5, HEAD_D2 = HEAD_D*0.9;
  const headShape = roundedRectShape(HEAD_W2, HEAD_H2, HEAD_W2*0.32);
  const headGeo = new THREE.ExtrudeGeometry(headShape, { depth: HEAD_D2, bevelEnabled:true, bevelThickness:HEAD_W2*0.12, bevelSize:HEAD_W2*0.12, bevelSegments:5, curveSegments:10 });
  headGeo.translate(0, 0, -HEAD_D2/2);
  const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({color:headColor, roughness:0.6}));
  head.position.y = legTopY + TORSO_H + HEAD_H2/2;
  head.castShadow = true;
  character.add(head);

  // 얼굴 데칼(눈+웃는입) - 캔버스 텍스처를 머리 앞면에 살짝 띄워서 부착
  const faceCanvas = document.createElement('canvas');
  faceCanvas.width = 128; faceCanvas.height = 128;
  const fctx = faceCanvas.getContext('2d');
  fctx.clearRect(0,0,128,128);
  fctx.fillStyle = '#1a1a1a';
  // 눈 (짧은 세로 막대 두 개)
  fctx.beginPath(); fctx.roundRect(38,46,8,20,4); fctx.fill();
  fctx.beginPath(); fctx.roundRect(82,46,8,20,4); fctx.fill();
  // 웃는 입 (아래로 볼록한 브이자 곡선)
  fctx.lineWidth = 7;
  fctx.lineCap = 'round';
  fctx.strokeStyle = '#1a1a1a';
  fctx.beginPath();
  fctx.moveTo(46, 82);
  fctx.quadraticCurveTo(64, 104, 82, 82);
  fctx.stroke();
  const faceTex = new THREE.CanvasTexture(faceCanvas);
  const facePlane = new THREE.Mesh(
    new THREE.PlaneGeometry(HEAD_W2*0.78, HEAD_H2*0.62),
    new THREE.MeshBasicMaterial({ map:faceTex, transparent:true })
  );
  facePlane.position.set(0, head.position.y - HEAD_H2*0.06, HEAD_D2/2 + 0.02);
  character.add(facePlane);

  function makeLimb(color, w,h,d){
    const g = new THREE.Group();
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color}));
    mesh.position.y = -h/2;
    mesh.castShadow = true;
    g.add(mesh);
    return g;
  }

  const armL = makeLimb(armColor, ARM_W, ARM_H, ARM_D);
  armL.position.set(-(TORSO_W/2 + ARM_W/2), shoulderY, 0);
  const armR = makeLimb(armColor, ARM_W, ARM_H, ARM_D);
  armR.position.set(TORSO_W/2 + ARM_W/2, shoulderY, 0);
  character.add(armL, armR);

  const legL = makeLimb(legColor, LEG_W, LEG_H, LEG_D);
  legL.position.set(-LEG_W/2, legTopY, 0);
  const legR = makeLimb(legColor, LEG_W, LEG_H, LEG_D);
  legR.position.set(LEG_W/2, legTopY, 0);
  character.add(legL, legR);

  // ground contact shadow blob
  const shadowBlob = new THREE.Mesh(
    new THREE.CircleGeometry(0.7,24),
    new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.28})
  );
  shadowBlob.rotation.x = -Math.PI/2;
  shadowBlob.position.y = 0.02;
  scene.add(shadowBlob);

  character.position.set(0, 0, 0);
  scene.add(character);

  // ---------- Camera rig (Roblox-style orbit follow) ----------
  let rawYaw = 0;          // 드래그로 즉시 갱신되는 목표 각도
  let rawPitch = 0.35;
  let camYaw = 0;          // 실제 렌더/이동 계산에 쓰이는 각도(시프트락 아닐 때만 부드럽게 따라감)
  let camPitch = 0.35;
  let camDist = 7.5;
  const CAM_PITCH_MIN = -0.1, CAM_PITCH_MAX = 1.15;

  let shiftLock = false;
  const camRaycaster = new THREE.Raycaster();
  const collidableMeshes = platformMeshes;

  // ---------- Movement state ----------
  const pos = START_POS.clone();
  let velY = 0;
  let grounded = true;
  let facing = 0; // character yaw
  const WALK_SPEED = 10.5;
  const GRAVITY = -133;   // 로블록스 실제 중력(196.2 studs/s²)을 캐릭터 스케일에 맞게 환산
  const JUMP_VEL = 34.46; // 순수 점프 높이가 정확히 공식 수치(Humanoid.JumpHeight 기본값 7.2 studs)가 되도록 역산한 값

  let moveVec = new THREE.Vector2(0,0); // joystick input, x=right, y=forward(-1..1)
  let curSpeed = new THREE.Vector2(0,0); // smoothed velocity for accel/decel ramp
  let finished = false;
  let mountFacing = 0;   // 트러스에 올라탄 순간의 접근 방향(그 방향을 계속 바라봄)
  let wasClimbing = false;
  let currentTruss = null; // 지금 붙어있는(또는 마지막으로 붙어있던) 트러스 객체
  let onTruss = false;         // onJumpPress에서도 참조 (트러스 위에서는 점프 동작이 달라짐)
  let trussExitCooldown = 0;   // 트러스에서 점프로 이탈한 직후 잠깐 재부착 방지
  let jumpHeld = false;        // 스페이스/점프버튼을 누르고 있는 동안 계속 점프(연속 점프)
  let coyoteTimer = 0;         // 가장자리를 벗어난 직후 잠깐(코요테 타임) 동안은 여전히 점프 가능
  let wallJumpCooldown = 0;    // 벽점프 연타로 무한 더블점프처럼 되는 것 방지
  let jumpBufferTimer = 0;     // 착지 직전에 눌러도 착지 순간 바로 점프되도록 하는 버퍼
  let mantling = false;        // 가까스로 턱에 손이 닿아 매달려 올라가는 중
  let mantleTimer = 0;
  const mantleStartPos = new THREE.Vector3();
  const mantleEndPos = new THREE.Vector3();

  // ---------- Joystick ----------
  const joyZone = document.getElementById('joyZone');
  const joyBase = document.getElementById('joyBase');
  const joyStick = document.getElementById('joyStick');
  let joyTouchId = null;
  let joyCenter = {x:0,y:0};
  const JOY_RADIUS = 55;

  function joyStart(x,y,id){
    joyTouchId = id;
    joyCenter = {x,y};
    joyBase.style.display = 'block';
    joyBase.style.left = (x-55)+'px';
    joyBase.style.top = (y-55)+'px';
    joyStick.style.left = '31px';
    joyStick.style.top = '31px';
  }
  function joyMove(x,y){
    let dx = x - joyCenter.x, dy = y - joyCenter.y;
    const dist = Math.min(Math.hypot(dx,dy), JOY_RADIUS);
    const ang = Math.atan2(dy,dx);
    dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
    joyStick.style.left = (55+dx-24)+'px';
    joyStick.style.top = (55+dy-24)+'px';
    moveVec.x = dx / JOY_RADIUS;
    moveVec.y = dy / JOY_RADIUS; // positive = down/back on screen
  }
  function joyEnd(){
    joyTouchId = null;
    joyBase.style.display = 'none';
    moveVec.set(0,0);
  }

  joyZone.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t = e.changedTouches[0];
    joyStart(t.clientX, t.clientY, t.identifier);
  }, {passive:false});
  joyZone.addEventListener('touchmove', e=>{
    e.preventDefault();
    for (const t of e.changedTouches){
      if (t.identifier === joyTouchId) joyMove(t.clientX, t.clientY);
    }
  }, {passive:false});
  joyZone.addEventListener('touchend', e=>{
    for (const t of e.changedTouches){
      if (t.identifier === joyTouchId) joyEnd();
    }
  });
  joyZone.addEventListener('touchcancel', joyEnd);

  // 개별 존에서 touchend/touchcancel이 유실될 경우를 대비한 전역 안전망
  // (조이스틱이 마지막 입력 방향에 그대로 고정되어 계속 한쪽으로 이동하는 버그 방지)
  window.addEventListener('touchend', e=>{
    for (const t of e.changedTouches){
      if (t.identifier === joyTouchId) joyEnd();
      if (t.identifier === camTouchId) camTouchId = null;
    }
  });
  window.addEventListener('touchcancel', e=>{
    for (const t of e.changedTouches){
      if (t.identifier === joyTouchId) joyEnd();
      if (t.identifier === camTouchId) camTouchId = null;
    }
  });
  // 창/탭이 포커스를 잃으면 모든 입력을 강제로 초기화
  window.addEventListener('blur', ()=>{
    joyEnd();
    camTouchId = null;
    mouseJoyActive = false;
    jumpHeld = false;
    jumpBufferTimer = 0;
    for (const k in keys) keys[k] = false;
  });

  // mouse fallback (desktop testing)
  let mouseJoyActive = false;
  joyZone.addEventListener('mousedown', e=>{ mouseJoyActive = true; joyStart(e.clientX, e.clientY, 'mouse'); });
  window.addEventListener('mousemove', e=>{ if (mouseJoyActive) joyMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', ()=>{ if (mouseJoyActive){ mouseJoyActive=false; joyEnd(); } });

  // ---------- Camera drag zone ----------
  const camZone = document.getElementById('camZone');
  let camTouchId = null;
  let lastCamPos = {x:0,y:0};

  function camDragStart(x,y,id){
    camTouchId = id;
    lastCamPos = {x,y};
  }
  function camDragMove(x,y){
    const dx = x - lastCamPos.x;
    const dy = y - lastCamPos.y;
    lastCamPos = {x,y};
    rawYaw -= dx * 0.006;
    rawPitch += dy * 0.0035; // 상하는 원래 잘 안 만지는 축이라 좌우보다 살짝 둔감하게
    rawPitch = Math.max(CAM_PITCH_MIN, Math.min(CAM_PITCH_MAX, rawPitch));
  }
  camZone.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t = e.changedTouches[0];
    camDragStart(t.clientX, t.clientY, t.identifier);
  }, {passive:false});
  camZone.addEventListener('touchmove', e=>{
    e.preventDefault();
    for (const t of e.changedTouches){
      if (t.identifier === camTouchId) camDragMove(t.clientX, t.clientY);
    }
  }, {passive:false});
  camZone.addEventListener('touchend', e=>{
    for (const t of e.changedTouches){
      if (t.identifier === camTouchId) camTouchId = null;
    }
  });

  // ---------- PC: 포인터락으로 무한 마우스룩 (커서는 Esc 누르기 전까지 완전히 숨겨짐) ----------
  // 브라우저 정책상 포인터락은 반드시 사용자 동작(클릭/키입력) 이후에만 걸 수 있어서,
  // 첫 상호작용 시 자동으로 잠금을 시도함(이후엔 별도 클릭 없이 계속 잠긴 상태 유지)
  let lastLockAttempt = 0;
  function tryLock(e){
    if (e && e.repeat) return; // 키를 누르고 있을 때(반복 입력)마다 재시도하지 않음 - 버벅임 원인
    if (document.pointerLockElement === canvas || !canvas.requestPointerLock) return;
    const now = performance.now();
    if (now - lastLockAttempt < 800) return; // 짧은 간격으로 반복 요청하지 않게 디바운스
    lastLockAttempt = now;
    canvas.requestPointerLock();
  }
  function isUITarget(el){
    return !!(el && el.closest && el.closest('#gachaBtn, #lockBtn, #jumpBtn, #gachaOverlay, #dexBtn, #dexOverlay, #shopBtn, #shopOverlay, #invBtn, #invOverlay'));
  }
  window.addEventListener('mousedown', e=>{
    if (isUITarget(e.target)){
      // UI 버튼 클릭은 카메라 잠금을 걸지 않음 (걸려있었다면 즉시 풀어서 커서를 되돌려줌)
      if (document.pointerLockElement === canvas) document.exitPointerLock();
      return;
    }
    tryLock(e);
  });
  window.addEventListener('keydown', tryLock);
  window.addEventListener('touchstart', tryLock, {passive:true});
  document.addEventListener('pointerlockchange', ()=>{
    // Esc 등으로 잠금이 풀리면, 다음 상호작용에서 다시 자동으로 잠기도록 그대로 둠(이미 리스너 등록됨)
  });

  window.addEventListener('mousemove', e=>{
    if (document.pointerLockElement !== canvas) return; // 잠겨있을 때만 회전 (무한 회전 보장)
    rawYaw -= e.movementX * 0.0026;
    rawPitch += e.movementY * 0.0016; // 상하는 좌우보다 둔감하게
    rawPitch = Math.max(CAM_PITCH_MIN, Math.min(CAM_PITCH_MAX, rawPitch));
  });

  // ---------- Jump button ----------
  const jumpBtn = document.getElementById('jumpBtn');
  function onJumpPress(e){
    if (e) e.preventDefault();
    if (onTruss){
      // 트러스에서 점프로 깔끔하게 이탈 (매달린 반대 방향으로 살짝 밀려나며 떨어짐, 재부착 쿨다운)
      velY = JUMP_VEL * 0.5;
      grounded = false;
      trussExitCooldown = 0.4;
      pos.x -= Math.sin(mountFacing) * 0.9;
      pos.z -= Math.cos(mountFacing) * 0.9;
      return;
    }
    jumpHeld = true;
    jumpBufferTimer = 0.15; // 착지 0.15초 전에 눌러도 착지하자마자 바로 점프됨
    if (grounded || coyoteTimer > 0){
      velY = JUMP_VEL * equippedJumpMult;
      grounded = false;
      jumpBufferTimer = 0;
      coyoteTimer = 0;
      return;
    }
    if (!mantling){
      // 벽점프: 벽 안쪽으로 미는 입력(오르려는 의도)이면 쿨다운 없이 계속 위로, 옆으로 빠지는 용도면 0.15초 쿨다운
      const wall = findAdjacentWall(pos.x, pos.z, pos.y);
      if (wall){
        const speedLen = Math.hypot(curSpeed.x, curSpeed.y);
        let intoWall = false;
        if (speedLen > 0.5){
          const dot = (curSpeed.x/speedLen)*(-wall.nx) + (curSpeed.y/speedLen)*(-wall.nz);
          intoWall = dot > 0.3;
        }
        if (intoWall || wallJumpCooldown <= 0){
          velY = JUMP_VEL * 0.55;
          const kick = WALK_SPEED * 0.3; // 벽에서 아주 살짝만 떨어짐(다시 붙기 쉽게)
          curSpeed.x = wall.nx * kick;
          curSpeed.y = wall.nz * kick;
          jumpBufferTimer = 0;
          if (!intoWall) wallJumpCooldown = 0.15; // 옆으로 빠지는 경우에만 쿨다운 부여
        }
      }
    }
  }
  function onJumpRelease(){ jumpHeld = false; }
  jumpBtn.addEventListener('touchstart', onJumpPress, {passive:false});
  jumpBtn.addEventListener('touchend', onJumpRelease);
  jumpBtn.addEventListener('touchcancel', onJumpRelease);
  jumpBtn.addEventListener('mousedown', onJumpPress);
  window.addEventListener('mouseup', onJumpRelease);

  // ---------- Shift lock toggle ----------
  const lockBtn = document.getElementById('lockBtn');
  const lockIcon = document.getElementById('lockIcon');
  lockBtn.addEventListener('click', ()=>{
    shiftLock = !shiftLock;
    lockBtn.classList.toggle('active', shiftLock);
    lockIcon.textContent = shiftLock ? '🔒' : '🔓';
  });

  // ---------- Keyboard fallback (desktop) ----------
  const keys = {};
  const MOVE_KEYS = ['Space','KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  window.addEventListener('keydown', e=>{
    if (MOVE_KEYS.includes(e.code)) e.preventDefault(); // 브라우저 기본 스크롤 등 개입 차단(스페이스 반응 지연 원인)
    keys[e.code] = true;
    if (e.code === 'Space' && !e.repeat) onJumpPress(e);
    if (e.code === 'KeyG' && !e.repeat) runGacha(); // PC 단축키: 마우스가 카메라 잠금 중이어도 항상 뽑기 가능
    if (e.code === 'KeyB' && !e.repeat) toggleDex(); // PC 단축키: 도감 열기/닫기
    if (e.code === 'KeyP' && !e.repeat) toggleShop(); // PC 단축키: 물약 상점
    if (e.code === 'KeyI' && !e.repeat) toggleInventory(); // PC 단축키: 인벤토리
    if (e.code === 'Escape' && !e.repeat){
      if (dexOverlay.classList.contains('show')) closeDex();
      if (shopOverlay.classList.contains('show')) closeShop();
      if (invOverlay.classList.contains('show')) closeInventory();
      if (gachaOverlay.classList.contains('show') && !gachaSpinning) { gachaOverlay.classList.remove('show'); setTimeout(()=>{ gachaOverlay.style.display='none'; }, 300); }
    }
  });

  // ---------- 오비 정밀 충돌 (벽/착지/천장, 장애물은 보이는 크기 그대로 - 여분 히트박스 없음) ----------
  const CHAR_HALF_W = 0.42; // 캐릭터 자신의 물리적 반너비 (장애물 쪽엔 패딩 없음)
  const CHAR_HEIGHT = 3.0;  // 캐릭터 물리적 키(발~머리)

  function resolveWalls(p){
    for (const c of colliders){
      const withinY = (p.y + CHAR_HEIGHT > c.minY + 0.06) && (p.y < c.maxY - 0.06);
      if (!withinY) continue; // 위에 서있거나 완전히 아래/위에 있으면 벽 판정 제외
      const minX = c.minX - CHAR_HALF_W, maxX = c.maxX + CHAR_HALF_W;
      const minZ = c.minZ - CHAR_HALF_W, maxZ = c.maxZ + CHAR_HALF_W;
      if (p.x > minX && p.x < maxX && p.z > minZ && p.z < maxZ){
        const overlapX = Math.min(p.x-minX, maxX-p.x);
        const overlapZ = Math.min(p.z-minZ, maxZ-p.z);
        const cx = (c.minX+c.maxX)/2, cz = (c.minZ+c.maxZ)/2;
        if (overlapX < overlapZ){
          p.x += (p.x < cx ? -overlapX : overlapX);
        } else {
          p.z += (p.z < cz ? -overlapZ : overlapZ);
        }
      }
    }
  }

  // 벽점프용: 공중에서 옆 벽에 거의 맞닿아 있으면 감지해서 어느 방향으로 차고 나가야 할지 계산
  function findAdjacentWall(x, z, y){
    const pad = CHAR_HALF_W + 0.16;
    for (const c of colliders){
      const withinY = (y + CHAR_HEIGHT > c.minY + 0.06) && (y < c.maxY - 0.4);
      if (!withinY) continue;
      const nearX = x > c.minX - pad && x < c.maxX + pad;
      const nearZ = z > c.minZ - pad && z < c.maxZ + pad;
      if (!(nearX && nearZ)) continue;
      const overlapX = Math.min(x-(c.minX-pad), (c.maxX+pad)-x);
      const overlapZ = Math.min(z-(c.minZ-pad), (c.maxZ+pad)-z);
      const cx = (c.minX+c.maxX)/2, cz = (c.minZ+c.maxZ)/2;
      let nx = 0, nz = 0;
      if (overlapX < overlapZ) nx = (x < cx ? -1 : 1);
      else nz = (z < cz ? -1 : 1);
      return { nx, nz };
    }
    return null;
  }

  function findLanding(prevY, newY, x, z){
    let best = null;
    for (const c of colliders){
      const overlapXZ = (x > c.minX - CHAR_HALF_W && x < c.maxX + CHAR_HALF_W &&
                          z > c.minZ - CHAR_HALF_W && z < c.maxZ + CHAR_HALF_W);
      if (!overlapXZ) continue;
      if (prevY >= c.topY - 0.05 && newY <= c.topY + 0.3){
        if (!best || c.topY > best.topY) best = c;
      }
    }
    // 섬(원형) 바닥 - 시각적 잔디 경계(반지름)와 정확히 일치하는 원형 판정
    // type을 'normal'로 둬서 체크포인트 갱신 로직(좌표 없어 NaN 나던 버그)을 타지 않게 함 - 리스폰은 항상 고정 스폰 지점
    if (Math.hypot(x, z) < ISLAND_RADIUS + CHAR_HALF_W*0.3){
      if (prevY >= -0.05 && newY <= 0.3){
        if (!best || 0 > best.topY) best = { topY: 0, type: 'normal' };
      }
    }
    return best;
  }

  function findCeiling(prevY, newY, x, z, exclude){
    for (const c of colliders){
      if (c === exclude) continue;
      const overlapXZ = (x > c.minX - CHAR_HALF_W*0.6 && x < c.maxX + CHAR_HALF_W*0.6 &&
                          z > c.minZ - CHAR_HALF_W*0.6 && z < c.maxZ + CHAR_HALF_W*0.6);
      if (!overlapXZ) continue;
      const prevHead = prevY + CHAR_HEIGHT, newHead = newY + CHAR_HEIGHT;
      if (prevHead <= c.minY + 0.05 && newHead >= c.minY){
        return c;
      }
    }
    return null;
  }

  // 로블록스 공식 기본값: 점프 없이 자동으로 걸어 올라갈 수 있는 최대 높이 = 2.5 studs
  const STEP_HEIGHT = 2.5 * STUD;
  function tryStepUp(x, z, curY){
    let best = null;
    for (const c of colliders){
      const overlapXZ = (x > c.minX - CHAR_HALF_W && x < c.maxX + CHAR_HALF_W &&
                          z > c.minZ - CHAR_HALF_W && z < c.maxZ + CHAR_HALF_W);
      if (!overlapXZ) continue;
      const diff = c.topY - curY;
      if (diff > 0.06 && diff <= STEP_HEIGHT){
        if (best === null || c.topY > best) best = c.topY;
      }
    }
    return best;
  }

  // 맨틀(가까스로 매달려 올라가기): 오토스텝(2.5studs)보다 높지만, 점프해서 손이 닿는 턱을 붙잡고 기어오름
  const MANTLE_MIN = STEP_HEIGHT;
  const MANTLE_MAX = STEP_HEIGHT + 0.85; // 이 이상은 손도 안 닿아서 그냥 못 올라감 (점프+맨틀 합산 사기 방지로 축소)
  function tryMantle(x, z, curY){
    let best = null;
    for (const c of colliders){
      const overlapXZ = (x > c.minX - CHAR_HALF_W - 0.15 && x < c.maxX + CHAR_HALF_W + 0.15 &&
                          z > c.minZ - CHAR_HALF_W - 0.15 && z < c.maxZ + CHAR_HALF_W + 0.15);
      if (!overlapXZ) continue;
      const diff = c.topY - curY;
      if (diff > MANTLE_MIN && diff <= MANTLE_MAX){
        if (best === null || c.topY < best.topY) best = c; // 가장 가까운(낮은) 턱을 우선 붙잡음
      }
    }
    return best;
  }

  function weightedRandomAura(bonusMult){
    const lm = activeLuckMult() * (bonusMult || 1) * equippedLuckMult;
    // 럭 배율을 가중치에 단순히 곱하면(구버전) 등급 간 확률 차이가 수백만 배라 사실상 체감이 안 됨.
    // 대신 n(확률 분모)의 지수를 럭만큼 압축해서, 희귀 등급일수록 실질적으로 훨씬 크게 확률이 오르도록 함.
    let total = 0;
    const weights = AURA_LIST.map(a=>{
      const effectiveN = lm > 1 ? Math.pow(a.n, 1/lm) : a.n;
      const w = 1 / effectiveN;
      total += w;
      return w;
    });
    let r = Math.random() * total;
    for (let i=0; i<AURA_LIST.length; i++){
      r -= weights[i];
      if (r <= 0) return AURA_LIST[i];
    }
    return AURA_LIST[AURA_LIST.length - 1];
  }

  function rollMultiplierChain(){
    if (Math.random() >= MULT_TRIGGER_CHANCE) return 1;

  function makeGlowTexture(hex, hex2){
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    const col1 = hexStr(hex), col2 = hexStr(hex2 != null ? hex2 : hex);

    grad.addColorStop(0.32, col1 + 'dd');
    grad.addColorStop(0.68, col1 + '33');
    grad.addColorStop(1,    col1 + '00');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  }
  function makeRingTexture(hex){
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    const col = hexStr(hex);
    ctx.translate(128,128);
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.55 - i*0.15;
      ctx.lineWidth = 10 - i*2;
      ctx.arc(0,0, 96 - i*16, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    return new THREE.CanvasTexture(c);
  }

  // ---- 등 뒤 후광 모양을 테마별로 다르게: 각진 별/크리스탈 ----
  function makeStarShapeTexture(hex, points){
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    const col = hexStr(hex);
    ctx.translate(128,128);
    const n = points || 8;
    ctx.beginPath();
    for (let i=0;i<n*2;i++){
      const r = i%2===0 ? 100 : 40;
      const a = (i/(n*2))*Math.PI*2;
      const x = Math.cos(a)*r, y = Math.sin(a)*r;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    const grad = ctx.createRadialGradient(0,0,0,0,0,100);
    grad.addColorStop(0, col+'ff'); grad.addColorStop(0.6, col+'99'); grad.addColorStop(1, col+'00');
    ctx.fillStyle = grad;
    ctx.fill();
    return new THREE.CanvasTexture(c);
  }

  // ---- 성운(네뷸라)처럼 일렁이는 아우라 구름 텍스처 ----
  function makeNebulaTexture(hex, hex2, seed){
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    const col1 = hexStr(hex), col2 = hexStr(hex2 != null ? hex2 : hex);
    const colors = [col1, col2, col1, col2];
    let s = seed || 1;
    const rnd = () => { s = (s*9301 + 49297) % 233280; return s/233280; }; // 항상 같은 패턴을 만드는 시드 난수(텍스처 재사용 안정성)
    for (let i=0;i<8;i++){
      const cx = 40 + rnd()*176;
      const cy = 40 + rnd()*176;
      const r  = 36 + rnd()*74;
      const col = colors[i % colors.length];
      const g = ctx.createRadialGradient(cx,cy,0, cx,cy,r);
      g.addColorStop(0,   col + 'bb');
      g.addColorStop(0.45,col + '55');
      g.addColorStop(1,   col + '00');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fill();
    }
    return new THREE.CanvasTexture(c);
  }

    c.width = 128; c.height = 128;
    const ctx = c.getContext('2d');
    const col = hexStr(hex);
    ctx.translate(64,64);
    ctx.rotate(Math.PI/4);
    const grad = ctx.createLinearGradient(-40,-40,40,40);
    grad.addColorStop(0, col+'00');
    grad.addColorStop(0.5, col+'ee');
    grad.addColorStop(1, col+'00');
    ctx.fillStyle = grad;
    ctx.fillRect(-6,-40,12,80);
    ctx.fillRect(-40,-6,80,12);
    return new THREE.CanvasTexture(c);
  }

  // ---- 아우라 장착 시 배경/안개/조명까지 침식되는 환경 연출 (등급 비례 디머 + 최상위는 색상까지 물듦) ----
  const DEFAULT_SKY_COLOR = new THREE.Color(0x9fd3ff);
  const DEFAULT_FOG_COLOR = new THREE.Color(0x9fd3ff);
  const DEFAULT_HEMI_SKY = new THREE.Color(0xffffff);
  const DEFAULT_HEMI_INTENSITY = 0.9;
  const DEFAULT_SUN_INTENSITY = 1.1;
  const ENV_SHIFT_TIER_ORDER = 18; // 이 등급(order) 이상부터 배경색까지 물듦
  let envShiftTarget = {
    sky: DEFAULT_SKY_COLOR.clone(), fog: DEFAULT_FOG_COLOR.clone(), hemi: DEFAULT_HEMI_SKY.clone(),
    hemiIntensity: DEFAULT_HEMI_INTENSITY, sunIntensity: DEFAULT_SUN_INTENSITY, active:false
  };
  function applyEnvironmentForAura(aura){
    const tier = AURA_TIERS[aura.tier];
    const sf = tierScaleFactor(tier.order);
    // 등급이 높을수록 주변이 어두워지며 캐릭터만 스포트라이트처럼 돋보이는 디머 (모든 등급에 연속 적용)
    const dimFactor = 1 - sf*0.6;
    if (tier.order >= ENV_SHIFT_TIER_ORDER){
      const c = new THREE.Color(tier.color2 != null ? tier.color2 : tier.color);
      envShiftTarget = {
        sky: DEFAULT_SKY_COLOR.clone().lerp(c, 0.55),
        fog: DEFAULT_FOG_COLOR.clone().lerp(c, 0.7),
        hemi: DEFAULT_HEMI_SKY.clone().lerp(c, 0.5),
        hemiIntensity: DEFAULT_HEMI_INTENSITY*dimFactor,
        sunIntensity: DEFAULT_SUN_INTENSITY*dimFactor,
        active:true
      };
    } else {
      envShiftTarget = {
        sky:DEFAULT_SKY_COLOR.clone(), fog:DEFAULT_FOG_COLOR.clone(), hemi:DEFAULT_HEMI_SKY.clone(),
        hemiIntensity: DEFAULT_HEMI_INTENSITY*dimFactor, sunIntensity: DEFAULT_SUN_INTENSITY*dimFactor,
        active:false
      };
    }
  }
  function updateEnvironmentShift(dt){
    scene.background.lerp(envShiftTarget.sky, Math.min(1, dt*1.5));
    scene.fog.color.lerp(envShiftTarget.fog, Math.min(1, dt*1.5));
    hemi.color.lerp(envShiftTarget.hemi, Math.min(1, dt*1.5));
    hemi.intensity += (envShiftTarget.hemiIntensity - hemi.intensity) * Math.min(1, dt*1.5);
    sun.intensity += (envShiftTarget.sunIntensity - sun.intensity) * Math.min(1, dt*1.5);
  }

  // ---- 캐릭터에 붙는 아우라 이펙트: 등급마다 완전히 다른 전용 파티클 ----
  let currentAuraEffect = null;
  function clearAuraEffect(){
    if (currentAuraEffect){
      scene.remove(currentAuraEffect.group);
      currentAuraEffect = null;
    }
  }
  const MAX_TIER_ORDER = 25; // Chrono 기준
  function tierScaleFactor(order){
    // 낮은 등급은 거의 안 보일 만큼 미세하고, 최상위로 갈수록 기하급수적으로 커짐 (선형 증가로는 격차가 안 느껴져서 지수 곡선 사용)
    return Math.pow(Math.min(order, MAX_TIER_ORDER) / MAX_TIER_ORDER, 1.7);
  }

  function makeAuraSprite(tex, color, size, opacity){
    const mat = new THREE.SpriteMaterial({ map:tex, color, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity });
    const s = new THREE.Sprite(mat);
    s.scale.set(size, size, 1);
    return s;
  }

  // ==================== 시그니처 입체 구조물 4계열 ====================
  // ① 궤도형: 여러 각도로 기울어진 입체 토러스 링 3~4개가 서로 다른 속도로 회전 + 숨쉬듯 맥동
  function addOrbitalFamily(group, particles, tier, color, sf){
    const ringCount = tier.order > 12 ? 4 : 3;
    for (let i=0;i<ringCount;i++){
      const r = 0.5 + i*0.22 + sf*1.6;
      const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.18+sf*0.5, blending:THREE.AdditiveBlending, depthWrite:false });
      const torus = new THREE.Mesh(new THREE.TorusGeometry(r, 0.02+sf*0.05, 8, 44), mat);
      torus.rotation.x = 0.3 + (i/ringCount)*Math.PI*0.65;
      torus.rotation.y = (i/ringCount)*Math.PI*0.8;
      torus.position.y = 1.3;
      group.add(torus);
      particles.push({ mesh:torus, mode:'orbitalring', axis:i%2===0?'z':'x', speed:(0.5+i*0.22+sf*1.2)*(i%2===0?1:-1), breathPhase:Math.random()*Math.PI*2 });
    }
  }
  // ② 크리스탈/파편형: 공중 부양하며 회전+미세 진동하는 3D 결정체 파편들
  function addCrystalFamily(group, particles, tier, color, sf){
    const geo = new THREE.OctahedronGeometry(1, 0);
    const count = 4 + Math.floor(sf*10);
    for (let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*0.6+sf*0.9, h = 0.4+Math.random()*1.9;
      const mat = new THREE.MeshPhysicalMaterial({
        color, transparent:true, opacity:0.35+sf*0.4, roughness:0.08, metalness:0.1,
        transmission:0.4, clearcoat:1, emissive:color, emissiveIntensity:0.2+sf*0.25
      });
      const mesh = new THREE.Mesh(geo, mat);
      const sc = 0.08+Math.random()*0.07+sf*0.22;
      mesh.scale.set(sc, sc*1.6, sc);
      mesh.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
      group.add(mesh);
      particles.push({ mesh, mode:'crystaljitter', orbitR:r, orbitA:a, baseH:h, spin:(0.4+sf*2.5)*(Math.random()<0.5?1:-1), jitterPhase:Math.random()*Math.PI*2 });
    }
  }
  // ③ 기둥/소환진형: 바닥에서 하늘로 치솟는 에너지 기둥(빠르게 수축했다 퍼짐) + 발밑 이중 회전 마법진
  function addPillarFamily(group, particles, tier, color, ringTex, sf){
    const pillarH = 1.4 + sf*10;
    const pillarGeo = new THREE.CylinderGeometry(0.06+sf*0.28, 0.16+sf*0.6, pillarH, 16, 1, true);
    const pillarMat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.14+sf*0.42, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
    pillar.position.y = pillarH/2;
    group.add(pillar);
    particles.push({ mesh:pillar, mode:'pillarburst', baseOpacity:0.14+sf*0.42 });

    for (let i=0;i<2;i++){
      const mat = new THREE.MeshBasicMaterial({ map:ringTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.55-i*0.15 });
      const size = 1.0 + i*0.5 + sf*4.5;
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size,size), mat);
      mesh.rotation.x = -Math.PI/2;
      mesh.position.y = 0.03+i*0.012;
      group.add(mesh);
      particles.push({ mesh, mode:'ringspin', slow:i===1 });
    }
  }
  // ④ 구체/번개형: 캐릭터 중심에서 퍼져나가는 플라즈마 구체 + 짧게 번쩍이는 번개 스파크
  function addSphereLightningFamily(group, particles, tier, color, sf){
    const sphereGeo = new THREE.SphereGeometry(1, 10, 10);
    const count = 3 + Math.floor(sf*9);
    for (let i=0;i<count;i++){
      const a = (i/count)*Math.PI*2, r = 0.5+Math.random()*0.45+sf*0.9, h = 0.5+Math.random()*1.6;
      const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.4+sf*0.4, blending:THREE.AdditiveBlending, depthWrite:false });
      const mesh = new THREE.Mesh(sphereGeo, mat);
      const sc = 0.06+Math.random()*0.05+sf*0.16;
      mesh.scale.setScalar(sc);
      mesh.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
      group.add(mesh);
      particles.push({ mesh, mode:'plasmaorb', orbitR:r, orbitA:a, baseH:h, flickerPhase:Math.random()*Math.PI*2, orbitSpeed:0.2+sf*1.2 });
    }
    for (let i=0;i<3;i++){
      const lineMat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0 });
      const points = [];
      for (let j=0;j<5;j++) points.push(new THREE.Vector3((Math.random()-0.5)*0.5, 0.2+j*0.42, (Math.random()-0.5)*0.5));
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(lineGeo, lineMat);
      group.add(line);
      particles.push({ mesh:line, mode:'lightningflash', delay:Math.random()*2.2 });
    }
  }

  function createAuraEffect(aura){
    clearAuraEffect();
    const tier = AURA_TIERS[aura.tier];
    const group = new THREE.Group();
    const dotTex = makeGlowTexture(tier.color, tier.color2);
    const ringTex = makeRingTexture(tier.color2 != null ? tier.color2 : tier.color);
    const shardTex = makeShardTexture(tier.color2 != null ? tier.color2 : tier.color);
    const particles = [];
    const type = tier.fx;

    function addDot(px,py,pz,size,opacity,extra){
      const s = makeAuraSprite(dotTex, tier.color, size, opacity);
      s.position.set(px,py,pz);
      group.add(s);
      particles.push(Object.assign({ mesh:s, baseX:px, baseY:py, baseZ:pz, phase:Math.random()*Math.PI*2 }, extra||{}));
      return s;
    }

    if (type === 'none'){
      // Plain: 아무 파티클도 없음, 이름표만 뜸
    }
    else if (type === 'dust'){
      // Common: 발밑에서 미세하게 흔들리는 먼지 입자
      for (let i=0;i<14;i++){
        const a = Math.random()*Math.PI*2, r = Math.random()*0.55;
        addDot(Math.cos(a)*r, 0.06+Math.random()*0.1, Math.sin(a)*r, 0.18+Math.random()*0.08, 0.35+Math.random()*0.25, {mode:'jitter'});
      }
    }
    else if (type === 'sparkle'){
      // Uncommon: 주변에 아주 작게 반짝이는 빛가루
      for (let i=0;i<18;i++){
        const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*0.7, h = 0.3+Math.random()*2.0;
        addDot(Math.cos(a)*r, h, Math.sin(a)*r, 0.12+Math.random()*0.08, 0.5+Math.random()*0.4, {mode:'twinkle', orbitR:r, orbitA:a, baseH:h});
      }
    }
    else if (type === 'coldair'){
      // Rare: 캐릭터 몸을 스쳐 지나가는 차가운 공기 흐름
      for (let i=0;i<5;i++){
        const s = makeAuraSprite(dotTex, tier.color, 1.4, 0.3);
        s.scale.set(1.4, 0.32, 1);
        group.add(s);
        particles.push({ mesh:s, mode:'coldair', phase:(i/5)*Math.PI*2, h:0.4+Math.random()*1.6 });
      }
    }
    else if (type === 'bubble'){
      // Good: 가끔씩 위로 동글동글 올라오는 기포 이펙트
      for (let i=0;i<7;i++){
        const a = Math.random()*Math.PI*2, r = Math.random()*0.4;
        addDot(Math.cos(a)*r, 0, Math.sin(a)*r, 0.14+Math.random()*0.08, 0, {mode:'bubble', speed:0.45+Math.random()*0.35, wob:Math.random()*0.3, cycleT:Math.random()*3.5, maxH:1.8+Math.random()*0.6});
      }
    }
    else if (type === 'wavepulse' || type === 'ripple'){
      // Epic: 발밑에서 은은하게 퍼지는 파동 / Hydro: 발밑에서 물결치는 파문+방울
      for (let i=0;i<2;i++){
        const ringMat = new THREE.MeshBasicMaterial({ map:ringTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.8 });
        const ring = new THREE.Mesh(new THREE.PlaneGeometry(2.6,2.6), ringMat);
        ring.rotation.x = -Math.PI/2;
        ring.position.y = 0.03;
        group.add(ring);
        particles.push({ mesh:ring, mode:'wave', phase:i*0.7 });
      }
      if (type === 'ripple'){
        for (let i=0;i<6;i++){
          addDot((Math.random()-0.5)*0.7, 0.1, (Math.random()-0.5)*0.7, 0.1, 0, {mode:'droplet', delay:Math.random()*2});
        }
      }
    }
    else if (type === 'auraring' || type === 'amberring'){
      // Topaz: 노란빛+주황 작은 오라 링 / Amber: 굳어있는 호박석 링+실제 3D 보석
      const ringMat = new THREE.MeshBasicMaterial({ map:ringTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.75 });
      const ring = new THREE.Mesh(new THREE.PlaneGeometry(2.0,2.0), ringMat);
      ring.rotation.x = -Math.PI/2;
      ring.position.y = 0.03;
      group.add(ring);
      particles.push({ mesh:ring, mode:'ringspin', slow: type==='amberring' });
      const count = type==='amberring' ? 5 : 7;
      for (let i=0;i<count;i++){
        const a = (i/count)*Math.PI*2;
        addDot(Math.cos(a)*0.85, 0.15, Math.sin(a)*0.85, 0.13, 0.7, {mode: type==='amberring' ? 'static' : 'orbitring', orbitR:0.85, orbitA:a});
      }
      if (type === 'amberring'){
        // 실제 3D 호박석 보석(둥근 유리질) 5개가 굳은 채 천천히 떠 있음
        const gemGeo = new THREE.IcosahedronGeometry(1, 0);
        for (let i=0;i<5;i++){
          const a = (i/5)*Math.PI*2 + 0.4, r = 0.65+Math.random()*0.4, h = 0.5+Math.random()*1.3;
          const gemMat = new THREE.MeshPhysicalMaterial({
            color:0xB5601A, transparent:true, opacity:0.75, roughness:0.15, metalness:0.05,
            transmission:0.35, clearcoat:1, emissive:0xB5601A, emissiveIntensity:0.4
          });
          const gem = new THREE.Mesh(gemGeo, gemMat);
          const sc = 0.13+Math.random()*0.08;
          gem.scale.set(sc, sc, sc);
          gem.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
          group.add(gem);
          particles.push({ mesh:gem, mode:'amberdrift', orbitR:r, orbitA:a, baseH:h, spin:0.3+Math.random()*0.4 });
        }
      }
    }
    else if (type === 'orbittrail'){
      // Great: 캐릭터 주위를 천천히 도는 빛의 궤적
      for (let i=0;i<6;i++){
        addDot(0,1.6,0, 0.16-(i*0.015), 0.7-(i*0.1), {mode:'orbit', orbitR:1.0, orbitPhase:-i*0.28, speed:1.1, h:1.6});
      }
    }
    else if (type === 'shard'){
      // Quartz: 실제 3D 크리스탈(팔면체)이 주변에 떠다니며 반짝임 + 작은 유리 파편 스프라이트 보조
      const crystalGeo = new THREE.OctahedronGeometry(1, 0);
      for (let i=0;i<6;i++){
        const a = Math.random()*Math.PI*2, r = 0.6+Math.random()*0.7, h = 0.4+Math.random()*1.7;
        const crystalMat = new THREE.MeshPhysicalMaterial({
          color: tier.color, transparent:true, opacity:0.55, roughness:0.05, metalness:0.1,
          transmission:0.5, clearcoat:1, emissive: tier.color, emissiveIntensity:0.35
        });
        const crystal = new THREE.Mesh(crystalGeo, crystalMat);
        const sc = 0.14 + Math.random()*0.1;
        crystal.scale.set(sc, sc*1.7, sc);
        crystal.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
        group.add(crystal);
        particles.push({ mesh:crystal, mode:'crystal', orbitR:r, orbitA:a, baseH:h, spin:(Math.random()-0.5)*2 });
      }
      for (let i=0;i<8;i++){
        const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*0.6, h = 0.3+Math.random()*1.8;
        const s = makeAuraSprite(shardTex, tier.color, 0.16+Math.random()*0.08, 0.6);
        s.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
        group.add(s);
        particles.push({ mesh:s, mode:'shard', orbitR:r, orbitA:a, baseH:h, spin:(Math.random()-0.5)*3 });
      }
    }
    else if (type === 'debris'){
      // Acorn: 바닥에 흩날리는 작은 도토리와 나뭇잎 파편
      const acornGeo = new THREE.ConeGeometry(0.06,0.14,6);
      const leafGeo = new THREE.PlaneGeometry(0.12,0.08);
      for (let i=0;i<8;i++){
        const a = Math.random()*Math.PI*2, r = Math.random()*0.7;
        const useAcorn = Math.random()<0.5;
        const mesh = new THREE.Mesh(useAcorn?acornGeo:leafGeo, new THREE.MeshStandardMaterial({ color: useAcorn?0x6B4A2B:0x9C7A3C, roughness:0.9, side:THREE.DoubleSide }));
        mesh.position.set(Math.cos(a)*r, 0.04, Math.sin(a)*r);
        mesh.rotation.set(useAcorn?0:Math.PI/2, Math.random()*Math.PI*2, 0);
        group.add(mesh);
        particles.push({ mesh, mode:'sway' });
      }
    }
    else if (type === 'pollen'){
      // Pollen: 주변에 둥둥 떠다니며 퍼지는 노란 꽃가루 (더 풍성하게, 실제 3D 꽃잎 메시 포함)
      for (let i=0;i<20;i++){
        const a = Math.random()*Math.PI*2, r = 0.4+Math.random()*1.1, h = 0.3+Math.random()*1.9;
        addDot(Math.cos(a)*r, h, Math.sin(a)*r, 0.11+Math.random()*0.07, 0.55, {mode:'drift', dx:(Math.random()-0.5)*0.4, dz:(Math.random()-0.5)*0.4, dy:(Math.random()-0.5)*0.2});
      }
      // 실제 3D 꽃잎 조각 (작은 평면, 앞뒤로 살랑거리며 부유)
      const petalGeo = new THREE.PlaneGeometry(0.13, 0.09);
      for (let i=0;i<9;i++){
        const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*0.9, h = 0.4+Math.random()*1.6;
        const petalMat = new THREE.MeshStandardMaterial({ color:0xF2D93E, emissive:0xF2D93E, emissiveIntensity:0.3, roughness:0.7, side:THREE.DoubleSide, transparent:true, opacity:0.85 });
        const petal = new THREE.Mesh(petalGeo, petalMat);
        petal.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
        group.add(petal);
        particles.push({ mesh:petal, mode:'petal', orbitR:r, orbitA:a, baseH:h, phase:Math.random()*Math.PI*2 });
      }
      // 발밑에 은은하게 퍼지는 꽃밭 빛 (연노랑 링)
      const fieldMat = new THREE.MeshBasicMaterial({ map:makeGlowTexture(0xF2D93E), color:0xffffff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.28 });
      const field = new THREE.Mesh(new THREE.PlaneGeometry(2.6,2.6), fieldMat);
      field.rotation.x = -Math.PI/2;
      field.position.y = 0.025;
      group.add(field);
      particles.push({ mesh:field, mode:'powerpulse', baseScale:1 });
    }
    else if (type === 'flame'){
      // Ignis: 발밑에서 위로 피어오르는 불꽃 열기
      for (let i=0;i<10;i++){
        const a = Math.random()*Math.PI*2, r = Math.random()*0.35;
        addDot(Math.cos(a)*r, Math.random()*1.4, Math.sin(a)*r, 0.16, 0.7, {mode:'flame', speed:1.3+Math.random()*0.6, wob:Math.random()*0.4});
      }
    }
    else if (type === 'flicker'){
      // Flicker: 등불처럼 깜빡이는 미세한 불빛
      const light = new THREE.PointLight(tier.color, 1.0, 5, 2);
      light.position.y = 1.8;
      group.add(light);
      particles.push({ mesh:null, mode:'light', light });
      for (let i=0;i<4;i++){
        addDot((Math.random()-0.5)*0.4, 1.6+Math.random()*0.3, (Math.random()-0.5)*0.4, 0.14, 0.6, {mode:'flickerdot'});
      }
    }
    else if (type === 'mist'){
      // Mist: 캐릭터 하체를 감싸고 흐르는 옅은 연기
      for (let i=0;i<4;i++){
        const a = (i/4)*Math.PI*2;
        const s = makeAuraSprite(dotTex, tier.color, 1.3, 0.22);
        s.position.set(Math.cos(a)*0.4, 0.6, Math.sin(a)*0.4);
        group.add(s);
        particles.push({ mesh:s, mode:'mist', orbitA:a });
      }
    }
    else if (type === 'windspiral'){
