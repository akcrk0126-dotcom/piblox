<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d2a2a">
<title>수학 블리츠</title>
<style>
  :root{ --bg:#0b2324; --card:#123637; --line:rgba(255,255,255,.12); --tx:#effffb; --sub:#9cc7c0; --acc:#21d19f; --acc2:#14a37b; --bad:#ff5f6d; --gold:#ffd23a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:radial-gradient(1000px 520px at 50% -160px, #1c5a54, var(--bg)); color:var(--tx); font-family:'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif; }
  body{ display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  button{ font:inherit; color:inherit; border:none; cursor:pointer; background:none; }
  svg.i{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  header{ flex:none; height:56px; display:flex; align-items:center; gap:8px; padding:0 12px 0 64px; }
  header h1{ margin:0; flex:1; font-size:19px; font-weight:900; display:flex; align-items:center; gap:8px; }
  .hb{ height:36px; padding:0 12px; border-radius:10px; background:rgba(255,255,255,.08); display:flex; align-items:center; gap:6px; font-weight:800; font-size:13px; }
  .hb:hover{ background:rgba(255,255,255,.15); }
  .scr{ flex:1; min-height:0; display:none; flex-direction:column; align-items:center; overflow-y:auto; padding:6px 14px 18px; }
  .scr.on{ display:flex; }

  /* 메뉴 */
  .hero{ text-align:center; margin:4px 0 14px; }
  .hero h2{ margin:0; font-size:30px; font-weight:900; letter-spacing:-.01em; }
  .hero p{ margin:6px 0 0; color:var(--sub); font-size:14px; line-height:1.55; }
  .modes{ width:min(560px, 100%); display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .mode{ position:relative; text-align:left; padding:14px 14px 12px; border-radius:16px; background:var(--card); border:2px solid transparent; display:flex; flex-direction:column; gap:6px; min-height:112px; }
  .mode:hover{ border-color:rgba(33,209,159,.5); }
  .mode .ic{ width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:21px; color:#06231f; }
  .mode b{ font-size:16px; } .mode small{ color:var(--sub); font-size:12px; line-height:1.4; }
  .mode .best{ position:absolute; right:12px; top:12px; font-size:11.5px; font-weight:800; color:var(--gold); }
  .mode.wide{ grid-column:1 / -1; min-height:auto; flex-direction:row; align-items:center; gap:12px; }
  .lbBox{ width:min(560px, 100%); margin-top:16px; background:rgba(0,0,0,.18); border-radius:16px; padding:12px; }
  .lbBox h3{ margin:0 0 8px; font-size:15px; display:flex; align-items:center; justify-content:space-between; }
  .lbTabs{ display:flex; gap:4px; flex-wrap:wrap; } .lbTabs button{ height:28px; padding:0 10px; border-radius:99px; background:rgba(255,255,255,.07); font-size:12px; font-weight:800; color:var(--sub); } .lbTabs button.on{ background:var(--acc); color:#06231f; }
  .lb{ display:flex; flex-direction:column; gap:4px; margin-top:8px; }
  .lb .r{ display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:9px; background:rgba(255,255,255,.05); font-size:13.5px; }
  .lb .r.me{ background:rgba(33,209,159,.25); }
  .lb .n{ width:22px; text-align:center; font-weight:900; color:var(--sub); } .lb .n.g1{ color:var(--gold); } .lb .n.g2{ color:#d6e2f5; } .lb .n.g3{ color:#e59a5b; }
  .lb .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800; }
  .lb small{ color:var(--sub); font-size:11.5px; } .lb .sc{ font-weight:900; }
  .empty{ color:var(--sub); font-size:13px; padding:8px 0; text-align:center; }

  /* 게임 */
  #sPlay{ justify-content:space-between; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  .hud{ width:min(560px, 100%); display:flex; align-items:center; gap:10px; }
  .hud .tm{ flex:1; height:12px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; }
  .hud .tm i{ display:block; height:100%; width:100%; background:linear-gradient(90deg, var(--acc), #8affd8); border-radius:99px; transition:width .1s linear; }
  .hud .tm.low i{ background:linear-gradient(90deg, var(--bad), #ffa0a8); }
  .hud .sec{ width:46px; text-align:right; font-weight:900; font-variant-numeric:tabular-nums; }
  .hud2{ width:min(560px, 100%); display:flex; justify-content:space-between; margin-top:8px; font-weight:800; color:var(--sub); font-size:14px; }
  @media (max-width:620px){ .hud, .hud2{ padding-left:50px; } }
  .hud2 b{ color:var(--tx); font-size:18px; font-variant-numeric:tabular-nums; }
  .combo{ color:var(--gold) !important; }
  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; width:100%; min-height:150px; position:relative; }
  .q{ font-size:clamp(36px, 10vw, 64px); font-weight:900; letter-spacing:.02em; font-variant-numeric:tabular-nums; text-align:center; white-space:nowrap; }
  .q .box{ display:inline-block; min-width:1.4em; padding:0 .15em; border-bottom:5px solid var(--acc); color:var(--acc); }
  .ans{ min-width:160px; height:64px; padding:0 18px; border-radius:16px; background:rgba(0,0,0,.25); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:900; font-variant-numeric:tabular-nums; }
  .ans.ok{ border-color:var(--acc); background:rgba(33,209,159,.2); animation:okp .25s; }
  .ans.bad{ border-color:var(--bad); background:rgba(255,95,109,.2); animation:shake .35s; }
  @keyframes okp{ 50%{ transform:scale(1.08); } }
  @keyframes shake{ 25%{ transform:translateX(-8px); } 50%{ transform:translateX(8px); } 75%{ transform:translateX(-4px); } }
  .fly{ position:absolute; top:28%; font-weight:900; font-size:22px; color:var(--gold); pointer-events:none; animation:fly .8s forwards; }
  .fly.neg{ color:var(--bad); }
  @keyframes fly{ to{ transform:translateY(-50px); opacity:0; } }
  .pad{ width:min(420px, 100%); display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .pad button{ height:clamp(48px, 8.5vh, 64px); border-radius:14px; background:var(--card); font-size:24px; font-weight:900; box-shadow:0 3px 0 rgba(0,0,0,.35); user-select:none; }
  .pad button:active{ transform:translateY(2px); box-shadow:none; }
  .pad .go{ background:var(--acc); color:#06231f; font-size:18px; }
  .pad .sk{ font-size:14px; color:var(--sub); }
  .cd{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-size:120px; font-weight:900; background:rgba(5,20,20,.6); z-index:30; }
  .cd.on{ display:flex; }

  /* 결과 */
  .res{ width:min(560px, 100%); text-align:center; }
  .res h2{ margin:6px 0 2px; font-size:24px; } .res .big{ font-size:56px; font-weight:900; color:var(--acc); line-height:1.1; }
  .res .new{ display:inline-block; margin-top:6px; padding:3px 10px; border-radius:99px; background:var(--gold); color:#2a2000; font-weight:900; font-size:12.5px; }
  .grid4{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:14px 0; }
  .grid4 div{ background:var(--card); border-radius:12px; padding:10px 4px; } .grid4 b{ display:block; font-size:20px; } .grid4 small{ font-size:11px; color:var(--sub); }
  .review{ text-align:left; background:rgba(0,0,0,.18); border-radius:14px; padding:12px; margin-bottom:12px; }
  .review h3{ margin:0 0 8px; font-size:14.5px; }
  .review .w{ display:flex; justify-content:space-between; padding:6px 4px; border-bottom:1px solid var(--line); font-size:15px; font-variant-numeric:tabular-nums; }
  .review .w:last-child{ border-bottom:none; } .review .w s{ color:var(--bad); margin-right:8px; } .review .w b{ color:var(--acc); }
  .btns{ display:flex; gap:8px; } .btns button{ flex:1; height:50px; border-radius:14px; font-weight:900; font-size:16px; background:rgba(255,255,255,.1); } .btns .pri{ background:var(--acc); color:#06231f; }
  @media (max-width:420px){ .modes{ grid-template-columns:1fr 1fr; gap:8px; } .mode{ min-height:100px; padding:12px 10px; } .mode small{ font-size:11px; } }
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 24 24" style="width:26px;height:26px"><rect x="2" y="2" width="20" height="20" rx="6" fill="#21d19f"/><path d="M7 8h4M9 6v4M13.5 8h4M7.5 14.5l3 3M10.5 14.5l-3 3M13.5 15h4M13.5 17.5h4" stroke="#06231f" stroke-width="2" stroke-linecap="round"/></svg>수학 블리츠</h1>
  <button class="hb" id="bQuit" style="display:none"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>그만</button>
</header>

<section class="scr on" id="sMenu">
  <div class="hero"><h2>60초 동안 몇 문제?</h2><p>답을 치면 맞는 순간 바로 다음 문제로 넘어가요.<br>연속으로 맞히면 콤보 점수가 붙고, 갈수록 문제가 어려워져요.</p></div>
  <div class="modes" id="modes"></div>
  <div class="lbBox"><h3>랭킹 <div class="lbTabs" id="lbTabs"></div></h3><div class="lb" id="lbList"><div class="empty">불러오는 중…</div></div></div>
</section>

<section class="scr" id="sPlay">
  <div style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="hud"><div class="tm" id="tm"><i></i></div><div class="sec" id="sec">60</div></div>
    <div class="hud2"><span>점수 <b id="pScore">0</b></span><span class="combo" id="pCombo"></span><span>맞힘 <b id="pOk">0</b></span></div>
  </div>
  <div class="stage" id="stage"><div class="q" id="q"></div><div class="ans" id="ans"></div></div>
  <div class="pad" id="pad"></div>
</section>

<section class="scr" id="sEnd"><div class="res" id="res"></div></section>
<div class="cd" id="cd"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="multiplayer.js" onerror="window.__mpFail=true"></script>
<script>
(function(){
'use strict';
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const store = { get(k, d){ try { const v = localStorage.getItem('mb_' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem('mb_' + k, JSON.stringify(v)); } catch(e){} } };
const R = (a, b)=>a + Math.floor(Math.random()*(b - a + 1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const DUR = 60;

// ---------- 문제 만들기: lv 1~6 (맞힐수록 올라감) ----------
// 문제 = { t:[글자 조각], a:정답 }   t 안의 '□' 는 답 자리
function qAdd(lv){ const mx = [9, 20, 50, 100, 500, 1000][lv - 1]; let a = R(1, mx), b = R(1, mx);
  if (Math.random() < .5){ return { t:[a, '+', b, '=', '□'], a:a + b }; } if (b > a) [a, b] = [b, a]; return { t:[a, '−', b, '=', '□'], a:a - b }; }
function qMul(lv){ const [x, y] = [[[2, 5], [1, 9]], [[2, 9], [2, 9]], [[2, 9], [2, 12]], [[11, 19], [2, 9]], [[12, 30], [3, 12]], [[13, 40], [11, 25]]][lv - 1];
  const a = R(x[0], x[1]), b = R(y[0], y[1]); return Math.random() < .5 ? { t:[a, '×', b, '=', '□'], a:a*b } : { t:[b, '×', a, '=', '□'], a:a*b }; }
function qDiv(lv){ const [x, y] = [[[2, 5], [1, 9]], [[2, 9], [2, 9]], [[2, 9], [2, 12]], [[3, 12], [6, 15]], [[11, 19], [3, 12]], [[12, 25], [11, 25]]][lv - 1];
  const b = R(x[0], x[1]), a = R(y[0], y[1]); return { t:[a*b, '÷', b, '=', '□'], a }; }
function qEq(lv){ const k = lv <= 2 ? R(0, 1) : lv <= 4 ? R(0, 3) : R(2, 4); const x = R(2, lv <= 2 ? 9 : 15);
  if (k === 0){ const a = R(1, 20*lv); return { t:[a, '+', '□', '=', a + x], a:x }; }
  if (k === 1){ const a = R(1, 15*lv); return { t:['□', '−', a, '=', x], a:x + a, };   }
  if (k === 2){ const a = R(2, lv <= 3 ? 9 : 12); return { t:[a, '×', '□', '=', a*x], a:x }; }
  if (k === 3){ const a = R(2, 9), b = R(1, 20); return { t:[a, '×', '□', '+', b, '=', a*x + b], a:x }; }
  const a = R(2, 9), b = R(1, 9); return { t:['(', '□', '−', b, ')', '×', a, '=', a*(x)], a:x + b }; }
function qPow(lv){ const k = R(0, lv <= 2 ? 1 : 2);
  if (k === 0){ const a = R(2, lv <= 2 ? 12 : 20); return { t:[a + '²', '=', '□'], a:a*a }; }
  if (k === 1){ const a = R(2, lv <= 2 ? 12 : 20); return { t:['√' + a*a, '=', '□'], a }; }
  const a = R(2, 5), n = a === 2 ? R(3, 8) : R(3, 4); return { t:[a + sup(n), '=', '□'], a:Math.pow(a, n) }; }
function qPct(lv){ const p = pick(lv <= 2 ? [10, 50, 25] : [10, 20, 25, 50, 75, 5, 15, 40]); const base = p === 75 || p === 25 ? 4 : p === 15 || p === 5 ? 20 : p === 40 ? 5 : 10;
  const n = base*R(1, 5*lv); return { t:[n + '의', p + '%', '=', '□'], a:n*p/100 }; }
function sup(n){ return String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join(''); }
const MODES = [
  { id:'add', name:'덧셈 · 뺄셈', desc:'한 자리에서 시작해 세 자리까지', ic:'+', col:'#21d19f', gen:qAdd },
  { id:'mul', name:'곱셈 (구구단+)', desc:'구구단부터 두 자리 곱셈까지', ic:'×', col:'#ffd23a', gen:qMul },
  { id:'div', name:'나눗셈', desc:'딱 나누어떨어지는 나눗셈', ic:'÷', col:'#7ab8ff', gen:qDiv },
  { id:'eq', name:'방정식 □ 구하기', desc:'3 × □ + 4 = 19 처럼 빈칸 찾기', ic:'□', col:'#ff8fb1', gen:qEq },
  { id:'pow', name:'제곱 · 루트', desc:'12² · √144 · 2⁵', ic:'x²', col:'#c59bff', gen:qPow },
  { id:'pct', name:'퍼센트', desc:'80의 25% 는?', ic:'%', col:'#ff9f5a', gen:qPct },
  { id:'mix', name:'전부 섞기', desc:'위의 모든 문제가 섞여서 나와요. 진짜 실력 테스트!', ic:'∞', col:'#ffffff', gen:lv=>pick([qAdd, qMul, qDiv, qEq, qPow, qPct])(lv), wide:true } ];
const MODE = {}; MODES.forEach(m=>MODE[m.id] = m);
const best = store.get('best', {});

// ---------- 메뉴 ----------
function buildMenu(){
  $('modes').innerHTML = MODES.map(m=>'<button class="mode' + (m.wide ? ' wide' : '') + '" data-m="' + m.id + '"><span class="ic" style="background:' + m.col + '">' + m.ic + '</span><span><b>' + m.name + '</b><br><small>' + m.desc + '</small></span>' + (best[m.id] ? '<span class="best">최고 ' + best[m.id].toLocaleString() + '</span>' : '') + '</button>').join('');
  $('lbTabs').innerHTML = MODES.map(m=>'<button data-m="' + m.id + '" class="' + (m.id === lbMode ? 'on' : '') + '">' + m.ic + '</button>').join('');
}
let lbMode = store.get('lbMode', 'add');
$('modes').onclick = e=>{ const b = e.target.closest('[data-m]'); if (b) start(b.dataset.m); };
$('lbTabs').onclick = e=>{ const b = e.target.closest('[data-m]'); if (!b) return; lbMode = b.dataset.m; store.set('lbMode', lbMode); buildMenu(); loadRank($('lbList'), lbMode, 10); };

// ---------- 게임 ----------
const S = { mode:null, q:null, typed:'', score:0, ok:0, bad:0, combo:0, maxCombo:0, end:0, timer:0, wrong:[], on:false, lv:1, penalty:0 };
function show(id){ document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on', s.id === id)); $('bQuit').style.display = id === 'sPlay' ? '' : 'none'; }
function start(m){
  Object.assign(S, { mode:m, typed:'', score:0, ok:0, bad:0, combo:0, maxCombo:0, wrong:[], on:false, lv:1, penalty:0 });
  show('sPlay'); buildPad(); $('pScore').textContent = '0'; $('pOk').textContent = '0'; $('pCombo').textContent = ''; $('q').innerHTML = ''; $('ans').textContent = ''; $('tm').querySelector('i').style.width = '100%'; $('sec').textContent = DUR;
  let n = 3; const cd = $('cd'); cd.textContent = n; cd.classList.add('on');
  const iv = setInterval(()=>{ n--; if (n > 0){ cd.textContent = n; return; } clearInterval(iv); cd.classList.remove('on'); S.on = true; S.end = performance.now() + DUR*1000; next(); tick(); }, 650);
}
function next(){ let q; do { q = MODE[S.mode].gen(S.lv); } while (S.q && q.t.join() === S.q.t.join()); S.q = q; S.typed = ''; drawQ(); }
function drawQ(){ $('q').innerHTML = S.q.t.map(x=>x === '□' ? '<span class="box">' + (S.typed || '?') + '</span>' : esc(x)).join(' '); $('ans').textContent = S.typed; $('ans').className = 'ans'; }
function tick(){ if (!S.on) return; const left = Math.max(0, S.end - performance.now());
  $('tm').querySelector('i').style.width = (left/(DUR*1000)*100) + '%'; $('tm').classList.toggle('low', left < 10000); $('sec').textContent = Math.ceil(left/1000);
  if (left <= 0){ finish(); return; } requestAnimationFrame(tick); }
function fly(txt, neg){ const f = document.createElement('div'); f.className = 'fly' + (neg ? ' neg' : ''); f.textContent = txt; $('stage').appendChild(f); setTimeout(()=>f.remove(), 800); }
function input(k){
  if (!S.on) return;
  if (k === 'back'){ S.typed = S.typed.slice(0, -1); drawQ(); return; }
  if (k === 'skip'){ S.end -= 3000; S.combo = 0; S.wrong.push({ q:S.q, you:'넘김' }); fly('−3초', true); next(); updHud(); return; }
  if (k === 'enter'){ if (!S.typed) return; if (+S.typed !== S.q.a) wrong(); return; }
  if (/^\d$/.test(k) || (k === '.' && !S.typed.includes('.'))){ if (S.typed.length >= 7) return; S.typed += k; drawQ();
    if (+S.typed === S.q.a && !(k === '.' )) right(); }
}
function right(){ S.ok++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
  const mult = 1 + Math.floor(S.combo/5), pts = 10*S.lv*mult; S.score += pts; fly('+' + pts);
  if (S.combo % 10 === 0){ S.end += 2000; fly('+2초 보너스'); }
  S.lv = Math.min(6, 1 + Math.floor(S.ok/5));
  $('ans').className = 'ans ok'; beep(true); updHud(); setTimeout(()=>{ if (S.on) next(); }, 140); }
function wrong(){ S.bad++; S.combo = 0; S.end -= 2000; S.wrong.push({ q:S.q, you:S.typed }); fly('−2초', true); beep(false);
  const a = $('ans'); a.className = 'ans'; void a.offsetWidth; a.className = 'ans bad'; S.typed = ''; setTimeout(()=>{ if (S.on) drawQ(); }, 350); updHud(); }
function updHud(){ $('pScore').textContent = S.score.toLocaleString(); $('pOk').textContent = S.ok; $('pCombo').textContent = S.combo >= 3 ? S.combo + ' 콤보 · ×' + (1 + Math.floor(S.combo/5)) : ''; }
function buildPad(){ $('pad').innerHTML = ['7', '8', '9', '4', '5', '6', '1', '2', '3'].map(d=>'<button data-k="' + d + '">' + d + '</button>').join('')
  + '<button data-k="back" aria-label="지우기"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9l6 6M18 9l-6 6"/></svg></button><button data-k="0">0</button><button class="go" data-k="enter">확인</button>'
  + '<button class="sk" data-k="skip" style="grid-column:1/-1;height:40px">이 문제 넘기기 (−3초)</button>'; }
$('pad').addEventListener('pointerdown', e=>{ const b = e.target.closest('[data-k]'); if (!b) return; e.preventDefault(); input(b.dataset.k); });
addEventListener('keydown', e=>{ if (!S.on) { if (e.key === 'Enter' && $('sEnd').classList.contains('on')){ const b = document.querySelector('#res .pri'); if (b) b.click(); } return; }
  if (/^\d$/.test(e.key) || e.key === '.') input(e.key); else if (e.key === 'Backspace') input('back'); else if (e.key === 'Enter') input('enter'); else if (e.key === 'Tab'){ e.preventDefault(); input('skip'); } else return; e.preventDefault(); });
$('bQuit').onclick = ()=>{ S.on = false; show('sMenu'); buildMenu(); };
let AC = null;
function beep(ok){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = ok ? 'triangle' : 'square';
  o.frequency.setValueAtTime(ok ? 660 + Math.min(12, S.combo)*30 : 160, t); if (ok) o.frequency.exponentialRampToValueAtTime(990 + Math.min(12, S.combo)*30, t + .08);
  g.gain.setValueAtTime(ok ? .12 : .08, t); g.gain.exponentialRampToValueAtTime(.001, t + (ok ? .15 : .25)); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .3); } catch(e){} }

// ---------- 결과 ----------
function fmtQ(q){ return q.t.map(x=>x === '□' ? '<b>' + q.a + '</b>' : esc(x)).join(' '); }
function finish(){
  S.on = false; const m = MODE[S.mode], tot = S.ok + S.bad, acc = tot ? Math.round(S.ok/tot*100) : 0;
  const isNew = S.score > (best[S.mode] || 0); if (isNew){ best[S.mode] = S.score; store.set('best', best); }
  show('sEnd');
  $('res').innerHTML = '<h2>' + esc(m.name) + '</h2><div class="big">' + S.score.toLocaleString() + '</div>' + (isNew && S.score ? '<span class="new">새 최고 기록!</span>' : '<div style="color:var(--sub);font-size:13px;margin-top:4px">최고 ' + (best[S.mode] || 0).toLocaleString() + '점</div>')
    + '<div class="grid4"><div><b>' + S.ok + '</b><small>맞힘</small></div><div><b>' + acc + '%</b><small>정확도</small></div><div><b>' + S.maxCombo + '</b><small>최대 콤보</small></div><div><b>' + S.lv + '</b><small>도달 단계</small></div></div>'
    + (S.wrong.length ? '<div class="review"><h3>틀리거나 넘긴 문제 다시 보기</h3>' + S.wrong.slice(-8).map(w=>'<div class="w"><span>' + fmtQ(w.q) + '</span><span><s>' + esc(w.you) + '</s></span></div>').join('') + '</div>' : '')
    + '<div class="lbBox" style="margin:0 0 12px"><h3>' + esc(m.name) + ' 랭킹</h3><div class="lb" id="endLb"><div class="empty">불러오는 중…</div></div></div>'
    + '<div class="btns"><button id="bMenu">다른 모드</button><button class="pri" id="bAgain">다시 하기</button></div>';
  $('bAgain').onclick = ()=>start(S.mode); $('bMenu').onclick = ()=>{ show('sMenu'); lbMode = S.mode; buildMenu(); loadRank($('lbList'), lbMode, 10); };
  const cat = 'math_' + S.mode, show5 = ()=>loadRank($('endLb'), S.mode, 5);
  if (S.score > 0 && mpOn) withAuth(ok=>{ if (ok) MP.submitScore(cat, S.score, 'desc', { n:S.ok }, show5); else show5(); }); else show5();
  try { if (mpOn && MP.addXP && S.ok) MP.addXP(Math.min(40, 5 + S.ok)); } catch(e){}
}

// ---------- 랭킹 ----------
const mpOn = !window.__mpFail && typeof firebase !== 'undefined' && window.MP && MP.isConfigured && MP.isConfigured();
let authQ = null;
function withAuth(cb){ if (!mpOn){ cb(false); return; } if (MP.uid){ cb(true); return; }
  if (authQ){ authQ.push(cb); return; }
  const q = authQ = [cb]; let fin = false;
  const done = ok=>{ if (fin) return; fin = true; authQ = null; clearTimeout(to); q.forEach(f=>f(ok)); };
  const to = setTimeout(()=>done(!!MP.uid), 8000);
  try { MP.initAuthOnly(u=>{ if (u) done(true); }); } catch(e){ done(false); } }
function loadRank(el, mode, limit){ if (!el) return; if (!mpOn){ el.innerHTML = '<div class="empty">오프라인이라 랭킹을 볼 수 없어요</div>'; return; }
  withAuth(ok=>{ if (!ok){ el.innerHTML = '<div class="empty">서버에 연결하지 못했어요</div>'; return; }
    MP.fetchLeaderboard('math_' + mode, { limit, direction:'desc' }, arr=>{ el.innerHTML = !arr.length ? '<div class="empty">아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!</div>'
      : arr.map((r, i)=>'<div class="r' + (r.uid === MP.uid ? ' me' : '') + '"><span class="n' + (i < 3 ? ' g' + (i + 1) : '') + '">' + (i + 1) + '</span><span class="nm">' + esc(r.name || '플레이어') + (r.uid === MP.uid ? ' (나)' : '') + '</span><small>' + (+r.n || 0) + '문제</small><span class="sc">' + (+r.score || 0).toLocaleString() + '</span></div>').join(''); }); }); }

buildMenu(); loadRank($('lbList'), lbMode, 10);
if (mpOn) withAuth(ok=>{ if (ok) try { MP.setPresence('math', null); } catch(e){} });
window.__MB = { S, MODES, input, finish };
})();
</script>
</body>
</html>
