<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>가장 강한 전장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0c10;font-family:'Montserrat','Malgun Gothic','Noto Sans KR',sans-serif;color:#fff;touch-action:none}
#c{display:block;width:100%;height:100%}
.hide{display:none!important}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#bottom{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(560px,92vw);display:flex;flex-direction:column;align-items:center;gap:6px}
#slots{display:flex;gap:6px;width:100%}
.slot{flex:1;position:relative;height:54px;border-radius:6px;background:rgba(14,15,20,.78);border:2px solid rgba(255,255,255,.14);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:4px 6px}
.slot .k{position:absolute;top:3px;left:6px;font-size:11px;font-weight:900;color:#9aa0ad}
.slot .n{font-size:10.5px;font-weight:800;line-height:1.15;color:#fff;text-shadow:0 1px 2px #000}
.slot .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);transition:none}
.slot .cdt{position:absolute;right:6px;top:3px;font-size:12px;font-weight:900;color:#ffd23d}
.slot.ready{border-color:rgba(255,255,255,.4)}
.slot.awk{border-color:#ffd23d;box-shadow:0 0 10px rgba(255,210,61,.35) inset}
#awkWrap{width:100%;display:flex;align-items:center;gap:8px}
#awkBar{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(255,255,255,.16);position:relative}
#awkFill{height:100%;width:0;background:linear-gradient(90deg,#2f7fff,#7fe8ff);transition:width .15s}
#awkBar.full #awkFill{background:linear-gradient(90deg,#ffd23d,#ff8a1f);animation:awkPulse .6s ease-in-out infinite alternate}
@keyframes awkPulse{to{filter:brightness(1.5)}}
#awkTxt{font-size:10px;font-weight:900;letter-spacing:.12em;color:#9fd8ff;min-width:92px;text-align:right}
#awkBar.full+#awkTxt{color:#ffd23d}
#hpWrap{width:100%;position:relative;height:22px;border-radius:4px;background:rgba(0,0,0,.65);border:2px solid rgba(255,255,255,.2);overflow:hidden}
#hpLag{position:absolute;left:0;top:0;bottom:0;background:#ff4d4d;transition:width .6s ease-out .25s}
#hpFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#5cf06a,#2bb33c)}
#hpTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;text-shadow:0 1px 2px #000}
#subBars{width:100%;display:flex;gap:8px;align-items:center;font-size:10px;font-weight:800;color:#c8ccd6}
.mini{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.mini i{display:block;height:100%;background:#fff}
#evaBar i{background:#7fe8ff}#guardBar i{background:#ffb35c}
#topL{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;pointer-events:auto}
.tb{height:34px;min-width:34px;padding:0 10px;border-radius:8px;border:none;background:rgba(14,15,20,.7);color:#fff;font:800 12px inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none}
.tb:hover{background:rgba(40,42,52,.85)}
#stat{position:absolute;top:52px;left:10px;font-size:12px;font-weight:800;color:#e6e8ee;text-shadow:0 1px 3px #000;line-height:1.6}
#stat b{color:#ffd23d}
#feed{position:absolute;top:10px;right:10px;width:min(330px,60vw);display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.kf{padding:5px 10px;border-radius:5px;background:rgba(14,15,20,.75);font-size:12px;font-weight:800;white-space:nowrap;animation:kfIn .25s ease-out}
.kf .me{color:#ffd23d}.kf .x{color:#ff6b6b;margin:0 6px}
@keyframes kfIn{from{opacity:0;transform:translateX(20px)}}
#board{position:absolute;top:10px;right:10px;margin-top:0;display:none;min-width:240px;border-radius:8px;background:rgba(14,15,20,.85);padding:8px 10px;font-size:12px;font-weight:800}
#board.show{display:block}
#board .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}#board .r.me{color:#ffd23d}
#combo{position:absolute;right:16%;top:38%;text-align:right;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#combo b{display:block;font-size:46px;font-weight:900;font-style:italic;line-height:1;color:#fff;text-shadow:3px 3px 0 #ff3d5a}
#combo span{font-size:13px;font-weight:900;letter-spacing:.2em;color:#ffd23d}
#combo em{display:block;font-style:normal;font-size:12px;color:#c8ccd6;margin-top:3px}
#moveName{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);font-size:clamp(26px,5vw,46px);font-weight:900;font-style:italic;letter-spacing:.04em;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.5),3px 3px 0 #000;opacity:0;white-space:nowrap}
#moveName.go{animation:mvn 1.6s ease-out}
@keyframes mvn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
#banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;opacity:0;pointer-events:none}
#banner.go{animation:bnr 2.4s ease-out}
#banner b{display:block;font-size:clamp(34px,7vw,68px);font-weight:900;font-style:italic;text-shadow:4px 4px 0 #000}
#banner span{font-size:14px;font-weight:800;color:#c8ccd6;letter-spacing:.1em}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}10%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#letterbox{position:fixed;inset:0;pointer-events:none;z-index:9}
#letterbox:before,#letterbox:after{content:'';position:absolute;left:0;right:0;height:0;background:#000;transition:height .25s ease}
#letterbox:before{top:0}#letterbox:after{bottom:0}
#letterbox.on:before,#letterbox.on:after{height:11vh}
#flash{position:fixed;inset:0;pointer-events:none;z-index:11;opacity:0;background:#fff}
#impact{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;mix-blend-mode:difference;background:#fff}
#vig{position:fixed;inset:0;pointer-events:none;z-index:7;background:radial-gradient(circle,rgba(255,0,0,0) 55%,rgba(200,0,0,.45));opacity:0;transition:opacity .25s}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5);z-index:12;pointer-events:none;display:none}
body.locked #cross{display:block}
#dmgs{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.dn{position:absolute;font-weight:900;font-size:18px;font-style:italic;color:#fff;text-shadow:2px 2px 0 #000;transition:transform .7s ease-out,opacity .7s ease-in;white-space:nowrap}
.dn.big{font-size:28px;color:#ffd23d}.dn.blk{color:#9fd8ff;font-size:14px}.dn.red{color:#ff6b6b}
#hint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);font-size:13px;font-weight:900;color:#ffd23d;text-shadow:0 2px 3px #000;opacity:0;transition:opacity .2s;white-space:nowrap}
#hint.on{opacity:1}
#respawn{position:absolute;left:50%;top:58%;transform:translateX(-50%);text-align:center;font-size:14px;font-weight:800;color:#c8ccd6;display:none}
#respawn b{display:block;font-size:30px;color:#ff6b6b;font-weight:900}
/* ---------- 터치 ---------- */
#touch{position:fixed;inset:0;pointer-events:none;z-index:13;display:none}
body.touch #touch{display:block}
#joy{position:absolute;left:0;bottom:0;width:42%;height:60%;pointer-events:auto}
#joyB{position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none}
#joyS{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.85);left:32px;top:32px}
#look{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto}
.tbtn{position:absolute;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;background:rgba(20,22,30,.55);border:2px solid rgba(255,255,255,.35);text-align:center;line-height:1.1}
.tbtn.on{background:rgba(255,255,255,.35)}
#tM1{right:22px;bottom:30px;width:84px;height:84px;font-size:15px;background:rgba(255,70,90,.4)}
#tJump{right:114px;bottom:22px;width:58px;height:58px}
#tBlock{right:22px;bottom:124px;width:58px;height:58px}
#tDash{right:178px;bottom:30px;width:56px;height:56px}
#tAwk{right:86px;bottom:124px;width:52px;height:52px;font-size:10px;background:rgba(47,127,255,.35)}
body.touch #bottom{bottom:8px;width:min(420px,52vw);left:36%}
body.touch .slot{pointer-events:auto;height:46px}
body.touch #slots{position:fixed;right:142px;bottom:98px;width:auto;display:grid;grid-template-columns:118px 118px;gap:5px}
body.touch #slots .slot{width:118px;height:44px;flex:none}
body.touch #cross{display:none}
/* ---------- 메뉴 ---------- */
#menu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:radial-gradient(ellipse at 30% 0%,rgba(60,40,10,.6),rgba(8,9,12,.97) 60%);overflow:auto}
#menu.hide{display:none}
#mTop{display:flex;align-items:center;gap:14px;padding:18px 22px 6px}
#logo{font-size:clamp(22px,4vw,36px);font-weight:900;font-style:italic;letter-spacing:.02em;line-height:1}
#logo i{font-style:italic;color:#ffd23d}
#logo small{display:block;font-size:11px;font-style:normal;letter-spacing:.3em;color:#9aa0ad;margin-top:4px}
#mTop .sp{flex:1}
#modes{display:flex;gap:8px;padding:10px 22px;flex-wrap:wrap}
.md{border:none;border-radius:10px;padding:11px 16px;background:rgba(255,255,255,.07);color:#cfd3dc;font:800 13px inherit;font-family:inherit;cursor:pointer;text-align:left}
.md b{display:block;font-size:14px;color:#fff}.md span{font-size:11px;color:#9aa0ad;font-weight:700}
.md.on{background:#ffd23d;color:#111}.md.on b{color:#111}.md.on span{color:#4a3a00}
#cWrap{flex:1;display:flex;gap:16px;padding:6px 22px 22px;min-height:0;flex-wrap:wrap}
#grid{flex:1.3;min-width:300px;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;align-content:start}
.ch{position:relative;border:2px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 10px 9px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.ch:hover{border-color:rgba(255,255,255,.3)}
.ch.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset,0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
.ch .ic{position:absolute;top:6px;right:8px;font-size:28px;opacity:.9}
.ch .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ch b{font-size:13px;line-height:1.2}.ch span{font-size:10px;color:#9aa0ad;font-weight:700;margin-top:2px}
.ch .new{position:absolute;top:6px;left:8px;font-size:9px;font-weight:900;padding:1px 5px;border-radius:4px;background:#ff3d5a}
#info{flex:1;min-width:280px;border-radius:12px;background:rgba(255,255,255,.04);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
#info h2{font-size:22px;font-weight:900;font-style:italic}
#info .sub{font-size:12px;color:#9aa0ad;font-weight:700}
#info .mv{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#info .mv div{border-radius:6px;background:rgba(0,0,0,.3);padding:6px 8px;font-size:11px;font-weight:700;color:#c8ccd6}
#info .mv div b{display:block;color:#fff;font-size:12px}
#info .mv .aw{border-left:3px solid #ffd23d}
#info .lbl{font-size:11px;font-weight:900;letter-spacing:.14em;color:#9aa0ad;margin-top:4px}
#info .pas{font-size:11px;color:#ffd23d;font-weight:800}
#go{margin-top:auto;border:none;border-radius:10px;padding:15px;background:#ffd23d;color:#111;font:900 18px inherit;font-family:inherit;cursor:pointer;letter-spacing:.06em;box-shadow:0 5px 0 #b58a00}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 #b58a00}
#diffRow{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:800;color:#9aa0ad}
#diffRow button{border:none;border-radius:6px;padding:6px 10px;background:rgba(255,255,255,.08);color:#cfd3dc;font:800 11px inherit;font-family:inherit;cursor:pointer}
#diffRow button.on{background:#fff;color:#111}
#fixes{font-size:11px;color:#9aa0ad;line-height:1.7;font-weight:700}
#fixes b{color:#7fe8ff}
#keys{font-size:11px;color:#9aa0ad;font-weight:700;line-height:1.8}
#keys kbd{display:inline-block;min-width:20px;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.12);color:#fff;font:800 10px inherit;font-family:inherit;text-align:center;margin-right:3px}
#pause{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#pause.show{display:flex}
#pause .box{display:flex;flex-direction:column;gap:8px;min-width:240px}
#pause button{border:none;border-radius:10px;padding:13px;font:900 14px inherit;font-family:inherit;cursor:pointer;background:#fff;color:#111}
#pause button.alt{background:rgba(255,255,255,.12);color:#fff}
#err{position:fixed;left:10px;bottom:10px;z-index:99;color:#ff9a9a;font-size:11px;max-width:80vw;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="letterbox"></div><div id="impact"></div><div id="flash"></div><div id="vig"></div><div id="cross"></div><div id="dmgs"></div>
<div id="hud" class="hide">
  <div id="topL"><a class="tb" href="hub.html" title="허브로">⌂</a><button class="tb" id="menuBtn" type="button">☰ 캐릭터</button><button class="tb" id="tabBtn" type="button">TAB 순위</button></div>
  <div id="stat"></div>
  <div id="feed"></div><div id="board"></div>

    <div id="slots"></div>
    <div id="awkWrap"><div id="awkBar"><div id="awkFill"></div></div><div id="awkTxt">AWAKENING 0%</div></div>

    <div id="subBars"><span>회피</span><div class="mini" id="evaBar"><i></i></div><span>가드</span><div class="mini" id="guardBar"><i></i></div><span id="dashTxt">대시</span></div>
  </div>
</div>

  <div class="tbtn" id="tM1">M1</div><div class="tbtn" id="tJump">점프</div><div class="tbtn" id="tBlock">막기</div><div class="tbtn" id="tDash">대시</div><div class="tbtn" id="tAwk">각성</div></div>
<div id="menu">
  <div id="mTop"><div id="logo">가장 <i>강한</i> 전장<small>THE STRONGEST BATTLEGROUNDS · PLAY HUB EDITION</small></div><div class="sp"></div><a class="tb" href="hub.html">⌂ 허브</a></div>

</div>

<script>
(function(){
'use strict';
// =====================================================================
//  가장 강한 전장 — 로블록스 The Strongest Battlegrounds 를 따라 만든 격투 게임
//  · M1 4연타(마지막 타는 넘어뜨림) · 어퍼컷/다운슬램 · 앞/옆 대시 · 막기 · 회피(래그돌 캔슬) · 각성
//  · 캐릭터마다 기본기 4개 + 각성기 4개
//  · 원작의 문제점 보완: 다구리 보정, 킬 스틸 방지, 무한 콤보 방지(콤보 브레이커), 막을 수 없는 기술은 빨갛게 예고,
//    스폰 보호, 모든 캐릭터 무료, 1대1 결투 모드, 콤보 연습장
// =====================================================================
const $ = id=>document.getElementById(id);
const T = THREE, V = (x, y, z)=>new T.Vector3(x || 0, y || 0, z || 0), CL = (v, a, b)=>v < a ? a : v > b ? b : v, lerp = (a, b, t)=>a + (b - a)*t;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0; if (isTouch) document.body.classList.add('touch');
const MP = window.MP || null, mpOn = !!(MP && MP.isConfigured && MP.isConfigured() && !window.__mpFail && window.firebase);
const rand = (a, b)=>a + Math.random()*(b - a), pick = a=>a[Math.floor(Math.random()*a.length)];

// ---------- 렌더러 · 장면 ----------
const ren = new T.WebGLRenderer({ canvas:$('c'), antialias:!isTouch, powerPreference:'high-performance' });
ren.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2)); ren.setSize(innerWidth, innerHeight);
ren.outputEncoding = T.sRGBEncoding; ren.toneMapping = T.ACESFilmicToneMapping; ren.toneMappingExposure = 1.0;
ren.shadowMap.enabled = true; ren.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene(); scene.fog = new T.Fog(0xbfd9f2, 120, 360);
const cam = new T.PerspectiveCamera(70, innerWidth/innerHeight, .1, 900); cam.rotation.order = 'YXZ';
addEventListener('resize', ()=>{ cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });
const hemi = new T.HemisphereLight(0xe8f2ff, 0x5a6a4a, .85); scene.add(hemi);
const sun = new T.DirectionalLight(0xfff2dc, 1.25); sun.position.set(60, 110, 40); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-60, right:60, top:60, bottom:-60, near:10, far:300 }); sun.shadow.bias = -.0005; scene.add(sun); scene.add(sun.target);
// 하늘 (로블록스 기본 하늘 느낌)
const sky = new T.Mesh(new T.SphereGeometry(800, 32, 16), new T.ShaderMaterial({ side:T.BackSide, depthWrite:false, fog:false, uniforms:{ top:{ value:new T.Color(0x3b82e0) }, bot:{ value:new T.Color(0xd8ecff) } },
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=clamp(vP.y*1.5+.05,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(h,.7)),1.);}' }));
sky.renderOrder = -1; scene.add(sky);

const SOLIDS = []; const ARENA = 120;

const AU = { c:null };

function nz(dur, f0, f1, type, g, q, at){ const C = AU.c; if (!C) return; const t = C.currentTime + (at || 0), s = C.createBufferSource(); s.buffer = AU.nb; const f = C.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 1;
  const gn = C.createGain(); gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(f); f.connect(gn); gn.connect(AU.o); s.start(t, Math.random()); s.stop(t + dur + .05); }
function tn(f0, f1, dur, type, g, at){ const C = AU.c; if (!C) return; const t = C.currentTime + (at || 0), o = C.createOscillator(), gn = C.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(gn); gn.connect(AU.o); o.start(t); o.stop(t + dur + .05); }

function pickTarget(f){ let best = null, bs = 1e9; const es = enemiesOf(f);
  for (const e of es){ if (e.dummy) continue; let n = 0; for (const o of F_LIST) if (o !== f && o.ai && o.ai.target === e) n++;
    const s = e.pos.distanceTo(f.pos) + n*14 + (e.spawnProt > GT ? 30 : 0) - (f.dmgBy[e.id] ? 10 : 0); if (s < bs){ bs = s; best = e; } } return best; }

function aiTick(f, dt){ const B = f.ai; if (!f.alive){ f.input.set(0, 0, 0); return; }
  if (f.dummy){ f.input.set(0, 0, 0); if (G.dummyFight && canAct(f)){ const t = nearestEnemy(f, 4); if (t && Math.random() < dt*1.5) doM1(f); } return; }

  if (busy(f)){ f.input.set(0, 0, 0); f.blocking = false;
    if ((f.breaker || (f.eva >= 100 && (f.comboDmg > 14 || f.ragT > 0))) && !f.grabbed && Math.random() < dt*B.D*4) doEvasive(f); return; }
  if (B.think <= 0){ B.think = rand(.6, 1.4); const t = pickTarget(f); B.target = t; B.strafe = Math.random() < .5 ? -1 : 1; }

  const to = t.pos.clone().sub(f.pos); to.y = 0; const d = to.length(), dir = d > .01 ? to.clone().divideScalar(d) : fwdOf(f);

  f.blocking = B.blockT > GT && !f.act && f.guard > 15;

  if (f.act){ f.input.set(0, 0, 0); return; }

  const reach = 3.9;
  if (d < reach){
    if (B.moveT <= 0 && Math.random() < .5 + B.D*.4){ const ready = [0, 1, 2, 3].filter(i=>moveReady(f, i)); if (ready.length){ B.moveT = rand(1.2, 3.2)/(.6 + B.D); if (useMove(f, pick(ready))) return; } }
    f.wantUp = f.m1i === 2 && Math.random() < .5;

  if (d > 12 && GT >= f.dashCd && Math.random() < dt*B.D*1.4){ doDash(f, { x:0, z:1 }); return; }
