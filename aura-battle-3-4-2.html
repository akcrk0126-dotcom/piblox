<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>아우라 배틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#87CEEB; font-family: -apple-system, 'Malgun Gothic', sans-serif; touch-action:none; cursor:none; }
  #canvas { display:block; width:100%; height:100%; cursor:none; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #title { position:absolute; top:14px; left:50%; transform:translateX(-50%); color:#fff; font-size:15px; font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.5); letter-spacing:1px; }
  #hint { position:absolute; top:38px; left:50%; transform:translateX(-50%); color:#fff; font-size:11px; opacity:.85; text-shadow:0 1px 4px rgba(0,0,0,.5); text-align:center; }

  /* Joystick - 로블록스 모바일과 동일하게 좌측 하단에 고정 위치 */
  #joyZone { position:fixed; left:10px; bottom:10px; width:180px; height:180px; pointer-events:auto; }
  #joyBase { position:fixed; left:40px; bottom:40px; width:120px; height:120px; border-radius:50%;
    background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.35);
    box-shadow:inset 0 0 16px rgba(0,0,0,.25); transition:background .12s ease, border-color .12s ease; }
  #joyBase.active { background:rgba(0,0,0,.45); border-color:rgba(255,255,255,.55); }
  #joyStick { position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px;
    border-radius:50%; background:rgba(255,255,255,.92); box-shadow:0 3px 10px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.12);
    transition:transform .04s linear; }

  /* Camera drag zone */
  #camZone { position:absolute; right:0; bottom:0; width:55%; height:100%; pointer-events:auto; }

  /* Jump button - 로블록스 모바일과 동일하게 우측 하단에 고정 위치, ▲ 아이콘 */
  #jumpBtn { position:fixed; right:40px; bottom:40px; width:75px; height:75px; border-radius:50%;
    background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.35); pointer-events:auto;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:26px; line-height:1;
    text-shadow:0 1px 4px rgba(0,0,0,.4); }
  #jumpBtn:active { background:rgba(255,255,255,.3); }

  /* Shift lock toggle - 로블록스 모바일과 동일하게 우측 상단 알약형 버튼 */
  #lockBtn { position:fixed; top:16px; right:16px; left:auto; bottom:auto; width:auto; height:auto; z-index:15;
    padding:8px 14px; border-radius:20px;
    background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.35); pointer-events:auto;
    display:flex; align-items:center; justify-content:center; gap:5px;
    color:#fff; font-size:12px; font-weight:800; letter-spacing:.3px; line-height:1;
    box-shadow:0 3px 10px rgba(0,0,0,.3); transition:background .15s ease, border-color .15s ease, box-shadow .15s ease; }
  #lockBtn.active { background:#1e88ff; border-color:#fff; box-shadow:0 0 14px rgba(30,136,255,.85), 0 3px 10px rgba(0,0,0,.35); }
  #lockBtn .lockLabel { display:inline; }

  /* Fullscreen toggle: 잠금 버튼 아래쪽의 작은 확대 아이콘 버튼 - 터치/데스크톱 공통으로 항상 표시 */
  #fsBtn { position:fixed; top:60px; right:16px; width:36px; height:36px; border-radius:50%; z-index:15;
    background:rgba(20,20,30,.55); border:2px solid rgba(255,255,255,.55); pointer-events:auto;
    display:flex; align-items:center; justify-content:center; font-size:16px; line-height:1;
    box-shadow:0 3px 10px rgba(0,0,0,.35); transition:background .15s ease, border-color .15s ease; }
  #fsBtn.active { background:#1e88ff; border-color:#fff; }

  /* 터치 기기가 아니면 모바일 조작 클러스터(조이스틱/점프)는 숨김 - 데스크톱은 WASD·마우스·단축키 사용 */
  /* 시점고정(lockBtn)과 전체화면(fsBtn)은 PC에서도 클릭으로 써야 하므로 항상 표시 */
  body:not(.has-touch) #joyZone,
  body:not(.has-touch) #jumpBtn { display:none !important; }

  #speedTag { position:absolute; top:66px; right:14px; padding:8px 12px; border-radius:20px; background:rgba(0,0,0,.35); color:#fff; font-size:11px; font-weight:700; }

  #crosshair { position:fixed; top:50%; left:50%; width:16px; height:16px; margin:-8px 0 0 -8px; pointer-events:none; z-index:25; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,.9); box-shadow:0 0 2px rgba(0,0,0,.7); }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #crosshair::after { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }

  /* ===== 아우라 가챠 ===== */
  #gachaBtn { position:absolute; right:32px; bottom:142px; width:74px; height:74px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #8a6bff, #4a2fb8 65%, #2a1a70); border:3px solid rgba(255,255,255,.7);
    pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    color:#fff; font-size:11px; font-weight:800; font-family:inherit; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.4), 0 0 22px rgba(150,110,255,.65); text-shadow:0 1px 4px rgba(0,0,0,.5); }
  #gachaBtn .dice { font-size:24px; line-height:1; }
  #gachaBtn:active { transform:scale(.94); }
  #gachaBtn:disabled { opacity:.45; pointer-events:none; }

  #auraBadge { position:absolute; top:66px; left:50%; transform:translateX(-50%); display:none; align-items:center; gap:7px;
    padding:6px 14px; border-radius:20px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.35);
    color:#fff; font-size:11px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.5); white-space:nowrap; }
  #auraBadge em { font-style:normal; opacity:.75; margin-left:2px; }
  .badgeDot { width:9px; height:9px; border-radius:50%; flex:none; }

  #auraTag { position:fixed; left:0; top:0; pointer-events:none; z-index:30; padding:4px 4px; border-radius:10px;
    text-align:center; white-space:nowrap; opacity:0; transform:translate(-50%,-100%) scale(.7);
    transition:opacity .5s ease, transform .4s cubic-bezier(.34,1.56,.64,1); }
  #auraTag .tagName { font-size:16px; font-weight:900; letter-spacing:.5px; }
  #auraTag .tagName.font-cursive { font-family:'Dancing Script', cursive; font-size:22px; font-weight:700; letter-spacing:1px; }
  #auraTag .tagName.font-fantasy { font-family:'Cinzel Decorative', serif; font-size:15px; font-weight:900; letter-spacing:1.5px; }
  #auraTag .windWrap { position:relative; display:inline-block; }
  #auraTag .windWrap::before, #auraTag .windWrap::after {
    content:''; position:absolute; top:50%; left:50%; width:140%; height:140%;
    border:1.5px dashed currentColor; border-radius:50%; opacity:.35; pointer-events:none;
    transform:translate(-50%,-50%) rotate(0deg);
  }
  #auraTag .windWrap::before { animation: windSpin1 2.6s linear infinite; border-top-color:transparent; border-bottom-color:transparent; }
  #auraTag .windWrap::after { animation: windSpin2 3.6s linear infinite reverse; width:170%; height:170%; border-left-color:transparent; border-right-color:transparent; opacity:.22; }
  @keyframes windSpin1 { from{ transform:translate(-50%,-50%) rotate(0deg); } to{ transform:translate(-50%,-50%) rotate(360deg); } }
  @keyframes windSpin2 { from{ transform:translate(-50%,-50%) rotate(0deg); } to{ transform:translate(-50%,-50%) rotate(360deg); } }
  #auraTag .tagProb { font-size:11px; font-weight:700; opacity:.9; margin-top:1px; }
  #auraTag .tagTrait { font-size:10px; font-weight:700; opacity:.8; margin-top:2px; color:#fff; }
  /* 등급별 색상은 AURA_TIERS로부터 동적으로 생성되어 주입됨 (아래 JS 참고) */
  @keyframes legendaryPulse {
    0%,100% { filter:drop-shadow(0 0 12px rgba(255,180,0,.85)); }
    50%     { filter:drop-shadow(0 0 24px rgba(255,100,0,1)); }
  }
  @keyframes legendaryTextGlow {
    0%,100% {
      text-shadow:
        0 0 6px rgba(255,255,255,.85),
        0 0 14px rgba(255,180,0,.85),
        0 0 24px rgba(255,110,0,.7);
    }
    50% {
      text-shadow:
        0 0 10px rgba(255,255,255,1),
        0 0 22px rgba(255,200,0,1),
        0 0 40px rgba(255,90,0,1);
    }
  }
  /* ===== 추후 추가 예정인 텍스트 연출 (지금은 정의만 해두고 아직 적용 안 함) =====
     .tagName.fx-shake     : 살짝 흔들리는 글씨 (등급이 더 올라가면 추가 예정)
     .tagName.fx-mono-glow : 흑백 명암 대비 + 스캔라인 느낌의 간지나는 텍스트
  */
  .tagName.fx-shake { animation: tagShake .35s ease-in-out infinite; }
  @keyframes tagShake {
    0%,100%  { transform:translate(0,0); }
    20%      { transform:translate(-1px,1px); }
    40%      { transform:translate(1px,-1px); }
    60%      { transform:translate(-1px,-1px); }
    80%      { transform:translate(1px,1px); }
  }
  .tagName.fx-mono-glow {
    color:#f5f5f5;
    text-shadow:0 0 4px #fff, 0 0 12px #ccc, 0 0 22px #999;
    filter:grayscale(1) contrast(1.3);
  }

  #gachaOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); z-index:50; pointer-events:auto; transition:background .35s ease; }
  #gachaOverlay.show { background:rgba(0,0,0,.72); }

  #multOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); z-index:55; pointer-events:none; transition:background .2s ease; }
  #multOverlay.show { background:rgba(0,0,0,.6); }
  #multText { font-weight:900; text-align:center; letter-spacing:1px; transform:scale(0.3); opacity:0;
    transition:transform .22s cubic-bezier(.34,1.9,.64,1), opacity .18s ease; }
  #multOverlay.show #multText { transform:scale(1); opacity:1; }
  #multText.shake { animation: multShake .45s ease-in-out; }
  @keyframes multShake {
    0%,100% { transform:translate(0,0) scale(1); }
    20% { transform:translate(-7px,4px) scale(1.05); }
    40% { transform:translate(7px,-4px) scale(1.05); }
    60% { transform:translate(-5px,3px) scale(1.03); }
    80% { transform:translate(5px,-3px) scale(1.03); }
  }
  #gachaPanel { width:260px; background:linear-gradient(180deg,#241a44,#100a24); border:2px solid rgba(255,255,255,.25);
    border-radius:18px; padding:14px; box-shadow:0 20px 60px rgba(0,0,0,.6);
    transform:scale(.85); opacity:0; transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
  #gachaOverlay.show #gachaPanel { transform:scale(1); opacity:1; }
  #gachaTitle { text-align:center; color:#fff; font-size:13px; font-weight:800; letter-spacing:2px; margin-bottom:10px; opacity:.8; }
  #gachaWindow { position:relative; height:340px; overflow:hidden; border-radius:12px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.15); }
  #gachaWindow::before, #gachaWindow::after { content:''; position:absolute; left:0; right:0; height:110px; z-index:2; pointer-events:none; }
  #gachaWindow::before { top:0; background:linear-gradient(#100a24, transparent); }
  #gachaWindow::after { bottom:0; background:linear-gradient(transparent, #100a24); }
  #gachaCenterLine { position:absolute; left:6px; right:6px; top:136px; height:68px; border-radius:8px;
    box-shadow:0 0 0 2px rgba(255,255,255,.6) inset, 0 0 18px rgba(255,255,255,.3); z-index:3; pointer-events:none; }
  #gachaReel { position:relative; will-change:transform; }
  .reelItem { height:68px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .reelItem .reelName { font-size:16px; font-weight:900; text-shadow:0 2px 6px rgba(0,0,0,.6); transition:transform .1s ease; }
  .reelItem .reelProb { font-size:10px; font-weight:700; opacity:.7; color:#fff; }
  .reelItem.tickFlash .reelName { transform:scale(1.15); }
  .reelItem.winner { animation:winnerPop .5s ease; }
  @keyframes winnerPop { 0%{ transform:scale(1); } 45%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
  /* reelItem 등급별 색상도 AURA_TIERS로부터 동적으로 생성되어 주입됨 */

  /* ===== 아우라 도감 ===== */
  #dexBtn { position:absolute; top:66px; left:14px; padding:8px 12px; border-radius:20px;
    background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.5); pointer-events:auto;
    color:#fff; font-size:11px; font-weight:700; font-family:inherit; cursor:pointer; }
  #dexBtn:active { background:rgba(255,255,255,.25); }

  /* ===== 물약 상점 / 인벤토리 버튼 ===== */
  #shopBtn, #invBtn, #leaderboardBtn { position:absolute; left:14px; padding:8px 12px; border-radius:20px;
    background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.5); pointer-events:auto;
    color:#fff; font-size:11px; font-weight:700; font-family:inherit; cursor:pointer; }
  #shopBtn { top:110px; }
  #invBtn { top:154px; }
  #leaderboardBtn { top:198px; border-color:rgba(255,215,0,.6); }
  #battleBtn { position:absolute; left:14px; top:242px; padding:8px 12px; border-radius:20px;
    background:rgba(0,0,0,.35); border:2px solid rgba(255,90,80,.6); pointer-events:auto;
    color:#fff; font-size:11px; font-weight:700; font-family:inherit; cursor:pointer; }

  /* 공격/스킬: 점프 버튼 옆에 부채꼴로 붙는 원형 액션 버튼(모바일 게임 컨벤션) */
  #fieldAttackBtn, #fieldSkillBtn { position:fixed; bottom:52px; border-radius:50%; pointer-events:auto; z-index:15;
    display:flex; align-items:center; justify-content:center; flex-direction:column; cursor:pointer;
    background:rgba(0,0,0,.4); box-shadow:0 4px 12px rgba(0,0,0,.35); }
  #fieldAttackBtn { right:132px; width:58px; height:58px; border:3px solid rgba(255,255,255,.7); }
  #fieldSkillBtn { right:96px; bottom:126px; width:64px; height:64px; border:3px solid rgba(155,79,224,.85); }
  #fieldAttackBtn .fabIcon { font-size:22px; }
  #fieldSkillBtn .fabIcon { font-size:24px; }
  #fieldAttackBtn:active, #fieldSkillBtn:active { background:rgba(255,255,255,.25); }
  #fieldSkillBtn.onCooldown, #fieldAttackBtn.onCooldown { opacity:.45; pointer-events:none; }
  #fieldSkillCdText { font-size:10px; font-weight:800; margin-top:1px; font-variant-numeric:tabular-nums; }
  #fieldSkillToast { position:fixed; top:38%; left:50%; transform:translate(-50%,-50%) scale(0.7); z-index:40;
    color:#fff; font-size:20px; font-weight:900; text-align:center; letter-spacing:1px; pointer-events:none;
    opacity:0; text-shadow:0 0 16px rgba(0,0,0,.8), 0 2px 4px rgba(0,0,0,.6); transition:opacity .2s ease, transform .2s ease; }
  #fieldSkillToast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #shopBtn:active, #invBtn:active, #leaderboardBtn:active, #battleBtn:active { background:rgba(255,255,255,.25); }
  #invBtn .invBadgeDot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#ffd700; margin-left:4px; box-shadow:0 0 6px #ffd700; vertical-align:middle; }

  #leaderboardOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); z-index:50; pointer-events:auto; transition:background .3s ease; }
  #leaderboardOverlay.show { background:rgba(0,0,0,.78); }
  #leaderboardPanel { width:min(94vw,380px); max-height:80vh; overflow-y:auto; background:linear-gradient(180deg,#241a44,#100a24);
    border:2px solid rgba(255,215,0,.35); border-radius:18px; padding:16px;
    transform:scale(.9); opacity:0; transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .25s ease; }
  #leaderboardOverlay.show #leaderboardPanel { transform:scale(1); opacity:1; }
  .lbRow2 { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); margin-top:6px; }
  .lbRow2 .lbRank { width:22px; font-weight:900; color:#ffd700; font-size:12px; text-align:center; }
  .lbRow2 .lbName2 { flex:1; color:#fff; font-size:12px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lbRow2 .lbAura { font-size:11px; font-weight:800; }

  /* ===== 배틀 오버레이 ===== */
  #battleOverlay { position:fixed; inset:0; display:none; flex-direction:column;
    background:linear-gradient(180deg,#1a1030,#0a0714); z-index:70; pointer-events:auto; color:#fff; }
  #battleTop { flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px; gap:14px; }
  .battleUnit { display:flex; flex-direction:column; gap:6px; }
  .battleUnitHead { display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:800; }
  .battleHpWrap { height:16px; border-radius:8px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); overflow:hidden; position:relative; }
  .battleHpFill { height:100%; background:linear-gradient(90deg,#4CE07A,#2ecc71); transition:width .35s ease; }
  .battleHpFill.enemy { background:linear-gradient(90deg,#ff6b5c,#e5433c); }
  .battleHpText { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  .battleStatusRow { display:flex; gap:6px; min-height:18px; }
  .statusChip { font-size:9px; font-weight:800; padding:2px 7px; border-radius:10px; background:rgba(255,255,255,.15); }
  #battleVs { text-align:center; font-size:20px; opacity:.4; font-weight:900; }
  #battleLog { height:110px; overflow-y:auto; background:rgba(0,0,0,.35); border-radius:12px; padding:10px 12px; font-size:12px; line-height:1.7; }
  #battleLog div.logLine { opacity:.85; }
  #battleActions { display:flex; gap:8px; padding:16px 20px 26px; flex:none; }
  .battleActBtn { flex:1; padding:14px 6px; border-radius:14px; border:none; font-weight:800; font-size:13px; cursor:pointer; color:#fff; }
  #battleAtkBtn { background:linear-gradient(180deg,#4a5568,#2d3440); }
  #battleSkillBtn { background:linear-gradient(180deg,#ff7a5c,#c8281a); }
  #battleSkillBtn:disabled { background:linear-gradient(180deg,#555,#333); opacity:.55; }
  #battleDefBtn { background:linear-gradient(180deg,#4a90c8,#2c5a8a); }
  #battleCloseBtn { position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff; font-size:16px; }
  #battleResultModal { position:fixed; inset:0; z-index:72; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.7); }
  #battleResultPanel { width:min(86vw,320px); text-align:center; background:linear-gradient(180deg,#2a2350,#140f28);
    border:2px solid rgba(255,215,0,.4); border-radius:18px; padding:28px 20px; }
  #battleResultTitle { font-size:22px; font-weight:900; margin-bottom:10px; }
  #battleResultDesc { font-size:12px; color:rgba(255,255,255,.7); margin-bottom:20px; line-height:1.6; }

  #dexOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); z-index:50; pointer-events:auto; transition:background .3s ease; }
  #dexOverlay.show { background:rgba(0,0,0,.78); }
  #dexPanel { width:min(94vw, 420px); max-height:82vh; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#241a44,#100a24); border:2px solid rgba(255,255,255,.25);
    border-radius:18px; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.6);
    transform:scale(.9); opacity:0; transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .25s ease; }
  #dexOverlay.show #dexPanel { transform:scale(1); opacity:1; }
  #dexHeader { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  #dexTitle { color:#fff; font-size:14px; font-weight:800; letter-spacing:1px; }
  #dexCloseBtn { width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.1); color:#fff; font-size:14px; font-family:inherit; cursor:pointer; pointer-events:auto; }
  #dexProgress { color:#fff; font-size:11px; opacity:.7; text-align:center; margin-bottom:10px; }

<script>
  function showError(title, detail){
    const panel = document.getElementById('errorPanel');
    const box = document.getElementById('errorBox');
    box.innerHTML = '<b>⚠ ' + title + '</b>' + (detail||'');
    panel.classList.add('show');
  }
  window.addEventListener('error', function(e){
    const msg = e.message || 'Unknown error';
    const loc = (e.filename ? (e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno) : '');
    showError('오류 발생', msg + (loc ? ('\n(' + loc + ')') : '\n(외부 스크립트에서 발생 - crossorigin 문제일 수 있음)') + (e.error && e.error.stack ? ('\n\n' + e.error.stack) : ''));
  });
</script>

<div id="mpStatus" style="position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.55);color:#fff;font:700 12px sans-serif;padding:6px 12px;border-radius:14px;pointer-events:none;">연결 중...</div>
<script>
(function(){
  // ---------- 터치 기기 감지: 터치가 인식되면 조이스틱/점프/시점고정 클러스터 표시 ----------
  const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0;
  if (isTouchDevice) document.body.classList.add('has-touch');

  // ---------- Scene setup ----------
  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5e6c8);
  scene.fog = new THREE.Fog(0xf5e6c8, 65, 230);

  const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 500);

  // ---------- Bloom 후처리 (로딩 실패해도 게임 전체가 멈추지 않도록 안전하게 폴백) ----------
  let composer = null, bloomPass = null;
  try {
    if (!window.__postfxFail && THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass){
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));
      bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.05, 0.45, 0.88);
      composer.addPass(bloomPass);
    }
  } catch (e) { composer = null; bloomPass = null; }

  function resize(){
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    if (composer){
      composer.setSize(window.innerWidth, window.innerHeight);
      if (bloomPass) bloomPass.resolution.set(window.innerWidth, window.innerHeight);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Lights ----------
  const hemi = new THREE.HemisphereLight(0xffd9a8, 0x5c7048, 0.62);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffb877, 1.05);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096,4096);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.03;
  sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
  sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
  sun.shadow.camera.far = 150;
  scene.add(sun);

  // ---------- 잔디 섬 ----------
  scene.fog = new THREE.Fog(0xf5e6c8, 65, 230);
  scene.background = new THREE.Color(0xf5e6c8);

  function makeGrassTexture(){
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#4CA84A'; ctx.fillRect(0,0,512,512);
    // 큰 얼룩으로 명암 베이스 (지형 느낌)
    for (let i=0; i<300; i++){
      const x = Math.random()*512, y = Math.random()*512;
      const r = 14 + Math.random()*30;
      ctx.fillStyle = Math.random() < 0.5
        ? `rgba(58,140,55,${0.10+Math.random()*0.1})`
        : `rgba(120,190,80,${0.08+Math.random()*0.1})`;
      ctx.beginPath(); ctx.ellipse(x,y,r,r*0.65,Math.random()*Math.PI,0,Math.PI*2); ctx.fill();
    }
    // 짧은 풀잎 붓터치를 빽빽하게 그려서 "들판에 촘촘한 잔디" 느낌을 텍스처 자체에 표현
    const bladeColors = ['#3E8F3E','#5CB85C','#347A34','#6FC96A','#4AA34A'];
    for (let i=0; i<5000; i++){
      const x = Math.random()*512, y = Math.random()*512;
      const len = 4 + Math.random()*7;
      const ang = -Math.PI/2 + (Math.random()-0.5)*1.1; // 대체로 위쪽을 향하되 살짝 흩어짐
      ctx.strokeStyle = bladeColors[(Math.random()*bladeColors.length)|0];
      ctx.globalAlpha = 0.55 + Math.random()*0.35;
      ctx.lineWidth = 1 + Math.random()*1.2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(
        x + Math.cos(ang)*len*0.5 + (Math.random()-0.5)*3, y + Math.sin(ang)*len*0.5,
        x + Math.cos(ang)*len, y + Math.sin(ang)*len
      );
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(14, 14);
    return tex;
  }

  function makeDirtTexture(){
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#7a5a3a'; ctx.fillRect(0,0,256,128);
    for (let i=0; i<600; i++){
      const x = Math.random()*256, y = Math.random()*128;
      ctx.fillStyle = Math.random()<0.5 ? 'rgba(60,42,26,0.3)' : 'rgba(140,105,70,0.25)';
      ctx.fillRect(x, y, 3+Math.random()*4, 2+Math.random()*3);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(12, 2);
    return tex;
  }

  // ================= 로비 맵 (lobby-map.html에서 이식) =================
function createLobbyMap(scene){
  const lobby = new THREE.Group();
  lobby.name = 'LobbyMap';
  scene.add(lobby);

  // ================= 공용 재질 헬퍼 =================
  function makeToonGradient(steps){
    const c = document.createElement('canvas'); c.width = steps; c.height = 1;
    const ctx = c.getContext('2d');
    for (let i=0;i<steps;i++){
      const v = Math.round(38 + (i/(steps-1))*172); // 최고 밝기를 낮춰서 눈부신 흰 하이라이트 대신 묵직한 톤으로
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(i,0,1,1);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.NearestFilter; tex.magFilter = THREE.NearestFilter;
    return tex;
  }
  const toonGradient = makeToonGradient(4);
  function toon(color, opts){
    const safe = Object.assign({}, opts);
    delete safe.metalness; delete safe.roughness;
    return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: toonGradient }, safe));
  }
  function stdMat(color, opts){
    return new THREE.MeshStandardMaterial(Object.assign({ color }, opts||{}));
  }
  function addOutline(mesh, thickness){
    const outlineMat = new THREE.MeshBasicMaterial({ color:0x1a1410, side:THREE.BackSide });
    const outline = new THREE.Mesh(mesh.geometry, outlineMat);
    outline.userData.isOutlineShell = true;
    outline.scale.multiplyScalar(1 + (thickness||0.045));
    outline.renderOrder = -1;
    mesh.add(outline);
    return outline;
  }
  function addGroupOutlines(group, thickness){
    const targets = [];
    group.traverse(o=>{ if (o.isMesh && !o.userData.isOutlineShell) targets.push(o); });

  // ================= 절차적 텍스처 =================
  function makeCheckerMarbleTexture(colorA, colorB, tiles){
    const c = document.createElement('canvas'); c.width=512; c.height=512;
    const ctx = c.getContext('2d');
    const cell = 512/tiles;
    for (let y=0;y<tiles;y++){
      for (let x=0;x<tiles;x++){
        ctx.fillStyle = (x+y)%2===0 ? colorA : colorB;
        ctx.fillRect(x*cell, y*cell, cell, cell);
        // 타일 안쪽에 은은한 대리석 결 무늬
        ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x*cell+4, y*cell+cell*0.3);
        ctx.quadraticCurveTo(x*cell+cell*0.5, y*cell+cell*0.15, x*cell+cell-4, y*cell+cell*0.6);
        ctx.stroke();
      }
    }
    for (let i=0;i<1400;i++){
      ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.05})`;
      ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
    }
    // 그라우트(줄눈) 라인을 진하고 두껍게 - 고급 석재 바닥 테두리 느낌
    ctx.strokeStyle = 'rgba(30,22,10,.35)'; ctx.lineWidth = 4;
    for (let i=0;i<=tiles;i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(512,i*cell); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  function makeRuneCircleTexture(){
    const c = document.createElement('canvas'); c.width=1024; c.height=1024;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(36,24,72,0)'; ctx.fillRect(0,0,1024,1024);
    ctx.strokeStyle = '#c9a8ff'; ctx.lineWidth = 6;
    ctx.shadowColor = '#e0c9ff'; ctx.shadowBlur = 18;
    [150,260,380].forEach(r=>{ ctx.beginPath(); ctx.arc(512,512,r,0,Math.PI*2); ctx.stroke(); });
    ctx.beginPath();
    for (let i=0;i<=8;i++){
      const a = (i/8)*Math.PI*2 - Math.PI/2;
      const x=512+Math.cos(a)*380, y=512+Math.sin(a)*380;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
    ctx.font = '46px serif'; ctx.fillStyle = '#e0c9ff'; ctx.textAlign='center';
    const syms = ['✦','✧','◈','⟡','✵','◇','☆','✶'];
    for (let i=0;i<16;i++){
      const a = (i/16)*Math.PI*2;
      ctx.fillText(syms[i%syms.length], 512+Math.cos(a)*330, 512+Math.sin(a)*330);
    }
    return new THREE.CanvasTexture(c);
  }

  // ================= 파티클 유틸 =================
  // ---- 접지 그림자(간이 AO): 구조물 밑동에 짙은 원형 그림자를 깔아 접지감/입체감을 강화 ----
  const contactShadowTex = (function(){
    const c = document.createElement('canvas'); c.width=128; c.height=128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,'rgba(0,0,0,0.55)');
    g.addColorStop(0.65,'rgba(0,0,0,0.28)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  })();
  function addContactShadow(parentGroup, radius, yOffset, x, z){
    const disc = new THREE.Mesh(new THREE.CircleGeometry(radius,24), new THREE.MeshBasicMaterial({
      map: contactShadowTex, transparent:true, depthWrite:false, blending:THREE.MultiplyBlending
    }));
    disc.rotation.x = -Math.PI/2;
    disc.position.set(x||0, yOffset!=null ? yOffset : 0.03, z||0);
    parentGroup.add(disc);
    return disc;
  }

  function makeFloatingParticles(count, colorHex, radius, yMin, yMax){
    const c = document.createElement('canvas'); c.width=32; c.height=32;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(16,16,0,16,16,16);
    g.addColorStop(0, colorHex); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,32,32);
    const tex = new THREE.CanvasTexture(c);
    const positions = new Float32Array(count*3);
    const speeds = new Float32Array(count);
    for (let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2, r = Math.random()*radius;
      positions[i*3] = Math.cos(a)*r;
      positions[i*3+1] = yMin + Math.random()*(yMax-yMin);
      positions[i*3+2] = Math.sin(a)*r;
      speeds[i] = 0.3 + Math.random()*0.6;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const mat = new THREE.PointsMaterial({ size:0.28, map:tex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
    const pts = new THREE.Points(geo, mat);
    pts.userData = { speeds, yMin, yMax };
    return pts;
  }
  function updateParticles(points, dt){
    const pos = points.geometry.attributes.position;
    const { speeds, yMin, yMax } = points.userData;
    for (let i=0;i<pos.count;i++){
      let y = pos.getY(i) + speeds[i]*dt;
      if (y > yMax) y = yMin;
      pos.setY(i, y);
    }
    pos.needsUpdate = true;
  }

  const SEA_Y = -3.2;

  function getTownHeight(x, z){
    const d = Math.hypot(x, z);
    let base;
    if (d < 58) base = 0.4;
    else if (d < 82) { const t=(d-58)/24; base = 0.4 - t*3.6; }
    else base = Math.max(SEA_Y-1.5, -3.2-(d-82)*0.1);
    const dg = Math.hypot(x-GACHA_X, z-GACHA_Z);
    const hillG = 3.0*Math.exp(-(dg*dg)/(2*9*9));
    return base + hillG;
  }

  const tmpC = new THREE.Color();
  for (let i=0;i<posAttr.count;i++){
    const x = posAttr.getX(i), z = posAttr.getZ(i);
    const y = getTownHeight(x,z);
    posAttr.setY(i, y);

    else if (d < 60){ tmpC.copy(TOWNC); }

    colors[i*3] = tmpC.r; colors[i*3+1] = tmpC.g; colors[i*3+2] = tmpC.b;

  function roundedRectShape(w, h, r){
    const s = new THREE.Shape();
    const x = -w/2, y = -h/2;
    s.moveTo(x, y+r);
    s.lineTo(x, y+h-r);
    s.quadraticCurveTo(x, y+h, x+r, y+h);
    s.lineTo(x+w-r, y+h);
    s.quadraticCurveTo(x+w, y+h, x+w, y+h-r);
    s.lineTo(x+w, y+r);
    s.quadraticCurveTo(x+w, y, x+w-r, y);
    s.lineTo(x+r, y);
    s.quadraticCurveTo(x, y, x, y+r);
    return s;

      (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen())?.catch(()=>{});
    } else {
      document.exitFullscreen && document.exitFullscreen().catch(()=>{});
    }
  }

  const keys = {};
  const MOVE_KEYS = ['Space','KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  window.addEventListener('keydown', e=>{
    if (MOVE_KEYS.includes(e.code)) e.preventDefault(); // 브라우저 기본 스크롤 등 개입 차단(스페이스 반응 지연 원인)
    keys[e.code] = true;
    if (e.code === 'Space' && !e.repeat) onJumpPress(e);
    if (e.code === 'KeyG' && !e.repeat) runGacha(); // PC 단축키: 마우스가 카메라 잠금 중이어도 항상 뽑기 가능

  // ---------- 오비 정밀 충돌 (벽/착지/천장, 장애물은 보이는 크기 그대로 - 여분 히트박스 없음) ----------
  const CHAR_HALF_W = 0.42; // 캐릭터 자신의 물리적 반너비 (장애물 쪽엔 패딩 없음)
  const CHAR_HEIGHT = 3.0;  // 캐릭터 물리적 키(발~머리)

  function resolveWalls(p){
    for (const c of colliders){
      const withinY = (p.y + CHAR_HEIGHT > c.minY + 0.06) && (p.y < c.maxY - 0.06);
      if (!withinY) continue; // 위에 서있거나 완전히 아래/위에 있으면 벽 판정 제외
      const minX = c.minX - CHAR_HALF_W, maxX = c.maxX + CHAR_HALF_W;
      const minZ = c.minZ - CHAR_HALF_W, maxZ = c.maxZ + CHAR_HALF_W;
      if (p.x > minX && p.x < maxX && p.z > minZ && p.z < maxZ){
        const overlapX = Math.min(p.x-minX, maxX-p.x);
        const overlapZ = Math.min(p.z-minZ, maxZ-p.z);
        const cx = (c.minX+c.maxX)/2, cz = (c.minZ+c.maxZ)/2;
        if (overlapX < overlapZ){
          p.x += (p.x < cx ? -overlapX : overlapX);
        } else {
          p.z += (p.z < cz ? -overlapZ : overlapZ);
        }
      }
    }
  }

  // 벽점프용: 공중에서 옆 벽에 거의 맞닿아 있으면 감지해서 어느 방향으로 차고 나가야 할지 계산
  function findAdjacentWall(x, z, y){
    const pad = CHAR_HALF_W + 0.16;
    for (const c of colliders){
      const withinY = (y + CHAR_HEIGHT > c.minY + 0.06) && (y < c.maxY - 0.4);
      if (!withinY) continue;
      const nearX = x > c.minX - pad && x < c.maxX + pad;
      const nearZ = z > c.minZ - pad && z < c.maxZ + pad;
      if (!(nearX && nearZ)) continue;
      const overlapX = Math.min(x-(c.minX-pad), (c.maxX+pad)-x);
      const overlapZ = Math.min(z-(c.minZ-pad), (c.maxZ+pad)-z);
      const cx = (c.minX+c.maxX)/2, cz = (c.minZ+c.maxZ)/2;
      let nx = 0, nz = 0;
      if (overlapX < overlapZ) nx = (x < cx ? -1 : 1);
      else nz = (z < cz ? -1 : 1);
      return { nx, nz };
    }
    return null;
  }

  function findLanding(prevY, newY, x, z){
    let best = null;
    for (const c of colliders){
      const overlapXZ = (x > c.minX - CHAR_HALF_W && x < c.maxX + CHAR_HALF_W &&
                          z > c.minZ - CHAR_HALF_W && z < c.maxZ + CHAR_HALF_W);
      if (!overlapXZ) continue;
      if (prevY >= c.topY - 0.05 && newY <= c.topY + 0.3){
        if (!best || c.topY > best.topY) best = c;
      }
    }
    // 로비 마을 지형 - 위치별 실제 높이(언덕/바다 경사 등)를 반영해서 판정
    const groundH = lobbyInfo.getGroundHeight(x, z);
    if (prevY >= groundH - 0.05 && newY <= groundH + 0.3){
      if (!best || groundH > best.topY) best = { topY: groundH, type: 'normal' };
    }
    return best;
  }

  function findCeiling(prevY, newY, x, z, exclude){
    for (const c of colliders){
      if (c === exclude) continue;
      const overlapXZ = (x > c.minX - CHAR_HALF_W*0.6 && x < c.maxX + CHAR_HALF_W*0.6 &&
                          z > c.minZ - CHAR_HALF_W*0.6 && z < c.maxZ + CHAR_HALF_W*0.6);
      if (!overlapXZ) continue;
      const prevHead = prevY + CHAR_HEIGHT, newHead = newY + CHAR_HEIGHT;
      if (prevHead <= c.minY + 0.05 && newHead >= c.minY){
        return c;
      }
    }
    return null;
  }

  // 로블록스 공식 기본값: 점프 없이 자동으로 걸어 올라갈 수 있는 최대 높이 = 2.5 studs
  const STEP_HEIGHT = 2.5 * STUD;
  function tryStepUp(x, z, curY){
    let best = null;
    for (const c of colliders){
      const overlapXZ = (x > c.minX - CHAR_HALF_W && x < c.maxX + CHAR_HALF_W &&
                          z > c.minZ - CHAR_HALF_W && z < c.maxZ + CHAR_HALF_W);
      if (!overlapXZ) continue;
      const diff = c.topY - curY;
      if (diff > 0.06 && diff <= STEP_HEIGHT){
        if (best === null || c.topY > best) best = c.topY;
      }
    }
    return best;
  }

  // 맨틀(가까스로 매달려 올라가기): 오토스텝(2.5studs)보다 높지만, 점프해서 손이 닿는 턱을 붙잡고 기어오름
  const MANTLE_MIN = STEP_HEIGHT;
  const MANTLE_MAX = STEP_HEIGHT + 0.85; // 이 이상은 손도 안 닿아서 그냥 못 올라감 (점프+맨틀 합산 사기 방지로 축소)
  function tryMantle(x, z, curY){
    let best = null;
    for (const c of colliders){
      const overlapXZ = (x > c.minX - CHAR_HALF_W - 0.15 && x < c.maxX + CHAR_HALF_W + 0.15 &&
                          z > c.minZ - CHAR_HALF_W - 0.15 && z < c.maxZ + CHAR_HALF_W + 0.15);
      if (!overlapXZ) continue;
      const diff = c.topY - curY;
      if (diff > MANTLE_MIN && diff <= MANTLE_MAX){
        if (best === null || c.topY < best.topY) best = c; // 가장 가까운(낮은) 턱을 우선 붙잡음
      }
    }
    return best;
  }

  // 등급(order)에 따라 스탯이 커지는 곡선. 33개 티어에 걸쳐 초반은 완만하게, 후반은 가파르게.
  function computeBattleStats(tierKey){
    const tier = AURA_TIERS[tierKey];
    const o = tier.order;
    const hp  = Math.round(80  + Math.pow(o, 1.55) * 9);
    const atk = Math.round(10  + Math.pow(o, 1.35) * 2.1);
    const def = Math.round(4   + Math.pow(o, 1.2)  * 0.9);
    const spd = Math.round(8   + o * 1.4);
    const skill = SKILL_BY_FX[tier.fx] || SKILL_BY_FX.dust;
    return { hp, atk, def, spd, skill };
  }

  function applyAuraTrait(aura){
    const trait = AURA_TIERS[aura.tier].trait || {};

  function weightedRandomAura(bonusMult){
    const lm = activeLuckMult() * (bonusMult || 1) * equippedLuckMult;
    // 럭 배율을 가중치에 단순히 곱하면(구버전) 등급 간 확률 차이가 수백만 배라 사실상 체감이 안 됨.
    // 대신 n(확률 분모)의 지수를 럭만큼 압축해서, 희귀 등급일수록 실질적으로 훨씬 크게 확률이 오르도록 함.
    let total = 0;
    const weights = AURA_LIST.map(a=>{
      const effectiveN = lm > 1 ? Math.pow(a.n, 1/lm) : a.n;
      const w = 1 / effectiveN;
      total += w;
      return w;
    });
    let r = Math.random() * total;
    for (let i=0; i<AURA_LIST.length; i++){
      r -= weights[i];
      if (r <= 0) return AURA_LIST[i];
    }
    return AURA_LIST[AURA_LIST.length - 1];

    const col1 = hexStr(hex), col2 = hexStr(hex2 != null ? hex2 : hex);
    const colors = [col1, col2, col1, col2];
    let s = seed || 1;
    const rnd = () => { s = (s*9301 + 49297) % 233280; return s/233280; }; // 항상 같은 패턴을 만드는 시드 난수(텍스처 재사용 안정성)
    for (let i=0;i<8;i++){
      const cx = 40 + rnd()*176;
      const cy = 40 + rnd()*176;
      const r  = 36 + rnd()*74;
      const col = colors[i % colors.length];
      const g = ctx.createRadialGradient(cx,cy,0, cx,cy,r);
      g.addColorStop(0,   col + 'bb');
      g.addColorStop(0.45,col + '55');
      g.addColorStop(1,   col + '00');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fill();
    }
    return new THREE.CanvasTexture(c);
  }

  // ---- 소형 파티클용 각진(샤드) 텍스처 ----
  function makeShardTexture(hex){
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const ctx = c.getContext('2d');
    const col = hexStr(hex);
    ctx.translate(64,64);
    ctx.rotate(Math.PI/4);
    const grad = ctx.createLinearGradient(-40,-40,40,40);
    grad.addColorStop(0, col+'00');
    grad.addColorStop(0.5, col+'ee');
    grad.addColorStop(1, col+'00');
    ctx.fillStyle = grad;
    ctx.fillRect(-6,-40,12,80);
    ctx.fillRect(-40,-6,80,12);
    return new THREE.CanvasTexture(c);
  }

  // ---- 아우라 장착 시 배경/안개/조명까지 침식되는 환경 연출 (등급 비례 디머 + 최상위는 색상까지 물듦) ----
  const DEFAULT_SKY_COLOR = new THREE.Color(0xf5e6c8);
  const DEFAULT_FOG_COLOR = new THREE.Color(0xf5e6c8);
  const DEFAULT_HEMI_SKY = new THREE.Color(0xffd9a8);
  const DEFAULT_HEMI_INTENSITY = 0.62;
  const DEFAULT_SUN_INTENSITY = 1.05;
  const ENV_SHIFT_TIER_ORDER = 18; // 이 등급(order) 이상부터 배경색까지 물듦
  let envShiftTarget = {
    sky: DEFAULT_SKY_COLOR.clone(), fog: DEFAULT_FOG_COLOR.clone(), hemi: DEFAULT_HEMI_SKY.clone(),
    hemiIntensity: DEFAULT_HEMI_INTENSITY, sunIntensity: DEFAULT_SUN_INTENSITY, active:false
  };
  function applyEnvironmentForAura(aura){
    const tier = AURA_TIERS[aura.tier];
    const sf = tierScaleFactor(tier.order);
    // 등급이 높을수록 주변이 어두워지며 캐릭터만 스포트라이트처럼 돋보이는 디머 (모든 등급에 연속 적용)
    const dimFactor = 1 - sf*0.6;
    if (tier.order >= ENV_SHIFT_TIER_ORDER){
      const c = new THREE.Color(tier.color2 != null ? tier.color2 : tier.color);
      envShiftTarget = {
        sky: DEFAULT_SKY_COLOR.clone().lerp(c, 0.55),
        fog: DEFAULT_FOG_COLOR.clone().lerp(c, 0.7),
        hemi: DEFAULT_HEMI_SKY.clone().lerp(c, 0.5),
        hemiIntensity: DEFAULT_HEMI_INTENSITY*dimFactor,
        sunIntensity: DEFAULT_SUN_INTENSITY*dimFactor,
        active:true
      };
    } else {
      envShiftTarget = {
        sky:DEFAULT_SKY_COLOR.clone(), fog:DEFAULT_FOG_COLOR.clone(), hemi:DEFAULT_HEMI_SKY.clone(),
        hemiIntensity: DEFAULT_HEMI_INTENSITY*dimFactor, sunIntensity: DEFAULT_SUN_INTENSITY*dimFactor,
        active:false
      };
    }
  }
  function updateEnvironmentShift(dt){
    scene.background.lerp(envShiftTarget.sky, Math.min(1, dt*1.5));
    scene.fog.color.lerp(envShiftTarget.fog, Math.min(1, dt*1.5));
    hemi.color.lerp(envShiftTarget.hemi, Math.min(1, dt*1.5));
    hemi.intensity += (envShiftTarget.hemiIntensity - hemi.intensity) * Math.min(1, dt*1.5);
    sun.intensity += (envShiftTarget.sunIntensity - sun.intensity) * Math.min(1, dt*1.5);
  }

  // ---- 캐릭터에 붙는 아우라 이펙트: 등급마다 완전히 다른 전용 파티클 ----
  let currentAuraEffect = null;
  function clearAuraEffect(){
    if (currentAuraEffect){
      scene.remove(currentAuraEffect.group);
      currentAuraEffect = null;
    }
  }
  const MAX_TIER_ORDER = 25; // Chrono 기준
  function tierScaleFactor(order){
    // 낮은 등급은 거의 안 보일 만큼 미세하고, 최상위로 갈수록 기하급수적으로 커짐 (선형 증가로는 격차가 안 느껴져서 지수 곡선 사용)
    return Math.pow(Math.min(order, MAX_TIER_ORDER) / MAX_TIER_ORDER, 1.7);
  }

  function makeAuraSprite(tex, color, size, opacity){
    const mat = new THREE.SpriteMaterial({ map:tex, color, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity });
    const s = new THREE.Sprite(mat);
    s.scale.set(size, size, 1);
    return s;
  }

  // ==================== 시그니처 입체 구조물 4계열 ====================
  // ① 궤도형: 여러 각도로 기울어진 입체 토러스 링 3~4개가 서로 다른 속도로 회전 + 숨쉬듯 맥동
  function addOrbitalFamily(group, particles, tier, color, sf){
    const ringCount = tier.order > 12 ? 4 : 3;
    for (let i=0;i<ringCount;i++){
      const r = 0.5 + i*0.22 + sf*1.6;
      const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.18+sf*0.5, blending:THREE.AdditiveBlending, depthWrite:false });
      const torus = new THREE.Mesh(new THREE.TorusGeometry(r, 0.02+sf*0.05, 8, 44), mat);
      torus.rotation.x = 0.3 + (i/ringCount)*Math.PI*0.65;
      torus.rotation.y = (i/ringCount)*Math.PI*0.8;
      torus.position.y = 1.3;
      group.add(torus);
      particles.push({ mesh:torus, mode:'orbitalring', axis:i%2===0?'z':'x', speed:(0.5+i*0.22+sf*1.2)*(i%2===0?1:-1), breathPhase:Math.random()*Math.PI*2 });
    }
  }
  // ② 크리스탈/파편형: 공중 부양하며 회전+미세 진동하는 3D 결정체 파편들
  function addCrystalFamily(group, particles, tier, color, sf){
    const geo = new THREE.OctahedronGeometry(1, 0);
    const count = 4 + Math.floor(sf*10);
    for (let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*0.6+sf*0.9, h = 0.4+Math.random()*1.9;
      const mat = new THREE.MeshPhysicalMaterial({
        color, transparent:true, opacity:0.35+sf*0.4, roughness:0.08, metalness:0.1,
        transmission:0.4, clearcoat:1, emissive:color, emissiveIntensity:0.2+sf*0.25
      });
      const mesh = new THREE.Mesh(geo, mat);
      const sc = 0.08+Math.random()*0.07+sf*0.22;
      mesh.scale.set(sc, sc*1.6, sc);
      mesh.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
      group.add(mesh);
      particles.push({ mesh, mode:'crystaljitter', orbitR:r, orbitA:a, baseH:h, spin:(0.4+sf*2.5)*(Math.random()<0.5?1:-1), jitterPhase:Math.random()*Math.PI*2 });
    }
  }
  // ③ 기둥/소환진형: 바닥에서 하늘로 치솟는 에너지 기둥(빠르게 수축했다 퍼짐) + 발밑 이중 회전 마법진
  function addPillarFamily(group, particles, tier, color, ringTex, sf){
    const pillarH = 1.4 + sf*10;
    const pillarGeo = new THREE.CylinderGeometry(0.06+sf*0.28, 0.16+sf*0.6, pillarH, 16, 1, true);
    const pillarMat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.14+sf*0.42, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
    pillar.position.y = pillarH/2;
    group.add(pillar);
    particles.push({ mesh:pillar, mode:'pillarburst', baseOpacity:0.14+sf*0.42 });

    for (let i=0;i<2;i++){
      const mat = new THREE.MeshBasicMaterial({ map:ringTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.55-i*0.15 });
      const size = 1.0 + i*0.5 + sf*4.5;
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size,size), mat);
      mesh.rotation.x = -Math.PI/2;
      mesh.position.y = 0.03+i*0.012;
      group.add(mesh);
      particles.push({ mesh, mode:'ringspin', slow:i===1 });
    }
  }
  // ④ 구체/번개형: 캐릭터 중심에서 퍼져나가는 플라즈마 구체 + 짧게 번쩍이는 번개 스파크
  function addSphereLightningFamily(group, particles, tier, color, sf){
    const sphereGeo = new THREE.SphereGeometry(1, 10, 10);
    const count = 3 + Math.floor(sf*9);
    for (let i=0;i<count;i++){
      const a = (i/count)*Math.PI*2, r = 0.5+Math.random()*0.45+sf*0.9, h = 0.5+Math.random()*1.6;
      const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.4+sf*0.4, blending:THREE.AdditiveBlending, depthWrite:false });
      const mesh = new THREE.Mesh(sphereGeo, mat);
      const sc = 0.06+Math.random()*0.05+sf*0.16;
      mesh.scale.setScalar(sc);
      mesh.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
      group.add(mesh);
      particles.push({ mesh, mode:'plasmaorb', orbitR:r, orbitA:a, baseH:h, flickerPhase:Math.random()*Math.PI*2, orbitSpeed:0.2+sf*1.2 });
    }
    for (let i=0;i<3;i++){
      const lineMat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0 });
      const points = [];
      for (let j=0;j<5;j++) points.push(new THREE.Vector3((Math.random()-0.5)*0.5, 0.2+j*0.42, (Math.random()-0.5)*0.5));
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(lineGeo, lineMat);
      group.add(line);
      particles.push({ mesh:line, mode:'lightningflash', delay:Math.random()*2.2 });
    }
  }

  function createAuraEffect(aura){
    clearAuraEffect();
    const tier = AURA_TIERS[aura.tier];
    const group = new THREE.Group();
    const dotTex = makeGlowTexture(tier.color, tier.color2);
    const ringTex = makeRingTexture(tier.color2 != null ? tier.color2 : tier.color);
    const shardTex = makeShardTexture(tier.color2 != null ? tier.color2 : tier.color);
    const particles = [];
    const type = tier.fx;

    function addDot(px,py,pz,size,opacity,extra){
      const s = makeAuraSprite(dotTex, tier.color, size, opacity);
      s.position.set(px,py,pz);
      group.add(s);
      particles.push(Object.assign({ mesh:s, baseX:px, baseY:py, baseZ:pz, phase:Math.random()*Math.PI*2 }, extra||{}));
      return s;
    }

    if (type === 'none'){
      // Plain: 아무 파티클도 없음, 이름표만 뜸
    }
    else if (type === 'dust'){
      // Common: 발밑에서 미세하게 흔들리는 먼지 입자
      for (let i=0;i<14;i++){
        const a = Math.random()*Math.PI*2, r = Math.random()*0.55;
        addDot(Math.cos(a)*r, 0.06+Math.random()*0.1, Math.sin(a)*r, 0.18+Math.random()*0.08, 0.35+Math.random()*0.25, {mode:'jitter'});
      }
    }
    else if (type === 'sparkle'){
      // Uncommon: 주변에 아주 작게 반짝이는 빛가루
      for (let i=0;i<18;i++){
        const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*0.7, h = 0.3+Math.random()*2.0;
        addDot(Math.cos(a)*r, h, Math.sin(a)*r, 0.12+Math.random()*0.08, 0.5+Math.random()*0.4, {mode:'twinkle', orbitR:r, orbitA:a, baseH:h});
      }
    }
    else if (type === 'coldair'){
      // Rare: 캐릭터 몸을 스쳐 지나가는 차가운 공기 흐름
      for (let i=0;i<5;i++){
        const s = makeAuraSprite(dotTex, tier.color, 1.4, 0.3);
        s.scale.set(1.4, 0.32, 1);
        group.add(s);
        particles.push({ mesh:s, mode:'coldair', phase:(i/5)*Math.PI*2, h:0.4+Math.random()*1.6 });
      }
    }
    else if (type === 'bubble'){
      // Good: 가끔씩 위로 동글동글 올라오는 기포 이펙트
      for (let i=0;i<7;i++){
        const a = Math.random()*Math.PI*2, r = Math.random()*0.4;
        addDot(Math.cos(a)*r, 0, Math.sin(a)*r, 0.14+Math.random()*0.08, 0, {mode:'bubble', speed:0.45+Math.random()*0.35, wob:Math.random()*0.3, cycleT:Math.random()*3.5, maxH:1.8+Math.random()*0.6});
      }
    }
    else if (type === 'wavepulse' || type === 'ripple'){
      // Epic: 발밑에서 은은하게 퍼지는 파동 / Hydro: 발밑에서 물결치는 파문+방울
      for (let i=0;i<2;i++){
        const ringMat = new THREE.MeshBasicMaterial({ map:ringTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.8 });
        const ring = new THREE.Mesh(new THREE.PlaneGeometry(2.6,2.6), ringMat);
        ring.rotation.x = -Math.PI/2;
        ring.position.y = 0.03;
        group.add(ring);
        particles.push({ mesh:ring, mode:'wave', phase:i*0.7 });
      }
      if (type === 'ripple'){
        for (let i=0;i<6;i++){
          addDot((Math.random()-0.5)*0.7, 0.1, (Math.random()-0.5)*0.7, 0.1, 0, {mode:'droplet', delay:Math.random()*2});
        }
      }
    }
    else if (type === 'auraring' || type === 'amberring'){
      // Topaz: 노란빛+주황 작은 오라 링 / Amber: 굳어있는 호박석 링+실제 3D 보석
      const ringMat = new THREE.MeshBasicMaterial({ map:ringTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.75 });
      const ring = new THREE.Mesh(new THREE.PlaneGeometry(2.0,2.0), ringMat);
      ring.rotation.x = -Math.PI/2;
      ring.position.y = 0.03;
      group.add(ring);
      particles.push({ mesh:ring, mode:'ringspin', slow: type==='amberring' });
      const count = type==='amberring' ? 5 : 7;
      for (let i=0;i<count;i++){
        const a = (i/count)*Math.PI*2;
        addDot(Math.cos(a)*0.85, 0.15, Math.sin(a)*0.85, 0.13, 0.7, {mode: type==='amberring' ? 'static' : 'orbitring', orbitR:0.85, orbitA:a});
      }
      if (type === 'amberring'){
        // 실제 3D 호박석 보석(둥근 유리질) 5개가 굳은 채 천천히 떠 있음
        const gemGeo = new THREE.IcosahedronGeometry(1, 0);
        for (let i=0;i<5;i++){
          const a = (i/5)*Math.PI*2 + 0.4, r = 0.65+Math.random()*0.4, h = 0.5+Math.random()*1.3;
          const gemMat = new THREE.MeshPhysicalMaterial({
            color:0xB5601A, transparent:true, opacity:0.75, roughness:0.15, metalness:0.05,
            transmission:0.35, clearcoat:1, emissive:0xB5601A, emissiveIntensity:0.4
          });
          const gem = new THREE.Mesh(gemGeo, gemMat);
          const sc = 0.13+Math.random()*0.08;
          gem.scale.set(sc, sc, sc);
          gem.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
          group.add(gem);
          particles.push({ mesh:gem, mode:'amberdrift', orbitR:r, orbitA:a, baseH:h, spin:0.3+Math.random()*0.4 });
        }
      }
    }
    else if (type === 'orbittrail'){
      // Great: 캐릭터 주위를 천천히 도는 빛의 궤적
      for (let i=0;i<6;i++){
        addDot(0,1.6,0, 0.16-(i*0.015), 0.7-(i*0.1), {mode:'orbit', orbitR:1.0, orbitPhase:-i*0.28, speed:1.1, h:1.6});
      }
    }
    else if (type === 'shard'){
      // Quartz: 실제 3D 크리스탈(팔면체)이 주변에 떠다니며 반짝임 + 작은 유리 파편 스프라이트 보조
      const crystalGeo = new THREE.OctahedronGeometry(1, 0);
      for (let i=0;i<6;i++){
        const a = Math.random()*Math.PI*2, r = 0.6+Math.random()*0.7, h = 0.4+Math.random()*1.7;
        const crystalMat = new THREE.MeshPhysicalMaterial({
          color: tier.color, transparent:true, opacity:0.55, roughness:0.05, metalness:0.1,
          transmission:0.5, clearcoat:1, emissive: tier.color, emissiveIntensity:0.35
        });
        const crystal = new THREE.Mesh(crystalGeo, crystalMat);
        const sc = 0.14 + Math.random()*0.1;
        crystal.scale.set(sc, sc*1.7, sc);
        crystal.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
        group.add(crystal);
        particles.push({ mesh:crystal, mode:'crystal', orbitR:r, orbitA:a, baseH:h, spin:(Math.random()-0.5)*2 });
      }
      for (let i=0;i<8;i++){
        const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*0.6, h = 0.3+Math.random()*1.8;
        const s = makeAuraSprite(shardTex, tier.color, 0.16+Math.random()*0.08, 0.6);
        s.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
        group.add(s);
        particles.push({ mesh:s, mode:'shard', orbitR:r, orbitA:a, baseH:h, spin:(Math.random()-0.5)*3 });
      }
    }
    else if (type === 'debris'){
      // Acorn: 바닥에 흩날리는 작은 도토리와 나뭇잎 파편
      const acornGeo = new THREE.ConeGeometry(0.06,0.14,6);
      const leafGeo = new THREE.PlaneGeometry(0.12,0.08);
      for (let i=0;i<8;i++){
        const a = Math.random()*Math.PI*2, r = Math.random()*0.7;
        const useAcorn = Math.random()<0.5;
        const mesh = new THREE.Mesh(useAcorn?acornGeo:leafGeo, new THREE.MeshStandardMaterial({ color: useAcorn?0x6B4A2B:0x9C7A3C, roughness:0.9, side:THREE.DoubleSide }));
        mesh.position.set(Math.cos(a)*r, 0.04, Math.sin(a)*r);
        mesh.rotation.set(useAcorn?0:Math.PI/2, Math.random()*Math.PI*2, 0);
        group.add(mesh);
        particles.push({ mesh, mode:'sway' });
      }
    }
    else if (type === 'pollen'){
      // Pollen: 주변에 둥둥 떠다니며 퍼지는 노란 꽃가루 (더 풍성하게, 실제 3D 꽃잎 메시 포함)
      for (let i=0;i<20;i++){
        const a = Math.random()*Math.PI*2, r = 0.4+Math.random()*1.1, h = 0.3+Math.random()*1.9;
        addDot(Math.cos(a)*r, h, Math.sin(a)*r, 0.11+Math.random()*0.07, 0.55, {mode:'drift', dx:(Math.random()-0.5)*0.4, dz:(Math.random()-0.5)*0.4, dy:(Math.random()-0.5)*0.2});
      }
      // 실제 3D 꽃잎 조각 (작은 평면, 앞뒤로 살랑거리며 부유)
      const petalGeo = new THREE.PlaneGeometry(0.13, 0.09);
      for (let i=0;i<9;i++){
        const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*0.9, h = 0.4+Math.random()*1.6;
        const petalMat = new THREE.MeshStandardMaterial({ color:0xF2D93E, emissive:0xF2D93E, emissiveIntensity:0.3, roughness:0.7, side:THREE.DoubleSide, transparent:true, opacity:0.85 });
        const petal = new THREE.Mesh(petalGeo, petalMat);
        petal.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
        group.add(petal);
        particles.push({ mesh:petal, mode:'petal', orbitR:r, orbitA:a, baseH:h, phase:Math.random()*Math.PI*2 });
      }
      // 발밑에 은은하게 퍼지는 꽃밭 빛 (연노랑 링)
      const fieldMat = new THREE.MeshBasicMaterial({ map:makeGlowTexture(0xF2D93E), color:0xffffff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.28 });
      const field = new THREE.Mesh(new THREE.PlaneGeometry(2.6,2.6), fieldMat);
      field.rotation.x = -Math.PI/2;
      field.position.y = 0.025;
      group.add(field);
      particles.push({ mesh:field, mode:'powerpulse', baseScale:1 });
    }
    else if (type === 'flame'){
      // Ignis: 발밑에서 위로 피어오르는 불꽃 열기
      for (let i=0;i<10;i++){
