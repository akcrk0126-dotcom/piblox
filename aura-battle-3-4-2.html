    else if (type === 'sanguine'){
      // Sanguine: 핏빛 붉은 달 + 기하학적 룬문자 링 3중 회전
      const moon = new THREE.Mesh(new THREE.SphereGeometry(0.42,20,20), new THREE.MeshBasicMaterial({ color:0x8B0000 }));
      moon.position.set(0,1.7,-0.4);
      group.add(moon);
      particles.push({ mesh:moon, mode:'static' });
      for (let i=0;i<3;i++){
        const runeTex = makeStarShapeTexture(0xFF2E2E, 6+i*2);
        const runeMat = new THREE.MeshBasicMaterial({ map:runeTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.55-i*0.1 });
        const ring = new THREE.Mesh(new THREE.PlaneGeometry(1.4+i*0.5,1.4+i*0.5), runeMat);
        ring.position.set(0,1.7,-0.35);
        group.add(ring);
        particles.push({ mesh:ring, mode:'radhalo', speed:(0.3+i*0.2)*(i%2===0?1:-1) });
      }
    }

    // 모든 등급 공통 "파워 오라" 베이스 레이어 (Sol's RNG 스타일: Core/Swirl/Sparkle 3단 레이어, 등급이 높을수록 웅장하게) - Plain 제외
    if (type !== 'none'){
      const baseGlowColor = tier.color2 != null ? tier.color2 : tier.color;
      const baseGlowTex = makeGlowTexture(baseGlowColor);
      const coreTex = makeGlowTexture(0xffffff, baseGlowColor);
      const sf = tierScaleFactor(tier.order); // 0(커먼)~1(크로노) 사이 지수 곡선 스케일값

      // ---- ⓪ Nebula: 부드러운 색 구름을 여러 겹 스택해서 뒤에 깔아 입체감과 화려함을 더함 ----
      const nebTexA = makeNebulaTexture(baseGlowColor, tier.color, tier.order*7+1);
      const nebTexB = makeNebulaTexture(tier.color, baseGlowColor, tier.order*13+3);
      const nebLayers = 2 + Math.round(sf*3); // 등급 높을수록 겹수도 더 쌓임("겁나 많이 스택")
      for (let i=0;i<nebLayers;i++){
        const tex = i%2===0 ? nebTexA : nebTexB;
        const nebScale = 1.5 + sf*3.2 + i*0.35;
        const nebOpacity = (0.14 + sf*0.24) * (1 - i*0.12);
        const neb = makeAuraSprite(tex, 0xffffff, nebScale, nebOpacity);
        neb.position.y = 1.5 + (i - nebLayers/2)*0.25;
        neb.material.rotation = Math.random()*Math.PI*2;
        group.add(neb);
        particles.push({ mesh:neb, mode:'nebuladrift', spin:(0.04+sf*0.2)*(i%2===0?1:-1), baseOpacity:nebOpacity, phase:Math.random()*Math.PI*2 });
      }

      // ---- 상징 아이콘(엠블럼) 배지: 머리 위에 또렷하게 떠서 이 아우라의 정체성을 한눈에 알려줌 ----
      if (tier.icon){
        const badgeBackTex = makeGlowTexture(baseGlowColor);
        const badgeBack = makeAuraSprite(badgeBackTex, baseGlowColor, 0.55+sf*0.35, 0.35+sf*0.2);
        const iconTex = makeIconTexture(tier.icon, 0xffffff);
        const icon = makeAuraSprite(iconTex, 0xffffff, 0.38+sf*0.28, 0.95);
        const badgeY = 2.55 + sf*0.35;
        badgeBack.position.y = badgeY;
        icon.position.y = badgeY;
        icon.position.z = 0.001; // 배지 원반보다 살짝 앞
        group.add(badgeBack);
        group.add(icon);
        particles.push({ mesh:badgeBack, mode:'iconbadgeback', baseScale:0.55+sf*0.35, baseY:badgeY });
        particles.push({ mesh:icon, mode:'iconbadge', baseScale:0.38+sf*0.28, baseY:badgeY });
      }

      // ---- ① Core: 밝고 또렷한 중심부 광구 (안쪽 레이어라 빠르게 맥동) ----
      const coreScale = 0.28 + sf*1.9;
      const coreOpacity = 0.55 + sf*0.35;
      const core2 = makeAuraSprite(coreTex, 0xffffff, coreScale, coreOpacity);
      core2.position.y = 1.5;
      group.add(core2);
      particles.push({ mesh:core2, mode:'corepulse', baseScale:coreScale, baseOpacity:coreOpacity, pulseSpeed:2.5+sf*3 });

      // ---- ② Swirl: 캐릭터를 감싸며 아주 빠르게 회전하는 입체 링(토러스) + 솟구치는 에너지 기둥 ----
      const torusR = 0.5 + sf*1.9;
      const torusMat = new THREE.MeshBasicMaterial({ color:baseGlowColor, transparent:true, opacity:0.2+sf*0.55, blending:THREE.AdditiveBlending, depthWrite:false });
      const torus = new THREE.Mesh(new THREE.TorusGeometry(torusR, 0.025+sf*0.06, 8, 48), torusMat);
      torus.rotation.x = Math.PI/2.4;
      torus.position.y = 1.1;
      group.add(torus);
      particles.push({ mesh:torus, mode:'swirltorus', baseR:torusR, spinSpeed:2.6+sf*3.5 });

      // 두 번째 토러스(반대 방향, 다른 축) - 입체적인 이중 회전 느낌
      const torus2Mat = new THREE.MeshBasicMaterial({ color:baseGlowColor, transparent:true, opacity:0.12+sf*0.42, blending:THREE.AdditiveBlending, depthWrite:false });
      const torus2 = new THREE.Mesh(new THREE.TorusGeometry(torusR*0.82, 0.018+sf*0.045, 8, 40), torus2Mat);
      torus2.rotation.x = Math.PI/1.7;
      torus2.position.y = 1.7;
      group.add(torus2);
      particles.push({ mesh:torus2, mode:'swirltorus2', baseR:torusR*0.82, spinSpeed:1.8+sf*4 });

      // 발밑에서 은은하게 맥동하는 파워 링 (평면 메시로 실제 바닥에 눕힘) - 커먼은 거의 안 보일 정도로 작고 흐릿함
      const groundGlowMat = new THREE.MeshBasicMaterial({ map:baseGlowTex, color:0xffffff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0.1+sf*0.3 });
      const groundGlow = new THREE.Mesh(new THREE.PlaneGeometry(1,1), groundGlowMat);
      groundGlow.rotation.x = -Math.PI/2;
      groundGlow.position.y = 0.03;
      const gScale = 0.8 + sf*4.8;
      groundGlow.scale.set(gScale, gScale, 1);
      group.add(groundGlow);
      particles.push({ mesh:groundGlow, mode:'powerpulse', baseScale:gScale });

      // 위로 솟구치는 에너지 기둥
      const columnScaleY = 0.7 + sf*6.5;
      const column = makeAuraSprite(baseGlowTex, baseGlowColor, 1.0, 0.05+sf*0.32);
      column.scale.set(0.35+sf*0.5, columnScaleY, 1);
      column.position.y = columnScaleY*0.28;
      group.add(column);
      particles.push({ mesh:column, mode:'energycolumn', baseScaleY:columnScaleY, baseOpacity:0.05+sf*0.32 });

      // 주기적으로 터져나가는 파워 펄스 링 (발밑 마법진처럼)
      const pulseRingMat = new THREE.MeshBasicMaterial({ map:ringTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, opacity:0 });
      const pulseRing = new THREE.Mesh(new THREE.PlaneGeometry(1,1), pulseRingMat);
      pulseRing.rotation.x = -Math.PI/2;
      pulseRing.position.y = 0.04;
      group.add(pulseRing);
      particles.push({ mesh:pulseRing, mode:'powerburst', maxSize:1.0+sf*9, period:3.2-sf*1.8 });

      // ---- 시그니처 입체 구조물: 4개 계열(궤도링/크리스탈/기둥+마법진/구체+번개) 중 등급에 배정된 것 ----
      const fam = tier.family;
      if (fam === 'orbital') addOrbitalFamily(group, particles, tier, baseGlowColor, sf);
      else if (fam === 'crystal') addCrystalFamily(group, particles, tier, baseGlowColor, sf);
      else if (fam === 'pillar') addPillarFamily(group, particles, tier, baseGlowColor, ringTex, sf);
      else if (fam === 'sphere') addSphereLightningFamily(group, particles, tier, baseGlowColor, sf);

      // ---- 위로 아지랑이처럼 솔솔 올라가며 사라지는 반짝임 스트림 (바깥 레이어라 느긋하게) ----
      const risingCount = 3 + Math.floor(sf*14);
      for (let i=0;i<risingCount;i++){
        const a = Math.random()*Math.PI*2, r = 0.2+Math.random()*0.6;
        const s = makeAuraSprite(baseGlowTex, baseGlowColor, 0.07+Math.random()*0.05, 0);
        s.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
        group.add(s);
        particles.push({ mesh:s, mode:'bubble', baseX:Math.cos(a)*r, baseZ:Math.sin(a)*r, speed:0.3+Math.random()*0.3, wob:0.1+Math.random()*0.14, cycleT:Math.random()*3, maxH:1.4+sf*1.2+Math.random()*0.4 });
      }

      // ---- ③ Sparkle: 불규칙하게 요동치는 외곽 파티클(크기/투명도/속도 전부 제각각, 가장 바깥이라 가장 느긋하게 부유) ----
      const sparkCount = 5 + Math.floor(sf*20);
      for (let i=0;i<sparkCount;i++){
        const a = Math.random()*Math.PI*2, r = 0.7+Math.random()*(0.4+sf*0.9), h = 0.2+Math.random()*2.3;
        const baseSz = 0.08+Math.random()*0.07;
        const s = makeAuraSprite(baseGlowTex, baseGlowColor, baseSz, 0.5);
        s.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
        group.add(s);
        particles.push({
          mesh:s, mode:'erraticsparkle', orbitR:r, orbitA:a, baseH:h, baseSz,
          freq1: 0.6+Math.random()*1.8, freq2: 1.1+Math.random()*2.6,
          phase:Math.random()*Math.PI*2, phase2:Math.random()*Math.PI*2,
          orbitSpeed:(0.15+Math.random()*0.35)*(Math.random()<0.5?1:-1)
        });
      }

      // 등급이 높을수록 실제로 주변을 밝히는 빛
      const powerLight = new THREE.PointLight(baseGlowColor, 0.25+tier.order*0.045, 4+tier.order*0.6, 2);
      powerLight.position.y = 1.4;
      group.add(powerLight);
      particles.push({ mesh:null, mode:'powerlight', light:powerLight, baseIntensity:0.25+tier.order*0.045 });
    }

    // 뮤테이션(Silver/Gold/Blood)이 있으면 기본 등급 이펙트 위에 전용 색상 반짝임을 추가로 덧씌움
    if (aura.mutation){
      const mutTex = makeGlowTexture(aura.mutation.color);
      for (let i=0;i<12;i++){
        const a = Math.random()*Math.PI*2, r = 0.6+Math.random()*0.6, h = 0.4+Math.random()*2.0;
        const s = makeAuraSprite(mutTex, aura.mutation.color, 0.13+Math.random()*0.07, 0.6);
        s.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
        group.add(s);
        particles.push({ mesh:s, mode:'twinkle', orbitR:r, orbitA:a, baseH:h, phase:Math.random()*Math.PI*2 });
      }
    }

    scene.add(group);
    currentAuraEffect = { group, tier, particles, t: Math.random()*10 };
  }

  function updateAuraEffect(dt){
    if (!currentAuraEffect) return;
    const fx = currentAuraEffect;
    fx.t += dt;
    fx.group.position.set(pos.x, pos.y, pos.z);
    const t = fx.t;

    for (const p of fx.particles){
      switch (p.mode){
        case 'jitter':
          p.mesh.position.x = p.baseX + Math.sin(t*6+p.phase)*0.03;
          p.mesh.position.z = p.baseZ + Math.cos(t*5+p.phase)*0.03;
          p.mesh.material.opacity = 0.3 + 0.25*Math.sin(t*4+p.phase);
          break;
        case 'twinkle':
          p.mesh.material.opacity = Math.max(0.05, 0.5 + 0.5*Math.sin(t*3+p.phase));
          p.orbitA += dt*0.15;
          p.mesh.position.x = Math.cos(p.orbitA)*p.orbitR;
          p.mesh.position.z = Math.sin(p.orbitA)*p.orbitR;
          p.mesh.position.y = p.baseH + Math.sin(t*1.2+p.phase)*0.15;
          break;
        case 'coldair': {
          const cyc = (t*0.5 + p.phase) % (Math.PI*2);
          p.mesh.position.set(Math.cos(cyc)*0.9, p.h, Math.sin(cyc)*0.9);
          p.mesh.material.rotation = cyc;
          p.mesh.material.opacity = 0.25*Math.max(0,Math.sin(cyc))+0.08;
          break;
        }
        case 'rise':
          p.mesh.position.y += dt*p.speed;
          if (p.mesh.position.y > 2.2) p.mesh.position.y = 0;
          p.mesh.position.x = p.baseX + Math.sin(t*2+p.phase)*p.wob;
          p.mesh.position.z = p.baseZ + Math.cos(t*2+p.phase)*p.wob;
          break;
        case 'bubble': {
          // 각자 독립된 주기: 발밑에서 서서히 페이드인 → 위로 올라가며 좌우로 살짝 흔들림 → 꼭대기에서 톡 터지듯 페이드아웃 → 대기 후 재시작
          const cycleLen = p.maxH / p.speed + 0.8; // 상승 시간 + 대기 시간
          p.cycleT += dt;
          if (p.cycleT > cycleLen) p.cycleT -= cycleLen;
          const riseT = Math.min(p.cycleT, p.maxH / p.speed);
          const h = riseT * p.speed;
          p.mesh.position.y = h;
          p.mesh.position.x = p.baseX + Math.sin(t*1.6+p.phase)*p.wob;
          p.mesh.position.z = p.baseZ + Math.cos(t*1.6+p.phase)*p.wob;
          const fadeIn = Math.min(1, riseT*3);
          const fadeOut = Math.min(1, (p.maxH/p.speed - riseT)*4);
          p.mesh.material.opacity = 0.55 * Math.min(fadeIn, fadeOut) * (p.cycleT <= p.maxH/p.speed ? 1 : 0);
          break;
        }
        case 'wave': {
          const cyc = ((t*0.7)+p.phase) % 1.4 / 1.4;
          const s = 0.3 + cyc*2.4;
          p.mesh.scale.set(s,s,1);
          p.mesh.material.opacity = 0.7*(1-cyc);
          break;
        }
        case 'droplet': {
          const cyc = ((t*0.6)+p.delay) % 2;
          p.mesh.material.opacity = cyc < 0.3 ? (0.3-cyc)*2 : 0;
          p.mesh.position.y = cyc < 0.3 ? cyc*1.2 : 0;
          break;
        }
        case 'ringspin':
          p.mesh.rotation.z += dt * (p.fast ? 1.6 : (p.slow ? 0.08 : 0.4));
          break;
        case 'gildedspark': {
          // 은은하게 팡 하고 터졌다 사라지는 황금 스파크
          const cyc = (t*1.5 + p.delay) % 2.5;
          if (cyc < 0.15) p.mesh.material.opacity = (cyc/0.15)*0.85;
          else if (cyc < 0.3) p.mesh.material.opacity = (1-(cyc-0.15)/0.15)*0.85;
          else {
            p.mesh.material.opacity = 0;
            if (cyc > 2.3){
              const a = Math.random()*Math.PI*2;
              p.mesh.position.set(Math.cos(a)*p.baseR, p.baseH, Math.sin(a)*p.baseR);
            }
          }
          break;
        }
        case 'icecrystal':
          // 잔잔히 회전하는 얼음 결정체 (느긋한 궤도 + 느린 자전)
          p.orbitA += dt*0.1;
          p.mesh.position.x = Math.cos(p.orbitA)*p.orbitR;
          p.mesh.position.z = Math.sin(p.orbitA)*p.orbitR;
          p.mesh.position.y = p.baseH + Math.sin(t*0.5+p.orbitA)*0.08;
          p.mesh.rotation.y += dt*p.spin;
          break;
        case 'laserline':
          p.mesh.rotation.y = t*0.6 + p.angle;
          p.mesh.material.opacity = 0.5 + 0.4*Math.sin(t*10+p.angle*3); // 진동
          break;
        case 'circuitorbit':
          p.mesh.rotation.z += dt*p.speed;
          break;
        case 'orbitring':
          p.orbitA += dt*0.5;
          p.mesh.position.x = Math.cos(p.orbitA)*p.orbitR;
          p.mesh.position.z = Math.sin(p.orbitA)*p.orbitR;
          break;
        case 'static':
          break;
        case 'orbit':
          p.orbitPhase += dt*p.speed;
          p.mesh.position.set(Math.cos(p.orbitPhase)*p.orbitR, p.h+Math.sin(p.orbitPhase*2)*0.1, Math.sin(p.orbitPhase)*p.orbitR);
          break;
        case 'shard':
          p.orbitA += dt*0.25;
          p.mesh.position.x = Math.cos(p.orbitA)*p.orbitR;
          p.mesh.position.z = Math.sin(p.orbitA)*p.orbitR;
          p.mesh.position.y = p.baseH + Math.sin(t+p.orbitA)*0.1;
          p.mesh.material.rotation += dt*p.spin;
          p.mesh.material.opacity = 0.4+0.4*Math.abs(Math.sin(t*2+p.orbitA*3));
          break;
        case 'crystal':
          p.orbitA += dt*0.18;
          p.mesh.position.x = Math.cos(p.orbitA)*p.orbitR;
          p.mesh.position.z = Math.sin(p.orbitA)*p.orbitR;
          p.mesh.position.y = p.baseH + Math.sin(t*0.9+p.orbitA)*0.15;
          p.mesh.rotation.y += dt*p.spin;
          p.mesh.rotation.x += dt*p.spin*0.4;
          p.mesh.material.emissiveIntensity = 0.25 + 0.25*Math.abs(Math.sin(t*1.6+p.orbitA*2));
          break;
        case 'amberdrift':
          p.orbitA += dt*0.06; // 굳어있는 느낌으로 아주 천천히
          p.mesh.position.x = Math.cos(p.orbitA)*p.orbitR;
          p.mesh.position.z = Math.sin(p.orbitA)*p.orbitR;
          p.mesh.position.y = p.baseH + Math.sin(t*0.4+p.orbitA)*0.05;
          p.mesh.rotation.y += dt*p.spin*0.2;
          p.mesh.material.emissiveIntensity = 0.3 + 0.2*Math.abs(Math.sin(t*0.8+p.orbitA*2));
          break;
        case 'petal':
          p.orbitA += dt*0.22;
          p.mesh.position.x = Math.cos(p.orbitA)*p.orbitR;
          p.mesh.position.z = Math.sin(p.orbitA)*p.orbitR;
          p.mesh.position.y = p.baseH + Math.sin(t*1.1+p.phase)*0.2;
          p.mesh.rotation.y = t*0.8 + p.phase;
          p.mesh.rotation.x = Math.sin(t*1.6+p.phase)*0.6;
          break;
        case 'sway':
          p.mesh.rotation.y += dt*0.15;
          break;
        case 'drift':
          p.mesh.position.x += p.dx*dt*0.3;
          p.mesh.position.y += p.dy*dt*0.3;
          p.mesh.position.z += p.dz*dt*0.3;
          if (Math.hypot(p.mesh.position.x,p.mesh.position.z) > 1.6){ p.dx*=-1; p.dz*=-1; }
          if (p.mesh.position.y > 2.1 || p.mesh.position.y < 0.2) p.dy *= -1;
          break;
        case 'flame':
          p.mesh.position.y += dt*p.speed;
          p.mesh.position.x = Math.sin(t*3+p.phase)*p.wob*0.3;
          p.mesh.position.z = Math.cos(t*3+p.phase)*p.wob*0.3;
          p.mesh.material.opacity = Math.max(0, 0.8*(1 - p.mesh.position.y/1.4));
          if (p.mesh.position.y > 1.4){ p.mesh.position.y = 0; }
          break;
        case 'light':
          p.light.intensity = 0.9 + Math.sin(t*7)*0.4 + Math.sin(t*13.3)*0.25;
          if (Math.random()<0.015) p.light.intensity *= 0.3; // 가끔 훅 꺼졌다 켜짐
          break;
        case 'flickerdot':
          p.mesh.material.opacity = 0.4 + 0.4*Math.max(0,Math.sin(t*8+p.phase));
          break;
        case 'mist':
          p.orbitA += dt*0.2;
          p.mesh.position.x = Math.cos(p.orbitA)*0.4;
          p.mesh.position.z = Math.sin(p.orbitA)*0.4;
          p.mesh.position.y = 0.6 + Math.sin(t*0.8+p.orbitA)*0.25;
          break;
        case 'windspiral':
          p.phase += dt*3.2;
          p.mesh.position.set(Math.cos(p.phase)*0.7, 0.8+Math.sin(p.phase*2)*0.7, Math.sin(p.phase)*0.7);
          p.mesh.material.rotation = p.phase;
          break;
        case 'skyabove':
          p.mesh.rotation.z += dt*0.15;
          p.mesh.position.y = 3.3 + Math.sin(t*0.8)*0.08;
          p.mesh.material.opacity = 0.7 + 0.1*Math.sin(t*1.1);
          break;
        case 'spark': {
          const cyc = (t*2 + p.delay) % 3;
          if (cyc < 0.12){
            if (p.mesh.material.opacity === 0){
              const a = Math.random()*Math.PI*2, r = 0.3+Math.random()*0.6, h = 0.3+Math.random()*1.8;
              p.mesh.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
              p.mesh.material.rotation = Math.random()*Math.PI*2;
            }
            p.mesh.material.opacity = 0.9;
          } else {
            p.mesh.material.opacity = 0;
          }
          break;
        }
        case 'levitate':
          p.mesh.position.y = 0.06 + Math.max(0, Math.sin(t*1.1+p.phase))*0.4;
          break;
        case 'beam': {
          const ang = p.angle + t*0.3;
          p.mesh.position.set(Math.cos(ang)*1.1, 1.6, Math.sin(ang)*1.1);
          p.mesh.material.rotation = ang;
          p.mesh.material.opacity = 0.4+0.3*Math.sin(t*2+p.angle);
          break;
        }
        case 'core':
          p.mesh.material.opacity = 0.6+0.3*Math.sin(t*3);
          break;
        case 'radhalo':
          p.mesh.rotation.z += dt * p.speed;
          p.mesh.position.y = 2.9 + Math.sin(t*0.7)*0.06;
          break;
        case 'orbitalring': {
          // 궤도형: 회전 + 숨쉬듯 천천히 커졌다 작아짐
          if (p.axis === 'z') p.mesh.rotation.z += dt*p.speed; else p.mesh.rotation.x += dt*p.speed;
          const breath = 1 + 0.08*Math.sin(t*1.3+p.breathPhase);
          p.mesh.scale.set(breath, breath, breath);
          break;
        }
        case 'crystaljitter':
          // 크리스탈형: 궤도를 돌며 미세하게 불규칙 진동(잘게 떨림)
          p.orbitA += dt*0.14;
          p.mesh.position.x = Math.cos(p.orbitA)*p.orbitR + Math.sin(t*9+p.jitterPhase)*0.02;
          p.mesh.position.z = Math.sin(p.orbitA)*p.orbitR + Math.cos(t*9+p.jitterPhase)*0.02;
          p.mesh.position.y = p.baseH + Math.sin(t*8+p.jitterPhase)*0.035;
          p.mesh.rotation.y += dt*p.spin;
          p.mesh.rotation.x += dt*p.spin*0.35;
          p.mesh.material.emissiveIntensity = 0.25 + 0.25*Math.abs(Math.sin(t*1.6+p.orbitA*2));
          break;
        case 'pillarburst': {
          // 기둥형: 빠르게 수축했다가 위로 퍼지는 반복 버스트
          const cyc = (t*0.8) % 2 / 2;
          const s = cyc < 0.12 ? (cyc/0.12)*1.1 : Math.max(0.35, 1 - (cyc-0.12)/1.88*0.65);
          p.mesh.scale.set(s, 1, s);
          p.mesh.material.opacity = p.baseOpacity * (0.5+0.5*Math.sin(t*3.2));
          break;
        }
        case 'plasmaorb':
          // 구체형: 중심에서 퍼져나가듯 궤도 + 불규칙 명멸
          p.orbitA += dt*(p.orbitSpeed || 0.4);
          p.mesh.position.x = Math.cos(p.orbitA)*p.orbitR;
          p.mesh.position.z = Math.sin(p.orbitA)*p.orbitR;
          p.mesh.material.opacity = 0.35 + 0.5*Math.abs(Math.sin(t*5.5+p.flickerPhase)*Math.sin(t*2.1+p.flickerPhase));
          break;
        case 'lightningflash': {
          // 번개형: 짧게 번쩍였다가 대부분 시간은 사라져 있음(불규칙 점멸)
          const cyc = (t*1.4 + p.delay) % 2.6;
          p.mesh.material.opacity = cyc < 0.07 ? 0.9 : 0;
          break;
        }
        case 'voidcore':
          p.mesh.scale.setScalar(1 + 0.05*Math.sin(t*1.1));
          break;
        case 'voidsuck': {
          // 바깥에서 시작해 서서히 중심(블랙홀)으로 빨려들어가며 작아짐
          const cyc = ((t + p.cycleT) % p.period) / p.period;
          const r = p.r0 * (1 - cyc);
          const a = p.angle0 + cyc*4.5; // 빨려들며 나선으로 휘어짐
          p.mesh.position.set(Math.cos(a)*r, 1.5 + Math.sin(cyc*Math.PI)*0.15, Math.sin(a)*r);
          p.mesh.material.opacity = 0.75 * (1-cyc*0.3);
          const sc = 1 - cyc*0.7;
          p.mesh.scale.set(sc, sc, 1);
          break;
        }
        case 'novacore':
          p.mesh.material.opacity = 0.75 + 0.25*Math.sin(t*4);
          break;
        case 'novashock': {
          const cyc = ((t*0.9)+p.delay) % 1.5 / 1.5;
          const s = 0.3 + cyc*3.2;
          p.mesh.scale.set(s,s,1);
          p.mesh.material.opacity = Math.max(0, 0.8*(1-cyc));
          break;
        }
        case 'novaburst': {
          const cyc = ((t*1.3)+p.delay) % 1.6 / 1.6;
          const dist = cyc*2.2;
          p.mesh.position.set(Math.cos(p.angle)*dist, 1.6+Math.sin(p.tilt)*dist*0.6, Math.sin(p.angle)*dist);
          p.mesh.material.opacity = Math.max(0, 0.85*(1-cyc*1.1));
          break;
        }
        case 'glitchjump':
          // 순간이동하듯 깨지는 움직임: 부드럽게 움직이지 않고 갑자기 다음 위치로 뚝뚝 끊기며 점프
          p.nextJump -= dt;
          if (p.nextJump <= 0){
            p.mesh.position.set((Math.random()-0.5)*1.4, p.baseH + (Math.random()-0.5)*0.6, (Math.random()-0.5)*1.4);
            p.nextJump = 0.06 + Math.random()*0.25;
            p.mesh.material.opacity = Math.random() < 0.2 ? 0.2 : 0.85;
          }
          break;
        case 'glitchcore':
          // RGB 색분리 코어: 두 색이 미세하게 흔들리며 어긋남
          p.mesh.position.x = p.dx + (Math.random()-0.5)*0.02;
          p.mesh.material.opacity = Math.random() < 0.08 ? 0.15 : 0.6;
          break;
        case 'orbitplanet':
          p.phase += dt*p.speed;
          p.mesh.position.set(
            Math.cos(p.phase)*p.orbitR,
            1.6 + Math.sin(p.phase)*p.orbitR*p.tiltX*0.4,
            Math.sin(p.phase)*p.orbitR*Math.cos(p.tiltX)
          );
          break;
        case 'clockhand':
          p.mesh.rotation.z = -t*p.speed;
          break;
        case 'clocktick': {
          // 초침: 부드럽게 돌지 않고 진짜 시계처럼 똑딱 단위로 점프
          const tickIdx = Math.floor(t*1.2);
          p.mesh.rotation.z = -tickIdx * (Math.PI*2/12);
          break;
        }
        case 'powerpulse': {
          const s = p.baseScale * (1 + 0.06*Math.sin(t*1.8));
          p.mesh.scale.set(s, s, 1);
          p.mesh.material.opacity = 0.2 + 0.12*Math.sin(t*1.8+1);
          break;
        }
        case 'energycolumn':
          p.mesh.material.opacity = p.baseOpacity * (0.7 + 0.3*Math.sin(t*2.4));
          p.mesh.scale.y = p.baseScaleY * (0.9 + 0.1*Math.sin(t*1.3));
          break;
        case 'powerburst': {
          const cyc = (t % p.period) / p.period;
          const s = 0.4 + cyc*p.maxSize;
          p.mesh.scale.set(s, s, 1);
          p.mesh.material.opacity = Math.max(0, 0.5*(1-cyc));
          break;
        }
        case 'powerlight':
          p.light.intensity = p.baseIntensity * (0.85 + 0.15*Math.sin(t*2.2));
          break;
        case 'iconbadge': {
          p.mesh.position.y = p.baseY + Math.sin(t*1.1)*0.06;
          const pulse = 1 + 0.07*Math.sin(t*1.6);
          p.mesh.scale.set(p.baseScale*pulse, p.baseScale*pulse, 1);
          break;
        }
        case 'iconbadgeback':
          p.mesh.position.y = p.baseY + Math.sin(t*1.1)*0.06;
          p.mesh.material.rotation += dt*0.15;
          break;
        case 'nebuladrift':
          p.mesh.material.rotation += dt*p.spin;
          p.mesh.material.opacity = p.baseOpacity * (0.75 + 0.25*Math.sin(t*0.5+p.phase));
          break;
        case 'corepulse': {
          // 여러 주파수의 사인파를 겹쳐서 불규칙하게 맥동하는 밝은 중심 광구 (안쪽 레이어라 등급 높을수록 훨씬 빠르게)
          const ps = p.pulseSpeed || 3;
          const wob = Math.sin(t*ps)*0.5 + Math.sin(t*ps*1.8+1.3)*0.3 + Math.sin(t*ps*0.6+2.6)*0.2;
          const s = p.baseScale * (1 + wob*0.18);
          p.mesh.scale.set(s, s, 1);
          p.mesh.material.opacity = p.baseOpacity * (0.75 + 0.25*Math.sin(t*ps*1.35));
          break;
        }
        case 'swirltorus':
          p.mesh.rotation.z += dt * (p.spinSpeed || 2.6);
          p.mesh.rotation.y += dt * 0.6;
          p.mesh.position.y = 1.1 + Math.sin(t*1.4)*0.08;
          break;
        case 'swirltorus2':
          p.mesh.rotation.z -= dt * (p.spinSpeed || 1.8);
          p.mesh.rotation.x += dt * 0.9;
          p.mesh.position.y = 1.7 + Math.sin(t*1.1+1.7)*0.1;
          break;
        case 'erraticsparkle': {
          // 크기·투명도·궤도 속도가 제각각 불규칙하게 요동치는 외곽 파티클 (가장 바깥이라 가장 느긋함)
          p.orbitA += dt * p.orbitSpeed * (1 + Math.sin(t*p.freq1+p.phase)*0.6);
          const rr = p.orbitR * (1 + Math.sin(t*p.freq2+p.phase2)*0.15);
          p.mesh.position.x = Math.cos(p.orbitA)*rr;
          p.mesh.position.z = Math.sin(p.orbitA)*rr;
          p.mesh.position.y = p.baseH + Math.sin(t*p.freq1*0.7+p.phase)*0.25;
          const flick = Math.max(0, Math.sin(t*p.freq2+p.phase)) * Math.max(0, Math.sin(t*p.freq1*1.3+p.phase2));
          p.mesh.material.opacity = 0.15 + flick*0.65;
          const sc = p.baseSz * (0.7 + flick*0.9);
          p.mesh.scale.set(sc, sc, 1);
          break;
        }
      }
    }
  }

  function recordOwned(aura){

  }
  // 뽑기 없이 도감에서 바로 장착
  function equipAura(aura){
    equippedAuraName = aura.name;

    applyEnvironmentForAura(aura);

  function showAuraTag(aura){
    auraTag.className = 'tier-' + aura.tier;
    const tier = AURA_TIERS[aura.tier];
    const probLabel = aura.mutation ? fmtProb(aura.n) + ' (' + aura.mutation.name + ' 1/' + aura.mutation.n.toLocaleString('ko-KR') + ')' : fmtProb(aura.n);
    const traitLabel = (tier.trait || {}).label || '';
    const fontClass = 'font-' + (tier.font || 'cursive');
    const nameHtml = '<div class="tagName ' + fontClass + '">' + auraDisplayName(aura) + '</div>';
    auraTag.innerHTML = (tier.wind ? '<span class="windWrap">' + nameHtml + '</span>' : nameHtml) +
      '<div class="tagProb">' + probLabel + '</div>' + (traitLabel ? '<div class="tagTrait">' + traitLabel + '</div>' : '');

    updateAuraTag();
    requestAnimationFrame(()=>{
      auraTag.style.opacity = '1';
      auraTag.style.transform = 'translate(-50%, -100%) scale(1)';

  function submitLeaderboardIfBest(aura){
    if (!window.MP || !MP.submitScore) return;
    const tier = AURA_TIERS[aura.tier];
    if (!tier || tier.order <= bestAuraOrderSubmitted) return;
    bestAuraOrderSubmitted = tier.order;
    MP.submitScore('aura_best', tier.order, 'desc', { auraName: auraDisplayName(aura), tierKey: aura.tier }, ()=>{});

      label.className = 'dexTierLabel';

      label.textContent = tier.label;
      row.appendChild(label);
      const items = document.createElement('div');
      items.className = 'dexTierItems';
      AURA_LIST.filter(a => a.tier === tierKey).forEach(a=>{
        const owned = ownedAuras[a.name] || 0;
        if (owned > 0) ownedCount++;
        const card = document.createElement('div');
        card.className = 'dexCard tier-' + a.tier + (owned > 0 ? '' : ' locked') + (equippedAuraName === a.name ? ' equipped' : '');
        card.innerHTML =
          '<div class="dexSwatch"></div>' +
          '<div class="dexName">' + (owned > 0 ? a.name : '???') + '</div>' +
          '<div class="dexProb">' + fmtProb(a.n) + '</div>' +
          (owned > 0 && tier.trait && tier.trait.label ? '<div class="dexTrait">' + tier.trait.label + '</div>' : '') +
          (owned > 0 ? '<div class="dexCount">x' + owned + '</div>' : '');
        if (owned > 0) card.addEventListener('click', ()=> equipAura(a));
        items.appendChild(card);
      });
      row.appendChild(items);
      dexGrid.appendChild(row);

    dexProgress.textContent = '수집 ' + ownedCount + ' / ' + AURA_LIST.length;

  // ---- 진짜 "때리는" 느낌을 위한 임팩트 이펙트: 하얗게 확 터지는 플래시 + 방사형 스피드라인 + 강한 카메라 펀치 ----
  const impactSparkTex = (function(){
    const c = document.createElement('canvas'); c.width=64; c.height=64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.4,'rgba(255,255,255,.9)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  })();
  function playImpactBurst(origin, color, scale){
    scale = scale || 1;
    const grp = new THREE.Group();
    grp.position.copy(origin);
    scene.add(grp);

    // 하얗게 확 터지는 중심 플래시
    const flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: impactSparkTex, color:0xffffff, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
    flash.scale.setScalar(0.4*scale);
    grp.add(flash);
    // 아우라 색 링(펀치가 퍼지는 느낌)
    const punchRing = new THREE.Mesh(new THREE.RingGeometry(0.1,0.22,24), new THREE.MeshBasicMaterial({
      color, transparent:true, opacity:0.95, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending
    }));
    grp.add(punchRing);
    // 방사형 스피드라인 (임팩트 순간 튀는 짧은 선들)
    const lineCount = 8;
    const lines = [];
    for (let i=0;i<lineCount;i++){
      const a = (i/lineCount)*Math.PI*2 + Math.random()*0.3;
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.06*scale, 0.42*scale), new THREE.MeshBasicMaterial({
        color, transparent:true, opacity:0.9, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending
      }));
      line.position.set(Math.cos(a)*0.15*scale, Math.sin(a)*0.15*scale, 0);
      line.lookAt(camera.position);
      line.rotation.z += a;
      grp.add(line);
      lines.push({ mesh:line, angle:a });
    }
    const impactLight = new THREE.PointLight(color, 4.5*scale, 8*scale);
    grp.add(impactLight);

    let lastTs = null, t = 0;
    const DUR = 0.26;
    (function animImpact(ts){
      if (lastTs === null) lastTs = ts;
      const dt2 = Math.min(0.05, (ts-lastTs)/1000);
      lastTs = ts;
      t += dt2;
      const tt = Math.min(1, t/DUR);
      const pop = tt < 0.3 ? tt/0.3 : 1; // 순간적으로 튀어나왔다가
      const fade = tt < 0.3 ? 1 : 1-((tt-0.3)/0.7); // 나머지 시간에 빠르게 사라짐
      flash.scale.setScalar((0.4+pop*0.5)*scale);
      flash.material.opacity = fade;
      punchRing.scale.setScalar(1 + tt*5*scale);
      punchRing.material.opacity = 0.95*fade;
      lines.forEach(l=>{
        const d = 0.15 + tt*0.9;
        l.mesh.position.set(Math.cos(l.angle)*d*scale, Math.sin(l.angle)*d*scale, 0);
        l.mesh.material.opacity = 0.9*fade;
      });
      impactLight.intensity = 4.5*scale*fade;
      if (tt < 1){
        requestAnimationFrame(animImpact);
      } else {
        scene.remove(grp);
      }
    })(performance.now());

    fieldSkillShakeBurst = Math.max(fieldSkillShakeBurst, 1.7*scale);
  }

  // 스킬 타입별 색감/생김새가 살짝 다른 이펙트 (배틀 스킬과 같은 SKILL_BY_FX 데이터 기반)
  // ---- 공용 애니메이션 헬퍼 (rAF 타임스탬프 기반 독립 델타, 메인 루프와 충돌 없음) ----
  function animateFx(duration, onUpdate, onDone){
    let t = 0, lastTs = null;
    (function step(ts){
      if (lastTs === null) lastTs = ts;
      const dt2 = Math.min(0.05, (ts-lastTs)/1000);
      lastTs = ts;
      t += dt2;
      const tt = Math.min(1, t/duration);
      onUpdate(tt, dt2, t);
      if (tt < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    })(performance.now());
  }
  function clockFaceTexture(col){
    const c = document.createElement('canvas'); c.width=256; c.height=256;
    const ctx = c.getContext('2d');
    const hex = '#'+col.getHexString();
    ctx.strokeStyle = hex; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(128,128,110,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth = 3;
    for (let i=0;i<12;i++){
      const a = (i/12)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(128+Math.cos(a)*95, 128+Math.sin(a)*95);
      ctx.lineTo(128+Math.cos(a)*108, 128+Math.sin(a)*108);
      ctx.stroke();
    }
    return new THREE.CanvasTexture(c);
  }

  // ---- 1) hit: 빛나는 포탄이 날아가서 터짐 ----
  function fxCannon(origin, dirX, dirZ, col){
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10), new THREE.MeshBasicMaterial({ color:col }));
    orb.position.copy(origin);
    scene.add(orb);
    const trailPts = [];
    const trail = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1,6), new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.5 }));
    scene.add(trail);
    const light = new THREE.PointLight(col, 2.5, 6); orb.add(light);
    const travelDist = 5.5;
    animateFx(0.32, (tt)=>{
      const d = tt*travelDist;
      orb.position.set(origin.x+dirX*d, origin.y, origin.z+dirZ*d);
      trail.position.set(origin.x+dirX*d*0.5, origin.y, origin.z+dirZ*d*0.5);
      trail.rotation.z = Math.PI/2;
      trail.rotation.y = Math.atan2(dirX,dirZ);
      trail.scale.set(1, Math.max(0.1,d), 1);
      trail.material.opacity = 0.5*(1-tt);
    }, ()=>{
      playImpactBurst(orb.position.clone(), col, 1.3);
      scene.remove(orb); scene.remove(trail);
    });
  }
  // ---- 2) crit: 십자형 섬광 ----
  function fxCritFlash(origin, col){
    const rays = [];
    for (let i=0;i<4;i++){
      const ray = new THREE.Mesh(new THREE.PlaneGeometry(0.14,3.4), new THREE.MeshBasicMaterial({
        color:0xffffff, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
      }));
      ray.position.copy(origin);
      ray.rotation.z = (i/4)*Math.PI;
      ray.lookAt(camera.position);
      scene.add(ray); rays.push(ray);
    }
    const core = new THREE.Sprite(new THREE.SpriteMaterial({ map:impactSparkTex, color:col, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
    core.position.copy(origin); core.scale.setScalar(0.3);
    scene.add(core);
    const baseFov = camera.fov;
    animateFx(0.32, (tt)=>{
      const fade = 1-tt;
      rays.forEach(r=>{ r.material.opacity = 0.95*fade; r.scale.set(1, 1+tt*1.4, 1); });
      core.scale.setScalar(0.3 + tt*1.6);
      core.material.opacity = fade;
      camera.fov = baseFov - (1-tt)*3*Math.sin(tt*Math.PI);
      camera.updateProjectionMatrix();
    }, ()=>{
      camera.fov = baseFov; camera.updateProjectionMatrix();
      rays.forEach(r=>scene.remove(r)); scene.remove(core);
    });
  }
  // ---- 3) pierce: 앞으로 쭉 뻗는 빛줄기 ----
  function fxBeam(origin, dirX, dirZ, col){
    const LEN = 13;
    const beam = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, LEN), new THREE.MeshBasicMaterial({
      color:col, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false
    }));
    beam.position.set(origin.x+dirX*0.1, origin.y, origin.z+dirZ*0.1);
    beam.rotation.y = Math.atan2(dirX, dirZ);
    beam.scale.z = 0.02;
    scene.add(beam);
    const core = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,LEN), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:1 }));
    core.position.copy(beam.position); core.rotation.copy(beam.rotation); core.scale.z = 0.02;
    scene.add(core);
    animateFx(0.4, (tt)=>{
      const grow = Math.min(1, tt/0.25);
      const fade = tt < 0.6 ? 1 : 1-((tt-0.6)/0.4);
      beam.scale.z = grow; core.scale.z = grow;
      beam.position.set(origin.x+dirX*(LEN*grow/2), origin.y, origin.z+dirZ*(LEN*grow/2));
      core.position.copy(beam.position);
      beam.material.opacity = 0.9*fade; core.material.opacity = fade;
    }, ()=>{ scene.remove(beam); scene.remove(core); });
  }
  // ---- 4) multi: 연속 다단 타격 ----
  function fxMultiHit(origin, dirX, dirZ, col){
    const hits = 3+Math.floor(Math.random()*2);
    for (let i=0;i<hits;i++){
      setTimeout(()=>{
        const off = 0.6+i*0.7;
        playImpactBurst(new THREE.Vector3(origin.x+dirX*off, origin.y, origin.z+dirZ*off), col, 0.8);
      }, i*110);
    }
  }
  // ---- 5) dot: 바닥에 퍼지는 위험지대 (화상/중독) ----
  function fxGroundHazard(origin, col){
    const ground = new THREE.Mesh(new THREE.RingGeometry(0.1,2.2,32), new THREE.MeshBasicMaterial({
      color:col, transparent:true, opacity:0.55, side:THREE.DoubleSide, depthWrite:false
    }));
    ground.rotation.x = -Math.PI/2;
    ground.position.set(origin.x, origin.y-1.05, origin.z);
    scene.add(ground);
    const emberCount = 14;
    const embers = [];
    for (let i=0;i<emberCount;i++){
      const e = new THREE.Sprite(new THREE.SpriteMaterial({ map:impactSparkTex, color:col, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
      const a = Math.random()*Math.PI*2, r = Math.random()*1.8;
      e.position.set(origin.x+Math.cos(a)*r, origin.y-1, origin.z+Math.sin(a)*r);
      e.scale.setScalar(0.15+Math.random()*0.1);
      e.userData.rise = 0.6+Math.random()*0.8;
      scene.add(e); embers.push(e);
    }
    animateFx(1.3, (tt,dt2)=>{
      ground.scale.setScalar(1+tt*0.15);
      ground.material.opacity = 0.55*(1-tt);
      embers.forEach(e=>{ e.position.y += e.userData.rise*dt2; e.material.opacity = 1-tt; });
    }, ()=>{ scene.remove(ground); embers.forEach(e=>scene.remove(e)); });

  // ---- 6) debuff: 어두운 압력 링이 내리찍힘 (땅 균열) ----
  function fxDarkPress(origin, col){
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.05,4,16,1,true), new THREE.MeshBasicMaterial({
      color:0x1a1030, transparent:true, opacity:0.6, side:THREE.DoubleSide, depthWrite:false
    }));
    shaft.position.set(origin.x, origin.y+2, origin.z);
    scene.add(shaft);
    const crackRing = new THREE.Mesh(new THREE.RingGeometry(0.05,0.15,6), new THREE.MeshBasicMaterial({
      color:col, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false
    }));
    crackRing.rotation.x = -Math.PI/2;
    crackRing.position.set(origin.x, origin.y-1.05, origin.z);
    scene.add(crackRing);
    animateFx(0.55, (tt)=>{
      shaft.scale.y = 1-tt*0.7;
      shaft.material.opacity = 0.6*(1-tt);
      if (tt > 0.5){
        const p = (tt-0.5)/0.5;
        crackRing.material.opacity = 0.8*(1-p);
        crackRing.scale.setScalar(1+p*10);
      }
    }, ()=>{ scene.remove(shaft); scene.remove(crackRing); fieldSkillShakeBurst = Math.max(fieldSkillShakeBurst, 1.2); });
  }
  // ---- 7) stun: 머리 위 시계가 빠르게 돌다가 뚝 멈춤 ----
  function fxClock(origin, col){
    const clockTex = clockFaceTexture(col);
    const face = new THREE.Sprite(new THREE.SpriteMaterial({ map:clockTex, transparent:true, opacity:0.95 }));
    face.position.set(origin.x, origin.y+1.6, origin.z);
    face.scale.setScalar(1.3);
    scene.add(face);
    const hourHand = new THREE.Mesh(new THREE.PlaneGeometry(0.05,0.32), new THREE.MeshBasicMaterial({ color:col, transparent:true }));
    const minHand = new THREE.Mesh(new THREE.PlaneGeometry(0.04,0.46), new THREE.MeshBasicMaterial({ color:col, transparent:true }));
    [hourHand, minHand].forEach(h=>{ h.position.copy(face.position); h.position.z += 0.01; scene.add(h); });
    animateFx(0.85, (tt)=>{
      const spinPhase = tt < 0.65 ? tt/0.65 : 1;
      const spin = spinPhase*Math.PI*10*(1-Math.pow(1-spinPhase,3)); // 빠르게 돌다가 감속하며 멈춤
      hourHand.rotation.z = -spin*0.6;
      minHand.rotation.z = -spin;
      hourHand.position.set(face.position.x, face.position.y, face.position.z+0.01);
      minHand.position.set(face.position.x, face.position.y, face.position.z+0.01);
      const fade = tt < 0.7 ? 1 : 1-((tt-0.7)/0.3);
      face.material.opacity = 0.95*fade; hourHand.material.opacity = fade; minHand.material.opacity = fade;
      if (tt > 0.63 && tt < 0.68) fieldSkillShakeBurst = Math.max(fieldSkillShakeBurst, 1.4); // 멈추는 순간 충격
    }, ()=>{ scene.remove(face); scene.remove(hourHand); scene.remove(minHand); });
  }
  // ---- 8) drain: 파티클이 나선으로 빨려들어옴 ----
  function fxDrainSpiral(origin, col){
    const n = 20;
    const parts = [];
    for (let i=0;i<n;i++){
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:impactSparkTex, color:col, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
      const a = (i/n)*Math.PI*2;
      s.userData.angle = a; s.userData.r = 2.2;
      s.scale.setScalar(0.16);
      s.position.set(origin.x+Math.cos(a)*2.2, origin.y+Math.random()*1.2, origin.z+Math.sin(a)*2.2);
      scene.add(s); parts.push(s);
    }
    const glow = new THREE.PointLight(col, 0, 6);
    glow.position.copy(origin); scene.add(glow);
    animateFx(0.6, (tt)=>{
      parts.forEach(s=>{
        const r = 2.2*(1-tt);
        const a = s.userData.angle + tt*8;
        s.position.set(origin.x+Math.cos(a)*r, origin.y+ (1-tt)*1.2, origin.z+Math.sin(a)*r);
        s.material.opacity = 1;
      });
      glow.intensity = 3.5*tt;
    }, ()=>{ parts.forEach(s=>scene.remove(s)); scene.remove(glow); fieldSkillShakeBurst = Math.max(fieldSkillShakeBurst, 1.0); });
  }
  // ---- 9) nuke: 지형이 팍 솟았다가 대폭발 ----
  function fxGroundRise(origin, col){
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.8,0.3,20), new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.85 }));
    disc.position.set(origin.x, origin.y-1.1, origin.z);
    scene.add(disc);
    const shock = new THREE.Mesh(new THREE.RingGeometry(0.2,0.5,40), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false }));
    shock.rotation.x = -Math.PI/2; shock.position.set(origin.x, origin.y-1.05, origin.z);
    scene.add(shock);
    animateFx(0.7, (tt)=>{
      if (tt < 0.35){
        const p = tt/0.35;
        disc.position.y = origin.y-1.1 + p*1.6; // 솟아오름
        disc.material.opacity = 0.85;
      } else {
        const p = (tt-0.35)/0.65;
        disc.position.y = origin.y-1.1 + (1.6*(1-p)); // 다시 가라앉음
        disc.material.opacity = 0.85*(1-p);
        shock.material.opacity = 0.9*(1-p);
        shock.scale.setScalar(1+p*12);
        if (p < 0.05) fieldSkillShakeBurst = Math.max(fieldSkillShakeBurst, 2.4);
      }
    }, ()=>{ scene.remove(disc); scene.remove(shock); playImpactBurst(origin, col, 2.0); });
  }
  // ---- 10) random: 글리치처럼 색색 조각이 튐 ----
  function fxGlitch(origin, col){
    const colors = [col, new THREE.Color(0xff3b3b), new THREE.Color(0x3bffea), new THREE.Color(0xffffff)];
    const frag = [];
    for (let i=0;i<10;i++){
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.25,0.05), new THREE.MeshBasicMaterial({ color: colors[i%colors.length], transparent:true, opacity:0.9 }));
      b.position.set(origin.x+(Math.random()-0.5)*1.6, origin.y+Math.random()*1.4, origin.z+(Math.random()-0.5)*1.6);
      scene.add(b); frag.push(b);
    }
    animateFx(0.45, (tt)=>{
      frag.forEach(b=>{
        if (Math.random() < 0.3){
          b.position.set(origin.x+(Math.random()-0.5)*1.6, origin.y+Math.random()*1.4, origin.z+(Math.random()-0.5)*1.6);
        }
        b.material.opacity = (1-tt)*(Math.random()>0.5?1:0.3);
      });
    }, ()=>{ frag.forEach(b=>scene.remove(b)); });
  }
  // ---- 11) heal: 위로 감아 올라가는 부드러운 빛 ----
  function fxHealSwirl(origin, col){
    const n = 16;
    const parts = [];
    for (let i=0;i<n;i++){
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:impactSparkTex, color:col, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
      s.userData.angle = (i/n)*Math.PI*2; s.userData.speed = 0.8+Math.random()*0.5;
      s.scale.setScalar(0.18);
      scene.add(s); parts.push(s);
    }
    animateFx(1.1, (tt)=>{
      parts.forEach(s=>{
        const a = s.userData.angle + tt*6;
        const r = 0.7 - tt*0.3;
        s.position.set(origin.x+Math.cos(a)*r, origin.y-0.8+tt*2.4*s.userData.speed, origin.z+Math.sin(a)*r);
        s.material.opacity = 1-tt;
      });
    }, ()=>{ parts.forEach(s=>scene.remove(s)); });
  }
  // ---- 12) shield: 육각 보호막 돔 ----
  function fxShieldDome(origin, col){
    const dome = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,1), new THREE.MeshBasicMaterial({
      color:col, transparent:true, opacity:0.35, wireframe:true
    }));
    dome.position.copy(origin);
    scene.add(dome);
    const fill = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,1), new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.12 }));
    fill.position.copy(origin);
    scene.add(fill);
    animateFx(1.0, (tt,dt2)=>{
      const grow = Math.min(1, tt/0.25);
      dome.scale.setScalar(grow); fill.scale.setScalar(grow);
      dome.rotation.y += dt2*1.4;
      const fade = tt < 0.7 ? 1 : 1-((tt-0.7)/0.3);
      dome.material.opacity = 0.35*fade; fill.material.opacity = 0.12*fade;
    }, ()=>{ scene.remove(dome); scene.remove(fill); });
  }
  // ---- 13) buff: 나선으로 쌓이는 링, 마지막에 위로 터짐 ----
  function fxBuffRing(origin, col){
    const rings = [];
    for (let i=0;i<5;i++){
      const r = new THREE.Mesh(new THREE.TorusGeometry(0.55,0.04,8,20), new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.9 }));
      r.rotation.x = Math.PI/2;
      r.userData.delay = i*0.08;
      scene.add(r); rings.push(r);
    }
    animateFx(0.75, (tt)=>{
      rings.forEach((r,i)=>{
        const rt = Math.max(0, Math.min(1, (tt - r.userData.delay)/0.6));
        r.position.set(origin.x, origin.y-0.9+rt*2.6, origin.z);
        r.material.opacity = 0.9*(1-rt);
        r.scale.setScalar(1-rt*0.3);
      });
    }, ()=>{ rings.forEach(r=>scene.remove(r)); });
  }
  // ---- 14) haste: 수평 스피드라인 ----
  function fxSpeedLines(origin, dirX, dirZ, col){
    const lines = [];
    for (let i=0;i<7;i++){
      const l = new THREE.Mesh(new THREE.PlaneGeometry(0.08,1.6), new THREE.MeshBasicMaterial({
        color:col, transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending
      }));
      const off = (Math.random()-0.5)*1.6;
      l.position.set(origin.x - dirX*1.5 + (-dirZ)*off, origin.y-0.4+Math.random()*1.2, origin.z - dirZ*1.5 + dirX*off);
      l.rotation.y = Math.atan2(dirX,dirZ);
      lines.push(l); scene.add(l);
    }
    animateFx(0.4, (tt)=>{
      lines.forEach(l=>{
        l.position.x += dirX*0.5; l.position.z += dirZ*0.5;
        l.material.opacity = 0.85*(1-tt);
      });
    }, ()=>{ lines.forEach(l=>scene.remove(l)); });
  }

  function playFieldSkillEffect(tier, skill){
    const col = new THREE.Color(tier.color2 != null ? tier.color2 : tier.color);
    const origin = new THREE.Vector3(pos.x, pos.y + 1.1, pos.z);
    const dirX = Math.sin(facing), dirZ = Math.cos(facing);
    switch (skill.type){
      case 'hit':    fxCannon(origin, dirX, dirZ, col); break;
      case 'crit':   fxCritFlash(origin, col); break;
      case 'pierce': fxBeam(origin, dirX, dirZ, col); break;
      case 'multi':  fxMultiHit(origin, dirX, dirZ, col); break;
      case 'dot':    fxGroundHazard(origin, col); break;
      case 'debuff': fxDarkPress(origin, col); break;
      case 'stun':   fxClock(origin, col); break;
      case 'drain':  fxDrainSpiral(origin, col); break;
      case 'nuke':   fxGroundRise(origin, col); break;
      case 'random': fxGlitch(origin, col); break;
      case 'heal':   fxHealSwirl(origin, col); break;
      case 'shield': fxShieldDome(origin, col); break;
      case 'buff':   fxBuffRing(origin, col); break;
      case 'haste':  fxSpeedLines(origin, dirX, dirZ, col); break;
      default:       playImpactBurst(origin, col, 1.5);
    }
  }

  function useFieldSkill(){
    if (!equippedAuraTier){
      showFieldSkillToast('먼저 아우라를 장착해야 스킬을 쓸 수 있어요!');
      return;
    }
    if (fieldSkillCooldown > 0) return;
    const tier = AURA_TIERS[equippedAuraTier];
    const skill = (typeof SKILL_BY_FX !== 'undefined' && SKILL_BY_FX[tier.fx]) || { name: tier.label + ' 스킬' };
    playFieldSkillEffect(tier, skill);
    showFieldSkillToast('✨ ' + skill.name + ' 발동!');
    fieldSkillCooldown = FIELD_SKILL_COOLDOWN;
  }
  let fieldSkillToastTimer = null;
  function showFieldSkillToast(text){
    fieldSkillToast.textContent = text;
    fieldSkillToast.classList.add('show');
    clearTimeout(fieldSkillToastTimer);
    fieldSkillToastTimer = setTimeout(()=> fieldSkillToast.classList.remove('show'), 1400);
  }
  fieldSkillBtn.addEventListener('click', useFieldSkill);
  window.addEventListener('keydown', e=>{
    if (e.code === 'KeyR' && !e.repeat) useFieldSkill();
  });

  // ---- 일반 공격 (아우라마다 색만 다르고 동작은 동일 - 스킬보다 훨씬 빠르고 짧은 쿨다운) ----
  const fieldAttackBtn = document.getElementById('fieldAttackBtn');
  let fieldAttackCooldown = 0;
  const FIELD_ATTACK_COOLDOWN = 0.45;
  function useFieldAttack(){
    if (fieldAttackCooldown > 0) return;
    const tier = equippedAuraTier ? AURA_TIERS[equippedAuraTier] : null;
    const col = new THREE.Color(tier ? (tier.color2 != null ? tier.color2 : tier.color) : 0xffffff);
    // 캐릭터가 바라보는 방향 살짝 앞쪽 지점에서 타격 - 진짜 주먹이 나가는 느낌
    const fx = pos.x + Math.sin(facing) * 0.9;
    const fz = pos.z + Math.cos(facing) * 0.9;
    const origin = new THREE.Vector3(fx, pos.y + 1.25, fz);
    playImpactBurst(origin, col, 1.0);

  function pickEnemyTier(playerTierKey){

    const near = keys.filter(k => Math.abs(AURA_TIERS[k].order - pOrder) <= 3);

  function tickStatuses(u){
    if (u.dot.length){
      let dmg = 0;
      u.dot = u.dot.filter(d=>{ dmg += d.power; d.turns--; return d.turns>0; });
      if (dmg>0){
        u.hp -= dmg;
        appendBattleLog(`☠️ ${u.name}이(가) 지속피해로 ${Math.round(dmg)} 피해를 입었다.`);
      }
    }
    return u.hp > 0;
  }

  function dealDamage(target, rawDmg, ignoreDef, sourceName, verb){
    let dmg = ignoreDef ? rawDmg : Math.max(1, rawDmg - target.stats.def*0.5);
    if (target.defending) dmg *= 0.5;
    if (target.shield > 0){
      const absorbed = Math.min(target.shield, dmg);
      target.shield -= absorbed;
      dmg -= absorbed;
    }
    dmg = Math.max(0, Math.round(dmg));
    target.hp -= dmg;
    appendBattleLog(`${sourceName}의 ${verb}! ${target.name}에게 ${dmg} 피해.`);
    return dmg;
  }

  // 스킬 이펙트 적용 (공격자 skill 데이터 기준으로 type별 분기)
  function applySkillEffect(caster, target){
    const skill = caster.stats.skill;
    const baseAtk = caster.stats.atk * (caster.buffNext ? 1.5 : 1);
    caster.buffNext = false;
    let totalDmg = 0;
    switch (skill.type){
      case 'hit':
        totalDmg = dealDamage(target, baseAtk*skill.power, false, caster.name, skill.name);
        break;
      case 'crit': {
        const isCrit = Math.random() < (skill.chance||0.3);
        totalDmg = dealDamage(target, baseAtk*skill.power*(isCrit?1.8:1), false, caster.name, skill.name + (isCrit?' (치명타!)':''));
        break;
      }
      case 'pierce':
        totalDmg = dealDamage(target, baseAtk*skill.power, true, caster.name, skill.name);
        break;
      case 'multi': {
        for (let i=0;i<(skill.hits||2);i++){
          totalDmg += dealDamage(target, baseAtk*skill.power, false, caster.name, skill.name+` ${i+1}타`);
          if (target.hp<=0) break;
        }
        break;
      }
      case 'dot': {
        totalDmg = dealDamage(target, baseAtk*skill.power, false, caster.name, skill.name);
        target.dot.push({ power: Math.max(1, Math.round(baseAtk*skill.power*0.4)), turns: skill.turns||3 });
        appendBattleLog(`🩸 ${target.name}에게 지속피해 효과가 걸렸다.`);
        break;
      }
      case 'debuff':
        totalDmg = dealDamage(target, baseAtk*skill.power, false, caster.name, skill.name);
        target.stats = Object.assign({}, target.stats, { def: Math.max(0, target.stats.def*0.7) });
        appendBattleLog(`🔻 ${target.name}의 방어력이 감소했다.`);
        break;
      case 'stun': {
        totalDmg = dealDamage(target, baseAtk*skill.power, false, caster.name, skill.name);
        if (Math.random() < (skill.chance||0.3)){
          target.stunTurns = (target.stunTurns||0) + 1;
          appendBattleLog(`💫 ${target.name}이(가) 기절했다!`);
        }
        break;
      }
      case 'drain': {
        totalDmg = dealDamage(target, baseAtk*skill.power, false, caster.name, skill.name);
        const heal = Math.round(totalDmg*0.6);
        caster.hp = Math.min(caster.maxHp, caster.hp + heal);
        appendBattleLog(`💉 ${caster.name}이(가) ${heal} 체력을 흡수했다.`);
        break;
      }
      case 'nuke':
        totalDmg = dealDamage(target, baseAtk*skill.power, false, caster.name, skill.name);
        break;
      case 'random': {
        const mult = 0.6 + Math.random()*1.8;
        totalDmg = dealDamage(target, baseAtk*skill.power*mult, false, caster.name, skill.name);
        break;
      }
      case 'heal': {
        const heal = Math.round(caster.maxHp*skill.power);
        caster.hp = Math.min(caster.maxHp, caster.hp + heal);
        appendBattleLog(`💚 ${caster.name}이(가) ${skill.name}(으)로 ${heal} 회복했다.`);
        break;
      }
      case 'shield': {
        const sh = Math.round(caster.maxHp*skill.power);
        caster.shield += sh;
        appendBattleLog(`🛡 ${caster.name}이(가) 보호막 ${sh}을 얻었다.`);
        if (skill.name.includes('가호')){
          const heal = Math.round(caster.maxHp*0.15);
          caster.hp = Math.min(caster.maxHp, caster.hp+heal);
          appendBattleLog(`💚 ${caster.name}이(가) ${heal} 회복했다.`);
        }
        break;
      }
      case 'buff':
        caster.buffNext = true;
        appendBattleLog(`⚡ ${caster.name}이(가) ${skill.name}(으)로 다음 공격을 강화했다.`);
        break;
      case 'haste':
        appendBattleLog(`⏩ ${caster.name}이(가) ${skill.name}(으)로 한 번 더 움직인다!`);
        totalDmg = -1; // haste 신호: 상대 턴 넘기지 않고 한번 더
        break;
    }
    return totalDmg;
  }

  // 적 AI 턴 - 공격/스킬(쿨다운 없으면 60% 확률)/체력 낮으면 이따금 방어
  function enemyTurn(){
    const { player, enemy } = battleState;
    if (enemy.hp <= 0 || battleState.over) return;
    enemy.defending = false;
    if (!tickStatuses(enemy)){ endBattleCheck(); return; }
    if (enemy.stunTurns > 0){
      enemy.stunTurns--;
      appendBattleLog(`💫 ${enemy.name}은(는) 기절해서 움직이지 못했다.`);
    } else if (enemy.hp < enemy.maxHp*0.25 && Math.random()<0.3){
      enemy.defending = true;
      appendBattleLog(`🛡 ${enemy.name}이(가) 방어 자세를 취했다.`);
    } else if (enemy.skillCd<=0 && Math.random()<0.55){
      const r = applySkillEffect(enemy, player);
      enemy.skillCd = SKILL_COOLDOWN;
      if (r === -1){ updateBattleUI(); if(!endBattleCheck()) enemyTurn(); return; }
    } else {
      dealDamage(player, enemy.stats.atk, false, enemy.name, '공격');
    }
    if (enemy.skillCd>0) enemy.skillCd--;
    updateBattleUI();
    endBattleCheck();
  }

  function playerAction(fn){

    } else {

    }
    updateBattleUI();
    if (endBattleCheck()) return;
    setTimeout(enemyTurn, 550);
  }

  // ---- 뽑기 사운드(틱) ----
  let audioCtx = null;
  function playTick(freq){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.value = 0.05;
      osc.connect(gain); gain.connect(audioCtx.destination);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.09);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } catch(e){}
  }

  // ---- 슬롯머신 릴 뽑기 연출 ----
  const gachaBtn = document.getElementById('gachaBtn');
  const gachaOverlay = document.getElementById('gachaOverlay');
  const gachaReel = document.getElementById('gachaReel');
  let gachaSpinning = false;
  const REEL_ITEM_H = 68;
  const REEL_CENTER_SLOT = 2;

  function easeOutQuint(t){ return 1 - Math.pow(1-t, 5); }

  async function runGacha(){
    if (gachaSpinning) return;
    gachaSpinning = true;
    gachaBtn.disabled = true;

    // 멀티플라이어 체인 (10x → 100x → 1000x ...) - 발동하면 릴 스핀 전에 화려하게 먼저 보여주고, 실제 확률에도 반영됨
    const chainMult = rollMultiplierChain();
    if (chainMult > 1){
      await playMultiplierChain(chainMult);
    }

    const won = Object.assign({}, weightedRandomAura(chainMult));
    won.mutation = rollMutation();
    won.chainMult = chainMult;

    const seqLen = 34;
    const seq = [];
    for (let i=0; i<seqLen-1; i++) seq.push(weightedRandomAura(chainMult));
    seq.push(won);

    gachaReel.innerHTML = '';
    gachaReel.style.transform = 'translateY(' + (REEL_CENTER_SLOT*REEL_ITEM_H) + 'px)';
    seq.forEach(a=>{
      const div = document.createElement('div');
      div.className = 'reelItem tier-' + a.tier;
      const displayName = a.mutation ? (a.mutation.name + ' ' + a.name) : a.name;
      div.innerHTML = '<span class="reelName">'+displayName+'</span><span class="reelProb">'+fmtProb(a.n)+'</span>';
      gachaReel.appendChild(div);
    });

    gachaOverlay.style.display = 'flex';
    requestAnimationFrame(()=>{ gachaOverlay.classList.add('show'); });

    const targetIndex = seq.length - 1;
    const targetScroll = targetIndex * REEL_ITEM_H;
    const DURATION = 3400 * activeSpeedMult();
    const startTime = performance.now();
    let lastIdx = -1;

    function step(now){
      const el = now - startTime;
      const t = Math.min(1, el / DURATION);
      const eased = easeOutQuint(t);
      const scroll = targetScroll * eased;
      gachaReel.style.transform = 'translateY(' + (-scroll + REEL_CENTER_SLOT*REEL_ITEM_H) + 'px)';

      const idx = Math.min(targetIndex, Math.floor(scroll / REEL_ITEM_H));
      if (idx !== lastIdx){
        lastIdx = idx;
        playTick(420 + (1-t)*520);
        const el2 = gachaReel.children[idx];
        if (el2){
          el2.classList.add('tickFlash');
          setTimeout(()=>{ el2.classList.remove('tickFlash'); }, 150);
        }
      }

      if (t < 1){
        requestAnimationFrame(step);
      } else {
        finishGacha(won, seq);
      }
    }
    requestAnimationFrame(step);
  }

  function finishGacha(won, seq){
    const winnerEl = gachaReel.children[seq.length-1];
    if (winnerEl) winnerEl.classList.add('winner');
    playTick(880);

    setTimeout(()=>{
      gachaOverlay.classList.remove('show');
      setTimeout(()=>{
        gachaOverlay.style.display = 'none';
        gachaSpinning = false;
        gachaBtn.disabled = false;
        showAuraResult(won);

    }, 900);
  }

  // ---------- Animation state ----------
  let walkT = 0;
  let climbT = 0;
  const speedTag = document.getElementById('speedTag');

  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    lobbyInfo.update(dt); // 로비 맵 자체 애니메이션(분수대/포털/횃불/룬 회전 등)
    updateFieldSkillCd(dt);

    // 시프트락: 카메라·캐릭터가 완전히 일체화되어 즉시 반응. 아닐 때: 로블록스 특유의 부드러운 회전 감쇠
    const rotFollow = shiftLock ? 1 : Math.min(1, 16*dt);
    camYaw += (rawYaw - camYaw) * rotFollow;
    camPitch += (rawPitch - camPitch) * rotFollow;

    // --- input vector (joystick + keyboard) ---
    let inX = moveVec.x, inY = moveVec.y;
    if (keys['KeyW']||keys['ArrowUp']) inY = -1;
    if (keys['KeyS']||keys['ArrowDown']) inY = 1;
    if (keys['KeyA']||keys['ArrowLeft']) inX = -1;
    if (keys['KeyD']||keys['ArrowRight']) inX = 1;
    if (gachaSpinning){ inX = 0; inY = 0; } // 가챠 연출 중에는 조작 정지
    const inLen = Math.hypot(inX, inY);
    if (inLen > 1){ inX/=inLen; inY/=inLen; }

    // camera-relative movement direction
    const forward = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
    const right = new THREE.Vector3(-Math.cos(camYaw), 0, Math.sin(camYaw));
    const moveDir = new THREE.Vector3();
    moveDir.addScaledVector(forward, -inY);
    moveDir.addScaledVector(right, inX);
    const moving = moveDir.lengthSq() > 0.0001;
    if (moving) moveDir.normalize();

    // acceleration/deceleration ramp (not robotic stop)
    const targetVX = moveDir.x * WALK_SPEED * equippedSpeedMult;
    const targetVZ = moveDir.z * WALK_SPEED * equippedSpeedMult;
    const accel = moving ? 55 : 40; // 로블록스 기본 이동은 거의 즉시 목표속도로 스냅됨(찰진 느낌의 핵심)
    curSpeed.x += (targetVX - curSpeed.x) * Math.min(1, accel*dt);
    curSpeed.y += (targetVZ - curSpeed.y) * Math.min(1, accel*dt);

    const nearTruss = getActiveTruss(pos.x, pos.z, pos.y, wasClimbing ? currentTruss : null);
    if (trussExitCooldown > 0) trussExitCooldown = Math.max(0, trussExitCooldown - dt);

    if (nearTruss && !wasClimbing){
      // 방금 올라탐: 접근한 방향(트러스를 바라보는 방향)을 그대로 고정해서 매달림
      const dx = nearTruss.x - pos.x, dz = nearTruss.z - pos.z;
      mountFacing = Math.atan2(dx, dz);
      currentTruss = nearTruss;
    }

    let gripOK = true;
    if (nearTruss && shiftLock){
      let diff = camYaw - mountFacing;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      if (Math.abs(diff) > 1.05){ // 약 60도 넘게 카메라를 돌리면 손을 놓침
        gripOK = false;
      }
    }
    onTruss = !!nearTruss && gripOK && trussExitCooldown <= 0;
    wasClimbing = onTruss;
    if (onTruss) currentTruss = nearTruss;

    // 맨틀 트리거: 점프 정점 근처(상승력이 거의 소진된 시점)에서 손이 닿는 턱에 다가가면 매달려 기어오름 시작
    // (점프 초반 최고 속도로 상승 중에 걸리면 점프+맨틀이 그대로 합산되어 지나치게 높이 올라가므로 정점 근처로 제한)
    if (!mantling && !onTruss && !grounded && moving && velY < 8){
      const mtx = pos.x + curSpeed.x * dt;
      const mtz = pos.z + curSpeed.y * dt;
      const ledge = tryMantle(mtx, mtz, pos.y);
      if (ledge){
        mantling = true;
        mantleTimer = 0.38;
        mantleStartPos.set(pos.x, pos.y, pos.z);
        const cx = Math.max(ledge.minX + 0.3, Math.min(ledge.maxX - 0.3, mtx));
        const cz = Math.max(ledge.minZ + 0.3, Math.min(ledge.maxZ - 0.3, mtz));
        mantleEndPos.set(cx, ledge.topY, cz);
        velY = 0;
        curSpeed.set(0, 0);
      }
    }

    if (mantling){
      // ---------- 맨틀: 가까스로 닿은 턱을 붙잡고 기어올라감 ----------
      mantleTimer -= dt;
      const tt = Math.min(1, 1 - Math.max(0, mantleTimer) / 0.38);
      // 앞부분은 위로, 뒷부분은 앞으로 - 자연스러운 걸쳐 오르기 궤적
      const upT = Math.min(1, tt / 0.6);
      const fwdT = Math.max(0, (tt - 0.4) / 0.6);
      pos.x = mantleStartPos.x + (mantleEndPos.x - mantleStartPos.x) * fwdT;
      pos.z = mantleStartPos.z + (mantleEndPos.z - mantleStartPos.z) * fwdT;
      pos.y = mantleStartPos.y + (mantleEndPos.y - mantleStartPos.y) * upT;
      velY = 0;
      grounded = false;
      if (tt >= 1){
        mantling = false;
        pos.copy(mantleEndPos);
        grounded = true;
        curSpeed.set(0, 0);
      }
    } else if (onTruss){
      // ---------- 트러스 클라이밍 (로블록스 공식: WalkSpeed의 70% 속도로 수직 이동, W=위 S=아래) ----------
      const t = currentTruss;
      const climbSpeed = WALK_SPEED * 0.7;
      // 트러스 표면 밖 고정 지점에 붙어서 오름 (안으로 빨려들어가지 않음)
      const standOffset = t.halfW + CHAR_HALF_W + 0.05;
      const standX = t.x - Math.sin(mountFacing) * standOffset;
      const standZ = t.z - Math.cos(mountFacing) * standOffset;

      const prevClimbY = pos.y;
      let climbY = pos.y + (-inY) * climbSpeed * dt; // W(-inY>0)면 상승, S면 하강
      climbY = Math.max(t.bottomY - 0.1, climbY); // 위쪽은 꼭대기에서 바로 멈추므로 별도 오버슈트 없음

      // 천장 판정: 오르는 도중 진짜 낮은 천장이 있으면 머리를 박고 멈춤 (꼭대기 자체는 제외)
      if (climbY > prevClimbY){
        const ceilingHit = findCeiling(prevClimbY, climbY, standX, standZ, t.topCollider);
        if (ceilingHit){
          climbY = Math.min(climbY, ceilingHit.minY - CHAR_HEIGHT);
        }
      }

      // 꼭대기에 도달하면 기둥 폭 그대로의 좁은 바닥에 착지 (별도 발판 없이 살짝만 잘못 디디면 떨어짐)
      let landedOnTop = false;
      if (climbY >= t.topY){
        climbY = t.topY;
        landedOnTop = true;
      }

      // 바닥 판정: 내려가는 도중 다른 발판(바닥)이 있으면 뚫고 내려가지 못하고 그 위에 멈춤
      let landedOnFloor = false;
      if (!landedOnTop && climbY < prevClimbY){
        for (const c of colliders){
          if (c === t.topCollider) continue;
          const overlapXZ = (standX > c.minX - CHAR_HALF_W && standX < c.maxX + CHAR_HALF_W &&
                              standZ > c.minZ - CHAR_HALF_W && standZ < c.maxZ + CHAR_HALF_W);
          if (!overlapXZ) continue;
          if (c.topY <= prevClimbY + 0.05 && c.topY > climbY){
            climbY = c.topY;
            landedOnFloor = true;
            break;
          }
        }
      }

      if (landedOnTop){
        pos.x = t.x; // 좁은 기둥 꼭대기 중앙에 정확히 섬
        pos.z = t.z;
      } else {
        pos.x = standX;
        pos.z = standZ;
      }
      pos.y = climbY;
      velY = 0;
      if (landedOnTop || landedOnFloor){
        grounded = true;
        trussExitCooldown = 0.15; // 착지 직후 바로 재부착되지 않게 (조심스럽게 다시 다가가야 다시 붙음)
      } else {
        grounded = false;
      }
      facing = mountFacing; // 올라탄 방향을 그대로 유지
    } else {
      const testX = pos.x + curSpeed.x * dt;
      const testZ = pos.z + curSpeed.y * dt;

      // 1) 수직 판정(착지/오토스텝/천장)을 새 XZ 기준으로 먼저 확정
      const prevY = pos.y;
      const stepTop = grounded ? tryStepUp(testX, testZ, pos.y) : null;
      let newY;
      if (stepTop !== null){
        newY = stepTop; // 로블록스처럼 낮은 턱은 점프 없이 자동으로 올라감
        velY = 0;
        grounded = true;
      } else {
        velY += GRAVITY * dt;
        newY = pos.y + velY * dt;
        if (velY <= 0){
          const landing = findLanding(prevY, newY, testX, testZ);
          if (landing){
            newY = landing.topY;
            velY = 0;
            grounded = true;
            if (landing.type === 'checkpoint' || landing.type === 'start'){
              respawnPos.set((landing.minX+landing.maxX)/2, landing.topY, (landing.minZ+landing.maxZ)/2);
            }
            if (landing.type === 'finish' && !finished){
              finished = true;
              speedTag.textContent = '🏁 도착!';
            }
          } else {
            grounded = false;
          }
        } else {
          const ceiling = findCeiling(prevY, newY, testX, testZ);
          if (ceiling){
            newY = ceiling.minY - CHAR_HEIGHT;
            velY = 0;
          }
          grounded = false;
        }
      }

      // 2) 수평 이동/벽 충돌은 확정된 최종 Y를 기준으로 마지막에 적용
      //    (착지 직전에 옆면 벽으로 먼저 오판정되던 버그 수정 지점)
      pos.x = testX;
      pos.z = testZ;
      pos.y = newY;
      if (stepTop === null) resolveWalls(pos);

      // 낭떠러지로 떨어지면 마지막 체크포인트로 리스폰
      if (pos.y < VOID_Y){
        pos.copy(respawnPos);
        velY = 0;
        grounded = true;
        curSpeed.set(0,0);
      }
    }

    // 코요테 타임: 바닥에 있으면 유예시간을 채워두고, 벗어나면 서서히 소진 (가장자리에서 점프 씹힘 방지)
    if (grounded) coyoteTimer = 0.12; else coyoteTimer = Math.max(0, coyoteTimer - dt);
    if (wallJumpCooldown > 0) wallJumpCooldown = Math.max(0, wallJumpCooldown - dt);

    // 점프 버퍼링 + 홀드 연속 점프: 착지 직전에 눌렀거나 계속 누르고 있으면 착지 즉시 재점프
    if (jumpBufferTimer > 0) jumpBufferTimer = Math.max(0, jumpBufferTimer - dt);
    if (!onTruss && (grounded || coyoteTimer > 0) && (jumpHeld || jumpBufferTimer > 0)){
      velY = JUMP_VEL * equippedJumpMult;
      grounded = false;
      jumpBufferTimer = 0;
      coyoteTimer = 0;
    }

    // facing direction
    const speedMag = Math.hypot(curSpeed.x, curSpeed.y);
    if (!onTruss && !mantling){
      if (speedMag > 0.4){
        if (shiftLock){
          facing = camYaw; // shift lock: character always faces camera direction
        } else {
          const targetFacing = Math.atan2(curSpeed.x, curSpeed.y);
          let diff = targetFacing - facing;
          diff = Math.atan2(Math.sin(diff), Math.cos(diff));
          facing += diff * Math.min(1, 12*dt);
        }
      } else if (shiftLock){
        facing = camYaw;
      }
    }

    character.position.set(pos.x, pos.y, pos.z);
    character.rotation.y = facing;
    shadowBlob.position.set(pos.x, 0.02, pos.z);
    shadowBlob.scale.setScalar(Math.max(0.35, 1 - pos.y*0.14));

    // ---------- 멀티플레이: 내 위치 전송 + 다른 플레이어 보간 ----------
    mpSendTimer -= dt;
    if (mpSendTimer <= 0 && window.MP && MP.isConfigured && MP.isConfigured()){
      mpSendTimer = 0.08;
      MP.update({ x:pos.x, y:pos.y, z:pos.z, ry:facing, auraTier:equippedAuraTier });
    }
    Object.keys(ghosts).forEach(uid=>{
      const gh = ghosts[uid];
      const t = Math.min(1, 10*dt);
      gh.cur.x += (gh.target.x - gh.cur.x) * t;
      gh.cur.y += (gh.target.y - gh.cur.y) * t;
      gh.cur.z += (gh.target.z - gh.cur.z) * t;
      let dr = gh.target.ry - gh.cur.ry;
      dr = Math.atan2(Math.sin(dr), Math.cos(dr));
      gh.cur.ry += dr * t;
      gh.group.position.set(gh.cur.x, gh.cur.y, gh.cur.z);
      gh.group.rotation.y = gh.cur.ry;
    });

    updateAuraEffect(dt);
    updateEnvironmentShift(dt);

    // walking / climbing animation (arm/leg swing)
    if (mantling){
      // 매달려 기어오르는 동작: 팔로 턱을 짚고 몸을 끌어올린 뒤 다리를 걸치는 느낌
      const mt = 1 - Math.max(0, mantleTimer) / 0.38;
      armL.rotation.x = -0.9 + mt * 0.5;
      armR.rotation.x = -0.9 + mt * 0.5;
      legL.rotation.x = 0.3 + mt * 0.9;
      legR.rotation.x = 0.1 + mt * 0.6;
      speedTag.textContent = '기어오르는 중';
    } else if (onTruss){
      // 트러스 클라이밍 애니메이션: 팔다리가 번갈아 사다리를 짚는 동작 (가만히 있으면 멈춤)
      if (Math.abs(inY) > 0.05){
        climbT += dt * (6 * Math.abs(inY) + 1.5);
        const cs = Math.sin(climbT);
        armL.rotation.x = -0.6 + cs*0.55;
        armR.rotation.x = -0.6 - cs*0.55;
        legL.rotation.x = cs*0.5;
        legR.rotation.x = -cs*0.5;
        speedTag.textContent = '오르는 중';
      } else {
        armL.rotation.x *= 0.8; armR.rotation.x *= 0.8;
        legL.rotation.x *= 0.8; legR.rotation.x *= 0.8;
        speedTag.textContent = '매달림';
      }
    } else if (speedMag > 0.4 && grounded){
      // 로블록스처럼 실제 이동 속도(WalkSpeed 대비 비율)에 맞춰 보폭 주기가 스케일됨
      const speedRatio = speedMag / WALK_SPEED;
      walkT += dt * (6.5 * speedRatio + 2.5);
      const swing = Math.sin(walkT) * (0.55 + speedRatio*0.35);
      armL.rotation.x = swing;
      armR.rotation.x = -swing;
      legL.rotation.x = -swing;
      legR.rotation.x = swing;
      speedTag.textContent = '걷는 중';
    } else if (!grounded){
      if (velY > 2){
        // 상승 중: 팔은 살짝 뒤로, 다리는 몸쪽으로 당겨짐
        armL.rotation.x = -0.25; armR.rotation.x = -0.25;
        legL.rotation.x = 0.35; legR.rotation.x = 0.35;
      } else {
        // 하강 중: 로블록스 특유의 양팔이 위로 들리는 포즈
        const fallT = Math.min(1, Math.abs(velY) / 20);
        armL.rotation.x = -0.25 - fallT*0.75;
        armR.rotation.x = -0.25 - fallT*0.75;
        legL.rotation.x = 0.1; legR.rotation.x = -0.1;
      }
      speedTag.textContent = velY > 2 ? '점프!' : '낙하 중';
    } else {
      armL.rotation.x *= 0.85; armR.rotation.x *= 0.85;
      legL.rotation.x *= 0.85; legR.rotation.x *= 0.85;
      speedTag.textContent = '대기';
    }

    // 스쿼시/스트레치 연출 제거 - R6 아바타는 항상 고정 비율

    // --- camera orbit follow (with obstacle collision pull-in) ---
    const camPivot = new THREE.Vector3(pos.x, pos.y + 2.2, pos.z);
    const camDir = new THREE.Vector3(
      -Math.sin(camYaw) * Math.cos(camPitch),
      Math.sin(camPitch),
      -Math.cos(camYaw) * Math.cos(camPitch)
    );
    let effectiveDist = camDist;
    camRaycaster.set(camPivot, camDir);
    camRaycaster.far = camDist + 0.5;
    const hits = camRaycaster.intersectObjects(collidableMeshes, true);
    if (hits.length > 0){
      effectiveDist = Math.max(1.5, hits[0].distance - 0.4);
    }
    const targetCamPos = camPivot.clone().addScaledVector(camDir, effectiveDist);
    camera.position.copy(targetCamPos);
    camera.lookAt(pos.x, pos.y + 2.0, pos.z);

    // ---- 희귀 아우라 연동 카메라 연출: FOV 확장 + 주기적 화면 흔들림 ----
    const auraSf = currentAuraEffect ? tierScaleFactor(currentAuraEffect.tier.order) : 0;
    const targetFov = 62 + auraSf*9;
    if (Math.abs(camera.fov - targetFov) > 0.01){
      camera.fov += (targetFov - camera.fov) * Math.min(1, dt*1.5);
      camera.updateProjectionMatrix();
    }
    if (auraSf > 0.12){
      const gt = clock.getElapsedTime();
      const pulseEnv = Math.pow(Math.max(0, Math.sin(gt*0.6)), 5); // 계속 흔들리지 않고 주기적으로 미세하게 훅 옴
      const shakeAmt = auraSf * 0.028 * pulseEnv;
      camera.rotation.z += Math.sin(gt*23)*shakeAmt;
      camera.rotation.x += Math.cos(gt*17)*shakeAmt*0.6;
    }
    if (fieldSkillShakeBurst > 0.001){
      const gt2 = clock.getElapsedTime();
      const burstAmt = fieldSkillShakeBurst * 0.075;
      camera.rotation.z += Math.sin(gt2*41)*burstAmt;
      camera.rotation.x += Math.cos(gt2*33)*burstAmt*0.7;
      fieldSkillShakeBurst *= Math.max(0, 1 - dt*4.5);
    } else {
      fieldSkillShakeBurst = 0;
    }

    updateAuraTag();
    if (composer) composer.render(); else renderer.render(scene, camera);
  }
  animate();
})();
</script>
