<script>
  window.addEventListener('error', function(e){
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') return;
    var b=document.getElementById('errorBox'); b.textContent='⚠ 오류: '+(e.message||'')+(e.filename?'\n('+e.filename.split('/').pop()+':'+e.lineno+')':'')+(e.error&&e.error.stack?'\n\n'+e.error.stack:'');

  document.addEventListener('click', function(ev){ var p=document.getElementById('errorPanel'); if (ev.target===p) p.classList.remove('show'); });

<script>
(function(){
'use strict';
/* =====================================================================
   암살자와 보안관 — 로블록스식 3인칭 추리 서바이벌
   · 암살자 1 / 보안관 1 / 나머지 시민. 200초 버티면 시민 승, 암살자가 다 죽이면 암살자 승
   · 마지막 25초 데스매치: 모두 빨라지고, 시민 위치가 빨갛게 보이고, 급한 음악
   · 방에서 가장 먼저 들어온 사람이 진행을 맡는다(나가면 다음 사람이 이어받음). 사람이 적으면 봇이 채운다
   ===================================================================== */
const $ = id => document.getElementById(id);
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');
const clamp = (v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const STUD = 0.62, CHAR_H = 3.4, RAD = 0.62, WALK = 10.5, GRAVITY = -133, JUMP_VEL = 34.46, STEP = 0.8, CLIMB = 7;
const ROUND_MS = 200000, DM_MS = 25000, LOBBY_MS = 20000, END_MS = 8000, MIN_PLAYERS = 6;
const KNIFE_CD = 0.9, THROW_CD = 4, GUN_CD = 3;

// ---------- 렌더러 / 씬 ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:!isTouch, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.25 : 1.6));
renderer.shadowMap.enabled = !isTouch; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);
scene.fog = new THREE.Fog(0x9fd3ff, 80, 260);
const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.1, 500);
function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const hemi = new THREE.HemisphereLight(0xe8f4ff, 0x7a8a6a, 0.62); scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.12); scene.add(amb);
const sun = new THREE.DirectionalLight(0xfff4e0, 0.85); sun.position.set(40, 80, 30); sun.castShadow = !isTouch;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left:-50, right:50, top:50, bottom:-50, far:200 }); scene.add(sun); scene.add(sun.target);

// ---------- 충돌 박스 + 공간 버킷 ----------
// 박스: { minX,maxX,minY,maxY,minZ,maxZ, climb?, zone }
const boxes = []; const buckets = new Map(); const BK = 6;
const bkey = (i,j)=> i*100003 + j;
function addCollider(b){ boxes.push(b); for (let i=Math.floor(b.minX/BK); i<=Math.floor(b.maxX/BK); i++) for (let j=Math.floor(b.minZ/BK); j<=Math.floor(b.maxZ/BK); j++){ const k = bkey(i,j); let a = buckets.get(k); if (!a) buckets.set(k, a = []); a.push(b); } }
function removeZone(zone){ for (let i=boxes.length-1;i>=0;i--) if (boxes[i].zone === zone) boxes.splice(i,1); for (const [k,a] of buckets){ const f = a.filter(b=>b.zone !== zone); if (f.length) buckets.set(k,f); else buckets.delete(k); } }
function near(x, z, r){ const out = new Set(); for (let i=Math.floor((x-r)/BK); i<=Math.floor((x+r)/BK); i++) for (let j=Math.floor((z-r)/BK); j<=Math.floor((z+r)/BK); j++){ const a = buckets.get(bkey(i,j)); if (a) for (const b of a) out.add(b); } return out; }
// 지면 높이: (x,z)에서 y+STEP 이하의 가장 높은 윗면
function groundAt(x, z, y, r){ r = r || 0.35; let best = -1e9; for (const b of near(x, z, 1)){ if (b.climb || b.nowalk) continue; if (x+r < b.minX || x-r > b.maxX || z+r < b.minZ || z-r > b.maxZ) continue; if (b.maxY <= y + STEP && b.maxY > best) best = b.maxY; } return best; }
// 선분(카메라·총알·시야) vs 박스
function rayBoxes(ox,oy,oz, dx,dy,dz, maxT, ignoreClimb){
  let best = maxT; const len = maxT;
  const minx = Math.min(ox, ox+dx*len), maxx = Math.max(ox, ox+dx*len), minz = Math.min(oz, oz+dz*len), maxz = Math.max(oz, oz+dz*len);
  const seen = new Set();
  for (let i=Math.floor(minx/BK); i<=Math.floor(maxx/BK); i++) for (let j=Math.floor(minz/BK); j<=Math.floor(maxz/BK); j++){
    const a = buckets.get(bkey(i,j)); if (!a) continue;
    for (const b of a){ if (seen.has(b)) continue; seen.add(b); if (b.climb || b.noray) continue;
      let t0 = 0, t1 = best;
      for (const [o,d,mn,mx] of [[ox,dx,b.minX,b.maxX],[oy,dy,b.minY,b.maxY],[oz,dz,b.minZ,b.maxZ]]){
        if (Math.abs(d) < 1e-9){ if (o < mn || o > mx){ t0 = 1; t1 = 0; break; } continue; }
        let ta = (mn-o)/d, tb = (mx-o)/d; if (ta > tb){ const q = ta; ta = tb; tb = q; }
        if (ta > t0) t0 = ta; if (tb < t1) t1 = tb; if (t0 > t1) break; }
      if (t0 <= t1 && t0 >= 0 && t0 < best) best = t0; } }
  return best;
}
function los(a, b){ const dx = b.x-a.x, dy = b.y-a.y, dz = b.z-a.z, d = Math.hypot(dx,dy,dz); if (d < 1e-3) return true; return rayBoxes(a.x,a.y,a.z, dx/d,dy/d,dz/d, d) >= d - 0.05; }

// ---------- 재질 / 텍스처 ----------
function canvasTex(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; }
const RR = Math.random;
function speck(g, w, h, n, a, sz){ for (let i=0;i<n;i++){ g.fillStyle = 'rgba(0,0,0,' + (RR()*a) + ')'; g.fillRect(RR()*w, RR()*h, sz||2, sz||2); } }
const gray = v => { v = Math.max(0, Math.min(255, v|0)); return 'rgb(' + v + ',' + v + ',' + v + ')'; };
// 흰색 바탕 무늬 텍스처 (재질 색이 곱해져서 방마다 다른 색이 됨)
const TEXS = {
  wood: canvasTex(256,256,(g,w,h)=>{ for (let y=0;y<h;y+=32){ let x = -RR()*120; while (x < w){ const L = 90 + RR()*130; g.fillStyle = gray(212 + RR()*40); g.fillRect(x, y, L, 32);
        g.strokeStyle = 'rgba(60,30,10,.10)'; g.lineWidth = 1; for (let k=0;k<5;k++){ const yy = y + 4 + RR()*24; g.beginPath(); g.moveTo(x, yy); for (let t=0;t<=L;t+=16) g.lineTo(x + t, yy + Math.sin((t + x)*0.05 + k)*1.6); g.stroke(); }
        g.fillStyle = 'rgba(0,0,0,.30)'; g.fillRect(x, y, 2, 32); x += L; }
      g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, y + 31, w, 2); } }),
  tile: canvasTex(256,256,(g,w,h)=>{ g.fillStyle = '#b9b9b9'; g.fillRect(0,0,w,h); for (let i=0;i<4;i++) for (let j=0;j<4;j++){ g.fillStyle = gray(236 + RR()*19); g.fillRect(i*64+2, j*64+2, 60, 60); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(i*64+4, j*64+4, 56, 3); } speck(g,w,h,500,.05); }),
  check: canvasTex(256,256,(g,w,h)=>{ for (let i=0;i<4;i++) for (let j=0;j<4;j++){ g.fillStyle = (i+j)%2 ? '#ffffff' : '#4a4a4a'; g.fillRect(i*64, j*64, 64, 64); } g.fillStyle = 'rgba(0,0,0,.25)'; for (let i=0;i<=4;i++){ g.fillRect(i*64-1,0,2,h); g.fillRect(0,i*64-1,w,2); } }),

    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.05, 6, 20), gold); ring.rotation.x = Math.PI/2; ring.position.y = -0.62; g.add(ring);
    for (let k=0;k<6;k++){ const a = k/6*Math.PI*2; const cd = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.22, 6), mat(0xf4efe0)); cd.position.set(Math.cos(a)*0.6, -0.5, Math.sin(a)*0.6); g.add(cd);
      const fl = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), glow); fl.position.set(Math.cos(a)*0.6, -0.34, Math.sin(a)*0.6); g.add(fl); }
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), glow); bulb.position.y = -0.66; g.add(bulb);

    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.46, 0.05, 6, 16), mat(0xc9a24a)); rim.rotation.x = Math.PI/2; rim.position.set(x, y - 0.02, z); grp.add(rim);
  } else if (style === 'office'){
    const f = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 1.0), mat(0xdadcdf)); f.position.set(x, y - 0.03, z); grp.add(f);
    const p = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.8), glow); p.rotation.x = Math.PI/2; p.position.set(x, y - 0.08, z); grp.add(p);
  } else {
    const f = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 0.5), mat(0xe0e0dc)); f.position.set(x, y - 0.2, z); grp.add(f);
    for (const dz of [-0.12, 0.12]){ const t = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.4, 6), glow); t.rotation.z = Math.PI/2; t.position.set(x, y - 0.3, z + dz); grp.add(t); }

  }
}

  bookRows(g, W - 0.25, 4, 0.14, 0.3);
}
const BOOK_COLS = [0x8e2b2b, 0x2b4f8e, 0x2e6a3a, 0xb58a2e, 0x5a2e7a, 0x3a3a3a, 0xa8552e];
function bookRows(g, W, rows, y0, z){
  for (let s=0;s<rows;s++){ let x = -W/2; while (x < W/2 - 0.2){ const bw = 0.1 + RR()*0.14, bh = 0.6 + RR()*0.3; const bk = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.34), mat(BOOK_COLS[(RR()*BOOK_COLS.length)|0]));

function buildNav(def, at, kind, OPEN, okey, wx, wz, NR, NC){
  const F = def.floors, nodes = [], idx = new Map(), key = (f,c,r)=>f*100000 + r*1000 + c;
  const blocked = (f, c, r)=>{ // 소품/계단이 있는 칸은 못 다님
    const x = wx(c)+CELL/2, z = wz(r)+CELL/2, y = F[f].y;
    for (const b of near(x, z, 1.5)){ if (b.climb || b.zone !== 'map') continue; if (x > b.minX - 0.55 && x < b.maxX + 0.55 && z > b.minZ - 0.55 && z < b.maxZ + 0.55 && b.maxY > y + 0.6 && b.minY < y + CHAR_H) return true; }
    return false; };
  F.forEach((fl, f)=>{ for (let r=0;r<NR;r++) for (let c=0;c<NC;c++){ if (kind(at(f,c,r)) !== 'R') continue;
    if (blocked(f,c,r)) continue; const n = { f, c, r, x:wx(c)+CELL/2, y:fl.y, z:wz(r)+CELL/2, nb:[] }; idx.set(key(f,c,r), nodes.length); nodes.push(n); } });
  const passable = (f, o, c, r)=>{ const op = OPEN.get(okey(f, o, c, r)); return op && (op.type === 'door' || op.type === 'arch'); };
  nodes.forEach((n, i)=>{
    for (const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){ const j = idx.get(key(n.f, n.c+dc, n.r+dr)); if (j === undefined) continue;
      const same = at(n.f, n.c, n.r) === at(n.f, n.c+dc, n.r+dr);
      const ok = same || (dc ? passable(n.f, 'v', Math.max(n.c, n.c+dc), n.r) : passable(n.f, 'h', n.c, Math.max(n.r, n.r+dr)));
      if (ok) n.nb.push(j); } });
  (def.stairs||[]).forEach(s=>{ for (let i=0;i<s.w;i++){ const a = idx.get(key(s.f, s.c+i, s.r0-1)), b = idx.get(key(s.f+1, s.c+i, s.r1+1)); if (a !== undefined && b !== undefined){ nodes[a].nb.push(b); nodes[b].nb.push(a); nodes[a].stair = nodes[b].stair = true; } } });
  // 1층이 가장 많이 포함된 연결 덩어리만 사용 (비밀방·다락 등은 봇이 안 감)
  const comp = new Array(nodes.length).fill(-1); let best = -1, bestN = 0, cid = 0;
  for (let i=0;i<nodes.length;i++){ if (comp[i] >= 0) continue; const q = [i]; comp[i] = cid; let n = 0; while (q.length){ const u = q.pop(); n += nodes[u].f === 0 ? 1000 : 1; for (const v of nodes[u].nb) if (comp[v] < 0){ comp[v] = cid; q.push(v); } } if (n > bestN){ bestN = n; best = cid; } cid++; }
  nodes.forEach((n,i)=>{ n.main = comp[i] === best; });
  function nearest(x, y, z){ let bi = -1, bd = 1e9; for (let i=0;i<nodes.length;i++){ const n = nodes[i]; if (!n.main) continue; const d = (n.x-x)**2 + (n.z-z)**2 + ((n.y-y)*3)**2; if (d < bd){ bd = d; bi = i; } } return bi; }
  function path(a, b){ if (a < 0 || b < 0) return null; if (a === b) return [a]; const prev = new Int32Array(nodes.length).fill(-2); prev[a] = -1; const q = [a]; let h = 0;
    while (h < q.length){ const u = q[h++]; if (u === b) break; for (const v of nodes[u].nb) if (prev[v] === -2){ prev[v] = u; q.push(v); } }
    if (prev[b] === -2) return null; const out = []; for (let u = b; u !== -1; u = prev[u]) out.push(u); return out.reverse(); }
  const mains = nodes.map((n,i)=>i).filter(i=>nodes[i].main);
  return { nodes, nearest, path, randomNode:()=>mains[Math.floor(Math.random()*mains.length)] };
}
