<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f18">
<title>룬 아고라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --map:156px; --gold:#e9c87e; --gold2:#a9874a; --rune:#7ff3ff; --ink:#0b0f18; --w:#f4efe3; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b0f18; font-family:'Noto Sans KR',sans-serif; color:var(--w); touch-action:none; user-select:none; -webkit-user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #vig { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(5,8,16,.55) 100%); }

  #load { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:radial-gradient(circle at 50% 40%, #1a2234, #07090f 70%); z-index:30; transition:opacity .9s; }
  #load.off { opacity:0; pointer-events:none; }
  #load .sig { width:90px; height:90px; border:2px solid rgba(127,243,255,.55); border-radius:50%; position:relative; animation:spin 6s linear infinite; box-shadow:0 0 30px rgba(127,243,255,.25), inset 0 0 20px rgba(127,243,255,.2); }
  #load .sig::before, #load .sig::after { content:''; position:absolute; inset:12px; border:1px solid rgba(233,200,126,.6); transform:rotate(45deg); }
  #load .sig::after { inset:22px; border-radius:50%; border-color:rgba(127,243,255,.8); }
  #load p { font:500 14px 'Gowun Batang'; letter-spacing:.3em; color:#cfe9ee; opacity:.85; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #intro { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:12vh; pointer-events:none; transition:opacity 1.2s; }
  #intro.off { opacity:0; }
  #intro .t1 { font:700 13px 'Cinzel'; letter-spacing:.6em; color:var(--rune); text-shadow:0 0 12px rgba(127,243,255,.7); opacity:0; animation:fin 2s .4s forwards; }
  #intro h1 { font:900 clamp(44px, 9vw, 104px) 'Cinzel'; letter-spacing:.08em; line-height:1; margin:10px 0 6px; background:linear-gradient(180deg,#fff7df 10%,#e9c87e 55%,#8a6630 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 18px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(233,200,126,.25)); opacity:0; animation:fin 2.4s .8s forwards; }
  #intro .t2 { font:700 clamp(16px,2.6vw,24px) 'Gowun Batang'; letter-spacing:.5em; color:#fff3d6; text-shadow:0 2px 8px #000; opacity:0; animation:fin 2s 1.4s forwards; }
  #intro .line { width:min(420px,70vw); height:1px; margin:18px 0 26px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:0; animation:fin 2s 1.6s forwards; }
  #intro button { pointer-events:auto; font:700 16px 'Gowun Batang'; letter-spacing:.35em; color:#10131c; padding:14px 44px 14px 50px; border:none; border-radius:2px; cursor:pointer; background:linear-gradient(180deg,#fff2c9,#e2b964 60%,#b88c3e); box-shadow:0 0 0 1px rgba(255,240,200,.6), 0 0 0 5px rgba(233,200,126,.18), 0 8px 30px rgba(0,0,0,.5), 0 0 40px rgba(233,200,126,.35); opacity:0; animation:fin 1.6s 2.1s forwards; transition:transform .2s, box-shadow .2s; }
  #intro button:hover { transform:translateY(-2px) scale(1.03); box-shadow:0 0 0 1px rgba(255,240,200,.9), 0 0 0 7px rgba(233,200,126,.25), 0 10px 34px rgba(0,0,0,.55), 0 0 60px rgba(233,200,126,.55); }
  #intro .hint { margin-top:16px; font:400 12px 'Noto Sans KR'; color:rgba(255,255,255,.6); opacity:0; animation:fin 1.6s 2.5s forwards; }
  @keyframes fin { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  #hud { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1s; z-index:10; }
  #hud.on { opacity:1; }
  #loc { position:absolute; top:22%; left:50%; transform:translateX(-50%); text-align:center; opacity:0; transition:opacity 1.5s; }
  #loc.on { opacity:1; }
  #loc .a { font:700 12px 'Cinzel'; letter-spacing:.55em; color:var(--rune); text-shadow:0 0 10px rgba(127,243,255,.6); }
  #loc .b { font:700 clamp(26px,5vw,44px) 'Gowun Batang'; letter-spacing:.25em; color:#fff6dc; text-shadow:0 2px 12px rgba(0,0,0,.8), 0 0 24px rgba(233,200,126,.4); margin-top:6px; }
  #loc .c { width:240px; height:1px; margin:10px auto 0; background:linear-gradient(90deg,transparent,var(--gold),transparent); }

  #card { position:absolute; top:max(14px, env(safe-area-inset-top)); left:14px; display:flex; align-items:center; gap:10px; padding:8px 14px 8px 8px; background:linear-gradient(90deg, rgba(10,14,24,.78), rgba(10,14,24,.35)); border:1px solid rgba(233,200,126,.28); border-radius:30px; pointer-events:auto; }
  #card .av { width:40px; height:40px; border-radius:50%; background:radial-gradient(circle at 50% 38%, #fff 0 28%, transparent 29%), radial-gradient(ellipse at 50% 110%, #fff 0 46%, transparent 47%), #2a3245; border:2px solid var(--gold); box-shadow:0 0 10px rgba(233,200,126,.35); }
  #card .nm { font:700 14px 'Gowun Batang'; color:#fff4d8; }
  #card .lv { font:500 11px 'Noto Sans KR'; color:#9fe8f2; letter-spacing:.06em; }
  #card .bars { display:flex; flex-direction:column; gap:3px; margin-top:3px; }
  #card .bars i { display:block; width:110px; height:4px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; }
  #card .bars i b { display:block; height:100%; }
  #back { position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); left:14px; pointer-events:auto; font:500 12px 'Noto Sans KR'; color:#e8e1cf; background:rgba(10,14,24,.6); border:1px solid rgba(233,200,126,.3); border-radius:20px; padding:7px 14px; cursor:pointer; text-decoration:none; }
  body.touch #back { bottom:auto; top:calc(max(14px, env(safe-area-inset-top)) + 64px); }
  #gfx { position:absolute; top:calc(max(14px, env(safe-area-inset-top)) + var(--map) + 22px); right:14px; pointer-events:auto; font:500 11px 'Noto Sans KR'; color:#e8e1cf; background:rgba(10,14,24,.6); border:1px solid rgba(233,200,126,.3); border-radius:14px; padding:5px 10px; cursor:pointer; }

  #map { position:absolute; top:max(14px, env(safe-area-inset-top)); right:14px; width:var(--map); height:var(--map); border-radius:50%; overflow:hidden; border:2px solid rgba(233,200,126,.7); box-shadow:0 0 0 4px rgba(10,14,24,.55), 0 0 22px rgba(0,0,0,.6), inset 0 0 18px rgba(0,0,0,.7); background:#151b26; }
  #map canvas { width:100%; height:100%; display:block; }
  #mapN { position:absolute; left:76px; top:14px; transform:translate(-50%,-50%); font:900 12px 'Cinzel'; color:var(--gold); text-shadow:0 0 4px #000; }

  #keys { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); font:400 12px 'Noto Sans KR'; color:rgba(255,255,255,.72); text-shadow:0 1px 3px #000; white-space:nowrap; transition:opacity 1s; }
  #keys b { display:inline-block; min-width:20px; padding:1px 5px; margin:0 2px; border:1px solid rgba(255,255,255,.4); border-radius:4px; font-weight:700; color:#fff; background:rgba(0,0,0,.25); text-align:center; }
  body.touch #keys { display:none; }

  #prompt { position:absolute; left:50%; bottom:22%; transform:translateX(-50%); padding:9px 18px; border-radius:24px; background:rgba(10,14,24,.75); border:1px solid rgba(127,243,255,.45); font:500 14px 'Noto Sans KR'; color:#eafcff; box-shadow:0 0 18px rgba(127,243,255,.2); opacity:0; transition:opacity .3s; pointer-events:auto; cursor:pointer; white-space:nowrap; }
  #prompt.on { opacity:1; }
  #prompt b { color:var(--gold); border:1px solid rgba(233,200,126,.6); border-radius:4px; padding:0 5px; margin-right:6px; }
  #toast { position:absolute; left:50%; top:34%; transform:translate(-50%,-50%) scale(.96); text-align:center; padding:18px 28px; min-width:260px; background:linear-gradient(180deg, rgba(14,18,30,.92), rgba(8,10,18,.92)); border:1px solid rgba(233,200,126,.5); border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 30px rgba(233,200,126,.15); opacity:0; transition:opacity .35s, transform .35s; }
  #toast.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast .h { font:700 18px 'Gowun Batang'; color:#fff1cf; letter-spacing:.12em; }
  #toast .s { font:400 13px 'Noto Sans KR'; color:#bfd6dc; margin-top:6px; }

  #joy { position:absolute; left:0; bottom:0; width:50%; height:55%; pointer-events:auto; display:none; }
  #joyBase { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:2px solid rgba(233,200,126,.45); background:radial-gradient(circle, rgba(127,243,255,.08), rgba(10,14,24,.35)); display:none; }
  #joyKnob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #fff8e0, #d7b468 70%); box-shadow:0 0 14px rgba(233,200,126,.6); }
  .tbtn { position:absolute; width:70px; height:70px; border-radius:50%; display:none; align-items:center; justify-content:center; pointer-events:auto; font:700 13px 'Gowun Batang'; color:#fff4d8; background:radial-gradient(circle at 50% 35%, rgba(60,72,96,.75), rgba(10,14,24,.75)); border:2px solid rgba(233,200,126,.55); box-shadow:0 0 14px rgba(0,0,0,.5); }
  #bJump { right:28px; bottom:calc(36px + env(safe-area-inset-bottom)); }
  #bRun { right:112px; bottom:calc(24px + env(safe-area-inset-bottom)); width:56px; height:56px; font-size:12px; }
  #bRun.on { border-color:var(--rune); box-shadow:0 0 16px rgba(127,243,255,.5); }
  body.touch #joy, body.touch .tbtn { display:flex; }
  body.touch #joy { display:block; }
  @media (max-width:560px){ :root { --map:108px; } #card { padding:6px 10px 6px 6px; gap:8px; } #card .av { width:32px; height:32px; } #card .bars i { width:80px; } #card .nm { font-size:13px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="load"><div class="sig"></div><p>룬을 새기는 중</p></div>

<div id="intro">
  <div class="t1">ÆTHERIA · CHRONICLES</div>
  <h1>RUNE AGORA</h1>
  <div class="t2">룬 아 고 라</div>
  <div class="line"></div>
  <button id="enter">광장으로</button>
  <div class="hint">스토리 모드 · 미니 게임 · 스탯 성장 — 곧 열립니다</div>
</div>

<div id="hud">
  <div id="loc"><div class="a">THE RUNE AGORA</div><div class="b">룬의 광장</div><div class="c"></div></div>
  <div id="card"><div class="av"></div><div><div class="nm">이름 없는 자</div><div class="lv">Lv.1 · 스탯 포인트 0</div><div class="bars"><i><b style="width:100%;background:linear-gradient(90deg,#d8423a,#ff7a5a)"></b></i><i><b style="width:100%;background:linear-gradient(90deg,#2f74d8,#6fd8ff)"></b></i></div></div></div>
  <a id="back" href="hub.html">← 허브</a>
  <div id="map"><canvas id="mapc" width="312" height="312"></canvas><div id="mapN">N</div></div>
  <div id="gfx">그래픽: 자동</div>
  <div id="keys"><b>W</b><b>A</b><b>S</b><b>D</b> 이동 &nbsp; <b>Shift</b> 달리기 &nbsp; <b>Space</b> 점프 &nbsp; 드래그 시점 &nbsp; 휠 줌 &nbsp; <b>E</b> 상호작용</div>
  <div id="prompt"></div>
  <div id="toast"><div class="h"></div><div class="s"></div></div>
  <div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div class="tbtn" id="bRun">달리기</div>
  <div class="tbtn" id="bJump">점프</div>
</div>

<script type="module">
const THREE = await import('./lib/three.module.0.160.0.js').catch(()=>import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'));
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if (IS_TOUCH) document.body.classList.add('touch');
const Q = { tex: IS_TOUCH ? 2048 : 4096, shadow: IS_TOUCH ? 2048 : 4096, pr: Math.min(devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2), sky: IS_TOUCH ? 0.34 : 0.5, colSeg: IS_TOUCH ? 72 : 120 };
const SAVE = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
let gfxMode = SAVE.get('agora_gfx', 'auto');
if (gfxMode === 'low'){ Q.tex = 2048; Q.shadow = 1024; Q.pr = Math.min(Q.pr, 1); Q.sky = 0.25; Q.colSeg = 60; }

await new Promise(r => requestAnimationFrame(() => setTimeout(r, 40)));

// ───────────────────────── 기본 세팅 ─────────────────────────
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_TOUCH && gfxMode !== 'low', powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2500);

// 해 — 늦은 오후의 금빛
const SUN = new THREE.Vector3(-0.78, 0.42, 0.46).normalize();
const HAZE = new THREE.Color().setRGB(0.44, 0.54, 0.70);   // 선형 공간
scene.fog = new THREE.FogExp2(HAZE.clone(), 0.0034);

// ───────────────────────── 난수 / 노이즈 ─────────────────────────
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(20261022);
const rr = (a, b) => a + (b - a) * R();
const pick = a => a[(R() * a.length) | 0];
function hash2i(x, y, s){ let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, per, s){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const x0 = ((xi % per) + per) % per, y0 = ((yi % per) + per) % per, x1 = (x0 + 1) % per, y1 = (y0 + 1) % per;
  const a = hash2i(x0, y0, s), b = hash2i(x1, y0, s), c = hash2i(x0, y1, s), d = hash2i(x1, y1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, per, oct, s){ let f = 0, amp = 0.5, tot = 0; for (let o = 0; o < oct; o++){ f += amp * vnoise(x, y, per, s + o * 17); tot += amp; x *= 2; y *= 2; per *= 2; amp *= 0.5; } return f / tot; }
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ───────────────────────── 캔버스 텍스처 ─────────────────────────
function cnv(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h || w; return c; }
function tex(c, srgb = true, rx = 1, ry = rx){ const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO; return t; }
function pixels(size, fn){
  const c = cnv(size), x = c.getContext('2d'), im = x.createImageData(size, size), d = im.data, o = [0, 0, 0];
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++){ fn(i / size, j / size, o); const k = (j * size + i) * 4; d[k] = o[0]; d[k + 1] = o[1]; d[k + 2] = o[2]; d[k + 3] = 255; }
  x.putImageData(im, 0, 0); return c;
}
const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;
const jit = (c, a) => { const k = 1 + (R() - 0.5) * a; return rgb(c[0] * k + (R() - .5) * a * 30, c[1] * k + (R() - .5) * a * 30, c[2] * k + (R() - .5) * a * 30); };

// 대리석 (타일링) — 흰 바탕 + 회금색 결
const marbleC = pixels(512, (u, v, o) => {
  const n = fbm(u * 6, v * 6, 6, 5, 11), w = fbm(u * 3, v * 3, 3, 4, 29);
  const v1 = Math.pow(1 - Math.abs(Math.sin((u * 2 + v + n * 2.6) * Math.PI * 2)), 16) * 0.5;
  const v2 = Math.pow(1 - Math.abs(Math.sin((v * 3 - u + w * 3.5) * Math.PI * 2)), 34) * 0.32;
  const k = 0.93 + 0.07 * n, vv = v1 + v2;
  o[0] = 240 * k - vv * 80; o[1] = 236 * k - vv * 84; o[2] = 228 * k - vv * 88;
});
// 회반죽 벽
const plasterC = pixels(512, (u, v, o) => {
  const n = fbm(u * 10, v * 10, 10, 5, 3), d = fbm(u * 2, v * 2, 2, 3, 7), sp = hash2i((u * 512) | 0, (v * 512) | 0, 9) > 0.985 ? 0.9 : 1;
  const k = (0.9 + 0.1 * n) * (1 - 0.13 * smooth(0.5, 0.8, d)) * sp;
  o[0] = 243 * k; o[1] = 236 * k; o[2] = 222 * k;
});
// 석재 (마름돌)
const stoneC = (() => {
  const c = cnv(512), x = c.getContext('2d'); x.fillStyle = '#6e665b'; x.fillRect(0, 0, 512, 512);
  const rows = 6, h = 512 / rows;
  for (let r = 0; r < rows; r++){
    let px = rr(-60, 0);
    while (px < 512){
      const w = rr(70, 150), col = jit([172, 162, 146], 0.22);
      for (const ox of [0, -512, 512]){ x.fillStyle = col; x.fillRect(px + ox + 2, r * h + 2, w - 4, h - 4); x.fillStyle = 'rgba(255,255,255,.07)'; x.fillRect(px + ox + 2, r * h + 2, w - 4, 3); x.fillStyle = 'rgba(0,0,0,.12)'; x.fillRect(px + ox + 2, r * h + h - 6, w - 4, 4); }
      px += w;
    }
  }
  const im = x.getImageData(0, 0, 512, 512), d = im.data;
  for (let j = 0; j < 512; j++) for (let i = 0; i < 512; i++){ const k = (j * 512 + i) * 4, n = 0.82 + 0.3 * fbm(i / 64, j / 64, 8, 4, 5); d[k] *= n; d[k + 1] *= n; d[k + 2] *= n; }
  x.putImageData(im, 0, 0); return c;
})();
// 테라코타 기와
const roofC = (() => {
  const c = cnv(512), x = c.getContext('2d'); x.fillStyle = '#4a2416'; x.fillRect(0, 0, 512, 512);
  const n = 8, s = 512 / n;
  for (let r = 0; r < n; r++) for (let i = 0; i < n; i++){
    const off = (r % 2) * s / 2, X = i * s + off, Y = r * s, base = [178 + rr(-20, 16), 86 + rr(-14, 14), 52 + rr(-10, 10)];
    for (const ox of [0, -512]){
      const g = x.createLinearGradient(X + ox, 0, X + ox + s, 0);
      g.addColorStop(0, rgb(base[0] * .55, base[1] * .55, base[2] * .55)); g.addColorStop(.45, rgb(base[0] * 1.08, base[1] * 1.08, base[2] * 1.08)); g.addColorStop(1, rgb(base[0] * .5, base[1] * .5, base[2] * .5));
      x.fillStyle = g; x.beginPath(); x.roundRect(X + ox + 2, Y - 4, s - 4, s + 2, 8); x.fill();
      x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(X + ox + 2, Y + s - 7, s - 4, 5);
    }
  }
  const im = x.getImageData(0, 0, 512, 512), d = im.data;
  for (let j = 0; j < 512; j++) for (let i = 0; i < 512; i++){ const k = (j * 512 + i) * 4, f = 0.8 + 0.35 * fbm(i / 128, j / 128, 4, 4, 77); d[k] *= f; d[k + 1] *= f * 0.97; d[k + 2] *= f * 0.95; }
  x.putImageData(im, 0, 0); return c;
})();
// 나무 판자
const woodC = pixels(256, (u, v, o) => {

    for (let i = 0; i < 10; i++){ const b = i / 10 * TAU; K.box('stone', 0.9, 0.8, 0.45, x + Math.cos(b) * (r0 + 0.12), h + 1.3, z + Math.sin(b) * (r0 + 0.12), 0, -b + Math.PI / 2, 0); }

{

function particles(count, bases, opts){
  const g = new THREE.BufferGeometry(), P = new Float32Array(count * 3), S = new Float32Array(count);
  for (let i = 0; i < count; i++){ const b = bases[i % bases.length]; P[i * 3] = b.x; P[i * 3 + 1] = b.y; P[i * 3 + 2] = b.z; S[i] = R(); }
  g.setAttribute('position', new THREE.BufferAttribute(P, 3)); g.setAttribute('aSeed', new THREE.BufferAttribute(S, 1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 2000);
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: TIMEU, uScale: { value: 400 } },
    vertexShader: `attribute float aSeed; uniform float uTime, uScale; varying float vL; varying float vS;
      void main(){ ${opts.vert} vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = sz * uScale / -mv.z; }`,
    fragmentShader: `varying float vL; varying float vS; void main(){ float d = length(gl_PointCoord - 0.5); ${opts.frag} }`,
    transparent: true, depthWrite: false, blending: opts.blend || THREE.AdditiveBlending,
  });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; world.add(pts); PTS.push(m); return pts;
}

    b.grp.position.set(x, b.h + Math.sin(time * 0.3 + b.ph) * 3, z);
    b.grp.rotation.y = Math.atan2(-Math.sin(a) * Math.sign(b.sp), Math.cos(a) * Math.sign(b.sp));
    b.grp.rotation.z = -0.25 * Math.sign(b.sp);

}

// ───────────────────────── 미니맵 ─────────────────────────
const mapBase = cnv(512), mapR = 86;
{
  const x = mapBase.getContext('2d'), k = 256 / mapR, C = 256;
  x.fillStyle = '#26301f'; x.fillRect(0, 0, 512, 512);
  x.fillStyle = '#5a5246'; x.beginPath(); x.arc(C, C, 76 * k, 0, TAU); x.fill();
  x.fillStyle = '#5a5246'; for (let s = 0; s < 4; s++){ x.save(); x.translate(C, C); x.rotate(s * Math.PI / 2); x.fillRect(0, -3.75 * k, 300, 7.5 * k); x.restore(); }
  x.fillStyle = '#d9d2c2'; x.beginPath(); x.arc(C, C, 30 * k, 0, TAU); x.fill();
  x.strokeStyle = '#3fe6ff'; x.lineWidth = 2; x.beginPath(); x.arc(C, C, 12.7 * k, 0, TAU); x.stroke();
  x.strokeStyle = '#c9a050'; x.lineWidth = 1.5; x.beginPath(); x.arc(C, C, 24.85 * k, 0, TAU); x.stroke();
  x.fillStyle = '#efe9db'; for (const d of MAPDATA.dots){ x.fillStyle = d[3] === 'f' ? '#2f8fa8' : d[3] === 'o' ? '#30343e' : d[3] === 'b' ? '#ff8a3a' : '#f7f2e6'; x.beginPath(); x.arc(C + d[0] * k, C + d[1] * k, Math.max(2, d[2] * k), 0, TAU); x.fill(); }
  for (const b of MAPDATA.boxes){ x.save(); x.translate(C + b[0] * k, C + b[1] * k); x.rotate(-b[4]); x.fillStyle = b[5] === 2 ? '#d9a443' : b[5] ? '#8a3b2a' : '#b5653f'; x.fillRect(-b[2] * k, -b[3] * k, b[2] * 2 * k, b[3] * 2 * k); x.strokeStyle = 'rgba(0,0,0,.4)'; x.strokeRect(-b[2] * k, -b[3] * k, b[2] * 2 * k, b[3] * 2 * k); x.restore(); }
  x.strokeStyle = '#6b665c'; x.lineWidth = 2.6 * k; x.beginPath(); x.arc(C, C, WALL_R * k, 0, TAU); x.stroke();
  x.fillStyle = '#7ff3ff'; x.beginPath(); x.arc(C, C, 3, 0, TAU); x.fill();
}
const mapC = $('mapc'), mx = mapC.getContext('2d');
function drawMap(){

  mx.save(); mx.translate(W / 2, W / 2); mx.rotate(camYaw); mx.scale(zoom * W / 512 * 1.6, zoom * W / 512 * 1.6);
  mx.translate(-player.pos.x * k, -player.pos.z * k); mx.drawImage(mapBase, -256, -256);
  mx.fillStyle = 'rgba(255,255,255,.75)'; for (const n of NPCS){ mx.beginPath(); mx.arc(n.pos.x * k, n.pos.z * k, 2.2, 0, TAU); mx.fill(); }
  mx.restore();

  mx.fillStyle = '#7ff3ff'; mx.shadowColor = '#7ff3ff'; mx.shadowBlur = 10; mx.beginPath(); mx.moveTo(0, 12); mx.lineTo(8, -8); mx.lineTo(0, -3); mx.lineTo(-8, -8); mx.closePath(); mx.fill(); mx.restore();
  const mn = $('mapN'), hw = $('map').clientWidth / 2, rad = hw - 12; mn.style.left = (hw + Math.sin(camYaw) * rad) + 'px'; mn.style.top = (hw - Math.cos(camYaw) * rad) + 'px';
}

// ───────────────────────── 입력 ─────────────────────────
const keys = {};
let camYaw = 0, camPitch = 0.32, camDist = 7.5, camDistT = 7.5;
let playing = false, introT = 0;
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyE') interact(); if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
let drag = null;
canvas.addEventListener('pointerdown', e => { if (!playing) return; if (e.pointerType === 'touch') return; drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; camYaw -= (e.clientX - drag.x) * 0.006; camPitch = Math.max(-0.25, Math.min(1.25, camPitch + (e.clientY - drag.y) * 0.004)); drag.x = e.clientX; drag.y = e.clientY; });
canvas.addEventListener('pointerup', () => { drag = null; });
addEventListener('wheel', e => { camDistT = Math.max(2.8, Math.min(18, camDistT * (1 + Math.sign(e.deltaY) * 0.1))); }, { passive: true });
// 터치
const joy = { id: null, x: 0, y: 0, dx: 0, dy: 0 }, look = { id: null, x: 0, y: 0 };
let touchRun = false, touchJump = false;
const joyEl = $('joy'), joyBase = $('joyBase'), joyKnob = $('joyKnob');
joyEl.addEventListener('touchstart', e => { const t = e.changedTouches[0]; joy.id = t.identifier; joy.x = t.clientX; joy.y = t.clientY; joy.dx = joy.dy = 0; joyBase.style.display = 'block'; joyBase.style.left = t.clientX + 'px'; joyBase.style.top = t.clientY + 'px'; joyKnob.style.transform = ''; e.preventDefault(); }, { passive: false });
addEventListener('touchmove', e => {
  for (const t of e.changedTouches){
    if (t.identifier === joy.id){ let dx = t.clientX - joy.x, dy = t.clientY - joy.y; const d = Math.hypot(dx, dy), m = 50; if (d > m){ dx *= m / d; dy *= m / d; } joy.dx = dx / m; joy.dy = dy / m; joyKnob.style.transform = `translate(${dx}px,${dy}px)`; }
    else if (t.identifier === look.id){ camYaw -= (t.clientX - look.x) * 0.008; camPitch = Math.max(-0.25, Math.min(1.25, camPitch + (t.clientY - look.y) * 0.005)); look.x = t.clientX; look.y = t.clientY; }
  }
}, { passive: true });
const endT = e => { for (const t of e.changedTouches){ if (t.identifier === joy.id){ joy.id = null; joy.dx = joy.dy = 0; joyBase.style.display = 'none'; } if (t.identifier === look.id) look.id = null; } };
addEventListener('touchend', endT); addEventListener('touchcancel', endT);
canvas.addEventListener('touchstart', e => { if (!playing) return; const t = e.changedTouches[0]; if (look.id === null){ look.id = t.identifier; look.x = t.clientX; look.y = t.clientY; } }, { passive: true });
$('bJump').addEventListener('touchstart', e => { touchJump = true; e.preventDefault(); }, { passive: false });
$('bRun').addEventListener('touchstart', e => { touchRun = !touchRun; $('bRun').classList.toggle('on', touchRun); e.preventDefault(); }, { passive: false });
$('prompt').addEventListener('click', () => interact());
$('gfx').textContent = '그래픽: ' + ({ auto: '자동', high: '높음', low: '낮음' })[gfxMode];
$('gfx').addEventListener('click', () => { const nx = { auto: 'high', high: 'low', low: 'auto' }[gfxMode]; SAVE.set('agora_gfx', nx); location.reload(); });

let curInteract = null, toastT = 0;
function interact(){
  if (!curInteract) return;
  const t = $('toast'); t.querySelector('.h').textContent = curInteract.title; t.querySelector('.s').textContent = curInteract.sub; t.classList.add('on'); toastT = 2.6;
}

// ───────────────────────── 시작 ─────────────────────────
$('enter').addEventListener('click', () => {
  $('intro').classList.add('off'); playing = true; introT = 0; $('hud').classList.add('on');
  camYaw = player.yaw; startBlend = 1;
  setTimeout(() => $('loc').classList.add('on'), 600); setTimeout(() => $('loc').classList.remove('on'), 5200);
  setTimeout(() => { $('keys').style.opacity = 0; }, 14000);
});
let startBlend = 0;

function resize(){
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); sizeSky();
  for (const m of PTS) m.uniforms.uScale.value = innerHeight * renderer.getPixelRatio() * 0.5 / Math.tan(camera.fov * Math.PI / 360);
}
addEventListener('resize', resize); resize();

// ───────────────────────── 루프 ─────────────────────────
const clock = new THREE.Clock();
let time = 0, frameAvg = 16, slowT = 0;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tmpV = new THREE.Vector3();
const introCam = new THREE.Vector3(), introLook = new THREE.Vector3();

function updatePlayer(dt){
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1; if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (joy.id !== null){ ix += joy.dx; iz -= joy.dy; }
  const il = Math.hypot(ix, iz); if (il > 1){ ix /= il; iz /= il; }
  const run = keys.ShiftLeft || keys.ShiftRight || touchRun;
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
  const dx = fx * iz + rx * ix, dz = fz * iz + rz * ix, mag = Math.min(1, Math.hypot(dx, dz));
  const maxSp = run ? 9.6 : 4.6, tsp = mag * maxSp;
  player.speed += (tsp - player.speed) * (1 - Math.exp(-8 * dt));
  if (mag > 0.05){
    const want = Math.atan2(dx, dz); let d = want - player.fig.root.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    player.fig.root.rotation.y += d * (1 - Math.exp(-12 * dt));
    player.dir = [dx / mag, dz / mag];
  }
  if (player.dir && player.speed > 0.01){ player.pos.x += player.dir[0] * player.speed * dt; player.pos.z += player.dir[1] * player.speed * dt; }
  collide(player.pos, 0.36);
  for (const n of NPCS){ const ddx = player.pos.x - n.pos.x, ddz = player.pos.z - n.pos.z, d = Math.hypot(ddx, ddz); if (n.walker && d < 0.7 && d > 1e-4){ player.pos.x = n.pos.x + ddx / d * 0.7; player.pos.z = n.pos.z + ddz / d * 0.7; } }
  const gy = groundY(player.pos.x, player.pos.z);
  if ((keys.Space || touchJump) && player.ground){ player.vy = 7.6; player.ground = false; }
  touchJump = false;
  player.vy -= 22 * dt; player.pos.y += player.vy * dt;
  if (player.pos.y <= gy){ if (!player.ground && player.vy < -2) player.land = 0.18; player.pos.y = gy; player.vy = 0; player.ground = true; }
  else if (player.ground && player.vy <= 0 && player.pos.y - gy < 0.5){ player.pos.y = gy; player.vy = 0; }
  else player.ground = false;
  player.fig.root.position.copy(player.pos);
  // 포즈
  const f = player.fig, amt = Math.min(1, player.speed / 4.6);
  player.ph += dt * (player.speed > 6 ? 13.5 : 9.2) * Math.min(1.4, 0.45 + player.speed / 5.5);
  let tp;
  if (!player.ground) tp = pose({ llx: -0.9, rlx: 0.35, lk: 1.4, rk: 0.6, laz: 1.0, raz: -1.0, lax: -0.3, rax: -0.3, le: -0.6, re: -0.6, sp: 0.1 });
  else if (amt > 0.05) tp = f.gait(player.ph, Math.min(1, amt), player.speed > 6, time);
  else tp = pose({ hy: 0.86 + Math.sin(time * 2) * 0.004, sp: Math.sin(time * 2) * 0.015, laz: 0.1 + Math.sin(time * 2) * 0.02, raz: -0.1 - Math.sin(time * 2) * 0.02, hdy: Math.sin(time * 0.37) * 0.3 });
  if (player.land > 0){ player.land -= dt; tp.hy -= 0.12; tp.lk += 0.5; tp.rk += 0.5; tp.llx -= 0.35; tp.rlx -= 0.35; }
  f.set(tp); f.blend(dt, amt > 0.05 ? 18 : 10);
  selRing.position.set(player.pos.x, gy + 0.03, player.pos.z); selRing.rotation.y += dt * 0.5;
}
function updateNPCs(dt){
  for (const n of NPCS){
    const cd = camera.position.distanceTo(n.pos);
    n.f.root.visible = cd < 110; n.f.mesh.castShadow = cd < 45;
    n.t += dt; const f = n.f;
    if (!n.f.root.visible && !n.walker) continue;
    if (n.walker){
      if (n.target){
        const dx = n.target[0] - n.pos.x, dz = n.target[1] - n.pos.z, d = Math.hypot(dx, dz);
        if (d < 0.4){ n.target = null; n.wait = rr(2, 6); n.idle = pick(['stand', 'stand', 'wave', 'stretch', 'think', 'point', 'cross']); }
        else {
          const sp = n.walker === 2 ? 1.7 : 1.5; n.pos.x += dx / d * sp * dt; n.pos.z += dz / d * sp * dt;
          const want = Math.atan2(dx, dz); let a = want - f.root.rotation.y; a = Math.atan2(Math.sin(a), Math.cos(a)); f.root.rotation.y += a * Math.min(1, dt * 6);
          collide(n.pos, 0.35); n.pos.y = groundY(n.pos.x, n.pos.z);
          n.ph += dt * 7.4; f.set(f.gait(n.ph, 0.85, false, time)); f.blend(dt, 14);
          if (n.t > 30){ n.target = null; n.wait = 1; }
        }
      } else {
        n.wait -= dt; const ip = POSES[n.idle || 'stand'];
        const p = Object.assign({}, ip); if (n.idle === 'wave') p.raz = ip.raz + Math.sin(n.t * 7) * 0.3;
        f.set(p); f.blend(dt, 6);
        if (n.wait <= 0){
          if (n.walker === 2){ const a = Math.atan2(n.pos.z, n.pos.x) + rr(-0.4, 0.4), r = rr(29.6, 31.8); n.target = [Math.cos(a) * r, Math.sin(a) * r]; }
          else { const a = R() * TAU, r = rr(7.5, 23.5); n.target = [Math.cos(a) * r, Math.sin(a) * r]; }
          n.t = 0;
        }
      }
      continue;
    }
    const base = POSES[n.pose], p = Object.assign({}, base);
    if (n.anim === 'wave'){ p.raz = base.raz + Math.sin(n.t * 7) * 0.32; p.re = base.re + Math.sin(n.t * 7 + 1) * 0.2; }
    else if (n.anim === 'swing'){ p.lk = base.lk + Math.sin(n.t * 2.2) * 0.35; p.rk = base.rk - Math.sin(n.t * 2.2) * 0.35; }
    else if (n.anim === 'bowing'){ const k = 0.5 + 0.5 * Math.sin(n.t * 1.3); p.sp = 0.2 + base.sp * k; p.lax = base.lax * k; p.rax = base.rax * k; }
    else if (n.anim === 'jacks'){ const k = 0.5 + 0.5 * Math.sin(n.t * 6); Object.assign(p, { laz: 0.2 + 2.6 * k, raz: -0.2 - 2.6 * k, llz: 0.03 + 0.4 * k, rlz: -0.03 - 0.4 * k }); f.root.position.y = 0.04 + Math.abs(Math.sin(n.t * 6)) * 0.22; }
    else if (n.anim === 'stretch'){ p.sz = Math.sin(n.t * 0.9) * 0.35; }
    else if (n.anim === 'vendor'){ const k = Math.pow(Math.max(0, Math.sin(n.t * 0.6)), 8); p.raz = base.raz - 2.3 * k; p.rax = base.rax * (1 - k); p.re = base.re * (1 - k) - 0.3 * k + Math.sin(n.t * 8) * 0.25 * k; p.hdy = Math.sin(n.t * 0.4) * 0.5; }
    else if (n.anim === 'drink'){ const k = Math.pow(Math.max(0, Math.sin(n.t * 0.5)), 6); p.rax = base.rax - 0.9 * k; p.re = base.re - 1.3 * k; p.hd = -0.3 * k; }
    else if (n.anim === 'look'){ p.hdy = Math.sin(n.t * 0.5) * 0.5; p.rax = base.rax + Math.sin(n.t * 0.5) * 0.1; }
    f.set(p); f.blend(dt, n.anim === 'jacks' ? 20 : 8);
  }
}
function updateCamera(dt){
  camDist += (camDistT - camDist) * (1 - Math.exp(-6 * dt));
  const tgt = tmpV.set(player.pos.x, player.pos.y + 1.45, player.pos.z);
  const cp = Math.cos(camPitch), sx = Math.sin(camYaw) * cp, sz = Math.cos(camYaw) * cp, sy = Math.sin(camPitch);
  const want = new THREE.Vector3(tgt.x + sx * camDist, tgt.y + sy * camDist, tgt.z + sz * camDist);
  want.y = Math.max(want.y, groundY(want.x, want.z) + 0.3);
  if (startBlend > 0){ startBlend = Math.max(0, startBlend - dt * 0.55); const e = startBlend * startBlend * (3 - 2 * startBlend); camPos.lerpVectors(want, introCam, e); camLook.lerpVectors(tgt, introLook, e); }
  else { camPos.copy(want); camLook.copy(tgt); }
  camera.position.copy(camPos); camera.lookAt(camLook);
}
function updateIntro(dt){
  introT += dt;
  const a = Math.PI * 0.5 + introT * 0.045, r = 46 - Math.min(10, introT * 0.4), h = 15 + Math.sin(introT * 0.15) * 4;
  introCam.set(Math.cos(a) * r, h, Math.sin(a) * r); introLook.set(0, 4.5, 0);
  camera.position.copy(introCam); camera.lookAt(introLook);
}

function updateFX(dt){
  const C = FX.crystal;
  C.crys.position.y = 5.6 + Math.sin(time * 1.1) * 0.25; C.crys.rotation.y += dt * 0.6;
  C.halo.position.y = C.crys.position.y; C.halo.material.opacity = 0.7 + Math.sin(time * 2.3) * 0.15;
  for (const r of C.rings){ r.piv.rotation.y += dt * r.spd; r.piv.position.y = C.crys.position.y; }
  C.pl.intensity = 24 + Math.sin(time * 2.3) * 5;
  forgeLight.intensity = 26 + Math.sin(time * 13) * 4 + Math.sin(time * 31) * 3 + (R() - 0.5) * 4;
  if (FX.torchMat) FX.torchMat.opacity = 0.5 + 0.1 * Math.sin(time * 11) + 0.05 * Math.sin(time * 27);
  if (FX.fireGlows) FX.fireGlows.forEach((g, i) => { g.material.opacity = 0.55 + 0.12 * Math.sin(time * 9 + i * 3) + 0.06 * Math.sin(time * 23 + i); });
  for (const b of BANNERS){
    const p = b.mesh.geometry.attributes.position, a = p.array, base = b.base;
    for (let i = 0; i < p.count; i++){
      const x = base[i * 3], y = base[i * 3 + 1], hang = -y / b.len;
      a[i * 3 + 2] = (Math.sin(time * 2.1 + y * 1.6 + b.seed) * 0.16 + Math.sin(time * 3.7 + x * 3 + y * 2.2 + b.seed) * 0.05) * hang * hang + hang * 0.12;
      a[i * 3] = x + Math.sin(time * 1.6 + y + b.seed) * 0.03 * hang;
    }
    p.needsUpdate = true; b.mesh.geometry.computeVertexNormals();
  }
  for (const f of FLAGS){
    const p = f.mesh.geometry.attributes.position, a = p.array, base = f.base;
    for (let i = 0; i < p.count; i++){ const x = base[i * 3], u = x / f.len; a[i * 3 + 2] = Math.sin(time * 5 + x * 2.2 + f.seed) * 0.22 * u * f.len / 1.8; }
    p.needsUpdate = true;
  }
}
function updateInteract(dt){
  let best = null, bd = 1e9;
  for (const it of INTERACT){ const d = Math.hypot(player.pos.x - it.x, player.pos.z - it.z); if (d < it.r && d < bd){ bd = d; best = it; } }
  if (best !== curInteract){ curInteract = best; const p = $('prompt'); if (best){ p.innerHTML = (IS_TOUCH ? '' : '<b>E</b>') + best.title; p.classList.add('on'); } else p.classList.remove('on'); }
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
}

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta()); time += dt; TIMEU.value = time;
  if (playing){ updatePlayer(dt); updateCamera(dt); updateInteract(dt); drawMap(); }
  else updateIntro(dt);
  updateNPCs(dt); updateFX(dt); updateCreatures(dt);
  // 하늘
  camera.updateMatrixWorld();
  skyMat.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse);
  skyMat.uniforms.uCamWorld.value.copy(camera.matrixWorld);
  skyMat.uniforms.uCamPos.value.copy(camera.position);
  skyMat.uniforms.uTime.value = time + 400;
  renderer.setRenderTarget(skyRT); renderer.render(skyScene, skyCam); renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  // 자동 품질
  frameAvg += (dt * 1000 - frameAvg) * 0.05;
  if (gfxMode === 'auto' && time > 4){
    if (frameAvg > 26){ slowT += dt; if (slowT > 2.5){ slowT = 0; if (Q.sky > 0.26){ Q.sky = Math.max(0.25, Q.sky - 0.08); sizeSky(); } else if (renderer.getPixelRatio() > 1){ renderer.setPixelRatio(Math.max(1, renderer.getPixelRatio() - 0.25)); resize(); } } }
    else slowT = 0;
  }
}
// 첫 프레임 그린 뒤 로딩 해제
renderer.compile(scene, camera);
frame();
setTimeout(() => $('load').classList.add('off'), 250);
window.__agora = { player, camera, scene, renderer, setCam: (y, p, d) => { camYaw = y; camPitch = p; camDistT = camDist = d; startBlend = 0; }, start: () => $('enter').click() };
</script>
