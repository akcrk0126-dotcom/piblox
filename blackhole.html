<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>블랙홀 머지</title>
<meta name="theme-color" content="#05030c">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05030c;color:#eef;font-family:'Noto Sans KR',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-family:'Orbitron','Noto Sans KR',sans-serif}
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;pointer-events:none;z-index:5;gap:10px}
#money{background:linear-gradient(135deg,rgba(40,20,80,.85),rgba(10,10,30,.85));border:1px solid #7a5cff66;border-radius:14px;padding:8px 14px;min-width:170px;box-shadow:0 0 24px #6a3cff33}
#money b{display:block;font:900 26px 'Orbitron',sans-serif;color:#ffe58a;text-shadow:0 0 12px #ffb30088}
#money span{font-size:12px;color:#b9b2ff}
#sun{flex:1;max-width:460px;text-align:center;background:rgba(20,8,4,.8);border:1px solid #ff9a3c66;border-radius:14px;padding:8px 12px;box-shadow:0 0 30px #ff6a0033}
#sun .t{font:900 15px 'Black Han Sans',sans-serif;letter-spacing:.06em;color:#ffcf7a}
#sun .bar{height:9px;background:#3a1408;border-radius:6px;overflow:hidden;margin-top:6px;display:none}
#sun .bar>div{height:100%;background:linear-gradient(90deg,#ff3d00,#ffd000);width:100%}
#sun .s{font-size:11px;color:#ffb98a;margin-top:4px}
#lb{background:rgba(10,10,30,.8);border:1px solid #5a6cff44;border-radius:14px;padding:8px 12px;font-size:12px;min-width:170px;line-height:1.75}
#lb .me{color:#ffe58a;font-weight:700}
#lb .sh{color:#6cf}
#feed{position:fixed;left:14px;top:96px;z-index:5;pointer-events:none;font-size:12px;line-height:1.7;max-width:46vw}
#feed div{background:rgba(0,0,0,.45);padding:3px 9px;border-radius:8px;margin-bottom:4px;animation:fin .3s}
@keyframes fin{from{opacity:0;transform:translateX(-10px)}}
#bot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:12px;z-index:5;flex-wrap:wrap;pointer-events:none}
.btn{pointer-events:auto;font:700 14px 'Noto Sans KR',sans-serif;color:#fff;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:linear-gradient(180deg,#7b5cff,#4a2fd6);box-shadow:0 4px 0 #2a1a8a,0 0 20px #6a3cff55;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1a8a}
.btn small{display:block;font:600 11px 'Orbitron',sans-serif;opacity:.85}
.btn.gold{background:linear-gradient(180deg,#ffcf4a,#e0951a);box-shadow:0 4px 0 #8a5a10,0 0 20px #ffb30055;color:#3a2200}
.btn.cyan{background:linear-gradient(180deg,#38d8ff,#1a8ad6);box-shadow:0 4px 0 #0e4a8a,0 0 20px #38d8ff55}
.btn.red{background:linear-gradient(180deg,#ff5a6a,#c8203a);box-shadow:0 4px 0 #6a1020,0 0 20px #ff3a5a55}
.btn.gray{background:linear-gradient(180deg,#555a6a,#33384a);box-shadow:0 4px 0 #1a1d26}
.btn:disabled{opacity:.45;pointer-events:none}
#sel{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:6;display:none;gap:8px;background:rgba(10,8,30,.92);border:1px solid #7a5cff77;border-radius:16px;padding:10px 12px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw}
#sel .lv{font:900 18px 'Orbitron',sans-serif;margin-right:6px}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;font:900 22px 'Black Han Sans',sans-serif;color:#fff;text-shadow:0 0 18px #7a5cff,0 2px 4px #000;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,10,.6)}
#ov.on{display:flex}
.card{background:linear-gradient(160deg,#1a1240,#0a0a20);border:1px solid #7a5cff88;border-radius:18px;padding:18px;width:min(420px,92vw);box-shadow:0 0 60px #6a3cff55}
.card h2{font:900 22px 'Black Han Sans',sans-serif;margin-bottom:10px;color:#9ad8ff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff14;font-size:13px}
.row b{font-family:'Orbitron',sans-serif}
.pips{display:inline-flex;gap:3px;margin-left:6px}.pips i{width:8px;height:8px;border-radius:2px;background:#2a3060;display:block}.pips i.on{background:#38d8ff;box-shadow:0 0 6px #38d8ff}
#tip{position:fixed;left:0;right:0;bottom:78px;text-align:center;font-size:12px;color:#a8a0ff;z-index:4;pointer-events:none}
#err{position:fixed;left:6px;bottom:6px;z-index:99;font-size:11px;color:#f88;pointer-events:none}
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(40,10,80,.55),rgba(0,0,8,.92));text-align:center;padding:20px}
#title h1{font:400 clamp(46px,10vw,96px) 'Black Han Sans',sans-serif;background:linear-gradient(180deg,#fff,#b98aff 50%,#5a2fff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #7a3cff)}
#title p{color:#b9b2ff;font-size:13px;line-height:1.9;max-width:520px}
#title a{color:#8a84c0;font-size:12px}
@media (max-width:640px){#lb{display:none}#money b{font-size:20px}#money{min-width:120px}.btn{padding:10px 12px;font-size:13px}#sun .t{font-size:13px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div id="money"><span>내 돈</span><b class="num" id="mv">0</b><span id="inc">+0/s</span></div><div id="sun"><div class="t" id="sunT">태양 활성까지 10:00</div><div class="bar" id="sunBar"><div></div></div><div class="s" id="sunS"></div></div><div id="lb"></div></div>
<div id="feed"></div>
<div id="hint"></div>
<div id="sel"><span class="lv num" id="selLv">Lv 1</span><button class="btn gold" id="bSun">☀ 태양으로</button><button class="btn red" id="bAtk">⚔ 공격</button><button class="btn gray" id="bCancel">취소</button></div>
<div id="tip">블랙홀을 끌어서 같은 숫자끼리 합치기 · 누르면 태양/공격 · 드래그로 시점 회전</div>
<div id="bot"><button class="btn" id="bBuy">블랙홀 생성<small id="buyC">$10</small></button><button class="btn cyan" id="bShield">🛡 쉴드<small id="shS">구매</small></button><button class="btn gray" id="bMerge">자동 합치기</button></div>
<div id="ov"></div>
<div id="title"><h1>블랙홀 머지</h1><p>1에서 시작하는 작은 블랙홀을 합쳐 점점 거대하고 화려하게 키워라.<br>10분마다 깨어나는 태양에 블랙홀을 던져 <b>마지막 일격</b>을 날린 사람이 상금을 가져간다.<br>다른 섬에 블랙홀을 날려 공격하고, 쉴드를 업그레이드해서 막아라.</p><button class="btn gold" id="bPlay" style="font-size:18px;padding:14px 34px">시작</button><a href="hub.html">허브로</a></div>
<div id="err"></div>
<script>window.addEventListener('error', e=>{ if (e.target && e.target !== window) return; document.getElementById('err').textContent = '⚠ ' + (e.message || '') + (e.lineno ? ' (line ' + e.lineno + ')' : ''); });</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// =====================================================================
//  블랙홀 머지 — 1부터 합쳐 키우는 블랙홀 · 태양 막타 상금 · 섬끼리 공격 · 쉴드 중첩 업그레이드
// =====================================================================
const $ = id=>document.getElementById(id);
if (typeof THREE === 'undefined'){ $('err').textContent = 'three.js 를 못 불러왔어요. 새로고침하세요.'; return; }
const T = THREE, V = (x, y, z)=>new T.Vector3(x || 0, y || 0, z || 0), CL = (v, a, b)=>v < a ? a : v > b ? b : v, lerp = (a, b, t)=>a + (b - a)*t, rand = (a, b)=>a + Math.random()*(b - a), pick = a=>a[Math.floor(Math.random()*a.length)];
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const now = ()=>Date.now();
function fmt(n){ n = Math.floor(n); if (n < 1000) return '' + n; const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1; while (n >= 1000 && i < u.length - 1){ n /= 1000; i++; } return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + u[i]; }
function fmtT(ms){ ms = Math.max(0, ms); const s = Math.ceil(ms/1000); return Math.floor(s/60) + ':' + String(s%60).padStart(2, '0'); }

// ---------- 경제 ----------
const SLOTS = 12, NI = 6;
const inc = L=>L ? Math.round(Math.pow(2.3, L - 1)) : 0;
const buyCost = b=>Math.floor(10*Math.pow(1.13, b));
const dmg = L=>Math.round(6*Math.pow(2.5, L - 1));
const sunHP = r=>Math.round(1500*Math.pow(2.1, r));
const jackpotOf = r=>Math.round(3000*Math.pow(2.3, r));
const SH = { buy:300, dur:lv=>20 + 12*lv, cd:lv=>Math.max(25, 120 - 11*lv), str:lv=>1 + lv, up:lv=>Math.round(250*Math.pow(1.9, lv)), MAX:10 };
const SUN_EVERY = 10*60*1000, SUN_FIRST = 4*60*1000, SUN_LIVE = 120*1000;
const TIER = [ // 레벨별 색 (갈수록 화려하게)
  [0x8a5cff, 0xd0b8ff], [0x4a7cff, 0xa8c8ff], [0x26d0ff, 0xb8f4ff], [0x2cff9a, 0xc8ffe0], [0xffd23a, 0xfff2b0], [0xff8a1a, 0xffd0a0],
  [0xff2a4a, 0xffb0c0], [0xff3ad8, 0xffc0f4], [0xb03aff, 0xffffff], [0xffffff, 0xaee8ff], [0x00fff0, 0xff00ff], [0xff0066, 0xffee00] ];
const tierOf = L=>TIER[Math.min(TIER.length - 1, L - 1)];

const NAMES = ['나', '오리온', '베가', '시리우스', '안드로메다', '카시오페아'];
const ISCOL = [0x5aff9a, 0x6ad0ff, 0xffb35a, 0xff6a9a, 0xc08aff, 0xfff06a];
function newIsl(i){ return { i, name:NAMES[i], money:i ? rand(40, 120) : 25, bought:0, grid:new Array(SLOTS).fill(0), sh:{ owned:false, dur:0, cd:0, str:0, until:0, cdUntil:0, ch:0 }, next:0, aggr:rand(.4, 1), earned:0, wins:0 }; }
let ISL = [], SUN = { round:0, nextAt:0, active:false, hp:0, max:0, endAt:0, pot:0, lastHit:null };
function load(){ try { const s = JSON.parse(localStorage.getItem('bh_merge_v1') || 'null'); if (s && s.ISL && s.ISL.length === NI){ ISL = s.ISL; SUN = s.SUN;
      // 오프라인 동안 번 돈 (최대 2시간)
      const away = Math.min(2*3600, (now() - (s.t || now()))/1000); if (away > 30){ for (const I of ISL){ const g = I.grid.reduce((a, L)=>a + inc(L), 0)*away*(I.i ? .6 : .5); I.money += g; if (!I.i && g > 0) setTimeout(()=>feed('🌙 자리 비운 동안 $' + fmt(g) + ' 벌었다'), 1500); } }
      if (SUN.active && now() > SUN.endAt){ SUN.active = false; SUN.nextAt = now() + SUN_EVERY; } return; } } catch(e){}
  ISL = []; for (let i=0;i<NI;i++) ISL.push(newIsl(i)); ISL[0].grid[5] = 1; ISL[0].grid[6] = 1; for (let i=1;i<NI;i++){ ISL[i].grid[0] = 1; ISL[i].grid[1] = 2; }
  SUN = { round:0, nextAt:now() + SUN_FIRST, active:false, hp:0, max:0, endAt:0, pot:0, lastHit:null }; }
function save(){ try { localStorage.setItem('bh_merge_v1', JSON.stringify({ ISL, SUN, t:now() })); } catch(e){} }
load();
const ME = ISL[0];

// ---------- 렌더러 · 우주 ----------
const ren = new T.WebGLRenderer({ canvas:$('c'), antialias:!isTouch }); ren.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2)); ren.setSize(innerWidth, innerHeight); ren.outputEncoding = T.sRGBEncoding; ren.toneMapping = T.ACESFilmicToneMapping; ren.toneMappingExposure = 1.15;
const scene = new T.Scene(); scene.background = new T.Color(0x04020a);
const cam = new T.PerspectiveCamera(55, innerWidth/innerHeight, .1, 2000);
addEventListener('resize', ()=>{ cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });
scene.add(new T.AmbientLight(0x6a6aa0, .55)); const sunL = new T.PointLight(0xffd8a0, 2.2, 0, 1.2); scene.add(sunL); const fill = new T.DirectionalLight(0x8a9cff, .35); fill.position.set(-30, 40, 20); scene.add(fill);
function cv(w, h, f){ const c = document.createElement('canvas'); c.width = w; c.height = h; f(c.getContext('2d'), w, h); return c; }
function ctex(c){ const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; return t; }
const hex = n=>'#' + n.toString(16).padStart(6, '0');
function glowTex(col){ return ctex(cv(128, 128, (g)=>{ const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.18, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); })); }
const sprite = (tex, s, op, add)=>{ const m = new T.Sprite(new T.SpriteMaterial({ map:tex, transparent:true, depthWrite:false, blending:add === false ? T.NormalBlending : T.AdditiveBlending, opacity:op == null ? 1 : op })); m.scale.set(s, s, 1); return m; };
// 별 · 성운
{ const n = 3500, p = new Float32Array(n*3), c = new Float32Array(n*3); for (let i=0;i<n;i++){ const v = V(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(rand(300, 700)); p.set([v.x, v.y, v.z], i*3); const w = rand(.6, 1); c.set([w, w*rand(.8, 1), 1], i*3); }
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(p, 3)); g.setAttribute('color', new T.BufferAttribute(c, 3)); scene.add(new T.Points(g, new T.PointsMaterial({ size:1.6, vertexColors:true, sizeAttenuation:false })));
  for (const [x, y, z, col, s] of [[-300, 120, -400, 'rgba(120,40,255,.55)', 700], [350, -80, -300, 'rgba(255,40,140,.35)', 600], [0, 250, 380, 'rgba(40,140,255,.35)', 650], [-380, -150, 250, 'rgba(60,255,200,.18)', 500]]){ const sp = sprite(glowTex(col), s, .7); sp.position.set(x, y, z); scene.add(sp); } }
// ---------- 태양 ----------
const SUNG = new T.Group(); scene.add(SUNG);
const sunTex = ctex(cv(512, 256, (g, w, h)=>{ g.fillStyle = '#ff9a1a'; g.fillRect(0, 0, w, h); for (let i=0;i<2600;i++){ const x = Math.random()*w, y = Math.random()*h, r = rand(2, 14); const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, Math.random() < .5 ? 'rgba(255,240,140,.5)' : 'rgba(200,60,0,.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2*r, 2*r); } }));
const sunM = new T.Mesh(new T.SphereGeometry(6, 48, 32), new T.MeshBasicMaterial({ map:sunTex })); SUNG.add(sunM);
const cor1 = sprite(glowTex('rgba(255,170,40,.9)'), 30, .9), cor2 = sprite(glowTex('rgba(255,90,0,.6)'), 52, .6); SUNG.add(cor1, cor2);
const sunRage = sprite(glowTex('rgba(255,30,0,.9)'), 40, 0); SUNG.add(sunRage);
// 플루토: 섬들 사이를 돌아다님 (누르면 보너스)
const plutoTex = ctex(cv(256, 128, (g, w, h)=>{ g.fillStyle = '#9a8070'; g.fillRect(0, 0, w, h); for (let i=0;i<500;i++){ g.fillStyle = `rgba(${Math.random() < .5 ? '60,40,30' : '230,215,200'},${rand(.05, .3)})`; g.beginPath(); g.arc(Math.random()*w, Math.random()*h, rand(1, 9), 0, 7); g.fill(); } g.fillStyle = 'rgba(245,230,215,.85)'; g.beginPath(); g.ellipse(w*.6, h*.55, 30, 22, .3, 0, 7); g.fill(); }));
const PLUTO = new T.Mesh(new T.SphereGeometry(1.1, 32, 20), new T.MeshStandardMaterial({ map:plutoTex, roughness:.9 })); scene.add(PLUTO); const plutoGlow = sprite(glowTex('rgba(180,200,255,.35)'), 5, .6); PLUTO.add(plutoGlow); let plutoCd = 0;
// ---------- 블랙홀 모양 (레벨이 오를수록 화려하게) ----------
const diskCache = {};
function diskTex(L){ if (diskCache[L]) return diskCache[L]; const [c1, c2] = tierOf(L); const t = ctex(cv(256, 256, (g, w, h)=>{ const cx = w/2; const gr = g.createRadialGradient(cx, cx, w*.18, cx, cx, w*.5); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.12, hex(c2)); gr.addColorStop(.45, hex(c1)); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'destination-out'; for (let i=0;i<70;i++){ const a = Math.random()*7, r = rand(w*.2, w*.5); g.strokeStyle = `rgba(0,0,0,${rand(.15, .5)})`; g.lineWidth = rand(1, 4); g.beginPath(); g.arc(cx, cx, r, a, a + rand(.4, 1.6)); g.stroke(); } }));
  return diskCache[L] = t; }
const glowCache = {}; const glowOf = col=>glowCache[col] || (glowCache[col] = glowTex('rgba(' + ((col >> 16) & 255) + ',' + ((col >> 8) & 255) + ',' + (col & 255) + ',.9)'));
const numCache = {}; function numTex(L){ if (numCache[L]) return numCache[L]; return numCache[L] = ctex(cv(128, 128, (g)=>{ const [c1] = tierOf(L); g.font = '900 72px Orbitron, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 10; g.strokeStyle = 'rgba(0,0,0,.8)'; g.strokeText(L, 64, 68); g.fillStyle = '#fff'; g.shadowColor = hex(c1); g.shadowBlur = 18; g.fillText(L, 64, 68); })); }
const CORE = new T.MeshBasicMaterial({ color:0x000000 });
function makeBH(L, small){ const g = new T.Group(), [c1, c2] = tierOf(L), s = small ? .55 : 1;
  const r = .27 + Math.min(L, 12)*.013;
  const core = new T.Mesh(new T.SphereGeometry(r, 24, 16), CORE); g.add(core);
  const ring = new T.Mesh(new T.TorusGeometry(r*1.08, r*.06, 8, 40), new T.MeshBasicMaterial({ color:c2, transparent:true, opacity:.95, blending:T.AdditiveBlending })); g.add(ring); g.userData.ring = ring;
  const disk = new T.Mesh(new T.RingGeometry(r*1.25, r*(2.3 + Math.min(L, 12)*.07), 64), new T.MeshBasicMaterial({ map:diskTex(L), transparent:true, side:T.DoubleSide, depthWrite:false, blending:T.AdditiveBlending })); disk.rotation.x = -Math.PI/2 + .35; g.add(disk); g.userData.disk = disk;
  const glow = sprite(glowOf(c1), r*(4.2 + Math.min(L, 12)*.18), .55 + Math.min(.35, L*.03)); g.add(glow); g.userData.glow = glow;
  if (L >= 3){ const d2 = new T.Mesh(new T.RingGeometry(r*1.15, r*1.9, 48), new T.MeshBasicMaterial({ map:diskTex(L), transparent:true, side:T.DoubleSide, depthWrite:false, blending:T.AdditiveBlending, opacity:.7 })); g.add(d2); g.userData.d2 = d2; }   // 뒤로 휘어 보이는 빛 (중력 렌즈)
  if (L >= 5 && !small){ const n = 40 + L*8, p = new Float32Array(n*3); for (let i=0;i<n;i++){ const a = Math.random()*7, rr = r*rand(1.6, 2.6 + Math.min(L, 12)*.06); p.set([Math.cos(a)*rr, rand(-.06, .06)*rr, Math.sin(a)*rr], i*3); } const pg = new T.BufferGeometry(); pg.setAttribute('position', new T.BufferAttribute(p, 3));
    const pts = new T.Points(pg, new T.PointsMaterial({ color:c2, size:.07 + L*.004, transparent:true, opacity:.9, blending:T.AdditiveBlending, depthWrite:false })); pts.rotation.x = .35; g.add(pts); g.userData.pts = pts; }

    else { const loc = b.position.clone(); let best = -1, bd = 1.3; for (let k=0;k<SLOTS;k++){ const d = slotPos(k).setY(loc.y).distanceTo(loc); if (d < bd){ bd = d; best = k; } }
      const G = ME.grid; if (best >= 0 && best !== from){ if (G[best] === G[from]){ mergeAt(ME, from, best); } else { const t = G[best]; G[best] = G[from]; G[from] = t; syncBH(0); } }
      b.position.copy(slotPos(from)).add(V(0, .9, 0)); syncBH(0); } return; }
  if (!drag.moved){ const h = hitIslandAny(); if (h === 'pluto') clickPluto(); else if (h === 'sun') hint(SUN.active ? '블랙홀을 눌러서 태양으로 보내!' : '태양 활성까지 ' + fmtT(SUN.nextAt - now())); else desel(); } }
ren.domElement.addEventListener('pointerup', endDrag); ren.domElement.addEventListener('pointercancel', endDrag);
ren.domElement.addEventListener('wheel', e=>{ VIEW.dist = CL(VIEW.dist + e.deltaY*.02, 8, 70); }, { passive:true });
{ let pd = 0; ren.domElement.addEventListener('touchmove', e=>{ if (e.touches.length === 2){ const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (pd) VIEW.dist = CL(VIEW.dist - (d - pd)*.06, 8, 70); pd = d; drag.on = false; } }, { passive:true }); ren.domElement.addEventListener('touchend', ()=>{ pd = 0; }); }
function select(k){ if (!ME.grid[k]) return; selSlot = k; $('selLv').textContent = 'Lv ' + ME.grid[k]; $('sel').style.display = 'flex'; $('bSun').disabled = !SUN.active; }
function desel(){ selSlot = -1; aimMode = false; $('sel').style.display = 'none'; }
function fire(to){ if (selSlot < 0 || !ME.grid[selSlot]) { desel(); return; } launch(ME, selSlot, to); desel(); }
$('bSun').onclick = ()=>{ if (!SUN.active){ hint('태양이 아직 잠들어 있어'); return; } fire('sun'); };
$('bAtk').onclick = ()=>{ if (selSlot < 0) return; aimMode = true; $('sel').style.display = 'none'; hint('공격할 섬을 눌러!<br><small>(취소: 아무 데나 누른 채 드래그)</small>', 2500); VIEW.dist = Math.max(VIEW.dist, 34); VIEW.pitch = Math.max(VIEW.pitch, .7); };
$('bCancel').onclick = desel;
$('bBuy').onclick = ()=>{ audioInit(); if (ME.grid.indexOf(0) < 0){ hint('자리가 없어! 합쳐서 비워'); SFX.bad(); return; } if (!buy(ME)){ hint('돈이 부족해'); SFX.bad(); } };
$('bMerge').onclick = ()=>{ audioInit(); if (!autoMerge(ME)) hint('합칠 게 없어'); };
function clickPluto(){ if (now() < plutoCd){ hint('플루토가 아직 지쳐 있어 (' + fmtT(plutoCd - now()) + ')'); return; } const g = Math.max(20, incomeOf(ME)*15); ME.money += g; plutoCd = now() + 45000; SFX.coin(); burst(PLUTO.position.clone(), 0xb8c8ff, 1.5); hint('🪐 플루토 보너스 $' + fmt(g), 1600); }
// 쉴드 창
function shieldUI(){ const s = ME.sh, o = $('ov'); const row = (k, name, val, nextVal)=>{ const lv = s[k], c = SH.up(lv), max = lv >= SH.MAX; return `<div class="row"><div>${name} <span class="pips">${Array.from({ length:SH.MAX }, (_, i)=>`<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</span><br><small style="color:#9aa">${val}${max ? '' : ' → ' + nextVal}</small></div><button class="btn cyan" data-up="${k}" ${max || ME.money < c ? 'disabled' : ''}>${max ? 'MAX' : '$' + fmt(c)}</button></div>`; };
  o.innerHTML = `<div class="card"><h2>🛡 쉴드</h2>${!s.owned ? `<div class="row"><div>다른 섬의 공격을 막아주는 쉴드<br><small style="color:#9aa">켜두면 정해진 횟수만큼 공격을 막는다</small></div><button class="btn cyan" data-buy="1" ${ME.money < SH.buy ? 'disabled' : ''}>구매 $${SH.buy}</button></div>` :
    `<div class="row"><div>상태<br><small style="color:#9aa">${shieldOn(ME) ? '켜짐 · ' + fmtT(s.until - now()) + ' 남음 · ' + s.ch + '번 더 막음' : now() < s.cdUntil ? '재충전 ' + fmtT(s.cdUntil - now()) : '대기 중'}</small></div><button class="btn gold" data-act="1" ${now() < s.cdUntil ? 'disabled' : ''}>켜기</button></div>
    ${row('dur', '지속시간', SH.dur(s.dur) + '초', SH.dur(s.dur + 1) + '초')}${row('cd', '재충전 시간', SH.cd(s.cd) + '초', SH.cd(s.cd + 1) + '초')}${row('str', '내구도 (막는 횟수)', SH.str(s.str) + '번', SH.str(s.str + 1) + '번')}`}
    <div style="text-align:right;margin-top:12px"><button class="btn gray" data-close="1">닫기</button></div></div>`; o.classList.add('on'); }
$('bShield').onclick = ()=>{ audioInit(); shieldUI(); };
$('ov').addEventListener('click', e=>{ const b = e.target.closest('button'); if (e.target === $('ov') || (b && b.dataset.close)){ $('ov').classList.remove('on'); return; } if (!b) return; const s = ME.sh;
  if (b.dataset.buy && ME.money >= SH.buy){ ME.money -= SH.buy; s.owned = true; SFX.coin(); feed('🛡 쉴드 구매!'); }
  else if (b.dataset.act){ activateShield(ME); }
  else if (b.dataset.up){ const k = b.dataset.up, c = SH.up(s[k]); if (s[k] < SH.MAX && ME.money >= c){ ME.money -= c; s[k]++; SFX.coin(); if (shieldOn(ME) && k === 'str') s.ch++; } }
  shieldUI(); });

// ---------- 태양 ----------
function sunTick(){ const t = now();
  if (!SUN.active && t >= SUN.nextAt){ SUN.active = true; SUN.max = SUN.hp = sunHP(SUN.round); SUN.endAt = t + SUN_LIVE; SUN.pot = jackpotOf(SUN.round) + (SUN.pot && SUN.lastHit == null ? Math.floor(SUN.pot*.5) : 0); SUN.lastHit = null; SFX.alarm(); hint('☀ 태양이 깨어났다!<br><small>마지막 일격을 날리면 $' + fmt(SUN.pot) + '</small>', 3500); feed('☀ 태양 활성! 체력 ' + fmt(SUN.max) + ' · 상금 $' + fmt(SUN.pot)); }
  if (SUN.active && t >= SUN.endAt){ SUN.active = false; SUN.nextAt = t + SUN_EVERY; SUN.lastHit = null; feed('☀ 태양이 다시 잠들었다 (상금 절반 이월)'); hint('☀ 아무도 못 부쉈다… 상금 이월', 2500); } }
function hud(){ $('mv').textContent = '$' + fmt(ME.money); $('inc').textContent = '+$' + fmt(incomeOf(ME)) + '/s'; const c = buyCost(ME.bought); $('buyC').textContent = '$' + fmt(c); $('bBuy').disabled = ME.money < c || ME.grid.indexOf(0) < 0;
  const s = ME.sh; $('shS').textContent = !s.owned ? '$' + SH.buy : shieldOn(ME) ? '켜짐 ' + fmtT(s.until - now()) : now() < s.cdUntil ? '충전 ' + fmtT(s.cdUntil - now()) : '켜기 가능';
  if (SUN.active){ $('sunT').textContent = '☀ 태양 활성! 남은 ' + fmtT(SUN.endAt - now()); $('sunBar').style.display = 'block'; $('sunBar').firstChild.style.width = (SUN.hp/SUN.max*100) + '%'; $('sunS').textContent = '체력 ' + fmt(SUN.hp) + ' / ' + fmt(SUN.max) + ' · 막타 상금 $' + fmt(SUN.pot); }
  else { $('sunT').textContent = '태양 활성까지 ' + fmtT(SUN.nextAt - now()); $('sunBar').style.display = 'none'; $('sunS').textContent = '다음 상금 $' + fmt(jackpotOf(SUN.round)) + ' · 라운드 ' + (SUN.round + 1); }
  const arr = ISL.slice().sort((a, b)=>b.money - a.money); $('lb').innerHTML = arr.map((I, r)=>`<div class="${I.i ? '' : 'me'}">${r + 1}. ${I.i ? I.name : '나'} · $${fmt(I.money)}${shieldOn(I) ? ' <span class="sh">🛡</span>' : ''}${I.wins ? ' ☀' + I.wins : ''}</div>`).join(''); if (selSlot >= 0) $('bSun').disabled = !SUN.active; }

// ---------- 루프 ----------
let last = performance.now(), acc = 0, hudT = 0, saveT = 0, T0 = 0, started = false;
function step(dt){ T0 += dt;
  for (const I of ISL){ I.money += incomeOf(I)*dt; if (I.i && started) botTick(I); }
  sunTick();
  // 투사체
  for (let i=PROJ.length - 1;i>=0;i--){ const p = PROJ[i]; p.t += dt/p.dur; const u = Math.min(1, p.t), a = p.from.clone().lerp(p.mid, u), b = p.mid.clone().lerp(p.tgt, u); p.m.position.copy(a.lerp(b, u)); animBH(p.m, dt*3, T0);
    if (Math.random() < .6){ const tr = sprite(glowOf(tierOf(p.L)[0]), .8, .7); tr.position.copy(p.m.position); scene.add(tr); FX.push({ m:tr, t:0, dur:.5, s:.3, fade:true }); }
    if (u >= 1){ scene.remove(p.m); PROJ.splice(i, 1); if (p.to === 'sun') hitSun(p); else hitIsland(p); } }
  for (let i=FX.length - 1;i>=0;i--){ const f = FX[i]; f.t += dt; const k = f.t/f.dur; if (k >= 1){ scene.remove(f.m); if (f.m.geometry && f.ring) f.m.geometry.dispose(); FX.splice(i, 1); continue; } const s = f.fade ? f.s*(1 - k) + .05 : f.s*(.3 + k); if (f.m.isSprite) f.m.scale.set(s, s, 1); else f.m.scale.setScalar(s); f.m.material.opacity = 1 - k; }
  // 태양 · 플루토 · 섬
  sunM.rotation.y += dt*.05; sunTex.offset.x += dt*.004; const pulse = 1 + Math.sin(T0*1.3)*.04; cor1.scale.setScalar(30*pulse); cor2.scale.setScalar(52*(2 - pulse)); SUNG.scale.lerp(V(1, 1, 1).multiplyScalar(SUN.active ? 1.18 + Math.sin(T0*8)*.03 : 1), Math.min(1, dt*2));
  sunRage.material.opacity += ((SUN.active ? .55 + Math.sin(T0*6)*.25 : 0) - sunRage.material.opacity)*Math.min(1, dt*3); sunL.intensity = SUN.active ? 2.8 : 2.2;
  const pa = T0*.11; PLUTO.position.set(Math.cos(pa)*19, 2.5 + Math.sin(T0*.4)*1.5, Math.sin(pa)*19*.8); PLUTO.rotation.y += dt*.4; plutoGlow.material.opacity = now() < plutoCd ? .15 : .6 + Math.sin(T0*4)*.2;
  ISLG.forEach((S, i)=>{ S.G.position.y = S.base.y + Math.sin(T0*.7 + i)*.35; if (S.shake > 0){ S.shake = Math.max(0, S.shake - dt*2); S.G.position.x = S.base.x + (Math.random() - .5)*S.shake*.6; S.G.position.z = S.base.z + (Math.random() - .5)*S.shake*.6; }
    const on = shieldOn(ISL[i]); if (S.flash > 0){ S.flash -= dt; S.shield.visible = true; S.shield.material.opacity = .16 + S.flash; } else { S.shield.visible = on; S.shield.material.opacity = .16 + Math.sin(T0*3)*.04; } S.shield.rotation.y += dt*.2;
    for (const b of S.bh) if (b && b !== drag.bh) { animBH(b, dt, T0); b.position.y = .9*(i ? .7 : 1) + Math.sin(T0*2 + b.userData.slot)*.08; }
    const a = S.per.userData; a['a-1'].rotation.x = Math.sin(T0*2 + i)*.3; a.a1.rotation.x = -Math.sin(T0*2 + i)*.3; });
  if (drag.bh) animBH(drag.bh, dt, T0); }
function frame(){ requestAnimationFrame(frame); const t = performance.now(); let dt = Math.min(.1, (t - last)/1000); last = t; if (window.__SIM) return; step(dt);
  hudT -= dt; if (hudT <= 0){ hudT = .2; hud(); } saveT -= dt; if (saveT <= 0){ saveT = 5; save(); }
  placeCam(); ren.render(scene, cam); }
requestAnimationFrame(frame);
$('bPlay').onclick = ()=>{ audioInit(); $('title').style.display = 'none'; started = true; hint('블랙홀을 끌어서 같은 숫자끼리 합쳐!', 2500); };
addEventListener('pagehide', save); document.addEventListener('visibilitychange', ()=>{ if (document.hidden) save(); });
window.__BH = { ISL, SUN, ME, step:(n, dt)=>{ for (let i=0;i<n;i++) step(dt || 1/30); placeCam(); ren.render(scene, cam); }, buy, mergeAt, autoMerge, launch, activateShield, shieldOn, PROJ, VIEW, start:()=>{ started = true; $('title').style.display = 'none'; }, syncBH, select, fire, dmg, inc, SH, setSun:(ms)=>{ SUN.nextAt = now() + ms; } };

})();
