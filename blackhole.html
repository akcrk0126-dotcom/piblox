<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05030c;color:#eef;font-family:'Noto Sans KR',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}

.btn{pointer-events:auto;font:700 14px 'Noto Sans KR',sans-serif;color:#fff;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:linear-gradient(180deg,#7b5cff,#4a2fd6);box-shadow:0 4px 0 #2a1a8a,0 0 20px #6a3cff55;transition:transform .08s}

.card{background:linear-gradient(160deg,#1a1240,#0a0a20);border:1px solid #7a5cff88;border-radius:18px;padding:18px;width:min(420px,92vw);box-shadow:0 0 60px #6a3cff55}
.card h2{font:900 22px 'Black Han Sans',sans-serif;margin-bottom:10px;color:#9ad8ff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff14;font-size:13px}

.pips{display:inline-flex;gap:3px;margin-left:6px}.pips i{width:8px;height:8px;border-radius:2px;background:#2a3060;display:block}.pips i.on{background:#38d8ff;box-shadow:0 0 6px #38d8ff}

#joy{position:absolute;left:0;bottom:0;width:42%;height:55%;pointer-events:auto}
#joyB{position:absolute;width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:none}
#joyS{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35)}

#err{position:fixed;left:6px;bottom:6px;z-index:99;font-size:11px;color:#f88;pointer-events:none}
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(40,10,80,.55),rgba(0,0,8,.92));text-align:center;padding:20px}
#title h1{font:400 clamp(46px,10vw,96px) 'Black Han Sans',sans-serif;background:linear-gradient(180deg,#fff,#b98aff 50%,#5a2fff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #7a3cff)}
#title p{color:#b9b2ff;font-size:13px;line-height:1.9;max-width:520px}
#title a{color:#8a84c0;font-size:12px}
@media (max-width:640px){#feed{top:104px;bottom:auto;left:auto;right:66px;max-width:58vw;text-align:right}#mpChat{top:150px!important}#sel{bottom:80px;gap:6px;padding:8px}#sel .btn{padding:9px 10px;font-size:12px}#sel .lv{font-size:15px}.tb{bottom:160px;right:16px}#lb{display:none}#money b{font-size:20px}#money{min-width:120px}.btn{padding:10px 12px;font-size:13px}#sun .t{font-size:13px}}

#money .gem{display:block;font:900 15px 'Orbitron',sans-serif;color:#9af0ff;margin-top:2px}#money .gem b{display:inline;font:inherit;color:inherit;text-shadow:none}
#boosts{font-size:11px;color:#ffd27a;margin-top:2px;min-height:0}
#side{position:fixed;right:10px;top:57%;transform:translateY(-50%);z-index:7;display:flex;flex-direction:column;gap:7px}
.sb{position:relative;width:58px;height:54px;border:0;border-radius:14px;background:linear-gradient(180deg,#2c2366,#17123c);border:1px solid #7a5cff66;color:#fff;font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 3px 0 #0b0820}
.sb span{font:700 10px 'Noto Sans KR',sans-serif;margin-top:3px;white-space:nowrap}
.sb.alert::after{content:'!';position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;background:#ff3a5a;font:900 12px sans-serif;display:flex;align-items:center;justify-content:center;animation:bob 1s infinite}
.sb.alert{border-color:#ffd23a;box-shadow:0 3px 0 #0b0820,0 0 14px #ffd23a88}
.sb.hot{background:linear-gradient(180deg,#ff5a3a,#b81a3a);border-color:#ffd23a;animation:pulse 1.2s infinite}
.sb.on{background:linear-gradient(180deg,#38d8ff,#1a6ad6)}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes pulse{50%{transform:scale(1.07)}}
#xh{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:5;pointer-events:none;display:none}
#xh::before,#xh::after{content:'';position:absolute;background:#fff;box-shadow:0 0 3px #000}#xh::before{left:6px;top:0;width:2px;height:14px}#xh::after{top:6px;left:0;width:14px;height:2px}
body.sl #xh{display:block}
.btn.dim{opacity:.55}
#offer{position:fixed;left:50%;top:18%;transform:translate(-50%,-20px) scale(.9);opacity:0;pointer-events:none;z-index:25;width:min(360px,90vw);background:linear-gradient(160deg,#3a1260,#140a30);border:2px solid #ffd23a;border-radius:18px;padding:14px;text-align:center;box-shadow:0 0 50px #ffb30066;transition:.25s}
#offer.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
#offer .ot{font:900 20px 'Black Han Sans',sans-serif;color:#ffe58a}#offer .ob{font-size:13px;margin:8px 0;color:#e8e0ff}#offer .obt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card{max-height:86vh;overflow-y:auto}
.card h3{font:900 14px 'Noto Sans KR',sans-serif;color:#ffd27a;margin:14px 0 2px}.card h3 small{color:#aab;font-weight:400;font-size:11px}
.card small{color:#aab}.card s{opacity:.6}
.gemc{float:right;font:900 15px 'Orbitron',sans-serif;color:#9af0ff}
.tag{display:inline-block;background:#ff3a5a;color:#fff;font:900 10px sans-serif;border-radius:6px;padding:2px 6px;vertical-align:middle}.tag.on{background:#2cbf7a}
.own{color:#5aff9a;font-weight:900;font-size:13px}
.sale{background:linear-gradient(90deg,#ff3a5a,#ff9a1a);border-radius:10px;padding:8px;font-weight:900;text-align:center;animation:pulse 1.2s infinite}
.free{margin-top:12px;font-size:11px;color:#9a94d0;line-height:1.7;background:#ffffff0a;border-radius:10px;padding:8px}
.wheel{position:relative;width:280px;height:280px;margin:6px auto}.wheel .pin{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:2;color:#ffd23a;font-size:28px;text-shadow:0 2px 4px #000}
#whc{width:280px;height:280px;border-radius:50%;box-shadow:0 0 30px #7a5cff88}
.odds{font-size:11px;color:#9a94d0;text-align:center;line-height:1.6}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.gft{background:#221a50;border:1px solid #5a4cff55;border-radius:12px;padding:9px 4px;text-align:center;font-weight:900;font-size:14px}.gft small{display:block;font-size:10px;font-weight:700;margin-top:4px}.gft b{display:block;font-size:10px;color:#aab}
.gft.ok{border-color:#ffd23a;background:#4a3a10;animation:pulse 1.2s infinite}.gft.got{opacity:.45}
.starter .ob{font-size:14px;line-height:1.8;margin:6px 0}.starter .tm{text-align:center;color:#ff8a8a;font-weight:900;margin-top:6px}
@media (max-width:640px){#side{top:auto;bottom:244px;transform:none;right:8px;gap:4px}.sb{width:48px;height:40px;font-size:17px;border-radius:12px}.sb span{font-size:9px;margin-top:2px}.gifts{grid-template-columns:repeat(4,1fr)}}

/* ---- 간결한 HUD (게임 화면을 덜 가리게) ---- */
#top{padding:8px 10px;gap:8px}

#feed{font-size:11px;bottom:70px}#feed div{background:rgba(0,0,0,.3);padding:2px 8px}
#bot{gap:7px;padding:8px}
#bot .btn{padding:7px 13px;font-size:12.5px;border-radius:12px}#bot .btn small{font-size:10px}
.btn.bang{position:relative;overflow:hidden;background:linear-gradient(90deg,#ff3ad8 var(--p,0%),#2a1a5a var(--p,0%));box-shadow:0 3px 0 #3a0a4a}
.btn.bang.full{background:linear-gradient(90deg,#ff3ad8,#ffd23a,#38d8ff);animation:pulse .9s infinite;color:#fff}
#sel{bottom:60px;padding:5px 8px;gap:6px;background:rgba(10,8,30,.55);border:0;border-radius:14px}

#hint{font-size:19px}
#side{gap:6px}
.sb{width:40px;height:40px;font-size:18px;border-radius:12px;background:rgba(20,16,50,.55);border:1px solid #ffffff1a;box-shadow:none}
.sb span{display:none}.sb span.tm{display:block;position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font:900 8.5px 'Orbitron',sans-serif;background:#000b;border-radius:5px;padding:1px 3px;margin:0}.sb span.tm:empty{display:none}
.sb.alert::after{width:14px;height:14px;font-size:10px;right:-3px;top:-3px}
#offer{top:62px;width:min(330px,86vw);padding:9px 12px;border:1px solid #ffd23a99;border-radius:14px;box-shadow:0 0 24px #ffb30044}

<body>
<canvas id="c"></canvas>
<div id="top"><div id="money"><span>내 돈</span><b class="num" id="mv">0</b><span id="inc">+0/s</span><span class="gem">💎 <b id="gv">0</b></span><div id="boosts"></div></div><div id="sun"><div class="t" id="sunT">태양 활성까지 10:00</div><div class="bar" id="sunBar"><div></div></div><div class="s" id="sunS"></div></div><div id="lb"></div></div>
<div id="feed"></div>
<div id="hint"></div>
<div id="sel"><span class="lv num" id="selLv">2</span><button class="btn gold" id="bSun">☀ 태양에 던지기</button><button class="btn red" id="bAtk">⚔ 공격</button><button class="btn" id="bGift" style="display:none">🎁 선물</button><button class="btn red" id="bRev" style="display:none">🔥 복수</button></div>
<div id="tip">WASD 이동 · 드래그 시점 · Shift 시프트락 · 다가가면 저절로 들기 · 같은 숫자에 닿으면 합체 · E 내려놓기</div>
<div id="bot"><button class="btn" id="bBuy">블랙홀 생성<small id="buyC">$10</small></button><button class="btn bang" id="bBang">🌌 빅뱅<small id="bangS">0%</small></button><button class="btn cyan" id="bShield">🛡 쉴드<small id="shS">구매</small></button><button class="btn gray" id="bAimX" style="display:none">돌아가기</button></div>
<div id="ov"></div>
<div id="side"><button class="sb hot" id="sStarter" title="스타터 팩">🔥<span id="starT" class="tm">-90%</span></button><button class="sb" id="sMenu" title="메뉴">☰</button><button class="sb" id="bSL" title="시프트락">🔒</button></div>
<div id="menu"><button class="sb" id="sShop">🛒<span>상점</span></button><button class="sb" id="sSpin">🎡<span>룰렛</span></button><button class="sb" id="sGift">🎁<span id="giftT" class="tm"></span></button><button class="sb" id="sDaily">📅<span>출석</span></button><button class="sb" id="sQuest">📜<span>퀘스트</span></button><button class="sb" id="sDex">📖<span>도감</span></button><button class="sb" id="sPet">🥚<span>펫</span></button><button class="sb" id="sDeco">🎨<span>꾸미기</span></button><button class="sb" id="sRb">♻️<span>환생</span></button><button class="sb" id="sRank">🏆<span>순위</span></button><button class="sb" id="sSet">⚙<span>설정</span></button></div>
<div id="xh"></div><div id="flash"></div>
<div id="touch"><div id="joy"><div id="joyB"><div id="joyS"></div></div></div><div class="tb" id="tE">E</div></div>
<div id="title"><h1>블랙홀 머지</h1><p>2짜리 작은 블랙홀에 다가가 집어 들고 같은 숫자끼리 합쳐 4 · 8 · 16 … 점점 거대하고 화려하게 키워라.<br>10분마다 깨어나는 태양에 블랙홀을 던져 <b>마지막 일격</b>을 날린 사람이 상금을 가져간다.<br>다른 섬에 블랙홀을 날려 공격하고, 쉴드를 업그레이드해서 막아라.</p><button class="btn gold" id="bPlay" style="font-size:18px;padding:14px 34px">시작</button><a href="hub.html">허브로</a></div>
<div id="err"></div>
<script>

  if (r.blocked){ qEv('block'); flashShield(S); SFX.block(); feed('🛡 내 쉴드가 ' + byName + ' 공격을 막았다!' + (r.left > 0 ? ' (남은 ' + r.left + ')' : ' (쉴드 깨짐)')); }
  else { SFX.boom(1); feed('💥 ' + byName + ' 공격에 맞았다 · $' + fmt(r.steal) + ' 빼앗김' + (r.lost ? ' · ' + r.lost : '')); hint('💥 공격받았다!', 1200); }
  if (onRes) onRes(r); return r; }

// ---------- AI (빈 섬 주인) ----------

  for (let n=0;n<2;n++){ const c = buyCost(st.bought); if (st.bh.length + (st.carry ? 1 : 0) >= MAXBH - 1 || st.money < c) break; st.money -= c; st.bought++; const [x, z] = freeSpot(st.bh); st.bh.push({ L:1, x, z }); syncSeat(S); }
  if (!st.sh.owned && st.money > SH.buy*1.4 && Math.random() < .3){ st.money -= SH.buy; st.sh.owned = true; }
  if (st.sh.owned && Math.random() < .08){ const kk = pick(['dur', 'cd', 'str'].filter(q=>st.sh[q] < SH.MAX)); if (kk && st.money > SH.up(st.sh[kk])*2){ st.money -= SH.up(st.sh[kk]); st.sh[kk]++; } }
  if (!st.job && !st.carry){ const by = {}; for (const b of st.bh) (by[b.L] = by[b.L] || []).push(b); const Ls = Object.keys(by).map(Number).filter(L=>by[L].length >= 2).sort((a, b)=>a - b); if (Ls.length) st.job = { a:by[Ls[0]][0], b:by[Ls[0]][1] }; }
  if (st.carry || st.bh.length < 3) return; const sorted = st.bh.slice().sort((a, b)=>b.L - a.L);
  const alone = !Object.keys(NET.players).length;
  if (SUNS.live && alone && Math.random() < .14*st.aggr){ const b = sorted[0]; st.bh.splice(st.bh.indexOf(b), 1); if (st.job && (st.job.a === b || st.job.b === b)) st.job = null; syncSeat(S); const L = b.L;
    shoot(bpos(S, b.x, b.z), V(0, 0, 0), L, 2.4, p=>{ burst(p.tgt.clone().add(V(rand(-3, 3), rand(-3, 3), rand(-3, 3))), tierOf(L)[0], 2 + L*.15); if (!SUNS.live) return; const t = sNow(); sunHit(sunWin(t), 'ai' + k + ':' + t + ':' + Math.random(), t, 'ai' + k, dmg(L), st.name); }); return; }
  if (st.bh.length >= 4 && Math.random() < .05*st.aggr){ const targets = SEATS.filter(T2=>T2 !== S && T2.who && T2.who.kind !== 'net'); if (!targets.length) return;
    let T2 = st.revenge === 'me' && Math.random() < .7 ? myS() : Math.random() < .45 ? myS() : pick(targets); st.revenge = null; if (T2 === S || !T2.who || T2.who.kind === 'net') T2 = myS();
    const b = sorted[Math.floor(sorted.length/2)]; st.bh.splice(st.bh.indexOf(b), 1); if (st.job && (st.job.a === b || st.job.b === b)) st.job = null; syncSeat(S); const L = b.L, me = T2.who.kind === 'me';
    if (me) SFX.launch(); feed(st.name + ' → ' + (me ? '<b>나</b>' : T2.who.st.name) + ' 에게 ' + valStr(L) + ' 블랙홀 공격!');
    shoot(bpos(S, b.x, b.z), islPos(T2), L, 2.6, p=>{ if (!T2.who) return; if (T2.who.kind === 'me'){ const r = hitMe(L, st.name, null, T2 === myS() ? S.k : null); if (!r.blocked){ st.money += r.steal; if (r.lostL) giveBH(st, r.lostL); } return; }
      const t2 = T2.who.st; burst(p.tgt, tierOf(L)[0], 2 + L*.2); T2.shake = 1; const r = applyHit(t2, L); resync(t2); if (r.blocked) flashShield(T2); else { st.money += r.steal; if (!activateShield(t2)) t2.revenge = null; } }); } }
// AI 아바타가 실제로 걸어가서 들고 합친다
function aiMove(S, dt){ const st = S.who.st, W = S.wander; let tx = W.tx, tz = W.tz;
  if (st.job){ const j = st.job; if (!st.carry && st.bh.indexOf(j.a) < 0 || st.bh.indexOf(j.b) < 0){ if (st.carry){ const [x, z] = freeSpot(st.bh); st.bh.push({ L:st.carry, x, z }); st.carry = 0; syncSeat(S); } st.job = null; }
    else { const g = st.carry ? j.b : j.a; tx = g.x; tz = g.z;
      if (Math.hypot(W.x - tx, W.z - tz) < 1.3){ if (!st.carry){ st.bh.splice(st.bh.indexOf(j.a), 1); st.carry = j.a.L; syncSeat(S); } else { j.b.L = st.carry + 1; st.carry = 0; st.job = null; syncSeat(S); burst(bpos(S, j.b.x, j.b.z), tierOf(j.b.L)[0], 1 + j.b.L*.1); } } } }
  else { W.t -= dt; if (W.t <= 0 || Math.hypot(W.x - tx, W.z - tz) < .5){ W.t = rand(2, 5); const a = rand(0, 7), r = rand(0, RI - 3); W.tx = Math.cos(a)*r; W.tz = Math.sin(a)*r; } }
  const dx = tx - W.x, dz = tz - W.z, d = Math.hypot(dx, dz), sp = st.job ? 6 : 2.6; S.moving = d > .4 && (st.job || W.t < 4); if (S.moving){ const m = Math.min(d, sp*dt); W.x += dx/d*m; W.z += dz/d*m; S.ary = Math.atan2(dx, dz); }
  S.ax = W.x; S.az = W.z; setCarry(S, st.carry || 0); }

function seatsUpdate(){ const hum = [{ uid:myId(), jt:NET.jt, me:true }]; for (const u in NET.players) hum.push({ uid:u, jt:+NET.players[u].jt || 0, r:NET.players[u] });
  hum.sort((a, b)=>a.jt - b.jt || (a.uid < b.uid ? -1 : 1)); const H = hum.slice(0, NI);
  SEATS.forEach((S, k)=>{ const h = H[k]; let w; if (!h) w = { kind:'ai', st:AIS[k] }; else if (h.me) w = { kind:'me', st:ME }; else w = { kind:'net', uid:h.uid, st:netSt(h.uid, h.r), lo:h.r.avatarLoadout || h.r.lo || null };
    const old = S.who, same = old && old.kind === w.kind && old.st === w.st; if (!same){ if (old && old.kind === 'ai'){ setCarry(S, 0); } S.who = w; syncSeat(S); seatAvatar(S); if (w.kind === 'me') mySeat = k; if (w.kind === 'net'){ S.ax = w.st.p[0]; S.az = w.st.p[1]; } }
    else { S.who.lo = w.lo; if (w.kind === 'net' && w.st.dirty){ w.st.dirty = false; syncSeat(S); } seatAvatar(S); } });

  if (hum.findIndex(h=>h.me) >= NI && !NET.full){ NET.full = 1; hint('방이 꽉 찼어 (6명) · 혼자 모드로 진행', 3000); } }
function netIn(){ seatsUpdate(); const t = sNow();
  for (const u in NET.players){ const r = NET.players[u], ev = Array.isArray(r.ev) ? r.ev : r.ev ? Object.values(r.ev) : []; const S = SEATS.find(S=>S.who && S.who.kind === 'net' && S.who.uid === u);
    for (const e of ev){ if (!e || e.i == null) continue; const key = u + ':' + e.i; if (NET.seen[key]) continue; NET.seen[key] = 1; const fresh = t - (+e.t || 0) < 15000;
      if (e.k === 'sun') sunHit(+e.w, key, +e.t, u, +e.d || 0, r.name || '플레이어');
      else if (e.k === 'atk' && fresh && S){ const L = +e.L || 1;
        if (e.to === myId()){ SFX.launch(); feed('<b>' + (r.name || '누군가') + '</b> → <b>나</b> 에게 ' + valStr(L) + ' 블랙홀 공격!'); shoot(headPos(S), islPos(myS()), L, 2.6, ()=>hitMe(L, r.name || '누군가', res=>pushEv({ i:evId(), k:'res', to:u, s:res.blocked ? 0 : res.steal, b:res.blocked ? 1 : 0, L:res.lostL || 0, t:sNow() }), S.k)); }
        else { const T2 = SEATS.find(Q=>Q.who && Q.who.kind === 'net' && Q.who.uid === e.to); if (T2) shoot(headPos(S), islPos(T2), L, 2.6, p=>{ burst(p.tgt, tierOf(L)[0], 2 + L*.2); T2.shake = 1; }); } }
      else if (e.k === 'res' && fresh && e.to === myId()){ if (e.b){ if (S) flashShield(S); SFX.block(); feed('🛡 ' + (r.name || '상대') + ' 쉴드가 막았다!'); } else { ME.money += +e.s || 0; qEv('atk'); if (+e.L) giveBH(ME, +e.L, '🏴‍☠️ 뺏어온'); SFX.coin(); feed('💥 ' + (r.name || '상대') + ' 에게 명중! $' + fmt(+e.s || 0) + ' 획득'); } }

function petObj(){ const p = ME.pets[ME.petEq], key = p == null ? '' : String(p); if (PET.key === key) return; PET.key = key; if (PET.obj){ PET.obj.parent && PET.obj.parent.remove(PET.obj); PET.obj = null; } if (p == null || !PETS[p]) return;
  const P = PETS[p], g = new T.Group(), em = new T.Sprite(new T.SpriteMaterial({ map:emojiTex(P.n.split(' ')[0]), transparent:true, depthWrite:false })); em.scale.set(1.6, 1.6, 1); g.add(em); g.add(sprite(glowOf(P.col), 3.2, .5)); PET.obj = g; myS().G.add(g); PET.x = PL.x + 1; PET.z = PL.z; }
function petTick(dt){ petObj(); if (!PET.obj) return; if (PET.obj.parent !== myS().G){ PET.obj.parent && PET.obj.parent.remove(PET.obj); myS().G.add(PET.obj); }
  const P = PETS[ME.pets[ME.petEq]]; let tx = PL.x + Math.sin(PL.ry + 2.2)*1.6, tz = PL.z + Math.cos(PL.ry + 2.2)*1.6, ty = 3.6;
  const j = PET.job; if (j){ if ((!j.stage && ME.bh.indexOf(j.a) < 0) || ME.bh.indexOf(j.b) < 0){ if (j.stage) giveBH(ME, j.L); PET.job = null; } else { const g = j.stage ? j.b : j.a; tx = g.x; tz = g.z; ty = 2.4; if (Math.hypot(PET.x - tx, PET.z - tz) < .5){ if (!j.stage){ j.stage = 1; ME.bh.splice(ME.bh.indexOf(j.a), 1); j.L = j.a.L; syncSeat(myS()); } else { j.b.L = j.L + 1; PET.job = null; syncSeat(myS()); burst(bpos(myS(), j.b.x, j.b.z), tierOf(j.b.L)[0], 1 + j.b.L*.1); SFX.merge(j.b.L); onMerged(j.b.L); qEv('pet'); qEv('merge'); } } } }
  else { PET.cd -= dt; if (PET.cd <= 0){ PET.cd = P.cd; const by = {}; for (const b of ME.bh) if (b !== noPick) (by[b.L] = by[b.L] || []).push(b); const Ls = Object.keys(by).map(Number).filter(L=>by[L].length >= 2).sort((a, b)=>a - b); if (Ls.length) PET.job = { a:by[Ls[0]][0], b:by[Ls[0]][1], stage:0 }; } }
  const sp = (PET.job ? 9 : 6)*dt, dx = tx - PET.x, dz = tz - PET.z, d = Math.hypot(dx, dz); if (d > .01){ const m = Math.min(d, sp*Math.max(1, d*.5)); PET.x += dx/d*m; PET.z += dz/d*m; } PET.y = lerp(PET.y, ty, Math.min(1, dt*4));
  PET.obj.position.set(PET.x, PET.y + Math.sin(T0*3)*.15, PET.z); if (PET.job && PET.job.stage){ setCarryPet(PET.job.L); } else setCarryPet(0); }
let petCarry = null; function setCarryPet(L){ if (petCarry && petCarry.userData.L === L) return; if (petCarry){ petCarry.parent && petCarry.parent.remove(petCarry); petCarry = null; } if (L){ petCarry = makeBH(L, false, ME.cos.sk); petCarry.scale.setScalar(1.1); petCarry.position.y = -1; PET.obj.add(petCarry); } }
function hatch(){ if (!spend(EGG)) return null; const tot = PETS.reduce((s, p)=>s + p.w, 0); let r = Math.random()*tot, i = 0; while (r >= PETS[i].w){ r -= PETS[i].w; i++; } ME.pets.push(i); if (ME.petEq < 0 || PETS[i].w < PETS[ME.pets[ME.petEq]].w) ME.petEq = ME.pets.length - 1;
  const fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go'); SFX.win(); hint('🥚 → ' + PETS[i].n + ' <small>(' + PETS[i].r + ')</small>', 2600); feed('🥚 펫 획득: ' + PETS[i].n + ' · ' + PETS[i].r); return i; }
function petUI(){ const tot = PETS.reduce((s, p)=>s + p.w, 0);
  panel('🥚 펫 <span class="gemc">💎 ' + fmt(ME.gem) + '</span>', `<div style="text-align:center"><div style="font-size:54px;animation:bob 1.2s infinite">🥚</div><button class="btn gold" data-m="hatch" style="font-size:16px">💎${EGG} 알 까기</button>
  <div class="odds" style="margin-top:6px">${PETS.map(p=>p.n + ' ' + Math.round(p.w/tot*100) + '%').join(' · ')}</div><div class="free">장착한 펫은 따라다니며 같은 숫자 블랙홀을 대신 합쳐 주고, 근처 유성도 주워 와요. 좋은 펫일수록 빠르고 수입 보너스도 있어요.</div></div>
  <h3>내 펫 (${ME.pets.length})</h3>${ME.pets.length ? ME.pets.map((p, i)=>`<div class="row"><div><b>${PETS[p].n}</b> <span class="tag" style="background:${hex(PETS[p].col)};color:#000">${PETS[p].r}</span><br><small>${PETS[p].cd}초마다 합체${PETS[p].inc ? ' · 수입 +' + PETS[p].inc*100 + '%' : ''}</small></div>${ME.petEq === i ? '<span class="own">장착 중</span>' : `<button class="btn cyan" data-m="pe:${i}">장착</button>`}</div>`).join('') : '<small>아직 펫이 없어요</small>'}`); }

// ---------- 순위표 (서버) ----------
const LB = { best:'bh_best', sun:'bh_sun', rb:'bh_rebirth' }; let lbSent = {};
function lbSubmit(){ if (!mpOn || !NET.ready || !MP.submitScore) return; const v = { best:ME.best || 1, sun:ME.wins || 0, rb:ME.rb || 0 }; for (const k in v) if (v[k] && lbSent[k] !== v[k]){ lbSent[k] = v[k]; try { MP.submitScore(LB[k], v[k], 'desc'); } catch(e){} } }
function rankUI(){ const others = Object.keys(NET.players).map(u=>({ u, r:NET.players[u] }));
  const people = `<h3>지금 같이 하는 사람</h3>${others.length ? others.map(({ u, r })=>`<div class="row"><div><b>${esc(r.name || '플레이어')}</b>${isTeam(u) ? ' <span class="tag on">팀</span>' : ME.team === u ? ' <span class="tag">신청함</span>' : r.tm === myId() ? ' <span class="tag">팀 신청 받음!</span>' : ''}<br><small>$${fmt(+r.money || 0)}</small></div><button class="btn ${ME.team === u ? 'gray' : 'cyan'}" data-m="tm:${u}">${ME.team === u ? '팀 해제' : '🤝 팀'}</button></div>`).join('') : '<small>아직 아무도 없어요</small>'}<div class="free">🤝 서로 팀 신청하면 팀! 태양 막타 상금을 반씩 나누고 서로 공격할 수 없어요.</div>`;
  panel('🏆 순위표', '<div id="lbx"><small>불러오는 중…</small></div>' + people);
  if (!mpOn || !MP.fetchLeaderboard){ $('lbx').innerHTML = '<small>오프라인이라 서버 순위를 볼 수 없어요</small>'; return; }
  const out = {}; let n = 0; const done = ()=>{ if (++n < 3 || !$('lbx')) return; $('lbx').innerHTML = [['best', '🕳 가장 큰 블랙홀', v=>valStr(v)], ['sun', '☀ 태양 막타', v=>v + '회'], ['rb', '♻️ 환생', v=>v + '회']].map(([k, n2, f])=>`<h3>${n2}</h3>${(out[k] || []).slice(0, 5).map((e, i)=>`<div class="lbr ${e.uid === myId() ? 'me' : ''}">${i + 1}. ${esc(e.name || '?')} · <b>${f(e.score)}</b></div>`).join('') || '<small>기록 없음</small>'}`).join(''); };
  for (const k in LB){ try { MP.fetchLeaderboard(LB[k], { limit:5 }, a=>{ out[k] = a; done(); }); } catch(e){ done(); } } }

function applySet(){ if (AU.m) AU.m.gain.value = ME.set.snd ? .6 : 0; ren.setPixelRatio(ME.set.low ? 1 : Math.min(devicePixelRatio, isTouch ? 1.5 : 2)); ren.setSize(innerWidth, innerHeight); }
function setUI(){ const t = (k, n)=>`<div class="row"><div>${n}</div><button class="btn ${ME.set[k] ? 'gold' : 'gray'}" data-m="set:${k}">${ME.set[k] ? '켜짐' : '꺼짐'}</button></div>`; panel('⚙ 설정', t('snd', '🔊 소리') + t('vib', '📳 진동 (모바일)') + t('low', '🐢 그래픽 낮춤 (렉 줄이기)')); }
{ const _ai = audioInit; audioInit = ()=>{ _ai(); if (AU.m && !ME.set.snd) AU.m.gain.value = 0; }; }
applySet();

{ const _m = mergeInto; mergeInto = j=>{ _m(j); qEv('merge'); vib(15); }; }

{ const _s = spinWheel; spinWheel = p=>{ const r = _s(p); if (r) qEv('spin'); return r; }; }

{ const _r = netRec; netRec = ()=>Object.assign(_r(), { cos:[ME.cos.f || 0, ME.cos.r || 0, ME.cos.s || 0, ME.cos.sk || '', ME.cos.tr || ''], tm:ME.team || '', ti:myTitle() }); }

function extMetaAct(a){ if (a.startsWith('q:')){ claimQ(+a.slice(2)); return questUI(); } if (a.startsWith('a:')){ claimA(a.slice(2)); return questUI(); } if (a.startsWith('dex:')){ claimDex(+a.slice(4)); return dexUI(); }
