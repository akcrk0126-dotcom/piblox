<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>블록크래프트</title>
<meta name="theme-color" content="#78a7ff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'Galmuri11','Galmuri9',monospace,sans-serif;color:#fff}
canvas#gl{display:block;width:100%;height:100%}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.hide{display:none!important}
#gmBtn,#mpChat{display:none!important}
:root{--s:2}
@media (max-width:760px),(max-height:520px){:root{--s:1.5}}
@media (max-width:420px){:root{--s:1.25}}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hudc{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}
#stats,#armorRow,#air,#xpBar,#itemName,#sel{display:none!important}
#toast{z-index:41;position:fixed;font-family:Galmuri9,monospace;font-size:calc(9px * var(--s))}
#hotbar .hs>*{visibility:hidden}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.34) 100%)}
#cross{position:fixed;left:50%;top:50%;pointer-events:none;width:calc(15px * var(--s));height:calc(15px * var(--s));transform:translate(-50%,-50%);mix-blend-mode:difference;z-index:2}
#cross:before,#cross:after{content:'';position:absolute;background:#fff}
#cross:before{left:calc(7px * var(--s));top:calc(3px * var(--s));width:calc(1px * var(--s));height:calc(9px * var(--s))}
#cross:after{left:calc(3px * var(--s));top:calc(7px * var(--s));width:calc(9px * var(--s));height:calc(1px * var(--s))}
#bottom{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#stats{display:flex;justify-content:space-between;width:calc(182px * var(--s));margin-bottom:calc(2px * var(--s))}
#stats .row{display:flex;gap:0}
#stats .row.r{flex-direction:row-reverse}
#stats img{width:calc(8px * var(--s));height:calc(9px * var(--s));margin-right:0}
#armorRow img{width:calc(8px * var(--s));height:calc(9px * var(--s))}
#air{display:flex;flex-direction:row-reverse;width:calc(182px * var(--s));margin-bottom:calc(1px * var(--s));min-height:calc(9px * var(--s))}
#air img{width:calc(8px * var(--s));height:calc(9px * var(--s))}
#hotbar{display:flex;padding:calc(1px * var(--s));position:relative;pointer-events:auto}
#hotbar .hs{width:calc(20px * var(--s));height:calc(20px * var(--s));position:relative}
#hotbar .hs img{position:absolute;left:calc(2px * var(--s));top:calc(2px * var(--s));width:calc(16px * var(--s));height:calc(16px * var(--s))}
#hotbar .hs .n{position:absolute;right:calc(1px * var(--s));bottom:0;font-size:calc(8px * var(--s));line-height:1;text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f}
#hotbar .hs .dur,.slot .dur{position:absolute;left:calc(3px * var(--s));top:calc(14px * var(--s));width:calc(13px * var(--s));height:calc(2px * var(--s));background:#000}
.slot .cnt{position:absolute;right:0;top:calc(10px * var(--s));height:calc(8px * var(--s));image-rendering:pixelated;pointer-events:none}
#cursor .cnt{position:absolute;right:calc(-1px * var(--s));top:calc(9px * var(--s));height:calc(8px * var(--s));image-rendering:pixelated}
#hotbar .hs .dur i,.slot .dur i{display:block;height:50%}
#sel{position:absolute;top:calc(-1px * var(--s));width:calc(24px * var(--s));height:calc(24px * var(--s));border:calc(2px * var(--s)) solid #fff;outline:calc(1px * var(--s)) solid #000;box-shadow:inset 0 0 0 calc(1px * var(--s)) #000;pointer-events:none;transition:left .05s}
#itemName{position:absolute;left:50%;bottom:calc(70px * var(--s));transform:translateX(-50%);font-size:calc(8px * var(--s));text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f;opacity:0;transition:opacity .4s;white-space:nowrap}
#hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 40%,rgba(255,0,0,.55));opacity:0;transition:opacity .25s;z-index:4}
#water{position:fixed;inset:0;pointer-events:none;background:rgba(10,20,120,.12);z-index:3}
#debug{position:absolute;left:calc(2px * var(--s));top:calc(2px * var(--s));font-family:Galmuri9,monospace;font-size:calc(9px * var(--s));line-height:calc(9px * var(--s));color:#e0e0e0;white-space:pre}
#debug div{background:rgba(80,80,80,.56);display:table;padding:0 calc(1px * var(--s));margin-bottom:0}#debug div.gap{background:none;height:calc(9px * var(--s))}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:calc(9px * var(--s));text-shadow:2px 2px 0 #3f3f3f;opacity:0;transition:opacity .4s;text-align:center;white-space:nowrap}

/* GUI */
#screen{position:fixed;inset:0;z-index:20;background:linear-gradient(rgba(16,16,16,.75),rgba(16,16,16,.82));display:flex;align-items:center;justify-content:center;cursor:default}
.panel{background:#c6c6c6;padding:calc(7px * var(--s));border-radius:calc(3px * var(--s));box-shadow:inset calc(2px * var(--s)) calc(2px * var(--s)) 0 #fff,inset calc(-2px * var(--s)) calc(-2px * var(--s)) 0 #555,0 0 0 calc(1px * var(--s)) #000;color:#3f3f3f;position:relative}
.panel h3{font-size:calc(8px * var(--s));font-weight:normal;margin:0 0 calc(3px * var(--s)) calc(1px * var(--s));height:calc(10px * var(--s));line-height:calc(10px * var(--s));color:#3f3f3f}
.grid{display:grid;grid-template-columns:repeat(9,calc(18px * var(--s)))}
.slot.dragp{filter:brightness(1.25) saturate(.8)}
.slot{width:calc(18px * var(--s));height:calc(18px * var(--s));background:#8b8b8b;box-shadow:inset calc(1px * var(--s)) calc(1px * var(--s)) 0 #373737,inset calc(-1px * var(--s)) calc(-1px * var(--s)) 0 #fff;position:relative}
.slot img{position:absolute;left:calc(1px * var(--s));top:calc(1px * var(--s));width:calc(16px * var(--s));height:calc(16px * var(--s));pointer-events:none}
.slot .n{position:absolute;right:0;bottom:calc(-1px * var(--s));font-size:calc(8px * var(--s));color:#fff;text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f;pointer-events:none;line-height:1}
.slot:hover:after{content:'';position:absolute;left:calc(1px * var(--s));top:calc(1px * var(--s));right:calc(1px * var(--s));bottom:calc(1px * var(--s));background:rgba(255,255,255,.5)}
.slot.big{width:calc(26px * var(--s));height:calc(26px * var(--s))}
.slot.big img{left:calc(5px * var(--s));top:calc(5px * var(--s))}
.slot.big .n{right:calc(4px * var(--s));bottom:calc(3px * var(--s))}
.gap{height:calc(4px * var(--s))}
.panel.mcfix{padding:0;width:calc(176px * var(--s));height:calc(166px * var(--s))}.panel.mcfix.ch{height:calc(168px * var(--s))}
.pa{position:absolute}.pt{position:absolute;font-size:calc(9px * var(--s));line-height:1;color:#404040;white-space:nowrap;font-family:Galmuri9,monospace}
.panel.mcfix .pv{width:calc(51px * var(--s));height:calc(72px * var(--s))}
.panel.mcfix .flame{margin:0}.panel.mcfix .arrow{margin:0}
.panel.mcfix .bookBtn{width:calc(20px * var(--s));height:calc(18px * var(--s));margin:0}
.top{display:flex;align-items:center;gap:calc(6px * var(--s));margin-bottom:calc(4px * var(--s));min-height:calc(54px * var(--s))}
.pv{width:calc(52px * var(--s));height:calc(70px * var(--s));background:#000;box-shadow:inset calc(1px * var(--s)) calc(1px * var(--s)) 0 #373737,inset calc(-1px * var(--s)) calc(-1px * var(--s)) 0 #fff}
.pv canvas{width:100%;height:100%}
.arrow{width:calc(22px * var(--s));height:calc(15px * var(--s));position:relative;margin:0 calc(4px * var(--s))}
.arrow:before{content:'';position:absolute;left:0;top:calc(5px * var(--s));width:calc(14px * var(--s));height:calc(5px * var(--s));background:#8b8b8b}
.arrow:after{content:'';position:absolute;left:calc(13px * var(--s));top:0;border:calc(7.5px * var(--s)) solid transparent;border-left:calc(9px * var(--s)) solid #8b8b8b;border-right:0}
.arrow i{position:absolute;left:0;top:calc(5px * var(--s));height:calc(5px * var(--s));background:#fff;z-index:1}
.flame{width:calc(14px * var(--s));height:calc(14px * var(--s));position:relative;margin:calc(2px * var(--s)) auto;background:#8b8b8b;clip-path:polygon(50% 0,80% 35%,100% 70%,80% 100%,20% 100%,0 70%,20% 35%)}
.flame i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffe95a,#ff6a00)}
.cgrid3{display:grid;grid-template-columns:repeat(3,calc(18px * var(--s)))}
.cgrid2{display:grid;grid-template-columns:repeat(2,calc(18px * var(--s)))}
.acol{display:flex;flex-direction:column}
.eopts{display:flex;flex-direction:column;gap:calc(2px * var(--s));flex:1}
.eopt{background:#8a7a5a;border:calc(1px * var(--s)) solid #3a2a1a;padding:calc(2px * var(--s)) calc(4px * var(--s));display:grid;grid-template-columns:auto 1fr;column-gap:calc(4px * var(--s));cursor:pointer;min-height:calc(15px * var(--s));font-size:calc(7px * var(--s));color:#fff}
.eopt b{grid-row:span 2;color:#80ff20;font-size:calc(9px * var(--s))}
.eopt small{color:#e8d8a0;font-size:calc(6px * var(--s))}
.eopt.off{background:#4a4234;color:#888;cursor:default}
.tlist{width:calc(96px * var(--s));max-height:calc(120px * var(--s));overflow:auto;display:flex;flex-direction:column;gap:calc(2px * var(--s))}
.trow{display:flex;align-items:center;gap:calc(2px * var(--s));background:#8b8b8b;border:calc(1px * var(--s)) solid #373737;padding:calc(1px * var(--s));cursor:pointer;position:relative}
.trow.on{background:#a8a8ff}.trow.out{opacity:.55}.trow em{position:absolute;right:2px;top:0;color:#c8a0ff;font-style:normal;font-size:calc(7px * var(--s))}
.trow .ti{width:calc(16px * var(--s));height:calc(16px * var(--s));position:relative;display:inline-block}.trow .ti img{width:100%;height:100%}.trow .ti b{position:absolute;right:0;bottom:-2px;color:#fff;font-size:calc(7px * var(--s));text-shadow:1px 1px #000}
.trow s{color:#f55;font-size:calc(6px * var(--s))}.trow .tar{color:#fff;font-size:calc(9px * var(--s));margin:0 calc(2px * var(--s))}
.txp{height:calc(5px * var(--s));background:#333;border:calc(1px * var(--s)) solid #000}.txp i{display:block;height:100%;width:0;background:#7ef542}
#darkOv{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,.6) 10%,#000 70%);opacity:0;transition:opacity .3s}
.slot img.ench{filter:drop-shadow(0 0 2px #c080ff) brightness(1.15)}
.acol .slot:empty::after{content:'';position:absolute;inset:18%;opacity:.25;background:currentColor;border-radius:2px}
#armorRow{display:flex;gap:0;margin-bottom:calc(1px * var(--s));min-height:calc(9px * var(--s))}
#xpBar{width:calc(182px * var(--s));height:calc(5px * var(--s));background:#222;border:calc(1px * var(--s)) solid #000;margin-bottom:calc(2px * var(--s));position:relative}
#xpBar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#b8f860,#6ad020)}
#xpLv{position:absolute;left:50%;top:calc(-10px * var(--s));transform:translateX(-50%);color:#80ff20;font-size:calc(9px * var(--s));text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.fcol{display:flex;flex-direction:column;align-items:center}
#cursor{position:fixed;left:0;top:0;width:calc(16px * var(--s));height:calc(16px * var(--s));pointer-events:none;z-index:30;transform:translate(-50%,-50%)}
#cursor img{width:100%;height:100%}
#cursor .n{position:absolute;right:calc(-1px * var(--s));bottom:calc(-2px * var(--s));font-size:calc(8px * var(--s));color:#fff;text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f}
#tip{position:fixed;z-index:31;pointer-events:none;background:rgba(16,0,16,.94);border:calc(1px * var(--s)) solid #25015b;outline:calc(1px * var(--s)) solid rgba(16,0,16,.94);padding:calc(3px * var(--s)) calc(4px * var(--s));font-size:calc(8px * var(--s));color:#fff;text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f;white-space:nowrap}
#tip small{display:block;color:#a8a8a8;font-size:calc(7px * var(--s))}
#closeInv{position:absolute;right:calc(4px * var(--s));top:calc(3px * var(--s));width:calc(12px * var(--s));height:calc(12px * var(--s));border:0;background:none;cursor:pointer;display:none}
#closeInv:before,#closeInv:after{content:'';position:absolute;left:50%;top:15%;height:70%;width:calc(1.5px * var(--s));background:#3f3f3f}
#closeInv:before{transform:rotate(45deg)}#closeInv:after{transform:rotate(-45deg)}
.touch #closeInv{display:block}

/* 메뉴 */
#news{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#news.hide{display:none}
#news .nbox{width:min(760px,100%);max-height:100%;overflow:auto;background:#1e1e1e;border:2px solid #000;box-shadow:inset 2px 2px 0 #555,inset -2px -2px 0 #111;padding:12px}
#news .nhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px;color:#ffe14d;text-shadow:2px 2px 0 #3f3f00}
#news .nhead button{font:inherit;font-size:18px;background:#6f6f6f;color:#fff;border:2px solid #000;width:36px;height:32px;cursor:pointer}
#news video{width:100%;aspect-ratio:16/9;background:#000;display:block;border:2px solid #000}
#news h3{font-size:16px;margin:12px 0 4px;color:#fff;font-weight:normal;text-shadow:2px 2px 0 #3f3f3f}
#news h3 small{color:#aaa;font-size:12px;margin-left:8px}
#news ul{margin:4px 0 4px 20px;font-size:13px;line-height:1.7;color:#ddd}
#news .older{border-top:1px solid #444;margin-top:12px;padding-top:4px}
#menu{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.5)}
#menu.title{background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.45))}
#menu h1{font-size:clamp(34px,8vw,64px);letter-spacing:2px;color:#e0e0e0;text-shadow:4px 4px 0 #3a3a3a,0 0 1px #000;margin-bottom:6px;font-weight:bold}
#menu h1 b{color:#ffe14d;font-weight:bold}
#menu .sub{color:#ffff55;font-size:14px;text-shadow:2px 2px 0 #3f3f00;transform:rotate(-8deg);margin:-14px 0 16px 160px}
#menu h2{font-size:22px;text-shadow:2px 2px 0 #3f3f3f;margin-bottom:6px;font-weight:normal}
.mbtn{width:min(400px,86vw);height:40px;font-family:inherit;font-size:16px;color:#fff;text-shadow:2px 2px 0 #3f3f3f;background:#6f6f6f;border:2px solid #000;box-shadow:inset 2px 2px 0 #aaa,inset -2px -3px 0 #4a4a4a;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.mbtn:hover{background:#7e86c0;box-shadow:inset 2px 2px 0 #bec8ff,inset -2px -3px 0 #4f557d;color:#ffffa0}
.mrow{display:flex;gap:8px;width:min(400px,86vw)}
.mrow .mbtn{flex:1;width:auto}
.mslider{width:min(400px,86vw);height:40px;position:relative;background:#000;border:2px solid #000;box-shadow:inset 0 0 0 2px #555}
.mslider input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.mslider span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;text-shadow:2px 2px 0 #3f3f3f;pointer-events:none}
.mslider i{position:absolute;top:0;bottom:0;width:16px;background:#6f6f6f;border:2px solid #000;box-shadow:inset 2px 2px 0 #aaa,inset -2px -2px 0 #4a4a4a;pointer-events:none}
#menu .help{font-size:12px;color:#ddd;text-align:center;line-height:1.8;text-shadow:1px 1px 0 #000;max-width:90vw;margin-top:6px}
#loading{position:fixed;inset:0;z-index:50;background:#2b1d0e url() repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:16px;text-shadow:2px 2px 0 #3f3f3f}
#loading .bar{width:min(300px,70vw);height:6px;background:#3a3a3a;border:2px solid #000}
#loading .bar i{display:block;height:100%;width:0;background:#80ff20}
#dead{position:fixed;inset:0;z-index:45;background:linear-gradient(rgba(80,0,0,.376),rgba(128,48,48,.627));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(30px * var(--s));gap:calc(4px * var(--s))}
#dead h2{font-family:Galmuri9,monospace;font-size:calc(18px * var(--s));text-shadow:calc(2px * var(--s)) calc(2px * var(--s)) 0 #3f3f3f;font-weight:normal;margin-bottom:calc(20px * var(--s))}
#dead p{font-family:Galmuri9,monospace;font-size:calc(9px * var(--s));text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f}#dead p b{color:#ffff55;font-weight:normal}
#dead #respawn{margin-top:calc(26px * var(--s))}#dead .mbtn[disabled]{opacity:1;color:#a0a0a0;pointer-events:none}

/* 모바일 */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;width:56px;height:56px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
#touch .tb.on{background:rgba(255,255,255,.4)}
#touch .tb svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#joy{position:absolute;left:24px;bottom:calc(90px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.55)}
#tJump{right:28px;bottom:calc(100px + env(safe-area-inset-bottom))}
#tSneak{right:96px;bottom:calc(100px + env(safe-area-inset-bottom))}
#tInv{right:22px;top:20px}
#tPause{right:86px;top:20px}
#tDrop{right:150px;top:20px}
#invBtn{display:none}
.touch #invBtn{display:block;width:calc(20px * var(--s));height:calc(20px * var(--s));position:absolute;right:calc(-24px * var(--s));top:0;background:rgba(0,0,0,.42);outline:calc(1px * var(--s)) solid #000;box-shadow:inset 0 0 0 calc(1px * var(--s)) #8b8b8b;color:#fff;font-size:calc(10px * var(--s));line-height:calc(18px * var(--s));text-align:center;letter-spacing:-1px;pointer-events:auto}

/* 메뉴 확장 */
#menu.dirt{background:#000 var(--dirt) repeat;background-size:64px 64px;image-rendering:pixelated}
#menu.dirt:before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:-1}
#menu{isolation:isolate;overflow-y:auto;justify-content:safe center;padding:14px 0}
@media (max-height:520px){#menu{gap:7px}.mbtn,.minput,.mslider{height:34px}#menu h1{font-size:34px}.mlist{height:38vh}}
.mbtn[disabled]{opacity:.5;pointer-events:none}
.mlist{width:min(560px,92vw);height:min(46vh,340px);overflow-y:auto;background:rgba(0,0,0,.55);border-top:2px solid #000;border-bottom:2px solid #000;padding:6px;display:flex;flex-direction:column;gap:4px}
.mitem{padding:8px 10px;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-shadow:2px 2px 0 #3f3f3f}
.mitem b{font-weight:normal;font-size:15px}.mitem small{font-size:12px;color:#a0a0a0}
.mitem:hover{border-color:#555}.mitem.on{border-color:#c0c0c0;background:rgba(255,255,255,.04)}
.mempty{color:#a0a0a0;text-align:center;padding:30px 10px;font-size:14px}
.mlabel{width:min(400px,86vw);font-size:13px;color:#a0a0a0;text-shadow:1px 1px 0 #000;margin-bottom:-6px}
.minput{width:min(400px,86vw);height:40px;background:#000;border:2px solid #a0a0a0;color:#fff;font:inherit;font-size:15px;padding:0 10px;outline:none}

/* ═════════════ 텍스처 다시 그리기 — 마크 자바 에디션 느낌 ═════════════
   원본 그림 파일은 쓰지 않고, 마크 블록의 색 · 무늬 · 명암 규칙(빛은 왼쪽 위 · 그림자는 오른쪽 아래)을 따라 코드가 직접 그려요.
   아틀라스를 만들기 직전에 같은 이름의 칸을 바꿔 끼워요 */
const RT=(name,c)=>{if(TEX[name]!=null)tileList[TEX[name]]=c;return c};
const lum3=c=>c[0]*.299+c[1]*.587+c[2]*.114;
const kC=(c,k)=>[clamp(c[0]*k,0,255),clamp(c[1]*k,0,255),clamp(c[2]*k,0,255)];
const mixC=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rampC=(pal,v)=>pal[clamp(Math.floor(v*pal.length),0,pal.length-1)];
const imgOf=name=>tileList[TEX[name]].getContext('2d').getImageData(0,0,16,16).data;
// 가로 · 세로 주기를 따로 정하는 이음매 없는 노이즈 (나무껍질 · 심층암 줄무늬용)
function tnA(x,y,fx,fy,s){const gx=16/fx,gy=16/fy,xi=Math.floor(x/gx),yi=Math.floor(y/gy),xf=sm(x/gx-xi),yf=sm(y/gy-yi),h=(a,b)=>hash2(((a%fx)+fx)%fx,((b%fy)+fy)%fy,s);return lerp(lerp(h(xi,yi),h(xi+1,yi),xf),lerp(h(xi,yi+1),h(xi+1,yi+1),xf),yf)}
// 얼룩진 돌 (돌 · 안산암 · 네더랙 · 엔드 돌 …): 큰 얼룩 + 작은 얼룩 + 낱알, 그리고 작은 돌 조각(밝은 점과 오른쪽 아래 그림자)
function mottleT(seed,pal,o={}){return paint(seed,P=>{const s=seed*7+1,lo=o.lo??.16,hi=o.hi??.92;
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const v=tn(x,y,o.f1??4,s)*(o.a??.5)+tn(x,y,o.f2??8,s+1)*(o.b??.3)+P.r()*(o.c??.2);P.set(x,y,rampC(pal,(v-lo)/(hi-lo)))}
  for(let k=0;k<(o.chips||0);k++){const x=Math.floor(P.r()*16),y=Math.floor(P.r()*16),L=1+Math.floor(P.r()*2);for(let i=0;i<L;i++){P.set((x+i)&15,y,pal[pal.length-1]);P.set((x+i+1)&15,(y+1)&15,pal[0])}}
  if(o.post)o.post(P)})}
// 조약돌: 둥근 돌마다 왼쪽 위가 밝고 오른쪽 아래가 어두워요 · 돌 사이는 짙은 틈
function cobbleMC(seed,pal,gap,gap2,n){const base=pal.map(rgb).reduce((a,c)=>[a[0]+c[0]/pal.length,a[1]+c[1]/pal.length,a[2]+c[2]/pal.length],[0,0,0]),bl=(base[0]+base[1]+base[2])/3/255;
  return paint(seed,P=>{const pts=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)pts.push([(c+.5+(r%2)*.5)*4+(P.r()-.5)*2.2,(r+.5)*4+(P.r()-.5)*1.6,.82+P.r()*.36]);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){let d1=1e9,d2=1e9,cp=null,cx=0,cy=0;
    for(const p of pts)for(let ox=-16;ox<=16;ox+=16)for(let oy=-16;oy<=16;oy+=16){const px=p[0]+ox,py=p[1]+oy,d=Math.hypot((x+.5-px)*.9,(y+.5-py)*1.15);if(d<d1){d2=d1;d1=d;cp=p;cx=px;cy=py}else if(d<d2)d2=d}
    const e=d2-d1;let v;if(e<.8)v=e<.35?.18:.3+P.r()*.06;else v=clamp(.55*cp[2]+((cy-(y+.5))*.11+(cx-(x+.5))*.06)+(P.r()-.5)*.16+(e<1.6?-.08:0),.22,.98);
    P.set(x,y,kC(base,v/Math.max(.2,bl)*.62))}})}
// 벽돌: 줄 높이 rh · 벽돌 너비 bw · 엇갈림 off · 위쪽 밝은 줄 · 아래 어두운 줄 · 틈
function brickMC(seed,o){return paint(seed,P=>{const {rh,bw,off,body,mortar}=o;
  for(let y=0;y<16;y++){const row=Math.floor(y/rh),yy=y%rh,sh=(row%2)*off;for(let x=0;x<16;x++){const X=x+sh,xx=X%bw,bid=Math.floor(X/bw)%Math.ceil(16/bw);
    if(yy===rh-1||xx===bw-1){P.set(x,y,kC(rgb(mortar),.95+P.r()*.1));continue}
    let c=rgb(body[Math.floor(hash2(bid,row,seed)*body.length)]);if(o.hi&&(yy===0||xx===0))c=mixC(c,rgb(o.hi),yy===0&&xx===0?.7:.5);else if(o.lo&&(yy===rh-2||xx===bw-2))c=mixC(c,rgb(o.lo),.45);
    P.set(x,y,kC(c,(o.k??.93)+P.r()*(o.kr??.12)))}}
  if(o.post)o.post(P)})}
// 판자: 판 4장 (판마다 아래 어두운 줄 · 엇갈린 이음매 · 짧은 결)
function plankMC(seed,o){return paint(seed,P=>{const seams=[3,11,7,13];
  for(let b=0;b<4;b++){const base=rgb(o.base[(b+Math.floor(P.r()*2))%o.base.length]);
    for(let y=b*4;y<b*4+4;y++)for(let x=0;x<16;x++)P.set(x,y,y===b*4+3?kC(rgb(o.line),P.r()<.2?.95:1):kC(base,P.r()<.18?.96:P.r()<.1?1.04:1));
    for(let k=0;k<3;k++){const y=b*4+Math.floor(P.r()*3),x0=Math.floor(P.r()*16),L=2+Math.floor(P.r()*5);for(let i=0;i<L;i++)P.set((x0+i)&15,y,kC(rgb(o.grain),.96+P.r()*.06))}
    for(let x=0;x<16;x++)if(P.r()<.45)P.set(x,b*4,kC(rgb(o.light),.97+P.r()*.05));

function recipeList(n){const seen=new Set(),out=[];for(const r of RECIPES){const w=r.shapeless?1:r.pat[0].length,h=r.shapeless?1:r.pat.length;if(w>n||h>n||seen.has(r.out.id))continue;seen.add(r.out.id);out.push(r)}return out}

const WOOL_RED=WOOL_C(14),WOOL_WHITE=WOOL;

// ── 폐광: 가운데 흙방 → 사방으로 복도 → 교차로 · 계단 → 다음 복도 (8단계 · 반경 80칸)
const MINE={kind:'mineshaft',sp:12*16,sep:4*16,salt:7101,rad:96,test(x,z,r){if(r()>.55)return null;const h=terrainH(x,z),top=Math.min(h-14,mcY(40));const lo=mcY(-30);if(top<=lo+6)return null;return{y:lo+Math.floor(r()*(top-lo))}}};
function mineParts(s){if(s.parts)return s.parts;const r=mulberry(s.seed),P=[];
  const R0=4+Math.floor(r()*4),room={t:'room',x0:s.x-R0,x1:s.x+R0,y0:s.y,y1:s.y+3+Math.floor(r()*3),z0:s.z-R0,z1:s.z+R0};P.push(room);
  const cor=(x,y,z,dx,dz,depth)=>{if(depth>8||P.length>70||y<6)return;const L=(2+Math.floor(r()*4))*5,ex=x+dx*L,ez=z+dz*L;if(Math.hypot(ex-s.x,ez-s.z)>80)return;
    P.push({t:'cor',x,y,z,dx,dz,L,rails:r()<.7,webs:r()<.4,chest:r()<.28?2+Math.floor(r()*(L-4)):-1,spawner:r()<.07?Math.floor(L/2)+1:-1});
    const k=r();if(k<.55){const cx=ex+dx,cz=ez+dz,two=r()<.2;P.push({t:'cross',x:cx,y,z:cz,two});for(const [ndx,ndz] of [[dx,dz],[dz,dx],[-dz,-dx]])if(r()<.7)cor(cx+ndx*2,y+(two&&r()<.5?4:0),cz+ndz*2,ndx,ndz,depth+1)}
    else if(k<.8){const down=r()<.65;P.push({t:'stairs',x:ex,y,z:ez,dx,dz,down});cor(ex+dx*5,y+(down?-5:5),ez+dz*5,dx,dz,depth+1)}
    else cor(ex,y,ez,dx,dz,depth+1)};
  for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]])if(r()<.85){const off=Math.floor(r()*(R0*2-2))-R0+1;const x=dx?(dx>0?room.x1+1:room.x0-1):s.x+off,z=dz?(dz>0?room.z1+1:room.z0-1):s.z+off;cor(x,room.y0,z,dx,dz,1)}
  s.parts=P;return P}
function stampMine(B_,s){const P=mineParts(s),r=mulberry(s.seed^0x5bd1);
  const carve=(x,y,z)=>{const v=B_.get(x,y,z);if(v<0||v===BEDROCK||v===WATER||v===LAVA)return;B_.set(x,y,z,AIR)},floor=(x,y,z)=>{const v=B_.get(x,y,z);if(v===AIR||v===LAVA||v===WATER)B_.set(x,y,z,PLANKS)};
  for(const p of P){
    if(p.t==='room'){for(let x=p.x0;x<=p.x1;x++)for(let z=p.z0;z<=p.z1;z++){for(let y=p.y0;y<=p.y1;y++)carve(x,y,z);const v=B_.get(x,p.y0-1,z);if(v>=0&&v!==BEDROCK)B_.set(x,p.y0-1,z,DIRT)}}
    else if(p.t==='cor'){const px=-p.dz,pz=p.dx;
      for(let i=0;i<p.L;i++){const cx=p.x+p.dx*i,cz=p.z+p.dz*i;for(let w=-1;w<=1;w++){const x=cx+px*w,z=cz+pz*w;for(let y=p.y;y<p.y+3;y++)carve(x,y,z);floor(x,p.y-1,z)}
        if(i%5===2){for(const sgn of [-1,1]){B_.set(cx+px*sgn,p.y,cz+pz*sgn,FENCE_OAK);B_.set(cx+px*sgn,p.y+1,cz+pz*sgn,FENCE_OAK)}for(let w=-1;w<=1;w++)B_.set(cx+px*w,p.y+2,cz+pz*w,PLANKS);if(r()<.08)B_.set(cx,p.y+1,cz,AIR)}
        else{if(p.rails&&r()<.9)B_.set(cx,p.y,cz,RAIL,p.dx?1:0);const q=r(),sg=r()<.5?-1:1;if(p.webs&&q<.14)B_.set(cx+px*sg,p.y+2,cz+pz*sg,COBWEB)}
        if(i===p.chest){const sg=r()<.5?-1:1;B_.chest(cx+px*sg,p.y,cz+pz*sg,'mineshaft')}
        if(i===p.spawner){B_.spawner(cx,p.y,cz,'cave_spider');for(let dy=0;dy<3;dy++)for(let w=-1;w<=1;w++)if(r()<.5&&!(w===0&&dy===0))B_.set(cx+px*w,p.y+dy,cz+pz*w,COBWEB);for(let k=-2;k<=2;k++)if(k&&r()<.6)B_.set(cx+p.dx*k,p.y+1,cz+p.dz*k,COBWEB)}}}
    else if(p.t==='cross'){const hh=p.two?7:3;for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){for(let y=p.y;y<p.y+hh;y++)carve(p.x+dx,y,p.z+dz);floor(p.x+dx,p.y-1,p.z+dz)}
      if(p.two){for(const [dx,dz] of [[-1,-1],[1,-1],[-1,1],[1,1]])for(let y=p.y;y<p.y+hh;y++)B_.set(p.x+dx,y,p.z+dz,PLANKS);for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)if(dx||dz)B_.set(p.x+dx,p.y+3,p.z+dz,PLANKS)}}
    else if(p.t==='stairs'){const px=-p.dz,pz=p.dx;for(let i=0;i<5;i++){const cx=p.x+p.dx*i,cz=p.z+p.dz*i,fy=p.down?p.y-i-1:p.y+i;for(let w=-1;w<=1;w++){const x=cx+px*w,z=cz+pz*w;for(let y=fy;y<fy+(p.down?4+1:4);y++)carve(x,y,z);floor(x,fy-1,z)}}}}}

// ── 정글 사원: 이끼 낀 조약돌 3층 + 지하 화살 함정 + 상자 2개
const JTEMP={kind:'jungle_pyramid',sp:32*16,sep:8*16,salt:7201,rad:16,test(x,z,r){const h=terrainH(x,z),bm=biomeOf(x,z,h);if(bm!==BIO.JUNGLE&&bm!==BIO.BAMBOO_JUNGLE)return null;if(h<=SEA)return null;return{y:minH(x+6,z+7,6)+1,rot:r()<.5}}};
const ARROW_TRAPS=new Map();
function stampJungle(B_,s){const r=mulberry(s.seed),X=s.x,Z=s.z,Y=s.y,W=12,D=15;
  const cob=()=>r()<.55?MOSSY_COBBLE:COBBLE;
  for(let x=0;x<W;x++)for(let z=0;z<D;z++){B_.pillar(X+x,Y-5,Z+z,COBBLE,24);for(let y=Y-5;y<Y;y++){const e=x===0||z===0||x===W-1||z===D-1;B_.set(X+x,y,Z+z,e||y===Y-5?cob():AIR)}B_.set(X+x,Y-1,Z+z,cob())}
  // 1층
  for(let x=0;x<W;x++)for(let z=0;z<D;z++)for(let y=Y;y<Y+4;y++){const e=x===0||z===0||x===W-1||z===D-1;B_.set(X+x,y,Z+z,e?cob():AIR)}
  for(let x=5;x<=6;x++)for(let y=Y;y<Y+2;y++)B_.set(X+x,y,Z+D-1,AIR);for(const z of [3,7,11])for(const x of [0,W-1])B_.set(X+x,Y+1,Z+z,AIR);
  for(let x=0;x<W;x++)if(x%3===1)B_.set(X+x,Y+3,Z+D-1,CHISELED_SB);
  // 2층 · 지붕
  for(let x=1;x<W-1;x++)for(let z=1;z<D-1;z++){B_.set(X+x,Y+4,Z+z,cob());for(let y=Y+5;y<Y+8;y++){const e=x===1||z===2||x===W-2||z===D-3;B_.set(X+x,y,Z+z,(z>=2&&z<=D-3)?(e?cob():AIR):AIR)}}
  for(let x=5;x<=6;x++)for(let y=Y+5;y<Y+7;y++)B_.set(X+x,y,Z+D-3,AIR);for(let x=2;x<W-2;x++)for(let z=3;z<D-3;z++)B_.set(X+x,Y+8,Z+z,cob());
  for(let x=4;x<W-4;x++)for(let z=5;z<D-5;z++){B_.set(X+x,Y+9,Z+z,(x===4||x===W-5||z===5||z===D-6)?cob():AIR);B_.set(X+x,Y+11,Z+z,cob())}for(const [x,z] of [[4,5],[W-5,5],[4,D-6],[W-5,D-6]])B_.set(X+x,Y+10,Z+z,CHISELED_SB);
  for(let y=Y;y<Y+4;y++)B_.set(X+1,y,Z+7,cob());for(let y=Y;y<=Y+4;y++)B_.set(X+2,y,Z+7,LADDER,1);
  // 지하로 내려가는 계단 (서쪽 벽을 따라)
  for(let k=0;k<4;k++){const z=Z+3+k;B_.set(X+2,Y-1-k,z,ST_COBBLE,3);for(let y=Y-k;y<Y+3;y++)B_.set(X+2,y,z,AIR);B_.set(X+3,Y-1-k,z,ST_COBBLE,3);for(let y=Y-k;y<Y+3;y++)B_.set(X+3,y,z,AIR)}
  // 지하: 동쪽으로 가는 복도에 화살 함정 (발사기 + 걸리는 줄)
  for(let x=2;x<W-1;x++){B_.set(X+x,Y-4,Z+11,AIR);B_.set(X+x,Y-3,Z+11,AIR)}
  B_.set(X+W-1,Y-3,Z+11,DISPENSER,1);B_.set(X+6,Y-4,Z+11,TRIPWIRE,1);ARROW_TRAPS.set(tkey(X+6,Y-4,Z+11),{x:X+W-1,y:Y-3,z:Z+11,dx:-1,dz:0,n:2});
  for(let z=4;z<=9;z++){B_.set(X+9,Y-4,Z+z,AIR);B_.set(X+9,Y-3,Z+z,AIR)}B_.set(X+9,Y-3,Z+3,DISPENSER,2);B_.set(X+9,Y-4,Z+8,TRIPWIRE,0);ARROW_TRAPS.set(tkey(X+9,Y-4,Z+8),{x:X+9,y:Y-3,z:Z+3,dx:0,dz:1,n:2});
  B_.chest(X+9,Y-4,Z+4,'jungle_temple');B_.chest(X+W-2,Y-4,Z+12,'jungle_temple');
  for(const [x,z] of [[3,12],[4,12]])B_.set(X+x,Y-4,Z+z,LEVER);
  // 덩굴
  for(let k=0;k<26;k++){const side=Math.floor(r()*4),t=Math.floor(r()*(side<2?D:W)),y=Y+Math.floor(r()*8);const [x,z,m]=side===0?[-1,t,0]:side===1?[W,t,1]:side===2?[t,-1,2]:[t,D,3];for(let d=0;d<3;d++)B_.soft(X+x,y-d,Z+z,VINE,m)}}

// ── 마녀의 오두막: 늪 위 다리 기둥 4개 + 가문비나무 집 + 가마솥 · 화분
const WHUT={kind:'swamp_hut',sp:32*16,sep:8*16,salt:7301,rad:10,test(x,z,r){const h=terrainH(x,z),bm=biomeOf(x,z,h);if(bm!==BIO.SWAMP&&bm!==BIO.MANGROVE)return null;return{y:Math.max(h,SEA)+3}}};
function stampHut(B_,s){const X=s.x,Z=s.z,Y=s.y,SP=SPRUCE_PLANKS;

  for(let x=0;x<7;x++)for(let z=1;z<10;z++)B_.set(X+x,Y,Z+z,SP);for(let x=1;x<6;x++)B_.set(X+x,Y,Z,SP);
  for(let x=1;x<6;x++)for(let z=2;z<9;z++)for(let y=Y+1;y<=Y+3;y++){const e=x===1||x===5||z===2||z===8;B_.set(X+x,y,Z+z,e?SP:AIR)}
  for(const [x,z] of [[1,2],[5,2],[1,8],[5,8]])for(let y=Y+1;y<=Y+3;y++)B_.set(X+x,y,Z+z,LOG);
  B_.set(X+3,Y+1,Z+2,AIR);B_.set(X+3,Y+2,Z+2,AIR);for(const z of [4,6])B_.set(X+1,Y+2,Z+z,FENCE_OAK);B_.set(X+5,Y+2,Z+5,FENCE_OAK);
  for(let x=0;x<7;x++)for(let z=1;z<10;z++)B_.set(X+x,Y+4,Z+z,(x===0||x===6)?WST.spruce:SP,x===0?0:x===6?1:0);for(let x=1;x<6;x++)for(let z=2;z<9;z++)B_.set(X+x,Y+5,Z+z,x===1||x===5?WSL.spruce:SP);
  B_.set(X+4,Y+1,Z+7,TABLE);B_.set(X+2,Y+1,Z+7,CAULDRON);B_.set(X+2,Y+1,Z+3,FLOWER_POT);B_.set(X+2,Y+2,Z+3,RED_MUSHROOM);
  mobAt('hut'+X+','+Z,'witch',X+3.5,Y+1,Z+5.5,1)}

// ── 이글루: 눈 돔 + 안에 침대 · 화로 · 작업대 · 레드스톤 횃불 · 바닥 문 아래 비밀 지하실 (절반)
const IGLOO={kind:'igloo',sp:32*16,sep:8*16,salt:7401,rad:10,test(x,z,r){const h=terrainH(x,z),bm=biomeOf(x,z,h);if(bm!==BIO.SNOWY&&bm!==BIO.SNOWY_TAIGA)return null;if(h<=SEA)return null;return{y:minH(x,z,3)+1,base:r()<.5}}};
function stampIgloo(B_,s){const X=s.x,Z=s.z,Y=s.y;
  for(let dx=-4;dx<=4;dx++)for(let dz=-4;dz<=4;dz++){B_.pillar(X+dx,Y-1,Z+dz,SNOW,6);for(let dy=0;dy<=4;dy++){const d=Math.hypot(dx/4.4,dz/4.4,dy/3.8);if(d>1)continue;B_.set(X+dx,Y+dy,Z+dz,d>.74?SNOW:AIR)}}
  for(let dx=-3;dx<=3;dx++)for(let dz=-3;dz<=3;dz++)if(Math.hypot(dx,dz)<3.6)B_.set(X+dx,Y,Z+dz,WOOL_WHITE);
  for(let dz=4;dz<=6;dz++){for(const dx of [-1,1])for(let y=Y;y<=Y+2;y++)B_.set(X+dx,y,Z+dz,SNOW);B_.set(X,Y+3,Z+dz,SNOW);B_.set(X,Y,Z+dz,AIR);B_.set(X,Y+1,Z+dz,AIR);B_.set(X,Y+2,Z+dz,AIR);B_.set(X,Y-1,Z+dz,SNOW)}
  B_.set(X-4,Y+1,Z,ICE);B_.set(X+4,Y+1,Z,ICE);
  B_.set(X-2,Y,Z-2,BED,2);B_.set(X-2,Y,Z-1,BED_HEAD,2);B_.set(X+2,Y,Z-2,FURNACE);B_.set(X+2,Y,Z-1,TABLE);B_.set(X+2,Y,Z+1,RTORCH_ON);
  if(s.base){const BY=Y-10;
    for(let dx=-3;dx<=3;dx++)for(let dz=-3;dz<=4;dz++)for(let y=BY-1;y<=BY+3;y++){const e=Math.abs(dx)===3||dz===-3||dz===4||y===BY-1||y===BY+3;B_.set(X+dx,y,Z+dz,e?STONE_BRICKS:AIR)}
    for(let y=BY;y<Y;y++){if(y>BY+3)B_.set(X,y,Z-1,STONE_BRICKS);B_.set(X,y,Z,LADDER,3)}B_.set(X,Y,Z,OAK_TRAPDOOR,0);B_.set(X-2,BY,Z-2,BREWING);B_.set(X-1,BY,Z-2,CAULDRON);B_.chest(X+2,BY,Z-2,'igloo');B_.set(X+2,BY,Z-1,CHISELED_SB);
    for(const sx of [-2,1])for(let y=BY;y<BY+2;y++){B_.set(X+sx,y,Z+2,IRON_BARS);B_.set(X+sx+1,y,Z+2,IRON_BARS)}for(const dx of [-3,0,3])for(let y=BY;y<BY+3;y++)B_.set(X+dx,y,Z+3,STONE_BRICKS);
    mobAt('igv'+X+','+Z,'villager',X-1.5,BY,Z+3.5,1);mobAt('igz'+X+','+Z,'zombie',X+1.5,BY,Z+3.5,1)}}

// ── 약탈자 전초기지: 짙은 참나무 기둥 4개 · 자작나무 벽 4층 탑 + 꼭대기 상자 + 철 골렘 우리 · 천막
const OUTPOST={kind:'pillager_outpost',sp:32*16,sep:8*16,salt:7501,rad:20,test(x,z,r){if(r()>.45)return null;const h=terrainH(x,z),bm=biomeOf(x,z,h);
  if(![BIO.PLAINS,BIO.SUNFLOWER_PLAINS,BIO.DESERT,BIO.SAVANNA,BIO.TAIGA,BIO.SNOWY,BIO.GROVE,BIO.MEADOW,BIO.CHERRY,BIO.SNOWY_TAIGA].includes(bm)||h<=SEA)return null;if(GEN>=2&&inVillage(x,z))return null;return{y:minH(x+4,z+4,5)+1}}};
function stampOutpost(B_,s){const X=s.x,Z=s.z,Y=s.y,r=mulberry(s.seed),DL=DARK_OAK_LOG,DP=DARK_OAK_PLANKS;
  for(let x=0;x<9;x++)for(let z=0;z<9;z++){B_.pillar(X+x,Y-1,Z+z,COBBLE,16);B_.set(X+x,Y-1,Z+z,COBBLE)}
  for(let y=Y;y<=Y+20;y++)for(let x=0;x<9;x++)for(let z=0;z<9;z++){const cor=(x===0||x===8)&&(z===0||z===8),e=x===0||x===8||z===0||z===8;
    if(cor){B_.set(X+x,y,Z+z,DL);continue}const lv=(y-Y)%5;if(lv===0&&!(x===1&&z===1&&y>Y)){B_.set(X+x,y,Z+z,DP);continue}if(e&&y<Y+16){const win=lv===2&&(x===4||z===4);B_.set(X+x,y,Z+z,win?FENCE_OAK:BIRCH_PLANKS);continue}B_.set(X+x,y,Z+z,AIR)}
  for(let y=Y+1;y<Y+16;y++)B_.set(X+1,y,Z+1,LADDER,1);for(let y=Y+1;y<=Y+2;y++)B_.set(X+4,y,Z+8,AIR);
  // 꼭대기: 넓은 마루 + 울타리 난간 + 지붕
  for(let x=-1;x<=9;x++)for(let z=-1;z<=9;z++){B_.set(X+x,Y+15,Z+z,DP);const e=x===-1||x===9||z===-1||z===9;B_.set(X+x,Y+16,Z+z,e?FENCE_OAK:AIR);for(let y=Y+17;y<=Y+19;y++)if(!((x===0||x===8)&&(z===0||z===8)))B_.set(X+x,y,Z+z,AIR)}
  B_.set(X+1,Y+15,Z+1,LADDER,1);for(let x=-1;x<=9;x++)for(let z=-1;z<=9;z++)B_.set(X+x,Y+21,Z+z,DP);for(let x=1;x<=7;x++)for(let z=1;z<=7;z++)B_.set(X+x,Y+22,Z+z,DP);B_.set(X+4,Y+23,Z+4,DP);
  B_.chest(X+5,Y+16,Z+5,'outpost');
  // 철 골렘 우리 (울타리) · 천막 (흰 양털)
  const gx=X-8,gz=Z+2;for(let dx=0;dx<4;dx++)for(let dz=0;dz<4;dz++){const e=dx===0||dx===3||dz===0||dz===3,gy=terrainH(gx+dx,gz+dz)+1;B_.set(gx+dx,gy-1,gz+dz,DP);for(let y=gy;y<gy+3;y++)B_.set(gx+dx,y,gz+dz,e?FENCE_OAK:AIR);B_.set(gx+dx,gy+3,gz+dz,DP)}
  mobAt('opg'+X+','+Z,'iron_golem',gx+2,terrainH(gx+2,gz+2)+1,gz+2,1);
  const tx=X+12,tz=Z+1;for(let dx=0;dx<5;dx++)for(let dz=0;dz<4;dz++){const ty=terrainH(tx+dx,tz+dz)+1;const hgt=dz===0||dz===3?1:2;for(let y=0;y<hgt;y++)B_.set(tx+dx,ty+y,tz+dz,(dx===0||dx===4)?WOOL_WHITE:AIR);B_.set(tx+dx,ty+hgt,tz+dz,WOOL_WHITE)}
  mobAt('opp'+X+','+Z,'pillager',X+4,Y+1,Z+4,3);mobAt('opt'+X+','+Z,'pillager',X+4,Y+16,Z+4,2)}

// ── 난파선: 바다 밑 · 해변. 배 길이 22 · 폭 7 · 돛대 · 뒤 선실 (지도 상자) · 가운데 (보물) · 앞 (보급)
const SHIP={kind:'shipwreck',sp:24*16,sep:4*16,salt:7601,rad:16,test(x,z,r){const h=terrainH(x,z),bm=biomeOf(x,z,h);const beach=bm===BIO.BEACH||bm===BIO.SNOWY_BEACH;if(!isOcean(bm)&&!beach)return null;if(!beach&&h>SEA-4)return null;
  return{y:beach?h:h-1+Math.floor(r()*2),ax:r()<.5,flip:r()<.5,mast:r()<.7,beach}}};
function stampShip(B_,s){const r=mulberry(s.seed),L=22,P=(u,v)=>s.ax?[s.x+(s.flip?-u:u),s.z+v]:[s.x+v,s.z+(s.flip?-u:u)],Y=s.y,fill=y=>y<=SEA?WATER:AIR;
  const plank=()=>r()<.5?SPRUCE_PLANKS:PLANKS,hw=u=>u<2?1:u<4?2:u>L-3?1:u>L-6?2:3;
  for(let u=0;u<L;u++){const w=hw(u);for(let v=-w;v<=w;v++){const [x,z]=P(u,v);const side=Math.abs(v)===w;

// 거대 균 (마크 HugeFungusFeature 느낌): 줄기 4~13칸 (가끔 두 배) · 꼭대기는 꽉 찬 돔, 아래로 치마처럼 늘어진 가장자리 · 버섯불 · 진홍빛은 늘어지는 덩굴
function hugeFungus(put,x,y,z,crim,r,maxH){const stem=crim?CRIMSON_STEM:WARPED_STEM,wart=crim?NWART_BLOCK:WWART_BLOCK;let h=4+Math.floor(r()*10);if(r()<.08)h*=2;h=Math.min(h,26,maxH);if(h<4)return;
  for(let i=1;i<=h;i++)put(x,y+i,z,stem);const top=y+h,capH=Math.min(h-1,3+Math.floor(r()*(h/3+1)));
  for(let l=0;l<=capH;l++){const yy=top+1-l,rad=l===0?1:Math.min(3,1+l),skirt=l>=3;
    for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){const ring=Math.max(Math.abs(dx),Math.abs(dz))===rad,corner=Math.abs(dx)===rad&&Math.abs(dz)===rad;
      if(corner&&r()<.55)continue;if(skirt&&!ring)continue;if(l===capH&&r()<.3)continue;if(dx===0&&dz===0&&l>0)continue;
      put(x+dx,yy,z+dz,l>0&&r()<.06?SHROOMLIGHT:wart);
      if(crim&&ring&&l>=capH-1&&r()<.4){const L=1+Math.floor(r()*6);for(let k=1;k<=L;k++)put(x+dx,yy-k,z+dz,WEEPING_VINES)}}}}
// 네더 장식 (genNether 에서 불러요): 천장 늘어지는 덩굴 · 바닥 뒤틀린 덩굴 · 네더 새싹 · 삼각주 용암 웅덩이와 짧은 현무암 기둥 · 화석 · 폐허 차원문
function netherDeco(b,cx,cz,ox,oz,bio){const r=mulberry((Math.imul(cx,92821)^Math.imul(cz,68917)^Math.imul(SEED,4111))|0),H=96;
  const at=(x,y,z)=>x<0||z<0||x>15||z>15||y<0||y>=H?-1:b[bi(x,y,z)],put=(x,y,z,id)=>{if(x<0||z<0||x>15||z>15||y<1||y>=H-1)return;b[bi(x,y,z)]=id};
  for(let z=0;z<16;z++)for(let x=0;x<16;x++){const bm=bio[x|z<<4];if(bm!==2&&bm!==3&&bm!==4)continue;const wx=ox+x,wz=oz+z;
    for(let y=N_LAVA+1;y<H-6;y++){const id=at(x,y,z);
      if(bm===4&&(id===BASALT||id===BLACKSTONE||id===MAGMA)&&at(x,y+1,z)===AIR){const n=noise2(wx/6,wz/6,SEED+63);
        if(n>.45&&[[1,0],[-1,0],[0,1],[0,-1]].every(([a,c])=>{const v=at(x+a,y,z+c);return v>0&&v!==AIR})&&at(x,y-1,z)!==AIR){b[bi(x,y,z)]=LAVA;continue}
        if(n>.33){b[bi(x,y,z)]=MAGMA;continue}}
      if(id!==AIR)continue;const up=at(x,y+1,z),dn=at(x,y-1,z),q=hash3(wx,y,wz,SEED+1901);
      if(bm===2&&(up===NETHERRACK||up===NWART_BLOCK)&&q<.05){const L=1+Math.floor(hash3(wx,y,wz,SEED+1903)*9);for(let k=0;k<L&&at(x,y-k,z)===AIR;k++)put(x,y-k,z,WEEPING_VINES)}
      else if(bm===3&&dn===WARPED_NYLIUM&&q<.05){const L=1+Math.floor(hash3(wx,y,wz,SEED+1905)*7);for(let k=0;k<L&&at(x,y+k,z)===AIR;k++)put(x,y+k,z,TWISTING_VINES)}
      else if(bm===3&&dn===WARPED_NYLIUM&&q<.13)put(x,y,z,NETHER_SPROUTS);
      else if(bm===4&&(dn===BASALT||dn===BLACKSTONE)&&q<.035){const L=1+Math.floor(hash3(wx,y,wz,SEED+1907)*5);for(let k=0;k<L&&at(x,y+k,z)===AIR;k++)put(x,y+k,z,BASALT)}}}
  // 네더 화석 (영혼 모래 골짜기): 뼈 블록 등뼈 + 갈비뼈
  if(bio[136]===1&&r()<.22){const x0=4+Math.floor(r()*5),z0=4+Math.floor(r()*8);let y0=-1;for(let y=N_LAVA+2;y<H-10;y++){const g=at(x0,y,z0);if((g===SOUL_SAND||g===SOUL_SOIL)&&at(x0,y+1,z0)===AIR){y0=y+1;break}}
    if(y0>0){const ax=r()<.5,L=5+Math.floor(r()*4);for(let u=0;u<L;u++){const px=ax?x0-2+u:x0,pz=ax?z0:z0-2+u;put(px,y0,pz,BONE_BLOCK);if(u%2===0)for(let v=1;v<=3;v++){const hy=y0+(v<3?v:2);for(const sg of [-1,1])put(ax?px:px+v*sg,hy,ax?pz+v*sg:pz,BONE_BLOCK)}}}}
  // 폐허 차원문 (네더): 깨진 흑요석 틀 + 흑암 · 마그마 바닥 · 금 블록 · 상자
  if(r()<.02){const x0=5+Math.floor(r()*4),z0=6;let y0=-1;for(let y=N_LAVA+1;y<H-14;y++)if(SOLID[at(x0,y,z0)]&&at(x0,y+1,z0)===AIR&&at(x0,y+2,z0)===AIR){y0=y+1;break}
    if(y0>0){for(let u=-2;u<6;u++)for(let v=-2;v<=2;v++){const q=r();put(x0+u,y0-1,z0+v,q<.4?BLACKSTONE:q<.6?MAGMA:q<.85?NETHERRACK:PB_BRICKS)}
      for(let u=0;u<4;u++)for(let y=0;y<5;y++){if(!(u===0||u===3||y===0||y===4))continue;const q=r();if(q<.2)continue;put(x0+u,y0+y,z0,q<.35?CRYING_OBSIDIAN:OBSIDIAN)}

function shootWind(from,dir,speed,owner){const m=itemMesh(WIND_CHARGE,.3);m.position.copy(from);scene.add(m);let d=dir.clone();
  if(owner==='mob')d=new V3(player.pos.x,player.pos.y+1,player.pos.z).sub(from).normalize();
  throwns.push({kind:'wind',owner:owner||'player',m,pos:from.clone(),vel:d.multiplyScalar(owner==='mob'?12:20),t:0});sfx('wind',null,.5)}
function windBurst(c,owner,direct){sfx('wind');
  for(let i=0;i<22;i++){const a=Math.random()*6.283,b=Math.random()*2-1,q=Math.sqrt(1-b*b),v=.12+Math.random()*.1;spriteP({x:c.x,y:c.y,z:c.z,xd:Math.cos(a)*q*v,yd:b*v,zd:Math.sin(a)*q*v,grav:0,fric:.82,col:1,rgb:WIND_C,bright:true,s:.12+Math.random()*.1,life:8+Math.floor(Math.random()*8),frames:8,row:0,phys:false})}
  const p=player;if(!p.dead){const dv=new V3(p.pos.x,p.pos.y+.9,p.pos.z).sub(c),dd=dv.length();
    if(dd<2.6){const f=1-dd/2.6;if(owner!=='player')hurtPlayer(1,c,'breeze');dv.normalize();const K=(owner==='player'?22:15)*Math.max(.4,f);
      p.vel.x+=dv.x*K*.8;p.vel.z+=dv.z*K*.8;p.vel.y=Math.max(p.vel.y,dv.y*K+(owner==='player'?5:3));p.fallDist=0;p.windY=p.pos.y;p.windT=.3}}
  for(const m of mobs){if(m.dead||m.D.boss||m.D.windImmune)continue;const dv=new V3(m.pos.x,m.pos.y+m.h/2,m.pos.z).sub(c),dd=dv.length();if(dd>2.6&&m!==direct)continue;
    if(m===direct)hurtMob(m,1,c);const f=Math.max(.4,1-dd/2.6);dv.normalize();m.vel.x+=dv.x*12*f;m.vel.z+=dv.z*12*f;m.vel.y=Math.max(m.vel.y,dv.y*10*f+4)}}

const _updThrowns=updateThrowns;
updateThrowns=function(dt){let any=false;
  for(let i=throwns.length-1;i>=0;i--){const t=throwns[i];if(t.kind!=='wind')continue;any=true;const mob=t.owner==='mob';if(mob&&tStopT>0)continue;t.t+=dt;
    const steps=Math.max(1,Math.ceil(t.vel.length()*dt/.25));let hit=null;
    for(let s=0;s<steps&&!hit;s++){t.pos.addScaledVector(t.vel,dt/steps);const id=getB(Math.floor(t.pos.x),Math.floor(t.pos.y),Math.floor(t.pos.z));
      if(SOLID[id]||(B[id]&&B[id].liquid))hit='block';
      else if(mob){if(!player.dead&&Math.abs(t.pos.x-player.pos.x)<PW+.25&&Math.abs(t.pos.z-player.pos.z)<PW+.25&&t.pos.y>player.pos.y-.2&&t.pos.y<player.pos.y+PH+.2)hit='player'}
      else for(const m of mobs)if(!m.dead&&!m.D.windImmune&&Math.abs(t.pos.x-m.pos.x)<m.hw+.2&&Math.abs(t.pos.z-m.pos.z)<m.hw+.2&&t.pos.y>m.pos.y-.1&&t.pos.y<m.pos.y+m.h+.1){hit=m;break}}
    t.m.position.copy(t.pos);t.m.rotation.y+=dt*12;t.m.rotation.z+=dt*7;
    if(Math.random()<.5)spriteP({x:t.pos.x,y:t.pos.y,z:t.pos.z,xd:0,yd:0,zd:0,grav:0,fric:.9,col:1,rgb:WIND_C,bright:true,s:.07,life:6,frames:8,row:0,phys:false});
    if(hit||t.t>6){scene.remove(t.m);throwns.splice(i,1);const c=hit==='block'?t.pos.clone().addScaledVector(t.vel.clone().normalize(),-.3):t.pos.clone();windBurst(c,mob?'mob':'player',hit&&hit!=='block'&&hit!=='player'?hit:null)}}
  if(!any){_updThrowns(dt);return}
  const keep=throwns.filter(t=>t.kind==='wind');for(const k of keep)throwns.splice(throwns.indexOf(k),1);_updThrowns(dt);throwns.push(...keep)};

  const gid=getB(Math.floor(m.pos.x),Math.floor(m.pos.y-.5),Math.floor(m.pos.z));if(gid&&B[gid]&&!B[gid].liquid)for(let i=0;i<26;i++)terrainP(m.pos.x+(Math.random()-.5)*2,m.pos.y+.1,m.pos.z+(Math.random()-.5)*2,(Math.random()-.5)*2,1+Math.random(),(Math.random()-.5)*2,gid,.6);
