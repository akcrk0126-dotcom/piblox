<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>블록크래프트</title>
<meta name="theme-color" content="#78a7ff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'Galmuri11','Galmuri9',monospace,sans-serif;color:#fff}
canvas#gl{display:block;width:100%;height:100%}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.hide{display:none!important}
#gmBtn,#mpChat{display:none!important}
:root{--s:2}
@media (max-width:760px),(max-height:520px){:root{--s:1.5}}
@media (max-width:420px){:root{--s:1.25}}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;mix-blend-mode:difference}
#cross:before,#cross:after{content:'';position:absolute;background:#ddd}
#cross:before{left:8px;top:0;width:2px;height:18px}
#cross:after{left:0;top:8px;width:18px;height:2px}
#bottom{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#stats{display:flex;justify-content:space-between;width:calc(182px * var(--s));margin-bottom:calc(2px * var(--s))}
#stats .row{display:flex;gap:0}
#stats .row.r{flex-direction:row-reverse}
#stats img{width:calc(8px * var(--s));height:calc(9px * var(--s));margin-right:0}
#air{display:flex;flex-direction:row-reverse;width:calc(182px * var(--s));margin-bottom:calc(1px * var(--s));min-height:calc(9px * var(--s))}
#air img{width:calc(8px * var(--s));height:calc(9px * var(--s))}
#hotbar{display:flex;padding:calc(1px * var(--s));background:rgba(0,0,0,.42);outline:calc(1px * var(--s)) solid #000;box-shadow:inset 0 0 0 calc(1px * var(--s)) #8b8b8b;position:relative;pointer-events:auto}
#hotbar .hs{width:calc(20px * var(--s));height:calc(20px * var(--s));position:relative;box-shadow:inset 0 0 0 calc(1px * var(--s)) rgba(139,139,139,.55)}
#hotbar .hs img{position:absolute;left:calc(2px * var(--s));top:calc(2px * var(--s));width:calc(16px * var(--s));height:calc(16px * var(--s))}
#hotbar .hs .n{position:absolute;right:calc(1px * var(--s));bottom:0;font-size:calc(8px * var(--s));line-height:1;text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f}
#hotbar .hs .dur,.slot .dur{position:absolute;left:12%;bottom:12%;width:76%;height:calc(1.5px * var(--s));background:#000}
#hotbar .hs .dur i,.slot .dur i{display:block;height:100%}
#sel{position:absolute;top:calc(-1px * var(--s));width:calc(24px * var(--s));height:calc(24px * var(--s));border:calc(2px * var(--s)) solid #fff;outline:calc(1px * var(--s)) solid #000;box-shadow:inset 0 0 0 calc(1px * var(--s)) #000;pointer-events:none;transition:left .05s}
#itemName{position:absolute;left:50%;bottom:calc(70px * var(--s));transform:translateX(-50%);font-size:calc(8px * var(--s));text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f;opacity:0;transition:opacity .4s;white-space:nowrap}
#hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 40%,rgba(255,0,0,.55));opacity:0;transition:opacity .25s;z-index:4}
#water{position:fixed;inset:0;pointer-events:none;background:rgba(30,60,200,.38);z-index:3}
#debug{position:absolute;left:6px;top:6px;font-size:12px;line-height:1.5;background:rgba(0,0,0,.35);padding:4px 6px;white-space:pre;text-shadow:1px 1px 0 #3f3f3f}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:calc(9px * var(--s));text-shadow:2px 2px 0 #3f3f3f;opacity:0;transition:opacity .4s;text-align:center;white-space:nowrap}

/* GUI */
#screen{position:fixed;inset:0;z-index:20;background:rgba(16,16,16,.55);display:flex;align-items:center;justify-content:center;cursor:default}
.panel{background:#c6c6c6;padding:calc(7px * var(--s));border-radius:calc(3px * var(--s));box-shadow:inset calc(2px * var(--s)) calc(2px * var(--s)) 0 #fff,inset calc(-2px * var(--s)) calc(-2px * var(--s)) 0 #555,0 0 0 calc(1px * var(--s)) #000;color:#3f3f3f;position:relative}
.panel h3{font-size:calc(8px * var(--s));font-weight:normal;margin:0 0 calc(3px * var(--s)) calc(1px * var(--s));height:calc(10px * var(--s));line-height:calc(10px * var(--s));color:#3f3f3f}
.grid{display:grid;grid-template-columns:repeat(9,calc(18px * var(--s)))}
.slot{width:calc(18px * var(--s));height:calc(18px * var(--s));background:#8b8b8b;box-shadow:inset calc(1px * var(--s)) calc(1px * var(--s)) 0 #373737,inset calc(-1px * var(--s)) calc(-1px * var(--s)) 0 #fff;position:relative}
.slot img{position:absolute;left:calc(1px * var(--s));top:calc(1px * var(--s));width:calc(16px * var(--s));height:calc(16px * var(--s));pointer-events:none}
.slot .n{position:absolute;right:0;bottom:calc(-1px * var(--s));font-size:calc(8px * var(--s));color:#fff;text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f;pointer-events:none;line-height:1}
.slot:hover:after{content:'';position:absolute;left:calc(1px * var(--s));top:calc(1px * var(--s));right:calc(1px * var(--s));bottom:calc(1px * var(--s));background:rgba(255,255,255,.5)}
.slot.big{width:calc(26px * var(--s));height:calc(26px * var(--s))}
.slot.big img{left:calc(5px * var(--s));top:calc(5px * var(--s))}
.slot.big .n{right:calc(4px * var(--s));bottom:calc(3px * var(--s))}
.gap{height:calc(4px * var(--s))}
.top{display:flex;align-items:center;gap:calc(6px * var(--s));margin-bottom:calc(4px * var(--s));min-height:calc(54px * var(--s))}
.pv{width:calc(52px * var(--s));height:calc(70px * var(--s));background:#000;box-shadow:inset calc(1px * var(--s)) calc(1px * var(--s)) 0 #373737,inset calc(-1px * var(--s)) calc(-1px * var(--s)) 0 #fff}
.pv canvas{width:100%;height:100%}
.arrow{width:calc(22px * var(--s));height:calc(15px * var(--s));position:relative;margin:0 calc(4px * var(--s))}
.arrow:before{content:'';position:absolute;left:0;top:calc(5px * var(--s));width:calc(14px * var(--s));height:calc(5px * var(--s));background:#8b8b8b}
.arrow:after{content:'';position:absolute;left:calc(13px * var(--s));top:0;border:calc(7.5px * var(--s)) solid transparent;border-left:calc(9px * var(--s)) solid #8b8b8b;border-right:0}
.arrow i{position:absolute;left:0;top:calc(5px * var(--s));height:calc(5px * var(--s));background:#fff;z-index:1}
.flame{width:calc(14px * var(--s));height:calc(14px * var(--s));position:relative;margin:calc(2px * var(--s)) auto;background:#8b8b8b;clip-path:polygon(50% 0,80% 35%,100% 70%,80% 100%,20% 100%,0 70%,20% 35%)}
.flame i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffe95a,#ff6a00)}
.cgrid3{display:grid;grid-template-columns:repeat(3,calc(18px * var(--s)))}
.cgrid2{display:grid;grid-template-columns:repeat(2,calc(18px * var(--s)))}
.fcol{display:flex;flex-direction:column;align-items:center}
#cursor{position:fixed;left:0;top:0;width:calc(16px * var(--s));height:calc(16px * var(--s));pointer-events:none;z-index:30;transform:translate(-50%,-50%)}
#cursor img{width:100%;height:100%}
#cursor .n{position:absolute;right:calc(-1px * var(--s));bottom:calc(-2px * var(--s));font-size:calc(8px * var(--s));color:#fff;text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f}
#tip{position:fixed;z-index:31;pointer-events:none;background:rgba(16,0,16,.94);border:calc(1px * var(--s)) solid #25015b;outline:calc(1px * var(--s)) solid rgba(16,0,16,.94);padding:calc(3px * var(--s)) calc(4px * var(--s));font-size:calc(8px * var(--s));color:#fff;text-shadow:calc(1px * var(--s)) calc(1px * var(--s)) 0 #3f3f3f;white-space:nowrap}
#tip small{display:block;color:#a8a8a8;font-size:calc(7px * var(--s))}
#closeInv{position:absolute;right:calc(4px * var(--s));top:calc(3px * var(--s));width:calc(12px * var(--s));height:calc(12px * var(--s));border:0;background:none;cursor:pointer;display:none}
#closeInv:before,#closeInv:after{content:'';position:absolute;left:50%;top:15%;height:70%;width:calc(1.5px * var(--s));background:#3f3f3f}
#closeInv:before{transform:rotate(45deg)}#closeInv:after{transform:rotate(-45deg)}
.touch #closeInv{display:block}

/* 메뉴 */
#menu{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.5)}
#menu.title{background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.45))}
#menu h1{font-size:clamp(34px,8vw,64px);letter-spacing:2px;color:#e0e0e0;text-shadow:4px 4px 0 #3a3a3a,0 0 1px #000;margin-bottom:6px;font-weight:bold}
#menu h1 b{color:#ffe14d;font-weight:bold}
#menu .sub{color:#ffff55;font-size:14px;text-shadow:2px 2px 0 #3f3f00;transform:rotate(-8deg);margin:-14px 0 16px 160px}
#menu h2{font-size:22px;text-shadow:2px 2px 0 #3f3f3f;margin-bottom:6px;font-weight:normal}
.mbtn{width:min(400px,86vw);height:40px;font-family:inherit;font-size:16px;color:#fff;text-shadow:2px 2px 0 #3f3f3f;background:#6f6f6f;border:2px solid #000;box-shadow:inset 2px 2px 0 #aaa,inset -2px -3px 0 #4a4a4a;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.mbtn:hover{background:#7e86c0;box-shadow:inset 2px 2px 0 #bec8ff,inset -2px -3px 0 #4f557d;color:#ffffa0}
.mrow{display:flex;gap:8px;width:min(400px,86vw)}
.mrow .mbtn{flex:1;width:auto}
.mslider{width:min(400px,86vw);height:40px;position:relative;background:#000;border:2px solid #000;box-shadow:inset 0 0 0 2px #555}
.mslider input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.mslider span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;text-shadow:2px 2px 0 #3f3f3f;pointer-events:none}
.mslider i{position:absolute;top:0;bottom:0;width:16px;background:#6f6f6f;border:2px solid #000;box-shadow:inset 2px 2px 0 #aaa,inset -2px -2px 0 #4a4a4a;pointer-events:none}
#menu .help{font-size:12px;color:#ddd;text-align:center;line-height:1.8;text-shadow:1px 1px 0 #000;max-width:90vw;margin-top:6px}
#loading{position:fixed;inset:0;z-index:50;background:#2b1d0e url() repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:16px;text-shadow:2px 2px 0 #3f3f3f}
#loading .bar{width:min(300px,70vw);height:6px;background:#3a3a3a;border:2px solid #000}
#loading .bar i{display:block;height:100%;width:0;background:#80ff20}
#dead{position:fixed;inset:0;z-index:45;background:rgba(120,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#dead h2{font-size:42px;text-shadow:3px 3px 0 #3f3f3f;font-weight:normal;margin-bottom:10px}

/* 모바일 */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;width:56px;height:56px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
#touch .tb.on{background:rgba(255,255,255,.4)}
#touch .tb svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#joy{position:absolute;left:24px;bottom:calc(90px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.55)}
#tJump{right:28px;bottom:calc(100px + env(safe-area-inset-bottom))}
#tSneak{right:96px;bottom:calc(100px + env(safe-area-inset-bottom))}
#tInv{right:22px;top:20px}
#tPause{right:86px;top:20px}
#tDrop{right:150px;top:20px}
#invBtn{display:none}
.touch #invBtn{display:block;width:calc(20px * var(--s));height:calc(20px * var(--s));position:absolute;right:calc(-24px * var(--s));top:0;background:rgba(0,0,0,.42);outline:calc(1px * var(--s)) solid #000;box-shadow:inset 0 0 0 calc(1px * var(--s)) #8b8b8b;color:#fff;font-size:calc(10px * var(--s));line-height:calc(18px * var(--s));text-align:center;letter-spacing:-1px;pointer-events:auto}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="water" class="hide"></div>
<div id="hurt"></div>
<div id="hud" class="hide">
  <div id="cross"></div>
  <div id="debug" class="hide"></div>
  <div id="toast"></div>
  <div id="itemName"></div>
  <div id="bottom">
    <div id="air"></div>
    <div id="stats"><div class="row" id="hearts"></div><div class="row r" id="food"></div></div>
    <div id="hotbar"><div id="sel"></div><div id="invBtn">···</div></div>
  </div>
</div>
<div id="touch" class="hide">
  <div id="joy"><i></i></div>
  <div class="tb" id="tJump"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></div>
  <div class="tb" id="tSneak"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>

</div>

<div id="menu" class="title hide"></div>
<div id="dead" class="hide"><h2>죽었습니다!</h2><button class="mbtn" id="respawn">리스폰</button><a class="mbtn" href="hub.html">허브로 나가기</a></div>
<div id="loading"><div id="loadTxt">월드 만드는 중</div><div class="bar"><i id="loadBar"></i></div></div>

<script src="lib/three.r128.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"><\/script>')</script>
<script src="multiplayer.js" onerror="window.__mpFail=true"></script>
<script>
'use strict';
/* ═════════════ 기본 도구 ═════════════ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,z,s){let h=Math.imul(x|0,374761393)+Math.imul(z|0,668265263)+Math.imul(s|0,1442695041)|0;h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function hash3(x,y,z,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(z|0,2246822519)+Math.imul(s|0,1442695041)|0;h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296}
const sm=t=>t*t*(3-2*t);
function noise2(x,z,s){const xi=Math.floor(x),zi=Math.floor(z),xf=sm(x-xi),zf=sm(z-zi);
  return lerp(lerp(hash2(xi,zi,s),hash2(xi+1,zi,s),xf),lerp(hash2(xi,zi+1,s),hash2(xi+1,zi+1,s),xf),zf)*2-1}
function fbm2(x,z,s,o){let v=0,a=1,f=1,n=0;for(let i=0;i<o;i++){v+=noise2(x*f,z*f,s+i*131)*a;n+=a;a*=.5;f*=2.03}return v/n}
function noise3(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=sm(x-xi),yf=sm(y-yi),zf=sm(z-zi);
  const a=lerp(lerp(hash3(xi,yi,zi,s),hash3(xi+1,yi,zi,s),xf),lerp(hash3(xi,yi+1,zi,s),hash3(xi+1,yi+1,zi,s),xf),yf);
  const b=lerp(lerp(hash3(xi,yi,zi+1,s),hash3(xi+1,yi,zi+1,s),xf),lerp(hash3(xi,yi+1,zi+1,s),hash3(xi+1,yi+1,zi+1,s),xf),yf);
  return lerp(a,b,zf)*2-1}
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

/* ═════════════ 16×16 픽셀 텍스처 ═════════════ */
function paint(seed,fn){const c=cv(16,16),g=c.getContext('2d'),im=g.createImageData(16,16),r=mulberry(seed);
  const P={r,
    set(x,y,col,a=255){if(x<0||y<0||x>15||y>15)return;const c=typeof col==='string'?rgb(col):col,i=(y*16+x)*4;im.data[i]=c[0];im.data[i+1]=c[1];im.data[i+2]=c[2];im.data[i+3]=a},
    get(x,y){const i=(y*16+x)*4;return [im.data[i],im.data[i+1],im.data[i+2],im.data[i+3]]},
    pick(p){return p[Math.floor(r()*p.length)]},
    fill(p){for(let y=0;y<16;y++)for(let x=0;x<16;x++)P.set(x,y,P.pick(p))},
    shade(x,y,k){const c=P.get(x,y);P.set(x,y,[clamp(c[0]*k,0,255),clamp(c[1]*k,0,255),clamp(c[2]*k,0,255)],c[3])},
    clear(){for(let i=0;i<im.data.length;i++)im.data[i]=0}};
  fn(P);g.putImageData(im,0,0);return c}
const PAL={
  dirt:['#79553a','#866043','#866043','#96704f','#6c4b33','#5d4130'],
  grass:['#5e9d34','#6aa83d','#6aa83d','#73b446','#558f2d','#7cbf4d','#4d8429'],
  stone:['#7f7f7f','#878787','#878787','#747474','#919191','#6e6e6e'],
  sand:['#dfd7a6','#e6dfb4','#d6cd94','#dbd3a0','#ece5c0','#cfc68a'],
  leaves:['#3f8f22','#4aa02a','#357a1c','#5ab535','#2c6a16','#469a26'],
  plank:['#a3824f','#9c7b48','#ab8a55','#957444'],
  water:['#2f5bd8','#3463e0','#2a52c4','#3a6ae6','#2d58d2']};
const stoneBase=P=>{P.fill(PAL.stone);for(let k=0;k<7;k++){const x=Math.floor(P.r()*14),y=Math.floor(P.r()*16),l=2+Math.floor(P.r()*3);for(let i=0;i<l;i++)P.set(x+i,y,P.r()<.5?'#6a6a6a':'#646464')}};
const plankBase=P=>{for(let y=0;y<16;y++){const b=y>>2;for(let x=0;x<16;x++){let c=rgb(PAL.plank[(b+(P.r()<.25?1:0))%4]);const k=.94+P.r()*.1;P.set(x,y,[c[0]*k,c[1]*k,c[2]*k])}}

    else{arr[i]=cursor;cursor=st}}}
function gather(){if(!cursor||toolOf(cursor))return;const mx=maxStack(cursor.id);for(const c of ['c2','c3','chest','fur','inv']){const arr=arrOf(c);if(!arr||(c==='c2'&&screenOpen!=='inv')||(c==='c3'&&screenOpen!=='craft'))continue;
  for(let i=0;i<arr.length&&cursor.n<mx;i++){const s=arr[i];if(s&&s.id===cursor.id){const t=Math.min(mx-cursor.n,s.n);cursor.n+=t;s.n-=t;if(!s.n)arr[i]=null}}}}
let hoverSlot=null,touchHold=0;

$('screen').addEventListener('pointerover',e=>{const el=e.target.closest('.slot');hoverSlot=el;
  if(el&&drag&&cursor&&el.dataset.c!=='res'&&!(el.dataset.c==='fur'&&el.dataset.i==='2')){const k=[el.dataset.c,+el.dataset.i];if(!drag.slots.some(s=>s[0]===k[0]&&s[1]===k[1])){const st=arrOf(k[0])[k[1]];if(!st||same(st,cursor))drag.slots.push(k)}}
  const tip=$('tip');const st=el&&(el.dataset.c==='res'?craftOut():arrOf(el.dataset.c)[+el.dataset.i]);
  if(st&&!cursor){const t=toolOf(st);tip.innerHTML=ITEM[st.id].n+(t?`<small>내구도: ${t.dur-(st.d||0)} / ${t.dur}</small>`:'');tip.classList.remove('hide')}else tip.classList.add('hide')});
addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(!cursor){drawScreen();return}
  if(d.slots.length===1){clickSlot(d.slots[0][0],d.slots[0][1],d.btn,false)}
  else{const ok=d.slots.filter(([c,i])=>accepts(c,i,cursor));const per=d.btn===1?1:Math.floor(cursor.n/ok.length);if(per>0)for(const [c,i] of ok){if(!cursor)break;const arr=arrOf(c);const st=arr[i];const room=st?maxStack(st.id)-st.n:maxStack(cursor.id);const t=Math.min(per,room,cursor.n);if(t<=0)continue;if(st)st.n+=t;else arr[i]={id:cursor.id,n:t,d:cursor.d||0};cursor.n-=t;if(!cursor.n)cursor=null}}
  drawScreen()});

addEventListener('mousemove',e=>{if(document.pointerLockElement!==cvs)return;player.yaw-=e.movementX*.0023*sens;player.pitch=clamp(player.pitch-e.movementY*.0023*sens,-1.565,1.565)});

  if(menuOpen||!started)return;

  if(e.code==='Space'||e.code==='Tab')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseL=mouseR=false});
function dropHeld(all){const st=inv[sel];if(!st)return;if(all||st.n===1){throwItem(st);inv[sel]=null}else{throwItem({id:st.id,n:1,d:st.d});st.n--}renderHotbar()}

/* 터치 */
if(isTouch){document.body.classList.add('touch');
  const jb=$('joy'),ji=jb.querySelector('i');let jid=null;

  addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===jid)jmove(t)},{passive:true});
  addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===jid){jid=null;joy.x=joy.y=0;ji.style.transform=''}});
  const hold=(id,on,off)=>{const el=$(id);el.addEventListener('touchstart',e=>{e.preventDefault();ac();on();el.classList.add('on')},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();off&&off();if(off)el.classList.remove('on')},{passive:false})};
  hold('tJump',()=>tJump=true,()=>tJump=false);

  hold('tInv',()=>{screenOpen?closeScreen():openScreen('inv')},()=>{});hold('tPause',()=>showMenu('pause'),()=>{});hold('tDrop',()=>dropHeld(false),()=>{});

const SPLASH=['16×16 픽셀!','곡괭이를 챙기세요!','다이아몬드는 아래에!','좀비 조심!','100% 손으로 만듦!','나무를 때려요!','밤에는 집으로!'];
function slider(id,label,min,max,val,fmt){return `<div class="mslider"><input type="range" id="${id}" min="${min}" max="${max}" value="${val}" step="1"><i style="left:calc(${(val-min)/(max-min)*100}% - ${(val-min)/(max-min)*16}px)"></i><span>${label}: ${fmt(val)}</span></div>`}

function showMenu(type){menuOpen=type;const M=$('menu');M.classList.remove('hide');M.classList.toggle('title',type==='title');mouseL=mouseR=false;if(document.pointerLockElement)document.exitPointerLock();

    ${slider('mRD','렌더 거리',2,10,RD,v=>v+'청크')}${slider('mSens','마우스 감도',10,200,Math.round(sens*100),v=>v+'%')}

  if($('mRD'))bindSlider('mRD','렌더 거리',2,10,v=>v+'청크',v=>{RD=v;try{localStorage.setItem(SKEY+'_rd',v)}catch(e){}});
  if($('mSens'))bindSlider('mSens','마우스 감도',10,200,v=>v+'%',v=>{sens=v/100;try{localStorage.setItem(SKEY+'_sens',v)}catch(e){}});

/* ═════════════ 저장 ═════════════ */
const SKEY='blockcraft_v1';let hadSave=false;
function save(){if(!started)return;try{const p=player;localStorage.setItem(SKEY,JSON.stringify({v:1,seed:SEED,edits,tiles:[...tiles],saplings,time:worldTime,inv,sel,
  pl:{pos:[p.pos.x,p.pos.y,p.pos.z],yaw:p.yaw,pitch:p.pitch,hp:p.hp,food:p.food,sat:p.sat,spawn:p.spawn,dead:p.dead}}))}catch(e){toast('저장 공간이 부족해요')}}
function load(){try{const d=JSON.parse(localStorage.getItem(SKEY));if(!d||!d.seed)return false;SEED=d.seed;edits=d.edits||{};(d.tiles||[]).forEach(([k,v])=>tiles.set(k,v));saplings=d.saplings||[];worldTime=d.time||0;
  (d.inv||[]).forEach((s,i)=>inv[i]=s);sel=d.sel||0;const q=d.pl;player.pos.set(q.pos[0],q.pos[1],q.pos[2]);player.yaw=q.yaw;player.pitch=q.pitch;player.hp=q.hp;player.food=q.food;player.sat=q.sat;player.spawn=q.spawn;
  if(q.dead){player.hp=20;player.food=20;player.pos.set(q.spawn.x,q.spawn.y,q.spawn.z)}return true}catch(e){return false}}

/* ═════════════ 시작 · 메인 루프 ═════════════ */
try{const rd=+localStorage.getItem(SKEY+'_rd');if(rd>=2&&rd<=10)RD=rd;const sv=+localStorage.getItem(SKEY+'_sens');if(sv)sens=sv/100}catch(e){}

if(!hadSave){SEED=+(localStorage.getItem(SKEY+'_seed')||0)||Math.floor(Math.random()*1e9);
  let sx=0,sz=0;for(let k=0;k<400;k++){const a=k*2.4,r=k*6;const x=Math.round(Math.cos(a)*r),z=Math.round(Math.sin(a)*r);const h=terrainH(x,z);if(h>SEA+2&&h<SEA+22&&hash2(x,z,SEED+99)>=forestAt(x,z)){sx=x;sz=z;break}}
  player.pos.set(sx+.5,terrainH(sx,sz)+1.01,sz+.5);player.spawn=null}
let loadDone=false,spawnFix=!hadSave;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=handCam.aspect=w/h;camera.updateProjectionMatrix();handCam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now(),statT=0,saveT=0,slowT=0,fps=0,fpsN=0,fpsT=0;
const eul=new THREE.Euler(0,0,0,'YXZ');

  if(!loadDone){chunkTick(40);const pcx=Math.floor(player.pos.x/16),pcz=Math.floor(player.pos.z/16);let tot=0,ok=0;

    if(ok===tot){loadDone=true;
      if(spawnFix){const x0=Math.floor(player.pos.x),z0=Math.floor(player.pos.z);let done=false;for(let r=0;r<30&&!done;r++)for(let dz=-r;dz<=r&&!done;dz++)for(let dx=-r;dx<=r&&!done;dx++){if(Math.max(Math.abs(dx),Math.abs(dz))!==r)continue;const x=x0+dx,z=z0+dz;for(let y=H-2;y>0;y--){const id=getB(x,y,z);if(SOLID[id]){if((id===GRASS||id===SAND)&&!SOLID[getB(x,y+1,z)]&&!SOLID[getB(x,y+2,z)]){player.pos.set(x+.5,y+1.01,z+.5);done=true}break}}}player.spawn={x:player.pos.x,y:player.pos.y,z:player.pos.z};
        for(let i=0;i<4;i++){const a=Math.random()*6.28,x2=Math.floor(player.pos.x+Math.cos(a)*12),z2=Math.floor(player.pos.z+Math.sin(a)*12);for(let y=H-2;y>0;y--){const id=getB(x2,y,z2);if(SOLID[id]){if(id===GRASS)spawnMob('pig',x2+.5,y+1,z2+.5);break}}}}

    camera.position.set(player.pos.x,player.pos.y+eyeH(),player.pos.z);updateSky(dt);renderer.clear();renderer.render(scene,camera);return}

  const p=player;camKick=Math.max(0,camKick-dt);

  camera.position.set(p.pos.x+Math.cos(p.yaw)*bobA,p.pos.y+eyeH()+bobB,p.pos.z-Math.sin(p.yaw)*bobA);
  eul.set(p.pitch,p.yaw,camKick*.25*(p.dead?0:1));if(p.dead)eul.z=.6;camera.quaternion.setFromEuler(eul);
  const fov=70*(p.sprint?1.13:1)*(underWater?.9:1);if(Math.abs(camera.fov-fov)>.05){camera.fov+=(fov-camera.fov)*Math.min(1,dt*10);camera.updateProjectionMatrix()}

  chunkTick(started?7:20);updateSky(dt);updateHand(dt);
  $('water').classList.toggle('hide',!underWater);
  renderer.clear();renderer.render(scene,camera);if(started&&!p.dead){renderer.clearDepth();renderer.render(handScene,handCam)}

    if(showDebug){const l=lightAt(p.pos.x,p.pos.y+1,p.pos.z);$('debug').textContent=`블록크래프트  ${fps} fps\nXYZ: ${p.pos.x.toFixed(2)} / ${p.pos.y.toFixed(2)} / ${p.pos.z.toFixed(2)}\n청크: ${Math.floor(p.pos.x/16)}, ${Math.floor(p.pos.z/16)}  (로드 ${chunks.size})\n빛: 하늘 ${l[0]} · 블록 ${l[1]}\n시간: ${Math.floor((worldTime%DAYLEN)/DAYLEN*24000)}  몹 ${mobs.length}  아이템 ${ents.length}\n시드: ${SEED}`}}
  saveT+=dt;if(saveT>30){saveT=0;save()}}
requestAnimationFrame(frame);
window.__mpOn=false;try{if(!window.__mpFail&&typeof firebase!=='undefined'&&window.MP&&MP.isConfigured&&MP.isConfigured()){MP.initAuthOnly(u=>{if(u){window.__mpOn=true;if(started)try{MP.setPresence('craft',null)}catch(e){}}})}}catch(e){}
window.__BC={player,inv,chunks,getB,setBlock,openScreen,closeScreen,spawnMob,mobs,ents,addItem,matchCraft,tiles,craft2,craft3,get cursor(){return cursor},clickSlot,drawScreen,renderHotbar,startGame,hideMenu};
