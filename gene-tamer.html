<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>진 테이머 — Gene Tamer</title>
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --acc:#4ff0c8; --acc2:#ff5fa8; --y:#ffc629; --red:#ff4b3a; --ink:#f2f4f0; --mute:#8d978f;
  --plate:rgba(10,14,16,.84); --plate2:rgba(18,24,27,.94); --line:rgba(255,255,255,.14);
  --disp:"Black Han Sans","Rajdhani",Inter,system-ui,sans-serif;
  --num:"Rajdhani",Inter,system-ui,sans-serif;
  --cut:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
  --c-common:#a9b1b6; --c-rare:#4c9dff; --c-epic:#b06bff; --c-legendary:#ffb52e; --c-mythic:#ff5fa8; --c-halloween:#ff8a1f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071014;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#view{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font-family:inherit}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;font:700 12px/1 var(--num);color:#111;
  background:#f2f4f0;border-bottom:3px solid #9aa09c;border-radius:3px}
.hide{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#res{position:absolute;left:16px;top:14px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 200px)}
.res{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 8px;background:var(--plate);clip-path:var(--cut)}
.res b{font:700 19px/1 var(--num);font-variant-numeric:tabular-nums}
.ico{display:inline-block;width:18px;height:18px;flex:none}
.ico.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1a0,#e0a01a 70%);box-shadow:inset 0 -2px 0 #9a6a06}
.ico.stone{background:#8e969a;clip-path:polygon(20% 0,80% 8%,100% 55%,70% 100%,15% 90%,0 40%)}
.ico.copper{background:linear-gradient(135deg,#ffb48a,#c8612e);clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%)}
.ico.iron{background:linear-gradient(135deg,#e8eef2,#7c8a94);clip-path:polygon(0 25%,50% 0,100% 25%,100% 75%,50% 100%,0 75%)}
#area{position:absolute;right:16px;top:14px;text-align:right}
#area-name{font-family:var(--disp);font-size:24px;line-height:1}
#area-sub{margin-top:4px;font:700 13px/1 var(--num);letter-spacing:.06em;color:var(--acc)}
#top-btns{position:absolute;right:16px;top:62px;display:flex;gap:4px;pointer-events:auto}
.tbtn{height:32px;padding:0 10px 0 5px;display:flex;align-items:center;gap:6px;border:none;background:var(--plate);color:#e8ece8;font-size:12px;font-weight:900;cursor:pointer;clip-path:var(--cut)}
.tbtn:hover{background:rgba(40,52,56,.92)}
.tbtn kbd{height:20px;min-width:20px;font-size:11px;border-bottom-width:2px}
body.mobile .tbtn kbd{display:none}
body.mobile .tbtn{padding-left:10px}

#party{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:4px}
.pcard{display:flex;align-items:center;gap:9px;width:236px;padding:5px 10px 5px 5px;background:var(--plate);clip-path:var(--cut);border-left:3px solid var(--c-common)}
.pcard img{width:42px;height:42px;background:rgba(255,255,255,.05)}
.pcard .pc-mid{flex:1;min-width:0}
.pcard .pc-top{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:900}
.pcard .pc-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pc-lv{font:700 13px/1 var(--num);color:var(--mute)}
.pcard .pc-bar{margin-top:5px;height:7px;background:rgba(0,0,0,.55);overflow:hidden}
.pcard .pc-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3ad07a,#8cf05a);transition:width .15s}
.pcard.low .pc-bar i{background:linear-gradient(90deg,#ff4b3a,#ff8a3c)}
.pcard.down{opacity:.45}
.pcard .pc-role{font:700 11px/1 var(--num);letter-spacing:.06em;margin-top:4px;color:var(--mute)}
#me-hp{position:absolute;left:16px;bottom:calc(16px + var(--party-h,0px));}

#skills{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;pointer-events:auto}
.skill{position:relative;width:64px;height:64px;border:none;background:var(--plate);color:#fff;cursor:pointer;clip-path:var(--cut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden}
.skill b{font-size:11px;font-weight:900}
.skill kbd{height:18px;min-width:18px;font-size:10px;border-bottom-width:2px}
.skill .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.72)}
.skill .cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 22px/1 var(--num)}
.skill.ready{box-shadow:inset 0 -3px 0 var(--acc)}
body.mobile .skill kbd{display:none}

#prompt{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:7px 14px 7px 8px;background:var(--plate);border-left:3px solid var(--acc);pointer-events:auto;cursor:pointer}
#prompt.show{display:flex}
#prompt span{font-size:14px;font-weight:900}
body.mobile #prompt kbd{display:none}
#room{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:none;padding:6px 16px;background:var(--plate);clip-path:var(--cut);text-align:center}
#room.show{display:block}
#room b{font-family:var(--disp);font-size:20px;font-weight:400}
#room small{display:block;margin-top:3px;font:700 12px/1 var(--num);letter-spacing:.06em;color:var(--acc)}
#bossbar{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:min(520px,calc(100% - 40px));display:none;text-align:center}
#bossbar.show{display:block}
#bossbar .bn{font-family:var(--disp);font-size:20px;color:#ffd0a0}
#bossbar .bb{margin-top:5px;height:12px;background:rgba(0,0,0,.6);box-shadow:0 0 0 1px rgba(255,255,255,.2)}
#bossbar .bb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4b3a,#ff9a3c);transition:width .15s}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:34px;text-align:center;opacity:0;transition:opacity .25s;text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 24px rgba(0,0,0,.6)}
#toast.show{opacity:1}
#toast small{display:block;margin-top:6px;font:800 13px/1.3 Inter,sans-serif;color:#dfe6df}
#feed{position:absolute;right:16px;bottom:96px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.fd{padding:4px 10px;background:var(--plate);font-size:12px;font-weight:800;border-right:3px solid var(--acc);animation:fdIn .2s ease-out}
.fd.gone{opacity:0;transition:opacity .4s}
@keyframes fdIn{from{opacity:0;transform:translateX(12px)}}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.dn{position:absolute;left:0;top:0;font:700 18px/1 var(--num);text-shadow:0 2px 3px rgba(0,0,0,.9);will-change:transform,opacity;white-space:nowrap}
.dn.big{font-size:26px}

/* ---------- 모바일 조작 ---------- */
#touch{display:none}
body.mobile #touch{display:block}
#joy{position:fixed;left:24px;bottom:150px;width:120px;height:120px;border-radius:50%;background:rgba(10,14,16,.45);border:2px solid rgba(255,255,255,.18);z-index:6;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(79,240,200,.7)}
#t-act{position:fixed;right:24px;bottom:96px;width:70px;height:70px;border-radius:50%;border:2px solid rgba(79,240,200,.6);background:rgba(10,40,36,.75);color:#fff;font-weight:900;font-size:13px;z-index:6}
body.mobile #party{bottom:auto;top:56px;transform:scale(.72);transform-origin:top left}
body.mobile #joy{bottom:24px;left:18px}
@media (max-height:430px){ body.mobile #party .pcard:not(:first-child) .pc-role{display:none} }
body.mobile #prompt{bottom:200px}

/* ---------- 패널 공통 ---------- */
.panel{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(3,6,7,.78);pointer-events:auto}
.panel.show{display:flex}
.pbox{width:min(980px,calc(100% - 20px));max-height:calc(100% - 20px);display:flex;flex-direction:column;background:var(--plate2);border-top:3px solid var(--acc);clip-path:var(--cut)}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.phead h2{margin:0;flex:1;font-family:var(--disp);font-weight:400;font-size:28px;line-height:1}
.phead .x{width:38px;height:38px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer}
.tabs{display:flex;gap:2px;padding:0 16px}
.tab{padding:9px 14px;border:none;background:rgba(255,255,255,.05);color:#b9c2bb;font-size:13px;font-weight:900;cursor:pointer}
.tab.on{background:var(--acc);color:#062019}
.pbody{padding:14px 16px 16px;overflow-y:auto;min-height:0}
.btn{height:42px;padding:0 16px;border:none;font-size:13px;font-weight:900;cursor:pointer;clip-path:var(--cut);background:var(--acc);color:#062019}
.btn:disabled{background:rgba(255,255,255,.08);color:#6f7a72;cursor:default}
.btn.alt{background:rgba(255,255,255,.1);color:#e8ece8}
.btn.warn{background:#3a1814;color:#ffb3a8}
.cost{display:inline-flex;align-items:center;gap:4px;font:700 14px/1 var(--num)}
.cost .ico{width:14px;height:14px}
.cost.no{color:#ff7a6a}

/* 알 상점 */
.eggs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.egg{position:relative;padding:12px;background:rgba(255,255,255,.04);border-left:3px solid var(--rc);display:flex;flex-direction:column;gap:8px}
.egg .eg-top{display:flex;align-items:center;gap:12px}
.egg img{width:72px;height:72px}
.egg .eg-n{font-family:var(--disp);font-size:20px;color:var(--rc)}
.egg .eg-d{font-size:11.5px;color:#b9c2bb;line-height:1.45}
.egg .eg-odds{font:700 12px/1.3 var(--num);color:var(--mute);letter-spacing:.02em}
.egg .limit{position:absolute;right:8px;top:8px;padding:3px 6px;background:var(--c-halloween);color:#1a0a00;font:700 11px/1 var(--num);letter-spacing:.04em}
.egg .buyrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.egg.locked{opacity:.55}

/* 펫 카드 목록 */
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pet{position:relative;padding:8px;background:rgba(255,255,255,.04);border-left:3px solid var(--rc);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pet:hover{background:rgba(255,255,255,.08)}
.pet.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.pet.inparty::after{content:"파티";position:absolute;right:6px;top:6px;padding:2px 5px;background:var(--acc);color:#062019;font-size:10px;font-weight:900}
.pet.picked::before{content:attr(data-pick);position:absolute;left:6px;top:6px;width:20px;height:20px;background:var(--acc2);color:#fff;font:700 13px/20px var(--num);text-align:center}
.pet img{width:100%;aspect-ratio:1/1;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%)}
.pet .pn{font-size:13px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pet .pt{font:700 12px/1.2 var(--num);color:var(--rc);letter-spacing:.03em}
.pet .ptr{font-size:10.5px;color:#b9c2bb;min-height:14px}
.mut{color:var(--acc2);font-weight:900}

/* 상세 */
.detail{display:grid;grid-template-columns:260px 1fr;gap:14px}
.detail img{width:100%;aspect-ratio:1/1;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 70%)}
.dname{display:flex;gap:6px;align-items:center}
.dname input{flex:1;min-width:0;height:36px;padding:0 10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font-size:15px;font-weight:800;font-family:inherit}
.genes{margin-top:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.gene{padding:7px 9px;background:rgba(255,255,255,.04)}
.gene span{display:block;font-size:10px;font-weight:800;color:var(--mute)}
.gene b{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px}
.sw{display:inline-block;width:14px;height:14px;border:1px solid rgba(255,255,255,.4)}
.stats{margin-top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stat{padding:7px 9px;background:rgba(255,255,255,.04)}
.stat span{display:block;font-size:10px;font-weight:800;color:var(--mute)}
.stat b{font:700 20px/1.1 var(--num)}
.traits{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.trait{padding:7px 9px;background:rgba(255,255,255,.04);border-left:3px solid var(--tc,#4ff0c8);font-size:12px}
.trait b{margin-right:6px}
.trait small{color:#b9c2bb}
.lineage{margin-top:8px;font-size:11px;color:var(--mute)}
.dact{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:640px){ .detail{grid-template-columns:1fr} .detail img{max-width:200px;margin:0 auto} }

/* 교배 */
.breed{display:grid;grid-template-columns:1fr 150px 1fr;gap:10px;align-items:stretch}
.slot{min-height:210px;padding:10px;background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--rc)}
.slot img{width:120px;height:120px}
.slot .sn{font-size:14px;font-weight:900}
.slot .st{font:700 12px/1.2 var(--num);color:var(--rc)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.mid .plus{font-family:var(--disp);font-size:40px;color:var(--acc2)}
.odds{font-size:11.5px;line-height:1.55;color:#cfd6d0;text-align:left;padding:10px;background:rgba(0,0,0,.25)}
.odds b{color:#fff}
.hint{font-size:12px;color:var(--mute);margin:10px 0 6px}
@media (max-width:640px){ .breed{grid-template-columns:1fr 1fr} .mid{grid-column:1/-1;order:3} }

/* 업그레이드 */
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.up{padding:12px;background:rgba(255,255,255,.04);border-left:3px solid var(--acc);display:flex;flex-direction:column;gap:6px}
.up .un{display:flex;justify-content:space-between;font-size:15px;font-weight:900}
.up .un b{font:700 16px/1 var(--num);color:var(--acc)}
.up .ud{font-size:11.5px;color:#b9c2bb}
.up .ucost{display:flex;gap:10px;flex-wrap:wrap}

/* 부화 연출 */
#hatch{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(20,30,34,.9),rgba(2,4,5,.97) 70%);pointer-events:auto}
#hatch.show{display:flex}
#hatch canvas{width:min(380px,80vw);height:min(380px,80vw)}
#hatch .hflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#hatch .hflash.go{animation:hflash .9s ease-out}
@keyframes hflash{0%{opacity:0}10%{opacity:.95}100%{opacity:0}}
#h-title{font-family:var(--disp);font-size:clamp(28px,6vw,44px);min-height:1.1em;text-align:center}
#h-sub{margin-top:6px;font:700 15px/1.3 var(--num);letter-spacing:.05em;color:var(--mute);text-align:center;min-height:1.3em}
#h-traits{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:28px}
#h-traits span{padding:5px 9px;background:rgba(255,255,255,.07);font-size:12px;font-weight:800}
#h-ok{margin-top:18px;min-width:180px;opacity:0;pointer-events:none;transition:opacity .3s}
#h-ok.on{opacity:1;pointer-events:auto}

/* 결과 */
#result .pbox{width:min(560px,calc(100% - 20px))}
#r-title{font-family:var(--disp);font-size:52px;line-height:1}
.loot{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}
.loot div{padding:10px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:5px}
.loot span{font-size:10px;font-weight:800;color:var(--mute)}
.loot b{display:flex;align-items:center;gap:6px;font:700 22px/1 var(--num)}

/* 시작 화면 */
#title{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:center;padding-left:clamp(20px,7vw,100px);
  background:linear-gradient(90deg,rgba(4,10,12,.94),rgba(4,10,12,.7) 40%,rgba(4,10,12,.1) 75%);pointer-events:auto}
#title .k{display:flex;align-items:center;gap:8px;font:700 13px/1 var(--num);letter-spacing:.3em;color:var(--acc)}
#title .k b{padding:3px 6px;background:var(--acc);color:#062019;letter-spacing:0}
#title h1{margin:10px 0 0;font-family:var(--disp);font-weight:400;font-size:clamp(52px,9vw,96px);line-height:.86}
#title h1 span{display:block;color:var(--acc)}
#title p{max-width:420px;margin:16px 0 0;font-size:14px;line-height:1.6;color:#c9d2cb}
#title .tb{display:flex;gap:8px;margin-top:22px}
#title .btn{height:52px;padding:0 26px;font-size:16px}
#title .keys{position:absolute;right:22px;bottom:22px;display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
#title .keys span{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#d9e0da}
#title .back{position:absolute;left:22px;top:18px;color:#b9c2bb;font-size:12px;font-weight:800;text-decoration:none}
body.mobile #title .keys{display:none}
body:not(.playing) #hud,body:not(.playing) #touch{visibility:hidden}
#err{position:fixed;inset:auto 10px 10px 10px;z-index:99;display:none;padding:12px;background:#3a0f0c;color:#ffd0c8;font:12px/1.4 monospace;white-space:pre-wrap;max-height:40vh;overflow:auto}
#err.show{display:block}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="dmg"></div>

<div id="hud">
  <div id="res"></div>
  <div id="area"><div id="area-name">허브 섬</div><div id="area-sub">GENE TAMER</div></div>
  <div id="top-btns">
    <button class="tbtn" id="b-bag" type="button"><kbd>B</kbd>펫 가방</button>
  </div>
  <div id="room"><b id="room-t"></b><small id="room-s"></small></div>
  <div id="bossbar"><div class="bn" id="boss-n"></div><div class="bb"><i id="boss-f"></i></div></div>
  <div id="party"></div>
  <div id="skills">
    <button class="skill" id="sk-cheer" type="button"><b>응원</b><kbd>Q</kbd><span class="cd"></span><span class="cdn"></span></button>
    <button class="skill" id="sk-potion" type="button"><b>포션</b><kbd>F</kbd><span class="cd"></span><span class="cdn"></span></button>
  </div>
  <div id="prompt"><kbd>E</kbd><span id="prompt-t"></span></div>
  <div id="feed"></div>
  <div id="toast"></div>
</div>

<div id="touch">
  <div id="joy"><i></i></div>
  <button id="t-act" type="button">상호작용</button>
</div>

<div class="panel" id="p-shop"><div class="pbox">
  <div class="phead"><h2>알 상점</h2><button class="x" data-close type="button">✕</button></div>
  <div class="pbody"><div class="eggs" id="shop-eggs"></div></div>
</div></div>

<div class="panel" id="p-lab"><div class="pbox">
  <div class="phead"><h2>유전자 연구소</h2><button class="x" data-close type="button">✕</button></div>
  <div class="tabs"><button class="tab on" data-tab="breed" type="button">교배</button><button class="tab" data-tab="up" type="button">업그레이드</button></div>
  <div class="pbody" id="lab-body"></div>
</div></div>

<div class="panel" id="p-bag"><div class="pbox">

function newGenes(eggTier){
  const E=EGGS[eggTier];
  const species=pick(E.species);
  const sp=SPECIES[species];
  const g={ species, hue:(sp.hue+rand(-.12,.12)+1)%1, sat:rand(.45,.8), light:rand(.45,.6),
    pattern:"none", phue:Math.random(), size:rand(.85,1.15), traits:[], glow:false, rainbow:false, giant:false };
  if (species==="pumpkin"){ g.hue=rand(.045,.095); g.sat=rand(.8,.95); g.light=rand(.48,.56); }
  if (Math.random()<E.pattern){
    const pool=["stripes","spots","stars","flames"];
    g.pattern = eggTier==="halloween" && Math.random()<.7 ? "haunted" : pick(pool);
  }
  const rollTrait=()=>{
    const r=Math.random();
    let tier = r<E.t3 ? 3 : r<E.t3+E.t2 ? 2 : 1;
    let pool=Object.keys(TRAITS).filter(k=>TRAITS[k].tier===tier && !TRAITS[k].limited && !g.traits.includes(k));
    if (eggTier==="halloween" && !g.traits.includes("fear") && Math.random()<.5) pool=["fear"];
    if (pool.length) g.traits.push(pick(pool));
  };
  if (Math.random()<E.traits[0]) rollTrait();
  if (Math.random()<E.traits[1]) rollTrait();
  if (eggTier==="mythic") g.rainbow=true;
  if (Math.random()<E.mut && eggTier!=="mythic") mutate(g);
  return g;
}
// 돌연변이 — 부모에게 없는 형질 하나가 튀어나온다
function mutate(g){
  const r=Math.random();
  if (r<.3) g.rainbow=true;
  else if (r<.55) g.glow=true;
  else if (r<.75){ g.giant=true; g.size=rand(1.7,2.0); }
  else {
    const pool=Object.keys(TRAITS).filter(k=>TRAITS[k].tier>=2 && !TRAITS[k].limited && !g.traits.includes(k));
    if (pool.length){ if (g.traits.length>=2) g.traits.pop(); g.traits.push(pick(pool)); }
    else g.glow=true;
  }
  g.mutated=true;
  return g;
}
const NAME_A=["말랑","보송","반짝","꼬마","용감한","졸린","번개","달빛","초코","솜사탕","철벽","불꽃","얼음","숲속","행운"];
function makePet(genes, tier, extra){

    iv:+rand(...EGGS[tier==="halloween"?"halloween":tier].iv).toFixed(3), level:1, xp:0, gen:1, parents:null, born:Date.now() }, extra||{});
  return p;
}

}

      const g=newGenes("common"); g.species=sp; g.hue=(SPECIES[sp].hue+rand(-.08,.08)+1)%1;
      const p=makePet(g,"common"); S.pets.push(p); S.party.push(p.id); dexAdd(p);

}

function dexAdd(p){ S.dex["s:"+p.genes.species]=1; S.dex["p:"+p.genes.pattern]=1; p.genes.traits.forEach(t=>S.dex["t:"+t]=1); }
const petById=id=>S.pets.find(p=>p.id===id);
const capacity=()=>20+S.up.cap*10;

function petStats(p){
  const sp=SPECIES[p.genes.species], tm=TIER[p.tier].mult, lv=1+(p.level-1)*.12;
  const sz=p.genes.size;
  const hp=Math.round(sp.hp*p.iv*tm*lv*(.6+.4*sz));
  const atk=Math.round(sp.atk*p.iv*tm*lv*(.85+.15*sz));
  const spd=+(sp.spd*(1.2-.2*sz)).toFixed(2);
  let cd=sp.cd; if (p.genes.traits.includes("swift")) cd/=1.3;
  return { hp, atk, spd, cd, range:sp.range*(p.genes.giant?1.15:1), role:sp.role };
}
const power=p=>{ const s=petStats(p); return Math.round(s.hp*.25+s.atk*3/s.cd); };

const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({ color:c, roughness:.8, metalness:.05 },o||{}));
function mesh(geo,m,x,y,z,parent){ const o=new THREE.Mesh(geo,m); o.position.set(x||0,y||0,z||0); o.castShadow=true; o.receiveShadow=true; if (parent) parent.add(o); return o; }

// ── 무늬 텍스처 ──
const patCache={};
function patternTexture(pattern, baseHex, patHex){
  const key=pattern+baseHex+patHex; if (patCache[key]) return patCache[key];
  const c=document.createElement("canvas"); c.width=c.height=128; const g=c.getContext("2d");
  g.fillStyle=baseHex; g.fillRect(0,0,128,128); g.fillStyle=patHex; g.strokeStyle=patHex;
  if (pattern==="stripes"){ for (let i=-2;i<10;i++){ g.beginPath(); g.moveTo(i*18,0); g.lineTo(i*18+30,128); g.lineTo(i*18+38,128); g.lineTo(i*18+8,0); g.fill(); } }
  else if (pattern==="spots"){ for (let i=0;i<14;i++){ g.beginPath(); g.arc(Math.random()*128,Math.random()*128,5+Math.random()*9,0,7); g.fill(); } }
  else if (pattern==="stars"){ for (let i=0;i<10;i++){ const x=Math.random()*128,y=Math.random()*128,r=6+Math.random()*6; g.beginPath();
      for (let k=0;k<10;k++){ const a=k/10*Math.PI*2-Math.PI/2, rr=k%2?r*.45:r; g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } g.fill(); } }
  else if (pattern==="flames"){ for (let i=0;i<7;i++){ const x=i*20+Math.random()*6; g.beginPath(); g.moveTo(x,128); g.quadraticCurveTo(x+14,70,x+6,20+Math.random()*30); g.quadraticCurveTo(x+22,70,x+18,128); g.fill(); } }
  else if (pattern==="haunted"){ g.globalAlpha=.9; for (let i=0;i<4;i++){ const x=16+(i%2)*64+Math.random()*10, y=16+Math.floor(i/2)*64;
      g.beginPath(); g.moveTo(x,y+10); g.lineTo(x+10,y); g.lineTo(x+18,y+12); g.fill(); g.beginPath(); g.moveTo(x+26,y+12); g.lineTo(x+34,y); g.lineTo(x+44,y+10); g.fill();
      g.beginPath(); g.moveTo(x+4,y+26); g.lineTo(x+14,y+34); g.lineTo(x+22,y+26); g.lineTo(x+30,y+34); g.lineTo(x+40,y+26); g.lineTo(x+22,y+44); g.fill(); } }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  patCache[key]=t; return t;
}
function petColors(g){
  const base=new THREE.Color().setHSL(g.hue,g.sat,g.light);
  const pat=new THREE.Color().setHSL(g.pattern==="haunted"?.12:g.phue, .8, g.light>.5?.22:.78);
  if (g.pattern==="haunted") pat.setHSL(.13,1,.55);

}

// ── 펫 3D 모델 — 유전자에서 바로 만들어진다 ──
function buildPet(g){
  const root=new THREE.Group(), body=new THREE.Group(); root.add(body);
  const { base, pat }=petColors(g);
  const map=g.pattern!=="none"?patternTexture(g.pattern,colorCss(base),colorCss(pat)):null;
  const skin=new THREE.MeshStandardMaterial({ color:map?0xffffff:base, map, roughness:g.species==="slime"?.25:.7, metalness:.05,
    emissive:g.glow?base.clone():new THREE.Color(0), emissiveIntensity:g.glow?.55:0, transparent:g.species==="slime", opacity:g.species==="slime"?.9:1 });
  const dark=mat(0x1a1a22,{ roughness:.4 }), white=mat(0xffffff,{ roughness:.3 });

  if (g.species==="slime"){

    eyes(.5,.4,.16,.07);
    mesh(new THREE.TorusGeometry(.06,.02,6,12,Math.PI),dark,0,.36,.46,body).rotation.z=Math.PI;
  } else if (g.species==="fox"){
    mesh(new THREE.CapsuleGeometry(.24,.5,6,12),skin,0,.48,0,body).rotation.x=Math.PI/2;
    const head=new THREE.Group(); head.position.set(0,.78,.38); body.add(head); parts.head=head;
    mesh(new THREE.SphereGeometry(.26,16,12),skin,0,0,0,head);
    mesh(new THREE.ConeGeometry(.1,.2,8),skin,0,-.05,.28,head).rotation.x=Math.PI/2;
    mesh(new THREE.SphereGeometry(.035,8,6),dark,0,-.04,.39,head);
    for (const sx of [-1,1]) mesh(new THREE.ConeGeometry(.09,.24,6),skin,sx*.13,.25,0,head);
    for (const sx of [-1,1]){ mesh(new THREE.SphereGeometry(.045,8,6),dark,sx*.1,.06,.21,head); }
    const tail=mesh(new THREE.ConeGeometry(.13,.55,10),skin,0,.62,-.5,body); tail.rotation.x=-2.2; parts.tail=tail;
    for (const [x,z] of [[-.13,.22],[.13,.22],[-.13,-.22],[.13,-.22]]){ const l=mesh(new THREE.CylinderGeometry(.05,.05,.32,8),skin,x,.16,z,body); parts.legs.push(l); }

    const head=mesh(new THREE.BoxGeometry(.4,.34,.36),skin,0,1.2,.02,body); parts.head=head;
    for (const sx of [-1,1]) mesh(new THREE.BoxGeometry(.08,.06,.02),eyeGlow,sx*.1,1.23,.2,body);
    for (const sx of [-1,1]){ const a=mesh(new THREE.BoxGeometry(.2,.62,.22),skin,sx*.48,.6,0,body); parts.legs.push(a); }
    for (const sx of [-1,1]) mesh(new THREE.BoxGeometry(.22,.4,.26),skin,sx*.18,.2,0,body);

// 숲 던전: 방 5개가 통로로 이어진다. 방을 다 정리해야 다음 문이 열린다.
const DROOMS=[{x:0,z:0,r:12},{x:0,z:-34,r:13},{x:0,z:-70,r:14},{x:0,z:-108,r:15},{x:0,z:-150,r:19}];
function buildDungeon(){
  if (world.dungeon){ scene.remove(world.dungeon); }
  world.ores=world.ores.filter(o=>o.area==="hub");
  const D=new THREE.Group(); world.dungeon=D; scene.add(D);
  const floorM=mat(0x3a6a34), pathM=mat(0x6a5a3a);
  DROOMS.forEach((r,i)=>{
    mesh(new THREE.CylinderGeometry(r.r,r.r,.4,40),floorM,r.x,-.2,r.z,D);
    for (let k=0;k<Math.round(r.r*1.8);k++){ const a=k/(r.r*1.8)*Math.PI*2;
      const tx=r.x+Math.cos(a)*(r.r+1.6), tz=r.z+Math.sin(a)*(r.r+1.6);
      if (Math.abs(tx-r.x)<3.5) continue;   // 통로 자리는 비워둔다
      tree(D,tx,tz,1+Math.random()*.6); }
    if (i<DROOMS.length-1){
      const n=DROOMS[i+1], len=(r.z-r.r)-(n.z+n.r);
      mesh(new THREE.BoxGeometry(6,.36,len+2),pathM,0,-.2,(r.z-r.r+n.z+n.r)/2,D);
      for (let z=n.z+n.r; z<r.z-r.r; z+=3){ tree(D,-5.2,z,.9); tree(D,5.2,z,.9); }
      // 문(가시덤불) — 방을 정리하면 가라앉는다
      const gate=new THREE.Group(); gate.position.set(0,0,r.z-r.r-.5); D.add(gate);
      for (let k=-2;k<=2;k++){ const s=mesh(new THREE.ConeGeometry(.5,2.6,6),mat(0x4a3a22,{ flatShading:true }),k*1.1,1.2,0,gate); s.rotation.z=k*.15; }
      r.gate=gate;
    }
    // 방마다 광맥 2개
    if (i<4){ addOre(D,i<2?"copper":"iron",r.x-r.r*.6,r.z+r.r*.3); addOre(D,i<1?"stone":"copper",r.x+r.r*.6,r.z-r.r*.2); }
    for (let k=0;k<4;k++) rock(D,r.x+rand(-r.r*.8,r.r*.8),r.z+rand(-r.r*.8,r.r*.8),.3+Math.random()*.3);
  });
  world.walk=(x,z)=>{
    for (const r of DROOMS) if (Math.hypot(x-r.x,z-r.z)<r.r-.8) return true;
    for (let i=0;i<DROOMS.length-1;i++){
      const r=DROOMS[i], n=DROOMS[i+1];
      if (Math.abs(x)<2.4 && z<r.z-r.r+1 && z>n.z+n.r-1){
        if (!r.cleared && z<r.z-r.r+.2) return false;   // 닫힌 문
        return true;
      }
    }
    return false;
  };
}

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function onClick(cx,cy){
  if (!started || anyPanel()) return;
  ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const targets=[];
  world.ores.forEach(o=>{ if (o.g.visible && o.g.parent && (o.area===world.area)) targets.push(o.g); });
  combat.mobs.forEach(m=>{ if (m.hp>0) targets.push(m.mesh); });
  const hit=ray.intersectObjects(targets,true)[0];
  if (!hit){ return; }
  let o=hit.object; while (o && !o.userData.ore && !o.userData.mob) o=o.parent;
  if (!o) return;
  if (o.userData.ore) mineOre(o.userData.ore,true);
  else if (o.userData.mob){ combat.focus=o.userData.mob; feed("집중 공격 · "+o.userData.mob.name,"#ff9a6a"); playerSwing(o.userData.mob); }
}
function playerSwing(target){
  player.swingT=.3;
  if (target && target.hp>0 && target.mesh.position.distanceTo(player.pos)<3.2) damageMob(target,4+S.up.pick*2,null,"#ffffff");
}
function mineOre(ore,byPlayer){
  if (ore.hp<=0) return;
  if (byPlayer){
    const d=Math.hypot(ore.x-player.pos.x,ore.z-player.pos.z);
    if (d>4){ feed("광맥에 더 가까이 가세요","#b9c2bb"); return; }
    player.swingT=.3; player.yaw=Math.atan2(ore.x-player.pos.x,ore.z-player.pos.z);
  }
  ore.hp-=byPlayer?S.up.pick:1;
  sfx.mine();
  ore.g.scale.setScalar(.9); setTimeout(()=>ore.hp>0&&ore.g.scale.setScalar(1),90);
  const wp=ore.g.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0,1.5,0));
  if (ore.hp<=0){
    const n=1+Math.floor(Math.random()*2)+(combatPartyHas("miner")?1:0);
    S.ores[ore.type]+=n; save(); renderRes();
    popText(wp,"+"+n+" "+ORES[ore.type].name,"#"+ORES[ore.type].color.toString(16).padStart(6,"0"),true);
    ore.g.visible=false; ore.respawn=performance.now()+25000;
  } else popText(wp,"⛏","#ffffff");
}
function combatPartyHas(trait){ return S.party.some(id=>{ const p=petById(id); return p && p.genes.traits.includes(trait); }); }

function tone(f0,f1,dur,vol,type){ const a=ac(); if (!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type||"sine";
  o.frequency.setValueAtTime(f0,a.currentTime); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),a.currentTime+dur);
  g.gain.setValueAtTime(vol||.2,a.currentTime); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+.02); }
const sfx={
  mine(){ tone(900,500,.06,.12,"square"); },
  hit(){ tone(420,180,.08,.1,"square"); },
  coin(){ tone(1300,1900,.08,.08,"triangle"); },
  heal(){ tone(500,900,.25,.1,"sine"); },
  boom(){ tone(120,40,.4,.3,"sawtooth"); },
  level(){ tone(520,1040,.18,.15,"triangle"); setTimeout(()=>tone(780,1560,.2,.15,"triangle"),120); },
  crack(){ tone(300,120,.08,.2,"square"); },
  hatch(){ tone(400,1600,.5,.2,"triangle"); setTimeout(()=>tone(800,2400,.5,.15,"sine"),150); },
  bad(){ tone(200,90,.25,.2,"sawtooth"); }
};

const combat={ units:[], mobs:[], projectiles:[], fx:[], focus:null, room:-1, running:false, loot:null, cheerUntil:0, cd:{ cheer:0, potion:0 }, boss:null };
// 파티 펫을 월드에 내보낸다(허브에서도 따라다닌다)
function spawnParty(){
  combat.units.forEach(u=>scene.remove(u.mesh));
  combat.units=S.party.map(petById).filter(Boolean).map((p,i)=>{
    const st=petStats(p), m=buildPet(p.genes);
    m.position.copy(player.pos).add(new THREE.Vector3((i-1)*1.8,0,2)); scene.add(m);
    const u={ pet:p, mesh:m, hp:st.hp, maxHp:st.hp, st, cd:Math.random(), down:false, revived:false, auraT:0, breathT:3, tauntT:0, slot:i, hpBar:hpBar(m,1.4*p.genes.size+.3,"#3ad07a") };
    return u;
  });
  renderParty();
}
// 머리 위 체력바(평면 두 장)
function hpBar(parent,y,color){
  const g=new THREE.Group(); g.position.y=y/parent.scale.y;
  const bg=new THREE.Mesh(new THREE.PlaneGeometry(1,.12),new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:.6, depthTest:false }));
  const fg=new THREE.Mesh(new THREE.PlaneGeometry(1,.12),new THREE.MeshBasicMaterial({ color, depthTest:false }));
  fg.position.z=.001; bg.renderOrder=10; fg.renderOrder=11; g.add(bg,fg); g.userData.fg=fg; g.visible=false;
  g.scale.setScalar(1/parent.scale.x); parent.add(g); return g;
}
const _q=new THREE.Quaternion();
function faceCam(bar){ bar.parent.getWorldQuaternion(_q); bar.quaternion.copy(_q.invert()).multiply(camera.quaternion); }
function setBar(bar,ratio){ const fg=bar.userData.fg; fg.scale.x=Math.max(.001,ratio); fg.position.x=-(1-ratio)/2; }

function buildMob(type,elite){
  const g=new THREE.Group();
  if (type==="mushroom"){
    mesh(new THREE.CylinderGeometry(.28,.34,.6,10),mat(0xf0e0c8),0,.3,0,g);
    const cap=mesh(new THREE.SphereGeometry(.6,16,10,0,Math.PI*2,0,Math.PI/2),mat(0xd83a2a),0,.55,0,g); cap.scale.y=.8;
    for (let i=0;i<5;i++) mesh(new THREE.SphereGeometry(.09,6,5),mat(0xffffff),Math.cos(i*1.3)*.35,.9,Math.sin(i*1.3)*.35,g);
    for (const sx of [-1,1]) mesh(new THREE.SphereGeometry(.06,6,5),mat(0x111111),sx*.12,.42,.28,g);
  } else if (type==="boar"){
    mesh(new THREE.BoxGeometry(.8,.7,1.3),mat(0x6a4a34),0,.6,0,g);
    mesh(new THREE.BoxGeometry(.6,.55,.5),mat(0x5a3a28),0,.7,.8,g);
    for (const sx of [-1,1]) mesh(new THREE.ConeGeometry(.06,.35,6),mat(0xfff4dc),sx*.22,.55,1.1,g).rotation.x=Math.PI/2.4;
    for (let i=0;i<5;i++) mesh(new THREE.ConeGeometry(.08,.4,5),mat(0x2a2218),0,1.05,-.4+i*.2,g).rotation.x=-.4;
    for (const [x,z] of [[-.28,.45],[.28,.45],[-.28,-.45],[.28,-.45]]) mesh(new THREE.BoxGeometry(.18,.4,.18),mat(0x4a3424),x,.2,z,g);
    for (const sx of [-1,1]) mesh(new THREE.SphereGeometry(.05,6,5),mat(0xff3a2a,{ emissive:0xff2010, emissiveIntensity:1 }),sx*.18,.82,1.06,g);
  } else if (type==="vine"){
    const m2=mat(0x4ac06a,{ emissive:0x1a5a2a, emissiveIntensity:.5 });
    mesh(new THREE.ConeGeometry(.45,1.4,8),m2,0,1.2,0,g).rotation.x=Math.PI;
    mesh(new THREE.SphereGeometry(.35,12,10),m2,0,1.9,0,g);
    for (let i=0;i<4;i++){ const l=mesh(new THREE.TorusGeometry(.5,.05,6,16,Math.PI),m2,0,1.2,0,g); l.rotation.y=i*.8; }
    for (const sx of [-1,1]) mesh(new THREE.SphereGeometry(.07,6,5),mat(0xfff08a,{ emissive:0xffd040, emissiveIntensity:1.5 }),sx*.12,1.95,.3,g);
    g.userData.floaty=1;
  } else if (type==="boss"){
    const bark=mat(0x5a3e24,{ flatShading:true }), leaf=mat(0x2f7a32,{ flatShading:true });
    mesh(new THREE.CylinderGeometry(1.1,1.6,4.2,9),bark,0,2.1,0,g);
    for (let i=0;i<5;i++){ const r=mesh(new THREE.CylinderGeometry(.25,.4,2.4,6),bark,Math.cos(i*1.25)*1.4,.4,Math.sin(i*1.25)*1.4,g); r.rotation.z=Math.cos(i*1.25)*.9; r.rotation.x=-Math.sin(i*1.25)*.9; }
    const crown=mesh(new THREE.IcosahedronGeometry(3,0),leaf,0,5.6,0,g);
    mesh(new THREE.IcosahedronGeometry(2,0),leaf,1.6,6.8,.6,g); mesh(new THREE.IcosahedronGeometry(1.8,0),leaf,-1.6,6.5,-.4,g);
    for (const sx of [-1,1]) mesh(new THREE.SphereGeometry(.28,10,8),mat(0xffd040,{ emissive:0xffa010, emissiveIntensity:2 }),sx*.5,3.2,1,g);
    mesh(new THREE.BoxGeometry(1,.18,.2),mat(0x1a0e06),0,2.5,1.2,g);
    for (const sx of [-1,1]){ const arm=mesh(new THREE.CylinderGeometry(.3,.5,3,7),bark,sx*1.9,3,0,g); arm.rotation.z=sx*.9; }
  }
  const s=(elite?1.35:1)*(type==="boss"?1.4:1); g.scale.setScalar(s);
  if (elite){ g.traverse(o=>{ if (o.isMesh){ o.material=o.material.clone(); o.material.emissive=new THREE.Color(0x8a2aff); o.material.emissiveIntensity=.35; } }); }
  return g;
}
function spawnMob(type,x,z,elite){
  const M=MOBS[type], m=buildMob(type,elite); m.position.set(x,0,z); scene.add(m);
  const hpMul=elite?2.6:1;
  const mob={ type, name:(elite?"엘리트 ":"")+M.name, M, mesh:m, hp:M.hp*hpMul, maxHp:M.hp*hpMul, atk:M.atk*(elite?1.5:1), cd:rand(.5,1.5), elite, slowUntil:0, target:null,
    chargeT:rand(2,4), hpBar:null, t:0 };
  mob.hpBar=hpBar(m,type==="boss"?9:type==="vine"?2.6:type==="boar"?1.6:1.4,elite?"#c070ff":"#ff5040"); mob.hpBar.visible=true;
  m.traverse(o=>{ o.userData.mob=mob; });
  if (type==="boss"){ mob.slamT=5; mob.rootT=3; mob.summonT=12; combat.boss=mob; $("#bossbar").classList.add("show"); $("#boss-n").textContent=M.name; mob.hpBar.visible=false; }
  combat.mobs.push(mob); return mob;
}
function allies(){ return combat.units.filter(u=>!u.down); }
function dist2(a,b){ return Math.hypot(a.x-b.x,a.z-b.z); }
function nearestMob(p,maxD){ let best=null,bd=maxD||Infinity; for (const m of combat.mobs){ if (m.hp<=0) continue; const d=dist2(m.mesh.position,p); if (d<bd){ bd=d; best=m; } } return best; }
function damageMob(m,amount,src,color){
  if (m.hp<=0) return;
  amount=Math.round(amount*(performance.now()<combat.cheerUntil&&src?1.5:1));
  m.hp-=amount;
  const wp=m.mesh.position.clone(); wp.y+=m.type==="boss"?7:1.6;
  popText(wp,String(amount),color||"#fff",amount>60);
  m.mesh.scale.multiplyScalar(1.06); setTimeout(()=>m.mesh.scale.multiplyScalar(1/1.06),70);
  if (src){
    const tr=src.pet.genes.traits;
    if (tr.includes("lifesteal")) healUnit(src,amount*.2,true);
    if (tr.includes("fear")) m.slowUntil=performance.now()+3000;
  }
  setBar(m.hpBar,Math.max(0,m.hp/m.maxHp));
  if (m===combat.boss) $("#boss-f").style.width=Math.max(0,m.hp/m.maxHp*100)+"%";
  if (m.hp<=0) killMob(m,src);
}
function killMob(m,src){
  sfx.coin();
  const M=m.M, coins=Math.round(rand(...M.coins)*(m.elite?3:1));
  combat.loot.coins+=coins; S.coins+=coins;
  const wp=m.mesh.position.clone(); wp.y+=1.4;
  popText(wp,"+"+coins,"#ffd24a",true);
  if (Math.random()<(m.elite?.5:.12)){ const t=Math.random()<.6?"copper":"iron"; S.ores[t]++; combat.loot.ores[t]=(combat.loot.ores[t]||0)+1; }
  // 알 드롭
  let egg=null;
  if (m.type==="boss"){ const r=Math.random(); egg=r<.12?"legendary":r<.45?"epic":"rare"; S.bossKills++; }
  else if (m.elite && Math.random()<.18) egg="rare";
  else if (Math.random()<.04) egg="common";
  if (egg){ combat.loot.eggs.push(egg); feed(EGGS[egg].name+" 획득!",tierHex(egg)); }
  // 경험치 — 파티 전원에게
  const xp=(m.type==="boss"?220:m.elite?40:14);
  allies().forEach(u=>giveXp(u,xp));
  // 쓰러지는 연출
  const mm=m.mesh; let t=0; const fall=()=>{ t+=.05; mm.scale.multiplyScalar(.88); mm.rotation.y+=.3; if (t<.6) requestAnimationFrame(fall); else scene.remove(mm); }; fall();
  if (combat.focus===m) combat.focus=null;
  if (m===combat.boss){ combat.boss=null; $("#bossbar").classList.remove("show"); }
  renderRes();
}
function giveXp(u,xp){
  const p=u.pet; p.xp+=xp;
  while (p.xp>=xpNeed(p.level) && p.level<50){ p.xp-=xpNeed(p.level); p.level++;
    const st=petStats(p), gain=st.hp-u.maxHp; u.maxHp=st.hp; u.hp+=gain; u.st=st;
    popText(u.mesh.position.clone().add(new THREE.Vector3(0,2,0)),"LEVEL UP","#4ff0c8",true); sfx.level(); }
}
function healUnit(u,amt,silent){ if (u.down) return; u.hp=Math.min(u.maxHp,u.hp+amt); if (!silent) popText(u.mesh.position.clone().add(new THREE.Vector3(0,1.6,0)),"+"+Math.round(amt),"#6ff0a0"); }
function damageUnit(u,amt,fromMob){
  if (u.down) return;
  if (u.st.role==="tank") amt*=.7;
  u.hp-=amt; popText(u.mesh.position.clone().add(new THREE.Vector3(0,1.4,0)),String(Math.round(amt)),"#ff6a5a");
  if (fromMob && u.pet.genes.traits.includes("thorns")) damageMob(fromMob,amt*.25,null,"#c8ff8a");
  if (u.hp<=0){
    if (u.pet.genes.traits.includes("phoenix") && !u.revived){ u.revived=true; u.hp=u.maxHp*.5; popText(u.mesh.position.clone().add(new THREE.Vector3(0,2,0)),"불사조 부활!","#ffb52e",true); sfx.heal(); return; }
    u.down=true; u.hp=0; u.mesh.rotation.z=Math.PI/2; feed(u.pet.name+" 쓰러짐","#ff7a6a");
    if (!allies().length) failRun("파티 전멸");
  }
}
function damagePlayer(amt){
  player.hp-=amt; popText(player.pos.clone().add(new THREE.Vector3(0,2.3,0)),String(Math.round(amt)),"#ff4b3a");
  flashHurt();
  if (player.hp<=0){ player.hp=0; failRun("테이머가 쓰러졌습니다"); }
}
function projectile(from,to,color,speed,onHit,size){
  const m=new THREE.Mesh(new THREE.SphereGeometry(size||.18,10,8),new THREE.MeshBasicMaterial({ color })); m.position.copy(from); scene.add(m);
  combat.projectiles.push({ m, to, speed:speed||14, onHit });
}
// 바닥 경고 표시(보스 패턴) — 시간이 지나면 터진다
function telegraph(x,z,r,delay,onFire,color){
  const ring=new THREE.Mesh(new THREE.CircleGeometry(r,32),new THREE.MeshBasicMaterial({ color:color||0xff3a2a, transparent:true, opacity:.25, depthWrite:false }));
  ring.rotation.x=-Math.PI/2; ring.position.set(x,.05,z); scene.add(ring);
  const edge=new THREE.Mesh(new THREE.RingGeometry(r*.94,r,40),new THREE.MeshBasicMaterial({ color:color||0xff3a2a, transparent:true, opacity:.9, depthWrite:false }));
  edge.rotation.x=-Math.PI/2; edge.position.set(x,.06,z); scene.add(edge);
  combat.fx.push({ ring, edge, t:0, delay, onFire, x, z, r });
}
function inCircle(p,x,z,r){ return Math.hypot(p.x-x,p.z-z)<r; }

function updateUnits(dt,now){
  const inDungeon=world.area==="dungeon";
  combat.units.forEach((u,i)=>{
    const m=u.mesh, p=m.position;
    if (u.down){ u.hpBar.visible=false; return; }
    u.hpBar.visible=inDungeon; setBar(u.hpBar,u.hp/u.maxHp); faceCam(u.hpBar);
    let goal=null, target=null, moving=false;
    // 전투: 목표 고르기 — 집중 공격 대상이 있으면 그걸, 없으면 가까운 적
    if (inDungeon && combat.mobs.some(mb=>mb.hp>0)){
      target = combat.focus && combat.focus.hp>0 ? combat.focus : nearestMob(p,24);
      if (u.st.role==="tank"){ const nm=nearestMob(player.pos,16); if (nm && !combat.focus) target=nm; }
    }
    // 서포터: 다친 아군이 있으면 치유 우선
    if (u.st.role==="support" && inDungeon){
      u.healT=(u.healT||0)-dt;
      const hurt=allies().filter(a=>a.hp/a.maxHp<.7).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
      if (hurt && u.healT<=0){ u.healT=3.2; healUnit(hurt,u.st.atk*1.8); if (player.hp<player.maxHp) player.hp=Math.min(player.maxHp,player.hp+u.st.atk*.8);
        projectile(p.clone().add(new THREE.Vector3(0,.8,0)),hurt.mesh.position.clone().add(new THREE.Vector3(0,.6,0)),0x6ff0a0,16,null,.14); sfx.heal(); }
    }
    if (target){
      const d=dist2(p,target.mesh.position), reach=u.st.range+(target.type==="boss"?2.6:0);
      if (d>reach*.9){ goal=target.mesh.position; }
      u.cd-=dt;
      if (d<=reach && u.cd<=0){
        u.cd=u.st.cd;
        const atk=u.st.atk;
        if (u.st.range>3){ // 원거리
          const col=u.pet.genes.species==="pumpkin"?0xff8a1f:new THREE.Color().setHSL(u.pet.genes.hue,.8,.6).getHex();
          projectile(p.clone().add(new THREE.Vector3(0,.7,0)),target.mesh.position.clone().add(new THREE.Vector3(0,.8,0)),col,15,()=>unitHit(u,target,atk));
        } else { unitHit(u,target,atk); m.userData.lunge=.18; }
      }
      // 탱커 도발: 주변 적의 목표를 자기로
      if (u.st.role==="tank"){ u.tauntT-=dt; if (u.tauntT<=0){ u.tauntT=5; let n=0; combat.mobs.forEach(mb=>{ if (mb.hp>0 && dist2(mb.mesh.position,p)<7){ mb.target=u; n++; } }); if (n) popText(p.clone().add(new THREE.Vector3(0,2,0)),"도발!","#6aa8ff"); } }
      // 용의 숨결
      if (u.pet.genes.traits.includes("breath")){ u.breathT-=dt; if (u.breathT<=0){ u.breathT=6; combat.mobs.forEach(mb=>{ if (mb.hp>0 && dist2(mb.mesh.position,p)<6) damageMob(mb,atk*3,u,"#ff9a3c"); }); fxBurst(p,0xff7a2a,4); } }
      m.rotation.y=Math.atan2(target.mesh.position.x-p.x,target.mesh.position.z-p.z);
    } else {
      // 따라다니기 — 플레이어 뒤쪽에 부채꼴로
      const back=new THREE.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw)).multiplyScalar(-2.2);
      const side=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw)).multiplyScalar((i-1)*1.8);
      const want=player.pos.clone().add(back).add(side);
      if (dist2(p,want)>1.2) goal=want;
    }
    // 치유 오라
    if (u.pet.genes.traits.includes("aura") && inDungeon){ u.auraT-=dt; if (u.auraT<=0){ u.auraT=5; allies().forEach(a=>healUnit(a,a.maxHp*.08,true)); fxBurst(p,0x6ff0a0,3); } }
    if (goal){
      const dir=new THREE.Vector3(goal.x-p.x,0,goal.z-p.z); const d=dir.length();
      if (d>.05){ dir.divideScalar(d); const sp=u.st.spd*(d>10?1.8:1)*dt;
        const nx=p.x+dir.x*sp, nz=p.z+dir.z*sp;
        if (world.walk(nx,nz) || !world.walk(p.x,p.z)){ p.x=nx; p.z=nz; }
        m.rotation.y=Math.atan2(dir.x,dir.z); moving=true; }
      if (d>30){ p.copy(player.pos).add(new THREE.Vector3(rand(-2,2),0,rand(-2,2))); }   // 너무 멀어지면 순간이동
    }
    // 동료끼리 겹치지 않게
    combat.units.forEach(o=>{ if (o===u) return; const dx=p.x-o.mesh.position.x, dz=p.z-o.mesh.position.z, dd=Math.hypot(dx,dz); if (dd<1.1&&dd>.01){ p.x+=dx/dd*(1.1-dd)*.5; p.z+=dz/dd*(1.1-dd)*.5; } });
    if (m.userData.lunge>0){ m.userData.lunge-=dt; }
    animatePet(m,dt,moving,now/1000);
  });
}
function unitHit(u,target,atk){
  if (!target || target.hp<=0) return;
  const tr=u.pet.genes.traits;
  damageMob(target,atk*rand(.9,1.1),u,u.pet.genes.species==="fox"?"#ffe08a":"#ffffff");
  sfx.hit();
  if (tr.includes("explode") && Math.random()<.25){ fxBurst(target.mesh.position,0xffa03a,2.6); combat.mobs.forEach(mb=>{ if (mb!==target && mb.hp>0 && dist2(mb.mesh.position,target.mesh.position)<3.2) damageMob(mb,atk*.8,u,"#ffb05a"); }); sfx.boom(); }
  if (tr.includes("chain")){ let n=0; for (const mb of combat.mobs){ if (n>=2) break; if (mb!==target && mb.hp>0 && dist2(mb.mesh.position,target.mesh.position)<6){ n++; damageMob(mb,atk*.5,u,"#9ad8ff"); line(target.mesh.position,mb.mesh.position,0x9ad8ff); } } }
}
function fxBurst(pos,color,r){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,16,10),new THREE.MeshBasicMaterial({ color, transparent:true, opacity:.6, depthWrite:false }));
  m.position.copy(pos); m.position.y+=.6; scene.add(m); combat.fx.push({ burst:m, t:0, r });
}
function line(a,b,color){
  const g=new THREE.BufferGeometry().setFromPoints([a.clone().setY(1),b.clone().setY(1)]);
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({ color })); scene.add(l); setTimeout(()=>scene.remove(l),120);
}
function mobTarget(mb){
  if (mb.target && mb.target.down) mb.target=null;
  if (mb.target && mb.target!==player && dist2(mb.target.mesh.position,mb.mesh.position)>14) mb.target=null;
  if (mb.target) return mb.target;
  let best=player, bd=dist2(player.pos,mb.mesh.position);
  for (const u of allies()){ const d=dist2(u.mesh.position,mb.mesh.position)*(u.st.role==="tank"?.6:1); if (d<bd){ bd=d; best=u; } }
  return best;
}
const posOf=t=>t===player?player.pos:t.mesh.position;
function updateMobs(dt,now){
  for (const mb of combat.mobs){
    if (mb.hp<=0) continue;
    const m=mb.mesh, p=m.position; mb.t+=dt;
    faceCam(mb.hpBar);
    if (m.userData.floaty) m.position.y=Math.sin(mb.t*2)*.2+.2;
    const tgt=mobTarget(mb), tp=posOf(tgt), d=dist2(p,tp);
    const slow=now<mb.slowUntil?.6:1;
    if (mb.type==="boss"){ bossLogic(mb,dt,tgt,d); m.rotation.y=Math.atan2(tp.x-p.x,tp.z-p.z); continue; }
    // 멧돼지 돌진
    if (mb.M.charge){ mb.chargeT-=dt; if (mb.chargeT<=0 && d<10 && d>3){ mb.chargeT=rand(4,6); mb.dash=.45; mb.dashDir=new THREE.Vector3(tp.x-p.x,0,tp.z-p.z).normalize(); popText(p.clone().add(new THREE.Vector3(0,2,0)),"!","#ff4b3a",true); } }
    if (mb.dash>0){ mb.dash-=dt; const nx=p.x+mb.dashDir.x*16*dt, nz=p.z+mb.dashDir.z*16*dt; if (world.walk(nx,nz)){ p.x=nx; p.z=nz; }
      if (dist2(p,tp)<1.6 && !mb.dashHit){ mb.dashHit=true; tgt===player?damagePlayer(mb.atk*1.6):damageUnit(tgt,mb.atk*1.6,mb); }
      if (mb.dash<=0) mb.dashHit=false; continue; }
    if (d>mb.M.range*.9){
      const dir=new THREE.Vector3(tp.x-p.x,0,tp.z-p.z).normalize(), sp=mb.M.spd*slow*dt;
      const nx=p.x+dir.x*sp, nz=p.z+dir.z*sp; if (world.walk(nx,nz)){ p.x=nx; p.z=nz; }
    }
    m.rotation.y=Math.atan2(tp.x-p.x,tp.z-p.z);
    mb.cd-=dt;
    if (d<=mb.M.range && mb.cd<=0){
      mb.cd=mb.M.cd;
      if (mb.M.ranged) projectile(p.clone().add(new THREE.Vector3(0,1.8,0)),tp.clone().add(new THREE.Vector3(0,.8,0)),0x9aff5a,11,()=>{ if (dist2(posOf(tgt),tp)<2.5) tgt===player?damagePlayer(mb.atk):damageUnit(tgt,mb.atk,mb); });
      else tgt===player?damagePlayer(mb.atk):damageUnit(tgt,mb.atk,mb);
    }
    // 몹끼리 밀어내기
    for (const o of combat.mobs){ if (o===mb||o.hp<=0) continue; const dx=p.x-o.mesh.position.x, dz=p.z-o.mesh.position.z, dd=Math.hypot(dx,dz); if (dd<1.3&&dd>.01){ p.x+=dx/dd*(1.3-dd)*.5; p.z+=dz/dd*(1.3-dd)*.5; } }
  }
}
// 보스: 뿌리 찌르기(모두의 발밑) / 내려찍기(주변 원) / 버섯 소환. 체력 50% 아래면 빨라진다.
function bossLogic(b,dt,tgt,d){
  const enr=b.hp/b.maxHp<.5?1.5:1;
  if (enr>1 && !b.enraged){ b.enraged=true; toast("수호자가 분노했다!","패턴이 빨라집니다","#ff6a3a"); }
  const p=b.mesh.position;
  if (d>b.M.range){ const dir=new THREE.Vector3(posOf(tgt).x-p.x,0,posOf(tgt).z-p.z).normalize(); p.x+=dir.x*b.M.spd*dt; p.z+=dir.z*b.M.spd*dt; }
  b.cd-=dt; if (d<=b.M.range+1 && b.cd<=0){ b.cd=b.M.cd/enr; tgt===player?damagePlayer(b.atk):damageUnit(tgt,b.atk,b); }
  b.rootT-=dt*enr; b.slamT-=dt*enr; b.summonT-=dt;
  if (b.rootT<=0){ b.rootT=7;
    const spots=[player.pos,...allies().map(u=>u.mesh.position)];
    spots.forEach(sp=>telegraph(sp.x,sp.z,2.2,1.4,(x,z,r)=>{ fxSpikes(x,z);
      if (inCircle(player.pos,x,z,r)) damagePlayer(24); allies().forEach(u=>{ if (inCircle(u.mesh.position,x,z,r)) damageUnit(u,34); }); }));
    feed("뿌리가 솟아오른다 — 피하세요!","#ff9a6a");
  }
  if (b.slamT<=0){ b.slamT=9;
    telegraph(p.x,p.z,7,1.6,(x,z,r)=>{ fxBurst(new THREE.Vector3(x,0,z),0xc8a060,7); sfx.boom(); shake(.6);
      if (inCircle(player.pos,x,z,r)) damagePlayer(30); allies().forEach(u=>{ if (inCircle(u.mesh.position,x,z,r)) damageUnit(u,42); }); },0xff7a2a);
  }
  if (b.summonT<=0){ b.summonT=15; for (let i=0;i<3;i++){ const a=Math.random()*6.28; spawnMob("mushroom",p.x+Math.cos(a)*5,p.z+Math.sin(a)*5); } feed("버섯돌이 소환!","#ff9a6a"); }
}
function fxSpikes(x,z){
  for (let i=0;i<6;i++){ const s=new THREE.Mesh(new THREE.ConeGeometry(.3,2.2,5),mat(0x5a3e24,{ flatShading:true })); s.position.set(x+rand(-1.4,1.4),-1,z+rand(-1.4,1.4)); scene.add(s);
    combat.fx.push({ spike:s, t:0 }); }
  sfx.boom(); shake(.3);
}
function updateFx(dt){
  for (let i=combat.projectiles.length-1;i>=0;i--){
    const pr=combat.projectiles[i], dir=pr.to.clone().sub(pr.m.position), d=dir.length();
    if (d<.4){ scene.remove(pr.m); combat.projectiles.splice(i,1); if (pr.onHit) pr.onHit(); continue; }
    pr.m.position.addScaledVector(dir.divideScalar(d),Math.min(d,pr.speed*dt));
  }
  for (let i=combat.fx.length-1;i>=0;i--){
    const f=combat.fx[i]; f.t+=dt;
    if (f.ring){ const k=Math.min(1,f.t/f.delay); f.ring.material.opacity=.15+.35*k; f.ring.scale.setScalar(.3+.7*k);
      if (f.t>=f.delay){ scene.remove(f.ring); scene.remove(f.edge); combat.fx.splice(i,1); if (combat.running) f.onFire(f.x,f.z,f.r); } }
    else if (f.burst){ f.burst.scale.setScalar(f.r*(.3+f.t*3)); f.burst.material.opacity=Math.max(0,.6-f.t*2); if (f.t>.3){ scene.remove(f.burst); combat.fx.splice(i,1); } }
    else if (f.spike){ f.spike.position.y=f.t<.15?-1+f.t/.15*2:1-Math.max(0,f.t-.6)*4; if (f.t>1){ scene.remove(f.spike); combat.fx.splice(i,1); } }
  }
}

function circMean(a,b){ const x=Math.cos(a*6.283)+Math.cos(b*6.283), y=Math.sin(a*6.283)+Math.sin(b*6.283); return ((Math.atan2(y,x)/6.283)+1)%1; }
function doBreed(a,b){
  if (S.pets.length>=capacity()){ toast("보관함이 가득 찼어요","펫을 놓아주거나 보관함을 확장하세요","#ff7a6a"); return; }
  const cost=breedCost(a,b); if (!canPay(cost)) return; pay(cost);
  const A=a.genes, B=b.genes, donor=Math.random()<.5?A:B;
  const g={ species:(Math.random()<.5?A:B).species, hue:(circMean(A.hue,B.hue)+rand(-.05,.05)+1)%1, sat:clamp((A.sat+B.sat)/2+rand(-.06,.06),.3,.9),
    light:clamp((A.light+B.light)/2+rand(-.04,.04),.38,.66), pattern:"none", phue:donor.phue, size:clamp((A.size+B.size)/2+rand(-.12,.12),.6,1.6), traits:[], glow:false, rainbow:false, giant:false };
  const r=Math.random();
  g.pattern = r<.45?A.pattern : r<.9?B.pattern : "none";
  if (g.pattern==="none" && A.pattern==="none" && B.pattern==="none" && Math.random()<.08) g.pattern=pick(["stripes","spots","stars","flames"]);
  const pool=[...new Set([...A.traits,...B.traits])].sort(()=>Math.random()-.5);
  for (const t of pool){ if (g.traits.length<2 && Math.random()<.55) g.traits.push(t); }
  if ((A.glow||B.glow) && Math.random()<.35) g.glow=true;
  if (A.rainbow||B.rainbow) g.rainbow=Math.random()<(A.rainbow&&B.rainbow?.6:.25);
  if (A.giant&&B.giant && Math.random()<.5){ g.giant=true; g.size=rand(1.7,2); }
  // 등급
  let tier;
  const ta=tierIdx(a.tier), tb=tierIdx(b.tier);
  if (ta>=3&&tb>=3&&Math.random()<.25){ tier="mythic"; g.rainbow=true; }
  else if ((a.tier==="halloween"||b.tier==="halloween") && Math.random()<.5) tier="halloween";
  else { let ti=Math.min(3,Math.max(ta,tb)); if (Math.random()<.1) ti=Math.min(3,ti+1); tier=TIERS[ti]; }
  if (Math.random()<mutChance()) mutate(g);
  const iv=clamp((a.iv+b.iv)/2+rand(-.04,.08),.7,1.55);
  const child=makePet(g,tier,{ iv:+iv.toFixed(3), gen:Math.max(a.gen,b.gen)+1, parents:[a.name,b.name] });
  closePanels(); breedPick=[];
  hatchEgg(tier,child);
}

const clock=new THREE.Clock();
let idleTick=0, minerTick=0;
function update(dt,now){
  // 플레이어 이동
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y, s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x;
  const blocked=anyPanel();
  let moving=false;
  if (!blocked && (Math.abs(f)>.1||Math.abs(s)>.1)){
    const fx=-Math.sin(cam.yaw), fz=-Math.cos(cam.yaw), rx=Math.cos(cam.yaw), rz=-Math.sin(cam.yaw);
    let dx=fx*f+rx*s, dz=fz*f+rz*s; const l=Math.hypot(dx,dz); dx/=l; dz/=l;
    const sp=7.2*dt*Math.min(1,l);
    const nx=player.pos.x+dx*sp, nz=player.pos.z+dz*sp;
    if (world.walk(nx,player.pos.z)) player.pos.x=nx;
    if (world.walk(player.pos.x,nz)) player.pos.z=nz;
    player.yaw=Math.atan2(dx,dz); moving=true;
  }
  player.vy-=20*dt; player.pos.y+=player.vy*dt; if (player.pos.y<=0){ player.pos.y=0; player.vy=0; player.onGround=true; }
  const pm=player.mesh; pm.position.copy(player.pos);
  let dr=player.yaw-pm.rotation.y; while (dr>Math.PI) dr-=Math.PI*2; while (dr<-Math.PI) dr+=Math.PI*2; pm.rotation.y+=dr*Math.min(1,dt*12);
  player.walkT+=dt*(moving?10:0); const P=pm.userData.parts, sw=moving?Math.sin(player.walkT)*.7:0;
  P.legL.rotation.x=sw; P.legR.rotation.x=-sw; P.armL.rotation.x=-sw*.8;
  if (player.swingT>0){ player.swingT-=dt; P.armR.rotation.x=-2.2+(.3-player.swingT)*8; } else P.armR.rotation.x=sw*.8;
  // 카메라
  if (!started){ cam.yaw+=dt*.08; }
  const tgt=player.pos.clone().add(new THREE.Vector3(0,1.6,0));
  const cp=new THREE.Vector3(Math.sin(cam.yaw)*Math.cos(cam.pitch),Math.sin(cam.pitch),Math.cos(cam.yaw)*Math.cos(cam.pitch)).multiplyScalar(cam.dist).add(tgt);
  camera.position.lerp(cp,Math.min(1,dt*10));
  if (shakeAmt>0){ camera.position.x+=rand(-1,1)*shakeAmt*.3; camera.position.y+=rand(-1,1)*shakeAmt*.3; shakeAmt=Math.max(0,shakeAmt-dt*2); }
  camera.lookAt(tgt);
  sun.position.copy(player.pos).add(new THREE.Vector3(30,50,20)); sun.target.position.copy(player.pos);
  // 허브 연출 · 상호작용
  if (world.area==="hub"){
    world.helix.rotation.y+=dt*.8; world.portal.ring.rotation.z+=dt*.6; world.portal.surf.material.opacity=.45+Math.sin(now*.003)*.12;
    world.shopEggs.forEach((e,i)=>{ e.rotation.y+=dt; e.position.y=1.62+Math.sin(now*.002+i)*.08; });
    nearStation=world.stations.find(st=>Math.hypot(player.pos.x-st.x,player.pos.z-st.z)<st.r)||null;
    // 채굴 특성 펫이 근처 광맥을 캔다
    minerTick-=dt; if (minerTick<=0){ minerTick=2;
      combat.units.forEach(u=>{ if (!u.pet.genes.traits.includes("miner")) return;
        const o=world.ores.find(o=>o.area==="hub"&&o.g.visible&&Math.hypot(o.x-u.mesh.position.x,o.z-u.mesh.position.z)<7);
        if (o){ mineOre(o,false); line(u.mesh.position,new THREE.Vector3(o.x,0,o.z),0xffe08a); } }); }
    idleTick+=dt; if (idleTick>60){ idleTick=0; const g=Math.floor(idleRate()); if (g>0){ S.coins+=g; save(); renderRes(); feed("목장 수익 +"+g,"#ffd24a"); } }
  } else nearStation=null;
  const pr=$("#prompt");
  if (nearStation && !anyPanel()){ pr.classList.add("show"); $("#prompt-t").textContent=nearStation.text; } else pr.classList.remove("show");
  $("#t-act").style.display=nearStation?"":"none";
  // 광맥 재생성
  world.ores.forEach(o=>{ if (!o.g.visible && now>o.respawn && o.respawn){ o.g.visible=true; o.hp=o.maxHp; o.respawn=0; } });
  if (!blocked || world.area==="dungeon"){ if (!$("#result").classList.contains("show")){ updateUnits(dt,now); updateMobs(dt,now); } }
  updateFx(dt); updateDungeon();
  if (world.area==="dungeon" && Math.floor(now/300)!==update._rt){ update._rt=Math.floor(now/300); renderRoom(); }
  updatePartyHud(); updatePops(dt); updateHatch(dt);
}
function loop(){
  const dt=Math.min(clock.getDelta(),.05), now=performance.now();
  update(dt,now); renderer.render(scene,camera); requestAnimationFrame(loop);
}

// ======================================================================
//  시작
// ======================================================================
load();
buildHub(); buildPlayer();
player.pos.set(0,0,8);
renderRes(); spawnParty();
addEventListener("beforeunload",save);
loop();

</script>
</body>
