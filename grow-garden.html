function growthTime(x){ let g = SPECIES[x.species].grow * (1 + TI[x.tier]*0.12); for (const t of x.traits) if (TRAITS[t] && TRAITS[t].grow) g *= TRAITS[t].grow; return Math.max(5, Math.round(g)); }
function makeSeed(o){ const sd = Object.assign({ id:uid('seed'), kind:'seed', isPrimary:true, species:'carrot', tier:'Common', variant:'Normal', traits:[], name:'', qty:1 }, o);
  if (!sd.name) sd.name = SPECIES[sd.species].ko; sd.baseValue = seedValue(sd); sd.growthTime = growthTime(sd); return sd; }

function weatherAt(slot){ const r = hash(slot*7919 + 13); return r < .4 ? 'sunny' : r < .55 ? 'acid' : r < .7 ? 'storm' : r < .85 ? 'meteor' : 'rainbow'; }
const curWeather = () => weatherAt(Math.floor(sNow()/WX_CYCLE));
const wxLeft = () => (WX_CYCLE - sNow() % WX_CYCLE)/1000, rsLeft = () => (RESTOCK - sNow() % RESTOCK)/1000;
function specialStock(slot){
  const R = seeded(slot*131 + 7), meteor = weatherAt(Math.floor(slot*RESTOCK/WX_CYCLE)) === 'meteor', n = 4 + Math.floor(R()*3), out = [];
  for (let i=0;i<n;i++){ const r = R(), pd = meteor ? .005 : .0005, pc = meteor ? .035 : .0035;
    const tier = r < pd ? 'Divine' : r < pd + pc ? 'Celestial' : r < .02 ? 'Beast' : r < .1 ? 'Mythic' : r < .38 ? 'Legendary' : 'Epic';
    const sp = SPEC_KEYS[Math.floor(Math.pow(R(), 1.6)*SPEC_KEYS.length)], sd = makeSeed({ species:sp, tier });
    out.push({ i, sd, price:Math.round(SPECIES[sp].cost*TIERS[TI[tier]].mult*1.6), stock:TI[tier] >= TI.Mythic ? 1 : 1 + Math.floor(R()*3) }); }
  return out; }
function regularStock(){ const out = []; SPEC_KEYS.forEach(k=>{ out.push({ sd:makeSeed({ species:k }), price:SPECIES[k].cost }); if (SPECIES[k].cost >= 60) out.push({ sd:makeSeed({ species:k, tier:'Rare' }), price:SPECIES[k].cost*6 }); }); return out; }

// ---- RNG ----
function tierProbs(luck, wx){ const ps = TIERS.map(t=>t.p*(t.i > 0 ? luck : 1)); if (wx === 'storm'){ ps[TI.Ultra] *= 10; ps[TI.Hyper] *= 10; }
  let rest = 0; for (let i=1;i<ps.length;i++) rest += ps[i]; if (rest > .95){ const k = .95/rest; for (let i=1;i<ps.length;i++) ps[i] *= k; rest = .95; } ps[0] = 1 - rest; return ps; }
// 가장 희귀한 등급(히든)부터 아래로 누적 검사 — 아무것도 안 걸리면 커먼
function rollTier(luck, wx){ const ps = tierProbs(luck, wx), r = Math.random(); let acc = 0; for (let i=TIERS.length-1;i>=1;i--){ acc += ps[i]; if (r < acc) return TIERS[i].k; } return 'Common'; }
function rollVariant(wx, parents){ const r = Math.random(), pr = wx === 'rainbow' ? .05 : .001, pg = .01 + (parents.some(p=>p.variant === 'Golden') ? .04 : 0); return r < pr ? 'Rainbow' : r < pr + pg ? 'Golden' : 'Normal'; }
function labLuck(a, b){ let l = 1 + .1*((a ? TI[a.tier] : 0) + (b ? TI[b.tier] : 0)); for (const p of [a, b]) if (p && p.traits.includes('Lucky')) l += .5; if (S.luckNext) l *= 2; return l; }
const port = (a, b) => a === b ? a : a.slice(0, Math.ceil(a.length/2)) + b.slice(Math.floor(b.length/2));
function combineSeeds(A, B){
  const wx = curWeather(), luck = labLuck(A, B), tier = rollTier(luck, wx);
  const inherit = wx === 'acid' ? 1 : .7, mutate = wx === 'acid' ? .3 : .1, traits = [];
  for (const t of A.traits.concat(B.traits)) if (!traits.includes(t) && Math.random() < inherit) traits.push(t);
  let mutated = null; if (Math.random() < mutate){ const pool = TRAIT_KEYS.filter(k=>!traits.includes(k) && (!TRAITS[k].rare || Math.random() < .25)); if (pool.length){ mutated = pool[Math.floor(Math.random()*pool.length)]; traits.push(mutated); } }
  const variant = rollVariant(wx, [A, B]), sp = SPECIES[A.species].base >= SPECIES[B.species].base ? A.species : B.species;
  const sd = makeSeed({ species:sp, tier, variant, traits, isPrimary:false, name:port(A.name, B.name), born:Date.now() });
  const odds = tierProbs(luck, wx)[TI[tier]]; if (S.luckNext) S.luckNext = 0;
  return { sd, mutated, odds, luck, wx };
}

let myPlot = 0, netDirty = true, dirty = true;

// =====================================================================
//  멀티 — 한 서버 8명: 밭 자리, 아바타, 서로의 밭, 대박 알림

const NET = { on:false, uid:null, players:{}, ghosts:{}, seen:{}, sendT:0, fullT:0, plT:0, nonce:0, claimT:0 };
const URL_ROOM = (()=>{ try { return ((new URLSearchParams(location.search).get('room')) || 'PUBLIC').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12) || 'PUBLIC'; } catch(e){ return 'PUBLIC'; } })();
function myName(){ try { return (window.MP && MP.getDisplayName && MP.getDisplayName()) || '농부'; } catch(e){ return '농부'; } }
function broadcast(sd){ if (!NET.on) return; NET.nonce++; try { MP.update({ al:{ n:NET.nonce, tier:sd.tier, name:fullName(sd) } }); } catch(e){} }
function submit(){ try { if (window.MP && MP.submitScore){ MP.submitScore('garden_tier', S.bestTier, 'desc'); if (S.bestVal > 0) MP.submitScore('garden_value', Math.min(S.bestVal, 9e15), 'desc'); } } catch(e){} }
const freshP = u => performance.now() - (NET.seen[u] || -1e9) < 20000;
function takenPlots(){ const taken = {}; for (const u in NET.players){ const p = NET.players[u]; if (p && p.plot !== undefined && freshP(u)) taken[p.plot] = !taken[p.plot] || u < taken[p.plot] ? u : taken[p.plot]; } return taken; }
function movePlot(i){ if (i === myPlot) return; const old = PLOTS[myPlot], p = PLOTS[i];
  while (old.plantG.children.length) old.plantG.remove(old.plantG.children[0]); while (old.sprG.children.length) old.sprG.remove(old.sprG.children[0]); for (const k in plantObjs) delete plantObjs[k];
  for (const s of S.sprinklers){ s.x += p.cx - old.cx; s.z += p.cz - old.cz; }
  setSign(old, '빈 밭'); old.key = ''; myPlot = i; S.plot = i; setSign(p, myName() + '의 밭', '#ffe082'); syncPlants();
  P.x = p.cx; P.z = p.cz + p.face*(ROWS*SPOT/2 + 5); camYaw = p.face > 0 ? 0 : Math.PI; toast((i + 1) + '번 밭이 내 밭이에요'); }
function claimPlot(){ const t = takenPlots(); if (t[myPlot] && t[myPlot] < NET.uid){ for (let i=0;i<8;i++) if (!t[i]){ movePlot(i); return; } } }
function nameTag(t){ const c = document.createElement('canvas'); c.width = 256; c.height = 48; const g = c.getContext('2d'); g.font = '800 26px sans-serif'; g.textAlign = 'center'; g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.7)'; g.strokeText(String(t).slice(0, 14), 128, 34); g.fillStyle = '#fff'; g.fillText(String(t).slice(0, 14), 128, 34);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), depthWrite:false })); s.scale.set(2.6, .5, 1); s.position.y = 4.1; return s; }
(function(){
  if (!(window.MP && !window.__mpFail && MP.isConfigured && MP.isConfigured() && window.firebase)) return;
  try {
    MP.onPlayersUpdate(val=>{ const t = performance.now();
      for (const u in val){ const p = val[u]; if (!p) continue; const old = NET.players[u]; if (!old || old.ts !== p.ts) NET.seen[u] = t;
        if (old && p.al && (!old.al || old.al.n !== p.al.n)){ const T = TIERS[TI[p.al.tier]] || TIERS[0]; banner('🌐 ' + (p.name || '누군가') + '님이 ' + p.al.name + ' 을(를) 만들었어요!', T.col); if (TI[p.al.tier] >= TI.Infinity) flash(.8); }
        NET.players[u] = p; }

      // 잠깐 기다렸다가 비어 있는 밭 중 가장 앞 번호로
      setTimeout(()=>{ const t = takenPlots(); if (t[myPlot]){ for (let i=0;i<8;i++) if (!t[i]){ movePlot(i); break; } } }, 1500);
      if (MP.fetchAccountAvatarLoadout) MP.fetchAccountAvatarLoadout(l=>{ if (l){ buildMe(l); NET.fullT = 0; } }); });
  } catch(e){}
})();
function netTick(dt){
  const owners = {};

    const key = JSON.stringify(p.avatarLoadout || null);

    if (p.plot !== undefined && p.plot !== myPlot && PLOTS[p.plot]){ owners[p.plot] = 1; const pl = PLOTS[p.plot]; if (pl.owner !== u){ pl.owner = u; setSign(pl, (p.name || '농부') + '의 밭'); } drawRemotePlot(pl, p.pl, p.sp); } }
  for (const u in NET.ghosts) if (!NET.players[u] || !freshP(u)){ scene.remove(NET.ghosts[u].g); delete NET.ghosts[u]; }
  PLOTS.forEach((pl, i)=>{ if (i !== myPlot && !owners[i] && pl.owner){ pl.owner = null; setSign(pl, '빈 밭'); drawRemotePlot(pl, [], []); } });
  if (!NET.on) return;
  NET.sendT -= dt; if (NET.sendT > 0) return; NET.sendT = .12; NET.fullT -= .12; NET.plT -= .12; NET.claimT -= .12;
  const s = { name:myName(), x:+P.x.toFixed(2), y:+P.y.toFixed(2), z:+P.z.toFixed(2), ry:+P.face.toFixed(2), plot:myPlot };
  if (netDirty || NET.plT <= 0){ netDirty = false; NET.plT = 3; const p0 = PLOTS[myPlot];
    s.pl = S.plants.map(pl=>[pl.spot, SPEC_KEYS.indexOf(pl.sd.species), TI[pl.sd.tier], VK.indexOf(pl.sd.variant), Math.round(pl.prog*100)]);
    s.sp = S.sprinklers.map(x=>[x.type, +(x.x - p0.cx).toFixed(1), +(x.z - p0.cz).toFixed(1)]); }
  if (NET.fullT <= 0){ NET.fullT = 4; try { s.avatarLoadout = (MP.getLocalAvatarLoadout && MP.getLocalAvatarLoadout()) || null; } catch(e){} }
  try { MP.update(s); } catch(e){}
  if (NET.claimT <= 0){ NET.claimT = 2; claimPlot(); }
}

addEventListener('keydown', e=>{ keys[e.code] = true; if (e.repeat) return;

addEventListener('mousemove', e=>{ if (rDrag){ camYaw -= (e.clientX - lm.x)*.006; camPitch = clamp(camPitch + (e.clientY - lm.y)*.004, .08, 1.3); lm = { x:e.clientX, y:e.clientY }; } });
addEventListener('wheel', e=>{ if (panelKind) return; camDist = clamp(camDist + Math.sign(e.deltaY)*1.2, 6, 30); }, { passive:true });
(function(){ let jid = null, jc = { x:0, y:0 }, cid = null, cl = { x:0, y:0 }, tapT = 0, tapP = null; const jb = $('joyB'), js = $('joyS');
  $('joy').addEventListener('touchstart', e=>{ e.preventDefault(); const t = e.changedTouches[0]; jid = t.identifier; jc = { x:t.clientX, y:t.clientY }; jb.style.display = 'block'; jb.style.left = (jc.x - 55) + 'px'; jb.style.top = (jc.y - 55) + 'px'; js.style.transform = ''; }, { passive:false });
  $('joy').addEventListener('touchmove', e=>{ e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === jid){ let dx = t.clientX - jc.x, dy = t.clientY - jc.y; const d = Math.hypot(dx, dy), m = Math.min(d, 45); if (d > 0){ dx = dx/d*m; dy = dy/d*m; } js.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; mv.x = dx/45; mv.y = dy/45; } }, { passive:false });
  const je = e=>{ for (const t of e.changedTouches) if (t.identifier === jid){ jid = null; mv.x = mv.y = 0; jb.style.display = 'none'; } }; $('joy').addEventListener('touchend', je); $('joy').addEventListener('touchcancel', je);
  canvas.addEventListener('touchstart', e=>{ const t = e.changedTouches[0]; cid = t.identifier; cl = { x:t.clientX, y:t.clientY }; tapT = performance.now(); tapP = { x:t.clientX, y:t.clientY }; }, { passive:true });
  canvas.addEventListener('touchmove', e=>{ for (const t of e.changedTouches) if (t.identifier === cid){ camYaw -= (t.clientX - cl.x)*.007; camPitch = clamp(camPitch + (t.clientY - cl.y)*.005, .08, 1.3); cl = { x:t.clientX, y:t.clientY }; } }, { passive:true });
  canvas.addEventListener('touchend', e=>{ for (const t of e.changedTouches) if (t.identifier === cid){ cid = null; if (performance.now() - tapT < 300 && tapP && Math.hypot(t.clientX - tapP.x, t.clientY - tapP.y) < 12) clickWorld(t.clientX, t.clientY); } }, { passive:true });
  $('bJump').addEventListener('touchstart', e=>{ e.preventDefault(); jump(); }, { passive:false });
  $('bAct').addEventListener('touchstart', e=>{ e.preventDefault(); interact(); }, { passive:false }); })();
function jump(){ if (P.grounded && !panelKind){ P.vy = 15; P.grounded = false; sfx.jump(); } }

// =====================================================================
//  메인 루프
// =====================================================================
let T = 0, uiT = 0;
function collide(){ const R = .6; for (const c of colliders){ const qx = clamp(P.x, c.minX, c.maxX), qz = clamp(P.z, c.minZ, c.maxZ), dx = P.x - qx, dz = P.z - qz, d = Math.hypot(dx, dz);
    if (d < R){ if (d > 1e-4){ P.x += dx/d*(R - d); P.z += dz/d*(R - d); } else P.z = c.maxZ + R; } }
  P.x = clamp(P.x, -120, 120); P.z = clamp(P.z, -95, 95); }
function frame(dt){
  T += dt;
  let ix = mv.x, iy = mv.y; if (!panelKind){ if (keys.KeyW || keys.ArrowUp) iy = -1; if (keys.KeyS || keys.ArrowDown) iy = 1; if (keys.KeyA || keys.ArrowLeft) ix = -1; if (keys.KeyD || keys.ArrowRight) ix = 1; } else ix = iy = 0;
  const il = Math.hypot(ix, iy); if (il > 1){ ix /= il; iy /= il; }

  const vx = (fx*-iy + rx*ix)*11, vz = (fz*-iy + rz*ix)*11, moving = il > .1;

  P.vy -= 45*dt; P.y += P.vy*dt; if (P.y <= 0){ P.y = 0; P.vy = 0; P.grounded = true; }

    if (L.legL){ if (moving && P.grounded){ P.walk += dt*11; const s = Math.sin(P.walk)*.75; L.legL.rotation.x = s; L.legR.rotation.x = -s; L.armL.rotation.x = -s; L.armR.rotation.x = holding ? -1.1 : s; }
      else if (!P.grounded){ L.legL.rotation.x = .3; L.legR.rotation.x = -.3; L.armL.rotation.x = -.4; L.armR.rotation.x = holding ? -1.1 : -.4; }
      else { for (const k of ['legL','legR','armL']) L[k].rotation.x *= .8; L.armR.rotation.x = holding ? -1.1 : L.armR.rotation.x*.8; } } }
  const cy = P.y + 2.6, cdx = -Math.sin(camYaw)*Math.cos(camPitch), cdz = -Math.cos(camYaw)*Math.cos(camPitch), cdy = Math.sin(camPitch);
  camera.position.set(P.x + cdx*camDist, Math.max(.5, cy + cdy*camDist), P.z + cdz*camDist); camera.lookAt(P.x, cy, P.z); sky.position.copy(camera.position);
  sun.position.set(P.x + 40, 80, P.z + 25); sun.target.position.set(P.x, 0, P.z); sun.target.updateMatrixWorld();
  tickPlants(dt); tickWeather(dt);
  labCore.rotation.y += dt*1.5; labCore.rotation.x += dt*.7; labCore.position.y = 1.6 + Math.sin(T*2)*.15;
  for (const p of PLOTS){ for (const g of p.sprG.children){ const u = g.userData; if (!u.head) continue; u.head.rotation.y += dt*4; for (const d of u.drops){ d.t = (d.t + dt*.8) % 1; const a = d.a + T*1.5, r = d.t*u.r*.9; d.s.position.set(Math.cos(a)*r, 1.1 + Math.sin(d.t*Math.PI)*1.4 - d.t*.5, Math.sin(a)*r); } }
    for (const g of p.plantG.children){ const u = g.userData; if (u.aura) u.aura.material.opacity = (.35 + u.ti*.04)*(.8 + .2*Math.sin(T*3 + g.position.x)); if (u.halo) u.halo.rotation.z += dt; } }

    const n = Object.keys(NET.ghosts).length, ready = S.plants.filter(p=>p.prog >= 1).length;
    $('plotTag').innerHTML = (myPlot + 1) + '번 밭 · ' + S.plants.length + '/' + S.unlocked + '칸' + (ready ? ' · 수확 ' + ready : '') + (n ? '<br>같은 서버 ' + (n + 1) + '명' : '') + (S.fertUntil > Date.now() ? '<br>🧪 비료 ' + clock((S.fertUntil - Date.now())/1000) : '');
    if (panelKind) $('psub').textContent = '💰 ' + fmt(S.money);
    updatePrompt(); if (dirty){ dirty = false; save(); } }
  renderer.render(scene, camera); }
let last = performance.now();
function loop(now){ requestAnimationFrame(loop); const dt = Math.min(.05, (now - last)/1000); last = now; frame(dt); }

// ---- 시작 ----
buildMe();
{ const away = Math.max(0, (Date.now() - (S.t || Date.now()))/1000); for (const pl of S.plants) pl.prog = Math.min(1, pl.prog + away/pl.sd.growthTime); }   // 떠나 있던 동안도 자란다
if (!S.seeds.length && !S.plants.length && !S.crops.length){ addSeed(makeSeed({ species:'carrot', qty:4 })); addSeed(makeSeed({ species:'strawberry', qty:2 })); }
myPlot = 0; { const p = PLOTS[myPlot]; setSign(p, myName() + '의 밭', '#ffe082'); P.x = p.cx; P.z = p.cz + p.face*(ROWS*SPOT/2 + 5); camYaw = p.face > 0 ? 0 : Math.PI; }
for (const s of S.sprinklers){ const o = PLOTS[S.plot || 0], p = PLOTS[0]; s.x += p.cx - o.cx; s.z += p.cz - o.cz; } S.plot = 0;
syncPlants(); refreshHotbar(); if (hot.length) selectHot(0);
$('loading').remove(); wxNow = curWeather(); applyWeather(wxNow);
toast('씨앗을 들고 내 밭의 칸을 누르면 심어져요 · 가판대 앞에서 E');
requestAnimationFrame(loop);
window.__G = { S, P, TIERS, TI, rollTier, tierProbs, combineSeeds, makeSeed, addSeed, specialStock, curWeather, doPlant, doHarvest, syncPlants, refreshHotbar, openStall, closePanel, useAt, frame, PLOTS, get myPlot(){ return myPlot; }, placeSprinkler, set camYaw(v){ camYaw = v; }, set camPitch(v){ camPitch = v; }, set camDist(v){ camDist = v; }, renderer, applyWeather, setLab(a, b){ labA = a; labB = b; }, doCombine, selectHot, get hot(){ return hot; }, interact, clickWorld };
})();
