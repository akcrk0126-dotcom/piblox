<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>그로우 가든: 인피니티 RNG</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --bg:#0f1113; --panel:#171a1e; --panel2:#1e2227; --line:rgba(255,255,255,.08); --text:#e9ecef; --dim:#8b939c; --faint:#5c646c; --green:#3ddc84; --money:#f2c94c; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
  button { font-family:inherit; color:inherit; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  /* ---- 상단 ---- */
  #top { flex:none; display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  #top .hub { width:32px; height:32px; border-radius:8px; background:var(--panel2); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text); font-size:15px; flex:none; }
  #top .title { font-weight:900; font-size:15px; white-space:nowrap; }
  #top .title small { display:block; font-size:10px; font-weight:700; color:var(--dim); letter-spacing:.06em; }
  #top .sp { flex:1; }
  .chip { display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:9px; background:var(--panel2); font-size:12px; font-weight:800; white-space:nowrap; }
  .chip i { font-style:normal; color:var(--dim); font-weight:700; font-variant-numeric:tabular-nums; }
  #money { color:var(--money); font-size:14px; font-variant-numeric:tabular-nums; }
  /* ---- 본문 ---- */
  #main { flex:1; display:flex; min-height:0; }
  #farmWrap { flex:1; position:relative; overflow:auto; padding:14px; min-width:0; }
  #side { width:400px; flex:none; display:flex; flex-direction:column; border-left:1px solid var(--line); background:var(--panel); min-height:0; }
  #tabs { flex:none; display:flex; border-bottom:1px solid var(--line); }
  #tabs button { flex:1; padding:11px 0; background:none; border:none; font-size:13px; font-weight:800; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; position:relative; }
  #tabs button.on { color:var(--text); border-bottom-color:var(--text); }
  #tabs button b { position:absolute; top:6px; right:14%; min-width:16px; height:16px; border-radius:8px; background:#e5484d; color:#fff; font-size:10px; line-height:16px; padding:0 4px; display:none; }
  .pane { flex:1; overflow:auto; padding:12px; display:none; min-height:0; }
  .pane.on { display:block; }
  @media (max-width:820px){
    #main { flex-direction:column; }
    #side { width:auto; height:52%; border-left:none; border-top:1px solid var(--line); }
    #farmWrap { padding:10px; }
    #top .title small { display:none; }
    .hideM { display:none !important; }
  }
  /* ---- 농장 ---- */
  #farmHead { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  #farmHead h3 { font-size:14px; font-weight:900; margin-right:auto; }
  .btn { border:none; border-radius:9px; padding:8px 12px; font-size:12px; font-weight:800; cursor:pointer; background:var(--panel2); }
  .btn:hover { filter:brightness(1.15); } .btn:active { transform:scale(.97); }
  .btn.pri { background:#e9ecef; color:#111; } .btn.ok { background:var(--green); color:#07210f; } .btn:disabled { opacity:.4; cursor:default; transform:none; filter:none; }
  #farm { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:8px; }
  .tile { position:relative; aspect-ratio:1; border-radius:12px; background:linear-gradient(180deg,#4a3526,#3a2a1e); box-shadow:inset 0 -6px 0 rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.04); cursor:pointer; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .tile::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 6px, transparent 6px 12px); pointer-events:none; }
  .tile.empty:hover { background:linear-gradient(180deg,#56402f,#433124); }
  .tile.planting { box-shadow:inset 0 0 0 2px #e9ecef; }
  .tile .pl { position:relative; font-size:40px; line-height:1; transition:transform .3s; filter:drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
  .tile .bar { position:absolute; left:8px; right:8px; bottom:7px; height:5px; border-radius:3px; background:rgba(0,0,0,.35); overflow:hidden; }
  .tile .bar i { display:block; height:100%; background:var(--green); }
  .tile .tt { position:absolute; left:6px; top:5px; font-size:9.5px; font-weight:900; letter-spacing:.02em; text-shadow:0 1px 2px #000; }
  .tile .tm { position:absolute; right:6px; top:5px; font-size:9.5px; font-weight:700; color:#cfd4d9; text-shadow:0 1px 2px #000; font-variant-numeric:tabular-nums; }
  .tile.ready { animation:bob 1.6s ease-in-out infinite; }
  .tile.ready .pl { transform:scale(1.08); }
  @keyframes bob { 50% { transform:translateY(-2px); } }
  .tile .hv { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:900; background:rgba(0,0,0,.55); padding:2px 7px; border-radius:6px; white-space:nowrap; }
  .tile.lock { background:#1b1e22; box-shadow:inset 0 0 0 1px var(--line); color:var(--faint); font-size:11px; font-weight:800; flex-direction:column; gap:3px; }
  #plantBar { margin-top:12px; padding:10px; border-radius:12px; background:var(--panel); border:1px solid var(--line); }
  #plantBar .hd { font-size:12px; font-weight:800; color:var(--dim); margin-bottom:8px; display:flex; justify-content:space-between; }
  #seedRow { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .sd { flex:none; width:64px; padding:6px 4px 5px; border-radius:10px; background:var(--panel2); border:1px solid transparent; text-align:center; cursor:pointer; position:relative; }
  .sd.on { border-color:#e9ecef; }
  .sd .e { font-size:24px; } .sd .n { font-size:9.5px; font-weight:800; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .sd .q { position:absolute; top:3px; right:5px; font-size:10px; font-weight:900; color:var(--dim); }
  /* ---- 등급 표시 ---- */
  .tier { font-weight:900; }
  .fx-Rare { filter:drop-shadow(0 0 4px #4ea3ff) drop-shadow(0 3px 2px rgba(0,0,0,.35)) !important; }
  .fx-Epic { filter:drop-shadow(0 0 6px #a970ff) drop-shadow(0 3px 2px rgba(0,0,0,.35)) !important; }
  .fx-Legendary { filter:drop-shadow(0 0 8px #ffb020) !important; animation:flick 1.2s infinite; }
  .fx-Mythic { filter:drop-shadow(0 0 9px #ff4d6d) drop-shadow(0 0 2px #fff) !important; }
  .fx-Beast { filter:drop-shadow(0 0 10px #3ddc84) hue-rotate(-20deg) saturate(1.4) !important; animation:growl 2s infinite; }
  .fx-Celestial { filter:drop-shadow(0 0 12px #8fd3ff) drop-shadow(0 0 3px #fff) !important; }
  .fx-Divine { filter:drop-shadow(0 0 14px #ffe27a) brightness(1.15) !important; }
  .fx-Ultra { filter:drop-shadow(0 0 12px #5ef0ff) !important; animation:zap .5s steps(2) infinite; }
  .fx-Hyper { filter:drop-shadow(-8px 0 6px #ff5ef2) drop-shadow(8px 0 6px #5ef0ff) !important; animation:hyper .6s infinite; }
  .fx-Infinity { filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 30px #b98cff) !important; animation:cosmic 3s linear infinite; }
  .fx-Hidden { filter:invert(1) drop-shadow(0 0 10px #ff003c) !important; animation:glitch .35s steps(2) infinite; }
  .var-Golden { filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 6px #ffd24a) !important; }
  .var-Rainbow { animation:rainbow 2s linear infinite !important; }
  @keyframes flick { 50% { filter:drop-shadow(0 0 12px #ff7a1a); } }
  @keyframes growl { 50% { transform:scale(1.08) rotate(-4deg); } }
  @keyframes zap { 50% { filter:drop-shadow(0 0 3px #5ef0ff) brightness(1.6); } }
  @keyframes hyper { 50% { transform:translateX(2px) skewX(-6deg); } }
  @keyframes cosmic { to { transform:rotate(360deg); } }
  @keyframes glitch { 0% { transform:translate(-2px,1px); } 100% { transform:translate(2px,-1px); } }
  @keyframes rainbow { from { filter:hue-rotate(0) saturate(2) drop-shadow(0 0 6px #fff); } to { filter:hue-rotate(360deg) saturate(2) drop-shadow(0 0 6px #fff); } }
  .aura { position:absolute; inset:10%; border-radius:50%; pointer-events:none; }
  .aura.Celestial, .aura.Divine, .aura.Ultra, .aura.Hyper, .aura.Infinity, .aura.Hidden { animation:auraSpin 4s linear infinite; }
  .aura.Celestial { background:radial-gradient(circle, rgba(143,211,255,.35), transparent 65%); }
  .aura.Divine { background:radial-gradient(circle, rgba(255,226,122,.45), transparent 65%); box-shadow:0 -28px 0 -24px #ffe27a; }
  .aura.Ultra { background:conic-gradient(from 0deg, transparent, rgba(94,240,255,.4), transparent 30%); }
  .aura.Hyper { background:conic-gradient(from 0deg, rgba(255,94,242,.4), rgba(94,240,255,.4), rgba(255,94,242,.4)); filter:blur(6px); }
  .aura.Infinity { background:conic-gradient(#ff6b6b, #ffe36b, #7be08a, #6bb8ff, #b48cff, #ff6b6b); filter:blur(10px); opacity:.6; }
  .aura.Hidden { background:radial-gradient(circle, rgba(255,0,60,.5), transparent 60%); }
  @keyframes auraSpin { to { transform:rotate(360deg); } }
  /* ---- 카드/목록 ---- */
  .sec { font-size:11px; font-weight:900; color:var(--dim); letter-spacing:.06em; margin:4px 0 8px; display:flex; align-items:center; justify-content:space-between; }
  .item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:11px; background:var(--panel2); margin-bottom:6px; border:1px solid transparent; }
  .item.sel { border-color:#e9ecef; }
  .item .ic { width:40px; height:40px; flex:none; border-radius:9px; background:rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; font-size:24px; position:relative; }
  .item .inf { flex:1; min-width:0; }
  .item .nm { font-size:13px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .sub { font-size:11px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .val { font-size:12px; font-weight:900; color:var(--money); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .traits { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .tr { font-size:10px; font-weight:800; padding:2px 6px; border-radius:5px; background:rgba(255,255,255,.07); color:#cfd4d9; }
  .vb { font-size:10px; font-weight:900; padding:1px 5px; border-radius:4px; margin-left:4px; }
  .vb.Golden { background:#f2c94c; color:#231800; } .vb.Rainbow { background:linear-gradient(90deg,#ff6b6b,#ffe36b,#7be08a,#6bb8ff,#b48cff); color:#111; }
  .row { display:flex; gap:6px; align-items:center; }
  .muted { color:var(--dim); font-size:12px; line-height:1.6; }
  .timer { font-variant-numeric:tabular-nums; }
  select.sel2 { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:700 12px inherit; }
  /* ---- 연구소 ---- */
  #labSlots { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .slot { flex:1; height:96px; border-radius:12px; border:1.5px dashed rgba(255,255,255,.18); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:11px; color:var(--dim); cursor:pointer; text-align:center; padding:6px; position:relative; }
  .slot.full { border-style:solid; border-color:rgba(255,255,255,.25); background:var(--panel2); color:var(--text); }
  .slot .e { font-size:32px; }
  #labPlus { font-size:18px; color:var(--faint); font-weight:900; }
  #reel { height:74px; border-radius:12px; background:#0b0d0f; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900; letter-spacing:.04em; margin-bottom:10px; overflow:hidden; position:relative; }
  #reel.go { animation:reelPulse .12s infinite; }
  @keyframes reelPulse { 50% { background:#12151a; } }
  #odds { width:100%; border-collapse:collapse; font-size:11.5px; }
  #odds td { padding:4px 4px; border-bottom:1px solid var(--line); }
  #odds td:nth-child(2), #odds td:nth-child(3) { text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); }
  #odds tr.boost td:nth-child(2) { color:var(--green); font-weight:800; }
  /* ---- 로그 ---- */
  #log .l { font-size:12px; padding:7px 9px; border-radius:8px; background:var(--panel2); margin-bottom:5px; line-height:1.5; }
  #log .l time { color:var(--faint); font-size:10.5px; margin-right:6px; font-variant-numeric:tabular-nums; }
  /* ---- 알림/오버레이 ---- */
  #toast { position:fixed; left:50%; top:62px; transform:translate(-50%,-8px); background:rgba(20,22,26,.95); border:1px solid var(--line); padding:9px 14px; border-radius:10px; font-size:13px; font-weight:800; opacity:0; transition:.25s; z-index:50; pointer-events:none; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  #banner { position:fixed; left:0; right:0; top:52px; z-index:55; display:flex; justify-content:center; pointer-events:none; }
  #banner .b { margin-top:8px; padding:12px 18px; border-radius:12px; font-weight:900; font-size:14px; background:rgba(12,14,17,.96); border:1px solid rgba(255,255,255,.18); box-shadow:0 10px 30px rgba(0,0,0,.5); animation:bannerIn 5s forwards; max-width:94vw; text-align:center; }
  @keyframes bannerIn { 0% { transform:translateY(-30px); opacity:0; } 8%,85% { transform:none; opacity:1; } 100% { opacity:0; } }
  #weatherFx { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:6; }
  #reveal { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.75); }
  #reveal.on { display:flex; }
  #reveal .card { width:min(90vw,340px); border-radius:18px; background:var(--panel); border:1px solid var(--line); padding:22px 18px 16px; text-align:center; position:relative; overflow:hidden; }
  #reveal .big { font-size:80px; margin:6px 0 10px; position:relative; display:inline-block; }
  #reveal .tn { font-size:22px; font-weight:900; letter-spacing:.03em; }
  #reveal .nm { font-size:14px; font-weight:800; margin-top:4px; }
  #reveal .v { font-size:13px; color:var(--money); font-weight:900; margin:8px 0 4px; }
  #reveal .odd { font-size:11px; color:var(--dim); }
  #reveal .rays { position:absolute; inset:-50%; background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.06) 0 10deg, transparent 10deg 20deg); animation:auraSpin 12s linear infinite; pointer-events:none; }
  #cut { position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; flex-direction:column; background:#000; color:#fff; text-align:center; }
  #cut.on { display:flex; }
  #cut .g { font:900 min(12vw,72px) monospace; letter-spacing:.1em; animation:glitch .12s steps(2) infinite; text-shadow:3px 0 #ff003c, -3px 0 #00e5ff; }
  #cut .s { margin-top:16px; font:700 13px monospace; color:#9aa; min-height:20px; }
  #cut.cosmic { background:radial-gradient(circle at 50% 50%, #2a1450, #05030d 70%); }
  #cut.cosmic .g { animation:none; text-shadow:0 0 30px #b98cff, 0 0 60px #6bb8ff; font-family:inherit; }
  #online { font-size:11px; color:var(--dim); }
</style>

<meta name="theme-color" content="#0f1113">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<body>
<canvas id="weatherFx"></canvas><div id="flash"></div>
<div id="app">
  <div id="top">
    <a class="hub" href="hub.html" title="허브">⌂</a>
    <div class="title">그로우 가든<small>PLANT DNA · INFINITY RNG</small></div>
    <div class="sp"></div>
    <div class="chip" id="wxChip" title="날씨 (모두 같은 날씨)"><span id="wxName">☀ 맑음</span><i id="wxT">3:00</i></div>
    <div class="chip hideM" title="특별 상점 재입고"><span>재입고</span><i id="rsT">5:00</i></div>
    <div class="chip"><span id="money">0</span></div>
  </div>
  <div id="main">
    <div id="farmWrap">
      <div id="farmHead"><h3>내 밭 <span id="online"></span></h3>
        <button class="btn" id="harvestAll" type="button">모두 수확</button>
        <button class="btn" id="expandBtn" type="button">밭 넓히기</button></div>
      <div id="farm"></div>
      <div id="plantBar"><div class="hd"><span>심을 씨앗 고르기 → 빈 밭 누르기</span><span id="plantHint"></span></div><div id="seedRow"></div></div>
    </div>
    <div id="side">
      <div id="tabs">
        <button data-t="shop" class="on" type="button">상점</button>
        <button data-t="lab" type="button">연구소</button>
        <button data-t="bag" type="button">가방<b id="bagN"></b></button>
        <button data-t="log" type="button">기록</button>
      </div>
      <div class="pane on" id="p-shop">
        <div class="sec"><span>특별 상점 · 한정 재고</span><span class="timer" id="rsT2">5:00</span></div>
        <div id="spShop"></div>
        <div class="sec" style="margin-top:14px"><span>일반 상점</span><span>항상 판매</span></div>
        <div id="regShop"></div>
      </div>
      <div class="pane" id="p-lab">
        <div class="sec"><span>DNA 합성기</span><span id="luckTxt"></span></div>
        <div id="labSlots"><div class="slot" id="slotA">A<br>가방에서 고르기</div><div id="labPlus">+</div><div class="slot" id="slotB">B<br>가방에서 고르기</div></div>
        <div id="reel">?</div>
        <div class="row" style="margin-bottom:12px"><button class="btn pri" id="combineBtn" type="button" style="flex:1;padding:12px">합성하기</button><label class="muted" style="display:flex;align-items:center;gap:5px;font-size:11px"><input type="checkbox" id="fastRoll"> 빠르게</label></div>
        <div class="muted" style="font-size:11px;margin-bottom:10px">두 개(작물 또는 씨앗)를 넣으면 사라지고 새 하이브리드 씨앗이 나와요. 부모의 특성은 하나씩 70% 확률로 물려받고, 10% 확률로 새 특성이 생겨요. 부모 등급이 높을수록 운이 올라가요.</div>
        <div class="sec"><span>등급 확률 (지금 기준)</span><span>배율</span></div>
        <table id="odds"></table>
      </div>
      <div class="pane" id="p-bag">
        <div class="sec"><span id="bagTitle">작물</span><span class="row"><select class="sel2" id="sortSel"><option value="val">가치순</option><option value="tier">등급순</option><option value="new">최신순</option></select></span></div>
        <div class="row" style="margin-bottom:10px;flex-wrap:wrap">
          <button class="btn" id="bagCrops" type="button">작물</button><button class="btn" id="bagSeeds" type="button">씨앗</button>
          <span style="flex:1"></span>
          <button class="btn" id="sellLow" type="button">레전더리 미만 팔기</button><button class="btn" id="sellAll" type="button">모두 팔기</button>
        </div>
        <div id="bag"></div>
      </div>
      <div class="pane" id="p-log">
        <div class="sec"><span>발견한 등급</span><span id="rolls"></span></div>
        <div id="dex" class="traits" style="margin-bottom:14px"></div>
        <div class="sec"><span>기록</span></div>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="banner"></div>
<div id="reveal"><div class="card"><div class="rays"></div>
  <div class="tn" id="rvTier">Common</div><div class="big" id="rvIcon">🥕</div>
  <div class="nm" id="rvName"></div><div class="traits" id="rvTraits" style="justify-content:center;margin-top:8px"></div>
  <div class="v" id="rvVal"></div><div class="odd" id="rvOdd"></div>
  <button class="btn pri" id="rvOk" type="button" style="margin-top:14px;width:100%;padding:11px">확인</button>
</div></div>
<div id="cut"><div class="g" id="cutG">ERROR</div><div class="s" id="cutS"></div></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
// =====================================================================
//  데이터 정의
// =====================================================================
// 등급: 위에서부터(가장 희귀한 것부터) 확률 검사. p = 기본 확률, mult = 가치 배율
const TIERS = [
  { k:'Common',    ko:'커먼',       p:1/2,        mult:1,      col:'#b8c0c8' },
  { k:'Rare',      ko:'레어',       p:1/4,        mult:5,      col:'#4ea3ff' },
  { k:'Epic',      ko:'에픽',       p:1/8,        mult:25,     col:'#a970ff' },
  { k:'Legendary', ko:'레전더리',   p:1/20,       mult:120,    col:'#ffb020' },
  { k:'Mythic',    ko:'미스틱',       p:1/50,       mult:500,    col:'#ff4d6d' },
  { k:'Beast',     ko:'비스트',     p:1/125,      mult:2500,   col:'#3ddc84' },
  { k:'Celestial', ko:'셀레스티얼', p:1/500,      mult:15000,  col:'#8fd3ff' },
  { k:'Divine',    ko:'디바인',     p:1/2000,     mult:1e5,    col:'#ffe27a' },
  { k:'Ultra',     ko:'울트라',     p:1/1e4,      mult:1e6,    col:'#5ef0ff' },
  { k:'Hyper',     ko:'하이퍼',     p:1/1e5,      mult:1e7,    col:'#ff5ef2' },

const TI = {}; TIERS.forEach((t, i)=>{ TI[t.k] = i; t.i = i; });
const ALERT_AT = TI.Celestial;
// 변이(색 변형)
const VARIANTS = { Normal:{ ko:'', mult:1 }, Golden:{ ko:'골든', mult:20 }, Rainbow:{ ko:'레인보우', mult:50 } };
// 특성 풀: mult 는 곱으로 쌓인다(개수 제한 없음). grow = 자라는 시간 배율, luck = 합성 운 +, twin = 두 개 수확
const TRAITS = {
  Giant:{ ko:'거대', mult:2 },            Speedy:{ ko:'쾌속', mult:1.2, grow:.7 },   Overcharged:{ ko:'과충전', mult:3 },
  Mutant:{ ko:'돌연변이', mult:2.5 },     Frozen:{ ko:'얼음', mult:1.8 },            Blazing:{ ko:'불꽃', mult:2.2 },
  Shiny:{ ko:'반짝', mult:1.5 },          Ancient:{ ko:'고대', mult:4, grow:1.3 },   Toxic:{ ko:'독성', mult:1.6 },
  Lucky:{ ko:'행운', mult:1.3, luck:.5 }, Twin:{ ko:'쌍둥이', mult:1, twin:true },   Glowing:{ ko:'발광', mult:1.4 },
  Crystal:{ ko:'수정', mult:3.5 },        Starlit:{ ko:'별빛', mult:5 },             Electric:{ ko:'전기', mult:2.8 },
  Sweet:{ ko:'달콤', mult:1.3 },          Heavy:{ ko:'묵직', mult:1.7 },             Void:{ ko:'공허', mult:8, rare:true },
};
const TRAIT_KEYS = Object.keys(TRAITS);
// 기본 작물 (일반 상점)
const SPECIES = {
  carrot:    { ko:'당근',     e:'🥕', base:8,    grow:12,  cost:10 },
  strawberry:{ ko:'딸기',     e:'🍓', base:14,   grow:18,  cost:20 },
  blueberry: { ko:'블루베리', e:'🫐', base:22,   grow:24,  cost:35 },
  tomato:    { ko:'토마토',   e:'🍅', base:35,   grow:30,  cost:60 },
  corn:      { ko:'옥수수',   e:'🌽', base:55,   grow:40,  cost:100 },
  grape:     { ko:'포도',     e:'🍇', base:90,   grow:50,  cost:170 },
  pumpkin:   { ko:'호박',     e:'🎃', base:150,  grow:65,  cost:300 },
  watermelon:{ ko:'수박',     e:'🍉', base:240,  grow:80,  cost:500 },
  peach:     { ko:'복숭아',   e:'🍑', base:380,  grow:95,  cost:800 },
  mushroom:  { ko:'버섯',     e:'🍄', base:600,  grow:110, cost:1300 },
  pineapple: { ko:'파인애플', e:'🍍', base:950,  grow:130, cost:2100 },
  coconut:   { ko:'코코넛',   e:'🥥', base:1500, grow:150, cost:3400 },
};
const SPEC_KEYS = Object.keys(SPECIES);
const MAX_TILES = 30, START_TILES = 6;
// 날씨 (모든 사람이 같은 날씨 — 서버 시계로 3분마다)
const WEATHER = {
  sunny:  { ko:'맑음',       ic:'☀', trait:null },
  acid:   { ko:'산성비',     ic:'☔', trait:'Toxic',    desc:'돌연변이·특성 유전 3배' },
  storm:  { ko:'뇌우',       ic:'⛈', trait:'Electric', desc:'울트라·하이퍼 확률 10배' },
  meteor: { ko:'유성우',     ic:'☄', trait:'Starlit',  desc:'특별 상점 셀레스티얼·디바인 10배' },
  rainbow:{ ko:'무지개',     ic:'🌈', trait:'Shiny',    desc:'레인보우 변이 5%' },
};
const WX_CYCLE = 180e3, RESTOCK = 300e3;

// =====================================================================
//  도구
// =====================================================================
const sNow = () => (window.MP && MP.serverNow) ? MP.serverNow() : Date.now();
function hash(n){ n = (n ^ 0x9e3779b9) >>> 0; n = Math.imul(n ^ (n >>> 16), 0x85ebca6b) >>> 0; n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35) >>> 0; return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
function seeded(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n){ if (!isFinite(n)) return '∞'; if (n < 1000) return String(Math.floor(n)); let i = 0; while (n >= 1000 && i < SUF.length - 1){ n /= 1000; i++; } if (n >= 1000) return n.toExponential(2);
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + SUF[i]; }
const esc = t => String(t).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const clock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0'); };
let uidN = 0; const uid = p => p + '_' + Date.now().toString(36) + (uidN++).toString(36) + Math.floor(Math.random()*1e4).toString(36);
function oddsTxt(p){ if (p >= 1) return '100%'; const inv = 1/p; return inv < 1000 ? '1/' + (Math.round(inv*10)/10) : '1/' + fmt(inv); }

// =====================================================================
//  상태 (저장)
// =====================================================================
const SAVE_KEY = 'garden_save_v1';
let S = null;
function fresh(){ return { money:60, tiles:[], unlocked:START_TILES, seeds:[], crops:[], rolls:0, found:{}, bestVal:0, bestTier:0, logs:[], shopSlot:-1, bought:{} }; }
try { S = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){ S = null; }
if (!S || typeof S !== 'object') S = fresh();
S = Object.assign(fresh(), S);
while (S.tiles.length < MAX_TILES) S.tiles.push(null);
if (!S.seeds.length && !S.crops.length && S.tiles.every(t=>!t) && S.money < 10){ S.money = 60; }
let dirty = true;
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
setInterval(save, 4000); addEventListener('pagehide', save);

// =====================================================================
//  씨앗 · 가치 계산
// =====================================================================
function traitMult(traits){ let m = 1; for (const t of traits || []) m *= (TRAITS[t] ? TRAITS[t].mult : 1); return m; }
// 기본 가치 = 작물 기본값 × 등급 배율 × 변이 배율 × 특성 배율(곱)
function seedValue(sd){ return SPECIES[sd.species].base * TIERS[TI[sd.tier]].mult * VARIANTS[sd.variant].mult * traitMult(sd.traits); }
function growthTime(sd){ let g = SPECIES[sd.species].grow * (1 + TI[sd.tier] * 0.12); for (const t of sd.traits) if (TRAITS[t] && TRAITS[t].grow) g *= TRAITS[t].grow; return Math.max(5, Math.round(g)); }
function makeSeed(o){
  const sd = Object.assign({ id:uid('seed'), kind:'seed', isPrimary:true, species:'carrot', tier:'Common', variant:'Normal', traits:[], name:'', qty:1 }, o);
  if (!sd.name) sd.name = SPECIES[sd.species].ko;
  sd.baseValue = seedValue(sd); sd.growthTime = growthTime(sd); return sd; }
const seedKey = sd => sd.isPrimary ? ['P', sd.species, sd.tier, sd.variant].join('|') : sd.id;
function addSeed(sd){ const k = seedKey(sd), ex = S.seeds.find(x=>seedKey(x) === k); if (ex && sd.isPrimary) ex.qty += sd.qty || 1; else S.seeds.push(sd); dirty = true; }
function takeSeed(id){ const i = S.seeds.findIndex(x=>x.id === id); if (i < 0) return null; const sd = S.seeds[i];
  if ((sd.qty || 1) > 1){ sd.qty--; return Object.assign({}, sd, { qty:1, id:uid('seed') }); } S.seeds.splice(i, 1); return sd; }
function fullName(x){ return (x.variant !== 'Normal' ? VARIANTS[x.variant].ko + ' ' : '') + TIERS[TI[x.tier]].ko + ' ' + x.name; }
function icon(x, big){ const t = x.tier, cls = 'fx-' + t + (x.variant !== 'Normal' ? ' var-' + x.variant : '');
  return '<span class="' + cls + '" style="display:inline-block">' + SPECIES[x.species].e + '</span>' + (TI[t] >= TI.Celestial ? '<span class="aura ' + t + '"></span>' : ''); }
function traitHTML(tr){ return tr.length ? '<div class="traits">' + tr.map(t=>'<span class="tr">' + (TRAITS[t] ? TRAITS[t].ko : t) + '</span>').join('') + '</div>' : ''; }

// =====================================================================
//  날씨 · 재입고 (서버 시계 기준 — 모두 같은 날씨/같은 재고)
// =====================================================================
function weatherAt(slot){ const r = hash(slot * 7919 + 13); return r < .4 ? 'sunny' : r < .55 ? 'acid' : r < .7 ? 'storm' : r < .85 ? 'meteor' : 'rainbow'; }
function curWeather(){ return weatherAt(Math.floor(sNow() / WX_CYCLE)); }
function wxLeft(){ return (WX_CYCLE - sNow() % WX_CYCLE) / 1000; }
function rsLeft(){ return (RESTOCK - sNow() % RESTOCK) / 1000; }
// 특별 상점 재고: 재입고 번호로 씨앗을 뿌려서 모두 같은 재고 (유성우면 셀레스티얼·디바인 10배)
function specialStock(slot){
  const R = seeded(slot * 131 + 7), wx = weatherAt(Math.floor(slot * RESTOCK / WX_CYCLE)), meteor = wx === 'meteor';
  const n = 4 + Math.floor(R() * 3), out = [];
  for (let i=0;i<n;i++){
    const r = R(); let tier;
    const pDiv = meteor ? .005 : .0005, pCel = meteor ? .035 : .0035;
    if (r < pDiv) tier = 'Divine'; else if (r < pDiv + pCel) tier = 'Celestial'; else if (r < .02) tier = 'Beast'; else if (r < .1) tier = 'Mythic'; else if (r < .38) tier = 'Legendary'; else tier = 'Epic';
    const sp = SPEC_KEYS[Math.floor(Math.pow(R(), 1.6) * SPEC_KEYS.length)];
    const sd = makeSeed({ species:sp, tier, isPrimary:true });
    const price = Math.round(SPECIES[sp].cost * TIERS[TI[tier]].mult * 1.6);
    out.push({ i, sd, price, stock: TI[tier] >= TI.Mythic ? 1 : 1 + Math.floor(R() * 3) });
  }
  return out;
}
function regularStock(){ const out = []; SPEC_KEYS.forEach(k=>{ out.push({ sd:makeSeed({ species:k, tier:'Common' }), price:SPECIES[k].cost });
  if (SPECIES[k].cost >= 60) out.push({ sd:makeSeed({ species:k, tier:'Rare' }), price:SPECIES[k].cost * 6 }); }); return out; }

// =====================================================================
//  RNG: 등급 · 변이 · 특성
// =====================================================================
// luck: 전체 운(부모 등급·행운 특성), 날씨: 뇌우는 울트라·하이퍼 10배
function tierProbs(luck, wx){
  const ps = TIERS.map(t=>t.p * (t.i > 0 ? luck : 1));
  if (wx === 'storm'){ ps[TI.Ultra] *= 10; ps[TI.Hyper] *= 10; }
  // 커먼을 제외한 합이 1을 넘지 않게 (운이 아주 높을 때)
  let rest = 0; for (let i=1;i<ps.length;i++) rest += ps[i]; if (rest > .95){ const k = .95 / rest; for (let i=1;i<ps.length;i++) ps[i] *= k; rest = .95; }
  ps[0] = 1 - rest; return ps;
}
// 위(히든)에서부터 아래로 누적 확률 검사 — 걸린 가장 높은 등급, 아무것도 안 걸리면 커먼
function rollTier(luck, wx){ const ps = tierProbs(luck, wx); const r = Math.random(); let acc = 0;
  for (let i = TIERS.length - 1; i >= 1; i--){ acc += ps[i]; if (r < acc) return TIERS[i].k; } return 'Common'; }
function rollVariant(wx, parents){ const r = Math.random(); const pr = wx === 'rainbow' ? .05 : .001; const pg = .01 + (parents.some(p=>p.variant === 'Golden') ? .04 : 0);
  if (r < pr) return 'Rainbow'; if (r < pr + pg) return 'Golden'; return 'Normal'; }
function labLuck(a, b){ let l = 1 + 0.1 * ((a ? TI[a.tier] : 0) + (b ? TI[b.tier] : 0)); for (const p of [a, b]) if (p && p.traits.includes('Lucky')) l += TRAITS.Lucky.luck; return l; }
function portmanteau(a, b){ if (a === b) return a; const ha = a.slice(0, Math.ceil(a.length/2)), hb = b.slice(Math.floor(b.length/2)); return ha + hb; }

// ---- 연구소 합성 ----
function combineSeeds(A, B){
  const wx = curWeather(), luck = labLuck(A, B);
  const tier = rollTier(luck, wx);
  // 특성: 부모 특성마다 70%(산성비 3배 → 사실상 확정)로 물려받고, 10%(산성비 30%)로 새 특성
  const inherit = wx === 'acid' ? Math.min(1, .7 * 3) : .7, mutate = wx === 'acid' ? .3 : .1;
  const traits = [];
  for (const t of A.traits.concat(B.traits)) if (!traits.includes(t) && Math.random() < inherit) traits.push(t);
  let mutated = null;
  if (Math.random() < mutate){ const pool = TRAIT_KEYS.filter(k=>!traits.includes(k) && (!TRAITS[k].rare || Math.random() < .25)); if (pool.length){ mutated = pool[Math.floor(Math.random()*pool.length)]; traits.push(mutated); } }
  const variant = rollVariant(wx, [A, B]);
  // 종: 값이 더 큰 부모 쪽, 이름은 두 부모 이름을 섞어서
  const sp = SPECIES[A.species].base >= SPECIES[B.species].base ? A.species : B.species;
  const name = portmanteau(A.name.replace(/^.* /, ''), B.name.replace(/^.* /, ''));
  const sd = makeSeed({ species:sp, tier, variant, traits, isPrimary:false, name, parents:[A.name, B.name], born:Date.now() });
  const ps = tierProbs(luck, wx);
  return { sd, mutated, odds:ps[TI[tier]], luck, wx };
}

// =====================================================================
//  농장
// =====================================================================
let plantSel = null;   // 고른 씨앗 id
function tileState(t){ if (!t) return 'empty'; return Date.now() >= t.readyAt ? 'ready' : 'grow'; }
function plant(i){
  if (i >= S.unlocked) return;
  if (S.tiles[i]){ if (tileState(S.tiles[i]) === 'ready') harvest(i); return; }
  if (!plantSel){ toast('아래에서 심을 씨앗을 먼저 골라요'); return; }
  const sd = takeSeed(plantSel); if (!sd){ plantSel = null; renderSeedRow(); return; }
  S.tiles[i] = { sd, plantedAt:Date.now(), readyAt:Date.now() + sd.growthTime * 1000, wx:{} };
  if (!S.seeds.find(x=>x.id === plantSel)) plantSel = S.seeds[0] ? S.seeds[0].id : null;
  dirty = true; renderSeedRow(); renderFarm();
}
function harvest(i){
  const t = S.tiles[i]; if (!t || tileState(t) !== 'ready') return 0;
  const sd = t.sd; const traits = sd.traits.slice();
  // 자라는 동안 겪은 날씨가 특성으로 남을 수 있다 (날씨마다 25%)
  for (const w in t.wx){ const tr = WEATHER[w] && WEATHER[w].trait; if (tr && !traits.includes(tr) && Math.random() < .25) traits.push(tr); }
  const n = traits.includes('Twin') ? 2 : 1;
  for (let k=0;k<n;k++){
    const weight = +(0.8 + Math.random()*0.6).toFixed(2);
    const crop = { id:uid('crop'), kind:'crop', species:sd.species, name:sd.name, tier:sd.tier, variant:sd.variant, traits:traits.slice(), weight, born:Date.now() };
    crop.value = Math.round(seedValue(crop) * weight);
    S.crops.push(crop);
    if (crop.value > S.bestVal){ S.bestVal = crop.value; submit(); }
  }
  S.tiles[i] = null; dirty = true;
  return n;
}
function harvestAll(){ let n = 0; for (let i=0;i<S.unlocked;i++) n += harvest(i); if (n){ toast(n + '개 수확'); renderAll(); } else toast('다 자란 작물이 없어요'); }
const expandCost = () => Math.round(150 * Math.pow(2.4, (S.unlocked - START_TILES) / 3));
function expand(){ if (S.unlocked >= MAX_TILES) return; const c = expandCost(); if (S.money < c){ toast('돈이 부족해요 (' + fmt(c) + ')'); return; }
  S.money -= c; S.unlocked = Math.min(MAX_TILES, S.unlocked + 3); dirty = true; toast('밭이 넓어졌어요'); renderAll(); }

// =====================================================================
//  상점 · 판매
// =====================================================================
function buy(sd, price, spIdx){
  if (S.money < price){ toast('돈이 부족해요'); return; }
  if (spIdx !== undefined){ const slot = Math.floor(sNow() / RESTOCK); if (S.shopSlot !== slot){ S.shopSlot = slot; S.bought = {}; }
    const st = specialStock(slot)[spIdx]; if (!st || (S.bought[spIdx] || 0) >= st.stock){ toast('품절'); return; } S.bought[spIdx] = (S.bought[spIdx] || 0) + 1; }
  S.money -= price; addSeed(makeSeed(Object.assign({}, sd, { id:uid('seed'), qty:1 })));
  if (!plantSel) plantSel = S.seeds[0].id;
  toast(fullName(sd) + ' 씨앗 구입'); renderAll();
}
function sellCrop(id){ const i = S.crops.findIndex(c=>c.id === id); if (i < 0) return; const c = S.crops[i];
  if (TI[c.tier] >= TI.Celestial && !confirm(fullName(c) + ' 을(를) 팔까요? (' + fmt(c.value) + ')')) return;
  S.crops.splice(i, 1); S.money += c.value; if (labA === id) labA = null; if (labB === id) labB = null; toast('+' + fmt(c.value)); dirty = true; renderAll(); }
function sellWhere(fn, label){ const list = S.crops.filter(fn); if (!list.length){ toast('팔 작물이 없어요'); return; }
  const sum = list.reduce((a, c)=>a + c.value, 0); if (!confirm(label + ' ' + list.length + '개를 ' + fmt(sum) + '에 팔까요?')) return;
  S.crops = S.crops.filter(c=>!fn(c)); S.money += sum; labA = labB = null; toast('+' + fmt(sum)); dirty = true; renderAll(); }

// =====================================================================
//  연구소 UI
// =====================================================================
let labA = null, labB = null, labPick = null, rolling = false;
function findItem(id){ return S.crops.find(c=>c.id === id) || S.seeds.find(s=>s.id === id) || null; }
function renderLab(){
  for (const [el, id, L] of [[$('slotA'), labA, 'A'], [$('slotB'), labB, 'B']]){
    const it = id && findItem(id);
    if (it){ el.className = 'slot full'; el.innerHTML = '<div class="e" style="position:relative">' + icon(it) + '</div><div style="font-weight:800;font-size:11px">' + esc(fullName(it)) + '</div><div style="font-size:10px;color:var(--dim)">' + (it.kind === 'crop' ? '작물' : '씨앗') + ' · 특성 ' + it.traits.length + '</div>'; }
    else { el.className = 'slot'; el.innerHTML = L + '<br>가방에서 고르기'; }
  }
  const A = labA && findItem(labA), B = labB && findItem(labB), wx = curWeather(), luck = labLuck(A, B), ps = tierProbs(luck, wx);
  $('luckTxt').textContent = '운 ×' + luck.toFixed(2) + (WEATHER[wx].desc && (wx === 'storm' || wx === 'acid' || wx === 'rainbow') ? ' · ' + WEATHER[wx].ko : '');
  $('odds').innerHTML = TIERS.slice().reverse().map(t=>{ const boost = ps[t.i] > t.p * 1.001 && t.i > 0;
    return '<tr' + (boost ? ' class="boost"' : '') + '><td><span class="tier" style="color:' + t.col + '">' + t.ko + '</span> <span style="color:var(--faint);font-size:10.5px">' + t.k + '</span></td><td>' + oddsTxt(ps[t.i]) + '</td><td>' + (t.k === 'Hidden' ? '???' : '×' + fmt(t.mult)) + '</td></tr>'; }).join('');
  $('combineBtn').disabled = !(A && B) || rolling;
}
function pickForLab(slot){ labPick = slot; showTab('bag'); bagMode = S.crops.length ? 'crops' : 'seeds'; renderBag(); toast('연구소 ' + slot + ' 칸에 넣을 걸 골라요'); }
function takeItem(id){ let i = S.crops.findIndex(c=>c.id === id); if (i >= 0) return S.crops.splice(i, 1)[0];
  const sd = takeSeed(id); if (sd && plantSel === id && !S.seeds.find(x=>x.id === id)) plantSel = null; return sd; }
function doCombine(){
