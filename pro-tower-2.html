  const SEC_COLORS = ['#ffffff','#E5433C','#FF8A2E','#FFD23D','#8BC34A','#43B04A','#26A69A','#2F8CE0','#3F51B5','#9B4FE0','#C2185B','#6D4C41','#00ACC1','#F06292','#546E7A','#FFB300'];

  function addBox(x,y,z,w,h,d,type='normal',opts={}){

  /*@@COURSE*/
  // =====================================================================

  //  · 8개 층, 층 번호 없음 — 색깔로만 구분 (빨·주·노·초·파·남·보·분홍)

  //  · 체크포인트 없음. 빨간 킬파트는 즉사, 주황 데미지 파트·회전바는 체력 감소
  //  · 비밀 길: 거의 안 보이는 유령 발판이 안쪽으로 돌아가 두 번째 장애물을 건너뛴다 (보석 +샤드)
  // =====================================================================
  const FLOORS = 16, ROUND_MS = 18 * 60 * 1000;
  let HARD = 0;   // 꼭대기 층 가중치(0~1): 발판이 작아지고 틈이 벌어지고 함정이 빨라진다
  const R0 = 18, WALL_R = 24, CORE = 5, PAD = 5.4, MIN_RISE = 7;
  const SPAWN_XZ = [-R0 + 7, -R0 + 7], SPAWN_TOP = 0.3;
  const FLOOR_COLORS = ['#4CAF50','#9CCC65','#00897B','#00ACC1','#81D4FA','#1E88E5','#3F51B5','#B39DDB','#8E24AA','#F48FB1','#FDD835','#C0CA33','#795548','#ECEFF1','#455A64','#212121'];   // 빨강=킬, 주황=데미지라 층 색에서 뺌
  const TIERS = FLOOR_COLORS.map(c=>({ name:'', diff:'', color:c, sky:0xcfe6ff }));
  function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  let RNG = mulberry(1);
  const rnd = (a,b) => a + RNG()*(b-a), rint = (a,b) => Math.floor(rnd(a, b+1)), lerp = (a,b,t) => a + (b-a)*t;
  const floorTex = FLOOR_COLORS.map(c => [studTex(c, true), studTex('#' + new THREE.Color(c).lerp(new THREE.Color('#ffffff'), .3).getHexString(), true)]);
  const floorWall = FLOOR_COLORS.map(c => studTex('#' + new THREE.Color(c).lerp(new THREE.Color('#1a1a2a'), .35).getHexString(), true));
  TEX.damage = stripeTex('#ff6d00', '#1b1b1b', 20);
  let CUR_TIER = 0, CUR_LV = 0, DRY = false;
  function tierMap(type){ if (type === 'wall') return floorWall[CUR_TIER]; return floorTex[CUR_TIER][CUR_LV % 2]; }
  // ---- 로컬 좌표(가장자리 방향) → 월드 ----
  // lx = 옆(+ 바깥쪽), lz = 진행 방향. 가장자리 4개를 돌며 나선형으로 올라간다
  const CORNERS = [[-R0,-R0],[R0,-R0],[R0,R0],[-R0,R0]];
  let F = null;
  function setEdge(e){ const a = CORNERS[e%4], b = CORNERS[(e+1)%4]; const ux = Math.sign(b[0]-a[0]), uz = Math.sign(b[1]-a[1]);
    let vx = uz, vz = -ux; if (vx*(a[0]+b[0]) + vz*(a[1]+b[1]) < 0){ vx = -vx; vz = -vz; }
    F = { ox:a[0], oz:a[1], ux, uz, vx, vz }; }
  const W = (lx, lz) => ({ x: F.ox + F.ux*lz + F.vx*lx, z: F.oz + F.uz*lz + F.vz*lx });
  function lbox(lx, y, lz, w, h, d, type='normal', opts={}){
    if (DRY) return { mesh:{ position:{ y }, material:{} }, minX:0,maxX:0,minZ:0,maxZ:0,minY:0,maxY:0 };
    const p = W(lx, lz), alongX = Math.abs(F.ux) > .5;
    if (opts.dir) opts.dir = { x: F.ux*opts.dir.lz, z: F.uz*opts.dir.lz, s: opts.dir.s };
    return addBox(p.x, y, p.z, alongX ? d : w, h, alongX ? w : d, type, opts);
  }
  // 충돌 없는 표시용 줄 (월홉 이음새)
  function lmark(lx, y, lz, w, h, d){ if (DRY) return; const p = W(lx, lz), alongX = Math.abs(F.ux) > .5;
    const m = new THREE.Mesh(new THREE.BoxGeometry(alongX ? d : w, h, alongX ? w : d), new THREE.MeshBasicMaterial({ color:0x111111 })); m.position.set(p.x, y, p.z); ADD_TARGET.add(m); }
  function lplat(lx, top, lz, w, d, type='normal', h=1, opts){ return lbox(lx, top-h/2, lz, w, h, d, type, opts); }
  function lmover(c, lx, lz, axisLat, amp, spd, ph, off){
    if (DRY) return; const p = W(lx, lz);
    const ax = axisLat ? (Math.abs(F.vx) > .5 ? 'x' : 'z') : 'y', sgn = axisLat ? (Math.abs(F.vx) > .5 ? F.vx : F.vz) : 1;

  }
  // 주황 줄무늬 = 데미지 파트 (닿거나 밟으면 체력 -dmg, 넉백)
  function ldmg(lx, y, lz, w, h, d, dmg){ const c = lbox(lx, y, lz, w, h, d, 'damage'); c.dmg = Math.round((dmg || 20) * (1 + HARD*0.6));
    return c; }
  let X = 0, Y = 0, Z = 0;   // X=옆(lx), Z=진행(lz)
  const OB = {
    gaps(d){ const n = rint(3,4); for (let i=0;i<n;i++){ const g = lerp(2.2, 4.0, d) + rnd(-.2,.2), dy = rnd(.3, lerp(.9, 1.4, d)), sz = lerp(2.4, 1.3, d);
      Z += g; Y += dy; X = Math.max(-2.5, Math.min(1.5, X + rnd(-1,1)*lerp(.4,1.2,d))); lplat(X, Y, Z+sz/2, sz, sz); Z += sz; } },
    stairs(d){ for (let i=0;i<4;i++){ Z += lerp(1.2, 2.4, d); Y += lerp(1.3, 2.1, d); const sz = lerp(2.2, 1.5, d); lplat(X, Y, Z+sz/2, sz+.4, sz); Z += sz; } },
    zigzag(d){ const n = rint(4,5), sz = lerp(1.6, 0.9, d); let side = 1; for (let i=0;i<n;i++){ Z += lerp(1.4, 2.6, d); side = -side; Y += .5; lplat(X - 1 + side*lerp(.9, 1.7, d), Y, Z+sz/2, sz, sz); Z += sz; } },

    lava(d){ const n = rint(4,5), sz = lerp(1.8, 1.0, d), z0 = Z; for (let i=0;i<n;i++){ Z += lerp(1.6, 2.8, d); Y += .4; lplat(X + rnd(-1,1)*lerp(.6,1.3,d), Y, Z+sz/2, sz, sz); Z += sz; }

    movers(d){ const n = 2; for (let i=0;i<n;i++){ Z += 1.4; Y += .6; const c = lplat(X, Y, Z+1.5, 2.6, 3); lmover(c, X, Z+1.5, true, lerp(2.0,2.8,d), lerp(1.0,2.0,d), i*1.9); Z += 3; } },
    conveyor(d){ const len = 9; lplat(X, Y, Z+len/2, 2.6, len, 'conveyor', 1, { dir:{ lz:-1, s:lerp(4,7.2,d) } }); Z += len; },
    truss(d){ Z += 1.2; lplat(X, Y, Z+0.6, 3, 1.2); const h = lerp(6, 9, d); lbox(X, Y+h/2, Z+1.2+0.65, 1.3, h, 1.3, 'truss'); Z += 2.5; Y += h; Z += 2.8; lplat(X, Y, Z+1.3, 2.6, 2.6); Z += 2.6; },
    trussFlick(d){ Z += 1.2; lplat(X, Y, Z+0.6, 3, 1.2); const tz = Z + 1.2 + 0.65;

    ladderFlick(d){ const wz = Z + 1.75; lbox(X, Y+7, wz+0.5, 3.4, 14, 1, 'wall'); lbox(X, Y+3, wz-0.125, 2.2, 6, 0.25, 'ladder'); lbox(X, Y+11.5, wz-0.125, 2.2, 5, 0.25, 'ladder');

    wrap(d){ const n = d < .45 ? 1 : d < .8 ? 2 : 3; Z += 2; lplat(X, Y, Z+1.5, 3, 3); Z += 3; lbox(X, Y+1, Z+STUD/2, 3 + 2*n*STUD, 10, STUD, 'wall'); Z += STUD; lplat(X, Y, Z+1.5, 3, 3); Z += 3; },

    // 월홉 벽은 두 블럭을 가운데서 맞붙여 만든다 → 가운데 이음새(검은 줄)에서만 월홉 가능

    crumble(d){ const n = 5, dl = lerp(.6, .35, d) * (1 - HARD*0.35); for (let i=0;i<n;i++){ Z += lerp(1.8, 2.6, d); Y += .6; const c = lplat(X + (i%2? .7 : -.7), Y, Z+1.1, 2.2, 2.2, 'crumble'); if (!DRY) crumbles[crumbles.length-1].delay = dl; Z += 2.2; } },

  function adoptStart(rs){ if (rs && rs > 1e12 && rs < roomStart - 500){ roomStart = rs; adopted = true; startChanged = true; } }
  if (mpOn){
    MP.onPlayersUpdate(players=>{
      const seen={};
      Object.keys(players||{}).forEach(uid=>{ const p=players[uid]; if (!p) return; seen[uid]=true;
        let gh=ghosts[uid]; const key=JSON.stringify(p.avatarLoadout||{}); adoptStart(+p.rs);
        if (!gh || gh.key!==key){ let g; try { g=MP.buildAvatar(p.avatarLoadout||{}); } catch(e){ g=null; }
          if (!g){ g=new THREE.Group(); const m=new THREE.Mesh(new THREE.BoxGeometry(1.2,3.4,.6), new THREE.MeshStandardMaterial({color:0x4a90ff})); m.position.y=1.7; g.add(m); } const ns=nameSprite(p.name||'플레이어'); g.add(ns); if (gh){ g.position.copy(gh.g.position); scene.remove(gh.g); } scene.add(g); gh=ghosts[uid]={ g, key, t:{x:p.x||0,y:p.y||0,z:p.z||0,ry:p.ry||0}, ry:p.ry||0 }; }
        gh.t={x:p.x||0,y:p.y||0,z:p.z||0,ry:p.ry||0}; gh.name = p.name || '플레이어'; gh.b = +p.b || 0; });
      Object.keys(ghosts).forEach(u=>{ if (!seen[u]){ scene.remove(ghosts[u].g); delete ghosts[u]; } });
      $('mpStatus').textContent = Object.keys(ghosts).length ? `같이 접속 중: ${Object.keys(ghosts).length+1}명` : '나 혼자 접속 중';
    });
    MP.init('protower_' + URL_ROOM, (uid, err)=>{
      if (err){ $('roomTxt').textContent='연결 실패'; return; }
      try { MP.setPresence('protower', URL_ROOM); } catch(e){}
      // 서버 시계 보정 뒤, 아직 친구 타이머를 못 받았으면 내 입장 시각을 서버 기준으로 다시 잡는다
      setTimeout(()=>{ if (!adopted){ roomStart = sNow() - (performance.now() - LOAD_PERF); startChanged = 'silent'; } }, 1500);
      if (MP.fetchAccountAvatarLoadout) MP.fetchAccountAvatarLoadout(l=>{ if (l) buildMe(l); });
    });
  } else $('mpStatus').textContent = '오프라인';
  let mpT = 0;

  // ---------- 메인 루프 ----------
  const clock = new THREE.Clock();
  updateStageTag();
  let simPaused = false;   // 테스트용: 외부에서 프레임을 직접 돌릴 수 있게
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    renderer.render(scene, camera);
  }
  function frame(dt){
    time += dt;
    refreshNear();

    // 움직이는 것들
    for (const m of movers){ const prev = { x:m.c.mesh.position.x, y:m.c.mesh.position.y, z:m.c.mesh.position.z };
      const o = Math.sin(time*m.spd + m.ph) * m.amp + (m.off||0);
      const nx = m.base.x + (m.ax==='x'?o:0), ny = m.base.y + (m.ax==='y'?o:0), nz = m.base.z + (m.ax==='z'?o:0);
      setBox(m.c, nx, ny, nz);
      if (groundC === m.c && grounded){ pos.x += nx-prev.x; pos.y += ny-prev.y; pos.z += nz-prev.z; } }
    for (const tb of timed){ const on = Math.floor(time/(tb.per||1.6) + tb.ph) % 2 === 0; tb.c.disabled = !on; tb.c.mesh.material.opacity = on ? 1 : 0.18; }
    for (const cr of crumbles){

      else if (cr.state==='gone'){ cr.t+=dt; if (cr.t>2.6){ cr.state='idle'; cr.t=0; cr.c.mesh.visible=true; cr.c.disabled=false; } }

        const along = dx*ca - dz*sa, perp = Math.abs(dx*sa + dz*ca);   // 막대(로컬 x축)까지 거리
        if (Math.abs(along) < sp.len + 0.3 && perp < 0.5){ const sg = Math.sign(sp.spd) || 1, l = Math.hypot(dx, dz) || 1;
          hurt(34, (dx*0.5 + dz*sg)/l, (dz*0.5 - dx*sg)/l, 15); break; } } }

    if (deadT > 0){ updateDeath(dt); camera.lookAt(pos.x, pos.y + 1, pos.z); sky.position.copy(camera.position); gameFrame(dt); updateConfetti(dt); return; }
    // 카메라 & 입력
    const follow = shiftLock ? 1 : Math.min(1, 16*dt);
    camYaw += (rawYaw-camYaw)*follow; camPitch += (rawPitch-camPitch)*follow;
    let inX = moveVec.x, inY = moveVec.y;
    if (keys.KeyW||keys.ArrowUp) inY=-1; if (keys.KeyS||keys.ArrowDown) inY=1; if (keys.KeyA||keys.ArrowLeft) inX=-1; if (keys.KeyD||keys.ArrowRight) inX=1;
    if (finished){ inX=0; inY=0; }

    const fwd = new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw)), right = new THREE.Vector3(-Math.cos(camYaw),0,Math.sin(camYaw));

    const moving = moveDir.lengthSq() > 1e-4; if (moving) moveDir.normalize();

    // 방향(판정 박스도 같이 돈다) + 플릭 감지
    const spd = Math.hypot(curSpeed.x, curSpeed.y);
    if (shiftLock) facing = camYaw;
    else if (moving || spd > 0.4){ const tf = moving ? Math.atan2(moveDir.x, moveDir.z) : Math.atan2(curSpeed.x, curSpeed.y); let d=tf-facing; d=Math.atan2(Math.sin(d),Math.cos(d)); facing += d*Math.min(1,12*dt); }
    let dF = facing - prevFacing; dF = Math.atan2(Math.sin(dF), Math.cos(dF));

    prevFacing = facing;

    let boost = speedBoostT > 0 ? 1.6 : 1; speedBoostT = Math.max(0, speedBoostT - dt);
    const onIce = grounded && groundC && groundC.type === 'ice';

      // 벽면을 따라 옆으로는 움직일 수 있음
      const lat = { x:-climbing.nz, z:climbing.nx }, lv = moving ? (moveDir.x*lat.x + moveDir.z*lat.z) : 0;
      curSpeed.x = lat.x * lv * WALK_SPEED * 0.45 - climbing.nx * 0.6; curSpeed.y = lat.z * lv * WALK_SPEED * 0.45 - climbing.nz * 0.6;
      const prevY = pos.y; let ny = pos.y + velY*dt;
      const ceil = findCeiling(prevY, ny, pos.x, pos.z); if (ceil){ ny = ceil.minY - CHAR_HEIGHT; velY = 0; }
      pos.y = ny; pos.x += curSpeed.x*dt; pos.z += curSpeed.y*dt; resolveWalls(pos);

      if (grounded && groundC && groundC.type === 'conveyor' && groundC.dir){ pos.x += groundC.dir.x*groundC.dir.s*dt; pos.z += groundC.dir.z*groundC.dir.s*dt; }
    }
    { const kd = Math.exp(-6*dt); kb.x *= kd; kb.z *= kd; }
    // 킬파트는 어느 면이든 닿으면 즉사 · 데미지 파트는 닿으면 체력 감소
    for (const c of NC){ if (c.type==='kill' && c.touch !== false && !c.disabled && yOverlap(pos.y, c) && obbMTV(pos.x,pos.z,facing,c,0.05)){ hitFlash(); onKill(); break; } }
    if (iframe <= 0) for (const c of NC){ if (c.type==='damage' && !c.disabled && yOverlap(pos.y, c) && obbMTV(pos.x,pos.z,facing,c,0.05)){ hurt(c.dmg||20, pos.x-(c.minX+c.maxX)/2, pos.z-(c.minZ+c.maxZ)/2, 12); break; } }
    fallCheck();

    // 코요테 / 점프 버퍼 / 홀드 점프
    if (grounded) coyote = COYOTE; else coyote = Math.max(0, coyote - dt);
    jumpBuffer = Math.max(0, jumpBuffer - dt);
    if (grounded && !finished && (jumpHeld || jumpBuffer > 0)){ velY = JUMP_VEL; grounded = false; jumpBuffer = 0; coyote = 0; sfx.jump(); }

    // 캐릭터 표시
    if (flickSpin > 0){ flickSpin = Math.max(0, flickSpin - dt*10); }
    character.position.set(pos.x, pos.y, pos.z); character.rotation.y = facing + Math.sin(flickSpin*Math.PI/1.6)*1.2;
    shadowBlob.position.set(pos.x, pos.y + 0.02 - (grounded ? 0 : 0.02), pos.z); shadowBlob.visible = grounded;
    const sm = Math.hypot(curSpeed.x, curSpeed.y), L = limbs;
    let st = '대기';
    if (L.legL){
      if (climbing){ walkT += dt*(velY>0?9:0); const s=Math.sin(walkT)*0.7; L.armL.rotation.x=-2.4+s; L.armR.rotation.x=-2.4-s; L.legL.rotation.x=-0.4-s*.5; L.legR.rotation.x=-0.4+s*.5; st='🧗 오르는 중'; }
      else if (sm > 0.4 && grounded){ walkT += dt*(6.5*sm/WALK_SPEED+2.5); const s=Math.sin(walkT)*(0.55+sm/WALK_SPEED*.35); L.armL.rotation.x=s; L.armR.rotation.x=-s; L.legL.rotation.x=-s; L.legR.rotation.x=s; st = groundC && groundC.type==='ice' ? '🧊 미끄러지는 중' : '걷는 중'; }
      else if (!grounded){ const f=Math.min(1,Math.abs(velY)/20); L.armL.rotation.x=L.armR.rotation.x = velY>2 ? -0.25 : -0.25-f*.75; L.legL.rotation.x=velY>2?0.35:0.1; L.legR.rotation.x=velY>2?0.35:-0.1; st = velY>2?'점프!':'낙하 중'; }
      else { for (const k of ['armL','armR','legL','legR']) L[k].rotation.x *= 0.85; }
    }
    if (speedBoostT > 0) st = '⚡ 스피드 ' + speedBoostT.toFixed(1) + 's';

    // 카메라
    const sh = shiftLock ? 1.1 : 0;   // 시프트 락: 카메라가 오른쪽 어깨 너머로
    const piv = new THREE.Vector3(pos.x + right.x*sh, pos.y+2.2, pos.z + right.z*sh);
    const cd = new THREE.Vector3(-Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), -Math.cos(camYaw)*Math.cos(camPitch));
    const rc = new THREE.Raycaster(piv, cd, 0, camDist+0.5); const hits = rc.intersectObjects(meshes, false);
    const eff = hits.length ? Math.max(1.2, hits[0].distance-0.4) : camDist;
    camera.position.copy(piv).addScaledVector(cd, eff); camera.lookAt(piv.x, pos.y+2, piv.z); sky.position.copy(camera.position);
    sun.position.set(pos.x+30, pos.y+60, pos.z+20); sun.target.position.set(pos.x, pos.y, pos.z); sun.target.updateMatrixWorld();

    if (mpOn){ mpT -= dt; if (mpT <= 0){ mpT = 0.08; MP.update({ x:pos.x, y:pos.y, z:pos.z, ry:facing, b:best, rs:roomStart }); } }
    for (const u in ghosts){ const gh=ghosts[u], k=Math.min(1,10*dt); gh.g.position.x+=(gh.t.x-gh.g.position.x)*k; gh.g.position.y+=(gh.t.y-gh.g.position.y)*k; gh.g.position.z+=(gh.t.z-gh.g.position.z)*k; let d=gh.t.ry-gh.ry; d=Math.atan2(Math.sin(d),Math.cos(d)); gh.ry+=d*k; gh.g.rotation.y=gh.ry; }

    gameFrame(dt); updateConfetti(dt);
  }
  function onLand(L){
    if (L.type === 'bounce'){ velY = JUMP_VEL * 1.55; grounded = false; sfx.bounce(); }
    if (L.type === 'speed'){ speedBoostT = 3; }
    if (L.type === 'kill'){ hitFlash(); onKill(); }
    if (L.type === 'damage') hurt(L.dmg||20, pos.x-(L.minX+L.maxX)/2, pos.z-(L.minZ+L.maxZ)/2, 16);
    if (L.type === 'crumble'){ const cr = crumbles.find(c=>c.c===L); if (cr && cr.state==='idle') cr.state='stepped'; }
    if (L.type === 'finish' && !finished){
      finished = true; const t = performance.now()-startTime;
      $('finishTime').textContent = '클리어 기록 ' + fmt(t);
      best = FLOORS; lsSet(BEST_KEY, String(best)); updateStageTag();
      let reward = '🔷 100 샤드 획득!';
      addShards(100);
      try { if (!localStorage.getItem('protower_cleared')){ localStorage.setItem('protower_cleared','1'); addShards(300); reward = '첫 정복 보상 🔷 400 샤드 획득!'; } } catch(e){}
      try { if (window.MP && MP.addXP) MP.addXP(600); if (window.MP && MP.submitScore) MP.submitScore('protower', Math.round(t), 'asc'); } catch(e){}
      $('finishReward').textContent = reward; sfx.win();
      for (let i=0;i<70;i++){ const m = new THREE.Mesh(new THREE.PlaneGeometry(.18,.28), new THREE.MeshBasicMaterial({ color:FLOOR_COLORS[i%8], side:THREE.DoubleSide }));
        m.position.set(pos.x + (Math.random()-.5)*3, pos.y + 3, pos.z + (Math.random()-.5)*3); scene.add(m); confetti.push({ m, v:new THREE.Vector3((Math.random()-.5)*6, 4+Math.random()*5, (Math.random()-.5)*6), life:2.4 }); }
      setTimeout(()=>$('finishOverlay').classList.add('show'), 700);
    }
  }
  animate();
  window.__OB = { nearSeam, get seamTouchT(){return seamTouchT;}, die, get deadT(){return deadT;}, floors, gems, get hp(){return hp;}, hurt, get TOWER_TOP(){return TOWER_TOP;}, buildBuckets, floors2:floors, buildTower, get round(){return round;}, TIERS, get cp(){return cpIdx;}, moveVec, step(n, dt=1/60){ for (let i=0;i<n;i++) frame(dt); }, pause(v){ simPaused=v; }, pos, get facing(){return facing;}, set facing(v){facing=v;}, colliders, get climbing(){return climbing;}, get grounded(){return grounded;}, get cpIdx(){return cpIdx;}, respawn, keys, setShiftLock, onJumpPress, onJumpRelease, doFlick, get velY(){return velY;}, set velY(v){velY=v;}, set rawYaw(v){rawYaw=v;}, get rawYaw(){return rawYaw;} };
})();
